<!DOCTYPE html>
<html lang="en">
<head>

<title>Epistemology — Bilingual Node Explorer</title>

<script>
(()=>{
  let preference="system";
  try{preference=localStorage.getItem("epistemology-theme")||"system";}catch(_){/* storage may be unavailable */}
  if(!["system","light","dark"].includes(preference))preference="system";
  const dark=preference==="dark"||(preference==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.documentElement.dataset.themePreference=preference;
})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#081821; --panel:#142B3D; --panel2:#1D3A4E; --rule:#62859A;
  --cyan:#9BD8E8; --paper:#F5F8FA; --dim:#AEBFCA; --brass:#F2B84B; --brick:#FF9187;
  --on-accent:#14202A; --grid:rgba(98,133,154,.14); --scrim:rgba(3,12,17,.72); --top-fade:rgba(8,24,33,0);
  --search-bg:rgba(8,24,33,.985); --accent-wash:rgba(242,184,75,.10);
  --accent-shadow:rgba(242,184,75,.22);
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --fa:'Vazirmatn',system-ui,sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F3EC; --panel:#FFFFFF; --panel2:#E9F0F3; --rule:#6B8594;
  --cyan:#0B6075; --paper:#15232C; --dim:#4A616D; --brass:#8A4F00; --brick:#9D3E35;
  --on-accent:#FFFAF0; --grid:rgba(74,97,109,.12); --scrim:rgba(21,35,44,.52); --top-fade:rgba(246,243,236,0);
  --search-bg:rgba(246,243,236,.985); --accent-wash:rgba(138,79,0,.08);
  --accent-shadow:rgba(138,79,0,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--paper);font-family:var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;transition:background-color .18s ease,color .18s ease}

button,input{font:inherit}
button:focus-visible,input:focus-visible,[role="button"]:focus-visible{
  outline:3px solid var(--brass);outline-offset:3px
}

#top{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(var(--bg) 70%,var(--top-fade));padding:10px 12px 18px}
.brow{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--brass)}
.icb{background:var(--panel);border:1px solid var(--rule);color:var(--cyan);font-family:var(--mono);
  font-size:11px;width:44px;height:44px;padding:0;cursor:pointer;letter-spacing:.06em}
.icb:active{background:var(--panel2)}
#crumbs{display:flex;gap:4px;overflow-x:auto;margin-top:9px;padding-bottom:3px;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:4px 8px;
  border:1px solid var(--rule);background:var(--panel);color:var(--dim);cursor:pointer;white-space:nowrap}
body.fa .crumb{font-family:var(--fa);font-size:11px;letter-spacing:0}
.crumb.on{border-color:var(--brass);color:var(--brass)}
.crumb.sep{border:none;background:none;color:var(--rule);padding:4px 1px}

#view{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#view.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.node{position:absolute;width:172px;height:48px;display:flex;background:var(--panel);
  border:1px solid var(--rule);cursor:pointer}
.node .lab{flex:1;min-width:0;display:flex;align-items:center;padding:0 8px;font-family:var(--disp);
  font-size:11.5px;line-height:1.2;background:transparent;border:0;color:inherit;text-align:left;cursor:pointer}
body.fa .node .lab{font-family:var(--fa);font-size:11.5px;line-height:1.45;justify-content:flex-end;text-align:right}
.node .lab i{font-style:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .info{flex:none;width:38px;border:0;border-left:1px solid var(--rule);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:12px;color:var(--cyan);background:transparent;cursor:pointer}
.node .info:active{background:var(--panel2)}
.node.route{border-color:var(--cyan)}
.node.sel{border-color:var(--brass);background:var(--panel2);box-shadow:0 0 0 3px var(--accent-shadow)}
.node.sel .lab{color:var(--brass)}
.node.key{border-style:dashed;border-color:var(--brass)}
.node .kids{position:absolute;right:-1px;bottom:-1px;font-family:var(--mono);font-size:8.5px;color:var(--dim);
  background:var(--bg);padding:0 3px;line-height:1.4;border:1px solid var(--rule)}
.node.open .kids{color:var(--cyan)}
.node .full{position:absolute;left:-1px;bottom:-1px;width:5px;height:5px;background:var(--brass)}

#ctrl{position:fixed;right:12px;bottom:16px;z-index:25;display:flex;flex-direction:column;gap:6px}
#ctrl button{width:44px;height:44px;background:var(--panel);border:1px solid var(--rule);color:var(--cyan);
  font-family:var(--mono);font-size:12px;cursor:pointer}
#ctrl button:active{background:var(--panel2)}
#hint{position:fixed;left:12px;bottom:18px;z-index:20;font-family:var(--mono);font-size:9.5px;
  color:var(--dim);max-width:52vw;line-height:1.55;pointer-events:none;transition:opacity 1s}
body.fa #hint{font-family:var(--fa);font-size:10.5px;direction:rtl}

#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;background:var(--bg);
  border-top:1px solid var(--brass);transform:translateY(101%);
  transition:transform .26s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column}
#sheet.on{transform:none}
@media(min-width:820px){
  #sheet{left:auto;right:0;top:0;bottom:0;width:460px;max-height:none;border-top:none;
    border-left:1px solid var(--brass);transform:translateX(101%)}
  #sheet.on{transform:none}
}
.shead{padding:15px 18px 13px;border-bottom:1px solid var(--rule);flex:none;position:relative}
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--cyan);margin-bottom:8px;
  line-height:1.6;padding-right:156px}
.shead h2{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.15;margin:0;letter-spacing:-.012em;padding-right:156px}
.who{font-family:var(--mono);font-size:11px;color:var(--brass);margin-top:9px;line-height:1.55}
.hbtns{position:absolute;top:13px;right:16px;display:flex;gap:6px}
.hbtns button{background:none;border:1px solid var(--rule);color:var(--dim);
  font-family:var(--mono);font-size:11px;height:28px;padding:0 8px;cursor:pointer}
.sbody{overflow-y:auto;padding:2px 18px 30px;-webkit-overflow-scrolling:touch}

/* Farsi reading mode */
body.fa .shead h2{font-family:var(--fa);font-size:20px;line-height:1.5;direction:rtl;padding-right:0;padding-left:156px;text-align:right}
body.fa .kicker{direction:rtl;text-align:right;padding-right:0;padding-left:156px;font-family:var(--fa);letter-spacing:0}
body.fa .who{direction:rtl;text-align:right;font-family:var(--fa)}
body.fa .hbtns{right:auto;left:16px}
body.fa .sbody{direction:rtl;text-align:right}
body.fa .blk p{font-family:var(--fa);font-size:15px;line-height:2.0}
body.fa .blk .h{font-family:var(--fa);letter-spacing:0;font-size:11px}
body.fa .blk.obj,body.fa .blk.app{border-left:none;border-right:2px solid var(--brick);padding-left:0;padding-right:13px}
body.fa .blk.app{border-right-color:var(--brass)}
body.fa .chip{font-family:var(--fa);font-size:11.5px;letter-spacing:0}
body.fa .learn a{font-family:var(--fa);font-size:12.5px}

.blk{margin-top:17px}
.blk .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--dim);margin-bottom:6px}
.blk p{margin:0 0 11px;font-size:15.5px;line-height:1.62;color:var(--paper)}
.blk p:last-child{margin-bottom:0}
.blk p b{color:var(--cyan);font-weight:600}
body.fa .blk p b{color:var(--cyan)}
.blk.obj{border-left:2px solid var(--brick);padding-left:13px}
.blk.obj .h{color:var(--brick)}
.blk.app{border-left:2px solid var(--brass);padding-left:13px}
.blk.app .h{color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:10.5px;padding:6px 9px;border:1px solid var(--rule);
  background:var(--panel);color:var(--cyan);cursor:pointer;line-height:1.35}
.chip:active{background:var(--panel2)}
.chip.kid{color:var(--paper);border-color:var(--dim)}
.learn{margin-top:20px;border-top:1px solid var(--rule);padding-top:15px}
.learn a{display:block;font-family:var(--mono);font-size:11.5px;color:var(--cyan);text-decoration:none;
  border:1px solid var(--rule);background:var(--panel);padding:10px 12px;margin-bottom:6px;line-height:1.45}
.learn a:active{background:var(--panel2)}
.learn a b{display:block;color:var(--brass);font-weight:500;margin-bottom:2px}

#find{position:fixed;inset:0;z-index:50;background:var(--search-bg);display:none;flex-direction:column;padding:14px}
#find.on{display:flex}
#q{width:100%;background:var(--panel);border:1px solid var(--brass);color:var(--paper);
  font-family:var(--disp);font-size:16px;padding:12px;outline:none}
body.fa #q{font-family:var(--fa);direction:rtl;text-align:right}
#res{margin-top:10px;overflow-y:auto;flex:1}
.hit{padding:11px 12px;border:1px solid var(--rule);background:var(--panel);margin-bottom:6px;cursor:pointer}
.hit b{font-family:var(--disp);font-size:14px;display:block;margin-bottom:3px;font-weight:500}
body.fa .hit{direction:rtl;text-align:right}
body.fa .hit b{font-family:var(--fa);font-size:14.5px}
.hit small{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.05em;line-height:1.5}
body.fa .hit small{font-family:var(--fa);letter-spacing:0}
</style>
</head>
<body>

<div id="top">
  <div class="brow">
    <div class="brand">EPISTEMOLOGY <span>/ explorer</span></div>
    <button class="icb" id="searchbtn" type="button" aria-label="Search concepts" title="Search concepts">⌕</button>
    <button class="icb" id="themebtn" type="button" aria-live="polite"><span aria-hidden="true">◐</span></button>
    <div id="langseg" role="group" aria-label="Language">
      <button data-lang="en" type="button" aria-label="Read in English">EN</button>
      <button data-lang="fa" type="button" aria-label="مطالعه به فارسی">فا</button>
    </div>
  </div>
  <div id="crumbs"></div>
</div>

<div id="view"><div id="world"><svg id="wires"></svg></div></div>

<div id="ctrl" role="group" aria-label="Map controls">
  <button id="zin" type="button" aria-label="Zoom in" title="Zoom in">+</button>
  <button id="zout" type="button" aria-label="Zoom out" title="Zoom out">−</button>
  <button id="fit" type="button" aria-label="Fit map to screen" title="Fit map to screen">⤢</button>
  <button id="rst" type="button" aria-label="Reset map" title="Reset map">↺</button>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="shead">
    <div class="kicker" id="s-kick"></div>
    <h2 id="s-title"></h2>
    <div class="who" id="s-who"></div>
    <div class="hbtns"><div id="sheetlang" role="group" aria-label="Language"><button data-lang="en" type="button" aria-label="Read in English">EN</button><button data-lang="fa" type="button" aria-label="مطالعه به فارسی">فا</button></div><button id="close" type="button" aria-label="Close entry" title="Close entry">✕</button></div>
  </div>

</div>

</div>

<script>
/* t/tf title · en/fa wiki prose · xe/xf example · pe/pf application · oe/of objection
   w who · q search terms · k cross-links · c children · L long-form flag */
const N={
root:{L:1,t:"EPISTEMOLOGY",tf:"معرفت‌شناسی",w:"Greek: episteme (knowledge) + logos (account)",q:"epistemology",
en:"<p>Epistemology is the study of knowledge itself. Not what we know, but what knowing <b>is</b> — what conditions a belief must satisfy before it counts as knowledge, where beliefs legitimately come from, how they support one another, and how far they can reach.</p><p>The field has an unusual property: you cannot step outside it. Any argument that epistemology is unimportant is itself an epistemic argument, resting on some standard of evidence. This is why it sits underneath every other discipline rather than beside them.</p><p>The map below has twelve branches. They are not twelve topics so much as twelve angles on one question: <b>what entitles you to believe what you believe?</b></p>",
fa:"<p>معرفت‌شناسی مطالعهٔ خودِ «دانستن» است؛ نه اینکه چه می‌دانیم، بلکه اینکه دانستن <b>چیست</b> — یک باور چه شرایطی باید داشته باشد تا معرفت شمرده شود، باورها از کجا می‌آیند، چگونه یکدیگر را پشتیبانی می‌کنند و تا کجا می‌توانند پیش بروند.</p><p>این رشته ویژگی غریبی دارد: نمی‌توان از آن بیرون ایستاد. هر استدلالی که بگوید معرفت‌شناسی مهم نیست، خودش یک استدلال معرفتی است و بر معیاری از شواهد تکیه دارد. به همین دلیل معرفت‌شناسی زیرِ سایر رشته‌ها قرار می‌گیرد، نه کنارِ آن‌ها.</p><p>نقشهٔ پیش رو دوازده شاخه دارد. این‌ها دوازده موضوع جدا نیستند، بلکه دوازده زاویهٔ نگاه به یک پرسش‌اند: <b>چه چیزی به شما حق می‌دهد آنچه را باور دارید باور کنید؟</b></p>",
xe:"Every time you ask someone “how do you know that?”, you are doing epistemology — you are asking them to expose the structure underneath a claim.",
xf:"هر بار که از کسی می‌پرسید «از کجا می‌دانی؟»، در حال انجام معرفت‌شناسی هستید؛ از او می‌خواهید ساختار زیرِ یک ادعا را آشکار کند.",
pe:"Every evidentiary standard, every audit procedure, and every regulatory finding of fact is an epistemology that somebody wrote down and then stopped examining.",
pf:"هر استاندارد اثباتی، هر رویهٔ حسابرسی و هر «یافتهٔ واقع» در مقررات، در حقیقت یک معرفت‌شناسی است که کسی آن را نوشته و سپس از بازبینی‌اش دست کشیده است.",
c:["trilemma","know","truth","sources","skep","formal","phsci","social","natur","virtue","logic","relig"]},

trilemma:{L:1,t:"The Münchhausen Trilemma",tf:"سه‌راهیِ مونش‌هاوزن",w:"Hans Albert, 1968; ancient version in Sextus Empiricus as the modes of Agrippa",q:"regress problem justification foundationalism",
en:"<p>Ask “why do you believe that?” and you get a reason. Ask again and you get another. Keep going and, no matter who you are asking or what the subject is, the chain terminates in exactly one of three ways.</p><p>It can <b>run forever</b>, each reason needing a further reason. It can <b>bend back on itself</b> and rest on something it was supposed to be supporting. Or you can <b>simply stop</b> at an assumption and decline to justify it further. Hans Albert named this after Baron Münchhausen, who claimed to have pulled himself out of a swamp by his own hair.</p><p>There is no fourth option. This is why epistemology exists as a field rather than as a settled body of technique: every major school is a decision about which of the three failures to accept and then defend as not really a failure.</p>",
fa:"<p>بپرسید «چرا این را باور داری؟» و دلیلی می‌شنوید. دوباره بپرسید، دلیلی دیگر. اگر ادامه دهید — فرقی نمی‌کند از چه کسی و دربارهٔ چه موضوعی — این زنجیره دقیقاً به یکی از سه صورت پایان می‌یابد.</p><p>می‌تواند <b>تا بی‌نهایت ادامه یابد</b>، چون هر دلیل خود دلیلی می‌طلبد. می‌تواند <b>به خودش بازگردد</b> و بر چیزی تکیه کند که قرار بود آن را اثبات کند. یا می‌توانید <b>همان‌جا بایستید</b>، فرضی را بپذیرید و از توجیه بیشترش سر باز زنید. هانس آلبرت این را به نام بارون مونش‌هاوزن نامید که ادعا می‌کرد خود را با کشیدنِ موهای خویش از باتلاق بیرون کشیده است.</p><p>گزینهٔ چهارمی وجود ندارد. به همین دلیل معرفت‌شناسی یک رشتهٔ زنده است نه مجموعه‌ای از فنون حل‌شده: هر مکتب بزرگ در واقع تصمیمی است دربارهٔ اینکه کدام‌یک از این سه شکست را بپذیریم و سپس نشان دهیم که شکست نیست.</p>",
xe:"Why is this rule justified? Because it reduces harm. Why does reducing harm justify a rule? Because… and now you are on one of the three horns.",
xf:"چرا این قاعده موجه است؟ چون آسیب را کم می‌کند. چرا کم‌کردن آسیب یک قاعده را موجه می‌سازد؟ چون… و اکنون شما روی یکی از آن سه شاخ ایستاده‌اید.",
pe:"Every model you build rests on axioms nobody derived. That is the third horn, adopted deliberately — and that is fine. The question is never whether there are undefended assumptions but whether yours are declared, load-bearing, and stress-tested.",
pf:"هر مدلی که می‌سازید بر اصولی موضوعه استوار است که کسی آن‌ها را استنتاج نکرده. این همان شاخ سوم است که آگاهانه پذیرفته شده — و اشکالی ندارد. پرسش هرگز این نیست که «آیا فرض بی‌دلیل وجود دارد؟» بلکه این است که آیا فرض‌های شما اعلام شده‌اند، بار می‌کِشند و آزموده شده‌اند؟",
oe:"The trilemma assumes justificationism — that beliefs need justification at all. Popper and Albert both reject that premise, which is the fourth escape rather than a fourth horn.",
of:"سه‌راهی، «توجیه‌گرایی» را مفروض می‌گیرد؛ یعنی این ایده که باورها اصلاً به توجیه نیاز دارند. پوپر و آلبرت هر دو همین مقدمه را رد می‌کنند — که راه گریز چهارم است، نه شاخ چهارم.",
k:["criterion","popper"],c:["infin","coher","found","hinge","critrat","criterion"]},

infin:{L:1,t:"Infinitism",tf:"تسلسل‌گرایی",w:"Peter Klein",q:"infinitism epistemic regress Klein",
en:"<p>Take the first horn and refuse to be embarrassed by it. Infinitism holds that an endless chain of reasons is not a defect. Justification comes in degrees, and each further reason in the chain adds a little more of it.</p><p>The position is a minority one but it does useful work: it blocks the reflex of treating the regress as obviously fatal and rushing straight into foundationalism. If the regress is survivable, then the argument for foundations has to be made rather than assumed.</p>",
fa:"<p>شاخ نخست را بپذیرید و از آن شرمنده نباشید. تسلسل‌گرایی می‌گوید زنجیرهٔ بی‌پایان دلایل نقص نیست. توجیه امری درجه‌دار است و هر دلیل تازه در زنجیره اندکی بر آن می‌افزاید.</p><p>این موضع در اقلیت است اما کار مفیدی می‌کند: جلوی این واکنش خودکار را می‌گیرد که تسلسل را بدیهی‌الفساد بدانیم و بی‌درنگ به مبناگرایی پناه ببریم. اگر تسلسل قابل تحمل باشد، آنگاه استدلال به سود مبناها باید <b>ارائه</b> شود، نه فرض.</p>",
xe:"There is always a further reason available, even if no finite person ever states them all.",
xf:"همیشه دلیل دیگری در دسترس هست، حتی اگر هیچ انسان متناهی همهٔ آن‌ها را بیان نکند.",
pe:"Useful mainly as a check on lazy argument: “that leads to an infinite regress” is not by itself a refutation.",
pf:"بیشتر به‌کار نقدِ استدلال‌های شتاب‌زده می‌آید: جملهٔ «این به تسلسل می‌انجامد» به‌تنهایی ابطال نیست.",
oe:"Finite minds cannot hold infinite chains, so it is hard to see how anyone is ever actually justified in practice.",
of:"ذهن متناهی نمی‌تواند زنجیرهٔ نامتناهی را در خود جای دهد؛ پس دشوار است بفهمیم در عمل چه کسی واقعاً موجه است.",c:[]},

coher:{L:1,t:"Coherentism",tf:"انسجام‌گرایی",w:"BonJour · Quine's web of belief · Neurath",q:"coherentism justification web of belief",
en:"<p>Take the second horn, but widen the circle until it stops looking like a circle. Coherentism denies that beliefs form a chain resting on a base at all. They form a <b>web</b>, and what justifies any strand is how well the whole structure hangs together — its consistency, its mutual support, its explanatory fit.</p><p>Neurath's image is the standard one: we are sailors who must rebuild the ship plank by plank while at sea, never able to put it in dry dock and start from bare timber. There is no outside vantage point, only the ongoing work of making the structure hold.</p>",
fa:"<p>شاخ دوم را بپذیرید، اما دایره را چنان بزرگ کنید که دیگر شبیه دور نباشد. انسجام‌گرایی اساساً منکر آن است که باورها زنجیره‌ای بر یک پایه باشند. آن‌ها یک <b>شبکه</b> می‌سازند و آنچه هر رشته را موجه می‌کند، میزان به‌هم‌پیوستگیِ کل ساختار است: سازگاری، پشتیبانی متقابل و تناسب تبیینی.</p><p>تصویر نویرات معروف است: ما ملوانانی هستیم که باید کشتی را تخته‌به‌تخته در میان دریا بازسازی کنیم و هرگز نمی‌توانیم آن را به خشکی ببریم و از چوب خام آغاز کنیم. نقطهٔ نظرِ بیرونی وجود ندارد؛ تنها کارِ پیوستهٔ نگه‌داشتنِ ساختار هست.</p>",
xe:"No single study in a mature empirical literature is foundational. The credibility lives in how the results fit each other.",
xf:"در یک ادبیات تجربیِ پخته، هیچ پژوهش منفردی بنیادی نیست. اعتبار در نحوهٔ جفت‌شدن نتایج با یکدیگر نهفته است.",
pe:"This is how a body of evidence actually earns trust. It also tells you where such a body is fragile: if the strands are not independent, the web is one strand wearing many names.",
pf:"اعتماد به یک مجموعهٔ شواهد در عمل این‌گونه ساخته می‌شود. همچنین نقطهٔ ضعف را نشان می‌دهد: اگر رشته‌ها مستقل نباشند، شبکه در واقع یک رشته است با نام‌های گوناگون.",
oe:"Fiction can be perfectly coherent. Coherence alone does not guarantee contact with reality.",
of:"یک داستان می‌تواند کاملاً منسجم باشد. انسجام به‌تنهایی تماس با واقعیت را تضمین نمی‌کند.",
k:["duhem","cascade"],c:[]},

found:{L:1,t:"Foundationalism",tf:"مبناگرایی",w:"Descartes · Chisholm · Plantinga",q:"foundationalism basic beliefs justification",
en:"<p>Take the third horn, and argue that the stop is not arbitrary. Foundationalism divides beliefs into a foundation and a superstructure. Foundational — or <b>properly basic</b> — beliefs are justified without resting on any further belief; everything else is justified by its relation to them.</p><p>The whole dispute then moves to one question: what qualifies a belief as basic? Classical answers appeal to some epistemic privilege — the belief is infallible, indubitable, or incorrigible. Modern answers are more modest, allowing perceptual experience itself to justify a belief about the world without a further belief intervening.</p>",
fa:"<p>شاخ سوم را بپذیرید و استدلال کنید که این توقف دلبخواهی نیست. مبناگرایی باورها را به «پایه» و «روبنا» تقسیم می‌کند. باورهای پایه — یا <b>به‌درستی پایه</b> — بدون تکیه بر باوری دیگر موجه‌اند و بقیه از راه نسبتشان با آن‌ها توجیه می‌شوند.</p><p>آنگاه تمام نزاع به یک پرسش منتقل می‌شود: چه چیزی یک باور را «پایه» می‌کند؟ پاسخ‌های کلاسیک به نوعی امتیاز معرفتی متوسل می‌شوند: خطاناپذیری، تردیدناپذیری یا اصلاح‌ناپذیری. پاسخ‌های امروزی متواضع‌ترند و اجازه می‌دهند خودِ تجربهٔ ادراکی، بدون میانجیِ باوری دیگر، باوری دربارهٔ جهان را موجه سازد.</p>",
xe:"“I am in pain” does not rest on any further belief. You do not infer it; you are simply in a position to assert it.",
xf:"«من درد دارم» بر هیچ باور دیگری تکیه ندارد. آن را استنتاج نمی‌کنید؛ صرفاً در موقعیتی هستید که می‌توانید بگویید.",
pe:"The axiomatic method in economics and mathematics is foundationalism made procedural. Naming it that way makes the real question visible: not whether to have axioms, but which ones and why those.",
pf:"روش اصل‌موضوعی در اقتصاد و ریاضیات، همان مبناگرایی است که به رویه تبدیل شده. نام‌گذاریِ درست، پرسش اصلی را آشکار می‌کند: نه اینکه «اصل موضوعه داشته باشیم یا نه»، بلکه «کدام‌ها و چرا آن‌ها».",
oe:"Which beliefs qualify as basic, and on what non-arbitrary grounds is that list drawn rather than another?",
of:"کدام باورها پایه‌اند و بر چه اساسِ غیردلبخواهی این فهرست انتخاب شده و نه فهرستی دیگر؟",
k:["basicality","reformed"],c:[]},

hinge:{L:1,t:"Hinge epistemology",tf:"معرفت‌شناسیِ لولا",w:"Wittgenstein, On Certainty · Duncan Pritchard",q:"hinge propositions Wittgenstein On Certainty",
en:"<p>Refuse the framing rather than pick a horn. Wittgenstein's late notebooks argue that some propositions are neither justified nor unjustified. They are the <b>hinges</b> on which the door of inquiry turns — the things that must stay fixed for doubting and checking to be possible at all.</p><p>Asking what justifies a hinge is a kind of grammatical mistake, like asking what justifies your headache. The hinge is not a very well-supported claim; it is not in the support business.</p><p>Duncan Pritchard has developed this into a systematic response to scepticism, and it applies to secular bedrock commitments as much as to religious ones.</p>",
fa:"<p>به‌جای انتخاب یک شاخ، صورت‌مسئله را رد کنید. یادداشت‌های متأخر ویتگنشتاین می‌گویند برخی گزاره‌ها نه موجه‌اند و نه ناموجه. آن‌ها <b>لولاهایی</b> هستند که درِ پژوهش بر آن‌ها می‌چرخد؛ چیزهایی که باید ثابت بمانند تا اصلاً شک‌کردن و آزمودن ممکن شود.</p><p>پرسیدن اینکه چه چیزی یک لولا را توجیه می‌کند، نوعی خطای دستوری است؛ مثل اینکه بپرسیم چه چیزی سردردِ شما را توجیه می‌کند. لولا ادعایی بسیار خوب‌پشتیبانی‌شده نیست؛ اصلاً در کارِ پشتیبانی نیست.</p><p>دانکن پریچارد این را به پاسخی نظام‌مند در برابر شکاکیت بدل کرده، و به همان اندازه که به تعهدات دینی مربوط است، به تعهدات بنیادینِ سکولار نیز مربوط می‌شود.</p>",
xe:"“The world existed before I was born.” You cannot produce evidence for it without already relying on it.",
xf:"«جهان پیش از تولد من وجود داشت.» نمی‌توانید برای آن شاهدی بیاورید بی‌آنکه از پیش بر آن تکیه کرده باشید.",
pe:"Explains why certain disagreements cannot be settled by evidence: the parties are running different hinges, not weighing the same evidence differently. Recognising that saves you from an unwinnable argument.",
pf:"توضیح می‌دهد چرا برخی اختلاف‌ها با شواهد حل نمی‌شوند: طرفین لولاهای متفاوتی دارند، نه اینکه شواهد یکسان را متفاوت وزن کنند. تشخیص این نکته شما را از بحثی بی‌فرجام نجات می‌دهد.",
oe:"How do you distinguish a genuine hinge from a prejudice you have simply decided not to examine?",
of:"چگونه لولای اصیل را از پیش‌داوری‌ای که صرفاً تصمیم گرفته‌اید بررسی‌اش نکنید تشخیص می‌دهید؟",
k:["fideism","cartes"],c:[]},

critrat:{L:1,t:"Critical rationalism",tf:"عقل‌گراییِ نقدی",w:"Karl Popper · Hans Albert",q:"critical rationalism Popper Albert justification",
en:"<p>The other refusal. Albert's conclusion from the trilemma is not that we should pick the least bad horn but that the demand for justification was misconceived from the start. Give it up entirely.</p><p>What replaces it is <b>criticism</b>. You can never show that a theory is supported; you can only expose it to serious attempts to break it and observe that it has not broken yet. Knowledge grows not by accumulating proof but by eliminating error.</p><p>This is the connection most syllabi miss: the trilemma is the argument <b>for</b> falsifiability. Albert built it as a weapon for Popper's programme, not as a curiosity in the theory of justification.</p>",
fa:"<p>راه گریز دوم. نتیجه‌ای که آلبرت از سه‌راهی می‌گیرد این نیست که کم‌بدترین شاخ را برگزینیم، بلکه این است که خودِ مطالبهٔ توجیه از آغاز نادرست بوده. آن را یکسره رها کنید.</p><p>آنچه جایش را می‌گیرد <b>نقد</b> است. هرگز نمی‌توانید نشان دهید نظریه‌ای پشتیبانی شده؛ تنها می‌توانید آن را در معرض کوشش‌های جدی برای شکستن قرار دهید و ببینید که هنوز نشکسته است. دانش نه با انباشتِ اثبات، بلکه با حذفِ خطا رشد می‌کند.</p><p>این همان پیوندی است که بیشتر سرفصل‌ها از قلم می‌اندازند: سه‌راهی، استدلال <b>به سود</b> ابطال‌پذیری است. آلبرت آن را به‌عنوان سلاحی برای برنامهٔ پوپر ساخت، نه به‌عنوان کنجکاوی‌ای در نظریهٔ توجیه.</p>",
xe:"No number of white swans justifies “all swans are white”. A single black swan settles it. The asymmetry is the whole method.",
xf:"هیچ شمار از قوهای سفید «همهٔ قوها سفیدند» را توجیه نمی‌کند. یک قوی سیاه کار را تمام می‌کند. تمام روش، در همین عدم‌تقارن است.",
pe:"Changes what you ask of a claim. Not “what supports this?” — which invites an endless chain — but “what would break this, and has anyone seriously tried?”",
pf:"آنچه از یک ادعا می‌پرسید تغییر می‌کند. نه «چه چیزی این را پشتیبانی می‌کند؟» که به زنجیره‌ای بی‌پایان می‌انجامد، بلکه «چه چیزی آن را می‌شکند و آیا کسی جدی کوشیده است؟»",
oe:"Corroboration seems to give us some reason to rely on surviving theories — which looks like justification returning through the back door.",
of:"«تأییدِ آزمونی» ظاهراً دلیلی برای اتکا به نظریه‌های بازمانده به دست می‌دهد — و این یعنی توجیه از در پشتی بازگشته است.",
k:["popper","corrob"],c:[]},

criterion:{L:1,t:"The problem of the criterion",tf:"مسئلهٔ معیار",w:"Roderick Chisholm · Sextus Empiricus",q:"problem of the criterion particularism methodism",
en:"<p>A sibling of the trilemma, and in some ways sharper. To identify which of your beliefs count as knowledge, you need a criterion. To validate a criterion, you need some cases you already know to be knowledge. Each requires the other first.</p><p>Chisholm named the two escapes. <b>Particularism</b> starts from confident particular cases and derives the criterion from them. <b>Methodism</b> starts from a criterion and lets it decide the cases. Neither can justify its own starting point.</p>",
fa:"<p>خواهرِ سه‌راهی و از جهاتی برنده‌تر. برای اینکه بدانید کدام باورهایتان معرفت‌اند، به یک معیار نیاز دارید. برای اعتبارسنجیِ معیار، به مواردی نیاز دارید که از پیش می‌دانید معرفت‌اند. هر یک نیازمند دیگری است، آن هم اول.</p><p>چیزم دو راه گریز را نام‌گذاری کرد. <b>جزئی‌گرایی</b> از موارد جزئیِ مطمئن آغاز می‌کند و معیار را از آن‌ها بیرون می‌کشد. <b>روش‌گرایی</b> از معیار آغاز می‌کند و می‌گذارد معیار دربارهٔ موارد داوری کند. هیچ‌کدام نمی‌تواند نقطهٔ آغاز خود را توجیه کند.</p>",
xe:"How do you know the thermometer is accurate? Compare it against a known temperature. How do you know that temperature? You measured it.",
xf:"از کجا می‌دانید دماسنج دقیق است؟ آن را با دمایی معلوم بسنجید. آن دما را از کجا می‌دانید؟ اندازه‌اش گرفته‌اید.",
pe:"Every validation exercise has this shape. Naming it early stops you spending a month inside a circular audit, and forces the honest move: declare which cases you are treating as fixed.",
pf:"هر تمرینِ اعتبارسنجی همین شکل را دارد. نام‌گذاریِ زودهنگام مانع می‌شود یک ماه در حسابرسیِ دوری بگذرانید و شما را به حرکت صادقانه وامی‌دارد: اعلام کنید کدام موارد را ثابت گرفته‌اید.",c:[]},

know:{L:1,t:"What is knowledge?",tf:"معرفت چیست؟",w:"Plato's Theaetetus onward",q:"analysis of knowledge",
en:"<p>The analysis question. What must be true for “S knows that p” to be correct rather than merely lucky? For roughly two and a half thousand years the answer looked stable, and then it collapsed in three pages in 1963.</p><p>What makes this more than a parlour puzzle is the <b>luck</b> condition. We want a notion of knowing that excludes accidentally being right, because only the non-accidental kind is repeatable. A method that happens to produce the correct answer this time is worth nothing next time.</p>",
fa:"<p>پرسشِ تحلیل. چه چیزی باید صادق باشد تا «س می‌داند که پ» درست باشد و نه صرفاً خوش‌اقبالانه؟ حدود دو هزار و پانصد سال پاسخ پایدار به نظر می‌رسید و سپس در سال ۱۹۶۳ در سه صفحه فروریخت.</p><p>آنچه این را از یک معمای سرگرم‌کننده فراتر می‌برد، شرطِ <b>اقبال</b> است. ما مفهومی از دانستن می‌خواهیم که «تصادفاً درست‌بودن» را کنار بگذارد، چون تنها گونهٔ غیرتصادفی تکرارپذیر است. روشی که این‌بار اتفاقاً پاسخ درست داده، دفعهٔ بعد بی‌ارزش است.</p>",
xe:"A stopped clock reads 3:00. At exactly 3:00 you glance at it and believe it is 3:00. Your belief is true. Almost nobody wants to call it knowledge.",
xf:"ساعتی خوابیده ۳:۰۰ را نشان می‌دهد. دقیقاً ساعت ۳:۰۰ به آن نگاه می‌کنید و باور می‌کنید ۳:۰۰ است. باورتان صادق است. تقریباً هیچ‌کس نمی‌خواهد آن را معرفت بنامد.",
pe:"Underlies every legal standard of proof and every claim that an agency “found” something rather than guessed it.",
pf:"زیربنای هر استاندارد اثباتیِ حقوقی است و زیربنای هر ادعایی مبنی بر اینکه یک نهاد چیزی را «یافته» نه اینکه حدس زده باشد.",
c:["jtb","gettier","kinds","value","just"]},

jtb:{L:1,t:"Justified True Belief",tf:"باور صادقِ موجه",w:"Traced to Plato; the standard target of 20th-century epistemology",q:"justified true belief analysis knowledge",
en:"<p>The classical analysis, and still the working assumption almost everywhere outside philosophy. You know that p if and only if three conditions hold together: p is <b>true</b>, you <b>believe</b> p, and your belief is <b>justified</b>.</p><p>Each condition earns its place. Falsehoods cannot be known, so truth is required. You cannot know something you do not believe, so belief is required. And a lucky true belief is not knowledge, so a third element is needed to rule out luck. Justification was the traditional candidate for that job.</p>",
fa:"<p>تحلیل کلاسیک، و هنوز هم فرضِ کاریِ تقریباً همه‌جا بیرون از فلسفه. شما می‌دانید که پ اگر و تنها اگر سه شرط با هم برقرار باشند: پ <b>صادق</b> باشد، شما به پ <b>باور</b> داشته باشید، و باورتان <b>موجه</b> باشد.</p><p>هر شرط جای خود را دارد. گزارهٔ کاذب دانسته نمی‌شود، پس صدق لازم است. چیزی را که باور ندارید نمی‌دانید، پس باور لازم است. و باور صادقِ خوش‌اقبال معرفت نیست، پس عنصر سومی برای کنارگذاشتن اقبال لازم است. توجیه، نامزد سنتیِ این نقش بود.</p>",
xe:"You believe it is raining; it is raining; and you believe it because you can see it out of the window. All three conditions met.",
xf:"باور دارید باران می‌بارد؛ باران می‌بارد؛ و باور دارید چون از پنجره می‌بینید. هر سه شرط برقرار است.",
pe:"Still the standard in professional life: accuracy, sincerity, and a defensible basis. Most disciplinary processes are built on exactly these three.",
pf:"هنوز استانداردِ زندگی حرفه‌ای است: دقت، صداقت و مبنایی قابل دفاع. بیشتر فرایندهای انضباطی دقیقاً بر همین سه بنا شده‌اند.",
oe:"Gettier showed in 1963 that the three conditions are not jointly sufficient. You can have all three and still not know.",
of:"گتیه در ۱۹۶۳ نشان داد این سه شرط رویِ‌هم کافی نیستند. می‌توان هر سه را داشت و باز هم ندانست.",c:[]},

gettier:{L:1,t:"The Gettier problem",tf:"مسئلهٔ گتیه",w:"Edmund Gettier, 1963 — the paper is three pages long",q:"Gettier problem justified true belief counterexample",
en:"<p>Gettier produced cases where all three conditions of the classical analysis are satisfied and yet nobody wants to say the person knows. The structure is always the same: the belief is true, and it is justified, but the justification and the truth are <b>connected only by accident</b>.</p><p>The barn facade case is the cleanest version. You drive through a county where almost every barn-looking structure is a film-set facade. You happen to look at the one genuine barn and believe “that's a barn”. Your vision is working, your belief is true — and had you glanced fifty metres earlier you would have believed the same thing and been wrong.</p><p>The literature that followed is essentially a sixty-year search for a fourth condition that closes the gap.</p>",
fa:"<p>گتیه مواردی ساخت که در آن‌ها هر سه شرط تحلیل کلاسیک برقرار است و با این حال هیچ‌کس نمی‌خواهد بگوید آن شخص می‌داند. ساختار همیشه یکی است: باور صادق است و موجه است، اما توجیه و صدق <b>تنها به‌تصادف</b> به هم پیوسته‌اند.</p><p>نمونهٔ «نمای انبار» تمیزترین صورت آن است. در منطقه‌ای رانندگی می‌کنید که تقریباً همهٔ سازه‌های انبارمانند، دکورهای سینمایی‌اند. اتفاقاً به تنها انبار واقعی نگاه می‌کنید و باور می‌کنید «آن یک انبار است». بینایی‌تان سالم است و باورتان صادق — و اگر پنجاه متر زودتر نگاه کرده بودید، همان باور را می‌داشتید و در اشتباه بودید.</p><p>ادبیاتی که پس از آن آمد، در اصل جست‌وجویی شصت‌ساله برای شرط چهارمی است که این شکاف را ببندد.</p>",
xe:"Your colleague's estimate is correct, and their method was reasonable — but it was reasonable for a different dataset, and it landed on the right answer by coincidence.",
xf:"برآورد همکارتان درست است و روشش هم معقول بود — اما آن روش برای دادهٔ دیگری معقول بود و تنها به‌تصادف به پاسخ درست رسید.",
pe:"The transferable lesson: a correct conclusion reached by a process that could easily have misfired is not a reliable process. Judge the process, not the outcome, because only the process runs again.",
pf:"درسِ قابل انتقال: نتیجهٔ درستی که از فرایندی به دست آمده که به‌آسانی می‌توانست خطا کند، فرایندِ قابل اتکایی نیست. فرایند را داوری کنید نه نتیجه را، چون تنها فرایند دوباره اجرا می‌شود.",
c:["nofalse","sens","safe","defeat"]},

nofalse:{t:"No false lemmas",tf:"بدون مقدمهٔ کاذب",w:"Clark · Harman",q:"no false lemmas Gettier condition",
en:"<p>The first repair attempt: add a fourth condition requiring that the belief not depend on any false intermediate premise. In many Gettier cases the reasoning does pass through something false on its way to something true.</p>",
fa:"<p>نخستین کوششِ ترمیم: شرط چهارمی بیفزایید مبنی بر اینکه باور نباید بر هیچ مقدمهٔ میانیِ کاذبی تکیه داشته باشد. در بسیاری از موارد گتیه، استدلال در مسیر رسیدن به امری صادق، از امری کاذب می‌گذرد.</p>",
pe:"A usable audit rule: trace whether any step in a chain is false even though the conclusion happens to hold.",
pf:"یک قاعدهٔ کاربردی برای بازبینی: ردیابی کنید که آیا گامی در زنجیره کاذب است، هرچند نتیجه اتفاقاً درست درآمده باشد.",
oe:"Some Gettier cases — barn facades among them — involve no false lemma at all.",
of:"برخی موارد گتیه، از جمله نمای انبار، اصلاً مقدمهٔ کاذبی ندارند.",c:[]},

sens:{t:"Sensitivity",tf:"حساسیت",w:"Robert Nozick",q:"sensitivity Nozick tracking truth",
en:"<p>Nozick's condition: you know p only if, <b>had p been false, you would not have believed it</b>. Belief must track truth across nearby possible situations, not merely coincide with it in this one.</p>",
fa:"<p>شرط نوزیک: شما پ را می‌دانید تنها اگر <b>در صورت کاذب‌بودنِ پ، آن را باور نمی‌کردید</b>. باور باید صدق را در وضعیت‌های ممکنِ نزدیک ردیابی کند، نه اینکه صرفاً در همین یکی با آن هم‌راستا شود.</p>",
xe:"You do not know the car is in the lot if you would have believed it either way without checking.",
xf:"اگر بدون بررسی در هر حال همان را باور می‌کردید، نمی‌دانید که خودرو در پارکینگ است.",
pe:"The counterfactual test for any indicator: would this metric actually have moved if the underlying thing were different?",
pf:"آزمونِ خلافِ‌واقع برای هر شاخص: اگر واقعیتِ زیرین متفاوت بود، آیا این شاخص واقعاً تکان می‌خورد؟",
oe:"Sensitivity forces you to deny the closure principle, which most epistemologists find unacceptable.",
of:"حساسیت شما را وادار به انکار اصل انسداد می‌کند، که بیشتر معرفت‌شناسان آن را نمی‌پذیرند.",k:["closure"],c:[]},

safe:{t:"Safety",tf:"ایمنی",w:"Ernest Sosa · Duncan Pritchard",q:"safety condition knowledge Sosa Pritchard",
en:"<p>The weaker and more robust cousin of sensitivity: you know p only if you <b>could not easily have believed p falsely</b>. It asks how near the error was, rather than what would have happened in a specific counterfactual.</p>",
fa:"<p>عموزادهٔ ضعیف‌تر و مقاوم‌ترِ حساسیت: شما پ را می‌دانید تنها اگر <b>به‌آسانی نمی‌توانستید پ را به‌غلط باور کنید</b>. این شرط می‌پرسد خطا چقدر نزدیک بود، نه اینکه در یک وضعیت خلافِ‌واقعِ خاص چه می‌شد.</p>",
xe:"Reading a working clock is safe. Reading one that stopped an hour ago is not, even when it happens to be right.",
xf:"خواندنِ ساعتی سالم ایمن است. خواندنِ ساعتی که یک ساعت پیش خوابیده ایمن نیست، حتی وقتی اتفاقاً درست باشد.",
pe:"The better robustness test for a result: not “is it right?” but “how nearly could it have been wrong?”",
pf:"آزمونِ بهترِ استواری برای یک نتیجه: نه «آیا درست است؟» بلکه «چقدر نزدیک بود که غلط باشد؟»",c:[]},

defeat:{L:1,t:"Defeaters",tf:"ابطال‌کننده‌ها",w:"John Pollock",q:"defeaters undercutting rebutting justification",
en:"<p>Information that removes a justification you previously had. Pollock's distinction is the useful part, and it is one of the highest-value ideas in this whole map for anyone who argues for a living.</p><p>A <b>rebutting</b> defeater gives you reason to think the claim itself is false. An <b>undercutting</b> defeater leaves the claim untouched and attacks the connection between your evidence and the claim — it says your evidence never supported the conclusion in the first place.</p>",
fa:"<p>اطلاعاتی که توجیهی را که پیش‌تر داشتید از بین می‌برد. تمایزی که پالاک می‌گذارد بخش سودمند ماجراست و برای هر کسی که کارش استدلال است، یکی از پرارزش‌ترین ایده‌های این نقشه است.</p><p>ابطال‌کنندهٔ <b>معارض</b> به شما دلیل می‌دهد که خودِ ادعا کاذب است. ابطال‌کنندهٔ <b>زیرشکن</b> ادعا را دست‌نخورده می‌گذارد و به پیوند میان شواهد و ادعا حمله می‌کند — می‌گوید شواهد شما از اول آن نتیجه را پشتیبانی نمی‌کرد.</p>",
xe:"Rebutting: someone shows the widget is actually blue. Undercutting: someone shows the room's lighting distorts colour, so your observation never established anything.",
xf:"معارض: کسی نشان می‌دهد قطعه در واقع آبی است. زیرشکن: کسی نشان می‌دهد نورِ اتاق رنگ را تحریف می‌کند، پس مشاهدهٔ شما از اول چیزی را ثابت نکرده بود.",
pe:"Most genuinely effective rebuttals are undercutting. They do not dispute your data; they break your warrant. Learning to reach for the undercutting move changes how you argue.",
pf:"بیشترِ ردیه‌های واقعاً مؤثر، زیرشکن‌اند. آن‌ها در دادهٔ شما مناقشه نمی‌کنند؛ ضمانتِ استدلال شما را می‌شکنند. عادت‌کردن به این حرکت، شیوهٔ استدلال شما را تغییر می‌دهد.",
k:["toulmin"],c:[]},

kinds:{t:"Kinds of knowledge",tf:"گونه‌های معرفت",w:"Gilbert Ryle on knowing-how",q:"knowing how knowing that acquaintance",
en:"<p>Propositional knowledge (knowing <i>that</i> something is so), ability knowledge (knowing <i>how</i> to do something), and knowledge by acquaintance (knowing a person or a place). Epistemology studies mostly the first, which is a real limitation of the field.</p>",
fa:"<p>معرفت گزاره‌ای (دانستنِ <i>اینکه</i> چیزی چنین است)، معرفت مهارتی (دانستنِ <i>چگونگیِ</i> انجام کاری) و معرفت از راه آشنایی (شناختِ شخص یا مکان). معرفت‌شناسی بیشتر به اولی می‌پردازد، و این محدودیتِ واقعیِ این رشته است.</p>",
xe:"Knowing that a bicycle stays upright by countersteering, versus knowing how to ride one. Neither gives you the other.",
xf:"دانستنِ اینکه دوچرخه با فرمانِ معکوس تعادل می‌یابد، در برابر دانستنِ چگونه دوچرخه‌سواری کردن. هیچ‌کدام دیگری را به شما نمی‌دهد.",
pe:"Institutional expertise is largely ability knowledge, which is exactly why it survives so poorly in written procedure and disappears when people leave.",
pf:"تخصصِ سازمانی عمدتاً معرفت مهارتی است، و دقیقاً به همین دلیل در رویه‌های مکتوب بد باقی می‌ماند و با رفتنِ افراد از بین می‌رود.",c:[]},

value:{L:1,t:"The value of knowledge",tf:"ارزشِ معرفت",w:"Plato's Meno · Zagzebski · Pritchard",q:"value of knowledge Meno problem",
en:"<p>Socrates asks Meno a question that has never been fully answered. If a true belief about the road to Larissa gets you to Larissa exactly as well as knowledge does, why is knowledge worth more?</p><p>The standard answer is <b>stability</b>. A true belief that is merely true can drift away under pressure or fail to reproduce next time. Knowledge, because it is anchored to whatever made it non-accidental, tends to stay put and tends to repeat.</p>",
fa:"<p>سقراط از مِنون پرسشی می‌پرسد که هرگز پاسخ کامل نیافته است. اگر باور صادق دربارهٔ راهِ لاریسا شما را دقیقاً به همان خوبیِ معرفت به لاریسا برساند، چرا معرفت ارزشمندتر است؟</p><p>پاسخ متعارف <b>پایداری</b> است. باور صادقی که فقط صادق است، زیر فشار می‌لغزد یا دفعهٔ بعد تکرار نمی‌شود. معرفت چون به آنچه آن را غیرتصادفی کرده گره خورده، بر جای می‌ماند و تمایل به تکرار دارد.</p>",
xe:"A correct guess and a well-founded judgment give the same answer today. Tomorrow, on a slightly different question, they do not.",
xf:"یک حدسِ درست و یک داوریِ مستدل امروز پاسخ یکسانی می‌دهند. فردا، در پرسشی اندکی متفاوت، دیگر چنین نیست.",
pe:"This is the answer to “why does methodology matter if the call was right?” Outcome and process come apart, and only the process is available to you next time.",
pf:"این پاسخِ آن پرسش است که «اگر تصمیم درست بود، روش چه اهمیتی دارد؟» نتیجه و فرایند از هم جدا می‌شوند و تنها فرایند است که دفعهٔ بعد در اختیار شماست.",c:[]},

just:{L:1,t:"Justification",tf:"توجیه",w:"Steup · Alston · Goldman",q:"epistemic justification theories",
en:"<p>Whatever it is that makes a true belief non-accidentally true — the most contested concept in the field, because everything else depends on how you settle it.</p><p>Two questions have to be kept apart. First, what do we <b>mean</b> by justification? Second, what actually <b>makes</b> beliefs justified? Disagreements about the second are merely verbal if the parties have different answers to the first.</p>",
fa:"<p>هر آنچه یک باور صادق را «غیرتصادفی» می‌کند — پرمناقشه‌ترین مفهوم این رشته، چون بقیهٔ چیزها به نحوهٔ حل آن وابسته‌اند.</p><p>باید دو پرسش را از هم جدا نگه داشت. نخست، از توجیه چه <b>مراد</b> می‌کنیم؟ دوم، چه چیزی واقعاً باورها را موجه <b>می‌سازد</b>؟ اختلاف بر سر دومی، اگر طرفین پاسخ‌های متفاوتی به اولی داشته باشند، صرفاً لفظی است.</p>",
xe:"Two people believe the same true thing. One can show their work; the other guessed. Something separates them, and “justification” is the name for it.",
xf:"دو نفر به یک امرِ صادق باور دارند. یکی می‌تواند کارش را نشان دهد؛ دیگری حدس زده است. چیزی آن‌ها را جدا می‌کند و نام آن چیز «توجیه» است.",
pe:"Every “reasonable basis” standard in law and regulation is an operationalised theory of justification — usually an unexamined one.",
pf:"هر استانداردِ «مبنای معقول» در حقوق و مقررات، یک نظریهٔ عملیاتی‌شدهٔ توجیه است — و معمولاً نظریه‌ای بازبینی‌نشده.",
c:["evid","reliab","intext","deont","basicality"]},

evid:{t:"Evidentialism",tf:"شواهدگرایی",w:"Conee & Feldman",q:"evidentialism justification evidence",
en:"<p>A belief is justified to exactly the degree it fits the evidence you possess — where your evidence consists of your own mental states: perceptual, memorial, introspective and intuitional experiences.</p>",
fa:"<p>یک باور دقیقاً به همان اندازه موجه است که با شواهدِ در اختیار شما جور دربیاید — و شواهدِ شما همان حالات ذهنی‌تان است: تجربه‌های ادراکی، حافظه‌ای، درون‌نگرانه و شهودی.</p>",
xe:"The coffee tastes sweet to you. That experience is your evidence that the coffee is sweet.",
xf:"قهوه به‌مذاقتان شیرین می‌آید. همان تجربه، شاهدِ شماست بر اینکه قهوه شیرین است.",
pe:"The internal, auditable standard: could you show your work using only what you actually had in front of you at the time?",
pf:"استانداردِ درونی و قابل بازبینی: آیا می‌توانستید کارتان را تنها با آنچه آن زمان واقعاً پیش رو داشتید نشان دهید؟",
oe:"Small children and animals seem to know things without possessing evidence in this reflective sense.",
of:"کودکان خردسال و حیوانات ظاهراً چیزهایی می‌دانند بی‌آنکه شاهدی به این معنای تأملی داشته باشند.",c:[]},

reliab:{t:"Reliabilism",tf:"وثاقت‌گرایی",w:"Alvin Goldman",q:"reliabilism justification reliable process",
en:"<p>A belief is justified if it was produced by a process that <b>tends to yield truths</b> — whether or not you can articulate why, and whether or not you have any access to the fact that it is reliable.</p>",
fa:"<p>یک باور موجه است اگر محصولِ فرایندی باشد که <b>گرایش به تولید صدق</b> دارد — چه بتوانید دلیلش را بیان کنید چه نه، و چه به وثاقتِ آن دسترسی داشته باشید چه نه.</p>",
xe:"Vision is reliable, so your visual beliefs are justified even if you have never thought about optics for a second.",
xf:"بینایی قابل اتکاست، پس باورهای بصری‌تان موجه‌اند حتی اگر یک لحظه هم به علم نورشناسی نیندیشیده باشید.",
pe:"The logic of validating a method rather than each individual output. Model risk management is applied reliabilism.",
pf:"منطقِ اعتبارسنجیِ یک روش به‌جای تک‌تک خروجی‌ها. مدیریت ریسکِ مدل، وثاقت‌گراییِ کاربردی است.",
oe:"The generality problem: at what level of description is “the process” the reliable one? Vision, or vision-in-fog-at-dusk?",
of:"مسئلهٔ عمومیت: «فرایند» در چه سطحی از توصیف قابل اتکاست؟ بینایی، یا بینایی‌در‌مه‌هنگام‌غروب؟",c:[]},

intext:{t:"Internalism vs Externalism",tf:"درون‌گرایی در برابر برون‌گرایی",w:"BonJour vs Goldman",q:"internalism externalism justification",
en:"<p>Internalism holds that whatever justifies you is always recognisable on reflection. Externalism denies it: what justifies you can be a fact about the world — such as the reliability of your faculties — to which you have no access at all.</p>",
fa:"<p>درون‌گرایی می‌گوید آنچه شما را موجه می‌کند همواره با تأمل قابل تشخیص است. برون‌گرایی این را انکار می‌کند: آنچه شما را موجه می‌کند می‌تواند واقعیتی دربارهٔ جهان باشد — مثل وثاقتِ قوای ادراکی‌تان — که هیچ دسترسی‌ای به آن ندارید.</p>",
xe:"A perfectly reliable clairvoyant who has no idea they are reliable. Justified, or not? Your answer places you on one side.",
xf:"یک غیب‌بینِ کاملاً قابل اتکا که هیچ نمی‌داند قابل اتکاست. موجه است یا نه؟ پاسخ شما، جبههٔ شما را تعیین می‌کند.",
pe:"The split between “can you defend it?” and “is it actually a good method?” Both matter, and conflating them is how review processes quietly drift into theatre.",
pf:"شکافِ میان «آیا می‌توانید از آن دفاع کنید؟» و «آیا واقعاً روش خوبی است؟» هر دو مهم‌اند و خلطِ آن‌ها همان‌جایی است که فرایندهای بازبینی بی‌سروصدا به نمایش بدل می‌شوند.",c:[]},

deont:{t:"Deontological justification",tf:"توجیهِ تکلیف‌محور",w:"Descartes, Locke, Chisholm — now the minority view",q:"deontological justification doxastic voluntarism",
en:"<p>Justification understood as duty-fulfilment: you are justified in believing p if you are under no obligation to refrain from believing it. This immediately raises whether belief is voluntary at all.</p>",
fa:"<p>توجیه به‌مثابهٔ انجامِ وظیفه: شما در باور به پ موجه‌اید اگر هیچ تکلیفی به خودداری از آن نداشته باشید. این بی‌درنگ این پرسش را پیش می‌آورد که آیا باور اصلاً ارادی است.</p>",
xe:"Try to decide, right now, to believe that it is snowing outside. You cannot do it by deciding.",
xf:"همین حالا بکوشید تصمیم بگیرید که باور کنید بیرون برف می‌بارد. با تصمیم‌گرفتن نمی‌توانید.",
pe:"Bears directly on culpability. If beliefs are not chosen, blaming someone for a wrong belief requires a story about their process, not about their belief.",
pf:"مستقیماً به مسئولیت مربوط است. اگر باورها انتخاب نمی‌شوند، سرزنشِ کسی به‌خاطر باورِ نادرست نیازمند روایتی دربارهٔ فرایند اوست، نه دربارهٔ باورش.",
oe:"Beliefs seem to happen to us the way digestion does, not to be performed the way actions are.",
of:"باورها ظاهراً همان‌گونه بر ما رخ می‌دهند که گوارش رخ می‌دهد، نه آن‌گونه که کنش‌ها انجام می‌شوند.",c:[]},

basicality:{t:"Doxastic vs epistemic basicality",tf:"پایه‌بودنِ باوری در برابر معرفتی",w:"Steup's formulation in SEP",q:"doxastic epistemic basicality basic beliefs",
en:"<p>Two different senses of “basic”. <b>Doxastic</b>: the belief is not justified by any other belief. <b>Epistemic</b>: the belief's justification does not depend on your having justification for any further proposition. The second is much stricter.</p>",
fa:"<p>دو معنای متفاوت از «پایه». <b>باوری</b>: آن باور با هیچ باور دیگری موجه نشده. <b>معرفتی</b>: توجیهِ آن باور به داشتنِ توجیه برای هیچ گزارهٔ دیگری وابسته نیست. دومی به‌مراتب سخت‌گیرانه‌تر است.</p>",
xe:"A perceptual belief may rest on no other belief, yet still depend on your having grounds to trust perception in the first place.",
xf:"یک باور ادراکی ممکن است بر هیچ باور دیگری تکیه نداشته باشد، اما هنوز وابسته باشد به اینکه اساساً مبنایی برای اعتماد به ادراک داشته باشید.",
pe:"This distinction quietly decides the whole foundationalism/coherentism dispute: most claimed “foundations” turn out to be basic only in the weak, doxastic sense.",
pf:"این تمایز بی‌سروصدا کل نزاعِ مبناگرایی و انسجام‌گرایی را حل می‌کند: بیشترِ آنچه «مبنا» خوانده می‌شود تنها به معنای ضعیفِ باوری پایه است.",c:[]},
truth:{L:1,t:"What is truth?",tf:"حقیقت چیست؟",w:"Aristotle · Tarski · James · Ramsey",q:"truth theories correspondence coherence",
en:"<p>Knowledge is justified <b>true</b> belief — so the whole edifice rests on a concept most people never examine. What makes a proposition true?</p><p>Four families of answer compete. Truth as <b>correspondence</b> to how things are; truth as <b>coherence</b> within a system; truth as what <b>works</b> under sustained inquiry; and the deflationary view that truth is not a substantive property at all, so the question dissolves.</p><p>Skipping this while studying justification is like doing cost-benefit analysis without defining the benefit.</p>",
fa:"<p>معرفت، باورِ <b>صادقِ</b> موجه است — پس تمام بنا بر مفهومی استوار است که بیشتر مردم هرگز آن را وارسی نمی‌کنند. چه چیزی یک گزاره را صادق می‌کند؟</p><p>چهار خانوادهٔ پاسخ با هم رقابت می‌کنند: صدق به‌مثابهٔ <b>مطابقت</b> با واقع؛ صدق به‌مثابهٔ <b>انسجام</b> درون یک نظام؛ صدق به‌مثابهٔ آنچه در پژوهشِ پیوسته <b>کار می‌کند</b>؛ و دیدگاه انکماشی که می‌گوید صدق اصلاً ویژگیِ ماهوی نیست و پرسش خودبه‌خود حل می‌شود.</p><p>مطالعهٔ توجیه بدون پرداختن به این، مثل تحلیل هزینه‌فایده است بدون تعریفِ فایده.</p>",
xe:"“Snow is white” is true. Because of snow? Because it fits everything else you believe? Because acting on it works? Each answer builds a different discipline.",
xf:"«برف سفید است» صادق است. به‌خاطر برف؟ چون با بقیهٔ باورهایتان جور است؟ چون عمل بر اساس آن جواب می‌دهد؟ هر پاسخ، رشته‌ای متفاوت می‌سازد.",
pe:"A large share of stuck disagreements are two people running incompatible truth conditions without noticing. Ask what would make the claim true before arguing about whether it is.",
pf:"بخش بزرگی از اختلاف‌های بی‌فرجام، دو نفرند که ناخودآگاه شرایط صدقِ ناسازگاری را به کار می‌برند. پیش از بحث بر سرِ صادق‌بودنِ ادعا، بپرسید چه چیزی آن را صادق می‌کند.",
c:["corr","cohtruth","prag","defl","object"]},

corr:{L:1,t:"Correspondence theory",tf:"نظریهٔ مطابقت",w:"Aristotle · Russell · Tarski",q:"correspondence theory of truth",
en:"<p>A proposition is true when it corresponds to how things actually stand, independently of what anyone believes. Aristotle's formulation is still the clearest: to say of what is that it is, is true.</p><p>This is the default assumption of empirical work, and it is what gives evidence its point. If truth were not answerable to the world, gathering data would be a strange thing to do.</p>",
fa:"<p>یک گزاره صادق است هرگاه با آنچه واقعاً هست مطابقت داشته باشد، مستقل از باورِ هر کس. صورت‌بندیِ ارسطو هنوز روشن‌ترین است: گفتنِ اینکه آنچه هست، هست، صدق است.</p><p>این فرضِ پیش‌فرضِ کارِ تجربی است و همان چیزی است که به شواهد معنا می‌دهد. اگر صدق در برابر جهان پاسخ‌گو نبود، گردآوری داده کارِ عجیبی می‌بود.</p>",
xe:"“The bridge is 400 metres long” is true if and only if the bridge is 400 metres long.",
xf:"«این پل ۴۰۰ متر است» صادق است اگر و تنها اگر آن پل ۴۰۰ متر باشد.",
pe:"The working assumption behind any factual finding. It is also what a finding of fact promises: not internal consistency, but answerability to the world.",
pf:"فرضِ کاریِ هر «یافتهٔ واقع». همچنین همان چیزی است که یافتهٔ واقع وعده می‌دهد: نه سازگاریِ درونی، بلکه پاسخ‌گویی در برابر جهان.",
oe:"What exactly is the correspondence relation, and what does an abstract or statistical claim correspond to?",
of:"دقیقاً نسبتِ «مطابقت» چیست، و یک ادعای انتزاعی یا آماری با چه چیزی مطابقت دارد؟",c:[]},

cohtruth:{t:"Coherence theory",tf:"نظریهٔ انسجام",w:"Bradley · Blanshard",q:"coherence theory of truth",
en:"<p>A proposition is true when it belongs to a maximally coherent system of propositions. Truth is a property of the fit, not of a relation to something outside.</p>",
fa:"<p>یک گزاره صادق است هرگاه به نظامی از گزاره‌ها تعلق داشته باشد که بیشترین انسجام را دارد. صدق ویژگیِ تناسب است، نه نسبت با چیزی بیرونی.</p>",
xe:"Mathematical truth looks like this — consistency with the axioms, not correspondence to objects in a field somewhere.",
xf:"صدقِ ریاضی چنین می‌نماید — سازگاری با اصول موضوعه، نه مطابقت با اشیائی در جایی از جهان.",
pe:"How internally consistent frameworks earn confidence in domains where direct verification is impossible.",
pf:"همان‌گونه که چارچوب‌های سازگارِ درونی در حوزه‌هایی که راستی‌آزماییِ مستقیم ناممکن است اعتماد می‌سازند.",
oe:"Two rival coherent systems could both come out true, which is a result nobody wants.",
of:"دو نظامِ منسجمِ رقیب می‌توانند هر دو صادق درآیند، و این نتیجه‌ای است که هیچ‌کس نمی‌خواهد.",c:[]},

prag:{t:"Pragmatic theory",tf:"نظریهٔ عمل‌گرایانه",w:"C.S. Peirce · William James · Dewey",q:"pragmatic theory of truth Peirce James",
en:"<p>A belief is true if it works — if acting on it succeeds, and if it is the belief inquiry would converge on in the long run. Peirce's version ties truth to the end point of investigation, not to present usefulness.</p>",
fa:"<p>باوری صادق است که کار کند — اگر عمل بر پایهٔ آن موفق باشد و اگر پژوهش در درازمدت به همان همگرا شود. صورتِ پیرس، صدق را به نقطهٔ پایانِ تحقیق گره می‌زند، نه به سودمندیِ اکنون.</p>",
xe:"“This bridge design holds” is true if bridges built that way do not fall down.",
xf:"«این طرحِ پل مقاوم است» صادق است اگر پل‌هایی که چنین ساخته می‌شوند فرونریزند.",
pe:"Close to how engineering and applied economics actually treat their models, whatever they say in the methodology section.",
pf:"نزدیک به آنچه مهندسی و اقتصادِ کاربردی در عمل با مدل‌هایشان می‌کنند، هر چه در بخش روش‌شناسی بنویسند.",
oe:"Useful falsehoods exist and comforting truths are sometimes useless. Working is not the same as being so.",
of:"دروغ‌های سودمند وجود دارند و حقایقِ آزارنده گاه بی‌فایده‌اند. «کار کردن» با «چنین بودن» یکی نیست.",c:[]},

defl:{t:"Deflationary theory",tf:"نظریهٔ انکماشی",w:"Ramsey · Quine · Horwich",q:"deflationary redundancy theory of truth",
en:"<p>“It is true that p” says nothing beyond p itself. Truth is a logical convenience — it lets us generalise and endorse — not a substantive property in need of analysis.</p>",
fa:"<p>«صادق است که پ» چیزی فراتر از خودِ پ نمی‌گوید. صدق یک سهولتِ منطقی است — امکان تعمیم و تأیید می‌دهد — نه ویژگی‌ای ماهوی که نیازمند تحلیل باشد.</p>",
xe:"“It's true that it's raining” adds nothing at all to “it's raining”.",
xf:"«صادق است که باران می‌بارد» هیچ چیزی به «باران می‌بارد» نمی‌افزاید.",
pe:"A fast way to dissolve arguments about whether something is “really” true: restate both positions without the word and see whether the dispute survives.",
pf:"راهی سریع برای حل‌کردنِ بحث بر سر اینکه چیزی «واقعاً» صادق است: هر دو موضع را بدون این واژه بازگو کنید و ببینید آیا نزاع باقی می‌ماند.",c:[]},

object:{t:"Objectivity and relativism",tf:"عینیت و نسبی‌گرایی",w:"Kuhn · Martin Kusch · Boghossian",q:"relativism objectivity epistemic",
en:"<p>Whether claims are true full stop, or true only relative to a framework, paradigm, or culture. The question sharpens once you take theory-ladenness and incommensurability seriously.</p>",
fa:"<p>آیا ادعاها به‌طور مطلق صادق‌اند، یا تنها نسبت به یک چارچوب، پارادایم یا فرهنگ؟ این پرسش وقتی جدی‌تر می‌شود که «نظریه‌بارگیِ مشاهده» و «قیاس‌ناپذیری» را جدی بگیرید.</p>",
xe:"Are scientific claims true, or true within the system of thought that produced them?",
xf:"آیا ادعاهای علمی صادق‌اند، یا درونِ نظامِ فکری‌ای که آن‌ها را پدید آورده صادق‌اند؟",
pe:"The live question behind most “whose evidence counts” disputes in policy.",
pf:"پرسشِ زندهٔ پشتِ بیشترِ نزاع‌های سیاست‌گذاری بر سر اینکه «شواهدِ چه کسی به حساب می‌آید».",
oe:"Strong relativism looks self-refuting: is the claim that all truth is relative itself only relatively true?",
of:"نسبی‌گراییِ قوی خودبراندازانه می‌نماید: آیا این ادعا که هر حقیقتی نسبی است، خودش تنها نسبتاً صادق است؟",
k:["incomm"],c:[]},

sources:{L:1,t:"Sources of knowledge",tf:"سرچشمه‌های معرفت",w:"SEP §4 · Pritchard Part 2",q:"sources of knowledge perception memory testimony",
en:"<p>Beliefs arise from many causes, most of them disreputable — desire, fear, habit, prejudice. Only a few sources are candidates for producing knowledge: <b>perception, introspection, memory, reason, and testimony</b>.</p><p>Each raises the same shape of question. Why is this a source of justification at all? Is it because it is in fact reliable, or because we have grounds to believe it is, or because it could not be otherwise?</p><p>Any evidentiary framework you have ever worked under is implicitly a ranking of these five.</p>",
fa:"<p>باورها از علت‌های بسیاری برمی‌خیزند که بیشترشان بی‌اعتبارند: میل، ترس، عادت، پیش‌داوری. تنها چند سرچشمه نامزدِ تولیدِ معرفت‌اند: <b>ادراک، درون‌نگری، حافظه، عقل و گواهی</b>.</p><p>هر یک همان شکل از پرسش را پیش می‌آورند. اصلاً چرا این یک سرچشمهٔ توجیه است؟ چون در واقع قابل اتکاست، یا چون مبنایی برای باور به اتکاپذیری‌اش داریم، یا چون نمی‌توانست جز این باشد؟</p><p>هر چارچوب اثباتی‌ای که تا کنون زیر آن کار کرده‌اید، به‌طور ضمنی رتبه‌بندی‌ای از همین پنج است.</p>",
xe:"You know the room is cold by feeling it, that you ate breakfast by remembering, that 7+5=12 by reasoning, and the population of Brazil because someone told you.",
xf:"سرمای اتاق را با حس‌کردن می‌دانید، صبحانه‌خوردنتان را با به‌یادآوردن، اینکه ۷+۵=۱۲ را با استدلال، و جمعیت برزیل را چون کسی به شما گفته است.",
pe:"Notice how uneven the reliance is. Almost everything professionally important reaches you through the fifth source, which is also the least examined.",
pf:"به نابرابریِ این اتکا توجه کنید. تقریباً هر چیزِ مهمِ حرفه‌ای از راه سرچشمهٔ پنجم به شما می‌رسد، که کم‌بررسی‌شده‌ترین هم هست.",
c:["percep","mem","intro","apriori","testim"]},

percep:{L:1,t:"Perception",tf:"ادراک حسی",w:"Locke · Berkeley · Austin",q:"problem of perception direct indirect realism",
en:"<p>Knowledge through the senses, and the oldest puzzle in the theory of knowledge. When you see a tomato, do you see <b>the tomato</b>, or do you see something else — an appearance, an image, a sense-datum — from which the tomato is inferred?</p><p>The question is not idle. If perception delivers the world directly, observation can be foundational. If it delivers only representations, then every observation is already an inference, and the gap between data and world is permanent.</p>",
fa:"<p>معرفت از راه حواس، و کهن‌ترین معمای نظریهٔ شناخت. وقتی گوجه‌ای می‌بینید، آیا <b>خودِ گوجه</b> را می‌بینید یا چیز دیگری — نمود، تصویر، دادهٔ حسی — که گوجه از آن استنتاج می‌شود؟</p><p>پرسش بیهوده نیست. اگر ادراک جهان را بی‌واسطه بدهد، مشاهده می‌تواند بنیادی باشد. اگر تنها بازنمود بدهد، هر مشاهده از پیش یک استنتاج است و شکافِ میان داده و جهان همیشگی.</p>",
xe:"A straight stick looks bent in water. The experience is of something bent — so what did you directly perceive?",
xf:"چوبِ راست در آب کج به‌نظر می‌رسد. تجربه، تجربهٔ چیزی کج است — پس شما مستقیماً چه چیزی را ادراک کردید؟",
pe:"The direct-versus-indirect question is the same structure as reality versus instrument output. You never observe the economy; you observe a series someone constructed.",
pf:"پرسشِ مستقیم/غیرمستقیم همان ساختارِ «واقعیت در برابر خروجیِ ابزار» است. شما هرگز اقتصاد را مشاهده نمی‌کنید؛ سری‌ای را مشاهده می‌کنید که کسی ساخته است.",
c:["dirreal","indreal","illus"]},

dirreal:{t:"Direct realism",tf:"واقع‌گراییِ مستقیم",w:"Thomas Reid · J.L. Austin",q:"direct realism perception",
en:"<p>We perceive external objects themselves, with no intermediary. Experience is a form of contact with the world, not a picture of it.</p>",
fa:"<p>ما خودِ اشیای بیرونی را ادراک می‌کنیم، بی‌هیچ واسطه‌ای. تجربه نوعی تماس با جهان است، نه تصویری از آن.</p>",
xe:"When you see the tomato, what you see is the tomato. Nothing stands between.",
xf:"وقتی گوجه را می‌بینید، آنچه می‌بینید خودِ گوجه است. چیزی در میان نیست.",
pe:"Supports treating carefully collected observation as foundational rather than as a derived construct.",
pf:"پشتیبانِ این است که مشاهدهٔ دقیق را بنیادی بدانیم، نه سازه‌ای مشتق‌شده.",c:[]},

indreal:{t:"Indirect realism",tf:"واقع‌گراییِ غیرمستقیم",w:"Locke · Russell",q:"indirect realism sense data",
en:"<p>We perceive external objects only by perceiving something else that represents them. What you directly access is the representation; the object is an inference from it.</p>",
fa:"<p>ما اشیای بیرونی را تنها از راه ادراکِ چیزی دیگر که آن‌ها را بازمی‌نماید ادراک می‌کنیم. آنچه مستقیماً به آن دسترسی دارید بازنمود است؛ شیء استنتاجی از آن است.</p>",
xe:"What reaches you is the image. The object behind it is a hypothesis you did not consciously form.",
xf:"آنچه به شما می‌رسد تصویر است. شیءِ پشتِ آن فرضیه‌ای است که آگاهانه نساخته‌اید.",
pe:"The honest description of measurement. Every figure you use is an instrument reading, and the instrument has a theory built into it.",
pf:"توصیفِ صادقانهٔ اندازه‌گیری. هر عددی که به کار می‌برید یک قرائتِ ابزار است، و در آن ابزار نظریه‌ای تعبیه شده.",
oe:"If we only ever access representations, how could we ever check that they represent anything?",
of:"اگر همواره تنها به بازنمودها دسترسی داریم، چگونه می‌توانیم بررسی کنیم که آن‌ها چیزی را بازمی‌نمایند؟",c:[]},

illus:{t:"Argument from illusion",tf:"استدلال از راه خطای حسی",w:"Classical; contested by Austin",q:"argument from illusion sense data",
en:"<p>Illusions and veridical perceptions can be subjectively indistinguishable. So whatever we directly perceive must be the same kind of thing in both cases — and since it cannot be the object in the illusion case, it is never the object.</p>",
fa:"<p>خطای حسی و ادراکِ صادق می‌توانند از درون تمییزناپذیر باشند. پس آنچه مستقیماً ادراک می‌کنیم باید در هر دو حالت از یک جنس باشد — و چون در حالتِ خطا نمی‌تواند خودِ شیء باشد، هرگز خودِ شیء نیست.</p>",
pe:"The general form of the argument for why a measurement that looks clean can still be an artefact of the instrument.",
pf:"صورتِ کلیِ این استدلال که چرا اندازه‌گیریِ به‌ظاهر تمیز می‌تواند صرفاً محصولِ خودِ ابزار باشد.",c:[]},

mem:{t:"Memory",tf:"حافظه",w:"Reid · Russell · Bernecker",q:"epistemology of memory",
en:"<p>The capacity to retain knowledge already acquired. Remembering that p entails that p is true; merely <b>seeming</b> to remember does not, and from the inside the two can feel identical.</p>",
fa:"<p>توانِ نگه‌داشتنِ معرفتی که پیش‌تر به دست آمده. «به یاد آوردنِ اینکه پ» مستلزم صدقِ پ است؛ اما <b>گمانِ</b> به‌یادآوردن چنین نیست، و از درون این دو می‌توانند یکسان حس شوند.</p>",
xe:"You seem to recall locking the door. Did you actually, or are you remembering the habit?",
xf:"گمان می‌کنید در را قفل کرده‌اید. واقعاً چنین بوده، یا عادت را به یاد می‌آورید؟",
pe:"Institutional memory has exactly this problem: the record of why a rule exists is usually a seeming, not a remembering, and nobody can tell which.",
pf:"حافظهٔ سازمانی دقیقاً همین مشکل را دارد: روایتِ اینکه چرا یک قاعده وجود دارد معمولاً «گمان» است نه «یادآوری»، و کسی نمی‌تواند تشخیص دهد.",
c:["past"]},

past:{t:"Skepticism about the past",tf:"شکاکیت دربارهٔ گذشته",w:"Bertrand Russell",q:"skepticism about the past five minute hypothesis",
en:"<p>Nothing in present experience entails that the past actually occurred. Russell's five-minute hypothesis: the universe could have sprung into existence five minutes ago, complete with fossils, records, and memories.</p>",
fa:"<p>هیچ چیز در تجربهٔ کنونی مستلزمِ رخ‌دادنِ واقعیِ گذشته نیست. فرضِ پنج‌دقیقه‌ایِ راسل: جهان می‌توانست پنج دقیقه پیش پدید آمده باشد، با فسیل‌ها و اسناد و خاطرات، همه با هم.</p>",
pe:"A hard limit on any historical or backtested claim: the same data is compatible with more than one past.",
pf:"سقفی سخت بر هر ادعای تاریخی یا آزمون‌شده‌بر‌گذشته: همان داده با بیش از یک گذشته سازگار است.",c:[]},

intro:{t:"Introspection",tf:"درون‌نگری",w:"Descartes · Schwitzgebel, the modern sceptic",q:"introspection self-knowledge infallibility",
en:"<p>Knowledge of your own mental states. Long treated as specially privileged — infallible, indubitable, or incorrigible — and therefore the favourite candidate for a foundation.</p>",
fa:"<p>معرفت به حالات ذهنیِ خود. مدت‌ها ممتاز شمرده می‌شد — خطاناپذیر، تردیدناپذیر یا اصلاح‌ناپذیر — و از همین رو نامزدِ محبوبِ نقشِ «مبنا».</p>",
xe:"Can you be wrong that you have a headache? It feels impossible — until you try to distinguish an unpleasant itch from a mild pain.",
xf:"آیا می‌توانید در اینکه سردرد دارید اشتباه کنید؟ ناممکن می‌نماید — تا وقتی بکوشید خارشِ آزارنده را از دردِ خفیف تمییز دهید.",
pe:"The assumed privilege of self-report is why survey and self-assessment data get systematically over-trusted.",
pf:"همین امتیازِ مفروضِ خودگزارشی است که سبب می‌شود به دادهٔ نظرسنجی و خودارزیابی نظام‌مند بیش از حد اعتماد شود.",
oe:"The privilege is weaker than advertised. Introspection is neither infallible nor beyond correction.",
of:"این امتیاز از آنچه تبلیغ می‌شود ضعیف‌تر است. درون‌نگری نه خطاناپذیر است و نه اصلاح‌ناپذیر.",c:[]},

apriori:{L:1,t:"Reason and the a priori",tf:"عقل و معرفتِ پیشین",w:"Kant · Ayer · Kripke · BonJour",q:"a priori knowledge justification",
en:"<p>Justification that does not depend on experience at all. Mathematics, logic, and conceptual truths are the paradigm cases: you do not survey bachelors to learn that they are unmarried.</p><p>Three questions follow. Does a priori knowledge exist, or is all knowledge ultimately empirical? If it exists, what produces it — intellectual insight, grasp of necessity, or a reliable cognitive process? And how far does it extend?</p>",
fa:"<p>توجیهی که اصلاً به تجربه وابسته نیست. ریاضیات، منطق و صدق‌های مفهومی نمونه‌های نمونه‌وارند: برای دانستنِ اینکه مجردها ازدواج‌نکرده‌اند از مجردها نظرسنجی نمی‌کنید.</p><p>سه پرسش در پی می‌آید. آیا معرفت پیشین اصلاً وجود دارد یا هر معرفتی در نهایت تجربی است؟ اگر هست، چه چیزی آن را می‌سازد — بصیرت عقلی، درکِ ضرورت، یا فرایندی قابل اتکا؟ و تا کجا گسترش می‌یابد؟</p>",
xe:"“If a ball is green all over, it does not have black spots.” No observation is required, and none would help.",
xf:"«اگر توپی سرتاسر سبز باشد، لکهٔ سیاه ندارد.» هیچ مشاهده‌ای لازم نیست و هیچ مشاهده‌ای کمکی نمی‌کند.",
pe:"Decides what you think a formal model actually is: a discovery about the world, or an elaborate restatement of its own assumptions.",
pf:"تعیین می‌کند که به‌نظر شما یک مدل صوری واقعاً چیست: کشفی دربارهٔ جهان، یا بازگوییِ پیچیدهٔ فرض‌های خودش.",
c:["ratemp","ansyn","synapr"]},

ratemp:{L:1,t:"Rationalism vs Empiricism",tf:"عقل‌گرایی در برابر تجربه‌گرایی",w:"Descartes, Leibniz, Spinoza vs Locke, Berkeley, Hume",q:"rationalism empiricism",
en:"<p>The organising dispute of early modern philosophy. Rationalists hold that reason alone can deliver substantive knowledge of the world. Empiricists hold that all such knowledge ultimately traces back to experience, and that reason only rearranges what experience supplies.</p><p>The argument was never settled; it was absorbed. Every methodological fight about whether to start from theory or from data is a descendant of it.</p>",
fa:"<p>نزاعِ سازمان‌دهندهٔ فلسفهٔ مدرن آغازین. عقل‌گرایان می‌گویند عقل به‌تنهایی می‌تواند معرفتِ ماهوی دربارهٔ جهان بدهد. تجربه‌گرایان می‌گویند هر چنین معرفتی در نهایت به تجربه بازمی‌گردد و عقل تنها آنچه را تجربه فراهم کرده بازآرایی می‌کند.</p><p>این بحث هرگز فیصله نیافت؛ جذب شد. هر نزاعِ روش‌شناختی بر سر اینکه از نظریه آغاز کنیم یا از داده، فرزندِ همین است.</p>",
xe:"Is “every event has a cause” known by thinking it through, or generalised from a very large number of observations?",
xf:"آیا «هر رویدادی علتی دارد» با اندیشیدن دانسته می‌شود یا از شمار بسیار زیادی مشاهده تعمیم یافته است؟",
pe:"The unstated fault line between theory-first and data-first economics. Most methodological arguments in that field are this argument wearing modern clothes.",
pf:"شکافِ ناگفته میان اقتصادِ نظریه‌محور و اقتصادِ داده‌محور. بیشترِ مشاجراتِ روش‌شناختی در آن رشته همین بحث است با جامه‌ای امروزی.",c:[]},

ansyn:{L:1,t:"Analytic vs Synthetic",tf:"تحلیلی در برابر ترکیبی",w:"Kant · Quine's attack in 'Two Dogmas of Empiricism'",q:"analytic synthetic distinction Quine",
en:"<p>Analytic truths are true in virtue of meaning alone; synthetic truths say something substantive about the world. “All bachelors are unmarried” versus “most bachelors own cars”.</p><p>Quine's 1951 attack argued the distinction cannot be drawn without circularity, and that no statement is immune from revision in the light of experience — including the ones we call definitional.</p>",
fa:"<p>صدق‌های تحلیلی تنها به‌واسطهٔ معنا صادق‌اند؛ صدق‌های ترکیبی چیزی ماهوی دربارهٔ جهان می‌گویند. «همهٔ مجردها ازدواج‌نکرده‌اند» در برابر «بیشتر مجردها خودرو دارند».</p><p>حملهٔ کواین در ۱۹۵۱ استدلال کرد که این تمایز بدون دور قابل ترسیم نیست و هیچ گزاره‌ای در برابر بازنگری در پرتو تجربه مصون نیست — حتی آن‌هایی که تعریفی می‌خوانیمشان.</p>",
xe:"Is “force equals mass times acceleration” a definition of force or an empirical discovery? The answer has changed over time, which is Quine's point.",
xf:"آیا «نیرو برابر است با جرم در شتاب» تعریفِ نیروست یا کشفی تجربی؟ پاسخ در طول زمان تغییر کرده، و نکتهٔ کواین همین است.",
pe:"A sharp audit tool: which of your model's results are consequences of the definitions you chose, and which are empirical findings? The two get reported in the same font.",
pf:"ابزاری برنده برای بازبینی: کدام نتایج مدلِ شما پیامدِ تعاریفی است که برگزیده‌اید و کدام یافتهٔ تجربی است؟ هر دو با یک قلم گزارش می‌شوند.",
k:["duhem"],c:[]},

synapr:{t:"The synthetic a priori",tf:"ترکیبیِ پیشین",w:"Immanuel Kant",q:"synthetic a priori Kant",
en:"<p>Kant's claim that some propositions are both informative about the world and knowable without experience. If the category is real, some substantive knowledge is available before any data arrives.</p>",
fa:"<p>ادعای کانت مبنی بر اینکه برخی گزاره‌ها هم دربارهٔ جهان آگاهی‌بخش‌اند و هم بدون تجربه دانستنی. اگر این مقوله واقعی باشد، پیش از رسیدنِ هر داده‌ای معرفتی ماهوی در دسترس است.</p>",
pe:"If it exists, it is the strongest available defence of pure theory as something other than bookkeeping.",
pf:"اگر وجود داشته باشد، قوی‌ترین دفاعِ ممکن از نظریهٔ محض به‌عنوان چیزی بیش از دفترداری است.",
oe:"Empiricists deny the category outright; the logical positivists made denying it their central programme.",
of:"تجربه‌گرایان این مقوله را یکسره انکار می‌کنند؛ پوزیتیویست‌های منطقی انکارِ آن را برنامهٔ اصلی خود ساختند.",c:[]},

testim:{L:1,t:"Testimony",tf:"گواهی",w:"Reid · Coady · Lackey",q:"epistemology of testimony",
en:"<p>Coming to know something because somebody said so. It is by far the largest source of what you believe, and the one that gets the least scrutiny.</p><p>The puzzle: why is testimony a source of knowledge at all? If it is because the speaker is reliable, then a reliable speaker whose reliability is completely unknown to you should still transmit knowledge — which seems wrong. If it requires evidence of reliability, almost nothing you believe qualifies, because you cannot audit the sources of most of what you know.</p>",
fa:"<p>دانستنِ چیزی به این دلیل که کسی آن را گفته است. این بزرگ‌ترین سرچشمهٔ باورهای شماست و کم‌بازرسی‌شده‌ترین.</p><p>معما: اصلاً چرا گواهی سرچشمهٔ معرفت است؟ اگر به‌دلیل قابل‌اتکا بودنِ گوینده است، پس گوینده‌ای که وثاقتش برای شما یکسره ناشناخته است هم باید معرفت منتقل کند — که نادرست می‌نماید. و اگر شاهدی بر وثاقت لازم است، تقریباً هیچ‌یک از باورهای شما واجد شرط نیست، چون نمی‌توانید سرچشمهٔ بیشترِ دانسته‌هایتان را حسابرسی کنید.</p>",
xe:"You know the population of Brazil, the boiling point of mercury, and what happened in 1789. You verified none of them.",
xf:"جمعیت برزیل، نقطهٔ جوشِ جیوه و آنچه در ۱۷۸۹ رخ داد را می‌دانید. هیچ‌یک را راستی‌آزمایی نکرده‌اید.",
pe:"The dominant channel of professional knowledge. If you want to improve the accuracy of what you believe at work, this is where the leverage is — not in your own reasoning.",
pf:"مجرای غالبِ معرفتِ حرفه‌ای. اگر می‌خواهید دقتِ آنچه در کار باور دارید بالا برود، اهرم اینجاست، نه در استدلالِ شخصیِ خودتان.",
c:["reduct","reid"]},

reduct:{t:"Reductionism vs anti-reductionism",tf:"تحویل‌گرایی در برابر ضدتحویل‌گرایی",w:"Hume (reductionist) vs Reid (anti-reductionist)",q:"reductionism testimony Hume Reid",
en:"<p>Reductionism: trust in testimony must be earned by independent evidence of the speaker's reliability. Anti-reductionism: trust is a default entitlement, withdrawn only when a specific defeater appears.</p>",
fa:"<p>تحویل‌گرایی: اعتماد به گواهی باید با شاهدی مستقل بر وثاقتِ گوینده به دست آید. ضدتحویل‌گرایی: اعتماد حقی پیش‌فرض است که تنها با ظهورِ ابطال‌کننده‌ای مشخص پس گرفته می‌شود.</p>",
xe:"Do you need grounds to believe a stranger's directions, or only grounds to doubt them?",
xf:"آیا برای باورکردنِ نشانیِ یک غریبه دلیل لازم دارید، یا تنها برای شک‌کردن به آن؟",
pe:"Sets your default posture toward secondhand data: verify-then-trust, or trust-unless-flagged. Most organisations claim the first and practise the second.",
pf:"موضعِ پیش‌فرضِ شما نسبت به دادهٔ دست‌دوم را تعیین می‌کند: نخست راستی‌آزمایی سپس اعتماد، یا اعتماد مگر خلافش. بیشتر سازمان‌ها اولی را ادعا و دومی را عمل می‌کنند.",c:[]},

reid:{t:"Reid's default trust",tf:"اعتمادِ پیش‌فرضِ رید",w:"Thomas Reid",q:"Thomas Reid testimony credulity principle",
en:"<p>Reid argued that by our very constitution we accept testimony and attribute credibility, unless we encounter a specific reason not to. Trust is the starting state, not an achievement.</p>",
fa:"<p>رید استدلال کرد که ما بنا بر سرشتِ خود گواهی را می‌پذیریم و اعتبار قائل می‌شویم، مگر آنکه دلیلی مشخص خلافِ آن بیابیم. اعتماد حالتِ آغازین است، نه دستاورد.</p>",
xe:"Children believe what they are told before they can assess anyone's reliability — and mostly end up right.",
xf:"کودکان پیش از آنکه بتوانند وثاقتِ کسی را بسنجند، آنچه را می‌شنوند باور می‌کنند — و بیشتر اوقات هم درست از آب درمی‌آید.",
pe:"Describes how organisations actually operate. The design question is therefore not whether to trust but where to place the defeaters.",
pf:"توصیفِ کارکردِ واقعیِ سازمان‌هاست. پس پرسشِ طراحی این نیست که اعتماد کنیم یا نه، بلکه این است که ابطال‌کننده‌ها را کجا بگذاریم.",c:[]},
skep:{L:1,t:"Skepticism and its limits",tf:"شکاکیت و مرزهای معرفت",w:"Sextus · Descartes · Dretske · DeRose",q:"skepticism epistemology",
en:"<p>How far knowledge actually reaches, and the arguments that it reaches far less than we assume. Nobody seriously believes the sceptical conclusion. The interest lies in the fact that the arguments for it are made of premises everyone accepts.</p><p>That is what makes this branch the most transferable material on the map. The closure principle, the relevant-alternatives move, and the Moorean reversal are tools you can use in an ordinary argument tomorrow.</p>",
fa:"<p>اینکه معرفت واقعاً تا کجا می‌رسد، و استدلال‌هایی که می‌گویند بسیار کمتر از آنچه می‌پنداریم. هیچ‌کس جداً نتیجهٔ شکاکانه را باور ندارد. جذابیت در این است که استدلال‌های آن از مقدماتی ساخته شده که همه می‌پذیرند.</p><p>همین است که این شاخه را قابل‌انتقال‌ترین بخشِ نقشه می‌کند. اصل انسداد، حرکتِ «بدیل‌های مربوط» و وارونه‌سازیِ مورى ابزارهایی‌اند که فردا در یک بحث عادی به کار می‌آیند.</p>",
xe:"You think you know you have hands. A sceptic will grant you everything except the ability to rule out a scenario in which you do not.",
xf:"گمان می‌کنید می‌دانید دست دارید. شکاک همه‌چیز را به شما می‌دهد جز توانِ رد کردنِ سناریویی که در آن دست ندارید.",
pe:"Every “you cannot rule out the alternative explanation” challenge in professional life has this exact shape. Knowing the shape tells you which of the two premises to attack.",
pf:"هر چالشِ «شما نمی‌توانید تبیین بدیل را رد کنید» در زندگی حرفه‌ای دقیقاً همین شکل را دارد. شناختِ شکل به شما می‌گوید به کدام‌یک از دو مقدمه حمله کنید.",
c:["biv","closure","relalt","moore","context","pyrrh","cartes"]},

biv:{L:1,t:"The brain-in-a-vat argument",tf:"استدلالِ مغز در خمره",w:"Putnam's version of Descartes' demon",q:"brain in a vat skeptical argument",
en:"<p>The argument in three lines. (1) You do not know that you are not a brain in a vat. (2) If you do not know that, you do not know that you have hands. Therefore (3) you do not know that you have hands.</p><p>Premise (1) holds because your evidence would be identical either way — that is built into the hypothesis. Premise (2) follows from the closure principle. The argument is valid, its premises are plausible, and its conclusion is unacceptable. Something has to give, and the whole literature is about what.</p>",
fa:"<p>استدلال در سه سطر. (۱) شما نمی‌دانید که مغزی در خمره نیستید. (۲) اگر آن را ندانید، نمی‌دانید که دست دارید. پس (۳) نمی‌دانید که دست دارید.</p><p>مقدمهٔ (۱) درست است چون شواهد شما در هر دو حالت یکسان خواهد بود — این در خودِ فرض تعبیه شده. مقدمهٔ (۲) از اصل انسداد برمی‌آید. استدلال معتبر است، مقدماتش موجه‌اند و نتیجه‌اش پذیرفتنی نیست. چیزی باید کوتاه بیاید، و تمام ادبیات دربارهٔ همین «چیز» است.</p>",
xe:"Envatted, everything looks and feels exactly as it does now. That is the point: evidence cannot distinguish the two cases.",
xf:"در خمره، همه‌چیز دقیقاً همان‌گونه به‌نظر می‌رسد و حس می‌شود که اکنون. نکته همین است: شواهد نمی‌تواند این دو حالت را تمییز دهد.",
pe:"The structural template for every unfalsifiable alternative hypothesis someone raises against your finding.",
pf:"الگوی ساختاریِ هر فرضیهٔ بدیلِ ابطال‌ناپذیری که کسی در برابر یافتهٔ شما مطرح می‌کند.",c:[]},

closure:{L:1,t:"The closure principle",tf:"اصل انسداد",w:"Standard; Dretske and Nozick both deny it",q:"epistemic closure principle",
en:"<p>If you know p, and you know that p entails q, then you know q. Stated plainly it sounds almost too obvious to name.</p><p>It is also the engine of the sceptical argument. You know you have hands; having hands entails not being a handless brain in a vat; so you know you are not one. Since the sceptic denies the conclusion, either closure or the first premise must go — and both are painful to give up.</p>",
