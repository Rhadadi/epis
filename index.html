پیوند می‌دهند نه به امکانِ منطقیِ صرف. بنابراین ایمنی چارچوبی است که به رابطهٔ اصولیِ شباهت نیاز دارد، نه فرمولی آماده."],["می‌توان مواردِ گتیه‌ای ساخت که باور ایمن باشد اما شهوداً معرفت نباشد.","چنین مواردی اصلاح‌هایی مانند شایستگی، پیوندِ تبیینی یا شروطِ قوی‌ترِ ضدشانس را برمی‌انگیزند. قدرتِ ایمنی در تشخیصِ طبقهٔ بزرگی از شانس است، نه اینکه همه آن را به‌تنهایی کافی بدانند."]],"confuse":[["حساسیت","ایمنی روشِ تولیدِ باور را ثابت می‌گیرد و می‌پرسد آیا باورِ کاذب نزدیک است. حساسیت کاذب‌بودنِ گزاره را ثابت می‌گیرد و می‌پرسد آیا باور ادامه دارد. جهتِ خلاف‌واقع برعکس است."],["اعتمادپذیری","اعتمادپذیری معمولاً نرخِ موفقیتِ آماری یا گرایشیِ یک فرایند در مواردِ متعدد است. ایمنی محلی است: آیا این باور در شرایطِ نزدیک به‌آسانی کاذب می‌شد؟ روشی عموماً قابل‌اعتماد می‌تواند در محیطی غیرعادی باورِ ناایمن بسازد."]],"mistakes":["یکی‌گرفتنِ ایمنی با اطمینانِ زیاد؛ ایمنی دربارهٔ خطرِ وجهی است، نه احساسِ یقینِ شخص.","فقط نگاه‌کردن به جهانِ واقعی؛ تمامِ نکته این است که خطا چقدر به موردِ واقعی نزدیک است."],"check":{"q":"دستگاهِ بیناییِ معمولاً قابل‌اعتماد در منطقه‌ای استفاده می‌شود که ۹۹٪ چیزهای شبیه انبار نما هستند؛ اتفاقاً به تنها انبارِ واقعی نگاه می‌کنید. فرایندِ قابل‌اعتماد یا باورِ ایمن؟","a":"فرایندِ دیداری ممکن است عموماً قابل‌اعتماد باشد، اما این باورِ خاص ناایمن است چون با تغییرِ بسیار کوچکی در محلِ نگاه، همان باور به‌صورت کاذب تولید می‌شد. ایمنی به محیطِ معرفتیِ محلی حساس است."}}},"value":{"en":{"line":"The value problem asks why knowledge is better than merely getting the truth right by luck or by a method that happens to work once.","why":"<p>If true belief already gets you the right answer, what extra value does knowledge add? Plato’s <i>Meno</i> makes the puzzle vivid: a true opinion can guide you to Larissa just as well as knowledge on that trip. Any theory of knowledge should explain why the more demanding state is distinctively worth having.</p>","origin":"The problem begins in Plato’s <i>Meno</i> and has become central in contemporary epistemology through work by Linda Zagzebski, Duncan Pritchard, and others. It pressures reliabilist and anti-luck theories to explain not only when knowledge occurs but why it is more valuable than a true belief produced by the same process.","obj":[["Maybe knowledge has no special value beyond truth; epistemologists are demanding an explanation for a false intuition.","That is possible, but it would revise ordinary and institutional practice, where we value competent, repeatable ways of getting the truth over lucky correctness. The practical distinction between process quality and one-off outcome keeps the problem alive even if the word 'knowledge' is abandoned."],["If reliability adds value, why is knowledge more valuable than a true belief produced by a reliable process?","This is the 'swamping' problem: once truth is obtained, the extra value of reliability can appear swallowed up. Virtue theories answer by locating value in successful cognitive agency—truth because of competence—rather than in truth plus a separable reliable property."]],"confuse":[["Value of truth","The question is not why truth is valuable; it is why <i>knowledge</i> has value over and above a merely true belief."],["Confidence","A highly confident true belief can still be lucky. The value problem concerns the quality of the epistemic achievement, not the strength of the feeling."]],"mistakes":["Answering only 'because knowledge is true'—the comparison case is already stipulated to be true.","Treating a correct outcome as proof of a valuable method; one lucky hit is exactly what the problem asks you to distinguish from knowledge."],"check":{"q":"Two analysts make the same correct forecast. One used a robust method; the other guessed. Today’s decision is identical. What is the Meno-style reason to prefer the first?","a":"The first success is tied to a method or competence that can guide future cases; the second is detachable luck. The value problem asks a theory of knowledge to explain that extra value rather than merely assert it."}},"fa":{"line":"مسئلهٔ ارزش می‌پرسد چرا معرفت از صرفاً درست‌درآمدنِ یک باور — از روی شانس یا روشی که یک بار جواب داده — بهتر است.","why":"<p>اگر باورِ صادق از پیش پاسخِ درست را به شما می‌دهد، معرفت چه ارزشِ اضافه‌ای دارد؟ <i>منون</i> افلاطون مسئله را روشن می‌کند: نظرِ صادق می‌تواند در همان سفر به لاریسا به‌اندازهٔ معرفت راهنمای شما باشد. هر نظریهٔ معرفت باید توضیح دهد چرا حالتِ دشوارتر به‌طور متمایز ارزشمند است.</p>","origin":"مسئله از <i>منون</i> افلاطون آغاز می‌شود و در معرفت‌شناسیِ معاصر با کارِ لیندا زاگزبسکی، دانکن پریچارد و دیگران مرکزی شده است. نظریه‌های اعتمادپذیری و ضدشانس را وادار می‌کند نه‌فقط بگویند معرفت چه وقت رخ می‌دهد، بلکه چرا از باورِ صادقی که همان فرایند تولید کرده ارزشمندتر است.","obj":[["شاید معرفت هیچ ارزشِ ویژه‌ای ورای حقیقت ندارد و معرفت‌شناسان از شهودی نادرست توضیح می‌خواهند.","ممکن است، اما این موضع عملِ عادی و نهادی را بازنگری می‌کند؛ ما راه‌های شایسته و تکرارپذیرِ رسیدن به حقیقت را بیش از درست‌بودنِ خوش‌شانس ارزش می‌گذاریم. تمایزِ عملیِ کیفیتِ فرایند و نتیجهٔ یک‌باره حتی اگر واژهٔ «معرفت» را کنار بگذاریم باقی می‌ماند."],["اگر اعتمادپذیری ارزش می‌افزاید، چرا معرفت از باورِ صادقی که فرایندی قابل‌اعتماد ساخته ارزشمندتر است؟","این مسئلهٔ «بلعیده‌شدن» است: وقتی حقیقت به دست آمده، ارزشِ اضافهٔ اعتمادپذیری ممکن است در حقیقت بلعیده شود. نظریه‌های فضیلت پاسخ را در عاملیتِ شناختیِ موفق می‌گذارند — حقیقت به‌سببِ شایستگی — نه حقیقت به‌اضافهٔ ویژگیِ جداگانه‌ای به نام اعتمادپذیری."]],"confuse":[["ارزشِ حقیقت","پرسش این نیست که چرا حقیقت ارزشمند است؛ پرسش این است که چرا <i>معرفت</i> ورای یک باورِ صرفاً صادق ارزشِ اضافه دارد."],["اطمینان","باورِ صادقِ بسیار مطمئن همچنان می‌تواند خوش‌شانس باشد. مسئلهٔ ارزش دربارهٔ کیفیتِ دستاوردِ معرفتی است، نه شدتِ احساس."]],"mistakes":["پاسخ‌دادنِ صرف با «چون معرفت صادق است»؛ موردِ مقایسه از پیش صادق فرض شده است.","نتیجهٔ درست را اثباتِ روشِ ارزشمند دانستن؛ یک موفقیتِ شانسی دقیقاً چیزی است که مسئله می‌خواهد از معرفت جدا کند."],"check":{"q":"دو تحلیلگر همان پیش‌بینیِ درست را می‌کنند. یکی از روشی مقاوم استفاده کرده و دیگری حدس زده. تصمیمِ امروز یکسان است. دلیلِ منون‌وار برای ترجیحِ اولی چیست؟","a":"موفقیتِ اول به روش یا شایستگی‌ای وصل است که می‌تواند مواردِ آینده را نیز راهنمایی کند؛ دومی شانسِ جداشدنی است. مسئلهٔ ارزش از نظریهٔ معرفت می‌خواهد این ارزشِ اضافه را توضیح دهد، نه فقط اعلام کند."}}},"evid":{"en":{"line":"Evidentialism says your belief is justified exactly to the extent that it fits the evidence you possess.","why":"<p>Evidentialism gives an intuitive internalist answer to “what makes belief rational?”: believe according to your evidence. It separates epistemic evaluation from whether the world cooperates—two agents with the same evidence have the same epistemic obligations even if only one happens to be right.</p>","origin":"The contemporary formulation is associated especially with Earl Conee and Richard Feldman. It develops a long evidentialist tradition while contrasting with reliabilism, which makes justification depend on the objective reliability of the process whether or not the subject can access that fact.","obj":[["Children and animals seem to know things without possessing evidence in a reflective, articulable sense.","Evidentialists can broaden evidence beyond propositions one can state: perceptual experiences, seemings, and memory states can be evidence. The objection bites against overly intellectualized versions, not necessarily against the core fit-with-evidence idea."],["A perfectly conscientious person with misleading evidence can be justified while systematically wrong. Why call that epistemically good?","Evidentialism distinguishes justification from truth-conduciveness. It evaluates what is rational from the subject’s perspective. Externalists argue this gives too much credit to systematically unreliable worlds; evidentialists reply that blameworthiness and rationality should not depend on facts inaccessible to the agent."]],"confuse":[["Evidence and truth","Strong evidence can support a false proposition. Evidentialism is a theory of justification, not a guarantee that justified beliefs are true."],["Reliabilism","Evidentialism asks whether the belief fits the evidence available to the subject; reliabilism asks whether the process that produced it tends to yield truth."]],"mistakes":["Defining evidence only as explicit data or arguments and excluding experience itself.","Assuming more evidence always means more justification; new evidence can undercut old evidence or support a rival hypothesis more strongly."],"check":{"q":"Two analysts have exactly the same dataset and background information but live in different worlds where the data-generating process differs. According to evidentialism, can one be more justified solely because her hidden world is friendlier?","a":"No. If their evidence is genuinely the same, evidentialism gives them the same justificatory status. The difference in hidden reliability matters to an externalist, not to evidential fit as such."}},"fa":{"line":"شاهدگرایی می‌گوید باورِ شما دقیقاً به اندازه‌ای موجه است که با شواهدی که در اختیار دارید متناسب باشد.","why":"<p>شاهدگرایی پاسخی درون‌گرایانه و شهودی به «چه چیزی باور را عقلانی می‌کند؟» می‌دهد: متناسب با شواهد باور کن. ارزیابیِ معرفتی را از همکاریِ جهان جدا می‌کند — دو عامل با شواهدِ یکسان تعهداتِ معرفتیِ یکسان دارند حتی اگر فقط یکی اتفاقاً درست باشد.</p>","origin":"صورت‌بندیِ معاصر به‌ویژه با ارل کُنی و ریچارد فلدمن پیوند دارد. سنتی طولانی از شاهدگرایی را ادامه می‌دهد و در برابر اعتمادگرایی قرار می‌گیرد که توجیه را به اعتمادپذیریِ عینیِ فرایند وابسته می‌کند، خواه عامل به این واقعیت دسترسی داشته باشد یا نه.","obj":[["کودکان و حیوانات ظاهراً چیزهایی می‌دانند بی‌آنکه شاهدی به معنای بازتابی و قابل‌بیان داشته باشند.","شاهدگرا می‌تواند مفهومِ شاهد را فراتر از گزاره‌های قابل‌بیان ببرد: تجربهٔ ادراکی، نمود و حالتِ حافظه می‌توانند شاهد باشند. اعتراض نسخه‌های بیش از حد عقلانی‌شده را می‌زند، نه لزوماً اصلِ «تناسب با شاهد» را."],["شخصی کاملاً وظیفه‌شناس با شواهدِ گمراه‌کننده می‌تواند موجه اما به‌طور نظام‌مند غلط باشد. چرا این را از نظر معرفتی خوب بدانیم؟","شاهدگرایی توجیه را از حقیقت‌یاری جدا می‌کند و عقلانیت را از منظرِ فاعل می‌سنجد. برون‌گرایان می‌گویند این به جهان‌های شدیداً نامطمئن اعتبارِ زیادی می‌دهد؛ شاهدگرایان پاسخ می‌دهند سرزنش‌پذیری و عقلانیت نباید به واقعیت‌هایی وابسته باشند که برای عامل دسترس‌ناپذیرند."]],"confuse":[["شاهد و حقیقت","شاهدِ قوی می‌تواند از گزاره‌ای کاذب پشتیبانی کند. شاهدگرایی نظریه‌ای دربارهٔ توجیه است، نه تضمینی برای صدقِ باورهای موجه."],["اعتمادگرایی","شاهدگرایی می‌پرسد باور با شواهدِ در دسترسِ فاعل می‌خواند یا نه؛ اعتمادگرایی می‌پرسد فرایندِ سازندهٔ باور معمولاً حقیقت تولید می‌کند یا نه."]],"mistakes":["محدودکردنِ شاهد به داده یا استدلالِ صریح و کنارگذاشتنِ خودِ تجربه.","فرض‌کردنِ اینکه شاهدِ بیشتر همیشه توجیهِ بیشتر می‌دهد؛ شاهدِ تازه می‌تواند شاهدِ قبلی را زیر بزند یا از فرضیهٔ رقیب قوی‌تر حمایت کند."],"check":{"q":"دو تحلیلگر دقیقاً همان داده و اطلاعاتِ پس‌زمینه را دارند اما در دو جهانِ متفاوت زندگی می‌کنند که فرایندِ واقعیِ تولیدِ داده فرق دارد. در شاهدگرایی آیا یکی فقط چون جهانِ پنهانش مساعدتر است موجه‌تر است؟","a":"نه. اگر شواهد واقعاً یکسان باشند، شاهدگرایی همان وضعیتِ توجیهی را می‌دهد. تفاوتِ اعتمادپذیریِ پنهان برای برون‌گرا مهم است، نه برای تناسبِ شاهدی به‌خودیِ خود."}}},"reliab":{"en":{"line":"Reliabilism grounds justification in the objective truth-conduciveness of the process that produced the belief, even if the believer cannot explain that process.","why":"<p>Gettier and animal knowledge both pressure the idea that justification must consist in reasons available to reflection. Reliabilism externalizes the condition: vision, memory, or another process can justify because it reliably produces true beliefs, not because the subject can supply an argument that it does.</p>","origin":"Alvin Goldman’s work is central to process reliabilism. The view is a flagship form of epistemic externalism and a response to overly intellectualized accounts of justification. It tries to connect epistemic status directly to truth-conducive cognitive functioning.","obj":[["The generality problem: is the relevant process 'vision,' 'vision at dusk,' or 'vision at dusk in fog while tired'? Reliability changes with the description.","This is the classic unresolved pressure. Reliabilists try to individuate process types by psychologically real mechanisms or normal operating conditions, but there is no universally accepted rule. The objection shows reliability needs a principled reference class."],["A clairvoyant process could be objectively reliable while the subject has overwhelming evidence that clairvoyance is nonsense. Would the resulting belief be justified?","Simple reliabilism can give the wrong verdict. More sophisticated versions add defeater or proper-function conditions: reliability may be necessary, but accessible evidence against one’s method can remove justification."]],"confuse":[["Reliability and infallibility","A reliable process can make mistakes. The claim is a sufficiently high tendency toward truth, not certainty in every case."],["Safety","Reliability evaluates a process across a class of cases; safety evaluates whether this particular belief could easily have been false in nearby circumstances."]],"mistakes":["Using an arbitrarily convenient reference class to declare a process reliable.","Ignoring known defeaters: a reliable instrument that you know is currently malfunctioning should not automatically justify its reading."],"check":{"q":"A model class has a strong long-run record, but you have concrete evidence that today’s input pipeline is corrupted. Does bare process reliabilism automatically license the output?","a":"A very simple version may, which exposes the problem. A defensible reliabilist account must accommodate defeaters or specify the relevant process narrowly enough that “model-plus-corrupted-pipeline” is not reliable."}},"fa":{"line":"اعتمادگرایی توجیه را در حقیقت‌یاریِ عینیِ فرایندی می‌گذارد که باور را ساخته، حتی اگر باورکننده نتواند آن فرایند را توضیح دهد.","why":"<p>گتیه و معرفتِ حیوانی هر دو این ایده را تحت فشار می‌گذارند که توجیه باید از دلایلی تشکیل شود که برای بازتابِ آگاهانه در دسترس‌اند. اعتمادگرایی شرط را بیرونی می‌کند: دیدن، حافظه یا فرایندی دیگر می‌تواند چون به‌طور قابل‌اعتماد باورِ صادق تولید می‌کند توجیه‌بخش باشد، نه چون عامل می‌تواند برای اعتمادپذیری‌اش استدلال بدهد.</p>","origin":"کارِ آلوین گلدمن در اعتمادگراییِ فرایندی مرکزی است. این موضع نمونهٔ شاخصِ برون‌گراییِ معرفتی و پاسخی به تحلیل‌های بیش از حد عقلانی‌شدهٔ توجیه است. می‌کوشد شأنِ معرفتی را مستقیم به کارکردِ شناختیِ حقیقت‌یار وصل کند.","obj":[["مسئلهٔ کلیت: فرایندِ مربوط «بینایی» است، «بینایی در غروب» یا «بینایی در غروبِ مه‌آلود هنگامِ خستگی»؟ اعتمادپذیری با توصیف عوض می‌شود.","این فشارِ کلاسیک هنوز حلِ قطعی ندارد. اعتمادگرایان می‌کوشند نوعِ فرایند را با سازوکارهای روان‌شناختیِ واقعی یا شرایطِ عادیِ کارکرد مشخص کنند، اما قاعدهٔ موردِ توافقی وجود ندارد. اعتراض نشان می‌دهد اعتمادپذیری به طبقهٔ مرجعِ اصولی نیاز دارد."],["فرایندِ روشن‌بینی می‌تواند عیناً قابل‌اعتماد باشد در حالی که عامل شواهدِ بسیار قوی دارد که روشن‌بینی چرند است. آیا باورِ حاصل موجه است؟","اعتمادگراییِ ساده ممکن است حکمِ نادرست بدهد. نسخه‌های پیچیده‌تر شرطِ ابطال‌کننده یا کارکردِ درست را اضافه می‌کنند: اعتمادپذیری شاید لازم باشد، اما شاهدِ در دسترس علیه روش می‌تواند توجیه را از بین ببرد."]],"confuse":[["اعتمادپذیری و خطاناپذیری","فرایندِ قابل‌اعتماد می‌تواند خطا کند. ادعا گرایشِ کافی به حقیقت است، نه یقین در هر مورد."],["ایمنی","اعتمادپذیری فرایند را در یک طبقه از موارد ارزیابی می‌کند؛ ایمنی می‌سنجد آیا همین باورِ خاص در شرایطِ نزدیک به‌آسانی کاذب می‌شد یا نه."]],"mistakes":["انتخابِ طبقهٔ مرجعِ دلخواه برای قابل‌اعتماد اعلام‌کردنِ فرایند.","نادیده‌گرفتنِ ابطال‌کننده‌های شناخته‌شده: ابزارِ قابل‌اعتمادی که می‌دانید اکنون خراب است نباید خودکار خوانشِ خود را موجه کند."],"check":{"q":"یک خانوادهٔ مدل در بلندمدت کارنامهٔ قوی دارد، اما شاهدِ مشخصی دارید که خطِ ورودیِ امروز خراب است. آیا اعتمادگراییِ خام خودکار خروجی را مجاز می‌کند؟","a":"نسخهٔ بسیار ساده شاید چنین کند و همین مشکل را آشکار می‌کند. نظریهٔ دفاع‌پذیر باید ابطال‌کننده‌ها را جا دهد یا فرایندِ مربوط را چنان دقیق تعریف کند که «مدل به‌اضافهٔ خطِ ورودیِ خراب» قابل‌اعتماد نباشد."}}},"corr":{"en":{"line":"A proposition is true when reality is as the proposition says it is: truth consists in a correspondence between truth-bearer and world.","why":"<p>Knowledge requires truth, so a natural question is what makes a proposition true. Correspondence theory gives the realist answer: beliefs and sentences do not become true because they are coherent, useful, or accepted; they are true because the world has the relevant facts or states of affairs.</p>","origin":"The idea is ancient and commonly linked to Aristotle; modern versions run through Russell and formal work such as Tarski’s semantic conception. The main pressure is not the ordinary intuition but the metaphysics: what exactly are facts, truth-makers, and the correspondence relation for abstract, modal, negative, or statistical claims?","obj":[["What exactly does a sentence 'correspond' to, especially for claims like 'there are no unicorns' or 'inflation expectations rose'?","Defenders need not posit a picture-like matching relation. Modern correspondence views can say truth depends on how the world is—its objects, properties, relations, absences, or truth-making conditions—without requiring each sentence to map to a single concrete object."],["We cannot step outside our language and beliefs to compare them with reality 'as it is in itself.'","That is an epistemic objection to our access, not yet a metaphysical objection to what truth is. A correspondence theorist can be fallibilist about knowing the match while still holding that the match, not our confidence, makes the claim true."]],"confuse":[["Correspondence theory and direct realism","Correspondence is a theory of truth; direct realism is a theory of perception. You can believe truth corresponds to reality while thinking perception reaches it only indirectly."],["Truth and verification","A proposition may be true even when nobody can currently verify it. Correspondence does not define truth by our test for truth."]],"mistakes":["Imagining correspondence must be a literal one-to-one resemblance between sentence and object.","Using 'it corresponds with the data' as if data agreement alone settled truth; data themselves can be noisy, selective, or theory-laden."],"check":{"q":"A perfectly coherent economic model says unemployment is 4%, but the actual population state makes the relevant statistic 6%. What does correspondence theory say?","a":"The 4% proposition is false despite coherence. What makes the proposition true or false is the relevant worldly state, not its fit with the rest of the model."}},"fa":{"line":"یک گزاره زمانی صادق است که واقعیت همان‌گونه باشد که گزاره می‌گوید؛ حقیقت در نوعی مطابقت میان حاملِ صدق و جهان است.","why":"<p>معرفت به حقیقت نیاز دارد، پس پرسشِ طبیعی این است که چه چیزی گزاره را صادق می‌کند. نظریهٔ مطابقت پاسخِ واقع‌گرایانه می‌دهد: باور و جمله به‌سببِ انسجام، سودمندی یا پذیرش صادق نمی‌شوند؛ به‌سببِ آن صادق‌اند که جهان واقعاً واقعیت یا وضعیتِ مربوط را دارد.</p>","origin":"ایده باستانی است و معمولاً به ارسطو پیوند داده می‌شود؛ صورت‌های جدید از راسل تا کارِ صوریِ تارسکی امتداد دارند. فشارِ اصلی نه بر شهودِ روزمره بلکه بر متافیزیکِ آن است: واقعیت، حقیقت‌ساز و رابطهٔ مطابقت برای ادعاهای انتزاعی، وجهی، سلبی یا آماری دقیقاً چیست؟","obj":[["یک جمله دقیقاً با چه چیزی «مطابقت» می‌کند، به‌ویژه در ادعاهایی مانند «تک‌شاخ وجود ندارد» یا «انتظارات تورمی بالا رفت»؟","مدافع لازم نیست رابطه‌ای تصویری و یک‌به‌یک بسازد. نسخه‌های جدید می‌توانند بگویند حقیقت به چگونگیِ جهان — اشیا، خواص، روابط، نبودها یا شرایطِ حقیقت‌ساز — وابسته است بی‌آنکه هر جمله به یک شیء ملموس نگاشت شود."],["ما نمی‌توانیم بیرون از زبان و باورهایمان بایستیم و آن‌ها را با واقعیتِ «فی‌نفسه» مقایسه کنیم.","این نخست اعتراض به دسترسیِ معرفتیِ ماست، نه لزوماً به ماهیتِ حقیقت. نظریه‌پردازِ مطابقت می‌تواند دربارهٔ شناختِ این رابطه خطاپذیر باشد و همچنان بگوید خودِ رابطه، نه اطمینانِ ما، گزاره را صادق می‌کند."]],"confuse":[["نظریهٔ مطابقت و واقع‌گراییِ مستقیم","مطابقت نظریه‌ای دربارهٔ حقیقت است؛ واقع‌گراییِ مستقیم نظریه‌ای دربارهٔ ادراک. می‌توان حقیقت را مطابقِ واقع دانست و در عین حال ادراک را غیرمستقیم دانست."],["حقیقت و راستی‌آزمایی","گزاره ممکن است صادق باشد حتی اگر اکنون هیچ‌کس نتواند آن را راستی‌آزمایی کند. مطابقت حقیقت را با آزمونِ ما برای حقیقت تعریف نمی‌کند."]],"mistakes":["تصورِ اینکه مطابقت باید شباهتِ لفظ‌به‌شیءِ کاملاً یک‌به‌یک باشد.","استفاده از «با داده جور است» به‌عنوان پایانِ مسئله؛ خودِ داده می‌تواند پرنویز، گزینشی یا نظریه‌بار باشد."],"check":{"q":"مدلی کاملاً منسجم می‌گوید بیکاری ۴٪ است، اما وضعیتِ واقعیِ جمعیت آمارِ مربوط را ۶٪ می‌کند. نظریهٔ مطابقت چه می‌گوید؟","a":"گزارهٔ ۴٪ با وجودِ انسجام کاذب است. آنچه گزاره را صادق یا کاذب می‌کند وضعیتِ مربوط در جهان است، نه هماهنگی‌اش با بقیهٔ مدل."}}},"cohtruth":{"en":{"line":"On a coherence theory of truth, a proposition is true insofar as it belongs to the maximally coherent system of beliefs or propositions.","why":"<p>Correspondence invites the question of how beliefs can be compared with a reality outside the belief system. Coherence theories answer by locating truth in systematic fit: consistency, mutual implication, and explanatory integration within the best overall system.</p>","origin":"The view is associated with idealist traditions including F.H. Bradley and Brand Blanshard. It is attractive where truth seems internal to a formal or conceptual system, but it faces a severe realist challenge: more than one internally coherent system can describe incompatible worlds.","obj":[["Two incompatible systems could each be internally coherent. They cannot both be true in the same respect.","This is the classic multiplicity objection. A strong coherence theorist must require a uniquely maximal system incorporating the totality of experience, not merely local consistency. Critics doubt uniqueness can be secured without smuggling in correspondence constraints."],["A coherent delusion remains a delusion.","Defenders answer that genuine coherence is global and experience-constrained, not just a tidy story. But the reply shows why coherence theory of truth tends to drift toward a coherence theory of justification rather than a standalone account of truth."]],"confuse":[["Coherentism about justification","A belief may be justified because it coheres with your evidence even if truth itself is correspondence. The two coherence theses answer different questions."],["Consistency","Consistency is only absence of contradiction. Coherence is richer: explanatory integration, inferential support, scope, and fit across the system."]],"mistakes":["Treating a small internally consistent model as if it thereby made its assumptions true.","Using coherence as a substitute for external validation when rival coherent systems fit the same evidence."],"check":{"q":"Two macro models are internally coherent and both fit the observed sample, but imply opposite counterfactual policies. Why is that especially hard for a coherence theory of truth?","a":"Because internal coherence does not select between incompatible coherent systems. The theory needs a principled story about total-system coherence or some reality constraint; otherwise both look equally truth-conferring."}},"fa":{"line":"در نظریهٔ انسجامیِ حقیقت، یک گزاره به اندازه‌ای صادق است که عضوی از منسجم‌ترین نظامِ کلیِ باورها یا گزاره‌ها باشد.","why":"<p>مطابقت این پرسش را پیش می‌آورد که باورها چگونه با واقعیتی بیرون از نظامِ باور مقایسه می‌شوند. نظریه‌های انسجام پاسخ را در برازشِ نظام‌مند می‌گذارند: سازگاری، دلالتِ متقابل و یکپارچگیِ تبیینی در بهترین نظامِ کلی.</p>","origin":"دیدگاه با سنت‌های ایدئالیستی از جمله اف.اچ. بردلی و برند بلنشارد پیوند دارد. در حوزه‌هایی که حقیقت درونِ یک نظامِ صوری یا مفهومی به نظر می‌رسد جذاب است، اما چالشِ واقع‌گرایانهٔ سختی دارد: بیش از یک نظامِ درونیِ منسجم می‌تواند جهان‌های ناسازگار را توصیف کند.","obj":[["دو نظامِ ناسازگار می‌توانند هر دو از درون منسجم باشند؛ نمی‌توانند در یک معنا هر دو صادق باشند.","این اعتراضِ کلاسیکِ تکثر است. نظریهٔ قوی باید نظامی یکتای حداکثرمنسجم بخواهد که تمامِ تجربه را دربر گیرد، نه فقط سازگاریِ محلی. منتقدان تردید دارند این یکتایی بدون واردکردنِ پنهانیِ قیدهای مطابقت حاصل شود."],["توهمِ منسجم همچنان توهم است.","مدافعان پاسخ می‌دهند انسجامِ واقعی کلی و مقید به تجربه است، نه صرفاً داستانی مرتب. اما همین پاسخ نشان می‌دهد چرا نظریهٔ انسجامیِ حقیقت اغلب به نظریهٔ انسجامیِ توجیه نزدیک می‌شود، نه توضیحی مستقل از حقیقت."]],"confuse":[["انسجام‌گرایی دربارهٔ توجیه","باور می‌تواند چون با شواهدِ شما منسجم است موجه باشد، در حالی که خودِ حقیقت را مطابقت بدانید. این دو تزِ انسجامی به دو پرسشِ متفاوت پاسخ می‌دهند."],["سازگاری","سازگاری فقط نبودِ تناقض است. انسجام غنی‌تر است: یکپارچگیِ تبیینی، پشتیبانیِ استنتاجی، دامنه و برازش در کلِ نظام."]],"mistakes":["این پندار که مدلِ کوچکِ سازگار از درون، به همین دلیل فرض‌هایش را صادق می‌کند.","جایگزین‌کردنِ اعتبارسنجیِ بیرونی با انسجام وقتی چند نظامِ منسجمِ رقیب همان شواهد را برازش می‌کنند."],"check":{"q":"دو مدلِ کلان از درون منسجم‌اند و هر دو نمونهٔ مشاهده‌شده را برازش می‌کنند، اما سیاست‌های خلاف‌واقعِ متضاد می‌دهند. چرا این برای نظریهٔ انسجامیِ حقیقت سخت است؟","a":"چون انسجامِ درونی میان نظام‌های ناسازگار انتخاب نمی‌کند. نظریه باید داستانی اصولی دربارهٔ انسجامِ کل یا قیدی از واقعیت بدهد؛ وگرنه هر دو به یک اندازه حقیقت‌ساز به نظر می‌رسند."}}},"prag":{"en":{"line":"Pragmatic theories connect truth to successful inquiry and practical consequences: what proves itself in disciplined experience, or what inquiry would converge on, is central to truth.","why":"<p>The pragmatic tradition rejects the idea that truth is useful only as a static relation between sentence and world. Beliefs are tools inside inquiry. Their meaning and epistemic significance emerge in the consequences of acting, testing, and revising over time.</p>","origin":"C.S. Peirce, William James, and John Dewey developed different pragmatic views. Peirce emphasizes the ideal limit of inquiry; James emphasizes the practical “cash value” of belief; Dewey emphasizes warranted assertibility and inquiry. Treating them as one slogan—“truth is whatever works”—flattens important differences.","obj":[["Useful falsehoods exist, and many truths are useless. So 'works' cannot mean 'is true.'","Pragmatists reply that mere short-run usefulness is not the criterion. The relevant success is durable success under open-ended inquiry, experience, and correction. A comforting falsehood may work locally but fail when consequences accumulate."],["If truth is what inquiry would ultimately converge on, what if inquiry never converges or humans disappear first?","Peircean versions treat the limit normatively rather than as a prediction about actual history. Critics argue this still makes truth too dependent on an idealized epistemic process instead of reality itself."]],"confuse":[["Pragmatic truth and expediency","A claim is not true merely because believing it is convenient or motivating. Serious pragmatic accounts build in disciplined inquiry and long-run consequences."],["Instrumentalism","Instrumentalism can treat theories as useful predictive devices without calling their unobservable claims literally true. Pragmatism is a broader account of truth or warranted assertion."]],"mistakes":["Reducing James or Peirce to 'if it is useful, it is true.'","Using one successful application as proof of truth without asking whether the success survives wider tests and rival explanations."],"check":{"q":"A false but morale-boosting forecast improves a team’s effort for one quarter. Does that make it true on a serious pragmatic theory?","a":"No. Short-run utility is not enough. The belief must survive disciplined inquiry and the broader consequences of experience; a claim that works only by masking reality is exactly what longer-run inquiry should expose."}},"fa":{"line":"نظریه‌های پراگماتیستی حقیقت را به پژوهشِ موفق و پیامدهای عملی وصل می‌کنند: آنچه در تجربهٔ منضبط خود را اثبات می‌کند، یا آنچه پژوهش در نهایت بر آن همگرا می‌شود، برای حقیقت مرکزی است.","why":"<p>سنتِ پراگماتیستی این تصور را رد می‌کند که حقیقت فقط رابطه‌ای ایستا میان جمله و جهان است. باورها ابزارهایی درونِ پژوهش‌اند و معنا و شأنِ معرفتی‌شان در پیامدهای عمل، آزمون و بازنگری در طول زمان آشکار می‌شود.</p>","origin":"سی.اس. پیرس، ویلیام جیمز و جان دیویی نسخه‌های متفاوتی ساختند. پیرس بر حدِ ایده‌آلِ پژوهش، جیمز بر «ارزشِ نقدی» عملیِ باور، و دیویی بر قابلیتِ اظهارِ موجه و پژوهش تأکید دارد. فروکاستنِ همه به شعارِ «حقیقت چیزی است که جواب می‌دهد» تفاوت‌های مهم را محو می‌کند.","obj":[["دروغ‌های مفید وجود دارند و بسیاری از حقایق بی‌فایده‌اند؛ پس «جواب‌دادن» نمی‌تواند همان «صادق‌بودن» باشد.","پراگماتیست پاسخ می‌دهد سودمندیِ کوتاه‌مدت معیار نیست. موفقیتِ مربوط باید در پژوهشِ باز، تجربه و اصلاح در طول زمان پایدار باشد. دروغِ آرامش‌بخش شاید محلی جواب دهد اما با انباشته‌شدنِ پیامدها شکست می‌خورد."],["اگر حقیقت چیزی است که پژوهش در نهایت بر آن همگرا می‌شود، اگر پژوهش هرگز همگرا نشود یا انسان‌ها پیش از آن از میان بروند چه؟","نسخهٔ پیرسی حد را هنجاری می‌فهمد، نه پیش‌بینیِ واقعی دربارهٔ تاریخ. منتقد می‌گوید با این حال حقیقت بیش از حد به فرایندِ معرفتیِ آرمانی وابسته می‌شود تا خودِ واقعیت."]],"confuse":[["حقیقتِ پراگماتیستی و مصلحت","ادعا فقط چون باورکردنش راحت یا انگیزه‌بخش است صادق نمی‌شود. نسخه‌های جدی پژوهشِ منضبط و پیامدهای بلندمدت را شرط می‌کنند."],["ابزارگرایی","ابزارگرایی می‌تواند نظریه را ابزارِ مفیدِ پیش‌بینی بداند بی‌آنکه ادعاهای نامشهودش را حقیقتِ تحت‌اللفظی بداند. پراگماتیسم نظریه‌ای گسترده‌تر دربارهٔ حقیقت یا اظهارِ موجه است."]],"mistakes":["فروکاستنِ جیمز یا پیرس به «اگر مفید است، صادق است».","اثباتِ حقیقت با یک کاربردِ موفق بدون پرسیدن اینکه موفقیت در آزمون‌های گسترده‌تر و برابرِ تبیین‌های رقیب دوام می‌آورد یا نه."],"check":{"q":"پیش‌بینی‌ای کاذب اما روحیه‌بخش یک فصل تلاشِ تیم را بهتر می‌کند. آیا در نظریهٔ پراگماتیستیِ جدی همین آن را صادق می‌کند؟","a":"نه. سودِ کوتاه‌مدت کافی نیست. باور باید از پژوهشِ منضبط و پیامدهای گستردهٔ تجربه جان به در ببرد؛ ادعایی که فقط با پوشاندنِ واقعیت جواب می‌دهد دقیقاً چیزی است که پژوهشِ طولانی‌تر باید آشکار کند."}}},"defl":{"en":{"line":"Deflationism says “is true” does not name a deep property; saying “it is true that p” is, in the basic cases, just another way of asserting p.","why":"<p>Traditional theories ask for the nature of truth—correspondence, coherence, or practical success. Deflationists suspect the question is overinflated. The truth predicate performs logical and linguistic jobs, especially generalization, without requiring a substantial metaphysical property called Truth.</p>","origin":"The family includes Ramsey’s redundancy idea, Quine’s disquotational use of truth, and Horwich’s minimalist theory. The key schema is that “<i>p</i> is true” is equivalent to <i>p</i>. The predicate becomes useful when we cannot conveniently assert every proposition individually, as in “everything the witness said is true.”","obj":[["If truth is thin, how can truth be the aim of inquiry or explain why true belief is valuable?","Deflationists separate the expressive role of the truth predicate from substantive epistemic norms. Inquiry can aim at believing <i>p</i> when <i>p</i>, without truth needing to be a heavyweight property. Critics argue the thin account struggles to explain truth’s normative role."],["Correspondence intuitions seem unavoidable: 'snow is white' is true because snow is white.","The deflationist embraces the biconditional but denies it reveals a common relation requiring further analysis. The right explanation stops with each instance rather than positing an additional correspondence entity or property."]],"confuse":[["Deflationism and relativism","Deflationism does not say truth varies by person or framework. It says the truth predicate is metaphysically thin."],["Deflationism and skepticism","A thin theory of truth says little about whether we can know which propositions are true. It is not a skeptical thesis."]],"mistakes":["Concluding that deflationism says truth is unimportant; it says the property is theoretically thin, not that true belief lacks importance.","Thinking 'true' is literally dispensable in every sentence; generalizations and semantic ascent give the predicate real expressive work."],"check":{"q":"Why is “everything in this report is true” useful if “p is true” adds nothing to p in each individual case?","a":"Because the truth predicate lets you endorse many propositions at once without listing or even being able to formulate each one. Deflationism calls that logical-expressive role real while denying a deep metaphysical property is needed."}},"fa":{"line":"کمینه‌گرایی می‌گوید «صادق است» نامِ خاصیتی عمیق نیست؛ گفتنِ «صادق است که p» در مواردِ پایه فقط راهی دیگر برای اظهارِ p است.","why":"<p>نظریه‌های سنتی ماهیتِ حقیقت را می‌پرسند — مطابقت، انسجام یا موفقیتِ عملی. کمینه‌گرایان گمان می‌کنند پرسش بیش از حد باد شده است. محمولِ حقیقت کارهای منطقی و زبانی، به‌ویژه تعمیم، انجام می‌دهد بی‌آنکه به خاصیتی متافیزیکی و سنگین به نام «حقیقت» نیاز داشته باشیم.</p>","origin":"این خانواده ایدهٔ افزونگیِ رمزی، کاربردِ نقل‌زدایانهٔ حقیقت نزد کواین و نظریهٔ مینیمالیستیِ هورویچ را دربر می‌گیرد. شمای اصلی این است که «p صادق است» با p هم‌ارز است. محمول وقتی مفید می‌شود که نتوانیم همهٔ گزاره‌ها را جداگانه اظهار کنیم، مانند «هرچه شاهد گفت صادق است».","obj":[["اگر حقیقت این‌قدر نازک است، چگونه هدفِ پژوهش است یا توضیح می‌دهد چرا باورِ صادق ارزش دارد؟","کمینه‌گرا نقشِ بیانیِ محمولِ حقیقت را از هنجارهای معرفتیِ محتوایی جدا می‌کند. پژوهش می‌تواند هدفش این باشد که p را وقتی p است باور کنیم، بی‌آنکه حقیقت خاصیتی سنگین باشد. منتقدان می‌گویند روایتِ نازک برای توضیحِ نقشِ هنجاریِ حقیقت مشکل دارد."],["شهودِ مطابقت اجتناب‌ناپذیر است: «برف سفید است» چون برف سفید است صادق است.","کمینه‌گرا دوشرطی را می‌پذیرد اما انکار می‌کند که رابطه‌ای مشترک و نیازمندِ تحلیلِ بیشتر را آشکار کند. توضیح در هر مصداق متوقف می‌شود و موجودیت یا خاصیتِ اضافیِ مطابقت لازم نیست."]],"confuse":[["کمینه‌گرایی و نسبی‌گرایی","کمینه‌گرایی نمی‌گوید حقیقت با شخص یا چارچوب تغییر می‌کند؛ می‌گوید محمولِ حقیقت از نظر متافیزیکی کم‌بار است."],["کمینه‌گرایی و شکاکیت","نظریهٔ نازکِ حقیقت تقریباً چیزی دربارهٔ امکانِ دانستنِ گزاره‌های صادق نمی‌گوید. تزِ شکاکانه نیست."]],"mistakes":["نتیجه‌گیریِ اینکه کمینه‌گرایی می‌گوید حقیقت مهم نیست؛ می‌گوید خاصیتِ حقیقت از نظر نظری کم‌بار است، نه اینکه باورِ صادق بی‌ارزش است.","تصورِ اینکه واژهٔ «صادق» در هر جمله‌ای قابل‌حذف است؛ تعمیم و صعودِ معنایی کارِ بیانیِ واقعی به آن می‌دهند."],"check":{"q":"اگر «p صادق است» در هر موردِ منفرد چیزی به p اضافه نمی‌کند، چرا جملهٔ «همهٔ مطالبِ این گزارش صادق‌اند» مفید است؟","a":"چون محمولِ حقیقت اجازه می‌دهد شمارِ زیادی گزاره را یک‌جا تأیید کنید بی‌آنکه همه را فهرست یا حتی صورت‌بندی کنید. کمینه‌گرایی این کارکردِ منطقی‌ـ‌بیانی را واقعی می‌داند اما خاصیتِ متافیزیکیِ سنگینی لازم نمی‌بیند."}}},"object":{"en":{"line":"Objectivity asks whether a claim’s truth or warranted status is independent of who judges it; relativism makes that status depend on a framework, standpoint, or standard.","why":"<p>Disagreement often slides from “people use different standards” to “there is no fact of the matter.” This concept exists to separate sociological plurality, epistemic dependence on methods, and metaphysical relativity. The question is not whether perspectives influence inquiry—they do—but whether truth itself varies with perspective.</p>","origin":"Modern debates draw on Kuhn’s work on paradigms, social and historical studies of knowledge, and contemporary defenders and critics of relativism such as Martin Kusch and Paul Boghossian. The syllabus uses this distinction because scientific claims can be framework-dependent in formulation without therefore being merely subjective.","obj":[["Strong relativism appears self-refuting: is 'all truth is relative' itself only relatively true?","Relativists can restrict the thesis to particular domains or replace global truth-relativism with framework-relative justification. The self-refutation objection is strongest against unrestricted global claims, not every contextual or domain-relative view."],["Objectivity is impossible because observation and standards are historically situated.","Dependence of access does not entail dependence of truth. Objectivists can accept theory-ladenness, social influence, and fallibility while still insisting that some claims answer to constraints not created by the evaluator."]],"confuse":[["Objectivity and certainty","A claim can be objective while uncertain and revisable. Objectivity concerns what makes it correct, not how confident we are."],["Relativism and pluralism","Pluralism can allow several useful perspectives on one reality without saying contradictory propositions are equally true relative to each group."]],"mistakes":["Inferring 'standards differ' directly to 'truth is relative.'","Calling any value-laden or model-dependent judgment subjective; explicit standards can still support intersubjective or objective assessment."],"check":{"q":"Two agencies use different thresholds for “material risk” but agree on all underlying probabilities and consequences. Is the disagreement automatically about relative truth?","a":"No. It may be a normative or classificatory disagreement about standards. Relativism about truth would be a much stronger claim—that incompatible propositions are true relative to different frameworks."}},"fa":{"line":"عینیت می‌پرسد آیا صدق یا شأنِ موجهِ یک ادعا مستقل از داور است؛ نسبی‌گرایی آن شأن را وابسته به چارچوب، دیدگاه یا معیار می‌کند.","why":"<p>اختلاف به‌آسانی از «مردم معیارهای متفاوت دارند» به «اصلاً واقعیتی در کار نیست» می‌لغزد. این مفهوم برای جداکردنِ تکثرِ جامعه‌شناختی، وابستگیِ معرفتی به روش‌ها و نسبیتِ متافیزیکی لازم است. پرسش این نیست که دیدگاه‌ها بر پژوهش اثر می‌گذارند — می‌گذارند — بلکه این است که خودِ حقیقت با دیدگاه تغییر می‌کند یا نه.</p>","origin":"بحث‌های جدید از کارِ کوهن دربارهٔ پارادایم‌ها، مطالعاتِ اجتماعی و تاریخیِ دانش و مدافعان و منتقدانِ معاصرِ نسبی‌گرایی مانند مارتین کوش و پال بوگوسیان تغذیه می‌کنند. در برنامهٔ شما این تمایز مهم است چون ادعاهای علمی می‌توانند در صورت‌بندی وابسته به چارچوب باشند بی‌آنکه صرفاً ذهنی شوند.","obj":[["نسبی‌گراییِ قوی ظاهراً خودابطال است: آیا گزارهٔ «همهٔ حقیقت نسبی است» خودش فقط نسبتاً صادق است؟","نسبی‌گرا می‌تواند تز را به حوزه‌هایی خاص محدود کند یا به‌جای نسبیتِ جهانیِ حقیقت، توجیهِ وابسته به چارچوب را بپذیرد. اعتراضِ خودابطال علیه ادعاهای جهانیِ نامحدود قوی است، نه علیه هر دیدگاهِ زمینه‌ای یا حوزه‌نسبی."],["عینیت ناممکن است چون مشاهده و معیارها تاریخی و موقعیت‌مندند.","وابستگیِ دسترسی به وابستگیِ حقیقت نتیجه نمی‌دهد. عینیت‌گرا می‌تواند نظریه‌باربودن، نفوذِ اجتماعی و خطاپذیری را بپذیرد و همچنان بگوید بعضی ادعاها به قیودی پاسخ می‌دهند که داور آن‌ها را خلق نکرده است."]],"confuse":[["عینیت و یقین","ادعا می‌تواند عینی اما نامطمئن و بازنگری‌پذیر باشد. عینیت دربارهٔ چیزی است که آن را درست می‌کند، نه میزانِ اطمینانِ ما."],["نسبی‌گرایی و کثرت‌گرایی","کثرت‌گرایی می‌تواند چند دیدگاهِ مفید نسبت به یک واقعیت را بپذیرد بی‌آنکه بگوید گزاره‌های متناقض برای هر گروه به یک اندازه صادق‌اند."]],"mistakes":["نتیجه‌گرفتنِ مستقیمِ «معیارها فرق دارند» به «حقیقت نسبی است».","ذهنی نامیدنِ هر داوریِ ارزش‌بار یا مدل‌وابسته؛ معیارهای صریح می‌توانند هنوز ارزیابیِ بین‌الاذهانی یا عینی بسازند."],"check":{"q":"دو نهاد آستانه‌های متفاوتی برای «ریسکِ بااهمیت» دارند اما دربارهٔ همهٔ احتمال‌ها و پیامدهای زیربنایی توافق دارند. آیا اختلاف خودکار دربارهٔ حقیقتِ نسبی است؟","a":"نه. ممکن است اختلافی هنجاری یا طبقه‌بندی دربارهٔ معیار باشد. نسبی‌گرایی دربارهٔ حقیقت ادعایی بسیار قوی‌تر است: اینکه گزاره‌های ناسازگار نسبت به چارچوب‌های مختلف صادق باشند."}}},"percep":{"en":{"line":"Perception is a primary source of empirical justification, but its epistemic puzzle is how an experience that can mislead nevertheless gives immediate reason to believe the world is as it appears.","why":"<p>Most empirical knowledge begins with perception, so epistemology cannot require us to prove the senses reliable before using them without generating a regress. Yet illusion, hallucination, and variation in viewpoint show that appearance is not infallible. The problem is to explain defeasible perceptual entitlement.</p>","origin":"Early modern debates run through Locke and Berkeley; twentieth-century work includes sense-data theories, direct realism, and ordinary-language critiques such as Austin. Contemporary epistemology often treats perceptual experience or “seemings” as providing prima facie justification unless defeated.","obj":[["The argument from illusion: if a straight stick can look bent, what you directly experience seems to be an appearance, not the external object itself.","Direct realists deny that veridical perception and illusion must share the same fundamental object. An illusion is a defective case of perceiving an external thing, not evidence that all perception is of an inner sense-datum."],["Hallucination can be subjectively indistinguishable from perception, so how can the same experience justify in one case but not the other?","Internalists may give the subject the same prima facie justification in both cases, while externalists distinguish the successful perceptual relation. The disagreement reveals the internalism/externalism divide rather than eliminating perceptual justification."]],"confuse":[["Perceptual seeming and perceiving","It can seem to you that <i>p</i> without <i>p</i> being true. Perceiving that <i>p</i> is usually factive; a seeming is not."],["Perception and inference","Ordinary perceptual belief need not be consciously inferred from 'I am having an experience.' Many theories treat experience as directly justifying the belief."]],"mistakes":["Demanding certainty from perception; fallible sources can still justify.","Treating every visual output as raw data independent of background expectations, attention, and theory-ladenness."],"check":{"q":"A measurement display looks red, but you learn the room is illuminated by red light. What happened to the perceptual justification?","a":"It is undercut. The experience still occurred, but the new information breaks the link between red-looking and being red. Perception supplies prima facie, defeasible justification, not an indefeasible guarantee."}},"fa":{"line":"ادراک منبعِ اصلیِ توجیهِ تجربی است، اما معمای معرفتی‌اش این است که تجربه‌ای که می‌تواند گمراه کند چگونه با این حال بی‌واسطه دلیلی برای باور به جهانِ ظاهرشده می‌دهد.","why":"<p>بیشترِ معرفتِ تجربی با ادراک آغاز می‌شود؛ اگر پیش از استفاده از حواس اثباتِ اعتمادپذیری‌شان را بخواهیم گرفتارِ تسلسل می‌شویم. اما خطای حسی، توهم و تفاوتِ زاویه نشان می‌دهد ظاهر خطاناپذیر نیست. مسئله توضیحِ مجوزِ ادراکیِ قابل‌ابطال است.</p>","origin":"بحثِ مدرن از لاک و برکلی می‌گذرد؛ در سدهٔ بیستم نظریه‌های دادهٔ حسی، واقع‌گراییِ مستقیم و نقدهای زبانِ عادی مانند آستین مهم‌اند. معرفت‌شناسیِ معاصر غالباً تجربه یا «نمود» را توجیهِ ابتدایی می‌داند مگر اینکه ابطال‌کننده‌ای ظاهر شود.","obj":[["استدلال از خطای حسی: اگر چوبِ راست در آب خمیده به نظر می‌رسد، ظاهراً آنچه مستقیماً تجربه می‌کنید یک ظاهر است نه خودِ شیءِ بیرونی.","واقع‌گرای مستقیم انکار می‌کند که ادراکِ صادق و خطا باید یک موضوعِ بنیادیِ مشترک داشته باشند. خطا موردی ناقص از ادراکِ شیءِ بیرونی است، نه دلیل بر اینکه همهٔ ادراک‌ها از دادهٔ حسیِ درونی‌اند."],["توهم می‌تواند از نظر ذهنی از ادراک تشخیص‌ناپذیر باشد؛ پس چگونه همان تجربه در یک مورد توجیه می‌کند و در دیگری نه؟","درون‌گرا می‌تواند در هر دو مورد همان توجیهِ ابتدایی را بدهد، در حالی که برون‌گرا رابطهٔ موفقِ ادراکی را متمایز می‌کند. اختلاف، شکافِ درون‌گرایی/برون‌گرایی را آشکار می‌کند نه اینکه توجیهِ ادراکی را حذف کند."]],"confuse":[["نمودِ ادراکی و ادراکِ واقعی","ممکن است به نظر برسد p بدون اینکه p صادق باشد. «ادراکِ اینکه p» معمولاً صدق‌پذیر است؛ نمود چنین نیست."],["ادراک و استنتاج","باورِ ادراکیِ عادی لازم نیست آگاهانه از «من چنین تجربه‌ای دارم» استنتاج شود. بسیاری از نظریه‌ها تجربه را مستقیماً توجیه‌بخش می‌دانند."]],"mistakes":["مطالبهٔ یقین از ادراک؛ منبعِ خطاپذیر همچنان می‌تواند توجیه کند.","خام و مستقل دانستنِ هر خروجیِ دیداری از انتظارِ پس‌زمینه، توجه و نظریه‌باربودن."],"check":{"q":"نمایشگرِ اندازه‌گیری قرمز به نظر می‌رسد، اما می‌فهمید اتاق با نورِ قرمز روشن شده. چه بر سرِ توجیهِ ادراکی آمد؟","a":"زیر زده شد. تجربه همچنان رخ داده، اما اطلاعاتِ تازه پیوندِ «قرمز به نظر رسیدن» و «قرمز بودن» را می‌شکند. ادراک توجیهِ ابتدایی و قابل‌ابطال می‌دهد، نه تضمینِ شکست‌ناپذیر."}}},"mem":{"en":{"line":"Memory typically preserves justification and knowledge across time, but it can also distort, confabulate, and produce a mere seeming of remembering.","why":"<p>Without memory, almost no extended reasoning or knowledge would survive from one moment to the next. The epistemic problem is whether memory creates new justification or merely carries forward earlier justification, and how to distinguish genuine remembering from a present memory-like experience.</p>","origin":"Thomas Reid treated memory as a basic faculty; later debates ask whether memory is generative or merely preservative of justification. Contemporary work by philosophers such as Sven Bernecker separates remembering from merely seeming to remember and analyzes the dependence of memory on an appropriate past connection.","obj":[["If memory only preserves justification, what justifies a memory whose original evidence has been forgotten?","Preservationists can say the justificatory status is retained even when the original reasons are no longer accessible—the memory trace inherits epistemic status. Internalists find this difficult because the present subject may be unable to cite any current evidence."],["False memories can feel exactly like genuine memories, so phenomenology cannot certify the past connection.","Agreed. Memory is fallible and needs defeaters, corroboration in high-stakes cases, and an appropriate causal or historical relation to the original event. The inability to self-certify does not make the faculty epistemically useless."]],"confuse":[["Remembering and believing from memory","A belief can be caused by a memory impression that is inaccurate or fabricated. Genuine remembering usually requires an appropriate relation to the past fact."],["Memory and testimony","Notes, photographs, and other people’s reports are external records or testimony; memory is an internal cognitive capacity, even though both preserve information through time."]],"mistakes":["Treating vividness or confidence as evidence that a memory is accurate.","Assuming a remembered conclusion remains justified when you now possess a defeater for the original method that produced it."],"check":{"q":"You remember a coefficient estimate but no longer remember the dataset, specification, or whether the result survived robustness checks. What epistemic status does the memory have?","a":"It may preserve the fact that you once believed the estimate, but high confidence in the current number does not recreate the missing grounds. For consequential use, the loss of provenance is a reason to re-check rather than treat memory vividness as evidence."}},"fa":{"line":"حافظه معمولاً توجیه و معرفت را در طول زمان حفظ می‌کند، اما می‌تواند تحریف، داستان‌سازی و صرفاً «به‌یادآوردن‌نما» نیز تولید کند.","why":"<p>بدون حافظه تقریباً هیچ استدلالِ ممتد یا معرفتی از یک لحظه به لحظهٔ بعد دوام نمی‌آورد. مسئلهٔ معرفتی این است که آیا حافظه توجیهِ تازه تولید می‌کند یا فقط توجیهِ قبلی را حمل می‌کند، و چگونه یادآوریِ واقعی را از تجربهٔ فعلیِ شبیه خاطره جدا کنیم.</p>","origin":"توماس رید حافظه را قوّه‌ای پایه می‌دانست؛ بحث‌های بعدی می‌پرسند حافظه توجیه‌زا است یا صرفاً توجیه را حفظ می‌کند. کارِ معاصر، از جمله اسون برنکر، یادآوری را از صرفِ «به نظر رسیدنِ یادآوری» جدا و وابستگیِ حافظه به پیوندِ مناسب با گذشته را تحلیل می‌کند.","obj":[["اگر حافظه فقط توجیه را حفظ می‌کند، خاطره‌ای که شاهدِ اصلی‌اش فراموش شده چگونه موجه است؟","حفظ‌گرایان می‌گویند شأنِ توجیهی می‌تواند بماند حتی وقتی دلیلِ اصلی دیگر در دسترس نیست؛ ردِ حافظه جایگاهِ معرفتی را به ارث می‌برد. این برای درون‌گرایان دشوار است چون فاعلِ فعلی شاید هیچ شاهدِ حاضر نتواند ارائه کند."],["خاطرهٔ کاذب می‌تواند دقیقاً مانند خاطرهٔ واقعی احساس شود؛ پس پدیدارشناسی پیوند با گذشته را تضمین نمی‌کند.","درست است. حافظه خطاپذیر است و در مواردِ مهم به ابطال‌کننده‌ها، تأییدِ مستقل و رابطهٔ علّی یا تاریخیِ مناسب با رویدادِ اولیه نیاز دارد. ناتوانی از خودگواهی، حافظه را از نظر معرفتی بی‌فایده نمی‌کند."]],"confuse":[["یادآوری و باورِ ناشی از حافظه","باور می‌تواند از احساسِ خاطره‌ای ساخته شود که نادرست یا ساختگی است. یادآوریِ واقعی معمولاً رابطهٔ مناسب با واقعیتِ گذشته می‌خواهد."],["حافظه و گواهی","یادداشت، عکس و گزارشِ دیگران ثبتِ بیرونی یا گواهی‌اند؛ حافظه ظرفیتِ شناختیِ درونی است، هرچند هر دو اطلاعات را در زمان حفظ می‌کنند."]],"mistakes":["شدت یا اطمینانِ خاطره را شاهدِ دقتِ آن دانستن.","فرض‌کردنِ اینکه نتیجهٔ به‌یادمانده هنوز موجه است حتی وقتی اکنون ابطال‌کننده‌ای برای روشِ اولیهٔ تولیدِ آن دارید."],"check":{"q":"برآوردِ یک ضریب را به خاطر دارید اما داده، مشخصات یا اینکه آزمون‌های استحکام را گذرانده بود به یاد ندارید. خاطره چه شأنِ معرفتی دارد؟","a":"ممکن است واقعیتِ «زمانی این عدد را باور داشتم» را حفظ کند، اما اطمینانِ فعلی به عدد، مبانیِ گمشده را بازسازی نمی‌کند. برای کاربردِ مهم، از دست‌رفتنِ منشأ دلیلِ بازبینی است، نه مجوزِ اعتماد به زنده‌بودنِ خاطره."}}},"intro":{"en":{"line":"Introspection gives unusually direct access to some current mental states, but that access is privileged rather than infallible.","why":"<p>Foundationalists are drawn to introspection because “I am in pain” or “it seems red to me” appears to need no inference from the external world. If any source can provide non-inferential justification, first-person awareness is a leading candidate. The difficulty is specifying how strong that privilege really is.</p>","origin":"Descartes made first-person mental certainty central to his foundational project. Contemporary critics, including Eric Schwitzgebel, emphasize systematic errors about emotions, sensory detail, motives, and conscious experience. Modern views usually retreat from infallibility and incorrigibility to defeasible first-person authority.","obj":[["People misidentify emotions, motives, and even features of their own experience, so introspection is not infallible.","Most contemporary defenders concede fallibility. The claim is comparative: first-person access can be immediate and presumptively authoritative without being immune to correction. A source need not be perfect to be basic."],["If introspective judgments can be corrected by behavior, neuroscience, or other people, perhaps there is no special first-person authority at all.","Correction in difficult cases does not erase asymmetry. For many occurrent states, asking the subject remains epistemically privileged; external evidence typically defeats rather than wholly replaces that default authority."]],"confuse":[["Infallibility and incorrigibility","Infallibility means you cannot be wrong; incorrigibility means others cannot rationally correct you. A view can grant neither while still granting privileged access."],["Introspection and self-interpretation","Not every belief about your personality, motives, or long-term preferences comes from direct introspection. Much of self-knowledge is inferential and can be biased."]],"mistakes":["Moving from 'I feel certain about my mental state' to 'I cannot be mistaken about it.'","Treating explanations of your motives as if they had the same immediacy as awareness of an occurrent pain or visual seeming."],"check":{"q":"You say “I am anxious because of the meeting.” Which part has the stronger introspective claim: being anxious, or the causal explanation?","a":"The occurrent anxiety has the stronger first-person claim. The explanation of why you are anxious is an interpretation and may depend on inference, background beliefs, or confabulation."}},"fa":{"line":"درون‌نگری به بعضی حالت‌های ذهنیِ فعلی دسترسیِ غیرعادی و مستقیم می‌دهد، اما این دسترسی ممتاز است نه خطاناپذیر.","why":"<p>مبناگرایان به درون‌نگری جذب می‌شوند چون «درد دارم» یا «به نظرم قرمز است» ظاهراً به استنتاج از جهانِ بیرون نیاز ندارد. اگر منبعی بتواند توجیهِ غیراستنتاجی بدهد، آگاهیِ اول‌شخص نامزدِ اصلی است. دشواری تعیینِ میزانِ قدرتِ این امتیاز است.</p>","origin":"دکارت یقینِ اول‌شخصِ ذهنی را در مرکزِ پروژهٔ مبناگرایانه‌اش گذاشت. منتقدانِ معاصر، از جمله اریک شویتسگبل، بر خطاهای نظام‌مند دربارهٔ احساس، جزئیاتِ حسی، انگیزه و تجربهٔ آگاهانه تأکید کرده‌اند. نسخه‌های جدید معمولاً از خطاناپذیری و اصلاح‌ناپذیری عقب می‌نشینند و اقتدارِ اول‌شخصِ قابل‌ابطال را می‌پذیرند.","obj":[["مردم احساسات، انگیزه‌ها و حتی ویژگی‌های تجربهٔ خود را اشتباه تشخیص می‌دهند؛ پس درون‌نگری خطاناپذیر نیست.","بیشترِ مدافعانِ امروز خطاپذیری را می‌پذیرند. ادعا مقایسه‌ای است: دسترسیِ اول‌شخص می‌تواند بی‌واسطه و دارای اعتبارِ پیش‌فرض باشد بی‌آنکه مصون از اصلاح باشد. منبع برای پایه‌بودن لازم نیست کامل باشد."],["اگر رفتار، علومِ اعصاب یا دیگران بتوانند داوریِ درون‌نگرانه را اصلاح کنند، شاید اصلاً اقتدارِ ویژهٔ اول‌شخص وجود ندارد.","اصلاح در مواردِ دشوار عدم‌تقارن را پاک نمی‌کند. در بسیاری از حالت‌های جاری، پرسیدن از خودِ فاعل همچنان از نظر معرفتی ممتاز است؛ شاهدِ بیرونی معمولاً این اقتدارِ پیش‌فرض را شکست می‌دهد، نه اینکه آن را کاملاً جایگزین کند."]],"confuse":[["خطاناپذیری و اصلاح‌ناپذیری","خطاناپذیری یعنی نتوانید اشتباه کنید؛ اصلاح‌ناپذیری یعنی دیگران نتوانند عقلانیاً شما را تصحیح کنند. می‌توان هیچ‌کدام را نپذیرفت و هنوز دسترسیِ ممتاز را قبول داشت."],["درون‌نگری و خودتفسیرگری","هر باور دربارهٔ شخصیت، انگیزه یا ترجیحِ بلندمدت از درون‌نگریِ مستقیم نمی‌آید. بخشِ زیادی از خودشناسی استنتاجی و مستعدِ سوگیری است."]],"mistakes":["حرکت از «دربارهٔ حالتِ ذهنی‌ام خیلی مطمئنم» به «نمی‌توانم درباره‌اش اشتباه کنم».","هم‌سطح دانستنِ توضیحِ انگیزه‌ها با آگاهیِ بی‌واسطه از دردِ جاری یا نمودِ دیداری."],"check":{"q":"می‌گویید «به‌خاطر جلسه مضطربم». کدام بخش ادعای درون‌نگرانهٔ قوی‌تری دارد: مضطرب‌بودن یا توضیحِ علّیِ آن؟","a":"خودِ اضطرابِ جاری ادعای اول‌شخصِ قوی‌تری دارد. توضیحِ اینکه چرا مضطربید تفسیر است و ممکن است به استنتاج، باورهای پس‌زمینه یا داستان‌سازی وابسته باشد."}}},"apriori":{"en":{"line":"A priori justification is justification available independently of particular sensory experience, paradigmatically through reason, concepts, or understanding.","why":"<p>Some truths seem knowable without checking the world: logical entailments, elementary mathematics, and conceptual constraints. The a priori matters because it determines whether experience is the source of all substantive knowledge and what status to assign to mathematics, logic, and theoretical reasoning.</p>","origin":"The rationalist–empiricist dispute structures early modern philosophy; Kant transformed it by arguing for synthetic a priori knowledge. Twentieth-century debates include Ayer’s conventionalism and later challenges from Quine and Kripke, whose work separates apriority from necessity.","obj":[["How can thought alone tell us anything substantive about reality rather than merely unpack definitions?","Rationalists and Kantians argue that some principles are conditions of intelligibility or are grasped by rational insight, not empirical generalization. Empiricists respond that apparent insight may encode linguistic conventions or deeply learned regularities."],["Quine’s attack on the analytic/synthetic distinction undermines a clean boundary between a priori and empirical knowledge.","The collapse is not universally accepted. Contemporary defenders can define apriority epistemically—justification not depending on specific experiences—without requiring an absolute analytic/synthetic metaphysical divide."]],"confuse":[["A priori and necessary","Apriority is about how a proposition is justified; necessity is about whether it could have been false. Kripke showed the categories can come apart."],["A priori and innate","A belief need not be present from birth to be a priori. You can learn the concepts and later justify a proposition without empirical evidence for that proposition."]],"mistakes":["Calling any theoretical assumption 'a priori' merely because it was chosen before looking at the current dataset.","Assuming a priori means unrevisable; many philosophers allow fallible or defeasible a priori justification."],"check":{"q":"You know that no object can be both entirely green and entirely black at the same place and time without inspecting every object. What feature makes the justification a priori?","a":"The warrant comes from conceptual or rational relations, not an inductive survey of colored objects. Experience may be needed to acquire the concepts, but not to justify this particular relation."}},"fa":{"line":"توجیهِ پیشینی توجیهی است که مستقل از تجربهٔ حسیِ خاص در دسترس است، به‌طور نمونه از راه عقل، مفاهیم یا فهم.","why":"<p>بعضی حقایق ظاهراً بدون بررسیِ جهان دانستنی‌اند: استلزام‌های منطقی، ریاضیاتِ ابتدایی و قیودِ مفهومی. پیشینی مهم است چون تعیین می‌کند آیا تجربه منبعِ تمامِ معرفتِ محتوایی است و باید به ریاضیات، منطق و استدلالِ نظری چه شأنی داد.</p>","origin":"نزاعِ عقل‌گرایی و تجربه‌گرایی ساختارِ فلسفهٔ مدرنِ اولیه را می‌سازد؛ کانت با دفاع از معرفتِ ترکیبیِ پیشینی آن را دگرگون کرد. بحث‌های سدهٔ بیستم شامل قراردادگراییِ آیر و سپس چالش‌های کواین و کریپکی است؛ کارِ کریپکی پیشینی‌بودن را از ضرورت جدا می‌کند.","obj":[["فکرِ تنها چگونه می‌تواند چیزی محتوایی دربارهٔ واقعیت بگوید و صرفاً تعریف‌ها را باز نکند؟","عقل‌گرایان و کانتی‌ها می‌گویند برخی اصول شرطِ فهم‌پذیری‌اند یا با بینشِ عقلانی درک می‌شوند، نه با تعمیمِ تجربی. تجربه‌گرایان پاسخ می‌دهند این «بینش» ممکن است قراردادِ زبانی یا الگوهای عمیقِ آموخته‌شده را منعکس کند."],["حملهٔ کواین به تمایزِ تحلیلی/ترکیبی مرزِ تمیزِ پیشینی و تجربی را تضعیف می‌کند.","فروپاشیِ کامل موردِ توافق نیست. مدافعانِ معاصر می‌توانند پیشینی را معرفتی تعریف کنند — توجیهی که به تجربه‌های خاص وابسته نیست — بی‌آنکه شکافِ متافیزیکیِ مطلقِ تحلیلی/ترکیبی را لازم بدانند."]],"confuse":[["پیشینی و ضروری","پیشینی دربارهٔ شیوهٔ توجیه است؛ ضرورت دربارهٔ امکانِ کاذب‌بودن. کریپکی نشان داد این دو دسته می‌توانند از هم جدا شوند."],["پیشینی و فطری","باور لازم نیست از تولد حاضر باشد تا پیشینی باشد. می‌توان مفاهیم را آموخت و بعد گزاره‌ای را بدون شاهدِ تجربی برای همان گزاره توجیه کرد."]],"mistakes":["پیشینی نامیدنِ هر فرضِ نظری فقط چون پیش از دیدنِ دادهٔ فعلی انتخاب شده است.","فرض‌کردنِ اینکه پیشینی یعنی بازنگری‌ناپذیر؛ بسیاری توجیهِ پیشینیِ خطاپذیر یا قابل‌ابطال را می‌پذیرند."],"check":{"q":"بدون بررسیِ همهٔ اشیا می‌دانید هیچ شیئی نمی‌تواند در همان مکان و زمان سراسر سبز و سراسر سیاه باشد. چه چیزی توجیه را پیشینی می‌کند؟","a":"مجوز از رابطهٔ مفهومی یا عقلانی می‌آید، نه از پیمایشِ استقراییِ اشیای رنگی. تجربه شاید برای کسبِ مفاهیم لازم باشد، اما برای توجیهِ همین رابطه نه."}}},"testim":{"en":{"line":"Testimony is a genuine source of knowledge because other people’s assertions can transmit or generate justification, but its central problem is when trust is rational.","why":"<p>Most of what anyone knows—history, science, geography, institutions, even today’s news—comes from others. If testimony were epistemically parasitic on personal verification, ordinary knowledge would collapse. The theory therefore asks when another person’s word gives prima facie reason and when independent checking is required.</p>","origin":"Thomas Reid defended a natural principle of credulity against overly skeptical reductionism; modern work by C.A.J. Coady and Jennifer Lackey develops testimony as a major knowledge source. The central split is reductionism, which demands non-testimonial reasons for trust, versus anti-reductionism or default entitlement.","obj":[["Believing speakers by default looks gullible; testimony is full of deception, error, and incentive problems.","Anti-reductionists do not propose blind trust. They propose defeasible prima facie entitlement: testimony justifies absent relevant defeaters. Context, incentives, expertise, independence, and track record can raise or defeat the default."],["If testimony only transmits knowledge the speaker already has, how can a group produce knowledge no individual possesses?","Generative cases motivate a richer social epistemology. Institutions can aggregate partial information, and a hearer can sometimes gain knowledge from a speaker who does not herself possess the full justified proposition, so simple transmission is too narrow."]],"confuse":[["Testimony and authority","Testimony is the broad act of learning from what others say. Appeals to authority are arguments that a claim deserves weight because of a source’s expertise; they are a special case requiring competence and domain fit."],["Independent sources and repeated reports","Ten outlets repeating one wire story are one evidential lineage, not ten independent testimonies. Source genealogy is part of evaluating testimony."]],"mistakes":["Treating credentials as sufficient evidence of reliability without checking domain, incentives, and track record.","Double-counting copied testimony as independent confirmation."],"check":{"q":"Three respected reports agree, but all ultimately cite the same unnamed official. How many independent testimonial supports do you have?","a":"Probably one evidential lineage, not three. Agreement raises confidence only to the extent that the sources’ information is genuinely independent or independently validated."}},"fa":{"line":"گواهی منبعی واقعی برای معرفت است، زیرا گفتهٔ دیگران می‌تواند توجیه را منتقل یا تولید کند؛ مسئلهٔ مرکزی این است که اعتماد چه وقت عقلانی است.","why":"<p>بیشترِ آنچه هر انسان می‌داند — تاریخ، علم، جغرافیا، نهادها و حتی خبرِ امروز — از دیگران می‌آید. اگر گواهی فقط پس از راستی‌آزماییِ شخصی ارزش معرفتی داشت، معرفتِ عادی فرو می‌ریخت. پس نظریه می‌پرسد سخنِ دیگری چه وقت دلیلِ ابتدایی می‌دهد و چه وقت بررسیِ مستقل لازم است.</p>","origin":"توماس رید در برابر تقلیل‌گراییِ بیش از حد شکاکانه از اصلِ طبیعیِ اعتماد دفاع کرد؛ کارِ جدیدِ سی.ای.جی. کودی و جنیفر لکی گواهی را منبعی اصلی می‌داند. شکافِ مرکزی میان تقلیل‌گرایی است که دلیلِ غیرگواهی برای اعتماد می‌خواهد و ضدتقلیل‌گرایی یا مجوزِ پیش‌فرض است.","obj":[["اعتمادِ پیش‌فرض به گوینده ساده‌لوحانه به نظر می‌رسد؛ گواهی پر از فریب، خطا و مشکلِ انگیزه است.","ضدتقلیل‌گرا اعتمادِ کور پیشنهاد نمی‌کند، بلکه مجوزِ ابتدایی و قابل‌ابطال می‌دهد: در نبودِ ابطال‌کنندهٔ مربوط، گواهی توجیه می‌کند. زمینه، انگیزه، تخصص، استقلال و کارنامه می‌توانند این پیش‌فرض را تقویت یا شکست دهند."],["اگر گواهی فقط معرفتی را منتقل کند که گوینده از پیش دارد، چگونه گروه می‌تواند معرفتی بسازد که هیچ فردی به‌تنهایی ندارد؟","مواردِ تولیدی معرفت‌شناسیِ اجتماعیِ غنی‌تری می‌طلبند. نهادها می‌توانند اطلاعاتِ جزئی را تجمیع کنند و شنونده گاهی از گوینده‌ای که خودش کلِ گزارهٔ موجه را ندارد معرفت به دست می‌آورد؛ پس انتقالِ ساده بیش از حد محدود است."]],"confuse":[["گواهی و اقتدار","گواهی مفهومِ گستردهٔ آموختن از گفتهٔ دیگران است. استناد به اقتدار استدلالی است که ادعا به‌سببِ تخصصِ منبع وزن دارد؛ موردی خاص است و تناسبِ حوزه و شایستگی می‌خواهد."],["منابعِ مستقل و گزارش‌های تکراری","ده رسانه که یک خبرگزاریِ واحد را تکرار می‌کنند یک دودمانِ شاهدی‌اند، نه ده گواهیِ مستقل. ردیابیِ منشأ بخشی از ارزیابیِ گواهی است."]],"mistakes":["کافی‌دانستنِ مدرک و عنوان برای اعتمادپذیری بدون بررسیِ حوزه، انگیزه و کارنامه.","دوباره‌شماریِ گواهیِ کپی‌شده به‌عنوان تأییدِ مستقل."],"check":{"q":"سه گزارشِ معتبر توافق دارند، اما هر سه در نهایت به همان مقامِ ناشناس استناد می‌کنند. چند پشتیبانیِ گواهیِ مستقل دارید؟","a":"احتمالاً یک دودمانِ شاهدی، نه سه. توافق فقط به اندازه‌ای اطمینان را بالا می‌برد که اطلاعاتِ منابع واقعاً مستقل یا مستقلاً اعتبارسنجی شده باشند."}}},"biv":{"en":{"line":"The brain-in-a-vat scenario is a skeptical hypothesis designed to be evidentially indistinguishable from ordinary life, forcing the question of whether experience can rule out radical deception.","why":"<p>Ordinary knowledge seems to require that our evidence discriminate truth from relevant error. A brain in a vat receives exactly the same experiences as a normal embodied person, so sensory evidence cannot distinguish the two. The scenario concentrates Cartesian skepticism into a modern external-world test.</p>","origin":"The structure descends from Descartes’ evil-demon argument; Hilary Putnam gave the brain-in-a-vat case a famous semantic treatment. In contemporary epistemology the scenario often functions as the skeptical alternative in closure arguments rather than as a literal scientific hypothesis anyone expects to be true.","obj":[["The scenario is fantastically improbable, so why should knowledge require ruling it out?","That is the relevant-alternatives and contextualist response: not every logical possibility is epistemically relevant. The skeptic’s pressure is to explain, without circularity, why this possibility may be ignored while ordinary error possibilities may not."],["Putnam argued that a lifelong brain in a vat could not successfully mean 'brain in a vat' in our ordinary sense, so the hypothesis is self-undermining.","The semantic argument targets some formulations, not radical skepticism as a whole. A skeptic can use a different deception scenario or a recently envatted subject. The deeper issue—whether evidence discriminates the actual world from certain alternatives—survives."]],"confuse":[["BIV and simulation arguments","Both use radical deception, but BIV is an epistemological device about indistinguishable evidence. A simulation argument can be probabilistic or metaphysical and need not imply skepticism about ordinary knowledge."],["Possibility and relevance","That a skeptical scenario is logically possible does not by itself show it must be ruled out for knowledge. The disputed premise is its epistemic relevance."]],"mistakes":["Arguing against the BIV case by saying it is unlikely before addressing how that probability is justified without relying on the very world-model under challenge.","Treating the thought experiment as a prediction about technology rather than a stress test for standards of knowledge."],"check":{"q":"Why can’t ordinary sensory evidence—“I see my hands”—by itself settle whether you are a normal person or a perfectly deceived BIV?","a":"Because the scenario is constructed so the sensory evidence is the same in both cases. The dispute therefore moves to whether knowledge requires ruling out that alternative, not to gathering more of the same kind of sensory evidence."}},"fa":{"line":"سناریوی «مغز در خمره» فرضیه‌ای شکاکانه و عمداً از نظر شاهدی تشخیص‌ناپذیر از زندگیِ عادی است تا بپرسد تجربه چگونه می‌تواند فریبِ رادیکال را کنار بزند.","why":"<p>معرفتِ عادی ظاهراً می‌خواهد شاهد میان حقیقت و خطاهای مرتبط تمایز بگذارد. مغزِ در خمره دقیقاً همان تجربه‌هایی را دریافت می‌کند که انسانِ عادی، پس شاهدِ حسی دو وضعیت را جدا نمی‌کند. سناریو شکِ دکارتی دربارهٔ جهانِ بیرونی را در آزمایشی مدرن فشرده می‌کند.</p>","origin":"ساختار از دیوِ فریبکارِ دکارت می‌آید؛ هیلاری پاتنم صورتِ مشهورِ معناییِ مغز در خمره را مطرح کرد. در معرفت‌شناسیِ معاصر این سناریو بیشتر بدیلِ شکاکانه در استدلال‌های انسداد است تا فرضیه‌ای علمی که کسی واقعاً انتظارِ صدقش را داشته باشد.","obj":[["سناریو فوق‌العاده نامحتمل است؛ چرا معرفت باید آن را کنار بزند؟","این پاسخِ بدیل‌های مرتبط و زمینه‌گرایی است: هر امکانِ منطقی از نظر معرفتی مرتبط نیست. فشارِ شکاک این است که بدون دور توضیح دهید چرا این امکان را می‌توان نادیده گرفت اما خطاهای عادی را نه."],["پاتنم استدلال کرد مغزی که همیشه در خمره بوده نمی‌تواند «مغز در خمره» را به معنای عادیِ ما مراد کند، پس فرضیه خودش را تضعیف می‌کند.","استدلالِ معنایی بعضی صورت‌بندی‌ها را هدف می‌گیرد، نه شکاکیتِ رادیکال را به‌طور کلی. شکاک می‌تواند سناریوی فریبِ دیگری یا مغزی که تازه در خمره گذاشته شده بسازد. مسئلهٔ عمیق‌تر — تمایزِ شاهد میان جهانِ واقعی و بعضی بدیل‌ها — باقی می‌ماند."]],"confuse":[["مغز در خمره و استدلالِ شبیه‌سازی","هر دو فریبِ رادیکال دارند، اما BIV ابزارِ معرفتی دربارهٔ شاهدِ تشخیص‌ناپذیر است. استدلالِ شبیه‌سازی می‌تواند احتمالی یا متافیزیکی باشد و لزوماً شکاکیت دربارهٔ معرفتِ عادی نتیجه ندهد."],["امکان و ارتباط","ممکن‌بودنِ منطقیِ سناریو به‌تنهایی نشان نمی‌دهد برای معرفت باید آن را حذف کرد. مقدمهٔ موردِ نزاع، ارتباطِ معرفتیِ آن است."]],"mistakes":["ردکردنِ BIV با «خیلی نامحتمل است» پیش از توضیحِ اینکه این احتمال را چگونه بدون تکیه بر همان مدلِ جهانی که زیر سؤال است توجیه می‌کنید.","فهمِ آزمایشِ فکری به‌عنوان پیش‌بینیِ فناوری، نه آزمونِ فشار برای معیارهای معرفت."],"check":{"q":"چرا شاهدِ حسیِ عادی — «دست‌هایم را می‌بینم» — به‌تنهایی نمی‌تواند تعیین کند انسانِ عادی هستید یا مغزی کاملاً فریب‌خورده در خمره؟","a":"چون سناریو طوری ساخته شده که شاهدِ حسی در هر دو حالت یکسان است. پس نزاع به این منتقل می‌شود که آیا معرفت مستلزمِ حذفِ آن بدیل است، نه جمع‌کردنِ مقدارِ بیشتری از همان نوع شاهد."}}},"closure":{"en":{"line":"Epistemic closure says that if you know p, and know that p entails q, then—after competent deduction—you can know q.","why":"<p>Closure captures the intuition that knowledge is preserved by known entailment. It also powers the skeptical argument: if having hands entails not being a handless brain in a vat, then knowing you have hands appears to require knowing you are not such a brain.</p>","origin":"Closure is a standard principle rather than a doctrine tied to one founder. Fred Dretske and Robert Nozick famously deny versions of it to protect ordinary knowledge from skepticism. Much of the architecture of contemporary skepticism is a fight over whether that cost is acceptable.","obj":[["Denying closure creates 'abominable conjunctions': I know I have hands but do not know I am not a handless BIV.","This is the strongest intuitive cost for relevant-alternatives and sensitivity views. Their reply is that knowledge depends on how a proposition is tracked or which alternatives are relevant, and those properties need not transmit through entailment. Many epistemologists still prefer to preserve closure."],["Closure seems too strong if the subject never draws the inference or does not understand the entailment.","Standard formulations require that the subject know the entailment and competently deduce q. Closure is not automatic omniscience: knowledge is closed under known competent deduction, not under every consequence hidden in one’s beliefs."]],"confuse":[["Logical closure and epistemic closure","A set of propositions can be logically closed under consequence even though no human knows all those consequences. Epistemic closure adds conditions about the knower and inference."],["Closure and certainty","Closure says knowledge can transmit through entailment; it does not say the original premise must be certain."]],"mistakes":["Assuming closure means people know every logical consequence of everything they know.","Using closure without checking whether the subject actually knows the entailment connecting p to q."],"check":{"q":"You know a report contains exactly two material errors, and you know “exactly two” entails “fewer than three.” What does closure license?","a":"If you competently make the inference, it licenses knowledge that the report contains fewer than three material errors. The principle preserves knowledge through the known entailment."}},"fa":{"line":"اصلِ انسدادِ معرفتی می‌گوید اگر p را بدانید و بدانید p مستلزمِ q است، پس پس از استنتاجِ شایسته می‌توانید q را نیز بدانید.","why":"<p>انسداد این شهود را می‌گیرد که معرفت با استلزامِ شناخته‌شده حفظ می‌شود. همین اصل موتورِ استدلالِ شکاک است: اگر دست‌داشتن مستلزمِ این است که مغزِ بی‌دست در خمره نباشید، دانستنِ اینکه دست دارید ظاهراً می‌خواهد بدانید چنین مغزی نیستید.</p>","origin":"انسداد اصلِ استانداردی است و بنیان‌گذارِ واحد ندارد. فرد درتسکی و رابرت نوزیک نسخه‌هایی از آن را مشهوراً رد کردند تا معرفتِ عادی را از شکاکیت حفظ کنند. بخشِ بزرگی از معماریِ شکاکیتِ معاصر نزاع بر سرِ قابل‌قبول‌بودنِ این هزینه است.","obj":[["انکارِ انسداد «عطف‌های نفرت‌انگیز» می‌سازد: می‌دانم دست دارم اما نمی‌دانم مغزِ بی‌دست در خمره نیستم.","این قوی‌ترین هزینهٔ شهودی برای بدیل‌های مرتبط و حساسیت است. پاسخشان این است که معرفت به شیوهٔ ردیابیِ گزاره یا بدیل‌های مرتبط وابسته است و این ویژگی‌ها لزوماً از استلزام عبور نمی‌کنند. بسیاری هنوز حفظِ انسداد را ترجیح می‌دهند."],["انسداد خیلی قوی به نظر می‌رسد اگر شخص هرگز استنتاج را انجام نداده یا استلزام را نفهمد.","صورت‌بندیِ استاندارد می‌خواهد فاعل استلزام را بداند و q را به‌طور شایسته استنتاج کند. انسداد دانایِ مطلق نمی‌سازد؛ معرفت تحتِ استنتاجِ شناخته‌شده و شایسته بسته است، نه تحتِ هر پیامدِ پنهان."]],"confuse":[["انسدادِ منطقی و انسدادِ معرفتی","مجموعه‌ای از گزاره‌ها می‌تواند تحتِ پیامدِ منطقی بسته باشد در حالی که هیچ انسانی همهٔ آن پیامدها را نداند. انسدادِ معرفتی شرط‌هایی دربارهٔ فاعل و استنتاج اضافه می‌کند."],["انسداد و یقین","انسداد می‌گوید معرفت از استلزام عبور می‌کند؛ نمی‌گوید مقدمهٔ اصلی باید یقینی باشد."]],"mistakes":["فرض‌کردنِ اینکه انسداد یعنی انسان همهٔ پیامدهای منطقیِ هرچه می‌داند را بالفعل می‌داند.","استفاده از انسداد بدون بررسیِ اینکه فاعل واقعاً استلزامِ میان p و q را می‌داند."],"check":{"q":"می‌دانید گزارشی دقیقاً دو خطای بااهمیت دارد و می‌دانید «دقیقاً دو» مستلزمِ «کمتر از سه» است. انسداد چه مجوزی می‌دهد؟","a":"اگر استنتاج را شایسته انجام دهید، مجاز می‌کند بدانید گزارش کمتر از سه خطای بااهمیت دارد. اصل معرفت را از استلزامِ شناخته‌شده عبور می‌دهد."}}},"relalt":{"en":{"line":"Relevant-alternatives theories say knowing p requires ruling out the error possibilities that are relevant in the context, not every logically possible alternative.","why":"<p>Radical skepticism becomes overwhelming only if knowledge requires eliminating every possibility of error. Relevant-alternatives theory weakens that demand: to know an animal is a zebra you must rule out nearby ordinary alternatives, but perhaps not a fantastical zoo conspiracy unless the context makes it live.</p>","origin":"Fred Dretske is the central name. The view is part of a family of externalist responses to skepticism and is closely connected to his denial of closure. It anticipates contextualist insights while locating relevance in the alternatives themselves rather than primarily in the semantics of “know.”","obj":[["The view generates abominable conjunctions: 'I know it is a zebra, but I do not know it is not a cleverly painted mule.'","Dretske accepts that knowledge need not transmit to every entailed anti-skeptical proposition. The price is denying closure. Contextualists try to capture similar intuitions while preserving closure by letting the standards for 'know' shift instead."],["Who decides which alternatives are relevant? Without a rule, the view risks making knowledge depend on convenience.","Defenders appeal to objective features—actual error rates, environmental facts, stakes, salience, and conversational purposes—not mere preference. The hard problem is specifying a relevance relation that is principled enough to avoid ad hoc exclusion."]],"confuse":[["Relevant alternatives and contextualism","Both explain why far-fetched errors are often ignorable. Relevant-alternatives views typically change the conditions for knowing; contextualism changes the truth conditions of knowledge-attributing sentences across contexts."],["Relevant and probable","A low-probability alternative can be relevant if the environment or stakes make it salient; a relatively probable possibility can be irrelevant to a particular claim if it does not threaten the inference."]],"mistakes":["Using 'irrelevant' to mean 'I personally do not want to consider it.'","Assuming any mention of an alternative automatically makes it relevant; salience can raise standards, but theories differ on when that happens."],"check":{"q":"You identify a barn in an ordinary county. Must you rule out Hollywood facades? What changes if you learn the county is used as a movie set?","a":"In the ordinary county the facade possibility may be irrelevant. Once you learn the environment contains many facades, that alternative becomes live and must be discriminated; the same visual evidence may no longer suffice for knowledge."}},"fa":{"line":"نظریهٔ بدیل‌های مرتبط می‌گوید دانستنِ p مستلزمِ حذفِ امکان‌های خطایی است که در زمینه مرتبط‌اند، نه هر بدیلِ منطقاً ممکن.","why":"<p>شکاکیتِ رادیکال فقط وقتی فلج‌کننده می‌شود که معرفت حذفِ هر امکانِ خطا را بخواهد. بدیل‌های مرتبط این مطالبه را تضعیف می‌کند: برای دانستنِ اینکه حیوان گورخر است باید بدیل‌های عادیِ نزدیک را کنار بزنید، اما شاید توطئهٔ عجیبِ باغ‌وحش را نه، مگر اینکه زمینه آن را زنده کند.</p>","origin":"فرد درتسکی نامِ مرکزی است. دیدگاه بخشی از خانوادهٔ پاسخ‌های برون‌گرایانه به شکاکیت و به انکارِ انسداد نزد او نزدیک است. بصیرتِ زمینه‌گرایی را پیشاپیش دارد، اما ارتباط را بیشتر در خودِ بدیل‌ها می‌گذارد تا در معناشناسیِ واژهٔ «دانستن».","obj":[["دیدگاه عطف‌های نفرت‌انگیز می‌سازد: «می‌دانم گورخر است، اما نمی‌دانم قاطری نیست که ماهرانه رنگ شده.»","درتسکی می‌پذیرد معرفت لازم نیست به همهٔ گزاره‌های ضدشکاکِ مستلزم منتقل شود. هزینه انکارِ انسداد است. زمینه‌گرایان می‌کوشند همان شهود را با حفظِ انسداد و تغییرِ معیارهای کاربردِ «دانستن» بگیرند."],["چه کسی تعیین می‌کند کدام بدیل مرتبط است؟ بدون قاعده، معرفت به آسایشِ ما وابسته می‌شود.","مدافعان به ویژگی‌های عینی مانند نرخِ واقعیِ خطا، محیط، مخاطره، برجستگی و هدفِ گفت‌وگو متوسل می‌شوند، نه صرفِ ترجیح. مسئلهٔ سخت ساختنِ رابطهٔ ارتباطِ آن‌قدر اصولی است که حذفِ موردی را مجاز نکند."]],"confuse":[["بدیل‌های مرتبط و زمینه‌گرایی","هر دو توضیح می‌دهند چرا خطاهای دور اغلب قابل‌چشم‌پوشی‌اند. بدیل‌های مرتبط معمولاً شرطِ دانستن را تغییر می‌دهد؛ زمینه‌گرایی شرایطِ صدقِ جملاتِ نسبت‌دهندهٔ معرفت را میان زمینه‌ها تغییر می‌دهد."],["مرتبط و محتمل","بدیلی کم‌احتمال می‌تواند به‌سببِ محیط یا مخاطره مرتبط شود؛ امکانِ نسبتاً محتمل هم ممکن است برای ادعای خاص نامرتبط باشد اگر استنتاج را تهدید نکند."]],"mistakes":["استفاده از «نامرتبط» به معنای «من شخصاً نمی‌خواهم در نظرش بگیرم».","فرض‌کردنِ اینکه صرفِ مطرح‌شدنِ یک بدیل آن را خودکار مرتبط می‌کند؛ برجستگی می‌تواند معیار را بالا ببرد اما نظریه‌ها دربارهٔ زمانِ آن اختلاف دارند."],"check":{"q":"در شهری عادی یک انبار را تشخیص می‌دهید. آیا باید نماهای هالیوودی را حذف کنید؟ اگر بفهمید منطقه محلِ فیلم‌برداری و پر از نماست چه عوض می‌شود؟","a":"در محیطِ عادی امکانِ نما شاید نامرتبط باشد. با دانستنِ اینکه محیط پر از نماست، بدیل زنده می‌شود و باید میانشان تمایز بگذارید؛ همان شاهدِ دیداری ممکن است دیگر برای معرفت کافی نباشد."}}},"context":{"en":{"line":"Contextualism says the truth conditions for “S knows p” shift with conversational context because the relevant epistemic standard can rise or fall.","why":"<p>Ordinary life and skeptical philosophy seem to deliver opposite but plausible verdicts. In everyday contexts “I know the bank is open Saturday” is fine; once a costly error or skeptical possibility is salient, the same evidence feels insufficient. Contextualism explains both without saying the subject’s evidence changed.</p>","origin":"Keith DeRose, David Lewis, and Stewart Cohen are leading contextualists. The view is semantic: the word “know” behaves like a context-sensitive term whose standard changes with salience, stakes, and conversational purposes. It aims to preserve ordinary knowledge and closure while explaining skeptical pressure.","obj":[["Contextualism changes the subject: skepticism asks whether we know, but contextualism answers how the word 'know' is used.","Contextualists reply that the apparent contradiction between ordinary and skeptical judgments is itself linguistic data requiring explanation. Critics can still insist that a deeper invariant epistemic relation matters beyond the semantics."],["If standards shift too easily, knowledge attributions become unstable or manipulable by merely mentioning far-fetched possibilities.","Lewis’s 'rules of attention' embraces some of this: attending to an error possibility can make it relevant. The challenge is preventing rhetorical salience from arbitrarily destroying knowledge; refined views distinguish reasonable salience from mere verbal trickery."]],"confuse":[["Contextualism and subject-sensitive invariantism","Contextualism makes the assessor’s conversational context affect the meaning or standard of 'knows.' Subject-sensitive views instead let the subject’s own stakes affect whether the subject knows."],["Contextualism and relativism","Contextualism need not say truth itself is relative. It says the truth conditions of a context-sensitive knowledge attribution vary."]],"mistakes":["Saying the evidence itself changed when only the conversational stakes or salient alternatives changed.","Using contextualism as a license to declare any inconvenient standard 'context-dependent' without explaining the linguistic or epistemic trigger."],"check":{"q":"At lunch you say, “I know the bank is open tomorrow.” Later you realize missing the visit would trigger a foreclosure deadline and now hesitate. What does contextualism say changed?","a":"The op
