fa:"<p>اگر پ را بدانید و بدانید که پ مستلزمِ ق است، آنگاه ق را می‌دانید. در بیان ساده چنان بدیهی می‌نماید که نام‌گذاری‌اش زائد است.</p><p>و همین موتورِ استدلالِ شکاکانه است. می‌دانید دست دارید؛ داشتنِ دست مستلزمِ مغزِ بی‌دستِ در خمره نبودن است؛ پس می‌دانید چنین نیستید. چون شکاک نتیجه را انکار می‌کند، یا انسداد باید کنار برود یا مقدمهٔ نخست — و هر دو دردناک‌اند.</p>",
xe:"You know you had exactly two drinks. That entails fewer than three. So you know you had fewer than three. Closure at work, and clearly correct.",
xf:"می‌دانید دقیقاً دو نوشیدنی خورده‌اید. این مستلزم کمتر از سه است. پس می‌دانید کمتر از سه خورده‌اید. انسداد در عمل، و آشکارا درست.",
pe:"A precise test for whether a finding really carries the implication being claimed for it. Trace the entailment: does the knowledge actually transmit, or does something leak on the way?",
pf:"آزمونی دقیق برای اینکه آیا یک یافته واقعاً دلالتی را که برایش ادعا می‌شود در خود دارد. استلزام را دنبال کنید: آیا معرفت واقعاً منتقل می‌شود یا چیزی در راه نشت می‌کند؟",c:[]},

relalt:{t:"Relevant alternatives",tf:"بدیل‌های مربوط",w:"Fred Dretske",q:"relevant alternatives Dretske closure denial",
en:"<p>Deny closure. To know something you need only rule out the <b>relevant</b> alternatives, and exotic sceptical scenarios are not relevant to ordinary claims.</p>",
fa:"<p>انسداد را انکار کنید. برای دانستنِ چیزی تنها باید بدیل‌های <b>مربوط</b> را رد کنید، و سناریوهای شکاکانهٔ عجیب به ادعاهای روزمره مربوط نیستند.</p>",
xe:"To know it is a barn you must rule out a shed. You do not have to rule out a film-set facade unless you are in a county full of them.",
xf:"برای دانستنِ اینکه آن یک انبار است باید احتمالِ آلونک را رد کنید. لازم نیست دکورِ سینمایی را رد کنید، مگر در منطقه‌ای پر از آن‌ها باشید.",
pe:"Formalises the word “reasonable” in reasonable doubt, and shows the standard is a choice about which alternatives count — a choice usually made silently.",
pf:"واژهٔ «معقول» در «تردید معقول» را صورت‌بندی می‌کند و نشان می‌دهد که این استاندارد، انتخابی است دربارهٔ اینکه کدام بدیل‌ها به حساب می‌آیند — انتخابی که معمولاً خاموش انجام می‌شود.",
oe:"It generates abominable conjunctions: “I know I have hands, but I do not know I am not a handless brain in a vat.”",
of:"عطف‌های ناپذیرفتنی می‌سازد: «می‌دانم دست دارم، اما نمی‌دانم مغزِ بی‌دستِ در خمره نیستم.»",c:[]},

moore:{L:1,t:"The Moorean response",tf:"پاسخِ مورى",w:"G.E. Moore",q:"Moore here is a hand skepticism response",
en:"<p>Moore's insight is deceptively simple and it generalises far beyond scepticism. An argument only succeeds if its premises are <b>more plausible</b> than the denial of its conclusion. So when a chain of individually plausible steps arrives somewhere absurd, you are entitled to run it backwards: reject a premise on the strength of the conclusion's absurdity.</p><p>Applied here: I know I have hands; therefore I know I am not a handless brain in a vat; therefore the sceptic's first premise is false.</p>",
fa:"<p>بصیرتِ مورى فریبنده‌ساده است و بسیار فراتر از شکاکیت تعمیم می‌یابد. یک استدلال تنها زمانی موفق است که مقدماتش <b>موجه‌تر</b> از انکارِ نتیجه‌اش باشند. پس وقتی زنجیره‌ای از گام‌های فی‌نفسه موجه به جایی پوچ می‌رسد، حق دارید آن را وارونه بخوانید: مقدمه‌ای را به‌اتکای پوچیِ نتیجه رد کنید.</p><p>در اینجا: می‌دانم دست دارم؛ پس می‌دانم مغزِ بی‌دستِ در خمره نیستم؛ پس مقدمهٔ نخستِ شکاک کاذب است.</p>",
xe:"Moore held up a hand and said: here is one. The gesture was the argument.",
xf:"مورى دستش را بالا برد و گفت: این یکی. همان حرکت، خودِ استدلال بود.",
pe:"The most portable move on this map. When a chain of plausible steps produces an absurd result, one step is wrong — and you may reject the conclusion before you have located which. That is not evasion; it is how you should treat a model whose output is impossible.",
pf:"قابل‌حمل‌ترین حرکتِ این نقشه. وقتی زنجیره‌ای از گام‌های موجه نتیجه‌ای پوچ می‌دهد، یکی از گام‌ها غلط است — و می‌توانید نتیجه را پیش از یافتنِ آن گام رد کنید. این طفره نیست؛ همان کاری است که باید با مدلی کرد که خروجی‌اش ناممکن است.",
oe:"It tells you the argument fails without explaining how you know the denied premise is false. That is a real gap, not a rhetorical one.",
of:"به شما می‌گوید استدلال شکست خورده، بی‌آنکه توضیح دهد از کجا می‌دانید مقدمهٔ ردشده کاذب است. این شکافی واقعی است، نه بلاغی.",c:[]},

context:{L:1,t:"Contextualism",tf:"زمینه‌گرایی",w:"Keith DeRose · David Lewis · Stewart Cohen",q:"epistemic contextualism DeRose Lewis",
en:"<p>What the word “know” means shifts with the conversational context, and specifically with which error possibilities have been made <b>salient</b>. In a low-standards context ordinary evidence suffices. Once someone raises a serious-sounding possibility of error, the standard rises and the same evidence no longer suffices.</p><p>This preserves closure — the principle holds at every standard — while explaining why both the sceptic and the ordinary speaker seem right in their own settings.</p>",
fa:"<p>معنای واژهٔ «دانستن» با زمینهٔ گفت‌وگو تغییر می‌کند، و مشخصاً با اینکه کدام احتمالاتِ خطا <b>برجسته</b> شده‌اند. در زمینه‌ای با استانداردِ پایین، شواهد معمولی کافی است. همین‌که کسی احتمالِ خطایی جدی‌نما را مطرح کند، استاندارد بالا می‌رود و همان شواهد دیگر کافی نیست.</p><p>این راه‌حل، انسداد را حفظ می‌کند — اصل در هر استانداردی برقرار است — و در عین حال توضیح می‌دهد چرا هم شکاک و هم گویندهٔ عادی، هر یک در بافتِ خود، بر حق می‌نمایند.</p>",
xe:"In the pub you know the bank opens on Saturday. In a conversation about missing a mortgage payment, suddenly you do not — and nothing about your evidence changed.",
xf:"در کافه می‌دانید بانک شنبه باز است. در گفت‌وگویی دربارهٔ از دست دادن قسط وام، ناگهان نمی‌دانید — و هیچ چیزی در شواهد شما تغییر نکرده.",
pe:"Explains why “but do you actually KNOW that?” is a rhetorically loaded move. Raising a far-fetched possibility raises the standard for everyone in the room, and the standard does not come back down on its own. Naming the move is the defence.",
pf:"توضیح می‌دهد چرا جملهٔ «اما آیا واقعاً می‌دانی؟» حرکتی بلاغی و پرفشار است. طرح یک احتمالِ بعید، استاندارد را برای همهٔ حاضران بالا می‌برد و این استاندارد خودبه‌خود پایین نمی‌آید. نام‌بردنِ این حرکت، دفاع در برابر آن است.",
oe:"Critics say it studies the word rather than the thing — that it is semantics dressed as epistemology.",
of:"منتقدان می‌گویند این رویکرد به‌جای خودِ معرفت به واژه می‌پردازد؛ معناشناسی است در جامهٔ معرفت‌شناسی.",c:[]},

pyrrh:{t:"Pyrrhonian skepticism",tf:"شکاکیتِ پیرونی",w:"Sextus Empiricus · Agrippa",q:"Pyrrhonism Sextus Empiricus epoche",
en:"<p>Ancient scepticism did not aim to prove that we know nothing. It aimed at <b>epoché</b> — suspension of judgment — and the tranquillity said to follow from ceasing to insist.</p>",
fa:"<p>شکاکیتِ باستان در پی اثباتِ اینکه هیچ نمی‌دانیم نبود. هدفش <b>اپوخه</b> بود — تعلیقِ حکم — و آرامشی که گفته می‌شد از دست‌کشیدن از اصرار می‌آید.</p>",
xe:"For any argument, an equally strong opposing argument can be found. So neither is asserted, and assent is withheld.",
xf:"برای هر استدلال، استدلالِ مخالفی به همان قوّت یافت می‌شود. پس هیچ‌یک تصدیق نمی‌شود و حکم معلّق می‌ماند.",
pe:"The disciplined version of “I don't know”, treated as an achievement rather than a failure to have an opinion.",
pf:"صورتِ منضبطِ «نمی‌دانم»، که دستاورد شمرده می‌شود نه ناتوانی از داشتنِ نظر.",
k:["trilemma"],c:[]},

cartes:{t:"Cartesian skepticism",tf:"شکاکیتِ دکارتی",w:"Descartes; al-Ghazālī ran a strikingly similar programme centuries earlier",q:"Cartesian skepticism methodic doubt evil demon",
en:"<p>Methodical doubt: discard everything that can possibly be doubted in order to find something that cannot, and rebuild from there. The evil demon is the instrument that makes the doubt total.</p>",
fa:"<p>شکِ روشمند: هر آنچه را می‌توان در آن تردید کرد کنار بگذارید تا به چیزی برسید که نمی‌توان، و از آنجا از نو بسازید. «شیطانِ فریبکار» ابزاری است که شک را تمام‌عیار می‌کند.</p>",
xe:"Doubt the senses, doubt mathematics, doubt the external world — and arrive at the one thing doubting itself cannot touch.",
xf:"به حواس شک کنید، به ریاضیات شک کنید، به جهانِ بیرون شک کنید — و به همان یک چیز برسید که خودِ شک‌کردن نمی‌تواند لمسش کند.",
pe:"The original stress test: deliberately assume maximal adversarial error and see what survives. Red-teaming is Descartes with a project plan.",
pf:"نخستین آزمونِ فشار: عمداً بیشترین خطای خصمانه را فرض کنید و ببینید چه باقی می‌ماند. «تیم قرمز» همان دکارت است با برنامهٔ پروژه.",
k:["hinge"],c:[]},

formal:{L:1,t:"Formal epistemology",tf:"معرفت‌شناسیِ صوری",w:"Ramsey · de Finetti · Savage · Jaynes",q:"formal epistemology Bayesian",
en:"<p>Using the tools of probability and logic to model belief and evidence. The founding move is to stop treating belief as a switch and start treating it as a <b>dial</b>: a credence between 0 and 1.</p><p>That single change makes a great deal tractable. Evidence stops being something that proves or fails to prove and becomes something that <b>moves</b> you, by an amount you can specify. Disagreement stops being a clash of positions and becomes a difference in priors or in information.</p>",
fa:"<p>به‌کارگیریِ ابزارِ احتمال و منطق برای مدل‌سازیِ باور و شواهد. حرکتِ بنیان‌گذار این است که باور را دیگر کلید قطع‌ووصل ندانیم و آن را <b>درجه‌بندی</b> کنیم: عددی میان صفر و یک.</p><p>همین یک تغییر بسیاری چیزها را قابل‌حل می‌کند. شواهد دیگر چیزی نیست که اثبات کند یا نکند، بلکه چیزی است که شما را به اندازه‌ای مشخص <b>جابه‌جا</b> می‌کند. اختلاف‌نظر دیگر برخوردِ دو موضع نیست، بلکه تفاوتی در احتمالاتِ پیشین یا در اطلاعات است.</p>",
xe:"Not “do I believe it?” but “how confident am I, and what evidence would move that number, and by how much?”",
xf:"نه «آیا باورش دارم؟» بلکه «چقدر مطمئنم، چه شواهدی این عدد را تکان می‌دهد، و چقدر؟»",
pe:"The engine room for anyone quantitative. Most of your working practice already lives here; the philosophy just makes the commitments explicit.",
pf:"موتورخانهٔ هر کسی که با کمیت کار می‌کند. بیشترِ عملِ حرفه‌ای شما همین‌جاست؛ فلسفه فقط تعهدات را آشکار می‌کند.",
c:["cred","bayes","priors","lr","dutch","calib","probint","lottery","preface"]},

cred:{t:"Credences vs binary belief",tf:"درجهٔ باور در برابر باورِ دوگانه",w:"Frank Ramsey",q:"credence degrees of belief",
en:"<p>Treating belief as a degree between 0 and 1 rather than an on/off state. Ramsey's move: your credence is revealed by the bets you would accept.</p>",
fa:"<p>باور را درجه‌ای میان صفر و یک بدانیم نه حالتی روشن/خاموش. حرکتِ رمزی: درجهٔ باورِ شما در شرط‌بندی‌هایی آشکار می‌شود که می‌پذیرید.</p>",
xe:"You neither believe nor disbelieve that it will rain tomorrow. You are at about 0.4, and you act accordingly.",
xf:"نه باور دارید فردا باران می‌بارد و نه ندارید. حدود ۰٫۴ هستید و بر همان اساس عمل می‌کنید.",
pe:"Forces the useful question in any meeting: not “do you think so?” but “how sure, and on what basis?”",
pf:"پرسشِ سودمند را در هر جلسه‌ای تحمیل می‌کند: نه «به‌نظرت چنین است؟» بلکه «چقدر مطمئنی و بر چه اساسی؟»",c:[]},

bayes:{L:1,t:"Bayes' theorem",tf:"قضیهٔ بیز",w:"Thomas Bayes · Laplace",q:"Bayes theorem conditional probability",
en:"<p>The rule for updating. Learn it in <b>odds form</b>, because that is the version you can run in your head: prior odds × likelihood ratio = posterior odds.</p><p>Two things it forces on you. You must have had a prior — if you cannot state it, you were not reasoning, you were reacting. And the evidence's weight is a <b>ratio</b>, not a fact: how much more likely is this observation if the hypothesis is true than if it is false?</p>",
fa:"<p>قاعدهٔ به‌روزرسانی. آن را در <b>صورتِ شانس</b> بیاموزید، چون همین صورت است که در ذهن قابل اجراست: شانسِ پیشین × نسبتِ درست‌نمایی = شانسِ پسین.</p><p>دو چیز را بر شما تحمیل می‌کند. باید پیشینی داشته باشید — اگر نمی‌توانید بیانش کنید، استدلال نمی‌کردید، واکنش نشان می‌دادید. و وزنِ شواهد یک <b>نسبت</b> است نه یک واقعیت: این مشاهده اگر فرضیه صادق باشد چقدر محتمل‌تر است تا وقتی کاذب باشد؟</p>",
xe:"A rare disease, an accurate test, a positive result — and the posterior probability is still low, because the prior was very low. The test did not fail; the intuition did.",
xf:"بیماری‌ای نادر، آزمایشی دقیق، نتیجه‌ای مثبت — و احتمالِ پسین همچنان پایین است، چون پیشین بسیار پایین بود. آزمایش خطا نکرد؛ شهود خطا کرد.",
pe:"The single most useful formal tool here. Applied honestly it converts “I disagree” into “my prior is different and here is why”, which is an argument that can actually be had.",
pf:"سودمندترین ابزار صوریِ این مجموعه. اگر صادقانه به کار رود، «مخالفم» را به «پیشینِ من متفاوت است و دلیلش این است» بدل می‌کند، که بحثی است که واقعاً می‌توان کرد.",c:[]},

priors:{L:1,t:"The problem of the priors",tf:"مسئلهٔ احتمالاتِ پیشین",w:"Ramsey · Savage · Jaynes on 'objective' priors",q:"problem of the priors Bayesian",
en:"<p>Bayes tells you how to update but says nothing about where to start. So where does a prior come from? From another prior — regress. From the data it is supposed to weigh — circularity. Or from stipulation — an arbitrary stop.</p><p>Those are the three horns again. Bayesianism does not escape the trilemma; it relocates it into a place where the choice is <b>visible and auditable</b>, which is a genuine gain and should be stated as such rather than as a solution.</p>",
fa:"<p>بیز می‌گوید چگونه به‌روزرسانی کنید، اما دربارهٔ نقطهٔ آغاز چیزی نمی‌گوید. پس پیشین از کجا می‌آید؟ از پیشینی دیگر — تسلسل. از همان داده‌ای که قرار است سنجیده شود — دور. یا از قرارداد — توقفِ دلبخواه.</p><p>این‌ها باز همان سه شاخ‌اند. بیزگرایی از سه‌راهی نمی‌گریزد؛ آن را به جایی منتقل می‌کند که انتخاب <b>دیدنی و بازبینی‌پذیر</b> است، و این دستاوردی واقعی است که باید همین‌گونه بیان شود، نه به‌عنوان راه‌حل.</p>",
xe:"Two analysts, the same data, different priors, different conclusions — and both perfectly coherent. Nothing in the mathematics adjudicates between them.",
xf:"دو تحلیل‌گر، همان داده، پیشین‌های متفاوت، نتایج متفاوت — و هر دو کاملاً سازگار. هیچ چیز در ریاضیات میان آن‌ها داوری نمی‌کند.",
pe:"The right disclosure standard: state the prior, state where it came from, and show how sensitive the conclusion is to it. That is the whole of methodological honesty in one habit.",
pf:"استانداردِ درستِ افشا: پیشین را بیان کنید، بگویید از کجا آمده و نشان دهید نتیجه چقدر به آن حساس است. تمامِ صداقتِ روش‌شناختی در همین یک عادت است.",
k:["trilemma"],c:[]},

lr:{t:"Likelihood ratios",tf:"نسبتِ درست‌نمایی",w:"Hacking · Royall · Edwards",q:"likelihood ratio evidence strength",
en:"<p>The strength of a piece of evidence is a ratio: how much more probable is this observation under one hypothesis than under its rival? Evidence that is equally expected either way has a ratio near 1 — it is not evidence at all.</p>",
fa:"<p>قوّتِ یک شاهد یک نسبت است: این مشاهده تحت یک فرضیه چقدر محتمل‌تر است تا تحت رقیبش؟ شاهدی که در هر دو حالت به یک اندازه انتظار می‌رود نسبتی نزدیک به ۱ دارد — یعنی اصلاً شاهد نیست.</p>",
xe:"“The result is consistent with our theory.” Consistent with the rival theory too? Then the likelihood ratio is 1 and you have learned nothing.",
xf:"«نتیجه با نظریهٔ ما سازگار است.» با نظریهٔ رقیب هم سازگار است؟ پس نسبتِ درست‌نمایی ۱ است و چیزی نیاموخته‌اید.",
pe:"The correct replacement for “is it significant?”. Ask instead how much the observation discriminates between the hypotheses actually on the table.",
pf:"جایگزینِ درستِ «آیا معنادار است؟». به‌جای آن بپرسید این مشاهده چقدر میان فرضیه‌های واقعاً مطرح تمایز می‌گذارد.",
k:["affirm"],c:[]},

dutch:{t:"The Dutch book argument",tf:"استدلالِ کتابِ هلندی",w:"Ramsey · de Finetti",q:"Dutch book argument probability coherence",
en:"<p>If your degrees of belief violate the probability axioms, a clever bookmaker can construct a set of bets you will each accept as fair and which together guarantee you a loss.</p>",
fa:"<p>اگر درجاتِ باورِ شما اصولِ احتمال را نقض کنند، یک شرط‌بندِ زیرک می‌تواند مجموعه‌ای از شرط‌ها بچیند که تک‌تکشان را منصفانه بدانید و روی‌هم‌رفته باخت شما را تضمین کنند.</p>",
xe:"Hold that P(A) = 0.6 and P(not-A) = 0.6 and someone can take money from you with certainty, no luck required.",
xf:"اگر بپذیرید P(A)=۰٫۶ و P(نهA)=۰٫۶ آنگاه کسی می‌تواند با قطعیت از شما پول بگیرد، بی‌نیاز به هیچ اقبالی.",
pe:"The formal case that incoherence is not merely untidy but exploitable — the real argument for internal consistency across any published set of estimates.",
pf:"استدلالِ صوری بر اینکه ناسازگاری نه فقط بی‌نظمی بلکه قابل بهره‌کشی است — دلیلِ واقعیِ سازگاریِ درونی در هر مجموعه برآوردِ منتشرشده.",c:[]},

calib:{L:1,t:"Calibration and scoring",tf:"کالیبراسیون و نمره‌دهی",w:"Brier · Tetlock",q:"calibration Brier score forecasting",
en:"<p>A calibrated forecaster is one whose 70% predictions come true about 70% of the time. Calibration is measurable — the Brier score and the logarithmic score both do it — and it is <b>trainable</b>, which is the finding that makes this whole subject practical rather than decorative.</p><p>Note that calibration is not the same as accuracy. You can be perfectly calibrated by saying 50% to everything. What you want is calibration plus <b>resolution</b>: confident predictions that turn out right.</p>",
fa:"<p>پیش‌بینی‌کنندهٔ کالیبره کسی است که پیش‌بینی‌های ۷۰ درصدی‌اش حدود ۷۰ درصد مواقع درست از آب درمی‌آید. کالیبراسیون قابل اندازه‌گیری است — نمرهٔ برایر و نمرهٔ لگاریتمی هر دو این کار را می‌کنند — و <b>آموختنی</b> است، و همین یافته است که این موضوع را از تزئین به کاربرد بدل می‌کند.</p><p>توجه کنید که کالیبراسیون با دقت یکی نیست. می‌توانید با گفتنِ «۵۰ درصد» به همه‌چیز کاملاً کالیبره باشید. آنچه می‌خواهید کالیبراسیون به‌علاوهٔ <b>تفکیک‌پذیری</b> است: پیش‌بینی‌های قاطعی که درست درمی‌آیند.</p>",
xe:"A forecaster who says 90% and is right 60% of the time is overconfident by a measurable, correctable amount.",
xf:"پیش‌بینی‌کننده‌ای که ۹۰ درصد می‌گوید و ۶۰ درصد مواقع درست است، به اندازه‌ای قابل اندازه‌گیری و قابل اصلاح، بیش‌اطمینان است.",
pe:"The highest-return habit available to you: log three to five predictions a week with explicit probabilities and resolution dates, score them quarterly. Nothing else on this map improves your judgment as reliably.",
pf:"پرثمرترین عادتِ در دسترس: هفته‌ای سه تا پنج پیش‌بینی با احتمالِ صریح و تاریخِ تعیینِ نتیجه ثبت کنید و فصلی نمره بدهید. هیچ چیز دیگری در این نقشه به این اطمینان داوریِ شما را بهتر نمی‌کند.",c:[]},

probint:{t:"Interpretations of probability",tf:"تفسیرهای احتمال",w:"von Mises · Popper · Carnap · de Finetti",q:"interpretations of probability frequentist subjective",
en:"<p>What a probability actually <b>is</b>: a long-run relative frequency, a physical propensity of a setup, a logical relation between propositions, or a rational agent's degree of belief.</p>",
fa:"<p>احتمال در واقع <b>چیست</b>: بسامدِ نسبیِ درازمدت، گرایشِ فیزیکیِ یک چیدمان، نسبتی منطقی میان گزاره‌ها، یا درجهٔ باورِ یک عاملِ عقلانی.</p>",
xe:"“A 30% chance of rain tomorrow” — but tomorrow happens exactly once. Which interpretation makes that sentence meaningful?",
xf:"«۳۰ درصد احتمالِ باران در فردا» — اما فردا فقط یک بار رخ می‌دهد. کدام تفسیر این جمله را معنادار می‌کند؟",
pe:"The Bayesian-versus-frequentist fight in statistics IS this dispute. Recognising that converts an unresolvable methods argument into a philosophical one you can actually adjudicate.",
pf:"نزاعِ بیزی و بسامدگرا در آمار، دقیقاً همین اختلاف است. شناختِ این نکته، بحثِ روش‌شناختیِ حل‌ناشدنی را به بحثی فلسفی بدل می‌کند که واقعاً می‌توان دربارهٔ آن داوری کرد.",c:[]},

lottery:{L:1,t:"The lottery paradox",tf:"پارادوکسِ بخت‌آزمایی",w:"Henry Kyburg",q:"lottery paradox rational belief",
en:"<p>A lottery with a million tickets. For each ticket you are rationally confident it will lose — 0.999999. Yet you know one of them wins, so you cannot believe of every ticket that it loses.</p><p>The lesson is that high credence in each of many claims does not aggregate into belief in their conjunction. Confidence erodes multiplicatively, and fast.</p>",
fa:"<p>بخت‌آزمایی‌ای با یک میلیون بلیت. دربارهٔ هر بلیت به‌درستی مطمئن‌اید که می‌بازد — ۰٫۹۹۹۹۹۹. با این حال می‌دانید یکی برنده می‌شود، پس نمی‌توانید دربارهٔ همهٔ بلیت‌ها باور کنید که می‌بازند.</p><p>درس این است که اطمینانِ بالا به هر یک از چند ادعا، به باور به عطفِ آن‌ها تبدیل نمی‌شود. اطمینان به‌صورت ضربی و به‌سرعت فرسوده می‌شود.</p>",
xe:"Twenty claims, each 95% likely, independently. The probability that all twenty hold is about 36%.",
xf:"بیست ادعا، هر یک ۹۵ درصد محتمل و مستقل. احتمالِ اینکه هر بیست‌تا درست باشند حدود ۳۶ درصد است.",
pe:"Why a report full of individually reasonable claims is still very likely wrong somewhere. Worth saying out loud before anyone treats the document as uniformly reliable.",
pf:"به همین دلیل گزارشی پر از ادعاهای فی‌نفسه معقول، به احتمال زیاد جایی اشتباه دارد. ارزشش را دارد که پیش از آنکه کسی سند را یکدست قابل اتکا بداند، بلند گفته شود.",c:[]},

preface:{t:"The preface paradox",tf:"پارادوکسِ پیش‌گفتار",w:"D.C. Makinson",q:"preface paradox rational belief",
en:"<p>An author believes each individual claim in her book, and also believes — from long experience — that the book contains at least one error. Both attitudes are rational, and together they are inconsistent.</p>",
fa:"<p>نویسنده‌ای به تک‌تک ادعاهای کتابش باور دارد و در عین حال، از سرِ تجربهٔ طولانی، باور دارد که کتاب دست‌کم یک خطا دارد. هر دو نگرش عقلانی‌اند و روی‌هم‌رفته ناسازگار.</p>",
xe:"The standard preface: “any remaining errors are my own.” It is a formal contradiction and nobody objects.",
xf:"پیش‌گفتارِ متعارف: «خطاهای باقی‌مانده از آنِ من است.» تناقضی صوری است و کسی اعتراض نمی‌کند.",
pe:"Licenses an honest and useful posture: “I stand behind every number in here, and I expect at least one is wrong.” Saying both is not incoherence.",
pf:"موضعی صادقانه و سودمند را مجاز می‌کند: «پشتِ تک‌تک اعداد این گزارش می‌ایستم و انتظار دارم دست‌کم یکی غلط باشد.» گفتنِ هر دو، ناسازگاری نیست.",c:[]},
phsci:{L:1,t:"Philosophy of science",tf:"فلسفهٔ علم",w:"Popper · Kuhn · Lakatos · Hempel · Okasha",q:"philosophy of science",
en:"<p>Applied epistemology of empirical claims. What makes evidence good, what theory choice actually rests on, how sciences change, and whether their theories describe reality or merely organise it.</p><p>For anyone doing quantitative work this is not a humanities elective. It is the formal description of your own method, and it names the failure modes you have already met without having words for them.</p>",
fa:"<p>معرفت‌شناسیِ کاربردیِ ادعاهای تجربی. چه چیزی شواهد را خوب می‌کند، انتخابِ نظریه واقعاً بر چه تکیه دارد، علوم چگونه تغییر می‌کنند، و آیا نظریه‌هایشان واقعیت را توصیف می‌کنند یا صرفاً سامان می‌دهند.</p><p>برای هر کسی که کارِ کمّی می‌کند این یک درسِ اختیاریِ علوم انسانی نیست. توصیفِ صوریِ روشِ خودِ اوست و شکست‌هایی را نام‌گذاری می‌کند که پیش‌تر با آن‌ها روبه‌رو شده بی‌آنکه نامی برایشان داشته باشد.</p>",
xe:"Why does a controlled trial license a conclusion that an anecdote does not, when both are observations?",
xf:"چرا یک کارآزماییِ کنترل‌شده نتیجه‌ای را مجاز می‌کند که یک حکایت نمی‌کند، در حالی که هر دو مشاهده‌اند؟",
pe:"Reading this branch is the fastest way to become articulate about what you already do well and to notice where you have been lucky rather than careful.",
pf:"مطالعهٔ این شاخه سریع‌ترین راه است برای اینکه دربارهٔ آنچه از پیش خوب انجام می‌دهید بیان‌مند شوید و ببینید کجا خوش‌اقبال بوده‌اید نه دقیق.",
c:["demarc","induct","grue","raven","popper","duhem","underdet","kuhn","lakatos","expl","ibe","realism","causal","values","repl"]},

demarc:{t:"The demarcation problem",tf:"مسئلهٔ تمایز",w:"Popper · Laudan's 'demise of the demarcation problem'",q:"demarcation problem science pseudoscience",
en:"<p>What separates science from non-science? Falsifiability was the most famous proposed criterion; the consensus now is that no single criterion does the job cleanly.</p>",
fa:"<p>چه چیزی علم را از غیرعلم جدا می‌کند؟ ابطال‌پذیری مشهورترین معیارِ پیشنهادی بود؛ اجماع کنونی این است که هیچ معیار واحدی این کار را به‌روشنی انجام نمی‌دهد.</p>",
xe:"Astrology makes predictions and revises them. So why is it not science?",
xf:"طالع‌بینی پیش‌بینی می‌کند و آن‌ها را بازبینی می‌کند. پس چرا علم نیست؟",
pe:"Every “is this rigorous enough?” judgment is a demarcation call. Knowing the criterion failed keeps you from applying it as if it were a rule.",
pf:"هر داوریِ «آیا این به‌قدر کافی دقیق است؟» یک حکمِ تمایز است. دانستنِ اینکه آن معیار شکست خورد، مانع می‌شود آن را چون قاعده‌ای مکانیکی به کار ببرید.",c:[]},

induct:{L:1,t:"The problem of induction",tf:"مسئلهٔ استقرا",w:"David Hume",q:"problem of induction Hume",
en:"<p>Hume's argument is short and has never been answered. Inductive inference assumes the future will resemble the past. That assumption cannot be established deductively, since its denial is not contradictory. Nor can it be established inductively, since that would use the very principle in question.</p><p>So every empirical generalisation you have ever made rests on something you cannot justify. This is not a reason to stop generalising; it is a reason to know what you are doing when you do.</p>",
fa:"<p>استدلال هیوم کوتاه است و هرگز پاسخ نیافته. استنتاجِ استقرایی فرض می‌کند آینده شبیه گذشته خواهد بود. این فرض قیاسی اثبات نمی‌شود، چون انکارش تناقض‌آمیز نیست. استقرایی هم اثبات نمی‌شود، چون همان اصلِ محلِ نزاع را به کار می‌گیرد.</p><p>پس هر تعمیمِ تجربی که تا کنون داده‌اید بر چیزی استوار است که نمی‌توانید توجیهش کنید. این دلیلی بر توقفِ تعمیم نیست؛ دلیلی است بر اینکه بدانید هنگام تعمیم چه می‌کنید.</p>",
xe:"The sun has risen every morning in recorded history. That fact entails nothing whatsoever about tomorrow morning.",
xf:"خورشید در تمام تاریخِ ثبت‌شده هر بامداد برآمده است. این واقعیت هیچ چیزی دربارهٔ بامدادِ فردا نتیجه نمی‌دهد.",
pe:"The hard ceiling on every out-of-sample forecast and on every model calibrated to a historical regime. Regime change is not an exotic risk; it is the default expectation that induction quietly assumes away.",
pf:"سقفِ سختِ هر پیش‌بینیِ برون‌نمونه‌ای و هر مدلی که بر رژیمی تاریخی کالیبره شده. تغییرِ رژیم ریسکی عجیب نیست؛ حالتِ پیش‌فرضی است که استقرا بی‌سروصدا آن را کنار می‌گذارد.",c:[]},

grue:{L:1,t:"The new riddle of induction",tf:"معمای تازهٔ استقرا",w:"Nelson Goodman",q:"grue new riddle of induction Goodman",
en:"<p>Goodman defines a predicate: something is <b>grue</b> if it is observed before time t and green, or observed after t and blue. Every emerald examined so far is both green and grue. So the same evidence supports “all emeralds are green” and “all emeralds are grue” equally — yet these predict opposite things about tomorrow.</p><p>The riddle is not about colour. It shows that evidence alone never selects a generalisation. Some prior judgment about which predicates are <b>projectible</b> — which categories are natural — is doing the work, and that judgment is not in the data.</p>",
fa:"<p>گودمن محمولی تعریف می‌کند: چیزی <b>سبزآبی</b> است اگر پیش از زمانِ t مشاهده و سبز باشد، یا پس از t مشاهده و آبی باشد. هر زمردی که تا کنون بررسی شده هم سبز است و هم سبزآبی. پس همان شواهد، «همهٔ زمردها سبزند» و «همهٔ زمردها سبزآبی‌اند» را به یک اندازه پشتیبانی می‌کند — و این دو دربارهٔ فردا خلافِ هم پیش‌بینی می‌کنند.</p><p>معما دربارهٔ رنگ نیست. نشان می‌دهد که شواهد به‌تنهایی هرگز یک تعمیم را برنمی‌گزیند. داوریِ پیشینی دربارهٔ اینکه کدام محمول‌ها <b>فرافکنی‌پذیر</b>ند — کدام مقولات طبیعی‌اند — دارد کار می‌کند، و آن داوری در داده نیست.</p>",
xe:"Two specifications fit the same series identically and diverge sharply out of sample. The data cannot tell you which variables were the natural ones.",
xf:"دو مشخصه‌بندی یک سری را یکسان برازش می‌کنند و بیرون از نمونه به‌شدت واگرا می‌شوند. داده نمی‌تواند به شما بگوید کدام متغیرها طبیعی بودند.",
pe:"Your choice of variables and functional form is doing more work than the estimation. Grue is the proof that it must be, and therefore the argument for disclosing it.",
pf:"انتخابِ متغیرها و صورتِ تابعی، بیش از خودِ برآورد کار می‌کند. «سبزآبی» اثبات می‌کند که ناگزیر چنین است، و از همین رو استدلالی است برای افشای آن.",c:[]},

raven:{t:"The raven paradox",tf:"پارادوکسِ کلاغ",w:"Carl Hempel",q:"raven paradox confirmation Hempel",
en:"<p>“All ravens are black” is logically equivalent to “all non-black things are non-ravens”. Anything confirming the second confirms the first. So a green apple confirms that all ravens are black.</p>",
fa:"<p>«همهٔ کلاغ‌ها سیاه‌اند» منطقاً هم‌ارز است با «هر چیزِ غیرسیاه، غیرکلاغ است». هر چه دومی را تأیید کند اولی را هم تأیید می‌کند. پس یک سیبِ سبز تأیید می‌کند که همهٔ کلاغ‌ها سیاه‌اند.</p>",
xe:"Ornithology conducted indoors, by examining fruit. The logic is impeccable and the conclusion is absurd.",
xf:"پرنده‌شناسی در اتاقِ نشیمن، با وارسیِ میوه. منطق بی‌عیب است و نتیجه پوچ.",
pe:"A warning about confirmation logic: evidence that is technically consistent with a hypothesis can carry essentially zero weight. Consistency is not support.",
pf:"هشداری دربارهٔ منطقِ تأیید: شاهدی که از نظر فنی با فرضیه سازگار است می‌تواند وزنی تقریباً صفر داشته باشد. سازگاری، پشتیبانی نیست.",
k:["lr"],c:[]},

popper:{L:1,t:"Falsifiability",tf:"ابطال‌پذیری",w:"Karl Popper",q:"falsifiability Popper demarcation",
en:"<p>Popper's move begins from Hume. If induction cannot justify a universal claim, stop trying to justify. Universal statements can never be verified by any number of confirming instances, but a single genuine counter-instance refutes them. That asymmetry is the whole method.</p><p>A theory is scientific to the extent that it <b>forbids</b> things. The more it rules out, the more informative it is and the more it risks. A theory compatible with every possible observation tells you nothing.</p><p>Popper's own criterion has not survived as a demarcation rule — see Duhem–Quine — but it survives as an intellectual discipline, and a demanding one.</p>",
fa:"<p>حرکتِ پوپر از هیوم آغاز می‌شود. اگر استقرا نمی‌تواند ادعایی کلی را توجیه کند، از توجیه‌کردن دست بکشید. گزاره‌های کلی هرگز با هیچ شمار از نمونه‌های مؤید تأیید نمی‌شوند، اما یک نمونهٔ نقضِ اصیل آن‌ها را ابطال می‌کند. تمامِ روش در همین عدم‌تقارن است.</p><p>نظریه به همان اندازه علمی است که چیزهایی را <b>ممنوع</b> می‌کند. هرچه بیشتر کنار بگذارد، آگاهی‌بخش‌تر است و بیشتر خطر می‌کند. نظریه‌ای که با هر مشاهدهٔ ممکنی سازگار است هیچ نمی‌گوید.</p><p>معیارِ خودِ پوپر به‌عنوان قاعدهٔ تمایز دوام نیاورده — دوئم‌کواین را ببینید — اما به‌عنوان انضباطی فکری، و انضباطی سخت‌گیر، باقی مانده است.</p>",
xe:"No number of white swans establishes “all swans are white”. One black swan settles it, permanently.",
xf:"هیچ شمار از قوهای سفید «همهٔ قوها سفیدند» را اثبات نمی‌کند. یک قوی سیاه برای همیشه کار را تمام می‌کند.",
pe:"State in advance what result would make you abandon the claim. If the honest answer is “nothing would”, it is not an empirical claim and no amount of data will settle it. Ask this of yourself before you ask it of anyone else.",
pf:"از پیش بگویید چه نتیجه‌ای شما را از ادعا منصرف می‌کند. اگر پاسخِ صادقانه «هیچ چیز» باشد، آن ادعا تجربی نیست و هیچ حجمی از داده حلش نمی‌کند. این را نخست از خودتان بپرسید، بعد از دیگران.",
oe:"Duhem–Quine shows that no hypothesis is ever tested alone, so any refutation can be deflected onto an auxiliary assumption. Falsification is never as clean in practice as it is on paper.",
of:"دوئم‌کواین نشان می‌دهد هیچ فرضیه‌ای هرگز تنها آزموده نمی‌شود، پس هر ابطالی را می‌توان به فرضی کمکی حواله داد. ابطال در عمل هرگز به تمیزیِ روی کاغذ نیست.",
k:["critrat","trilemma","modus"],c:["risky","adhoc","corrob"]},

risky:{t:"Risky predictions",tf:"پیش‌بینی‌های پرخطر",w:"Popper",q:"risky prediction novel prediction Popper",
en:"<p>The measure of a theory's content is how much it forbids. A prediction is risky when it could easily have come out otherwise and the theory would have been dead if it had.</p>",
fa:"<p>سنجهٔ محتوای یک نظریه، میزانِ چیزهایی است که ممنوع می‌کند. پیش‌بینی وقتی پرخطر است که به‌آسانی می‌توانست جور دیگری درآید و در آن صورت نظریه مرده بود.</p>",
xe:"Einstein predicted a specific angle of light deflection. A different angle would have refuted him outright.",
xf:"اینشتین زاویهٔ مشخصی از انحرافِ نور را پیش‌بینی کرد. زاویه‌ای متفاوت او را یکسره ابطال می‌کرد.",
pe:"Judge a model by what it says cannot happen, not by what it can accommodate after the fact.",
pf:"مدل را با آنچه می‌گوید نمی‌تواند رخ دهد بسنجید، نه با آنچه پس از وقوع می‌تواند توجیه کند.",c:[]},

adhoc:{L:1,t:"Ad hoc rescue",tf:"ترمیمِ موردی",w:"Popper; Lakatos calls the pattern degenerating",q:"ad hoc hypothesis immunizing stratagem",
en:"<p>A theory is hit by a disconfirming result. Its defenders add an assumption that accounts for the failure, has no independent support, and generates no new testable predictions. The theory survives — and has become less scientific in the process.</p><p>Popper called these <b>immunizing stratagems</b>. They are not always illegitimate: auxiliary assumptions get adjusted all the time in healthy science. The test is what the adjustment buys you.</p>",
fa:"<p>نظریه‌ای با نتیجه‌ای ناقض روبه‌رو می‌شود. مدافعانش فرضی می‌افزایند که شکست را توضیح می‌دهد، پشتیبانیِ مستقلی ندارد و هیچ پیش‌بینیِ آزمون‌پذیر تازه‌ای نمی‌سازد. نظریه زنده می‌ماند — و در همین مسیر کم‌علمی‌تر شده است.</p><p>پوپر این‌ها را <b>تدابیر مصون‌ساز</b> می‌نامید. همیشه نامشروع نیستند: در علمِ سالم، فرض‌های کمکی مدام تعدیل می‌شوند. آزمون این است که آن تعدیل چه چیزی برای شما می‌خرد.</p>",
xe:"“The effect is real but was masked by an unmeasured factor” — offered with no way to identify or measure the factor.",
xf:"«اثر واقعی است اما عاملی اندازه‌گیری‌نشده آن را پوشانده» — بی‌آنکه راهی برای شناسایی یا سنجشِ آن عامل ارائه شود.",
pe:"The practical payload of the entire falsifiability module. When a claim takes a hit, ask one question: did the patch make the theory more predictive, or only more survivable?",
pf:"بارِ عملیِ تمامِ این بحث. وقتی ادعایی ضربه می‌خورد، یک پرسش بپرسید: آیا آن وصله نظریه را پیش‌بینی‌کننده‌تر کرد، یا فقط زنده‌ماندنی‌تر؟",
k:["lakatos","flew"],c:[]},

corrob:{t:"Corroboration ≠ confirmation",tf:"تأییدِ آزمونی ≠ اثبات",w:"Popper",q:"corroboration Popper confirmation probability",
en:"<p>A theory that has survived severe testing is <b>corroborated</b>. Popper insists this does not make it probable, or supported, or more likely to hold next time. It means only that it has not been refuted yet.</p>",
fa:"<p>نظریه‌ای که از آزمون‌های سخت جان به در برده <b>تأییدِ آزمونی</b> گرفته است. پوپر اصرار دارد که این آن را محتمل یا پشتیبانی‌شده یا محتمل‌تر برای دفعهٔ بعد نمی‌کند. تنها یعنی هنوز ابطال نشده است.</p>",
xe:"A thousand successful tests still do not establish the next case. The logic has not changed since the first test.",
xf:"هزار آزمونِ موفق باز هم موردِ بعدی را اثبات نمی‌کند. منطق از نخستین آزمون تا کنون تغییری نکرده است.",
pe:"Guards against “the model has worked for ten years” as an argument. Track record is a fact about the past, not a warrant about the future.",
pf:"سپری در برابر این استدلال که «مدل ده سال کار کرده». کارنامه واقعیتی دربارهٔ گذشته است، نه ضمانتی دربارهٔ آینده.",c:[]},

duhem:{L:1,t:"The Duhem–Quine thesis",tf:"تزِ دوئم‌ـ‌کواین",w:"Pierre Duhem · W.V.O. Quine",q:"Duhem Quine thesis holism auxiliary hypotheses",
en:"<p>You never test a hypothesis on its own. You test the hypothesis plus a bundle of auxiliary assumptions: that your instruments work, that your sample is representative, that the background theory is right, that nothing else interfered.</p><p>When a test fails, logic tells you that <b>something in the bundle</b> is false. It does not tell you which. That choice is made by judgment, convention, or interest — and it is where most real scientific controversy actually lives.</p>",
fa:"<p>هرگز یک فرضیه را به‌تنهایی نمی‌آزمایید. فرضیه را به‌همراه بسته‌ای از فرض‌های کمکی می‌آزمایید: اینکه ابزارتان کار می‌کند، نمونه‌تان نماینده است، نظریهٔ پس‌زمینه درست است و چیز دیگری دخالت نکرده.</p><p>وقتی آزمون شکست می‌خورد، منطق می‌گوید <b>چیزی در آن بسته</b> کاذب است. نمی‌گوید کدام. آن انتخاب با داوری، عرف یا منفعت انجام می‌شود — و بیشترِ مناقشهٔ واقعیِ علمی دقیقاً همان‌جا زندگی می‌کند.</p>",
xe:"The telescope disconfirms the prediction. Is the theory wrong, or the lens, or the atmosphere, or the observer?",
xf:"تلسکوپ پیش‌بینی را نقض می‌کند. نظریه غلط است، یا عدسی، یا جو، یا خودِ ناظر؟",
pe:"Write out the auxiliary assumptions of any specification before you defend it. That list is the complete set of escape hatches — yours and your critics'. Knowing them in advance is the difference between a defence and an improvisation.",
pf:"پیش از دفاع از هر مشخصه‌بندی، فرض‌های کمکی‌اش را بنویسید. آن فهرست، مجموعهٔ کاملِ درهای فرار است — هم برای شما و هم برای منتقدانتان. دانستنِ پیشاپیشِ آن‌ها تفاوتِ میان دفاع و بداهه‌گویی است.",
k:["coher","ansyn"],c:[]},

underdet:{t:"Underdetermination",tf:"تعیّن‌ناقص",w:"Quine · Laudan",q:"underdetermination of theory by evidence",
en:"<p>For any finite body of evidence, more than one theory fits it. Data alone never uniquely picks out a theory, so something besides data always completes the choice.</p>",
fa:"<p>برای هر مجموعهٔ متناهی از شواهد، بیش از یک نظریه با آن جور درمی‌آید. داده به‌تنهایی هرگز یک نظریه را یکتا برنمی‌گزیند، پس همواره چیزی جز داده انتخاب را کامل می‌کند.</p>",
xe:"Several specifications fit the same series equally well and imply materially different policies.",
xf:"چند مشخصه‌بندی یک سری را به یک اندازه خوب برازش می‌کنند و سیاست‌هایی به‌طور معناداری متفاوت را ایجاب می‌کنند.",
pe:"Why specification choice is a substantive judgment rather than a technicality, and why it belongs in the disclosure rather than the appendix.",
pf:"به همین دلیل انتخابِ مشخصه‌بندی داوری‌ای ماهوی است نه امری فنی، و جایش در بخشِ افشاست نه در پیوست.",c:[]},

kuhn:{L:1,t:"Paradigms",tf:"پارادایم‌ها",w:"Thomas Kuhn",q:"Kuhn paradigm scientific revolutions",
en:"<p>Kuhn's history shows science does not accumulate smoothly. It works for long stretches inside a shared framework — a <b>paradigm</b> — solving puzzles the framework defines and treating anomalies as unsolved puzzles rather than as refutations.</p><p>Anomalies accumulate. Eventually a crisis develops, a rival framework appears, and the community switches. The switch is not a simple matter of evidence, because the two frameworks disagree about what counts as evidence.</p>",
fa:"<p>تاریخ‌نگاریِ کوهن نشان می‌دهد علم به‌آرامی انباشته نمی‌شود. برای دوره‌های طولانی درونِ چارچوبی مشترک — یک <b>پارادایم</b> — کار می‌کند، معماهایی را که خودِ چارچوب تعریف کرده حل می‌کند و ناهنجاری‌ها را معمای حل‌نشده می‌داند نه ابطال.</p><p>ناهنجاری‌ها انباشته می‌شوند. سرانجام بحرانی پدید می‌آید، چارچوبی رقیب سر برمی‌آورد و جامعه جابه‌جا می‌شود. این جابه‌جایی صرفاً مسئلهٔ شواهد نیست، چون دو چارچوب بر سرِ اینکه چه چیزی شاهد به‌حساب می‌آید اختلاف دارند.</p>",
xe:"Ptolemaic astronomy was not stupid. It was a functioning paradigm that absorbed anomalies for centuries before it broke.",
xf:"نجومِ بطلمیوسی احمقانه نبود. پارادایمی کارآمد بود که قرن‌ها ناهنجاری‌ها را در خود جذب کرد پیش از آنکه بشکند.",
pe:"Explains why anomalies in your own field get absorbed rather than acted on for long stretches, and why the eventual shift feels abrupt to everyone who was not watching the anomalies pile up.",
pf:"توضیح می‌دهد چرا ناهنجاری‌ها در رشتهٔ خودِ شما مدت‌ها جذب می‌شوند نه اینکه به عمل بینجامند، و چرا تغییرِ نهایی برای هر کسی که انباشتِ ناهنجاری‌ها را ندیده، ناگهانی می‌نماید.",
c:["normal","incomm","theoryladen"]},

normal:{t:"Normal science",tf:"علمِ عادی",w:"Kuhn",q:"normal science puzzle solving Kuhn",
en:"<p>The ordinary condition of research: solving puzzles inside an accepted framework, not testing the framework. Most scientific work, most of the time, is this.</p>",
fa:"<p>وضعیتِ عادیِ پژوهش: حلِ معما درونِ چارچوبی پذیرفته‌شده، نه آزمودنِ خودِ چارچوب. بیشترِ کارِ علمی، بیشترِ اوقات، همین است.</p>",
xe:"Refining an estimate within an accepted model rather than asking whether the model should be the model.",
xf:"پالایشِ یک برآورد درونِ مدلی پذیرفته‌شده، به‌جای پرسیدنِ اینکه اصلاً آن مدل باید مدل باشد یا نه.",
pe:"Most professional work is normal science, and that is entirely fine — provided you can tell which mode you are in on any given day.",
pf:"بیشترِ کارِ حرفه‌ای علمِ عادی است و کاملاً هم درست است — به شرط آنکه بدانید هر روز در کدام حالت هستید.",c:[]},

incomm:{t:"Incommensurability",tf:"قیاس‌ناپذیری",w:"Kuhn · Feyerabend",q:"incommensurability paradigms Kuhn",
en:"<p>Rival paradigms may share no common measure. Key terms shift meaning across the divide, so the theories cannot be compared claim by claim in a neutral vocabulary.</p>",
fa:"<p>پارادایم‌های رقیب ممکن است هیچ سنجهٔ مشترکی نداشته باشند. اصطلاحاتِ کلیدی در دو سوی شکاف معنا عوض می‌کنند، پس نظریه‌ها را نمی‌توان ادعا‌به‌ادعا در واژگانی بی‌طرف مقایسه کرد.</p>",
xe:"“Mass” does not mean the same thing in Newtonian and relativistic physics, so the two theories are not making rival claims about one shared quantity.",
xf:"«جرم» در فیزیک نیوتنی و نسبیتی یک معنا ندارد، پس این دو نظریه دربارهٔ یک کمیتِ مشترک ادعای رقیب نمی‌کنند.",
pe:"Why some cross-school arguments never resolve. The parties are not disagreeing about an answer; they are using different questions and identical words.",
pf:"به همین دلیل برخی مشاجراتِ میان‌مکتبی هرگز حل نمی‌شوند. طرفین بر سرِ یک پاسخ اختلاف ندارند؛ پرسش‌های متفاوت و واژه‌های یکسان دارند.",c:[]},

theoryladen:{t:"Theory-ladenness of observation",tf:"نظریه‌بارگیِ مشاهده",w:"N.R. Hanson · Kuhn",q:"theory ladenness of observation",
en:"<p>What counts as data, and how it is described, already depends on theoretical commitments. There is no neutral observation language waiting underneath.</p>",
fa:"<p>اینکه چه چیزی داده به‌حساب می‌آید و چگونه توصیف می‌شود، از پیش به تعهداتِ نظری وابسته است. هیچ زبانِ مشاهده‌ایِ بی‌طرفی در زیر منتظر نیست.</p>",
xe:"Two economists look at the same series and see different things, because they are looking for different variables.",
xf:"دو اقتصاددان به یک سری نگاه می‌کنند و چیزهای متفاوتی می‌بینند، چون دنبال متغیرهای متفاوتی می‌گردند.",
pe:"Undermines “let the data speak”. Data never speaks; it answers the question you brought to it, in the vocabulary you brought.",
pf:"شعارِ «بگذارید داده سخن بگوید» را از اعتبار می‌اندازد. داده هرگز سخن نمی‌گوید؛ به پرسشی که با خود آورده‌اید، در واژگانی که آورده‌اید، پاسخ می‌دهد.",c:[]},

lakatos:{L:1,t:"Research programmes",tf:"برنامه‌های پژوهشی",w:"Imre Lakatos",q:"Lakatos research programmes progressive degenerating",
en:"<p>Lakatos's synthesis of Popper and Kuhn, and the most usable idea in this branch. Theories do not stand alone; they come in <b>programmes</b> with a protected hard core and a flexible belt of auxiliary assumptions that absorb the hits.</p><p>The evaluation is therefore diachronic, not a snapshot. A programme is <b>progressive</b> if its adjustments predict novel facts that then turn out true. It is <b>degenerating</b> if its adjustments only accommodate what already went wrong.</p><p>This replaces an unanswerable question with an answerable one.</p>",
fa:"<p>ترکیبِ لاکاتوش از پوپر و کوهن، و کاربردی‌ترین ایدهٔ این شاخه. نظریه‌ها تنها نمی‌ایستند؛ در قالبِ <b>برنامه‌ها</b> می‌آیند، با هسته‌ای سخت و محافظت‌شده و کمربندی انعطاف‌پذیر از فرض‌های کمکی که ضربه‌ها را جذب می‌کنند.</p><p>پس ارزیابی در طولِ زمان است، نه یک عکسِ لحظه‌ای. برنامه‌ای <b>پیش‌رونده</b> است اگر تعدیل‌هایش واقعیت‌های تازه‌ای پیش‌بینی کنند که سپس درست از آب درآیند. <b>واپس‌رونده</b> است اگر تعدیل‌هایش فقط آنچه را از پیش خراب شده توجیه کنند.</p><p>این، پرسشی بی‌پاسخ را با پرسشی پاسخ‌پذیر جایگزین می‌کند.</p>",
xe:"Adding epicycles that explain nothing new is degenerating. Predicting Neptune from anomalies in Uranus's orbit is progressive — same manoeuvre, opposite verdict.",
xf:"افزودنِ افلاکِ تدویر که چیز تازه‌ای توضیح نمی‌دهد واپس‌روی است. پیش‌بینیِ نپتون از ناهنجاری‌های مدارِ اورانوس پیش‌روی است — همان مانور، حکمی وارونه.",
pe:"Never ask “is it falsifiable?” Ask: when this framework got hit, did its defenders make it more predictive or only more survivable? That question has an answer, and you can look it up.",
pf:"هرگز نپرسید «آیا ابطال‌پذیر است؟» بپرسید: وقتی این چارچوب ضربه خورد، مدافعانش آن را پیش‌بینی‌کننده‌تر کردند یا فقط زنده‌ماندنی‌تر؟ این پرسش پاسخ دارد و می‌توانید آن را بیابید.",c:[]},

expl:{t:"Scientific explanation",tf:"تبیین علمی",w:"Hempel's deductive-nomological model · Salmon · Kitcher",q:"scientific explanation deductive nomological",
en:"<p>What makes something an explanation rather than a description? Hempel's answer: derive the phenomenon from a general law plus initial conditions. Later accounts appeal to causal mechanisms or to unification instead.</p>",
fa:"<p>چه چیزی چیزی را تبیین می‌کند و نه صرفاً توصیف؟ پاسخ همپل: پدیده را از قانونی کلی به‌علاوهٔ شرایط اولیه استنتاج کنید. روایت‌های بعدی به‌جای آن به سازوکارهای علّی یا به وحدت‌بخشی متوسل می‌شوند.</p>",
xe:"The flagpole's height explains the shadow's length. The shadow's length does not explain the height — although the derivation runs both ways.",
xf:"ارتفاعِ میلهٔ پرچم طولِ سایه را تبیین می‌کند. طولِ سایه ارتفاع را تبیین نمی‌کند — هرچند استنتاج در هر دو جهت کار می‌کند.",
pe:"A clean test for whether your model explains or merely fits: fitting is symmetric, explaining is not.",
pf:"آزمونی تمیز برای اینکه مدل شما تبیین می‌کند یا فقط برازش می‌دهد: برازش متقارن است، تبیین نیست.",
oe:"The asymmetry and irrelevance counterexamples sank the strict deductive-nomological model.",
of:"نمونه‌های نقضِ عدم‌تقارن و بی‌ربطی، مدلِ سختِ استنتاجی‌ـ‌قانونی را غرق کردند.",c:[]},

ibe:{t:"Inference to the best explanation",tf:"استنتاجِ بهترین تبیین",w:"Gilbert Harman · Peter Lipton",q:"inference to the best explanation abduction",
en:"<p>Infer the hypothesis that would best explain the evidence, where “best” draws on simplicity, scope, and unifying power. Most real reasoning outside mathematics has this shape.</p>",
fa:"<p>فرضیه‌ای را استنتاج کنید که شواهد را بهتر از همه تبیین می‌کند، جایی که «بهترین» به سادگی، دامنه و قدرتِ وحدت‌بخشی متکی است. بیشترِ استدلالِ واقعی بیرون از ریاضیات همین شکل را دارد.</p>",
xe:"Footprints in fresh snow. Someone walked here. You did not deduce it and you did not generalise from a sample.",
xf:"ردِ پا در برفِ تازه. کسی از اینجا گذشته است. نه آن را قیاسی استنتاج کردید و نه از نمونه‌ای تعمیم دادید.",
pe:"Its weakness is the one that matters: “best available” is not “good”, and the true explanation may simply not be on your list of candidates.",
pf:"ضعفش همان است که اهمیت دارد: «بهترینِ موجود» با «خوب» یکی نیست، و تبیینِ واقعی ممکن است اصلاً در فهرست نامزدهای شما نباشد.",c:[]},

realism:{t:"Realism vs anti-realism",tf:"واقع‌گرایی در برابر ضدواقع‌گرایی",w:"Putnam · van Fraassen · Laudan",q:"scientific realism anti-realism instrumentalism",
en:"<p>Does a successful theory describe unobservable reality, or is it only a reliable instrument for organising and predicting observations?</p>",
fa:"<p>آیا نظریه‌ای موفق واقعیتِ مشاهده‌ناپذیر را توصیف می‌کند، یا صرفاً ابزاری قابل اتکا برای سامان‌دادن و پیش‌بینیِ مشاهدات است؟</p>",
xe:"Do electrons exist, or is “electron” an extremely useful bookkeeping device?",
xf:"آیا الکترون وجود دارد، یا «الکترون» ابزارِ دفترداریِ بسیار سودمندی است؟",
pe:"Friedman's “as if” methodology in economics is instrumentalism. This debate decides whether unrealistic assumptions are a flaw to be fixed or beside the point entirely.",
pf:"روش‌شناسیِ «چنان‌که گویی» فریدمن در اقتصاد، ابزارانگاری است. این بحث تعیین می‌کند که فرض‌های غیرواقعی نقصی قابل رفع‌اند یا اصلاً بی‌ربط.",
c:["miracle","pmi","constemp"]},

miracle:{t:"The no-miracles argument",tf:"استدلالِ بی‌معجزه",w:"Hilary Putnam",q:"no miracles argument scientific realism",
en:"<p>The predictive success of science would be a miracle if its theories were not at least approximately true. Realism is offered as the only non-miraculous explanation of that success.</p>",
fa:"<p>موفقیتِ پیش‌بینانهٔ علم اگر نظریه‌هایش دست‌کم تقریباً صادق نباشند، معجزه خواهد بود. واقع‌گرایی به‌عنوان تنها تبیینِ غیرمعجزه‌آسای این موفقیت عرضه می‌شود.</p>",
pe:"The strongest case for taking a model's internals seriously rather than treating it as a black box that happens to work.",
pf:"قوی‌ترین استدلال برای جدی‌گرفتنِ درونیاتِ یک مدل به‌جای رفتار با آن به‌مثابهٔ جعبهٔ سیاهی که اتفاقاً کار می‌کند.",c:[]},

pmi:{t:"The pessimistic meta-induction",tf:"استقرای بدبینانه",w:"Larry Laudan",q:"pessimistic meta induction Laudan",
en:"<p>Past theories were predictively successful and turned out false. By induction, our current successful theories are probably false too.</p>",
fa:"<p>نظریه‌های گذشته از نظر پیش‌بینی موفق بودند و کاذب از آب درآمدند. با استقرا، نظریه‌های موفقِ کنونیِ ما هم احتمالاً کاذب‌اند.</p>",
xe:"Phlogiston, caloric, the luminiferous ether. Each worked, each was abandoned.",
xf:"فلوژیستون، کالریک، اترِ نورانی. هر یک کار می‌کرد و هر یک کنار گذاشته شد.",
pe:"A direct and uncomfortable check on confidence in any currently dominant framework, including the one in your own field.",
pf:"مهاری مستقیم و ناراحت‌کننده بر اطمینان به هر چارچوبِ مسلطِ کنونی، از جمله چارچوبِ رشتهٔ خودتان.",c:[]},

constemp:{t:"Constructive empiricism",tf:"تجربه‌گراییِ سازنده",w:"Bas van Fraassen",q:"constructive empiricism van Fraassen",
en:"<p>The aim of science is <b>empirical adequacy</b> — getting the observable phenomena right — not truth about unobservables. Accepting a theory means using it, not believing everything it posits.</p>",
fa:"<p>هدفِ علم <b>کفایتِ تجربی</b> است — درست‌درآوردنِ پدیده‌های مشاهده‌پذیر — نه صدق دربارهٔ مشاهده‌ناپذیرها. پذیرشِ نظریه یعنی به‌کارگیریِ آن، نه باور به هر آنچه فرض می‌کند.</p>",
pe:"A defensible middle position: rely on the model's outputs without committing yourself to its ontology. Most practitioners hold this without knowing it has a name.",
pf:"موضعی میانی و قابل دفاع: به خروجی‌های مدل تکیه کنید بی‌آنکه به هستی‌شناسی‌اش متعهد شوید. بیشترِ اهلِ عمل همین موضع را دارند بی‌آنکه بدانند نامی دارد.",c:[]},

causal:{L:1,t:"Causal inference",tf:"استنتاجِ علّی",w:"Pearl · Rubin · Bradford Hill",q:"causal inference confounding",
en:"<p>When is a correlation entitled to a causal reading? This is the most technically developed part of modern philosophy of science, and the part where philosophy and working method have genuinely fused.</p><p>The central insight is that causal conclusions require causal assumptions. No amount of purely observational data yields a causal claim on its own — the assumptions have to come from somewhere outside the dataset, and the honest move is to write them down.</p>",
fa:"<p>چه زمانی یک همبستگی حقِ خوانشِ علّی دارد؟ این پیشرفته‌ترین بخشِ فنیِ فلسفهٔ علمِ مدرن است و بخشی که در آن فلسفه و روشِ کاری واقعاً در هم ادغام شده‌اند.</p><p>بصیرتِ محوری این است که نتایجِ علّی نیازمندِ فرض‌های علّی‌اند. هیچ حجمی از دادهٔ صرفاً مشاهده‌ای به‌تنهایی ادعایی علّی نمی‌سازد — فرض‌ها باید از جایی بیرونِ مجموعه‌داده بیایند، و حرکتِ صادقانه نوشتنِ آن‌هاست.</p>",
xe:"Ice cream sales and drownings rise together every summer. Neither causes the other, and no statistic in the dataset says so.",
xf:"فروشِ بستنی و غرق‌شدگی هر تابستان با هم بالا می‌روند. هیچ‌کدام علتِ دیگری نیست، و هیچ آماره‌ای در آن داده این را نمی‌گوید.",
pe:"Where epistemology stops being philosophy and becomes your day job. Everything else on this map informs how you think; this branch determines what you can defend in writing.",
pf:"جایی که معرفت‌شناسی از فلسفه‌بودن دست می‌کشد و به کارِ روزانهٔ شما بدل می‌شود. بقیهٔ نقشه بر نحوهٔ اندیشیدنِ شما اثر می‌گذارد؛ این شاخه تعیین می‌کند چه چیزی را می‌توانید مکتوب دفاع کنید.",
c:["ladder","confound","collider","simpson"]},

ladder:{t:"Pearl's ladder of causation",tf:"نردبانِ علیّتِ پرل",w:"Judea Pearl",q:"ladder of causation Pearl intervention counterfactual",
en:"<p>Three rungs: <b>association</b> (seeing), <b>intervention</b> (doing), and <b>counterfactuals</b> (imagining what would have been). Questions on a higher rung cannot be answered with data from a lower one.</p>",
fa:"<p>سه پله: <b>هم‌بستگی</b> (دیدن)، <b>مداخله</b> (انجام‌دادن) و <b>خلافِ واقع</b> (تصورِ آنچه می‌بود). پرسش‌های پلهٔ بالاتر با دادهٔ پلهٔ پایین‌تر پاسخ نمی‌گیرند.</p>",
xe:"Correlation tells you what accompanies what. Only intervention tells you what happens if you change it.",
xf:"همبستگی می‌گوید چه چیزی با چه چیزی همراه است. تنها مداخله می‌گوید اگر تغییرش دهید چه رخ می‌دهد.",
pe:"Diagnoses most bad policy inference in a single move: the claim sits on rung two or three, and the data sits on rung one.",
pf:"بیشترِ استنتاج‌های نادرستِ سیاستی را در یک حرکت تشخیص می‌دهد: ادعا روی پلهٔ دوم یا سوم است و داده روی پلهٔ اول.",c:[]},

confound:{t:"Confounding and DAGs",tf:"مخدوش‌گری و گراف‌های علّی",w:"Pearl · Greenland · Robins",q:"confounding directed acyclic graph backdoor",
en:"<p>A common cause of both treatment and outcome produces association without causation. Directed acyclic graphs make the assumed causal structure explicit so the required adjustments can be derived rather than guessed.</p>",
fa:"<p>علتی مشترک برای هم مداخله و هم پیامد، هم‌بستگیِ بدونِ علیّت می‌سازد. گراف‌های جهت‌دارِ بی‌دور، ساختارِ علّیِ مفروض را آشکار می‌کنند تا تعدیل‌های لازم استنتاج شوند نه حدس زده.</p>",
xe:"Wealth causes both private schooling and later earnings, so the raw association between the two overstates the effect of schooling.",
xf:"ثروت هم علتِ مدرسهٔ خصوصی است و هم علتِ درآمدِ بعدی، پس همبستگیِ خامِ آن دو اثرِ مدرسه را بزرگ‌نمایی می‌کند.",
pe:"Drawing the DAG forces you to state causal assumptions you were making implicitly anyway. The discomfort of writing them down is the point.",
pf:"کشیدنِ گرافِ علّی شما را وادار می‌کند فرض‌های علّی‌ای را که به‌هر‌حال ضمنی داشتید بیان کنید. ناخوشایندیِ نوشتنشان، دقیقاً نکته است.",c:[]},

collider:{t:"Collider bias",tf:"سوگیریِ برخوردگر",w:"Berkson · Pearl",q:"collider bias Berkson paradox selection",
en:"<p>Conditioning on a common <b>effect</b> of two variables induces a spurious association between them. This is the error sophisticated analysts make, because it looks like careful controlling.</p>",
fa:"<p>شرطی‌کردن بر <b>معلولِ</b> مشترکِ دو متغیر، میان آن‌ها هم‌بستگیِ کاذب پدید می‌آورد. این خطایی است که تحلیل‌گرانِ ماهر مرتکب می‌شوند، چون شبیهِ کنترلِ دقیق به‌نظر می‌رسد.</p>",
xe:"Among admitted students, test scores and grades correlate negatively — because either one alone could have won admission.",
xf:"در میان دانشجویانِ پذیرفته‌شده، نمرهٔ آزمون و معدل هم‌بستگیِ منفی دارند — چون هر یک به‌تنهایی می‌توانست پذیرش را رقم بزند.",
pe:"Any sample defined by a selection criterion is a collider. Ask what conditioning your dataset already encodes before you add more.",
pf:"هر نمونه‌ای که با یک معیارِ گزینش تعریف شده، یک برخوردگر است. پیش از افزودنِ کنترل‌های بیشتر بپرسید مجموعه‌دادهٔ شما از پیش چه شرطی‌سازی‌ای در خود دارد.",c:[]},

simpson:{t:"Simpson's paradox",tf:"پارادوکسِ سیمپسون",w:"Edward Simpson · Udny Yule",q:"Simpsons paradox aggregation",
en:"<p>A trend present in every subgroup can reverse when the subgroups are combined. Both the aggregated and disaggregated numbers are correct; they answer different questions.</p>",
fa:"<p>روندی که در هر زیرگروه هست، هنگام تجمیعِ زیرگروه‌ها می‌تواند وارونه شود. هم اعداد تجمیعی درست‌اند و هم تفکیکی؛ به پرسش‌های متفاوتی پاسخ می‌دهند.</p>",
xe:"A treatment better for men and better for women, yet worse for people overall.",
xf:"درمانی که هم برای مردان بهتر است و هم برای زنان، اما در مجموع برای مردم بدتر.",
pe:"The aggregation level is a substantive choice, not a presentational one. Whoever picks it picks the answer — so it belongs in the methodology, not the formatting.",
pf:"سطحِ تجمیع انتخابی ماهوی است نه شکلی. هر که آن را برمی‌گزیند، پاسخ را برگزیده — پس جایش در روش‌شناسی است نه در صفحه‌آرایی.",c:[]},

values:{L:1,t:"Values in science",tf:"ارزش‌ها در علم",w:"Richard Rudner · Heather Douglas on 'inductive risk'",q:"values in science inductive risk Douglas",
en:"<p>Rudner's argument: since no hypothesis is ever conclusively verified, accepting one always means deciding that the evidence is <b>sufficient</b>. How much is sufficient depends on how bad the two kinds of error would be. That is a value judgment, and it cannot be delegated to the statistics.</p><p>Heather Douglas developed this into the modern literature on inductive risk. The upshot is not that science is political; it is that the value judgment is unavoidable, and therefore should be made explicitly and by the right people.</p>",
fa:"<p>استدلالِ رودنر: چون هیچ فرضیه‌ای هرگز قطعی تأیید نمی‌شود، پذیرشِ آن همیشه یعنی تصمیم به اینکه شواهد <b>کافی</b> است. اینکه چقدر کافی است به این بستگی دارد که دو نوع خطا چقدر بد باشند. این یک داوریِ ارزشی است و نمی‌توان آن را به آمار واگذار کرد.</p><p>هدر داگلاس این را به ادبیاتِ امروزیِ «ریسکِ استقرایی» گسترش داد. نتیجه این نیست که علم سیاسی است؛ این است که داوریِ ارزشی ناگزیر است، پس باید صریح و توسط افرادِ درست انجام شود.</p>",
xe:"Setting α = 0.05 in a drug trial is a decision about how many deaths of each kind you are willing to tolerate. Nothing in the mathematics tells you where to put it.",
xf:"تعیینِ α = ۰٫۰۵ در کارآزماییِ دارو، تصمیمی است دربارهٔ اینکه چند مرگ از هر نوع را می‌پذیرید. هیچ چیز در ریاضیات نمی‌گوید آن را کجا بگذارید.",
pe:"The philosophical description of what you are doing when you pick a threshold or a specification. It also tells you who should be making that call — and it is usually not the analyst alone.",
pf:"توصیفِ فلسفیِ آنچه هنگام انتخابِ یک آستانه یا مشخصه‌بندی انجام می‌دهید. همچنین می‌گوید چه کسی باید آن تصمیم را بگیرد — و معمولاً تحلیل‌گر به‌تنهایی نیست.",c:[]},

repl:{t:"The replication crisis",tf:"بحرانِ تکرارپذیری",w:"Ioannidis · Meehl · Gelman · Nosek",q:"replication crisis reproducibility",
en:"<p>A large share of published findings fail when independently repeated. The causes are mostly structural — incentives, flexible analysis, selective publication — rather than fraudulent.</p>",
fa:"<p>بخش بزرگی از یافته‌های منتشرشده هنگام تکرارِ مستقل شکست می‌خورند. علت‌ها بیشتر ساختاری‌اند — انگیزه‌ها، تحلیلِ انعطاف‌پذیر، انتشارِ گزینشی — نه تقلب.</p>",
xe:"Whole subfields of psychology and medicine failed systematic replication attempts, including results taught as settled.",
xf:"زیررشته‌های کاملی از روان‌شناسی و پزشکی در تلاش‌های نظام‌مندِ تکرار شکست خوردند، از جمله نتایجی که به‌عنوان امرِ قطعی تدریس می‌شد.",
pe:"Sets a prior on any single published result — including, and especially, the ones that support your position.",
pf:"احتمالِ پیشینی برای هر نتیجهٔ منتشرشدهٔ منفرد تعیین می‌کند — از جمله و به‌ویژه آن‌هایی که موضعِ شما را تأیید می‌کنند.",
c:["pval","forking","pubbias"]},

pval:{t:"What a p-value isn't",tf:"آنچه مقدارِ p نیست",w:"Fisher; the ASA's 2016 statement",q:"p-value misinterpretation",
en:"<p>A p-value is the probability of data at least this extreme <b>given</b> that the null hypothesis is true. It is not the probability that the null is true, not the probability the result will replicate, and not a measure of effect size or importance.</p>",
fa:"<p>مقدارِ p احتمالِ دادهٔ دست‌کم به این حد حدی است <b>به‌شرطِ</b> صادق‌بودنِ فرضِ صفر. نه احتمالِ صادق‌بودنِ فرضِ صفر است، نه احتمالِ تکرارِ نتیجه، و نه سنجه‌ای برای اندازه یا اهمیتِ اثر.</p>",
xe:"p = 0.04 does not mean a 96% chance the effect is real. It means the data would be unusual if there were no effect.",
xf:"p = ۰٫۰۴ یعنی ۹۶ درصد احتمالِ واقعی‌بودنِ اثر نیست. یعنی اگر اثری نبود، این داده غیرعادی می‌بود.",
pe:"The most consequential misreading in applied work. Fixing it changes what you are entitled to write in a findings section.",
pf:"پرپیامدترین بدخوانی در کارِ کاربردی. اصلاحش تغییر می‌دهد که مجازید چه چیزی در بخشِ یافته‌ها بنویسید.",c:[]},

forking:{t:"The garden of forking paths",tf:"باغِ راه‌های چنگالی",w:"Andrew Gelman & Eric Loken",q:"garden of forking paths researcher degrees of freedom",
en:"<p>Even with no intent to cheat, analysts make defensible choices that depend on how the data happened to look. The test was therefore never truly pre-specified, and the false positive rate is far above the nominal one.</p>",
fa:"<p>حتی بدون قصدِ تقلب، تحلیل‌گران انتخاب‌هایی قابل دفاع می‌کنند که به ظاهرِ اتفاقیِ داده وابسته است. پس آزمون هرگز واقعاً از پیش تعیین نشده بود و نرخِ مثبتِ کاذب بسیار بالاتر از نرخِ اسمی است.</p>",
xe:"You would have excluded different outliers if the data had looked different. That counterfactual is enough to break the test.",
xf:"اگر داده جور دیگری بود، پرت‌های دیگری را کنار می‌گذاشتید. همین خلافِ واقع برای شکستنِ آزمون کافی است.",
pe:"The argument for pre-registration even when you have no intention of cheating. Good faith is not a defence, because the mechanism does not require bad faith.",
pf:"استدلالی برای ثبتِ پیشاپیشِ طرح، حتی وقتی قصدِ تقلب ندارید. حسنِ نیت دفاع نیست، چون این سازوکار نیازی به سوءنیت ندارد.",c:[]},

pubbias:{t:"Publication bias",tf:"سوگیریِ انتشار",w:"Rosenthal's 'file drawer problem'",q:"publication bias file drawer",
en:"<p>Null results are less likely to be written up and less likely to be accepted, so the published literature systematically over-represents positive findings.</p>",
fa:"<p>نتایجِ صفر کمتر نوشته می‌شوند و کمتر پذیرفته می‌شوند، پس ادبیاتِ منتشرشده به‌طور نظام‌مند یافته‌های مثبت را بیش از حد بازمی‌نمایاند.</p>",
xe:"Twenty studies run, two reach significance, two get published. The literature shows a 100% success rate.",
xf:"بیست پژوهش انجام می‌شود، دو تا معنادار می‌شود، دو تا منتشر می‌شود. ادبیات نرخِ موفقیتِ صد درصدی نشان می‌دهد.",
pe:"Any literature review is a biased sample unless you have actively searched the file drawer. Treat “the evidence consistently shows” with the suspicion it has earned.",
pf:"هر مرور ادبیات نمونه‌ای سوگیرانه است مگر آنکه فعالانه در «کشوی بایگانی» جسته باشید. با جملهٔ «شواهد به‌طور یکسان نشان می‌دهد» با همان بدگمانی‌ای برخورد کنید که سزاوارش است.",c:[]},
social:{L:1,t:"Social epistemology",tf:"معرفت‌شناسیِ اجتماعی",w:"Goldman · Fricker · Nguyen",q:"social epistemology testimony expertise",
en:"<p>Traditional epistemology studied a lone knower with evidence in front of them. That picture describes almost none of your actual epistemic life. Nearly everything you believe arrived through other people, institutions, and systems for producing and certifying claims.</p><p>Social epistemology studies the effects of that: when to trust testimony, how a non-expert can evaluate experts, what to do when a peer disagrees, and how groups can be collectively worse than their members.</p><p>This is where most real-world epistemic failure actually happens, and it is the branch practitioners study least.</p>",
fa:"<p>معرفت‌شناسیِ سنتی، شناسنده‌ای تنها را با شواهدی پیشِ رو مطالعه می‌کرد. آن تصویر تقریباً هیچ بخشی از زندگیِ معرفتیِ واقعی شما را توصیف نمی‌کند. تقریباً هر آنچه باور دارید از راه دیگران، نهادها و نظام‌هایی برای تولید و تصدیقِ ادعاها به شما رسیده است.</p><p>معرفت‌شناسیِ اجتماعی پیامدهای این را بررسی می‌کند: چه زمانی به گواهی اعتماد کنیم، غیرمتخصص چگونه متخصصان را بسنجد، وقتی همتایی مخالفت می‌کند چه کنیم، و چگونه گروه‌ها می‌توانند از تک‌تکِ اعضایشان بدتر باشند.</p><p>بیشترِ شکستِ معرفتیِ واقعی همین‌جا رخ می‌دهد، و همین شاخه‌ای است که اهلِ عمل کمتر از همه مطالعه‌اش می‌کنند.</p>",
xe:"You have never verified the boiling point of mercury, the population of Brazil, or the safety of the building you are sitting in.",
xf:"شما هرگز نقطهٔ جوشِ جیوه، جمعیتِ برزیل یا ایمنیِ ساختمانی که در آن نشسته‌اید را راستی‌آزمایی نکرده‌اید.",
pe:"If you want to improve the accuracy of what you believe professionally, the leverage is here — in how you select and weight sources — not in improving your own reasoning.",
pf:"اگر می‌خواهید دقتِ باورهای حرفه‌ای‌تان بالا برود، اهرم اینجاست — در نحوهٔ گزینش و وزن‌دهی به منابع — نه در بهبودِ استدلالِ شخصی‌تان.",
c:["expert","disag","aumann","echo","cascade","condorcet","injust","fem"]},

expert:{L:1,t:"Judging experts",tf:"داوری دربارهٔ متخصصان",w:"Alvin Goldman",q:"novice expert problem Goldman",
en:"<p>Goldman's question: when two experts disagree and you cannot assess the substance, what can a novice legitimately go on? He gives five criteria.</p><p>The quality of the arguments each presents. The <b>agreement of other experts</b>. Independent evidence that each is genuinely expert. Interests and biases that might distort them. And their <b>track record</b> of past claims that later resolved.</p><p>The last is by far the hardest to fake and by far the least often checked.</p>",
fa:"<p>پرسشِ گلدمن: وقتی دو متخصص اختلاف دارند و شما نمی‌توانید محتوا را بسنجید، غیرمتخصص به‌درستی بر چه چیزی می‌تواند تکیه کند؟ او پنج معیار می‌دهد.</p><p>کیفیتِ استدلال‌هایی که هر یک ارائه می‌کند. <b>توافقِ سایر متخصصان</b>. شواهدِ مستقل بر اینکه هر یک واقعاً متخصص است. منافع و سوگیری‌هایی که ممکن است آنان را منحرف کند. و <b>کارنامهٔ</b> ادعاهای گذشته‌شان که بعداً معلوم شد درست یا غلط بودند.</p><p>آخری بسیار سخت‌تر از بقیه جعل‌شدنی است و بسیار کمتر از بقیه بررسی می‌شود.</p>",
xe:"Two economists disagree about a policy. You cannot referee the models — but you can check whether either has ever made a dated, checkable prediction.",
xf:"دو اقتصاددان دربارهٔ سیاستی اختلاف دارند. نمی‌توانید میان مدل‌ها داوری کنید — اما می‌توانید ببینید آیا هیچ‌یک تا کنون پیش‌بینیِ تاریخ‌دار و قابل بررسی کرده است یا نه.",
pe:"Directly usable, today. Also note the second criterion is the one most vulnerable to information cascades, so apparent consensus needs its independence checked before it counts.",
pf:"همین امروز قابل استفاده است. توجه کنید معیارِ دوم بیش از همه در برابر آبشارهای اطلاعاتی آسیب‌پذیر است، پس پیش از آنکه اجماعِ ظاهری به‌حساب بیاید باید استقلالش بررسی شود.",
k:["cascade","authority"],c:[]},

disag:{t:"Peer disagreement",tf:"اختلافِ همتایان",w:"Christensen · Kelly · Elga",q:"peer disagreement conciliationism steadfast",
en:"<p>An epistemic peer — someone equally informed and equally capable — reaches the opposite conclusion from the same evidence. <b>Conciliationism</b> says you should move substantially toward them. The <b>steadfast</b> view says you may hold your position.</p>",
fa:"<p>یک همتای معرفتی — کسی به همان اندازه آگاه و توانا — از همان شواهد به نتیجه‌ای مخالف می‌رسد. <b>مصالحه‌گرایی</b> می‌گوید باید به‌طور معنادار به سمت او حرکت کنید. دیدگاهِ <b>استوار</b> می‌گوید می‌توانید بر موضع خود بمانید.</p>",
xe:"You and an equally competent colleague read the same file and reach opposite conclusions. Should either of you move?",
xf:"شما و همکاری به همان اندازه توانمند یک پرونده را می‌خوانید و به نتایج مخالف می‌رسید. آیا هیچ‌یک باید جابه‌جا شود؟",
pe:"Most professionals are conciliationist in theory and steadfast in practice. Noticing that gap in yourself is uncomfortable and useful.",
pf:"بیشترِ حرفه‌ای‌ها در نظر مصالحه‌گرا و در عمل استوارند. دیدنِ این شکاف در خود، ناخوشایند و سودمند است.",
k:["aumann"],c:[]},

aumann:{t:"Aumann's agreement theorem",tf:"قضیهٔ توافقِ اومان",w:"Robert Aumann",q:"Aumann agreement theorem common priors",
en:"<p>Two rational agents with common priors, who each know the other's posterior, cannot agree to disagree. Persistent disagreement between them is formally impossible.</p>",
fa:"<p>دو عاملِ عقلانی با احتمالاتِ پیشینِ مشترک، که هر یک احتمالِ پسینِ دیگری را می‌داند، نمی‌توانند بر سرِ اختلاف توافق کنند. اختلافِ پایدار میان آن‌ها صوراً ناممکن است.</p>",
xe:"Formally proven, and almost never observed. Which tells you at least one condition fails in every real disagreement.",
xf:"صوراً اثبات شده و تقریباً هرگز مشاهده نشده. یعنی در هر اختلافِ واقعی دست‌کم یکی از شرط‌ها برقرار نیست.",
pe:"Locates the problem precisely. Persistent disagreement is about priors or about information — never about “we just see it differently”, which is not an available explanation.",
pf:"مسئله را دقیق مکان‌یابی می‌کند. اختلافِ پایدار یا دربارهٔ پیشین‌هاست یا دربارهٔ اطلاعات — هرگز دربارهٔ اینکه «ما فقط جور دیگری می‌بینیم»، که اصلاً تبیینِ در دسترسی نیست.",c:[]},

echo:{L:1,t:"Echo chambers vs bubbles",tf:"اتاقِ پژواک در برابر حبابِ معرفتی",w:"C. Thi Nguyen",q:"echo chambers epistemic bubbles Nguyen",
en:"<p>Nguyen's distinction is one of the most clarifying ideas in contemporary epistemology, and the two things it separates are constantly confused.</p><p>An <b>epistemic bubble</b> is a structure that simply omits opposing voices. You have not heard the other side. Bubbles are fragile: they pop on contact with a dissenter.</p><p>An <b>echo chamber</b> actively discredits outside sources. You have heard the other side and been told, in advance, why those people lie. Echo chambers are robust: exposure to contrary evidence <b>confirms</b> the framework, because the framework predicted you would encounter it.</p>",
fa:"<p>تمایزی که نگوین می‌گذارد یکی از روشنگرترین ایده‌های معرفت‌شناسیِ معاصر است، و دو چیزی که از هم جدا می‌کند دائماً با هم خلط می‌شوند.</p><p><b>حبابِ معرفتی</b> ساختاری است که صرفاً صداهای مخالف را حذف می‌کند. شما طرفِ دیگر را نشنیده‌اید. حباب‌ها شکننده‌اند: با برخورد به یک مخالف می‌ترکند.</p><p><b>اتاقِ پژواک</b> فعالانه منابعِ بیرونی را بی‌اعتبار می‌کند. شما طرفِ دیگر را شنیده‌اید و از پیش به شما گفته‌اند چرا آن‌ها دروغ می‌گویند. اتاق‌های پژواک مقاوم‌اند: مواجهه با شواهدِ مخالف چارچوب را <b>تأیید</b> می‌کند، چون چارچوب پیش‌بینی کرده بود که با آن روبه‌رو خواهید شد.</p>",
xe:"A bubble pops when you meet a dissenter. An echo chamber has already explained why that particular dissenter is compromised.",
xf:"حباب وقتی می‌ترکد که با مخالفی روبه‌رو شوید. اتاقِ پژواک از پیش توضیح داده که چرا دقیقاً همان مخالف فاسد است.",
pe:"They need opposite remedies. Bubbles need exposure; echo chambers need trust to be rebuilt first, because exposure alone makes them stronger. Conflating the two is why “just show people other views” so often backfires.",
pf:"این دو درمان‌های متضاد می‌خواهند. حباب‌ها به مواجهه نیاز دارند؛ اتاق‌های پژواک نخست به بازسازیِ اعتماد نیاز دارند، چون مواجههٔ صرف آن‌ها را قوی‌تر می‌کند. خلطِ این دو دلیلِ آن است که «فقط دیدگاه‌های دیگر را نشانشان دهید» اغلب نتیجهٔ عکس می‌دهد.",c:[]},

cascade:{L:1,t:"Information cascades",tf:"آبشارهای اطلاعاتی",w:"Bikhchandani, Hirshleifer & Welch · Sunstein",q:"information cascade herding",
en:"<p>Each person acts rationally on the combination of their own private signal and the visible choices of those before them. Once enough people have acted, the public information swamps any individual's private signal, and everyone afterwards rationally ignores what they themselves know.</p><p>The result is a confident consensus that almost nobody independently verified — reached by a sequence of individually rational steps.</p>",
fa:"<p>هر فرد به‌طور عقلانی بر پایهٔ ترکیبِ سیگنالِ خصوصیِ خود و انتخاب‌های آشکارِ پیشینیان عمل می‌کند. همین‌که شمار کافی عمل کردند، اطلاعاتِ عمومی بر سیگنالِ خصوصیِ هر فرد غلبه می‌کند و همه از آن پس به‌درستی آنچه را خود می‌دانند نادیده می‌گیرند.</p><p>نتیجه، اجماعی مطمئن است که تقریباً هیچ‌کس مستقلاً راستی‌آزمایی‌اش نکرده — و از راهِ توالی‌ای از گام‌های فی‌نفسه عقلانی به دست آمده.</p>",
xe:"Three experts cite the same original source. The fourth cites the three. By the tenth, the claim has ten citations and one piece of evidence.",
xf:"سه متخصص به یک منبعِ اصلی ارجاع می‌دهند. چهارمی به آن سه ارجاع می‌دهد. تا دهمی، ادعا ده ارجاع دارد و یک شاهد.",
pe:"Trace your independent confirmations back to their origin. Often three converging expert opinions turn out to be one study wearing three hats — and Goldman's agreement criterion silently fails.",
pf:"تأییدهای «مستقل» را تا سرچشمه دنبال کنید. اغلب سه نظرِ همگرای متخصصان در واقع یک پژوهش است با سه کلاه — و معیارِ توافقِ گلدمن بی‌سروصدا از کار می‌افتد.",
k:["condorcet","expert"],c:[]},

condorcet:{t:"Condorcet jury theorem",tf:"قضیهٔ هیئت‌منصفهٔ کندرسه",w:"Marquis de Condorcet",q:"Condorcet jury theorem majority",
en:"<p>If each voter is even slightly better than chance and votes <b>independently</b>, the probability that the majority is right approaches certainty as the group grows.</p>",
fa:"<p>اگر هر رأی‌دهنده حتی اندکی بهتر از تصادف باشد و <b>مستقل</b> رأی دهد، احتمالِ درست‌بودنِ اکثریت با بزرگ‌شدنِ گروه به یقین نزدیک می‌شود.</p>",
xe:"A thousand slightly-better-than-random judges beat one expert. The condition doing all the work is independence.",
xf:"هزار داورِ اندکی‌بهتر‌از‌تصادف از یک متخصص بهتر عمل می‌کنند. شرطی که تمامِ کار را می‌کند، استقلال است.",
pe:"The formal case for aggregation, and the exact reason cascades are so destructive: they destroy the independence the theorem requires while leaving the appearance of a large sample.",
pf:"استدلالِ صوری به سودِ تجمیع، و دقیقاً دلیلِ ویرانگریِ آبشارها: استقلالی را که قضیه لازم دارد نابود می‌کنند و در عین حال ظاهرِ نمونهٔ بزرگ را حفظ می‌کنند.",c:[]},

injust:{t:"Epistemic injustice",tf:"بی‌عدالتیِ معرفتی",w:"Miranda Fricker",q:"epistemic injustice testimonial hermeneutical Fricker",
en:"<p>Wrongs done to someone specifically in their capacity as a knower. <b>Testimonial</b> injustice: prejudice causes a hearer to give a speaker's word less credit than it deserves. <b>Hermeneutical</b> injustice: a group lacks the shared concepts needed to make sense of its own experience.</p>",
fa:"<p>ستمی که بر کسی دقیقاً در مقامِ «داننده» روا می‌شود. بی‌عدالتیِ <b>گواهانه</b>: پیش‌داوری سبب می‌شود شنونده به سخنِ گوینده کمتر از استحقاقش اعتبار دهد. بی‌عدالتیِ <b>تفسیری</b>: گروهی مفاهیمِ مشترکِ لازم برای فهمِ تجربهٔ خود را ندارد.</p>",
xe:"A complaint dismissed because of who raised it rather than what it said.",
xf:"شکایتی که به‌خاطرِ اینکه چه کسی مطرحش کرده رد می‌شود، نه به‌خاطر آنچه گفته است.",
pe:"A precise diagnostic for why certain information never reaches decision-makers, and why the gap is invisible from the top.",
pf:"ابزاری دقیق برای تشخیصِ اینکه چرا برخی اطلاعات هرگز به تصمیم‌گیرندگان نمی‌رسد، و چرا این شکاف از بالا دیده نمی‌شود.",c:[]},

fem:{t:"Feminist epistemology",tf:"معرفت‌شناسیِ فمینیستی",w:"Longino · Harding · Code",q:"feminist epistemology standpoint theory",
en:"<p>Studies how social position shapes what gets investigated, who is credited, and which questions are asked at all. Standpoint theory argues some positions afford better access to particular facts, because those in them have had to understand both the system and their place in it.</p>",
fa:"<p>بررسی می‌کند که جایگاهِ اجتماعی چگونه تعیین می‌کند چه چیزی پژوهیده شود، اعتبار به چه کسی برسد و اصلاً چه پرسش‌هایی پرسیده شود. نظریهٔ دیدگاه استدلال می‌کند برخی جایگاه‌ها دسترسیِ بهتری به واقعیت‌های خاص می‌دهند، چون کسانی که در آن جایگاه‌اند ناچار بوده‌اند هم نظام را بفهمند و هم جای خود را در آن.</p>",
xe:"Which effects of a policy get measured depends on who designed the study and what they expected to find.",
xf:"اینکه کدام اثرهای یک سیاست اندازه‌گیری شوند به این بستگی دارد که چه کسی پژوهش را طراحی کرده و انتظار داشته چه بیابد.",
pe:"A structural critique of the knowledge-production process itself — which is precisely where any regulatory evidence base comes from.",
pf:"نقدی ساختاری بر خودِ فرایندِ تولیدِ دانش — و دقیقاً همان‌جاست که هر پایگاه شواهدِ مقرراتی از آن می‌آید.",c:[]},

natur:{L:1,t:"Naturalized epistemology",tf:"معرفت‌شناسیِ طبیعی‌شده",w:"W.V.O. Quine, 'Epistemology Naturalized'",q:"naturalized epistemology Quine",
en:"<p>Quine's proposal: stop asking from the armchair how knowledge <b>ought</b> to work and study empirically how it does. Epistemology becomes a chapter of psychology — the study of how sensory input produces theoretical output.</p><p>This is the doorway through which the entire heuristics-and-biases literature entered philosophy, and it is why a paper about anchoring effects counts as epistemology.</p>",
fa:"<p>پیشنهاد کواین: از این پرسشِ اتاق‌نشینانه که معرفت <b>باید</b> چگونه کار کند دست بکشید و تجربی مطالعه کنید که چگونه کار می‌کند. معرفت‌شناسی به فصلی از روان‌شناسی بدل می‌شود — مطالعهٔ اینکه ورودیِ حسی چگونه خروجیِ نظری تولید می‌کند.</p><p>این همان دری است که تمامِ ادبیاتِ «ابتکارها و سوگیری‌ها» از آن به فلسفه وارد شد، و به همین دلیل مقاله‌ای دربارهٔ اثرِ لنگر، معرفت‌شناسی به‌حساب می‌آید.</p>",
xe:"Rather than defining justification, measure which processes actually produce true beliefs and under what conditions.",
xf:"به‌جای تعریفِ توجیه، اندازه بگیرید کدام فرایندها واقعاً باورهای صادق تولید می‌کنند و تحت چه شرایطی.",
pe:"The bridge from philosophy to the behavioural literature you already know — and a reminder to hold that literature to the standards it teaches.",
pf:"پلی از فلسفه به ادبیاتِ رفتاری‌ای که از پیش می‌شناسید — و یادآوریِ اینکه همان ادبیات را با معیارهایی که خود می‌آموزد بسنجید.",
oe:"If epistemology is just psychology, what happened to the normative question of what we should believe? Description cannot answer it.",
of:"اگر معرفت‌شناسی صرفاً روان‌شناسی است، پرسشِ هنجاریِ «چه باید باور کنیم» چه شد؟ توصیف نمی‌تواند به آن پاسخ دهد.",
c:["quine","hb","conf","motiv","ecolog","argth","blind"]},

quine:{t:"Epistemology naturalized",tf:"طبیعی‌سازیِ معرفت‌شناسی",w:"Quine, 1969",q:"Quine epistemology naturalized",
en:"<p>Quine's 1969 essay argued the foundationalist project had failed and should be replaced by empirical inquiry into how humans actually get from meagre sensory input to elaborate theory.</p>",
fa:"<p>مقالهٔ ۱۹۶۹ کواین استدلال کرد پروژهٔ مبناگرایانه شکست خورده و باید جای خود را به پژوهشِ تجربی دربارهٔ اینکه انسان‌ها در عمل چگونه از ورودیِ حسیِ اندک به نظریهٔ پیچیده می‌رسند بدهد.</p>",
pe:"The move that made empirical work about reasoning philosophically respectable rather than beside the point.",
pf:"همان حرکتی که کارِ تجربی دربارهٔ استدلال را از «بی‌ربط» به «محترم از نظر فلسفی» بدل کرد.",c:[]},

hb:{t:"Heuristics and biases",tf:"ابتکارها و سوگیری‌ها",w:"Kahneman & Tversky",q:"heuristics and biases Kahneman Tversky",
en:"<p>Systematic, predictable departures from normative reasoning: availability, representativeness, anchoring, base-rate neglect, the conjunction fallacy.</p>",
fa:"<p>انحراف‌های نظام‌مند و پیش‌بینی‌پذیر از استدلالِ هنجاری: دسترس‌پذیری، نمایندگی، لنگرانداختن، غفلت از نرخِ پایه، مغالطهٔ عطف.</p>",
xe:"People judge how common something is by how easily examples come to mind — which tracks memorability, not frequency.",
xf:"مردم فراوانیِ چیزی را با سهولتِ به‌ذهن‌آمدنِ نمونه‌ها می‌سنجند — که به‌یادماندنی‌بودن را ردیابی می‌کند نه بسامد را.",
pe:"Useful, but hold this literature to the standard it teaches: a substantial part of it replicated poorly, and the honest version of the module includes that.",
pf:"سودمند است، اما این ادبیات را با همان معیاری بسنجید که خودش می‌آموزد: بخش قابل توجهی از آن بد تکرار شد، و روایتِ صادقانه همین را هم در بر می‌گیرد.",c:[]},

conf:{L:1,t:"Confirmation bias",tf:"سوگیریِ تأییدی",w:"Peter Wason · Raymond Nickerson",q:"confirmation bias Wason",
en:"<p>The tendency to seek, notice, and weight evidence that supports what you already believe, and to work less hard at finding what would count against it.</p><p>Wason's 2-4-6 task is the classic demonstration. Participants are given a triple that fits a hidden rule and asked to discover the rule by proposing further triples. Almost everyone proposes triples they expect to <b>fit</b>. Almost nobody proposes one they expect to fail — which is the only kind of test that could disconfirm.</p>",
fa:"<p>گرایش به جست‌وجو، توجه و وزن‌دهیِ بیشتر به شواهدی که آنچه را از پیش باور دارید تأیید می‌کند، و کوششِ کمتر برای یافتنِ آنچه خلافِ آن است.</p><p>تکلیفِ ۲-۴-۶ واسون نمایشِ کلاسیک آن است. به شرکت‌کنندگان سه‌تایی داده می‌شود که با قاعده‌ای پنهان جور است و از آنان خواسته می‌شود با پیشنهادِ سه‌تایی‌های دیگر قاعده را کشف کنند. تقریباً همه سه‌تایی‌هایی پیشنهاد می‌کنند که انتظار دارند <b>جور دربیاید</b>. تقریباً هیچ‌کس سه‌تایی‌ای پیشنهاد نمی‌کند که انتظار دارد شکست بخورد — و تنها همان نوع آزمون است که می‌تواند ابطال کند.</p>",
xe:"You run the specification you expect to work. When it works, you stop. The decision to stop is where the bias lives.",
xf:"مشخصه‌بندی‌ای را اجرا می‌کنید که انتظار دارید جواب دهد. وقتی جواب می‌دهد، متوقف می‌شوید. تصمیم به توقف، همان جایی است که سوگیری زندگی می‌کند.",
pe:"The psychological counterpart of Popper's point, and the reason the fix must be procedural rather than attitudinal. Assign someone to try to break the result; do not rely on wanting to be objective.",
pf:"همتای روان‌شناختیِ نکتهٔ پوپر، و دلیلِ اینکه راه‌حل باید رویه‌ای باشد نه نگرشی. کسی را مأمور کنید نتیجه را بشکند؛ به «خواستنِ بی‌طرفی» تکیه نکنید.",
k:["popper"],c:[]},

motiv:{t:"Motivated reasoning",tf:"استدلالِ انگیزه‌مند",w:"Ziva Kunda · Dan Kahan",q:"motivated reasoning identity protective cognition",
