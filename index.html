 without pressure for conformity. Groupthink involves social cohesion, suppression of dissent, or motivational pressures."],["Cascade and echo chamber","A cascade amplifies sequential social evidence; an echo chamber actively discredits outside sources. Their mechanisms and remedies differ."]],"mistakes":["Counting ten sequential endorsements as ten independent data points.","Assuming a cascade requires irrational herd behavior; the classic result is that rational agents can create it."],"check":{"q":"Five analysts each see earlier recommendations before issuing their own, and later reports cite the growing consensus rather than private evidence. What should you trace?","a":"The information genealogy. If later choices were driven by earlier public choices, the apparent five-way confirmation may contain only the first few private signals; the rest are socially correlated echoes."}},"fa":{"line":"آبشارِ اطلاعاتی وقتی رخ می‌دهد که افراد عقلانیاً انتخاب‌های عمومیِ قبلی را به علامتِ خصوصیِ خود ترجیح دهند و در نتیجه تصمیم‌های ظاهراً فراوان بر اطلاعاتِ مستقلِ بسیار کمی تکیه کنند.","why":"<p>توافقِ اجتماعی می‌تواند مانند شاهدِ عظیم دیده شود در حالی که از کپی‌کردنِ ترتیبی ساخته شده است. وقتی انتخاب‌های اولیه به‌اندازهٔ کافی اطلاعاتی شوند، افرادِ بعدی شاید علامتِ خصوصیِ ضعیفِ خود را نادیده بگیرند. گروه سپس اجماعِ قوی بدون عمقِ شاهدیِ متناسب می‌سازد و با شوکی کوچک می‌تواند برگردد.</p>","origin":"مدلِ صوری با سوشیل بیکچاندانی، دیوید هیرشلیفر و ایوو ولچ پیوند دارد؛ کارهای مرتبطِ کس سانستین آبشارها را در حقوق و گروه‌ها بررسی می‌کند. بینشِ کلیدی تقلیدِ عقلانی است: لازم نیست هیچ فردی احمق باشد تا اطلاعاتِ جمعی شکننده شود.","obj":[["اگر افراد عقلانیاً رفتارِ دیگران را اطلاعات می‌گیرند، چرا نتیجه را شکست بنامیم؟","چون استنتاجِ عقلانیِ فردی می‌تواند تجمیعِ اطلاعات را نابود کند. وقتی مردم از علامتِ خصوصی‌شان دست می‌کشند، ناظرانِ بعدی دیگر نمی‌توانند آن علامت‌ها را از رفتار یاد بگیرند. فرایندِ اجتماعی با وجودِ دفاع‌پذیریِ هر تصمیمِ محلی کم‌اطلاع‌تر می‌شود."],["در واقعیت مردم دلیل می‌گویند، نه فقط انتخابِ دوگانه؛ مدلِ ساده بیش از حد انتزاعی است.","ارتباط می‌تواند آبشار را تضعیف کند اگر شاهدِ خصوصی واقعاً آشکار شود، اما انگیزهٔ حیثیتی، استنادهای تکراری و تأییدهای عمومی می‌توانند همان وابستگی را بازسازی کنند. مدل سازوکاری را جدا می‌کند که در محیط‌های غنی‌تر هم باقی می‌ماند."]],"confuse":[["آبشارِ اطلاعاتی و گروه‌اندیشی","آبشار می‌تواند از استنتاجِ عقلانی دربارهٔ انتخابِ دیگران بدون فشارِ همرنگی رخ دهد. گروه‌اندیشی شامل انسجامِ اجتماعی، سرکوبِ مخالفت یا فشارِ انگیزشی است."],["آبشار و اتاقِ پژواک","آبشار شاهدِ اجتماعیِ ترتیبی را تقویت می‌کند؛ اتاقِ پژواک منابعِ بیرونی را فعالانه بی‌اعتبار می‌کند. سازوکار و درمانشان فرق دارد."]],"mistakes":["ده تأییدِ ترتیبی را ده دادهٔ مستقل شمردن.","فرض‌کردنِ اینکه آبشار نیازمندِ رفتارِ گله‌ایِ غیرعقلانی است؛ نتیجهٔ کلاسیک این است که عاملانِ عقلانی هم می‌توانند آن را بسازند."],"check":{"q":"پنج تحلیلگر پیش از توصیهٔ خود توصیه‌های قبلی را می‌بینند و گزارش‌های بعدی به «اجماعِ رو به رشد» استناد می‌کنند نه شاهدِ خصوصی. چه چیزی را باید ردیابی کنید؟","a":"تبارِ اطلاعات را. اگر انتخاب‌های بعدی از انتخاب‌های عمومیِ قبلی آمده باشند، تأییدِ ظاهراً پنج‌گانه شاید فقط چند علامتِ خصوصیِ اولیه داشته باشد و بقیه پژواک‌های هم‌بسته باشند."}}},"conf":{"en":{"line":"Confirmation bias is the tendency to seek, generate, interpret, and stop on evidence in ways that preferentially protect an existing hypothesis.","why":"<p>The danger is not merely noticing supportive evidence. Rational inquiry should seek evidence that discriminates among hypotheses, and often the most informative test is one designed to fail your favored view. Confirmation bias distorts the search process before the final interpretation even begins.</p>","origin":"Peter Wason’s selection and 2-4-6 tasks are classic experimental demonstrations; Raymond Nickerson’s review helped consolidate the broad concept. The modern literature distinguishes confirmation bias from motivated reasoning and myside bias because they can have different causes and remedies.","obj":[["Looking for confirming instances is sometimes efficient; science cannot test every alternative all the time.","Correct. The bias is not 'ever seeking confirmation' but asymmetric search or stopping when disconfirming tests would have higher information value. Good inquiry balances cost with diagnosticity."],["Many famous cognitive-bias effects are fragile or context-dependent, so the label can become a just-so story.","That is why structural countermeasures are preferable to amateur diagnosis: pre-specify tests, require falsifying conditions, use blinded analysis, and log stopping rules. The intervention can be useful even when motive attribution is uncertain."]],"confuse":[["Confirmation bias and motivated reasoning","Confirmation bias can arise from generic search heuristics without a desired conclusion. Motivated reasoning specifically involves incentives or identity shaping which conclusion the mind works to defend."],["Confirmation and corroboration","Evidence that supports a hypothesis after a severe test is epistemically valuable. The bias concerns asymmetric evidence search and interpretation, not the mere existence of supporting evidence."]],"mistakes":["Defining the bias as 'believing evidence that supports you' rather than examining how evidence was selected and when search stopped.","Using the label primarily on opponents instead of changing your own research design to make disconfirmation easier."],"check":{"q":"You run specifications until the expected sign appears, then stop and report the successful version. Where exactly is the confirmation bias?","a":"In the asymmetric search and stopping rule. The reported estimate may be computed correctly, but the process selectively samples the specification space until it produces confirmatory evidence."}},"fa":{"line":"سوگیریِ تأیید گرایش به جست‌وجو، تولید، تفسیر و توقف بر شواهد به شیوه‌ای است که فرضیهٔ موجود را ترجیحاً محافظت می‌کند.","why":"<p>خطر فقط دیدنِ شاهدِ موافق نیست. پژوهشِ عقلانی باید شاهدی بجوید که میان فرضیه‌ها تمایز می‌گذارد و اغلب اطلاع‌بخش‌ترین آزمون همان است که برای شکستِ دیدگاهِ محبوب طراحی شده. سوگیریِ تأیید فرایندِ جست‌وجو را پیش از تفسیرِ نهایی کج می‌کند.</p>","origin":"آزمون‌های انتخاب و ۲-۴-۶ پیتر واسون نمایش‌های کلاسیک‌اند؛ مرورِ ریموند نیکرسون مفهومِ گسترده را تثبیت کرد. ادبیاتِ جدید سوگیریِ تأیید را از استدلالِ انگیزه‌مند و سوگیریِ «طرفِ خودم» جدا می‌کند چون علت و درمانشان می‌تواند فرق کند.","obj":[["جست‌وجوی مواردِ تأییدکننده گاهی کارآمد است؛ علم نمی‌تواند همیشه همهٔ بدیل‌ها را بیازماید.","درست است. سوگیری «هرگز دنبال تأیید نرو» نیست؛ جست‌وجوی نامتقارن یا توقف وقتی است که آزمونِ ابطال‌کننده ارزشِ اطلاعاتیِ بیشتری دارد. پژوهشِ خوب هزینه را با قدرتِ تشخیص متعادل می‌کند."],["بسیاری از اثرهای مشهورِ سوگیری شکننده یا زمینه‌وابسته‌اند، پس برچسب می‌تواند داستانی پس‌از‌واقعه شود.","به همین دلیل مقابلهٔ ساختاری از تشخیصِ آماتوری بهتر است: آزمون را پیش‌مشخص کنید، شرطِ ابطال بخواهید، تحلیلِ کور و قاعدهٔ توقف ثبت‌شده داشته باشید. مداخله حتی وقتی نسبت‌دادنِ انگیزه نامطمئن است مفید می‌ماند."]],"confuse":[["سوگیریِ تأیید و استدلالِ انگیزه‌مند","سوگیریِ تأیید می‌تواند از ابتکارهای عمومیِ جست‌وجو بدون نتیجهٔ دلخواه بیاید. استدلالِ انگیزه‌مند مشخصاً وقتی است که انگیزه یا هویت ذهن را به دفاع از نتیجه‌ای خاص می‌کشاند."],["تأیید و تأییدِ آزمونی","شاهدی که پس از آزمونِ سخت از فرضیه حمایت می‌کند ارزشمند است. سوگیری دربارهٔ جست‌وجو و تفسیرِ نامتقارن است، نه صرفِ وجودِ شاهدِ موافق."]],"mistakes":["تعریفِ سوگیری به «باورکردنِ شاهدی که به نفع توست» به‌جای بررسیِ انتخابِ شاهد و قاعدهٔ توقف.","استفاده از برچسب عمدتاً برای مخالفان، به‌جای تغییرِ طراحیِ خود برای آسان‌کردنِ ابطال."],"check":{"q":"مشخصاتِ مختلف را اجرا می‌کنید تا علامتِ موردِ انتظار ظاهر شود، سپس متوقف و همان را گزارش می‌کنید. سوگیریِ تأیید دقیقاً کجاست؟","a":"در جست‌وجوی نامتقارن و قاعدهٔ توقف. برآوردِ گزارش‌شده شاید درست محاسبه شده باشد، اما فرایند فضای مشخصات را آن‌قدر گزینشی نمونه‌گیری کرده تا شاهدِ تأییدکننده بسازد."}}},"motiv":{"en":{"line":"Motivated reasoning occurs when a desired conclusion, identity, or incentive changes how evidence is searched, scrutinized, and interpreted.","why":"<p>Reasoning skill does not guarantee truth-seeking. A capable thinker can use greater cognitive resources to build stronger defenses for a preferred conclusion. The problem is especially important in political, organizational, and identity-laden settings where being right competes with belonging, status, or material incentives.</p>","origin":"Ziva Kunda’s review is foundational to the modern concept; Dan Kahan’s work on identity-protective cognition emphasizes politically charged reasoning. The syllabus highlights a striking finding: on some polarized questions, greater numeracy can increase polarization because skill serves the motive.","obj":[["It is too easy to accuse anyone who disagrees with you of motivated reasoning, making the concept unfalsifiable.","Exactly. Motive should not be inferred merely from disagreement. Look for asymmetric standards, selective search, predictable shifts when incentives change, or experimental evidence. Structural safeguards are safer than mind-reading."],["People sometimes reason directionally because they possess different priors or values, not because cognition is corrupted.","Correct. Motivated reasoning is a causal claim about how a motive affects processing, not a synonym for having a strong prior or normative commitment. Distinguishing facts, values, and incentives is essential."]],"confuse":[["Motivated reasoning and confirmation bias","Confirmation bias describes a pattern of asymmetric evidence handling; motivated reasoning adds a directional motive explaining why the asymmetry favors a desired conclusion."],["Motivated reasoning and lying","A motivated reasoner may sincerely believe the resulting conclusion. Lying requires knowingly asserting what one believes false; motivated cognition can distort belief itself."]],"mistakes":["Diagnosing motivation from the fact that someone reached a conclusion you dislike.","Assuming intelligence protects against it; cognitive skill can make motivated defense more sophisticated."],"check":{"q":"An analyst applies harsh robustness standards to results that hurt her preferred policy but accepts friendly results after one specification. What evidence would distinguish motivated reasoning from ordinary methodological inconsistency?","a":"A systematic directional asymmetry tied to the preferred conclusion—especially if standards reverse when the policy direction reverses or incentives/identity cues are experimentally changed. One inconsistent choice alone does not establish motive."}},"fa":{"line":"استدلالِ انگیزه‌مند وقتی رخ می‌دهد که نتیجهٔ مطلوب، هویت یا انگیزه شیوهٔ جست‌وجو، موشکافی و تفسیرِ شاهد را تغییر دهد.","why":"<p>مهارتِ استدلال تضمینِ حقیقت‌جویی نیست. متفکرِ توانا می‌تواند منابعِ شناختیِ بیشتر را برای ساختنِ دفاعِ قوی‌تر از نتیجهٔ محبوب به کار گیرد. مسئله در سیاست، سازمان و موقعیت‌های هویت‌بار مهم است، جایی که درست‌بودن با تعلق، منزلت یا منفعتِ مادی رقابت می‌کند.</p>","origin":"مرورِ زیوا کوندا برای مفهومِ مدرن بنیادی است؛ کارِ دن کاهان دربارهٔ شناختِ محافظِ هویت استدلالِ سیاسی‌شده را برجسته می‌کند. برنامهٔ شما یافتهٔ تکان‌دهنده‌ای را یادآوری می‌کند: در برخی مسائلِ قطبی، مهارتِ عددیِ بیشتر می‌تواند قطبی‌شدن را افزایش دهد چون مهارت در خدمتِ انگیزه قرار می‌گیرد.","obj":[["خیلی آسان است هر مخالفی را به استدلالِ انگیزه‌مند متهم کنیم و مفهوم را ابطال‌ناپذیر سازیم.","دقیقاً. انگیزه نباید فقط از اختلاف استنتاج شود. به معیارهای نامتقارن، جست‌وجوی گزینشی، تغییرِ قابل‌پیش‌بینی با انگیزه‌ها یا شاهدِ آزمایشی نگاه کنید. حفاظِ ساختاری از ذهن‌خوانی امن‌تر است."],["مردم گاهی به‌سببِ پیشین یا ارزشِ متفاوت جهت‌دار استدلال می‌کنند، نه چون شناختشان خراب شده.","درست است. استدلالِ انگیزه‌مند ادعای علّی دربارهٔ اثرِ انگیزه بر پردازش است، نه مترادفِ پیشینِ قوی یا تعهدِ هنجاری. جداکردنِ واقعیت، ارزش و انگیزه ضروری است."]],"confuse":[["استدلالِ انگیزه‌مند و سوگیریِ تأیید","سوگیریِ تأیید الگوی پردازشِ نامتقارنِ شاهد را توصیف می‌کند؛ استدلالِ انگیزه‌مند انگیزه‌ای جهت‌دار را اضافه می‌کند که توضیح می‌دهد چرا عدم‌تقارن به نفع نتیجهٔ مطلوب است."],["استدلالِ انگیزه‌مند و دروغ","فاعلِ انگیزه‌مند ممکن است صادقانه نتیجهٔ حاصل را باور کند. دروغ مستلزمِ اظهارِ آگاهانهٔ خلافِ باور است؛ شناختِ انگیزه‌مند خودِ باور را کج می‌کند."]],"mistakes":["تشخیصِ انگیزه فقط از اینکه کسی به نتیجهٔ نامطلوبِ شما رسیده است.","فرض‌کردنِ اینکه هوش محافظت می‌کند؛ مهارتِ شناختی می‌تواند دفاعِ انگیزه‌مند را پیچیده‌تر کند."],"check":{"q":"تحلیلگری برای نتایجِ مخالفِ سیاستِ محبوبش آزمون‌های استحکامِ سخت می‌خواهد اما نتیجهٔ موافق را پس از یک مشخصات می‌پذیرد. چه چیزی استدلالِ انگیزه‌مند را از بی‌ثباتیِ معمولِ روش‌شناختی جدا می‌کند؟","a":"عدم‌تقارنِ جهت‌دار و نظام‌مند که به نتیجهٔ محبوب وصل است — به‌ویژه اگر با عوض‌شدنِ جهتِ سیاست یا تغییرِ نشانه‌های هویتی/انگیزشی معیارها هم برعکس شوند. یک انتخابِ ناسازگار به‌تنهایی انگیزه را ثابت نمی‌کند."}}},"blind":{"en":{"line":"The bias blind spot is the tendency to see cognitive biases more readily in other people than in oneself, even after learning about those biases.","why":"<p>Bias education can perversely increase confidence: once you can name errors, you become better at diagnosing opponents while assuming your own introspection reveals unbiased motives. The blind spot is therefore a meta-bias—a failure in how we apply the concept of bias itself.</p>","origin":"Emily Pronin and collaborators developed the bias-blind-spot literature. One proposed mechanism is the introspection illusion: we inspect our conscious reasons and do not “see” a bias, while judging others from observable behavior where bias patterns are easier to detect.","obj":[["Maybe people really are better at detecting others’ biases because third-person distance is informative.","Sometimes. The blind spot is not that every self-assessment is wrong, but that people systematically grant their own introspection evidential privileges they do not grant others. Objective records and symmetric procedures are needed to test the asymmetry."],["Calling the blind spot itself a universal bias risks the same overgeneralization criticized in bias research.","The right use is probabilistic and procedural, not accusatory. Treat the finding as a reason to build self-audit mechanisms—prediction logs, preregistration, red teams—rather than as proof that any particular judgment is biased."]],"confuse":[["Bias blind spot and overconfidence","Overconfidence concerns miscalibrated certainty or self-assessment. The blind spot specifically concerns asymmetry in detecting bias in self versus others."],["Introspection and debiasing","Knowing your conscious reasons does not reveal all causal influences on reasoning. Introspection can be useful without being a reliable bias detector."]],"mistakes":["Finishing a bias course and mainly using the vocabulary to classify coworkers.","Treating sincerity—'I genuinely followed the evidence'—as strong evidence that motivation or selection effects were absent."],"check":{"q":"You can list three biases in a colleague’s memo but none in your own, because “I know why I reached my conclusion.” What is the correct next move?","a":"Do not trust the asymmetry. Apply an externalized audit to your own work: pre-specified alternatives, a decision log, independent replication, or a red team. The blind spot is exactly why introspective innocence is weak evidence."}},"fa":{"line":"نقطه‌کورِ سوگیری گرایش به دیدنِ سوگیری‌های شناختی در دیگران آسان‌تر از خود است، حتی پس از یادگیریِ همان سوگیری‌ها.","why":"<p>آموزشِ سوگیری می‌تواند به‌شکلِ معکوس اعتمادبه‌نفس را بالا ببرد: وقتی نامِ خطاها را می‌دانید در تشخیصِ مخالف بهتر می‌شوید و هم‌زمان فرض می‌کنید درون‌نگریِ خودتان انگیزه‌های بی‌طرف را نشان می‌دهد. نقطه‌کور یک فراسوگیری است — شکست در کاربردِ خودِ مفهومِ سوگیری.</p>","origin":"امیلی پرونین و همکاران ادبیاتِ نقطه‌کور را بسط دادند. یکی از سازوکارهای پیشنهادی «توهمِ درون‌نگری» است: دلایلِ آگاهانهٔ خود را می‌بینیم و سوگیری را «نمی‌بینیم»، اما دیگران را از رفتارِ بیرونی داوری می‌کنیم که الگوهای سوگیری در آن آشکارتر است.","obj":[["شاید مردم واقعاً سوگیریِ دیگران را بهتر می‌بینند چون فاصلهٔ سوم‌شخص اطلاعاتی است.","گاهی بله. نقطه‌کور نمی‌گوید هر خودارزیابی غلط است؛ می‌گوید مردم به درون‌نگریِ خود امتیازِ شاهدیِ نظام‌مندی می‌دهند که به دیگران نمی‌دهند. برای آزمودنِ این عدم‌تقارن به ثبتِ عینی و رویهٔ متقارن نیاز است."],["نقطه‌کور را سوگیریِ جهانی نامیدن خودش همان تعمیمِ افراطیِ پژوهشِ سوگیری است.","کاربردِ درست احتمالی و رویه‌ای است، نه اتهامی. یافته را دلیلی برای ساختنِ سازوکارِ خودحسابرسی — ثبتِ پیش‌بینی، پیش‌ثبت، تیمِ قرمز — بدانید، نه اثباتِ اینکه داوریِ خاصی سوگیرانه است."]],"confuse":[["نقطه‌کور و بیش‌اطمینانی","بیش‌اطمینانی دربارهٔ یقین یا خودارزیابیِ بدکالیبره است. نقطه‌کور مشخصاً عدم‌تقارنِ تشخیصِ سوگیری در خود و دیگران است."],["درون‌نگری و رفعِ سوگیری","دانستنِ دلایلِ آگاهانه همهٔ عللِ استدلال را آشکار نمی‌کند. درون‌نگری می‌تواند مفید باشد بی‌آنکه آشکارسازِ قابل‌اعتمادِ سوگیری باشد."]],"mistakes":["پایانِ دورهٔ سوگیری با استفادهٔ عمده از واژگان برای طبقه‌بندیِ همکاران.","شاهدِ قوی دانستنِ صداقت — «واقعاً فقط شاهد را دنبال کردم» — برای نبودِ انگیزه یا اثرِ انتخاب."],"check":{"q":"در یادداشتِ همکار سه سوگیری پیدا می‌کنید و در یادداشتِ خود هیچ، چون «می‌دانم چرا به نتیجه‌ام رسیدم». حرکتِ درستِ بعدی چیست؟","a":"به این عدم‌تقارن اعتماد نکنید. حسابرسیِ بیرونی را روی کارِ خود اعمال کنید: بدیل‌های پیش‌مشخص، دفترِ تصمیم، بازتولیدِ مستقل یا تیمِ قرمز. نقطه‌کور دقیقاً می‌گوید بی‌گناهیِ درون‌نگرانه شاهدِ ضعیفی است."}}},"ivirt":{"en":{"line":"Intellectual virtues are stable traits—such as humility, courage, honesty, carefulness, and open-mindedness—that reliably improve inquiry rather than merely individual arguments.","why":"<p>Good reasoning depends not only on rules but on the person applying them. An agent can know every fallacy and still avoid threatening evidence, defend status, or stop inquiry early. Virtue epistemology asks what traits make someone systematically better at reaching truth, understanding, and responsible belief over time.</p>","origin":"Linda Zagzebski is a major contemporary figure in virtue epistemology, alongside Ernest Sosa’s competence-based approach. Character-oriented versions connect epistemology to virtue ethics; reliabilist versions emphasize intellectual abilities that successfully produce true belief.","obj":[["Traits like humility and open-mindedness are culturally valued manners, not necessarily truth-conducive properties.","A virtue-epistemic account must connect the trait to epistemic ends. Humility becomes calibrated self-assessment, courage becomes willingness to follow evidence despite cost, and open-mindedness must be bounded by competence rather than indiscriminate receptivity."],["Virtues can conflict: intellectual courage may require defending a minority view while humility recommends deference.","Exactly. Virtue is context-sensitive practical judgment, not maximizing each trait independently. Mature agency coordinates virtues under epistemic goals; conflict is a feature of the theory, not a reason to reduce it to a checklist."]],"confuse":[["Intellectual humility and low confidence","Humility is calibration about one’s limitations. It can coexist with 99% confidence when the evidence and competence warrant 99%."],["Open-mindedness and neutrality","Open-mindedness means being genuinely responsive to reasons and alternatives. It does not require treating every claim or source as equally credible."]],"mistakes":["Performing humility linguistically—adding caveats—without changing how evidence or criticism can actually move you.","Treating virtues as personality aesthetics rather than dispositions tied to epistemic performance."],"check":{"q":"A researcher is strongly confident, states exactly what evidence would overturn the conclusion, and actively funds a replication designed to fail it. Is strong confidence inconsistent with intellectual humility?","a":"No. That can be exemplary humility: confidence is high but calibrated, limitations are explicit, and the researcher remains genuinely answerable to possible defeat."}},"fa":{"line":"فضایلِ فکری صفاتِ پایداری مانند فروتنی، شجاعت، صداقت، دقت و گشودگی‌اند که به‌طور قابل‌اعتماد کلِ پژوهش را بهتر می‌کنند، نه فقط یک استدلال را.","why":"<p>استدلالِ خوب فقط به قاعده وابسته نیست بلکه به کسی که قاعده را به کار می‌برد نیز وابسته است. عامل می‌تواند همهٔ مغالطه‌ها را بداند و باز از شاهدِ تهدیدکننده دوری کند، از منزلت دفاع کند یا زود پژوهش را متوقف سازد. معرفت‌شناسیِ فضیلت می‌پرسد چه صفاتی فرد را در طول زمان در حقیقت، فهم و باورِ مسئولانه بهتر می‌کنند.</p>","origin":"لیندا زاگزبسکی چهرهٔ مهمِ معاصر در معرفت‌شناسیِ فضیلت است و رویکردِ شایستگیِ ارنست سوسا نیز مهم است. نسخه‌های منش‌محور معرفت‌شناسی را به اخلاقِ فضیلت وصل می‌کنند؛ نسخه‌های اعتمادگرایانه بر توانایی‌های فکریِ حقیقت‌ساز تأکید دارند.","obj":[["صفاتِ فروتنی و گشودگی شاید فقط آدابِ فرهنگیِ پسندیده باشند، نه ویژگی‌های حقیقت‌یار.","نظریه باید صفت را به غایتِ معرفتی وصل کند. فروتنی به خودارزیابیِ کالیبره، شجاعت به دنبال‌کردنِ شاهد با وجودِ هزینه و گشودگی به پاسخ‌گوییِ واقعی به دلیل و بدیل تبدیل می‌شود، نه صرفِ ادب."],["فضایل می‌توانند تعارض کنند: شجاعتِ فکری دفاع از دیدگاهِ اقلیت را می‌خواهد و فروتنی توصیه به تبعیت می‌کند.","دقیقاً. فضیلت داوریِ عملیِ زمینه‌حساس است، نه بیشینه‌سازیِ مستقلِ هر صفت. عاملیتِ پخته فضایل را زیرِ غایتِ معرفتی هماهنگ می‌کند؛ تعارض ویژگیِ نظریه است، نه دلیل برای تبدیلِ آن به چک‌لیست."]],"confuse":[["فروتنیِ فکری و اطمینانِ کم","فروتنی کالیبراسیون دربارهٔ محدودیتِ خود است. وقتی شاهد و شایستگی ۹۹٪ می‌خواهد می‌تواند با اطمینانِ ۹۹٪ سازگار باشد."],["گشودگی و بی‌طرفیِ کامل","گشودگی یعنی واقعاً به دلیل و بدیل پاسخ دهید، نه اینکه هر ادعا یا منبع را به یک اندازه معتبر بدانید."]],"mistakes":["اجرای زبانیِ فروتنی با افزودنِ قیدهای احتیاطی، بدون اینکه واقعاً شاهد یا نقد بتواند نظرتان را عوض کند.","فهمِ فضیلت به‌عنوان زیباییِ شخصیت، نه گرایشی که به عملکردِ معرفتی وصل است."],"check":{"q":"پژوهشگری بسیار مطمئن است، دقیق می‌گوید چه شاهدی نتیجه را واژگون می‌کند و برای بازتولیدی که برای شکستِ نتیجه طراحی شده بودجه می‌دهد. آیا اطمینانِ زیاد با فروتنیِ فکری ناسازگار است؟","a":"نه. می‌تواند نمونهٔ فروتنی باشد: اطمینان بالا اما کالیبره است، محدودیت‌ها صریح‌اند و پژوهشگر واقعاً در برابر شکست پاسخ‌گو باقی می‌ماند."}}},"ivice":{"en":{"line":"Epistemic vices are stable habits or character traits—dogmatism, closed-mindedness, intellectual arrogance, negligence—that systematically obstruct knowledge and understanding.","why":"<p>Some failures are not one-off reasoning errors. An organization can repeatedly miss evidence because its members are incurious, defensive, or unwilling to admit uncertainty even when each individual inference is technically competent. Vice epistemology diagnoses the posture that generates recurring epistemic failure.</p>","origin":"Quassim Cassam is a prominent contemporary advocate of analyzing intellectual vice, including through real intelligence and policy failures. The approach complements cognitive-bias research by focusing on responsible habits and character rather than automatic psychological mechanisms alone.","obj":[["Calling someone vicious moralizes disagreement and invites character attacks instead of argument.","That danger is real. Vice should be inferred from stable epistemic behavior—repeated evasion of counterevidence, strategic ignorance, refusal to correct—not from holding an unpopular or mistaken belief. Diagnose patterns, not opponents’ souls."],["Many apparent vices are adaptive responses to incentives or institutions rather than personal defects.","Then the unit of diagnosis should expand. Organizations can cultivate epistemic vice through promotion systems, secrecy, or punishment of dissent. Character language should not obscure structural causes."]],"confuse":[["Epistemic vice and cognitive bias","Bias often denotes an automatic or general cognitive tendency. Vice implies a more stable disposition connected to agency and sometimes responsibility."],["Dogmatism and conviction","Strong conviction is compatible with responsiveness to defeaters. Dogmatism is the disposition to insulate belief from appropriate revision."]],"mistakes":["Using vice labels as ad hominem shortcuts after losing patience with an argument.","Ignoring institutional incentives that repeatedly reward closed-minded behavior and then blaming only individual character."],"check":{"q":"A team repeatedly suppresses inconvenient sensitivity checks because leadership punishes uncertainty. Is the right diagnosis only “individual closed-mindedness”?","a":"No. The behavior is epistemically vicious, but the causal structure is institutional. A good diagnosis targets both the repeated vice-like practice and the incentives that produce and reward it."}},"fa":{"line":"رذایلِ معرفتی عادت‌ها یا صفاتِ پایداری مانند جزم‌اندیشی، ذهن‌بستگی، تکبرِ فکری و سهل‌انگاری‌اند که به‌طور نظام‌مند مانعِ معرفت و فهم می‌شوند.","why":"<p>بعضی شکست‌ها خطای یک‌بارهٔ استدلال نیستند. سازمان می‌تواند مرتب شاهد را از دست بدهد چون اعضایش کنجکاوی ندارند، دفاعی‌اند یا حاضر نیستند عدمِ‌قطعیت را بپذیرند، حتی اگر هر استنتاجِ منفرد فنی باشد. معرفت‌شناسیِ رذیلت حالتِ پایداری را تشخیص می‌دهد که خطای تکراری می‌سازد.</p>","origin":"قاسم کسام از مدافعانِ مهمِ معاصرِ تحلیلِ رذیلتِ فکری است و از شکست‌های واقعیِ اطلاعاتی و سیاستی استفاده می‌کند. رویکرد پژوهشِ سوگیریِ شناختی را تکمیل می‌کند چون به عادت و منشِ مسئولانه می‌پردازد، نه فقط سازوکارِ روان‌شناختیِ خودکار.","obj":[["رذیلت نامیدنِ فرد اختلاف را اخلاقی و به حملهٔ شخصیتی تبدیل می‌کند.","خطر واقعی است. رذیلت باید از رفتارِ معرفتیِ پایدار استنتاج شود — فرارِ تکراری از شاهدِ مخالف، نادانیِ راهبردی، امتناع از اصلاح — نه از داشتنِ باورِ نامحبوب یا اشتباه. الگو را تشخیص دهید، نه روحِ مخالف را."],["بسیاری از رذایلِ ظاهری پاسخ به انگیزه یا نهادند، نه نقصِ شخصی.","در آن صورت واحدِ تشخیص باید گسترده شود. سازمان می‌تواند با نظامِ ارتقا، محرمانگی یا تنبیهِ مخالفت رذیلتِ معرفتی بسازد. زبانِ منش نباید علتِ ساختاری را پنهان کند."]],"confuse":[["رذیلتِ معرفتی و سوگیریِ شناختی","سوگیری اغلب گرایشِ خودکار یا عمومیِ شناختی است. رذیلت گرایشی پایدارتر با پیوند به عاملیت و گاهی مسئولیت است."],["جزم‌اندیشی و باورِ قوی","باورِ قوی می‌تواند در برابر ابطال‌کننده پاسخ‌گو باشد. جزم‌اندیشی گرایش به مصون‌کردنِ باور از بازنگریِ مناسب است."]],"mistakes":["استفاده از برچسبِ رذیلت به‌عنوان میان‌بُرِ حملهٔ شخصی وقتی از استدلال خسته شده‌اید.","نادیده‌گرفتنِ انگیزه‌های نهادی که رفتارِ بسته را پاداش می‌دهند و سپس سرزنشِ صرفِ شخصیتِ فرد."],"check":{"q":"تیمی مرتب آزمون‌های حساسیتِ ناخوشایند را حذف می‌کند چون مدیریت عدمِ‌قطعیت را تنبیه می‌کند. آیا تشخیص فقط «ذهن‌بستگیِ افراد» است؟","a":"نه. رفتار رذیلت‌گونهٔ معرفتی است، اما ساختارِ علّی نهادی است. تشخیصِ خوب هم عملِ تکراریِ معیوب و هم انگیزه‌هایی را هدف می‌گیرد که آن را تولید و پاداش می‌دهند."}}},"scout":{"en":{"line":"The scout mindset treats beliefs as maps to be corrected; the soldier mindset treats them as positions to be defended.","why":"<p>Many epistemic failures are not deficits of intelligence but failures of objective function. If reasoning is serving identity, status, or victory, better reasoning skill can make defense stronger. The scout metaphor asks the agent to optimize for accurate representation even when accuracy is personally inconvenient.</p>","origin":"Julia Galef popularized the scout-versus-soldier framing in <i>The Scout Mindset</i>. It synthesizes ideas from motivated reasoning, forecasting, and intellectual virtue into a practical orientation rather than a formal philosophical theory.","obj":[["The metaphor oversimplifies: real agents must sometimes advocate, negotiate, and act under commitment rather than endlessly update.","True. Scout mindset is an epistemic stance toward the map, not a ban on decisive action. You can commit to a strategy while maintaining separate channels for updating the beliefs on which the strategy rests."],["Wanting accuracy does not make you unbiased; everyone already thinks they are following the map.","Exactly. The mindset must be operationalized with behaviors: forecast before outcomes, seek disconfirming evidence, reward correction, state cruxes, and separate status from being right. Self-description alone proves nothing."]],"confuse":[["Scout mindset and indecision","A scout can decide quickly with current probabilities. Updating the map does not require postponing action until certainty."],["Scout mindset and neutrality","Accuracy can support strong moral or policy commitments. The point is not to lack values but to avoid bending factual beliefs to protect them."]],"mistakes":["Adopting 'scout' as an identity badge, which turns the anti-identity tool into another identity.","Equating openness with giving every alternative equal time regardless of evidence."],"check":{"q":"You are defending a policy you strongly value and discover evidence that weakens its stated mechanism but not necessarily the value goal. What would a scout do?","a":"Update the factual map and separate it from the value commitment: concede the mechanism evidence, revise the instrumental argument, and then ask whether another route serves the same goal. Protecting the value does not require protecting a false empirical story."}},"fa":{"line":"ذهنیتِ دیده‌بان باورها را نقشه‌ای برای اصلاح می‌بیند؛ ذهنیتِ سرباز آن‌ها را مواضعی برای دفاع می‌بیند.","why":"<p>بسیاری از شکست‌های معرفتی کمبودِ هوش نیستند بلکه مشکلِ تابعِ هدف‌اند. اگر استدلال در خدمتِ هویت، منزلت یا پیروزی باشد، مهارتِ بیشتر دفاع را قوی‌تر می‌کند. استعارهٔ دیده‌بان از عامل می‌خواهد برای نمایشِ دقیقِ واقعیت بهینه کند حتی وقتی حقیقت شخصاً ناخوشایند است.</p>","origin":"جولیا گالف چارچوبِ دیده‌بان/سرباز را در <i>ذهنیتِ دیده‌بان</i> مشهور کرد. این چارچوب ایده‌های استدلالِ انگیزه‌مند، پیش‌بینی و فضیلتِ فکری را به گرایشی عملی تبدیل می‌کند، نه نظریه‌ای صوری.","obj":[["استعاره ساده‌سازی می‌کند: عاملِ واقعی گاهی باید دفاع، مذاکره و عملِ متعهدانه کند، نه اینکه بی‌پایان به‌روزرسانی کند.","درست است. ذهنیتِ دیده‌بان حالتِ معرفتی نسبت به نقشه است، نه ممنوعیتِ تصمیمِ قاطع. می‌توانید به راهبرد متعهد شوید و هم‌زمان کانالِ مستقلی برای به‌روزرسانیِ باورهای زیربنایی نگه دارید."],["خواستنِ دقت شما را بی‌سوگیری نمی‌کند؛ همه از پیش فکر می‌کنند نقشه را دنبال می‌کنند.","دقیقاً. ذهنیت باید به رفتار تبدیل شود: پیش از نتیجه پیش‌بینی ثبت کنید، شاهدِ مخالف بجویید، اصلاح را پاداش دهید، گره‌های تغییرنظر را بگویید و منزلت را از درست‌بودن جدا کنید. خودتوصیفی هیچ چیز را ثابت نمی‌کند."]],"confuse":[["ذهنیتِ دیده‌بان و بی‌تصمیمی","دیده‌بان می‌تواند با احتمال‌های فعلی سریع تصمیم بگیرد. اصلاحِ نقشه نیازمندِ تعویقِ عمل تا یقین نیست."],["ذهنیتِ دیده‌بان و بی‌طرفی","دقت می‌تواند از تعهدِ اخلاقی یا سیاستیِ قوی پشتیبانی کند. هدف بی‌ارزشی نیست؛ هدف خم‌نکردنِ باورِ factual برای محافظت از ارزش است."]],"mistakes":["تبدیلِ «دیده‌بان» به نشانِ هویتی؛ ابزارِ ضدِهویت را به هویتی تازه تبدیل می‌کند.","یکی‌گرفتنِ گشودگی با وقتِ برابر دادن به هر بدیل فارغ از شاهد."],"check":{"q":"از سیاستی که عمیقاً ارزشمند می‌دانید دفاع می‌کنید و شاهدی می‌یابید که سازوکارِ تجربیِ اعلام‌شده را تضعیف می‌کند اما لزوماً هدفِ ارزشی را نه. دیده‌بان چه می‌کند؟","a":"نقشهٔ factual را به‌روزرسانی و از تعهدِ ارزشی جدا می‌کند: ضعفِ شاهدِ سازوکار را می‌پذیرد، استدلالِ ابزاری را اصلاح می‌کند و بعد می‌پرسد آیا مسیرِ دیگری همان هدف را تأمین می‌کند. حفظِ ارزش نیازمندِ حفظِ داستانِ تجربیِ کاذب نیست."}}},"bs":{"en":{"line":"Bullshit is speech produced with indifference to whether it is true; unlike lying, its defining vice is lack of concern for truth rather than deliberate falsity.","why":"<p>Epistemic environments can be damaged not only by false statements but by communication detached from truth-testing altogether. A liar tracks truth closely enough to invert it; the bullshitter optimizes for impression, persuasion, status, or fluency without caring whether the content corresponds to reality.</p>","origin":"Harry Frankfurt’s essay <i>On Bullshit</i> gives the canonical distinction. The idea belongs in virtue epistemology because the central defect is an orientation toward truth, not a logical property of a sentence. A bullshit statement can accidentally be true.","obj":[["The distinction depends on hidden intention, which listeners often cannot know.","Correct. 'Bullshit' is a diagnosis of communicative stance, so it should not be inferred merely from falsity. Observable markers include confident improvisation without verification, indifference to correction, and content that shifts to preserve impression rather than accuracy."],["A liar can be more harmful than an indifferent speaker, so why call bullshit epistemically worse?","Frankfurt’s point is structural, not a universal harm ranking: the liar still recognizes truth as the target to be manipulated, while bullshit erodes the norm that truth is relevant at all. Context determines which causes more damage."]],"confuse":[["Bullshit and lying","A liar believes the statement false and intends deception. Bullshit can be true or false; the speaker’s relationship to truth is indifferent."],["Bullshit and error","An honest error comes from a truth-directed attempt that failed. Bullshit lacks the truth-directed discipline in the first place."]],"mistakes":["Calling every false or sloppy claim bullshit without evidence of indifference to truth.","Focusing only on factual correction when the deeper problem is a process that produces confident content without verification."],"check":{"q":"A presenter confidently invents a statistic, and later says “great, then use the correct number” with no concern that the original was fabricated. Lie, error, or bullshit?","a":"Paradigmatically bullshit: the key feature is indifference to whether the number was true, not necessarily an intention to make the audience believe something the presenter knew was false."}},"fa":{"line":"چرندگویی گفتاری است که با بی‌تفاوتی نسبت به صدق تولید می‌شود؛ برخلاف دروغ، رذیلتِ تعریف‌کننده‌اش بی‌اعتنایی به حقیقت است نه کذبِ عمدی.","why":"<p>محیطِ معرفتی فقط با گزارهٔ کاذب آسیب نمی‌بیند؛ ارتباطی که اصلاً از حقیقت‌آزمایی جدا شده نیز مخرب است. دروغگو آن‌قدر حقیقت را دنبال می‌کند که برعکسش کند؛ چرندگو برای تأثیر، اقناع، منزلت یا روانی بهینه می‌کند بی‌آنکه برای مطابقتِ محتوا با واقعیت اهمیت قائل باشد.</p>","origin":"مقالهٔ <i>دربارهٔ چرندگویی</i> اثرِ هری فرانکفورت تمایزِ معیار را می‌دهد. ایده در معرفت‌شناسیِ فضیلت جای می‌گیرد چون نقصِ مرکزی جهت‌گیری نسبت به حقیقت است، نه خاصیتِ منطقیِ جمله. گزارهٔ چرند می‌تواند اتفاقاً صادق باشد.","obj":[["تمایز به نیتِ پنهان وابسته است و شنونده اغلب آن را نمی‌داند.","درست است. «چرند» تشخیصِ حالتِ ارتباطی است و نباید فقط از کذب استنتاج شود. نشانه‌های قابل‌مشاهده شامل بداهه‌گوییِ مطمئن بدون راستی‌آزمایی، بی‌تفاوتی به اصلاح و تغییرِ محتوا برای حفظِ تأثیر به‌جای دقت است."],["دروغگو می‌تواند زیان‌بارتر از گویندهٔ بی‌تفاوت باشد؛ پس چرا چرند از نظر معرفتی بدتر دانسته می‌شود؟","نکتهٔ فرانکفورت رتبه‌بندیِ جهانیِ آسیب نیست بلکه ساختاری است: دروغگو هنوز حقیقت را هدفی می‌داند که باید دستکاری شود، اما چرند هنجارِ مرتبط‌بودنِ حقیقت را فرسوده می‌کند. زمینه تعیین می‌کند کدام آسیبِ بیشتری می‌زند."]],"confuse":[["چرند و دروغ","دروغگو گزاره را کاذب می‌داند و قصدِ فریب دارد. چرند می‌تواند صادق یا کاذب باشد؛ رابطهٔ گوینده با حقیقت بی‌تفاوت است."],["چرند و خطا","خطای صادقانه حاصلِ تلاشِ حقیقت‌محوری است که شکست خورده. چرند از ابتدا انضباطِ حقیقت‌محور ندارد."]],"mistakes":["چرند نامیدنِ هر ادعای کاذب یا شلخته بدون شاهدِ بی‌تفاوتی به حقیقت.","تمرکز فقط بر تصحیحِ واقعیت وقتی مشکلِ عمیق‌تر فرایندی است که محتوای مطمئن را بدون راستی‌آزمایی تولید می‌کند."],"check":{"q":"ارائه‌دهنده با اعتمادبه‌نفس آماری را از خود می‌سازد و بعد که اصلاح می‌شود می‌گوید «خب عددِ درست را بگذار» بدون نگرانی از ساختگی‌بودنِ اولی. دروغ، خطا یا چرند؟","a":"نمونهٔ چرند است: ویژگیِ اصلی بی‌تفاوتی به صدقِ عدد است، نه لزوماً قصدِ اینکه مخاطب چیزی را باور کند که گوینده می‌دانست کاذب است."}}},"valid":{"en":{"line":"Validity asks whether the conclusion must be true if the premises are true; soundness adds the separate requirement that the premises actually are true.","why":"<p>Arguments fail in two fundamentally different places: the inferential bridge can be invalid, or the bridge can be valid while resting on false premises. Separating validity from soundness prevents a common conversational error—attacking a conclusion because one argument for it is bad, or praising an argument because its conclusion happens to be true.</p>","origin":"The distinction is standard in formal logic and traces back through the Aristotelian tradition. Modern propositional and predicate logic make validity a structural relation: there is no interpretation on which all premises are true and the conclusion false.","obj":[["Real arguments are rarely fully formalized, so validity can seem irrelevant outside textbooks.","Informal arguments still have inferential structure. Formalization is a diagnostic tool: reconstruct the premises and hidden warrants well enough to ask whether the conclusion follows. Toulmin-style analysis complements rather than replaces validity."],["A valid argument can be useless if its premises are absurd, so why privilege validity?","Logic does not privilege it as sufficient. Validity isolates one necessary dimension of deductive quality; soundness requires both valid form and true premises. Keeping the dimensions separate tells you where repair is needed."]],"confuse":[["Validity and truth","Statements are true or false; deductive arguments are valid or invalid. A valid argument can contain false premises and a false conclusion."],["Validity and persuasiveness","An invalid argument can be rhetorically persuasive, and a valid one can be unconvincing if premises are disputed. Persuasion is psychological; validity is structural."]],"mistakes":["Calling a premise 'valid' or a conclusion 'valid'; validity properly describes an inference or argument form.","Rejecting a conclusion merely because the argument offered for it is unsound; the conclusion may have other support."],"check":{"q":"“All heavily regulated firms fail; Bank X is heavily regulated; therefore Bank X will fail.” The form is valid, but the first premise is false. What is the exact diagnosis?","a":"Valid but unsound. The inferential structure transmits the premises correctly, but the argument does not establish the conclusion because at least one premise is false."}},"fa":{"line":"اعتبار می‌پرسد اگر مقدمات صادق باشند آیا نتیجه الزاماً صادق است؛ استواری شرطِ جداگانهٔ صدقِ واقعیِ مقدمات را نیز اضافه می‌کند.","why":"<p>استدلال در دو جای اساساً متفاوت شکست می‌خورد: پلِ استنتاج می‌تواند نامعتبر باشد، یا پل معتبر اما روی مقدماتِ کاذب بنا شده باشد. جداسازیِ اعتبار و استواری از خطای رایج جلوگیری می‌کند: ردِ نتیجه چون یک استدلال برایش بد است، یا ستایشِ استدلال چون نتیجه‌اش اتفاقاً درست است.</p>","origin":"تمایز در منطقِ صوری استاندارد و ریشه‌اش در سنتِ ارسطویی است. منطقِ گزاره‌ها و محمولات اعتبار را رابطه‌ای ساختاری می‌کند: هیچ تفسیرِ ممکن نیست که همهٔ مقدمات صادق و نتیجه کاذب باشد.","obj":[["استدلالِ واقعی به‌ندرت کاملاً صوری است، پس اعتبار بیرون از کتابِ منطق بی‌ربط به نظر می‌رسد.","استدلالِ غیرصوری هم ساختارِ استنتاجی دارد. صورت‌بندی ابزارِ تشخیص است: مقدمات و مجوزهای پنهان را آن‌قدر بازسازی کنید که بتوان پرسید نتیجه واقعاً می‌آید یا نه. تحلیلِ تولمین مکملِ اعتبار است، نه جانشینش."],["استدلالِ معتبر با مقدماتِ پوچ بی‌فایده است؛ پس چرا اعتبار را مهم بدانیم؟","منطق آن را کافی نمی‌داند. اعتبار فقط یک بُعدِ لازمِ کیفیتِ قیاسی را جدا می‌کند؛ استواری هم اعتبار و هم صدقِ مقدمات را می‌خواهد. جداسازی می‌گوید تعمیر در کجاست."]],"confuse":[["اعتبار و صدق","گزاره صادق یا کاذب است؛ استدلالِ قیاسی معتبر یا نامعتبر. استدلالِ معتبر می‌تواند مقدمات و نتیجهٔ کاذب داشته باشد."],["اعتبار و اقناع","استدلالِ نامعتبر می‌تواند از نظر بلاغی قانع‌کننده و استدلالِ معتبر با مقدماتِ موردِ اختلاف غیرقانع‌کننده باشد. اقناع روان‌شناختی است؛ اعتبار ساختاری."]],"mistakes":["«معتبر» نامیدنِ مقدمه یا نتیجه؛ اعتبار به استنتاج یا صورتِ استدلال تعلق دارد.","ردِ نتیجه فقط چون استدلالِ ارائه‌شده نامستوار است؛ نتیجه شاید پشتیبانیِ دیگری داشته باشد."],"check":{"q":"«همهٔ شرکت‌های شدیداً مقررات‌گذاری‌شده شکست می‌خورند؛ بانک X شدیداً مقررات‌گذاری شده؛ پس بانک X شکست می‌خورد.» صورت معتبر است اما مقدمهٔ اول کاذب. تشخیصِ دقیق چیست؟","a":"معتبر اما نامستوار. ساختارِ استنتاج مقدمات را درست منتقل می‌کند، اما چون دست‌کم یک مقدمه کاذب است استدلال نتیجه را اثبات نمی‌کند."}}},"burden":{"en":{"line":"The burden of proof determines who must supply reasons and how much evidence is required before the default position should change.","why":"<p>Many disputes are decided before evidence is weighed because the parties silently assign different defaults. Must a regulator prove a new rule beneficial, or must opponents prove it harmful? Must a claimant establish causation, or must the skeptic produce an alternative? Burden allocation is epistemology turned into procedure.</p>","origin":"The concept is standard in logic, rhetoric, and especially legal theory, where burdens of production and persuasion are explicitly allocated. Different standards—preponderance, clear and convincing evidence, beyond reasonable doubt—show that epistemic thresholds can legitimately vary with the cost of error.","obj":[["Burden of proof is just rhetoric: truth does not depend on who is required to argue first.","Truth does not, but rational action under incomplete evidence does. Burden rules allocate error risk and determine when institutions may act. They are procedural epistemology, not theories of what makes propositions true."],["'Extraordinary claims require extraordinary evidence' can be abused to assign an impossible burden to unpopular claims.","Yes. Burdens should be justified by prior plausibility, stakes, institutional role, and asymmetric error costs—not by social dislike. A burden that can never be discharged becomes an immunizing device."]],"confuse":[["Burden of proof and burden of persuasion","The burden of production asks who must introduce enough evidence to keep an issue alive; the burden of persuasion asks who loses if uncertainty remains at the end."],["Burden and prior probability","Low prior probability can rationally require stronger evidence, but a procedural burden is an institutional rule and may also reflect costs and rights, not only Bayesian priors."]],"mistakes":["Shifting the burden mid-argument after your own evidence is challenged.","Demanding proof from one side while treating the other side’s default as self-justifying rather than explicitly defending the default."],"check":{"q":"A policy debate stalls because one side says “show the rule helps” and the other says “show the rule harms.” What is the first epistemic issue to resolve?","a":"The burden and default: which state persists under unresolved uncertainty, what evidence threshold changes it, and why the costs of error justify that allocation. Without that, the parties are not yet weighing evidence under the same decision rule."}},"fa":{"line":"بارِ اثبات تعیین می‌کند چه کسی باید دلیل بیاورد و چه مقدار شاهد لازم است تا وضعیتِ پیش‌فرض تغییر کند.","why":"<p>بسیاری از اختلاف‌ها پیش از سنجشِ شاهد تعیین می‌شوند چون طرفین پیش‌فرض‌های متفاوتی را بی‌صدا می‌پذیرند. آیا نهاد باید سودِ قاعدهٔ تازه را ثابت کند یا مخالفان زیانش را؟ مدعی باید علیت را نشان دهد یا شکاک باید بدیل بیاورد؟ تخصیصِ بار، معرفت‌شناسی در لباسِ رویه است.</p>","origin":"مفهوم در منطق، بلاغت و به‌ویژه نظریهٔ حقوق استاندارد است، جایی که بارِ ارائه و بارِ اقناع صریحاً تخصیص می‌یابد. معیارهای متفاوت — غلبهٔ شاهد، روشن و قانع‌کننده، ورای شکِ معقول — نشان می‌دهند آستانهٔ معرفتی می‌تواند با هزینهٔ خطا تغییرِ مشروع کند.","obj":[["بارِ اثبات فقط بلاغت است؛ حقیقت به اینکه چه کسی باید اول استدلال کند وابسته نیست.","حقیقت وابسته نیست، اما عملِ عقلانی زیرِ شاهدِ ناقص وابسته است. قواعدِ بار ریسکِ خطا را تخصیص و تعیین می‌کنند نهاد چه وقت مجاز به عمل است. آن‌ها معرفت‌شناسیِ رویه‌ای‌اند، نه نظریهٔ حقیقت."],["«ادعای فوق‌العاده شاهدِ فوق‌العاده می‌خواهد» می‌تواند برای تحمیلِ بارِ ناممکن به ادعای نامحبوب سوءاستفاده شود.","بله. بار باید با احتمالِ پیشین، مخاطره، نقشِ نهادی و هزینهٔ نامتقارنِ خطا توجیه شود، نه با ناپسندیِ اجتماعی. باری که هرگز قابل‌تأمین نیست ابزارِ مصون‌سازی است."]],"confuse":[["بارِ اثبات و بارِ اقناع","بارِ ارائه می‌پرسد چه کسی باید آن‌قدر شاهد وارد کند که مسئله زنده بماند؛ بارِ اقناع می‌پرسد اگر در پایان عدمِ‌قطعیت باقی ماند چه کسی می‌بازد."],["بار و احتمالِ پیشین","پیشینِ پایین می‌تواند عقلانیاً شاهدِ قوی‌تر بخواهد، اما بارِ رویه‌ای قاعدهٔ نهادی است و ممکن است حقوق و هزینه‌ها را نیز منعکس کند، نه فقط پیشینِ بیزی."]],"mistakes":["جابه‌جاکردنِ بار در میانهٔ بحث پس از آنکه شاهدِ خودتان به چالش کشیده شد.","مطالبهٔ اثبات از یک طرف و خودموجه دانستنِ پیش‌فرضِ طرفِ دیگر بدون دفاعِ صریح از آن پیش‌فرض."],"check":{"q":"بحثِ سیاستی گیر کرده چون یک طرف می‌گوید «ثابت کن قاعده مفید است» و طرفِ دیگر «ثابت کن قاعده زیان‌بار است». نخستین مسئلهٔ معرفتی چیست؟","a":"بار و پیش‌فرض: در عدمِ‌قطعیتِ حل‌نشده کدام وضعیت باقی می‌ماند، چه آستانه‌ای آن را تغییر می‌دهد و چرا هزینهٔ خطا این تخصیص را توجیه می‌کند. بدون این، دو طرف هنوز شاهد را زیرِ قاعدهٔ تصمیمِ مشترک نمی‌سنجند."}}},"evidfid":{"en":{"line":"Evidentialism about religious belief requires belief to answer to publicly or personally adequate evidence; fideism allows faith to have rational standing not reducible to ordinary evidential support.","why":"<p>Religious belief concentrates the general problem of whether every rational commitment must be proportioned to evidence of the usual kind. The evidentialist worries that exempting faith licenses arbitrary belief; the fideist worries that demanding prior proof misunderstands the role of trust, commitment, or a form of life.</p>","origin":"The evidential side is classically associated with W.K. Clifford’s ethics of belief; fideist themes run through figures such as Kierkegaard and later Wittgensteinian approaches, though these views differ greatly. The opposition is best treated as a spectrum about evidential requirements, not one simple yes/no doctrine.","obj":[["Fideism seems to license any belief whatsoever once someone calls it faith.","A serious fideist needs limits: a domain-specific account of faith, internal norms, defeaters, and reasons why this commitment has a role not shared by arbitrary fantasies. Without such constraints the Great-Pumpkin problem is immediate."],["Strict evidentialism is impossible to live by because many rational commitments—other minds, memory, moral trust—are not inferred from explicit evidence.","Evidentialists can broaden evidence and distinguish inferential from non-inferential justification. The debate then turns on whether religious experience or practice can supply genuine evidence or basic justification rather than on whether every belief needs an explicit argument."]],"confuse":[["Fideism and irrationality","Fideism claims some faith commitments need not be grounded in ordinary evidential inference. It does not automatically mean believing contradictions or ignoring every defeater."],["Religious evidentialism and atheism","Evidentialism is a norm for belief, not a conclusion. An evidentialist could judge the evidence sufficient for theism, insufficient, or suspensive."]],"mistakes":["Using 'faith' as a universal exemption from criticism without specifying limits or defeaters.","Assuming 'evidence' means only laboratory data and therefore excluding testimony, experience, argument, or historical evidence by definition."],"check":{"q":"Someone says, “This belief is faith, so no possible evidence could count against it.” What is the epistemic danger?","a":"The claim turns fideism into complete immunization. A defensible non-evidential stance still needs to explain boundaries and defeaters; otherwise any arbitrary belief can claim the same exemption."}},"fa":{"line":"شاهدگرایی دربارهٔ باورِ دینی می‌خواهد باور در برابر شاهدِ شخصی یا عمومیِ کافی پاسخ‌گو باشد؛ ایمان‌گرایی به ایمان شأنی عقلانی می‌دهد که به پشتیبانیِ عادیِ شاهدی فروکاستنی نیست.","why":"<p>باورِ دینی مسئلهٔ عمومیِ «آیا هر تعهدِ عقلانی باید متناسب با شاهدِ معمول باشد؟» را فشرده می‌کند. شاهدگرا می‌ترسد معاف‌کردنِ ایمان باورِ دلبخواهی را مجاز کند؛ ایمان‌گرا می‌ترسد مطالبهٔ اثباتِ قبلی نقشِ اعتماد، تعهد یا شیوهٔ زندگی را بد بفهمد.</p>","origin":"سویِ شاهدگرای کلاسیک با اخلاقِ باورِ دبلیو.کی. کلیفورد پیوند دارد؛ مضامینِ ایمان‌گرایانه در کی‌یرکگور و رویکردهای ویتگنشتاینیِ بعدی دیده می‌شود، هرچند بسیار متفاوت‌اند. بهتر است تقابل را طیفی دربارهٔ الزاماتِ شاهدی بدانیم، نه یک دوگانهٔ ساده.","obj":[["ایمان‌گرایی ظاهراً هر باوری را مجاز می‌کند اگر کسی نامِ ایمان رویش بگذارد.","ایمان‌گرای جدی به حدود نیاز دارد: روایتِ حوزه‌ای از ایمان، هنجارهای درونی، ابطال‌کننده‌ها و دلیلِ اینکه این تعهد نقشی دارد که خیالِ دلخواه ندارد. بدون قید، مسئلهٔ «کدوی بزرگ» فوراً ظاهر می‌شود."],["شاهدگراییِ سخت قابل‌زندگی نیست چون بسیاری از تعهداتِ عقلانی — ذهنِ دیگران، حافظه، اعتمادِ اخلاقی — از استدلالِ صریحِ شاهدی نیامده‌اند.","شاهدگرا می‌تواند شاهد را گسترده و توجیهِ استنتاجی را از غیراستنتاجی جدا کند. آنگاه نزاع بر این است که آیا تجربه یا عملِ دینی می‌تواند شاهد یا توجیهِ پایهٔ واقعی بدهد، نه اینکه هر باور حتماً استدلالِ صریح بخواهد."]],"confuse":[["ایمان‌گرایی و غیرعقلانیت","ایمان‌گرایی می‌گوید برخی تعهداتِ ایمانی لازم نیست از استنتاجِ شاهدیِ عادی بیایند. لزوماً به معنای قبولِ تناقض یا نادیده‌گرفتنِ هر ابطال‌کننده نیست."],["شاهدگراییِ دینی و بی‌خدایی","شاهدگرایی هنجارِ باور است، نه نتیجه. شاهدگرا می‌تواند شاهد را برای خداباوری کافی، ناکافی یا موجبِ تعلیق بداند."]],"mistakes":["استفاده از «ایمان» به‌عنوان معافیتِ کلی از نقد بدون مشخص‌کردنِ حد یا ابطال‌کننده.","فرض‌کردنِ اینکه «شاهد» فقط دادهٔ آزمایشگاهی است و بنابراین گواهی، تجربه، استدلال یا شاهدِ تاریخی را از تعریف حذف‌کردن."],"check":{"q":"کسی می‌گوید «این باور ایمان است، پس هیچ شاهدِ ممکنی علیه آن حساب نمی‌شود.» خطرِ معرفتی چیست؟","a":"ادعا ایمان‌گرایی را به مصون‌سازیِ کامل تبدیل می‌کند. موضعِ غیرشاهدیِ دفاع‌پذیر هنوز باید مرز و ابطال‌کننده را توضیح دهد؛ وگرنه هر باورِ دلبخواهی می‌تواند همان معافیت را مطالبه کند."}}},"reformed":{"en":{"line":"Reformed epistemology argues that belief in God can be rational and warranted as properly basic rather than inferred from propositional evidence or argument.","why":"<p>If some ordinary beliefs—memory, other minds, the external world—are rational without being inferred from proofs, religious belief may not be uniquely required to pass an evidential argument first. Reformed epistemology uses foundationalism to challenge the assumption that rational theism must be a conclusion.</p>","origin":"Alvin Plantinga is the central figure. His critique targets classical foundationalist restrictions that allowed only self-evident, incorrigible, or evident-to-the-senses beliefs to be basic. Later work connects warrant to properly functioning cognitive faculties in an appropriate epistemic environment.","obj":[["The Great Pumpkin objection: if theistic belief can be basic, why not any bizarre belief someone declares basic?","Plantinga’s answer is that basicality is not voluntary declaration. A belief is properly basic only under appropriate conditions and cognitive functioning, and it remains subject to defeaters. Critics argue those conditions still require a non-question-begging account."],["The proposal may show that theistic belief can be rational <i>if</i> a God-designed faculty exists, but that conditional framework presupposes much of what it aims to defend.","Plantinga distinguishes a de jure question—whether belief can be warranted—from the de facto question whether God exists. Critics contend the epistemology and theology are hard to separate; defenders say conditional models are legitimate explanations of how warrant would arise."]],"confuse":[["Reformed epistemology and fideism","Reformed epistemology does not say evidence is irrelevant or faith is exempt from defeat. It offers a positive externalist/foundationalist account of warrant and allows defeaters."],["Properly basic and arbitrary","Basic status is not 'I choose not to give reasons.' It is supposed to arise from an appropriate cognitive basis or experience rather than inference."]],"mistakes":["Summarizing Plantinga as 'belief without evidence is fine.' The claim is conditional on proper basicality and warrant, not a universal license.","Assuming a properly basic belief cannot be defeated by contrary evidence; Plantinga explicitly allows defeaters and defeater-defeaters."],"check":{"q":"What must a Reformed epistemologist say to someone who declares belief in a random “Great Pumpkin” properly basic?","a":"That proper basicality is not created by declaration. The belief needs the right kind of cognitive basis/conditions and must withstand relevant defeaters. The hard philosophical work is specifying those conditions without special pleading."}},"fa":{"line":"معرفت‌شناسیِ اصلاح‌شده می‌گوید باور به خدا می‌تواند به‌عنوان باورِ به‌درستی پایه عقلانی و دارای ضمانت باشد، نه نتیجه‌ای که حتماً از شاهد یا استدلالِ گزاره‌ای استنتاج شده باشد.","why":"<p>اگر بعضی باورهای عادی — حافظه، ذهنِ دیگران، جهانِ بیرونی — بدون اثباتِ استنتاجی عقلانی‌اند، باورِ دینی شاید تنها حوزه‌ای نباشد که باید اول از استدلالِ شاهدی عبور کند. معرفت‌شناسیِ اصلاح‌شده از مبناگرایی استفاده می‌کند تا فرضِ «خداباوریِ عقلانی حتماً نتیجه است» را به چالش بکشد.</p>","origin":"آلوین پلنتینگا چهرهٔ مرکزی است. نقدِ او محدودیتِ مبناگراییِ کلاسیک را هدف می‌گیرد که فقط باورِ خودبدیهی، اصلاح‌ناپذیر یا آشکار برای حواس را پایه می‌دانست. کارِ بعدی ضمانت را به کارکردِ درستِ قوای شناختی در محیطِ مناسب وصل می‌کند.","obj":[["اعتراضِ کدوی بزرگ: اگر باورِ خداباورانه پایه باشد چرا هر باورِ عجیب که کسی «پایه» اعلام کند نه؟","پاسخِ پلنتینگا این است که پایه‌بودن با اعلامِ ارادی ساخته نمی‌شود. باور فقط در شرایطِ مناسب و با کارکردِ شناختیِ درست به‌درستی پایه است و همچنان در معرضِ ابطال‌کننده است. منتقدان می‌گویند خودِ این شرایط هنوز باید غیردوری توضیح داده شوند."],["پیشنهاد شاید فقط نشان دهد اگر قوّه‌ای خداطراحی‌شده وجود داشته باشد خداباوری موجه است؛ این چارچوب بخشِ بزرگی از چیزی را که می‌خواهد دفاع کند از پیش فرض می‌گیرد.","پلنتینگا پرسشِ de jure دربارهٔ ضمانت را از پرسشِ de facto دربارهٔ وجودِ خدا جدا می‌کند. منتقدان می‌گویند معرفت‌شناسی و الهیات سخت جدا می‌شوند؛ مدافعان می‌گویند مدلِ شرطی توضیحِ مشروعی از چگونگیِ ضمانت است."]],"confuse":[["معرفت‌شناسیِ اصلاح‌شده و ایمان‌گرایی","این دیدگاه نمی‌گوید شاهد بی‌ربط یا ایمان از شکست مصون است. روایتِ مثبتِ برون‌گرایانه/مبناگرایانه از ضمانت می‌دهد و ابطال‌کننده را می‌پذیرد."],["به‌درستی پایه و دلبخواهی","پایه‌بودن یعنی «من انتخاب کردم دلیل ندهم» نیست. قرار است از مبنای شناختی یا تجربهٔ مناسب بیاید، نه استنتاج."]],"mistakes":["خلاصه‌کردنِ پلنتینگا به «باورِ بدون شاهد اشکالی ندارد». ادعا مشروط به پایه‌بودن و ضمانتِ درست است، نه مجوزِ جهانی.","فرض‌کردنِ اینکه باورِ به‌درستی پایه با شاهدِ مخالف شکست نمی‌خورد؛ پلنتینگا ابطال‌کننده و ابطال‌کنندهٔ ابطال‌کننده را می‌پذیرد."],"check":{"q":"معرفت‌شناسِ اصلاح‌شده به کسی که باورِ تصادفی به «کدوی بزرگ» را به‌درستی پایه اعلام می‌کند چه باید بگوید؟","a":"پایه‌بودن با اعلام ساخته نمی‌شود. باور به مبنا/شرایطِ شناختیِ درست نیاز دارد و باید در برابر ابطال‌کننده‌های مرتبط دوام بیاورد. کارِ سخت مشخص‌کردنِ این شرایط بدون امتیازدهیِ ویژه است."}}},"properly":{"en":{"line":"A properly basic belief is rationally held without inferential support because it arises in the right epistemic circumstances or cognitive basis.","why":"<p>The regress problem forces foundationalists to explain why stopping at some beliefs is not arbitrary. “Properly basic” names the status they need: a belief can be justified or warranted directly, without another belief serving as premise, while still being rationally assessable and defeasible.</p>","origin":"The language is associated especially with Alvin Plantinga, building on broader foundationalist work including Roderick Chisholm. Plantinga uses it to broaden the class of rational basic beliefs beyond the classical list of self-evident or incorrigible propositions.","obj":[["If basic beliefs need no reasons, the category simply hides dogmatism.","The foundationalist distinguishes <i>non-inferential grounds</i> from no grounds at all. Perceptual experience, memory, or an appropriate cognitive disposition can constitute the basis even when the subject has no premise from which the belief is inferred."],["There is no neutral criterion for the right circumstances, so different traditions can declare incompatible beliefs basic.","That is the basicality challenge. Externalist accounts appeal to reliable/proper functioning and environment; internalists appeal to experience or seemings. No account avoids all controversy, which is why the category is a live theory rather than a shortcut."]],"confuse":[["Basic and self-evident","Self-evident propositions are one possible classical category of basic belief, but contemporary foundationalism allows perceptual or memory beliefs that are neither self-evident nor certain."],["Basic and undefeatable","A basic belief can acquire a defeater. Its status concerns the source of prima facie justification, not permanent immunity to evidence."]],"mistakes":["Using 'properly basic' to mean 'deeply held' or 'personally important.'","Thinking non-inferential means causeless or groundless; the relevant basis may be an experience or cognitive faculty rather than another proposition."],"check":{"q":"You remember eating breakfast and form “I ate breakfast” without constructing an argument. What would make that belief properly basic rather than arbitrary?","a":"An appropriate functioning memory state provides the non-inferential basis, and no defeating evidence is present. The belief is not premise-free because of preference; it is grounded in a source that supplies prima facie warrant directly."}},"fa":{"line":"باورِ به‌درستی پایه باوری است که بدون پشتیبانیِ استنتاجی عقلانیاً پذیرفته می‌شود چون در شرایطِ معرفتی یا مبنای شناختیِ مناسب پدید آمده است.","why":"<p>مسئلهٔ تسلسل مبناگرا را وادار می‌کند توضیح دهد چرا توقف بر بعضی باورها دلبخواهی نیست. «به‌درستی پایه» نامِ شأنی است که لازم دارد: باور می‌تواند مستقیماً موجه یا دارای ضمانت باشد بدون اینکه باورِ دیگری مقدمهٔ استنتاجش شود، و در عین حال ارزیابی‌پذیر و قابل‌ابطال بماند.</p>","origin":"اصطلاح به‌ویژه با آلوین پلنتینگا و بر بسترِ کارِ مبناگرایانی مانند رودریک چیشولم پیوند دارد. پلنتینگا طبقهٔ باورِ پایهٔ عقلانی را از فهرستِ کلاسیکِ گزاره‌های خودبدیهی یا اصلاح‌ناپذیر گسترده‌تر می‌کند.","obj":[["اگر باورِ پایه دلیل نمی‌خواهد، دسته فقط جزم‌اندیشی را پنهان می‌کند.","مبناگرا «مبنای غیراستنتاجی» را از بی‌مبنایی جدا می‌کند. تجربهٔ ادراکی، حافظه یا گرایشِ شناختیِ مناسب می‌تواند مبنا باشد حتی وقتی هیچ گزاره‌ای به‌عنوان مقدمه استنتاج نشده است."],["معیارِ خنثایی برای «شرایطِ مناسب» وجود ندارد؛ سنت‌های مختلف می‌توانند باورهای ناسازگار را پایه اعلام کنند.","این همان چالشِ پایه‌بودن است. روایتِ برون‌گرایانه به اعتمادپذیری/کارکردِ درست و محیط، و درون‌گرایانه به تجربه یا نمود متوسل می‌شود. هیچ روایتِ کاملاً بی‌مناقشه‌ای نیست؛ برای همین مفهوم نظریه است، نه میان‌بُر."]],"confuse":[["پایه و خودبدیهی","خودبدیهی یک دستهٔ کلاسیکِ ممکن است، اما مبناگراییِ معاصر باورهای ادراکی یا حافظه‌ای را هم می‌پذیرد که نه خودبدیهی‌اند نه یقینی."],["پایه و شکست‌ناپذیر","باورِ پایه می‌تواند ابطال‌کننده بگیرد. پایه‌بودن دربارهٔ منشأ توجیهِ ابتدایی است، نه مصونیتِ دائمی از شاهد."]],"mistakes":["استفاده از «به‌درستی پایه» به معنای «عمیقاً مهم» یا «شخصاً عزیز».","فهمِ غیراستنتاجی به‌عنوان بی‌علت یا بی‌مبنا؛ مبنا می‌تواند تجربه یا قوّهٔ شناختی باشد نه گزارهٔ دیگر."],"check":{"q":"صبحانه‌خوردن را به یاد می‌آورید و بدون استدلال باور می‌کنید «صبحانه خوردم». چه چیزی آن را به‌درستی پایه می‌کند، نه دلبخواهی؟","a":"حالتِ حافظه‌ایِ مناسب و درست‌کار مبنای غیراستنتاجی می‌دهد و ابطال‌کننده‌ای حاضر نیست. باور به‌سببِ ترجیح بی‌مقدمه نیست؛ منبعی دارد که مستقیم ضمانتِ ابتدایی می‌دهد."}}},"flew":{"en":{"line":"Flew’s falsification challenge asks what conceivable observation would count against a religious assertion; if every failure is absorbed by qualification, the claim risks losing empirical content.","why":"<p>A belief can appear meaningful and evidentially supported while being protected from every possible counterexample. Flew applies the Popperian concern about immunizing stratagems to theology: if nothing can ever count against “God loves us,” what exactly is being asserted about the world?</p>","origin":"Antony Flew’s contribution to the famous “Theology and Falsification” symposium uses the parable of the invisible gardener. R.M. Hare and Basil Mitchell offered influential replies; John Hick also develops verification-related responses in philosophy of religion. The debate is about content and defeat, not a simple claim that religion must be laboratory science.","obj":[["Many meaningful claims are not straightforwardly falsifiable—moral, historical, or existential claims—so Popper’s criterion should not be imported wholesale into religion.","Flew’s challenge is strongest as a discipline of content, not a demarcation rule. A defender can reject strict falsifiability while still specifying what experiences would count as tension, defeaters, or reasons to revise the interpretation."],["A religious believer can acknowledge apparently contrary evidence while interpreting it within a broader theory, just as science adjusts auxiliaries after anomalies.","Yes; Duhem–Quine applies here too. The Lakatosian question then becomes useful: do adjustments generate new explanatory or predictive content, or do they only protect the claim from whatever just happened?"]],"confuse":[["Flew’s challenge and proof of atheism","Showing a statement is insulated from falsification does not establish its negation. It challenges the statement’s empirical content or evidential discipline."],["Falsifiability and meaning","Popper himself separated scientific demarcation from meaning. Flew’s theological use raises a stronger language/content worry, but one should not simply equate unfalsifiable with meaningless."]],"mistakes":["Saying “religion is unfalsifiable, therefore false.” That inference does not follow.","Allowing a sequence of individually reasonable qualifications to accumulate without tracking whether the original claim still rules out any state of affairs."],"check":{"q":"A claim survives every apparent counterexample by adding a new qualification after the fact. What is the precise Flew-style question to ask?","a":"“What, if anything, would you accept as counting against the claim?” If the honest answer is nothing, the issue is not that the claim has been disproved but that its empirical or discriminating content has been hollowed out."}},"fa":{"line":"چالشِ ابطالِ فلو می‌پرسد چه مشاهدهٔ قابل‌تصوری علیه ادعای دینی حساب می‌شود؛ اگر هر شکست با قیدی تازه جذب شود، ادعا در خطرِ از دست‌دادنِ محتوای تجربی است.","why":"<p>باور می‌تواند معنادار و شاهدپذیر به نظر برسد در حالی که از هر مثالِ نقض مصون شده است. فلو نگرانیِ پوپری دربارهٔ ترفندهای ایمن‌ساز را به الهیات می‌برد: اگر هیچ چیز علیه «خدا ما را دوست دارد» حساب نمی‌شود، دقیقاً چه چیزی دربارهٔ جهان اظهار شده است؟</p>","origin":"مشارکتِ آنتونی فلو در سمپوزیومِ مشهورِ «الهیات و ابطال» از تمثیلِ باغبانِ نامرئی استفاده می‌کند. آر.ام. هِر و بازیل میچل پاسخ‌های اثرگذار دادند و جان هیک نیز پاسخ‌های مرتبط با تحقیق‌پذیری را بسط داد. بحث دربارهٔ محتوا و شکست است، نه ادعای سادهٔ اینکه دین باید علمِ آزمایشگاهی باشد.","obj":[["بسیاری از ادعاهای معنادار — اخلاقی، تاریخی، وجودی — به‌سادگی ابطال‌پذیر نیستند؛ پس معیارِ پوپر را نباید کامل واردِ دین کرد.","چالشِ فلو به‌عنوان انضباطِ محتوا قوی‌تر است تا معیارِ تمایز. مدافع می‌تواند ابطال‌پذیریِ سخت را رد و همچنان مشخص کند چه تجربه‌ای تنش، ابطال‌کننده یا دلیلِ بازتفسیر می‌شود."],["مؤمن می‌تواند شاهدِ ظاهراً مخالف را در نظریهٔ گسترده‌تر تفسیر کند، همان‌گونه که علم پس از ناهنجاری فرض‌های کمکی را عوض می‌کند.","بله؛ دوئم‌ـ‌کواین اینجا هم برقرار است. آنگاه پرسشِ لاکاتوشی مفید می‌شود: تعدیل محتوای تبیینی یا پیش‌بینیِ تازه تولید می‌کند یا فقط ادعا را از هرچه رخ داده محافظت می‌کند؟"]],"confuse":[["چالشِ فلو و اثباتِ بی‌خدایی","نشان‌دادنِ مصونیتِ گزاره از ابطال، نقیضش را ثابت نمی‌کند. چالش متوجه محتوای تجربی یا انضباطِ شاهدی است."],["ابطال‌پذیری و معنا","خودِ پوپر تمایزِ علمی را از معنا جدا می‌کرد. استفادهٔ فلو نگرانیِ قوی‌تری دربارهٔ زبان/محتوا دارد، اما نباید ساده هر ابطال‌ناپذیر را بی‌معنا دانست."]],"mistakes":["گفتنِ «دین ابطال‌ناپذیر است، پس کاذب است»؛ این استنتاج معتبر نیست.","انباشتنِ زنجیره‌ای از قیدهای تک‌تک معقول بدون ردیابیِ اینکه ادعای اصلی هنوز چه وضعیتی را ممنوع می‌کند."],"check":{"q":"ادعایی هر مثالِ نقضِ ظاهری را با قیدِ تازه‌ای پس از واقعه جذب می‌کند. پرسشِ دقیقِ فلو چیست؟","a":"«چه چیزی، اگر اصلاً چیزی، علیه این ادعا حساب می‌شود؟» اگر پاسخِ صادقانه «هیچ چیز» باشد مسئله این نیست که ادعا ابطال شده، بلکه اینکه محتوای تجربی یا تمایزبخشِ آن تهی شده است."}}},"fideism":{"en":{"line":"Fideism holds that faith has an epistemic standing not dependent on ordinary evidential proof and may even begin where discursive reason reaches its limits.","why":"<p>Some religious commitments function less like scientific hypotheses and more like orienting commitments, forms of trust, or ways of life. Fideism exists to resist the demand that such commitments must first be validated by the same evidential procedures used for ordinary empirical claims.</p>","origin":"Fideist themes appear in Pascal and Kierkegaard and in some Wittgenstein-influenced philosophy of religion, though these thinkers should not be collapsed into one doctrine. The common family resemblance is skepticism about reason’s ability or authority to ground faith from outside faith.","obj":[["If faith is independent of evidence, contradictory religions and arbitrary fantasies can all claim equal rational immunity.","This is the central symmetry problem. A defensible fideism needs internal norms, practical or existential criteria, and some account of defeaters; otherwise it cannot distinguish commitment from wishful insulation."],["Fideism makes dialogue impossible because evidence cannot cross the boundary of the form of life.","Strong versions risk that result. More moderate versions say evidence is not the foundation of faith but can still challenge interpretations, expose contradictions, or generate defeaters. Non-foundational does not have to mean conversation-proof."]],"confuse":[["Fideism and hinge epistemology","Both limit ordinary justification, but hinges are a general category of background commitments required for inquiry. Fideism is specifically a stance about faith and reason."],["Fideism and Reformed epistemology","Plantinga gives a positive account of properly basic warranted belief and externalist cognitive functioning. Fideism more often resists the demand for evidential grounding without the same theory of warrant."]],"mistakes":["Using fideism to make every factual consequence of a religion immune to empirical evidence.","Treating all non-inferential belief as fideistic; perception and memory can be non-inferential on secular foundationalist views."],"check":{"q":"A believer says the core commitment is not inferred from evidence but agrees that historical claims derived from it can be defeated by historical evidence. Is that necessarily inconsistent with fideism?","a":"No. A moderate fideist can treat faith as non-evidentially grounded while allowing empirical claims and interpretations within the tradition to remain defeasible. The boundary, not total immunity, is the key question."}},"fa":{"line":"ایمان‌گرایی می‌گوید ایمان شأنی معرفتی دارد که به اثباتِ معمولِ شاهدی وابسته نیست و شاید دقیقاً جایی آغاز شود که استدلالِ گفتاری به حدِ خود می‌رسد.","why":"<p>بعضی تعهداتِ دینی کمتر شبیه فرضیهٔ علمی و بیشتر شبیه تعهدِ جهت‌دهنده، اعتماد یا شیوهٔ زندگی عمل می‌کنند. ایمان‌گرایی برای مقاومت در برابر این مطالبه پدید می‌آید که چنین تعهدی باید ابتدا با همان رویهٔ شاهدیِ ادعای تجربیِ عادی اعتبارسنجی شود.</p>","origin":"مضامینِ ایمان‌گرایانه در پاسکال و کی‌یرکگور و برخی فلسفه‌های دینِ ویتگنشتاینی دیده می‌شود، هرچند نباید این متفکران را یک آموزه دانست. شباهتِ خانوادگی، تردید دربارهٔ توان یا اقتدارِ عقل برای بنیادکردنِ ایمان از بیرونِ ایمان است.","obj":[["اگر ایمان مستقل از شاهد باشد، ادیانِ متناقض و خیال‌های دلخواه همه می‌توانند مصونیتِ عقلانیِ برابر بخواهند.","این مسئلهٔ مرکزیِ تقارن است. ایمان‌گراییِ دفاع‌پذیر به هنجارهای درونی، معیارهای عملی یا وجودی و روایتی از ابطال‌کننده‌ها نیاز دارد؛ وگرنه تعهد را از مصون‌سازیِ آرزومندانه جدا نمی‌کند."],["ایمان‌گرایی گفت‌وگو را ناممکن می‌کند چون شاهد نمی‌تواند از مرزِ شیوهٔ زندگی عبور کند.","نسخه‌های قوی چنین خطری دارند. نسخهٔ معتدل‌تر می‌گوید شاهد بنیادِ ایمان نیست اما می‌تواند تفسیر را به چالش بکشد، تناقض را آشکار یا ابطال‌کننده بسازد. غیربنیادین لازم نیست یعنی مصون از گفت‌وگو."]],"confuse":[["ایمان‌گرایی و معرفت‌شناسیِ لولا","هر دو مطالبهٔ توجیهِ عادی را محدود می‌کنند، اما لولا دسته‌ای عمومی از تعهداتِ پس‌زمینهٔ لازم برای پژوهش است؛ ایمان‌گرایی مشخصاً دربارهٔ ایمان و عقل است."],["ایمان‌گرایی و معرفت‌شناسیِ اصلاح‌شده","پلنتینگا روایتِ مثبتِ باورِ به‌درستی پایه و کارکردِ شناختیِ برون‌گرایانه می‌دهد. ایمان‌گرایی بیشتر مطالبهٔ بنیادِ شاهدی را رد می‌کند بدون همان نظریهٔ ضمانت."]],"mistakes":["استفاده از ایمان‌گرایی برای مصون‌کردنِ هر پیامدِ factual دین از شاهدِ تجربی.","ایمان‌گرایانه نامیدنِ هر باورِ غیراستنتاجی؛ ادراک و حافظه در مبناگراییِ سکولار هم می‌توانند غیراستنتاجی باشند."],"check":{"q":"مؤمنی می‌گوید تعهدِ اصلی از شاهد استنتاج نشده اما می‌پذیرد ادعاهای تاریخیِ مشتق از آن با شاهدِ تاریخی می‌توانند شکست بخورند. آیا این حتماً با ایمان‌گرایی ناسازگار است؟","a":"نه. ایمان‌گرای معتدل می‌تواند ایمان را غیراستنتاجی بداند و هم‌زمان ادعاها و تفسیرهای تجربیِ درونِ سنت را قابل‌ابطال بگذارد. مسئلهٔ اصلی مرز است، نه مصونیتِ کامل."}}},"root":{"en":{"line":"Epistemology asks what entitles you to believe what you believe—and how that entitlement can survive luck, error, disagreement, and uncertainty.","why":"<p>Every discipline already uses an epistemology, usually implicitly: rules about evidence, inference, credibility, confidence, and error. Making those rules explicit lets you distinguish knowledge from lucky correctness, reliable method from persuasive story, and genuine independence from repeated copies of one source.</p>","origin":"The name comes from Greek <i>epistēmē</i> (knowledge) and <i>logos</i> (account or study). The field runs from ancient skeptical and Platonic problems through modern foundationalism and empiricism to contemporary formal, social, virtue, and scientific epistemology. This map organizes the territory around the regress problem and the question: what makes belief answerable to truth?","obj":[["If every field already has its own research methods, epistemology adds abstraction rather than useful knowledge.","Methods themselves embody epistemic commitments: what counts as evidence, what errors matter, and when confidence is licensed. Epistemology is the level at which those commitments become comparable and criticizable across fields."],["Epistemology cannot validate itself without using epistemic standards, so the project is circular.","There is no view from nowhere. The field therefore works reflexively: standards are compared by coherence, consequences, reliability, criticism, and their ability to handle skeptical pressure. The impossibility of a completely external validation is one of the field’s central subjects, not a hidden defect."]],"confuse":[["Epistemology and critical thinking","Critical thinking is a practical skill set. Epistemology asks why those skills should improve belief and what standards make an inference or source good."],["Epistemology and philosophy of science","Philosophy of science is the epistemology of scientific inquiry plus questions about scientific explanation, realism, and method. Epistemology also covers ordinary perception, memory, testimony, skepticism, and knowledge itself."]],"mistakes":["Reducing epistemology to a list of biases rather than a theory of knowledge, evidence, truth, and inquiry.","Equating psychological confidence with epistemic warrant."],"check":{"q":"Two people agree on every observed fact but disagree on how much those facts should change belief in a policy hypothesis. What kind of disagreement is that?","a":"An epistemic disagreement about evidential support, priors, inference, or standards of justification—not a disagreement over the raw facts themselves."}},"fa":{"line":"معرفت‌شناسی می‌پرسد چه چیزی به شما حق می‌دهد آنچه را باور دارید باور کنید — و این حق چگونه از شانس، خطا، اختلاف و عدمِ‌قطعیت جان به در می‌برد.","why":"<p>هر رشته‌ای از پیش یک معرفت‌شناسی دارد، معمولاً ضمنی: قواعدی دربارهٔ شاهد، استنتاج، اعتبارِ منبع، اطمینان و خطا. صریح‌کردنِ این قواعد اجازه می‌دهد معرفت را از درست‌بودنِ خوش‌شانس، روشِ قابل‌اعتماد را از داستانِ قانع‌کننده، و استقلالِ واقعی را از چند نسخهٔ یک منبع جدا کنیم.</p>","origin":"نام از یونانیِ <i>epistēmē</i> (معرفت) و <i>logos</i> (بررسی/گزارش) می‌آید. رشته از مسائلِ شکاکانه و افلاطونیِ باستان تا مبناگرایی و تجربه‌گراییِ مدرن و سپس معرفت‌شناسیِ صوری، اجتماعی، فضیلت و علم امتداد دارد. این نقشه قلمرو را پیرامونِ مسئلهٔ تسلسل و یک پرسش سامان می‌دهد: چه چیزی باور را در برابر حقیقت پاسخ‌گو می‌کند؟","obj":[["اگر هر رشته روشِ پژوهشِ خودش را دارد، معرفت‌شناسی فقط انتزاعِ اضافه است.","خودِ روش‌ها تعهداتِ معرفتی دارند: چه چیزی شاهد است، کدام خطا مهم است و چه وقت اطمینان مجاز است. معرفت‌شناسی سطحی است که این تعهدات را میان رشته‌ها قابل‌مقایسه و نقد می‌کند."],["معرفت‌شناسی نمی‌تواند بدون استفاده از معیارهای معرفتی خودش را اعتبارسنجی کند؛ پس پروژه دوری است.","نقطهٔ نظرِ کاملاً بیرونی وجود ندارد. رشته بنابراین بازتابی کار می‌کند: معیارها را با انسجام، پیامد، اعتمادپذیری، نقد و توانِ مقابله با فشارِ شکاکانه مقایسه می‌کند. ناممکن‌بودنِ اعتبارسنجیِ کاملاً بیرونی یکی از موضوعاتِ مرکزی است، نه نقصِ پنهان."]],"confuse":[["معرفت‌شناسی و تفکرِ انتقادی","تفکرِ انتقادی مجموعهٔ مهارت است. معرفت‌شناسی می‌پرسد چرا آن مهارت‌ها باید باور را بهتر کنند و چه چیزی منبع یا استنتاج را خوب می‌کند."],["معرفت‌شناسی و فلسفهٔ علم","فلسفهٔ علم معرفت‌شناسیِ پژوهشِ علمی به‌اضافهٔ پرسش‌های تبیین، واقع‌گرایی و روش است. معرفت‌شناسی ادراک، حافظه، گواهی، شکاکیت و خودِ معرفتِ عادی را نیز دربر می‌گیرد."]],"mistakes":["فروکاستنِ معرفت‌شناسی به فهرستِ سوگیری‌ها، نه نظریهٔ معرفت، شاهد، حقیقت و پژوهش.","یکی‌گرفتنِ اطمینانِ روان‌شناختی با ضمانتِ معرفتی."],"check":{"q":"دو نفر بر همهٔ واقعیت‌های مشاهده‌شده توافق دارند اما دربارهٔ اینکه همان واقعیت‌ها چقدر باید باور به فرضیهٔ سیاستی را تغییر دهند اختلاف دارند. این چه نوع اختلافی است؟","a":"اختلافِ معرفتی دربارهٔ قدرتِ شاهد، پیشین، استنتاج یا معیارِ توجیه است، نه اختلاف بر سرِ خودِ واقعیت‌های خام."}}},"know":{"en":{"line":"The analysis of knowledge asks what turns a true belief into non-accidental cognitive success rather than a lucky hit.","why":"<p>True belief is not enough: guesses can be true. Justification seemed to supply the missing ingredient until Gettier showed that a justified true belief can still be true by accident. The contemporary problem is therefore to explain the anti-luck, reliability, competence, or modal connection knowledge adds.</p>","origin":"The traditional starting point is the justified-true-belief analysis, historically associated with Plato and later epistemology. Gettier’s 1963 counterexamples reorganized the field around repair strategies: no false lemmas, defeaters, sensitivity, safety, reliabilism, virtue conditions, and views that treat knowledge as primitive.","obj":[["Decades of counterexamples suggest knowledge may not have a clean analysis into necessary and sufficient conditions.","Some philosophers, notably Timothy Williamson, treat knowledge as primitive rather than reducible. That does not dissolve the practical problem: we still need to distinguish lucky truth from robust cognition, even if the word 'knowledge' resists definition."],["Ordinary 'know' is context-sensitive and pragmatic, so armchair cases may track language rather than a natural epistemic kind.","Contextualists take that seriously, but Gettier-style cases also reveal a process distinction with practical bite: being right for the right reason differs from being right by accident. The debate therefore survives semantic revision."]],"confuse":[["Knowledge and certainty","Most contemporary theories are fallibilist: knowledge need not be immune to all possible error."],["Knowledge and justified belief","A belief can be well justified and false; Gettier additionally shows it can be justified and true yet still fail to be knowledge."]],"mistakes":["Treating Gettier as a curiosity about wording rather than a general problem of lucky success.","Assuming adding more evidence automatically removes epistemic luck."],"check":{"q":"A forecast is correct because two model errors accidentally cancel. Which part of the knowledge problem is this closest to?","a":"The anti-luck/Gettier problem: the outcome is right, perhaps produced by a respectable process, but the connection between the grounds and the truth is accidental and not robust."}},"fa":{"line":"تحلیلِ معرفت می‌پرسد چه چیزی باورِ صادق را به موفقیتِ شناختیِ غیرتصادفی تبدیل می‌کند، نه به یک موفقیتِ شانسی.","why":"<p>باورِ صادق کافی نیست؛ حدس می‌تواند درست باشد. توجیه ظاهراً مادهٔ گمشده بود تا اینکه گتیه نشان داد باورِ صادقِ موجه هم می‌تواند تصادفاً درست باشد. مسئلهٔ معاصر توضیحِ پیوندِ ضدشانس، اعتمادپذیری، شایستگی یا رابطهٔ وجهی است که معرفت اضافه می‌کند.</p>","origin":"نقطهٔ شروعِ سنتی تحلیلِ باورِ صادقِ موجه است که به افلاطون و سپس سنتِ معرفت‌شناسی نسبت داده می‌شود. مثال‌های ۱۹۶۳ گتیه رشته را پیرامونِ ترمیم‌ها بازسازمان داد: بدون مقدمهٔ کاذب، ابطال‌کننده‌ها، حساسیت، ایمنی، اعتمادگرایی، شروطِ فضیلت و دیدگاه‌هایی که معرفت را بسیط می‌دانند.","obj":[["دهه‌ها مثالِ نقض نشان می‌دهد شاید معرفت اصلاً تحلیلِ تمیزِ شرطِ لازم و کافی نداشته باشد.","برخی، مانند تیموتی ویلیامسون، معرفت را بسیط و غیرقابل‌تقلیل می‌دانند. این مسئلهٔ عملی را حذف نمی‌کند: هنوز باید حقیقتِ خوش‌شانس را از شناختِ مقاوم جدا کنیم، حتی اگر واژهٔ «معرفت» تعریفِ تقلیلی نپذیرد."],["کاربردِ عادیِ «می‌دانم» زمینه‌حساس و عملی است؛ پس مثال‌های صندلی‌نشینی شاید زبان را بسنجد نه نوعی طبیعی از معرفت.","زمینه‌گرایی این را جدی می‌گیرد، اما مواردِ گتیه تمایزِ فرایندیِ عملی هم دارند: درست‌بودن به دلیلِ درست با درست‌بودن از روی تصادف فرق دارد. بنابراین بحث با بازنگریِ معنایی از بین نمی‌رود."]],"confuse":[["معرفت و یقین","بیشترِ نظریه‌های معاصر خطاپذیرند: معرفت لازم نیست در برابر هر خطای ممکن مصون باشد."],["معرفت و باورِ موجه","باور می‌تواند موجه و کاذب باشد؛ گتیه علاوه بر آن نشان می‌دهد می‌تواند موجه و صادق هم باشد و باز معرفت نباشد."]],"mistakes":["معمای لفظی دانستنِ گتیه، نه مسئلهٔ عمومیِ موفقیتِ شانسی.","فرض‌کردنِ اینکه شاهدِ بیشتر خودکار شانسِ معرفتی را حذف می‌کند."],"check":{"q":"پیش‌بینی‌ای درست از آب درمی‌آید چون دو خطای مدل اتفاقاً یکدیگر را خنثی کرده‌اند. این به کدام بخشِ مسئلهٔ معرفت نزدیک است؟","a":"به مسئلهٔ ضدشانس/گتیه: نتیجه درست است و شاید فرایند در ظاهر محترم باشد، اما پیوندِ مبنا با حقیقت تصادفی و غیرمقاوم است."}}},"truth":{"en":{"line":"Truth is the success condition of belief: epistemology needs to explain what it is for a proposition to be true before it can explain how evidence gives us access to truth.","why":"<p>Knowledge is factive, yet theories disagree about what truth itself amounts to—correspondence with reality, coherence, pragmatic success, or a thin logical role. These theories are not interchangeable because they handle realism, disagreement, unobservable claims, and framework dependence differently.</p>","origin":"The branch spans ancient correspondence intuitions, idealist coherence theories, American pragmatism, and twentieth-century deflationary approaches. It also includes the objectivity/relativism dispute: whether truth is independent of perspective even though our access to it is historically and theoretically mediated.","obj":[["Most truth theories agree on ordinary sentences, so the debate can seem merely verbal.","The differences appear in hard cases: abstract objects, ethics, unobservables, idealized science, conflicting frameworks, and the relation between truth and inquiry. A theory that agrees on 'snow is white' can diverge sharply elsewhere."],["Epistemology should study justification, not metaphysical truth; we can reason well without solving what truth is.","Practically yes, but theories of justification are usually truth-directed. Without clarifying the target, claims that a method is 'truth-conducive' or objective remain partly unspecified."]],"confuse":[["Truth and justification","Justification concerns what one has reason to believe; truth concerns whether the proposition is so. Good justification can attach to a false belief."],["Truth and consensus","Agreement can be evidence, especially under independent competent inq
