he argumentative theory is broadly right?","a":"Build genuine adversarial exchange: independent analyses, red teams, and incentives to challenge rather than merely asking each individual to “debias” alone."}},"fa":{"line":"نظریهٔ استدلالی می‌گوید عقلِ انسانی عمدتاً برای تولید و ارزیابیِ استدلال در مبادلهٔ اجتماعی تخصص یافته، نه برای بیشینه‌سازیِ حقیقت در تنهایی.","why":"<p>این نظریه الگویی عجیب را توضیح می‌دهد: افراد در تنهایی سوگیریِ «سمتِ خود» نشان می‌دهند اما وقتی اختلافِ واقعی مجبورشان می‌کند دلیلِ مخالف را ارزیابی کنند بهتر می‌شوند. در این تصویر بعضی «سوگیری‌ها» پیامدِ جانبیِ سامانه‌ای‌اند که برای گفت‌وگوی استدلالی طراحی شده است.</p>","origin":"هوگو مرسیه و دن اسپربر این نظریه را بسط دادند، به‌ویژه در <i>معمای عقل</i>. نظریه با تصویرِ عقل به‌عنوان بهینه‌سازِ عمومیِ فردی مخالفت می‌کند و کارکردِ اجتماعی و ارتباطی را برجسته می‌سازد.","obj":[["کارکردِ تکاملی سخت اثبات می‌شود و عملکردِ امروز نشان نمی‌دهد عقل چرا تکامل یافته است.","درست. نظریه به‌عنوان برنامهٔ تبیینی که از الگوهای مقایسه‌ای حمایت می‌گیرد قوی‌تر است تا یک واقعیتِ تکاملیِ مستقیماً مشاهده‌شده. بدیل‌ها هم بخشی از داده را توضیح می‌دهند."],["اگر عقل برای استدلال تکامل یافته، حقیقت فرعی یا بی‌اهمیت می‌شود.","ارزیابیِ استدلالِ دیگران همچنان کشفِ دلیلِ بد را پاداش می‌دهد و مبادلهٔ اجتماعی می‌تواند دقت را بالا ببرد. ادعا دربارهٔ کارکرد و تقسیمِ کار است، نه بی‌ربطیِ حقیقت."]],"confuse":[["نظریهٔ استدلالی و استدلالِ انگیزه‌مند","استدلالِ انگیزه‌مند جهت‌گیری به نتیجهٔ مطلوب را توضیح می‌دهد؛ نظریهٔ استدلالی روایتِ گسترده‌تری از عدمِ‌تقارنِ تولید و ارزیابیِ دلیل می‌دهد."],["اقناع و صرفِ بلاغت","نظریه دربارهٔ دلیل و ارزیابیِ آن است، نه فقط تحریکِ عاطفی یا سبکِ سخن."]],"mistakes":["استفاده از نظریه به‌عنوان بهانه‌ای که استدلالِ فردی قابل‌بهبود نیست.","نتیجه‌گیریِ اینکه هر بحثِ گروهی مفید است؛ گروهِ همگن یا همرنگ می‌تواند خطا را تقویت کند."],"check":{"q":"اگر نظریهٔ استدلالی تقریباً درست باشد، مستقیم‌ترین پیامد برای طراحیِ سازمان چیست؟","a":"تبادلِ واقعاً خصمانه و مستقل بسازید: تحلیل‌های جداگانه، تیمِ قرمز و انگیزه برای چالش، نه اینکه فقط از هر فرد بخواهید در تنهایی «سوگیری‌زدایی» کند."}}},"injust":{"en":{"line":"Epistemic injustice is a wrong done to someone specifically as a knower: either their testimony is unfairly discounted or the shared interpretive resources needed to express their experience are missing.","why":"<p>Knowledge systems can fail before evidence reaches a formal decision rule. Testimonial injustice distorts credibility assignments; hermeneutical injustice distorts what can even be articulated and recognized. The concept therefore locates epistemic failure in social power, not only in individual reasoning.</p>","origin":"Miranda Fricker’s <i>Epistemic Injustice</i> (2007) introduced the influential distinction between testimonial and hermeneutical injustice. Later work broadened the field to structural, institutional, and collective epistemic harms.","obj":[["Credibility judgments must use background information, so unequal credibility is not automatically unjust.","Correct. The issue is whether identity prejudice or structurally distorted stereotypes cause a credibility deficit or excess unrelated to the speaker’s actual epistemic position. Evidence-based differential weighting is not the same thing."],["The concept risks politicizing truth by making social identity part of epistemic assessment.","Its defenders argue the opposite: social identity already affects who is heard, so ignoring that mechanism leaves a systematic source of error unexamined. Truth remains the target; power affects access to it."]],"confuse":[["Epistemic injustice vs. ordinary disagreement","Disagreeing with someone is not injustice. The wrong concerns unfair impairment of their standing or resources as a knower."],["Testimonial vs. hermeneutical injustice","Testimonial injustice discounts a speaker’s credibility; hermeneutical injustice concerns gaps in shared concepts that make experiences difficult to understand or communicate."]],"mistakes":["Treating every credibility difference across social groups as proof of injustice without investigating causal mechanisms.","Focusing only on individual prejudice and missing institutional filters that determine whose information enters the record."],"check":{"q":"A recurring operational problem is dismissed because frontline staff lack the accepted vocabulary to describe it in management categories. Which form is closest?","a":"Hermeneutical injustice: the interpretive resources available to the institution make the experience difficult to render intelligible, so knowledge is lost before ordinary credibility assessment even begins."}},"fa":{"line":"بی‌عدالتیِ معرفتی آسیبی است که به فرد مشخصاً در مقامِ داننده وارد می‌شود: یا گواهی‌اش ناعادلانه کم‌اعتبار می‌شود، یا منابعِ تفسیریِ مشترک برای بیانِ تجربه‌اش وجود ندارد.","why":"<p>سامانهٔ دانشی ممکن است پیش از رسیدنِ شاهد به قاعدهٔ رسمیِ تصمیم شکست بخورد. بی‌عدالتیِ گواهی تخصیصِ اعتبار را منحرف می‌کند؛ بی‌عدالتیِ هرمنوتیکی تعیین می‌کند چه چیزی اصلاً قابل‌بیان و تشخیص باشد. بنابراین شکستِ معرفتی فقط در ذهنِ فرد نیست، در ساختارِ قدرت هم هست.</p>","origin":"کتابِ <i>بی‌عدالتیِ معرفتی</i> میراندا فریکر (۲۰۰۷) تمایزِ اثرگذار میانِ بی‌عدالتیِ گواهی و هرمنوتیکی را مطرح کرد. ادبیاتِ بعدی آن را به آسیب‌های ساختاری، نهادی و جمعی گسترش داد.","obj":[["داوریِ اعتبار ناچار از اطلاعاتِ پس‌زمینه استفاده می‌کند، پس اعتبارِ نابرابر خودبه‌خود بی‌عدالتی نیست.","درست. مسئله این است که آیا پیش‌داوریِ هویتی یا کلیشهٔ ساختاری کسری یا مازادِ اعتبار ایجاد می‌کند که به موقعیتِ واقعیِ معرفتیِ گوینده مربوط نیست. وزن‌دهیِ متفاوتِ مبتنی بر شاهد چیز دیگری است."],["این مفهوم حقیقت را سیاسی می‌کند چون هویتِ اجتماعی را وارد ارزیابیِ معرفتی می‌سازد.","مدافع می‌گوید هویت از قبل بر شنیده‌شدن اثر دارد؛ نادیده‌گرفتنِ این سازوکار یک منبعِ نظام‌مندِ خطا را پنهان می‌کند. هدف همچنان حقیقت است؛ قدرت بر دسترسی به آن اثر می‌گذارد."]],"confuse":[["بی‌عدالتیِ معرفتی و اختلافِ عادی","مخالفت با کسی بی‌عدالتی نیست. آسیب در تضعیفِ ناعادلانهٔ جایگاه یا منابعِ او در مقامِ داننده است."],["بی‌عدالتیِ گواهی و هرمنوتیکی","اولی اعتبارِ گوینده را کم می‌کند؛ دومی شکافِ مفهومیِ مشترکی است که تجربه را دشوار برای فهم یا بیان می‌سازد."]],"mistakes":["برداشتِ هر تفاوتِ اعتباری میانِ گروه‌ها به‌عنوان اثباتِ بی‌عدالتی بدون بررسیِ سازوکارِ علّی.","تمرکز فقط بر پیش‌داوریِ فردی و ندیدنِ فیلترهای نهادی که تعیین می‌کنند اطلاعاتِ چه کسی واردِ پرونده شود."],"check":{"q":"مشکلی عملیاتی بارها رخ می‌دهد اما کارکنانِ خطِ مقدم واژگانِ پذیرفته‌شدهٔ مدیریتی برای توضیحش ندارند و مسئله دیده نمی‌شود. نزدیک‌ترین نوع چیست؟","a":"بی‌عدالتیِ هرمنوتیکی: منابعِ تفسیریِ سازمان تجربه را به‌سختی قابل‌فهم می‌کنند، پس معرفت پیش از مرحلهٔ معمولِ سنجشِ اعتبار از دست می‌رود."}}},"fem":{"en":{"line":"Feminist epistemology studies how social position, power, and institutions shape who can know, what gets investigated, and which standards of credibility and objectivity are treated as neutral.","why":"<p>Traditional epistemology often models an isolated knower, but real knowledge is produced inside institutions with agendas, divisions of labor, and unequal access. Feminist epistemology asks whether those structures create systematic blind spots and whether greater objectivity can sometimes require including perspectives that dominant inquiry excluded.</p>","origin":"A diverse field associated with philosophers such as Sandra Harding, Helen Longino, Lorraine Code, and later work intersecting with standpoint theory and social epistemology. It developed alongside feminist philosophy of science rather than as one single doctrine.","obj":[["Standpoint claims can sound like truth is determined by identity.","Strong versions are controversial, but sophisticated standpoint theories do not say identity guarantees truth. They argue that some social positions provide access to evidence, incentives, or patterns that dominant positions systematically miss."],["If all knowledge is socially situated, feminist epistemology seems to undermine its own claims to objectivity.","Longino-style responses redefine objectivity as a property of critical social processes—diverse criticism, public standards, and uptake of challenge—rather than a view from nowhere."]],"confuse":[["Feminist epistemology vs. ‘women know better’","The field analyzes structures of knowledge and situated access; it is not a blanket credibility privilege for one sex or identity."],["Situated knowledge vs. relativism","Being situated means evidence and access are position-dependent; it does not entail that incompatible claims are equally true."]],"mistakes":["Treating inclusion as merely moral representation rather than potentially epistemic access to missing evidence and questions.","Assuming a socially diverse group is automatically epistemically diverse if everyone shares the same incentives, methods, and information sources."],"check":{"q":"A study team is demographically diverse but all members were trained in the same method, use the same dataset, and answer to the same incentive structure. What question would feminist epistemology still press?","a":"Whether the inquiry actually contains diverse epistemic standpoints, criticism, and access to different evidence—not merely demographic variety without methodological or institutional independence."}},"fa":{"line":"معرفت‌شناسیِ فمینیستی مطالعه می‌کند که موقعیتِ اجتماعی، قدرت و نهادها چگونه تعیین می‌کنند چه کسی می‌تواند بداند، چه چیزی بررسی می‌شود و کدام معیارِ اعتبار و عینیت «خنثی» تلقی می‌شود.","why":"<p>معرفت‌شناسیِ سنتی اغلب داننده‌ای منزوی می‌سازد، اما معرفتِ واقعی در نهادهایی با دستورکار، تقسیمِ کار و دسترسیِ نابرابر تولید می‌شود. این حوزه می‌پرسد آیا این ساختارها نقاطِ کورِ نظام‌مند می‌سازند و آیا عینیتِ بیشتر گاهی نیازمندِ واردکردنِ دیدگاه‌هایی است که پژوهشِ غالب حذف کرده است.</p>","origin":"حوزه‌ای متنوع با چهره‌هایی چون ساندرا هاردینگ، هلن لونجینو و لورن کُد، با پیوند به نظریهٔ منظر و معرفت‌شناسیِ اجتماعی. در کنارِ فلسفهٔ فمینیستیِ علم رشد کرده و یک آموزهٔ واحد نیست.","obj":[["ادعای منظر گاهی انگار می‌گوید هویت حقیقت را تعیین می‌کند.","نسخه‌های قوی محلِ مناقشه‌اند، اما روایت‌های جدی نمی‌گویند هویت حقیقت را تضمین می‌کند. می‌گویند بعضی موقعیت‌های اجتماعی دسترسی به شاهد، انگیزه یا الگویی می‌دهند که موقعیتِ مسلط نظام‌مند از دست می‌دهد."],["اگر همهٔ معرفت موقعیت‌مند است، این حوزه ادعای خودش به عینیت را تضعیف می‌کند.","پاسخِ لونجینوگونه عینیت را ویژگیِ فرایندِ اجتماعیِ نقد می‌داند—تنوعِ نقد، استانداردِ عمومی و پذیرشِ چالش—نه دیدگاهی از هیچ‌جا."]],"confuse":[["معرفت‌شناسیِ فمینیستی و «زنان بهتر می‌دانند»","حوزه ساختارهای معرفت و دسترسیِ موقعیت‌مند را تحلیل می‌کند؛ امتیازِ اعتباریِ کلی برای یک جنس یا هویت نیست."],["معرفتِ موقعیت‌مند و نسبی‌گرایی","موقعیت‌مندی یعنی دسترسی و شاهد می‌توانند به جایگاه وابسته باشند؛ از آن نتیجه نمی‌شود ادعاهای ناسازگار هم‌زمان به یک اندازه صادق‌اند."]],"mistakes":["دیدنِ شمول فقط به‌عنوان نمایندگیِ اخلاقی و نادیده‌گرفتنِ اینکه ممکن است دسترسیِ معرفتی به شاهد و پرسشِ حذف‌شده ایجاد کند.","فرضِ اینکه گروهِ جمعیت‌شناختیِ متنوع خودکار از نظر معرفتی متنوع است، حتی اگر انگیزه، روش و منبعِ اطلاعات همه یکسان باشد."],"check":{"q":"تیمِ پژوهش از نظر جمعیت‌شناختی متنوع است اما همه در یک روش آموزش دیده‌اند، یک داده دارند و زیرِ یک ساختارِ انگیزشی کار می‌کنند. معرفت‌شناسیِ فمینیستی هنوز چه می‌پرسد؟","a":"آیا پژوهش واقعاً منظر، نقد و دسترسیِ متفاوت به شاهد دارد یا فقط تنوعِ جمعیت‌شناختی بدون استقلالِ روش‌شناختی و نهادی."}}},"dutch":{"en":{"line":"The Dutch book argument says probabilistic incoherence has a practical cost: inconsistent credences can be combined into bets that guarantee your loss.","why":"<p>Probability axioms can look like elegant mathematics with no reason that actual beliefs should obey them. Dutch-book arguments supply a normative bridge. If your stated degrees of belief violate coherence, another agent can exploit the inconsistency without needing to know which event occurs. Rationality therefore requires at least avoiding sure-loss combinations.</p>","origin":"Associated with Frank Ramsey and Bruno de Finetti in the development of subjective Bayesianism. Different Dutch-book theorems use different assumptions about betting behavior and fair prices, so the philosophical conclusion is narrower than “Bayesianism has been proved.”","obj":[["People are not bookmakers and may rationally refuse bets, so exploitability does not prove irrational belief.","Correct. The argument works only if credences are connected to fair betting rates under idealized conditions. Its strongest lesson is about internal coherence, not a complete theory of rational belief."],["A coherent set of probabilities can still be wildly wrong about the world.","Absolutely. Coherence is necessary on the Bayesian picture, not sufficient. Calibration, evidence, priors, model adequacy, and learning determine whether coherent beliefs are also well connected to reality."]],"confuse":[["Dutch-book coherence vs. calibration","Coherence is consistency among your probabilities at a time; calibration compares predicted probabilities with long-run outcomes."],["Avoiding sure loss vs. maximizing expected utility","Dutch books establish a minimal consistency constraint. Decision theory adds utilities and choices among actions."]],"mistakes":["Treating coherence as evidence that the probabilities are empirically accurate.","Using a Dutch-book result to claim that one particular prior is objectively correct."],"check":{"q":"Two forecasters both obey all probability axioms, but one is consistently overconfident. Has the Dutch-book argument identified the problem?","a":"No. Both may be internally coherent. The overconfidence is a calibration problem, which requires comparing forecasts with outcomes rather than merely checking algebraic consistency."}},"fa":{"line":"استدلالِ دفتر هلندی می‌گوید ناسازگاریِ احتمالاتی هزینهٔ عملی دارد: باورهای احتمالیِ ناسازگار می‌توانند در مجموعه‌ای از شرط‌ها ترکیب شوند که زیان را تضمین می‌کند.","why":"<p>اصولِ احتمال ممکن است صرفاً ریاضیاتی زیبا به‌نظر برسند و معلوم نباشد چرا باورِ واقعی باید از آن‌ها پیروی کند. استدلالِ دفتر هلندی پلی هنجاری می‌سازد: اگر درجاتِ باور ناسازگار باشند، دیگری می‌تواند بدون دانستنِ نتیجهٔ رویداد از همان ناسازگاری بهره ببرد. پس حداقلِ عقلانیت اجتناب از زیانِ قطعی است.</p>","origin":"با فرانک رمزی و برونو دِفینتی در شکل‌گیریِ بیزگراییِ ذهنی پیوند دارد. نسخه‌های مختلف فرض‌های متفاوتی دربارهٔ شرط‌بندی و قیمتِ منصفانه دارند، پس نتیجه محدودتر از این ادعاست که «بیزگرایی اثبات شد».","obj":[["آدم‌ها شرط‌بند نیستند و می‌توانند شرط را رد کنند، پس بهره‌برداری‌پذیری غیرعقلانی‌بودنِ باور را ثابت نمی‌کند.","درست. استدلال فقط وقتی کار می‌کند که درجهٔ باور به نرخِ شرط‌بندیِ منصفانه وصل شود. قوی‌ترین نتیجه‌اش انسجامِ درونی است، نه نظریه‌ای کامل از عقلانیت."],["مجموعه‌ای کاملاً منسجم از احتمال‌ها می‌تواند دربارهٔ جهان کاملاً غلط باشد.","کاملاً. انسجام در تصویرِ بیزی شرطِ لازم است نه کافی. کالیبراسیون، شاهد، پیشین، کفایتِ مدل و یادگیری اتصال به واقعیت را تعیین می‌کنند."]],"confuse":[["انسجامِ دفتر هلندی و کالیبراسیون","انسجام رابطهٔ احتمال‌های شما در یک زمان است؛ کالیبراسیون احتمال‌های پیش‌بینی‌شده را با فراوانیِ نتایج مقایسه می‌کند."],["پرهیز از زیانِ قطعی و بیشینه‌سازیِ مطلوبیتِ موردانتظار","دفتر هلندی حداقلِ سازگاری را می‌دهد؛ نظریهٔ تصمیم مطلوبیت و انتخابِ عمل را اضافه می‌کند."]],"mistakes":["برداشتِ انسجام به‌عنوان شاهدِ دقتِ تجربیِ احتمال‌ها.","استفاده از استدلال برای اثباتِ اینکه یک پیشینِ خاص عیناً درست است."],"check":{"q":"دو پیش‌بینی‌گر هر دو همهٔ اصولِ احتمال را رعایت می‌کنند اما یکی مرتب بیش‌ازحد مطمئن است. آیا دفتر هلندی مشکل را تشخیص داده؟","a":"نه. هر دو می‌توانند دروناً منسجم باشند. بیش‌اطمینانی مشکلِ کالیبراسیون است و نیاز به مقایسهٔ پیش‌بینی با نتیجه دارد."}}},"condorcet":{"en":{"line":"Under independence and individual competence above chance, majority judgment becomes increasingly reliable as the group grows.","why":"<p>The Condorcet theorem formalizes why aggregating many modestly competent judgments can outperform a single expert. But its power comes from assumptions that social systems routinely violate—especially independence. Herding, common information, correlated incentives, and shared models can make a thousand votes behave epistemically like one.</p>","origin":"Formulated by the Marquis de Condorcet in the eighteenth century as part of mathematical analysis of collective decision-making. Modern social epistemology uses it to clarify when democracy, committees, prediction aggregation, and crowds can possess epistemic advantages.","obj":[["Voters are not independent; they consume the same media and influence one another.","Exactly. The theorem is conditional, not a blanket defense of majority rule. Correlation can dramatically reduce the effective sample size, which is why source independence is the key practical variable."],["Some individuals are worse than chance or have systematically biased incentives.","Then larger groups can make things worse rather than better. The theorem’s competence assumption must be defended, and weighting or institutional design may be preferable to simple majority aggregation."]],"confuse":[["Condorcet theorem vs. wisdom of crowds in general","Condorcet is a precise result for binary judgments under specific competence and independence conditions. ‘Wisdom of crowds’ is a broader family of phenomena."],["Independence vs. diversity","People can be demographically or ideologically diverse while their errors remain correlated through common data or methods."]],"mistakes":["Counting heads instead of estimating effective independent information sources.","Invoking the theorem when each member is simply repeating the same analyst, model, or upstream source."],"check":{"q":"One hundred analysts independently receive the same flawed vendor dataset and all reach the same conclusion. Does Condorcet give you strong confidence?","a":"No. Their judgments are highly correlated through a common error source. The apparent group size is 100, but the effective independent evidential base may be close to one."}},"fa":{"line":"اگر داوری‌ها مستقل باشند و هر فرد اندکی بهتر از تصادف عمل کند، با بزرگ‌ترشدنِ گروه احتمالِ درست‌بودنِ اکثریت افزایش می‌یابد.","why":"<p>قضیهٔ کندرسه توضیح می‌دهد چرا تجمیعِ داوری‌های متوسط می‌تواند از یک متخصص بهتر باشد. اما قدرتِ آن کاملاً از فرض‌هایی می‌آید که در نظامِ اجتماعی مرتب نقض می‌شوند—به‌ویژه استقلال. تقلید، اطلاعاتِ مشترک، انگیزه‌های همبسته و مدلِ یکسان می‌تواند هزار رأی را از نظر معرفتی به یک رأی تبدیل کند.</p>","origin":"مارکی دو کندرسه در قرن هجدهم آن را در تحلیلِ ریاضیِ تصمیمِ جمعی مطرح کرد. معرفت‌شناسیِ اجتماعیِ جدید از آن برای فهمِ شرایطِ مزیتِ معرفتیِ دموکراسی، کمیته و تجمیعِ پیش‌بینی استفاده می‌کند.","obj":[["رأی‌دهندگان مستقل نیستند؛ رسانهٔ مشترک می‌بینند و بر هم اثر می‌گذارند.","دقیقاً. قضیه شرطی است نه دفاعِ کلی از اکثریت. همبستگی اندازهٔ نمونهٔ مؤثر را به‌شدت کم می‌کند، پس استقلالِ منبع متغیرِ عملیِ مرکزی است."],["بعضی افراد بدتر از تصادف‌اند یا انگیزهٔ سوگیرانه دارند.","در آن صورت گروهِ بزرگ‌تر حتی می‌تواند بدتر شود. فرضِ شایستگی باید دفاع شود و وزن‌دهی یا طراحیِ نهادی ممکن است بهتر از اکثریتِ ساده باشد."]],"confuse":[["قضیهٔ کندرسه و خردِ جمعی به‌طور کلی","کندرسه نتیجه‌ای دقیق برای داوریِ دوتایی با شرایطِ مشخص است؛ «خردِ جمعی» خانواده‌ای گسترده‌تر از پدیده‌هاست."],["استقلال و تنوع","افراد می‌توانند جمعیت‌شناختی یا ایدئولوژیک متنوع باشند اما خطایشان به‌سببِ داده یا روشِ مشترک همچنان همبسته باشد."]],"mistakes":["شمردنِ تعدادِ افراد به‌جای برآوردِ تعدادِ منابعِ واقعاً مستقلِ اطلاعات.","استناد به قضیه وقتی همه در اصل همان تحلیلگر، مدل یا منبعِ بالادستی را تکرار می‌کنند."],"check":{"q":"صد تحلیلگر مستقل همان مجموعه‌دادهٔ معیوبِ یک فروشنده را دریافت می‌کنند و به یک نتیجه می‌رسند. کندرسه باید اطمینانِ شما را خیلی بالا ببرد؟","a":"نه. داوری‌ها از راهِ خطای مشترک به‌شدت همبسته‌اند. اندازهٔ ظاهریِ گروه ۱۰۰ است، اما پایهٔ شاهدیِ مستقل ممکن است تقریباً یک باشد."}}},"lottery":{"en":{"line":"The lottery paradox shows that high probability for each individual claim does not license belief in all of them together.","why":"<p>A million-ticket lottery makes it rational to assign each ticket an overwhelming probability of losing, yet irrational to believe that every ticket will lose because you know one must win. The paradox exposes a mismatch between threshold accounts of belief and the logic of conjunction. Small individual risks accumulate across many claims.</p>","origin":"Associated with Henry Kyburg in twentieth-century epistemology and probability theory. It became a central challenge for theories that define outright belief as simply having credence above some fixed threshold.","obj":[["Just set the belief threshold extremely high.","No fixed threshold below certainty solves the general problem. With enough claims, the probability of their conjunction can become low even when each claim individually exceeds the threshold."],["The paradox only shows we should avoid believing conjunctions, not that individual beliefs are problematic.","But closure principles connect beliefs to known consequences. If you believe each claim and recognize that together they entail the conjunction, refusing the conjunction requires explaining why belief is not closed under such aggregation."]],"confuse":[["Lottery paradox vs. preface paradox","Lottery starts from many high-probability claims before knowing which one fails. Preface adds meta-evidence from experience that at least one claim in a body of work is wrong."],["High credence vs. outright belief","Credence is graded probability; outright belief is categorical. The paradox pressures simple rules that derive the latter from the former by a threshold."]],"mistakes":["Treating a report with many individually 95% reliable claims as roughly 95% reliable as a whole.","Assuming confidence percentages aggregate additively rather than through dependence and conjunction."],"check":{"q":"Twenty independent claims are each 95% likely. Is it reasonable to treat the whole 20-claim package as 95% likely to be entirely correct?","a":"No. Under independence the probability all twenty are correct is about 36%. High confidence in each item does not preserve high confidence in the conjunction."}},"fa":{"line":"پارادوکسِ بخت‌آزمایی نشان می‌دهد احتمالِ بالای تک‌تکِ ادعاها مجوزِ باور به همهٔ آن‌ها با هم نیست.","why":"<p>در بخت‌آزمایی با یک میلیون بلیت، دربارهٔ هر بلیت احتمالِ بسیار بالایی می‌دهید که بازنده باشد، اما نمی‌توانید باور کنید همه بازنده‌اند چون یکی حتماً برنده است. پارادوکس شکاف میانِ نظریهٔ آستانه‌ایِ باور و منطقِ عطف را نشان می‌دهد. ریسک‌های کوچک در مجموعهٔ بزرگ انباشته می‌شوند.</p>","origin":"با هنری کایبرگ در معرفت‌شناسی و نظریهٔ احتمالِ قرن بیستم پیوند دارد و به چالشی مرکزی برای نظریه‌هایی بدل شد که باورِ قطعی را صرفاً احتمالِ بالاتر از یک آستانه می‌دانند.","obj":[["فقط آستانهٔ باور را خیلی بالا ببرید.","هیچ آستانهٔ ثابتِ کمتر از یقین مشکل را عمومی حل نمی‌کند. با تعدادِ کافیِ ادعا، احتمالِ عطف می‌تواند پایین شود حتی وقتی هر ادعا از آستانه بالاتر است."],["پارادوکس فقط می‌گوید عطف را باور نکنیم؛ باورهای فردی مشکلی ندارند.","اما اصولِ بستار باورها را به پیامدهای شناخته‌شده وصل می‌کنند. اگر تک‌تک را باور دارید و می‌دانید با هم عطف را نتیجه می‌دهند، ردِ عطف نیاز به نظریه‌ای دربارهٔ چراییِ شکستِ بستار دارد."]],"confuse":[["پارادوکسِ بخت‌آزمایی و مقدمه","بخت‌آزمایی از مجموعه‌ای ادعای پر احتمال آغاز می‌کند بی‌آنکه بدانیم کدام خطاست. پارادوکسِ مقدمه فرادادهٔ تجربی دارد که دست‌کم یک خطا در اثر هست."],["احتمالِ ذهنیِ بالا و باورِ قطعی","احتمال درجه‌دار است؛ باور قطعی دوحالتی است. پارادوکس قاعده‌های سادهٔ تبدیلِ اولی به دومی با آستانه را تحتِ فشار می‌گذارد."]],"mistakes":["برخورد با گزارشی از ادعاهای ۹۵٪ قابل‌اعتماد گویی کلِ گزارش هم ۹۵٪ احتمالِ بی‌خطایی دارد.","فرضِ اینکه درصدهای اطمینان به‌صورتِ جمعی انباشته می‌شوند، نه بر اساسِ وابستگی و عطف."],"check":{"q":"بیست ادعای مستقل هر یک ۹۵٪ احتمالِ صدق دارند. آیا کلِ بسته ۹۵٪ احتمال دارد که کاملاً درست باشد؟","a":"نه. با استقلال، احتمالِ درست‌بودنِ همه حدود ۳۶٪ است. اطمینانِ بالا به هر جزء، اطمینانِ بالا به عطف را حفظ نمی‌کند."}}},"preface":{"en":{"line":"The preface paradox shows that rational confidence in each claim can coexist with rational confidence that at least one claim in the total body is wrong.","why":"<p>Authors reasonably believe each sentence they assert, yet experience tells them that long works almost certainly contain an error. The two attitudes are individually rational but jointly inconsistent under simple closure rules. The paradox exposes the tension between local justification and global fallibility.</p>","origin":"Formulated by D.C. Makinson in the twentieth century. It became a companion to the lottery paradox in debates over rational belief, closure, acceptance rules, and the relation between graded credence and categorical belief.","obj":[["The author should simply withhold belief from one unspecified sentence.","Which one? The point is that there may be no particular claim with weaker evidence. Arbitrarily downgrading one sentence would be less rational locally than maintaining confidence while acknowledging global fallibility."],["The inconsistency proves our ordinary concept of belief is irrational.","Or it shows that rational belief is not closed under unrestricted conjunction. Many theories respond by distinguishing acceptance for practical purposes from full belief or by modeling confidence probabilistically."]],"confuse":[["Preface paradox vs. hypocrisy","The author is not saying a particular claim is false while asserting it. The meta-belief concerns the collection as a whole."],["Preface vs. lottery paradox","Preface relies on empirical knowledge about one’s error rate; lottery relies on the known structure that one member must fail."]],"mistakes":["Treating acknowledgment of fallibility as a reason to retract every individual conclusion.","Demanding that a large report be either fully endorsed or globally disowned rather than assigning local and global confidence separately."],"check":{"q":"Can “I stand behind every estimate in this report” and “I expect at least one estimate is wrong” both be rational?","a":"Yes, and that is the paradox. Each estimate may be individually well supported while accumulated fallibility makes the global error claim highly credible."}},"fa":{"line":"پارادوکسِ مقدمه نشان می‌دهد اعتمادِ عقلانی به هر ادعای منفرد می‌تواند با اعتمادِ عقلانی به اینکه دست‌کم یک ادعا در کلِ مجموعه غلط است هم‌زیست باشد.","why":"<p>نویسنده معمولاً هر جمله‌ای را که می‌نویسد باور دارد، اما تجربه می‌گوید اثرِ طولانی تقریباً حتماً یک خطا دارد. هر دو نگرش جداگانه عقلانی‌اند اما زیرِ قاعدهٔ سادهٔ بستار با هم ناسازگار می‌شوند. پارادوکس تنشِ میانِ توجیهِ محلی و خطاپذیریِ کلی را آشکار می‌کند.</p>","origin":"دی.سی. مکینسون در قرن بیستم صورت‌بندی کرد و کنارِ پارادوکسِ بخت‌آزمایی در بحث‌های باورِ عقلانی، بستار، پذیرش و رابطهٔ احتمالِ درجه‌دار با باورِ قطعی قرار گرفت.","obj":[["نویسنده فقط باید باور به یکی از جملاتِ نامشخص را تعلیق کند.","کدام؟ نکته این است که ممکن است هیچ جملهٔ خاصی شاهدِ ضعیف‌تری نداشته باشد. پایین‌آوردنِ دلبخواهیِ یکی از آن‌ها از نظر محلی کمتر عقلانی است تا حفظِ اعتماد همراه با پذیرشِ خطاپذیریِ کلی."],["ناسازگاری نشان می‌دهد مفهومِ عادیِ باور غیرعقلانی است.","یا نشان می‌دهد باورِ عقلانی زیرِ عطفِ نامحدود بسته نیست. نظریه‌ها با تمایزِ پذیرشِ عملی از باور یا با مدل‌کردنِ احتمالِ درجه‌دار پاسخ می‌دهند."]],"confuse":[["پارادوکسِ مقدمه و ریاکاری","نویسنده دربارهٔ جمله‌ای خاص هم‌زمان ادعای صدق و کذب نمی‌کند؛ فراباور دربارهٔ کلِ مجموعه است."],["مقدمه و بخت‌آزمایی","مقدمه بر شناختِ تجربی از نرخِ خطای خود تکیه دارد؛ بخت‌آزمایی بر ساختاری که می‌دانیم یکی از اعضا حتماً شکست می‌خورد."]],"mistakes":["برداشتِ پذیرشِ خطاپذیری به‌عنوان دلیلِ پس‌گرفتنِ همهٔ نتیجه‌های منفرد.","مجبورکردنِ یک گزارشِ بزرگ به دوگانهٔ «کاملاً تأیید» یا «کاملاً رد» به‌جای تفکیکِ اطمینانِ محلی و کلی."],"check":{"q":"آیا «پشتِ تک‌تکِ برآوردهای این گزارش می‌ایستم» و «انتظار دارم دست‌کم یکی غلط باشد» هر دو می‌توانند عقلانی باشند؟","a":"بله، و همین پارادوکس است. هر برآورد می‌تواند جداگانه پشتیبانیِ خوبی داشته باشد، در حالی که خطاپذیریِ انباشته باورِ کلی به وجودِ دست‌کم یک خطا را قوی می‌کند."}}},"probint":{"en":{"line":"Probability can mean long-run frequency, physical propensity, logical support, or rational degree of belief—and many disputes arise from switching interpretations midstream.","why":"<p>A number such as “30% chance” looks unambiguous until we ask what in the world the 30% refers to. Repeated frequencies fit repeatable events; propensity theories treat chance as a property of setups; logical interpretations treat probability as evidential relation; subjective Bayesians treat it as coherent credence. The interpretation determines what counts as evidence and what statements are meaningful.</p>","origin":"Major twentieth-century lines include frequentism associated with von Mises, propensity views associated with Popper and others, logical probability in Carnap, and subjective probability in Ramsey and de Finetti. Modern statistics inherits rather than eliminates these philosophical differences.","obj":[["Different interpretations are just semantics; the same probability calculus applies.","The calculus can be shared while the inferential meaning differs. A confidence interval, a physical chance, and a personal credence can use the same numbers but answer different questions and support different updates."],["Subjective probabilities permit arbitrary personal beliefs.","Bayesian coherence constrains relationships among credences, and evidence drives updating, but priors still create latitude. Objective Bayes and calibration criteria are attempts to narrow that latitude."]],"confuse":[["Frequentist probability vs. frequentist inference","A frequency interpretation of probability is philosophical; frequentist statistical procedures add sampling rules, error rates, and long-run guarantees."],["Chance vs. uncertainty","Chance may be treated as an objective feature of a process; uncertainty can describe an agent’s state of information even when the underlying event is fixed."]],"mistakes":["Using “probability” in a memo without clarifying whether it is model frequency, physical risk, posterior credence, or decision weight.","Interpreting a one-off forecast as a literal long-run frequency without specifying the reference class."],"check":{"q":"What does “there is a 30% chance this firm defaults next year” mean if the event occurs only once?","a":"The sentence needs an interpretation: perhaps a calibrated credence, a model-based frequency over a reference class, or a propensity-like risk. The number alone does not settle the ontology."}},"fa":{"line":"احتمال می‌تواند بسامدِ بلندمدت، گرایشِ فیزیکی، درجهٔ حمایتِ منطقی یا درجهٔ باورِ عقلانی باشد—و بسیاری از نزاع‌ها از جابه‌جاییِ بی‌صدا میانِ این تفسیرها می‌آیند.","why":"<p>عددِ «۳۰٪ احتمال» روشن به‌نظر می‌رسد تا بپرسیم ۳۰٪ دقیقاً ویژگیِ چیست. بسامد برای رویدادِ تکرارشونده مناسب است؛ گرایش احتمال را ویژگیِ دستگاه می‌داند؛ تفسیرِ منطقی آن را رابطهٔ شاهدی می‌بیند؛ بیزگرای ذهنی آن را درجهٔ باورِ منسجم می‌داند. تفسیر تعیین می‌کند چه چیزی شاهد است و چه جمله‌ای معنا دارد.</p>","origin":"خط‌های اصلیِ قرن بیستم شامل بسامدگراییِ فون میزس، گرایش‌های فیزیکیِ پوپر و دیگران، احتمالِ منطقیِ کارنپ و احتمالِ ذهنیِ رمزی و دِفینتی است. آمارِ مدرن این اختلاف‌ها را حذف نکرده، بلکه به ارث برده است.","obj":[["تفسیرها فقط لفظ‌اند؛ حسابِ احتمال برای همه یکی است.","حساب می‌تواند مشترک باشد اما معنای استنتاجی فرق می‌کند. فاصلهٔ اطمینان، شانسِ فیزیکی و باورِ شخصی می‌توانند عددِ مشابه داشته باشند اما پرسش‌های متفاوتی را پاسخ دهند."],["احتمالِ ذهنی هر باورِ دلبخواهی را مجاز می‌کند.","انسجامِ بیزی روابطِ میانِ باورها را محدود می‌کند و شاهد به‌روزرسانی را هدایت می‌کند، اما پیشین‌ها آزادی می‌دهند. بیزگراییِ عینی و کالیبراسیون تلاش برای محدودکردنِ آن‌اند."]],"confuse":[["تفسیرِ بسامدی و استنتاجِ بسامدگرا","اولی دیدگاهِ فلسفی دربارهٔ احتمال است؛ روشِ آماریِ بسامدگرا قواعدِ نمونه‌گیری، نرخِ خطا و تضمینِ بلندمدت را اضافه می‌کند."],["شانس و عدمِ‌قطعیت","شانس ممکن است ویژگیِ عینیِ فرایند باشد؛ عدمِ‌قطعیت حالتِ اطلاعاتیِ عامل است حتی وقتی رویدادِ زیرین ثابت شده باشد."]],"mistakes":["نوشتنِ «احتمال» بدون روشن‌کردنِ اینکه بسامدِ مدل، ریسکِ فیزیکی، باورِ پسین یا وزنِ تصمیم است.","تفسیرِ پیش‌بینیِ یک‌باره به‌عنوان بسامدِ بلندمدت بدون تعریفِ طبقهٔ مرجع."],"check":{"q":"«۳۰٪ احتمال دارد این شرکت سالِ بعد نکول کند» چه معنایی دارد وقتی رویداد فقط یک بار رخ می‌دهد؟","a":"جمله نیاز به تفسیر دارد: شاید باورِ کالیبره‌شده، بسامدِ مدل‌محور در یک طبقهٔ مرجع یا ریسکِ گرایشی. خودِ عدد هستی‌شناسی را تعیین نمی‌کند."}}},"constemp":{"en":{"line":"Constructive empiricism says science need only be empirically adequate: accepting a theory commits you to its observable success, not to literal belief in its unobservable ontology.","why":"<p>Scientific theories often posit entities and structures far beyond direct observation. Realism says predictive success is evidence those posits are approximately true; constructive empiricism offers a disciplined alternative: use the theory and believe what it says about observables while remaining agnostic about unobservables. This preserves scientific practice without the extra metaphysical commitment.</p>","origin":"Bas van Fraassen developed the view in <i>The Scientific Image</i> (1980) as a major anti-realist alternative to logical empiricism and scientific realism. “Acceptance” is broader than belief: it includes commitment to use a theory and pursue its research programme.","obj":[["The observable/unobservable boundary is vague and changes with instruments.","Van Fraassen treats observability as what suitably placed human beings could observe, not simply what is seen unaided. Critics argue the anthropocentric boundary remains unstable, but vagueness need not erase a useful distinction."],["The view cannot explain why empirically successful theories keep working in new domains; realism explains that success by approximate truth.","The constructive empiricist denies that explanatory satisfaction forces ontological belief. Selection, model refinement, and empirical fit can account for success without inferring the truth of every unobservable posit."]],"confuse":[["Constructive empiricism vs. instrumentalism","Both resist realist commitment, but constructive empiricism still treats theories as literally truth-apt; it simply limits what acceptance requires believing."],["Empirical adequacy vs. truth","A theory is empirically adequate if what it says about observable phenomena is correct, even if its claims about unobservables are false."]],"mistakes":["Assuming anti-realism means scientists should not take theory seriously or use unobservable entities in reasoning.","Treating every instrumentally detected entity as automatically “observable” without stating the criterion."],"check":{"q":"You rely heavily on a model’s latent states for prediction but refuse to say those states literally exist in the world. Which stance is this closest to?","a":"Constructive empiricism or a nearby anti-realist stance: accept the model for its empirical adequacy while withholding belief in the literal ontology of the unobservables."}},"fa":{"line":"تجربه‌گراییِ سازنده می‌گوید هدفِ علم کفایتِ تجربی است: پذیرشِ نظریه شما را به موفقیتِ آن دربارهٔ امورِ مشاهده‌پذیر متعهد می‌کند، نه به باورِ لفظی به هستی‌شناسیِ مشاهده‌ناپذیرش.","why":"<p>نظریه‌های علمی موجودات و ساختارهایی فراتر از مشاهدهٔ مستقیم فرض می‌کنند. واقع‌گرایی موفقیتِ پیش‌بینی را شاهدِ صدقِ تقریبیِ آن‌ها می‌داند؛ تجربه‌گراییِ سازنده راهی منضبط‌تر پیشنهاد می‌کند: نظریه را به کار ببر و دربارهٔ مشاهده‌پذیرها باور کن، اما دربارهٔ امورِ مشاهده‌ناپذیر تعلیق داشته باش.</p>","origin":"بس ون فراسن در <i>تصویرِ علمی</i> (۱۹۸۰) این موضع را به‌عنوان بدیلی مهم برای واقع‌گراییِ علمی بسط داد. «پذیرش» از باور گسترده‌تر است و تعهد به استفاده از نظریه و ادامهٔ برنامهٔ پژوهشی را هم دربر می‌گیرد.","obj":[["مرزِ مشاهده‌پذیر و مشاهده‌ناپذیر مبهم است و با ابزار تغییر می‌کند.","ون فراسن مشاهده‌پذیری را چیزی می‌داند که انسانِ مناسب‌مکان‌گرفته می‌تواند ببیند، نه فقط چشمِ بی‌ابزار. منتقدان همچنان مرز را انسان‌محور و ناپایدار می‌دانند؛ ابهام الزاماً تمایز را بی‌فایده نمی‌کند."],["این موضع توضیح نمی‌دهد چرا نظریه‌های موفق در حوزه‌های تازه هم کار می‌کنند؛ واقع‌گرایی با صدقِ تقریبی توضیح می‌دهد.","تجربه‌گرای سازنده انکار می‌کند رضایتِ تبیینی ما را مجبور به باورِ هستی‌شناختی کند. انتخاب، اصلاحِ مدل و برازشِ تجربی می‌توانند موفقیت را توضیح دهند بدون اینکه صدقِ تمامِ امورِ مشاهده‌ناپذیر نتیجه شود."]],"confuse":[["تجربه‌گراییِ سازنده و ابزارگرایی","هر دو در برابر تعهدِ واقع‌گرایانه‌اند، اما تجربه‌گراییِ سازنده نظریه را واقعاً صدق‌پذیر می‌داند؛ فقط می‌گوید پذیرش نیاز به باورِ تمامِ آن ندارد."],["کفایتِ تجربی و صدق","نظریه وقتی از نظر تجربی کافی است که دربارهٔ پدیده‌های مشاهده‌پذیر درست باشد، حتی اگر ادعاهایش دربارهٔ مشاهده‌ناپذیرها کاذب باشند."]],"mistakes":["فرضِ اینکه ضدواقع‌گرایی یعنی نظریه یا موجوداتِ نظری را جدی نگیریم.","مشاهده‌پذیر دانستنِ هر چیزی که ابزار آشکار می‌کند بدون تعریفِ معیار."],"check":{"q":"برای پیش‌بینی به حالت‌های نهفتهٔ مدل تکیه دارید اما حاضر نیستید بگویید آن حالت‌ها واقعاً در جهان وجود دارند. این به کدام موضع نزدیک است؟","a":"تجربه‌گراییِ سازنده یا ضدواقع‌گراییِ نزدیک به آن: مدل را به‌سببِ کفایتِ تجربی می‌پذیرید اما دربارهٔ هستی‌شناسیِ لفظیِ امورِ مشاهده‌ناپذیر تعلیق می‌کنید."}}},"corrob":{"en":{"line":"For Popper, corroboration is a record of surviving severe tests—not confirmation, probability, or inductive support for future success.","why":"<p>Popper wants science without induction. If past success raised the probability that a universal theory will continue to succeed, induction would have returned. So he sharply restricts “corroborated” to a historical appraisal: the theory has faced risky tests and not yet failed. That licenses preference in inquiry, but not the claim that the theory is probably true.</p>","origin":"A central distinction in Karl Popper’s philosophy of science, especially <i>The Logic of Scientific Discovery</i> and <i>Conjectures and Refutations</i>. Popper introduced special terminology partly to resist the ordinary inductive connotations of “confirmation.”","obj":[["If corroboration gives no reason to expect future success, why prefer a well-tested theory to an untested one?","This is a persistent difficulty. Popper appeals to rational preference for the best-tested theory as a methodological rule, but critics argue that practical reliance looks like inductive justification returning through the back door."],["Scientists plainly do treat repeated success as evidence, so Popper’s usage is too revisionary.","Yes. Bayesian and other confirmation theories deliberately formalize that ordinary practice. Popper’s distinction remains useful when reading him, and as a warning not to turn survival into certainty."]],"confuse":[["Corroborated vs. verified","Corroborated means not yet refuted under severe tests; verified suggests established true, which Popper rejects for universal empirical theories."],["Corroboration vs. replication","Replication is repeating or independently reproducing a result. Replication can contribute to corroboration, but the concepts are not identical."]],"mistakes":["Writing that Popperian corroboration means a theory has become more probable.","Calling a theory highly corroborated merely because it fit many observations that it was designed after seeing."],"check":{"q":"A theory has survived ten severe, pre-specified tests. What can a strict Popperian say—and what can they not say?","a":"They can say it is highly corroborated relative to rivals and has survived serious criticism. They cannot infer from that alone that the theory is probably true or that the eleventh test is likely to succeed."}},"fa":{"line":"نزدِ پوپر، «تأییدِ آزمونی» فقط کارنامهٔ جان‌به‌دربردن از آزمون‌های سخت است—نه اثبات، نه احتمالِ بیشتر و نه پشتیبانیِ استقرایی برای موفقیتِ آینده.","why":"<p>پوپر علم را بدون استقرا می‌خواهد. اگر موفقیتِ گذشته احتمالِ موفقیتِ آینده را بالا ببرد، استقرا دوباره وارد شده است. پس «تأییدِ آزمونی» را به داوریِ تاریخی محدود می‌کند: نظریه با آزمونِ پرخطر روبه‌رو شده و هنوز شکست نخورده. این شاید ترجیحِ روش‌شناختی بدهد، نه حکمِ «احتمالاً صادق».</p>","origin":"تمایزی مرکزی در فلسفهٔ علمِ کارل پوپر، به‌ویژه در <i>منطقِ اکتشاف علمی</i> و <i>حدس‌ها و ابطال‌ها</i>. واژگانِ خاص را تا حدی برای پرهیز از بارِ استقراییِ «تأیید» ساخت.","obj":[["اگر تأییدِ آزمونی هیچ دلیل برای انتظارِ موفقیتِ آینده نمی‌دهد، چرا نظریهٔ خوب‌آزموده را به نظریهٔ آزمون‌نشده ترجیح دهیم؟","این مشکلِ پایدارِ پوپر است. او به ترجیحِ عقلانیِ بهترین‌آزموده به‌عنوان قاعدهٔ روش‌شناختی تکیه می‌کند، اما منتقدان می‌گویند اتکای عملی شبیه بازگشتِ توجیهِ استقرایی است."],["دانشمندان واقعاً موفقیتِ تکرارشده را شاهد می‌دانند؛ کاربردِ پوپر بیش‌ازحد خلافِ عرف است.","بله. بیزگرایی و نظریه‌های تأیید دقیقاً همان عملِ عادی را صورت‌بندی می‌کنند. تمایزِ پوپر برای فهمِ خودش و جلوگیری از تبدیلِ بقای نظریه به یقین همچنان مفید است."]],"confuse":[["تأییدِ آزمونی و اثبات","تأییدِ آزمونی یعنی هنوز زیرِ آزمونِ سخت ابطال نشده؛ اثبات یعنی صدقِ تثبیت‌شده که پوپر برای نظریهٔ تجربیِ کلی رد می‌کند."],["تأییدِ آزمونی و تکرارپذیری","تکرار یعنی بازتولیدِ مستقلِ نتیجه و می‌تواند بخشی از تأییدِ آزمونی باشد، اما دو مفهوم یکی نیستند."]],"mistakes":["نوشتنِ اینکه نزدِ پوپر تأییدِ آزمونی نظریه را محتمل‌تر می‌کند.","«بسیار تأییدشده» خواندنِ نظریه فقط چون با مشاهداتی جور است که پس از دیدنِ آن‌ها ساخته شده است."],"check":{"q":"نظریه‌ای ده آزمونِ سخت و ازپیش‌ثبت‌شده را پشت سر گذاشته است. پوپریِ سخت‌گیر چه می‌تواند و چه نمی‌تواند بگوید؟","a":"می‌تواند بگوید نظریه نسبت به رقیبان بسیار تأییدِ آزمونی شده و از نقدِ جدی جان به در برده. نمی‌تواند فقط از همین نتیجه بگیرد نظریه احتمالاً صادق است یا آزمونِ یازدهم احتمالاً موفق می‌شود."}}},"demarc":{"en":{"line":"The demarcation problem asks what distinguishes science from non-science; no single proposed criterion has cleanly captured scientific practice without excluding good science or admitting bad imitations.","why":"<p>The question matters institutionally because “scientific” affects credibility, funding, regulation, and public authority. Falsifiability was the most famous answer, but historical and methodological work showed that sciences use heterogeneous methods and often protect theories through anomalies. The modern lesson is to assess a bundle of epistemic practices rather than worship one test.</p>","origin":"Popper framed falsifiability as a demarcation criterion partly against verificationism and pseudoscientific systems. Later philosophers, including Larry Laudan, argued that the search for a necessary-and-sufficient boundary had failed and that we should instead evaluate claims and methods directly.","obj":[["Without a boundary, pseudoscience cannot be distinguished from science.","Rejecting one sharp criterion does not mean abandoning evaluation. Replication, openness to correction, predictive risk, methodological transparency, causal identification, peer criticism, and track record can jointly discriminate without forming a single essence."],["Falsifiability still works well enough for practical purposes.","It is a useful warning against immunity, but too permissive and too restrictive as a universal rule. Many poor theories make falsifiable predictions, while mature sciences often test probabilistic or auxiliary-laden claims that resist one-shot falsification."]],"confuse":[["Demarcation vs. truth","A claim can be scientific and false, or true for non-scientific reasons. Demarcation concerns method/status, not truth-value."],["Science vs. expertise","An expert judgment may be rationally authoritative without itself being a scientific result; expertise is a social-epistemic relation."]],"mistakes":["Using “not falsifiable” as a synonym for meaningless, false, or irrational.","Treating the label “science” as a substitute for examining the quality of the actual evidence and method."],"check":{"q":"A forecasting system makes precise falsifiable predictions but repeatedly patches its model after misses and publishes no independent validation. Has falsifiability settled its scientific status?","a":"No. It passes one condition while failing others that matter: progressive prediction, transparency, independence, and response to error. Demarcation requires a broader methodological assessment."}},"fa":{"line":"مسئلهٔ تمایز می‌پرسد چه چیزی علم را از غیرعلم جدا می‌کند؛ هیچ معیارِ واحدی نتوانسته بدون حذفِ علمِ خوب یا پذیرشِ تقلیدِ بد، عملِ علمی را کاملاً بگیرد.","why":"<p>پرسش نهادی مهم است چون برچسبِ «علمی» بر اعتبار، بودجه، مقررات و اقتدارِ عمومی اثر دارد. ابطال‌پذیری مشهورترین پاسخ بود، اما تاریخ و روش‌شناسی نشان داد علوم روش‌های متنوع دارند و در برابر ناهنجاری نظریه را فوراً کنار نمی‌گذارند. درسِ مدرن ارزیابیِ مجموعه‌ای از رویه‌های معرفتی است.</p>","origin":"پوپر ابطال‌پذیری را تا حدی در برابر تحقیق‌پذیری و نظام‌های شبه‌علمی معیارِ تمایز کرد. فیلسوفانِ بعدی، از جمله لری لاودن، استدلال کردند جست‌وجوی مرزِ لازم و کافی شکست خورده و بهتر است خودِ ادعا و روش را مستقیم بسنجیم.","obj":[["بدون مرز، دیگر نمی‌توان شبه‌علم را از علم جدا کرد.","ردِ یک معیارِ تیز به معنای رهاکردنِ ارزیابی نیست. تکرار، آمادگی برای اصلاح، پیش‌بینیِ پرخطر، شفافیتِ روش، شناساییِ علّی، نقدِ همتا و کارنامه می‌توانند مشترکاً تمایز ایجاد کنند."],["ابطال‌پذیری برای کارِ عملی به‌اندازهٔ کافی خوب است.","به‌عنوان هشدار علیه مصون‌سازی مفید است، اما معیارِ جهان‌شمول هم بیش‌ازحد می‌پذیرد و هم بیش‌ازحد حذف می‌کند. نظریهٔ ضعیف می‌تواند ابطال‌پذیر باشد و علمِ بالغ اغلب ادعاهای احتمالاتی و بسته‌های فرضی را می‌آزماید."]],"confuse":[["تمایز و صدق","ادعا می‌تواند علمی و کاذب باشد یا به دلایلی غیرعلمی صادق باشد. تمایز دربارهٔ روش و جایگاه است، نه ارزشِ صدق."],["علم و تخصص","داوریِ متخصص می‌تواند عقلانی و معتبر باشد بی‌آنکه خودِ آن یک نتیجهٔ علمی باشد؛ تخصص رابطه‌ای در معرفت‌شناسیِ اجتماعی است."]],"mistakes":["استفاده از «ابطال‌ناپذیر» به‌عنوان مترادفِ بی‌معنا، کاذب یا غیرعقلانی.","جایگزین‌کردنِ برچسبِ «علم» به‌جای بررسیِ کیفیتِ شاهد و روش."],"check":{"q":"سامانهٔ پیش‌بینی، خروجی‌های دقیق و ابطال‌پذیر می‌دهد اما بعد از هر خطا مدل را وصله می‌کند و اعتبارسنجیِ مستقل منتشر نمی‌کند. آیا ابطال‌پذیری وضعیتِ علمی را حل کرده؟","a":"نه. یک شرط را پاس کرده اما در پیش‌بینیِ پیش‌رونده، شفافیت، استقلال و واکنش به خطا ممکن است شکست بخورد. تمایز به ارزیابیِ گسترده‌تر نیاز دارد."}}},"expl":{"en":{"line":"Scientific explanation asks not merely whether a model predicts a phenomenon, but what relation—lawlike, causal, mechanistic, or unifying—makes the phenomenon intelligible.","why":"<p>Prediction and explanation can come apart. Hempel’s deductive-nomological model captured one ideal: derive the event from laws plus conditions. Counterexamples showed that derivability alone misses direction and relevance; the height of a flagpole explains its shadow, but the shadow length does not symmetrically explain the height. Later accounts emphasize causes, mechanisms, or unification.</p>","origin":"Carl Hempel and Paul Oppenheim formalized the deductive-nomological model in the mid-twentieth century. Wesley Salmon developed causal-statistical approaches; Philip Kitcher emphasized unification. The succession shows that “explanation” is itself a contested epistemic achievement.","obj":[["Prediction is all science needs; explanation adds metaphysical storytelling.","Instrumentalists can take that line, but explanation supports intervention, transfer, debugging, and counterfactual reasoning in ways fit alone often does not. The extra value becomes practical when regimes change."],["Causal explanation simply replaces one unexplained notion with another—causation.","True as a philosophical pressure. Modern causal frameworks make the assumptions and counterfactual structure explicit, which improves discipline even if the metaphysics of causation remains debated."]],"confuse":[["Explanation vs. prediction","A model can predict accurately for the wrong reason or via correlation. Explanation aims at why or how, often requiring asymmetry or mechanism."],["Explanation vs. description","A detailed description can summarize patterns without identifying why the pattern obtains or what would change it."]],"mistakes":["Calling a high-R² or accurate forecast an explanation without a story about relevance, mechanism, or counterfactual dependence.","Demanding one universal form of explanation across physics, biology, economics, and historical sciences."],"check":{"q":"A model forecasts defaults well because it uses a proxy tightly correlated with distress, but the proxy has no stable causal relation. Does forecasting success establish explanation?","a":"No. It establishes predictive usefulness under the observed regime. Explanation requires an account of why the relation holds and whether it would survive interventions or changes in the data-generating process."}},"fa":{"line":"تبیینِ علمی فقط نمی‌پرسد مدل پدیده را پیش‌بینی می‌کند یا نه؛ می‌پرسد چه رابطه‌ای—قانونی، علّی، سازوکاری یا وحدت‌بخش—پدیده را فهم‌پذیر می‌کند.","why":"<p>پیش‌بینی و تبیین از هم جدا می‌شوند. مدلِ قیاسی–قانونیِ همپل ایده‌آلی روشن داشت: رویداد را از قانون و شرایطِ اولیه استنتاج کن. مثال‌های نقض نشان دادند استنتاجِ صرف جهت و ربط را نمی‌گیرد؛ ارتفاعِ میله سایه را توضیح می‌دهد، نه برعکس. نظریه‌های بعدی علت، سازوکار و وحدت را برجسته کردند.</p>","origin":"کارل همپل و پل اوپنهایم در میانهٔ قرن بیستم مدلِ قیاسی–قانونی را صورت‌بندی کردند. وسلی سالمون روایتِ علّی–آماری و فیلیپ کیچر وحدت را برجسته کردند. همین توالی نشان می‌دهد خودِ «تبیین» دستاوردی محلِ نزاع است.","obj":[["برای علم پیش‌بینی کافی است؛ تبیین داستانِ متافیزیکیِ اضافه است.","ابزارگرا می‌تواند چنین بگوید، اما تبیین برای مداخله، انتقال به محیطِ تازه، عیب‌یابی و استدلالِ خلاف‌واقعی چیزهایی می‌دهد که صرفِ برازش نمی‌دهد—به‌ویژه هنگامِ تغییرِ رژیم."],["تبیینِ علّی فقط واژهٔ مبهمِ «علت» را جایگزینِ ابهامِ دیگر می‌کند.","فشارِ فلسفی واقعی است. چارچوب‌های علّیِ مدرن حداقل فرض‌ها و ساختارِ خلاف‌واقعی را صریح می‌کنند، حتی اگر متافیزیکِ علیت همچنان محلِ بحث باشد."]],"confuse":[["تبیین و پیش‌بینی","مدل می‌تواند به‌دلیلِ غلط یا صرفاً همبستگی پیش‌بینیِ خوب کند. تبیین دنبالِ چرا/چگونه و اغلب جهت و سازوکار است."],["تبیین و توصیف","توصیفِ دقیق الگو را خلاصه می‌کند اما الزاماً نمی‌گوید چرا برقرار است یا چه چیزی آن را تغییر می‌دهد."]],"mistakes":["تبیین نامیدنِ R² بالا یا پیش‌بینیِ دقیق بدون روایتِ ربط، سازوکار یا وابستگیِ خلاف‌واقعی.","مطالبهٔ یک صورتِ واحد از تبیین برای فیزیک، زیست، اقتصاد و علومِ تاریخی."],"check":{"q":"مدلی نکول را خوب پیش‌بینی می‌کند چون از متغیری استفاده می‌کند که با پریشانی شدیداً همبسته است اما رابطهٔ علّیِ پایداری ندارد. آیا موفقیتِ پیش‌بینی تبیین را ثابت می‌کند؟","a":"نه. فقط کاراییِ پیش‌بینی در رژیمِ مشاهده‌شده را نشان می‌دهد. تبیین نیاز به حسابی از چراییِ رابطه و پایداریِ آن زیرِ مداخله یا تغییرِ فرایندِ مولد دارد."}}},"normal":{"en":{"line":"Kuhn’s normal science is puzzle-solving within a shared paradigm: most researchers extend and refine the framework rather than continually testing its deepest commitments.","why":"<p>Popper’s image makes scientists look like permanent revolutionaries trying to refute their own theories. Kuhn’s history showed that productive research usually does the opposite: it treats core commitments as fixed enough to define solvable puzzles. Without that temporary dogmatism, cumulative technical work would be impossible.</p>","origin":"Thomas Kuhn’s <i>The Structure of Scientific Revolutions</i> (1962) contrasted normal science with periods of crisis and paradigm change. A paradigm supplies exemplars, standards, instruments, and problem-types that organize research communities.","obj":[["Normal science sounds like institutionalized dogmatism.","Kuhn partly agrees: commitment is necessary for depth. The epistemic question is whether anomaly handling remains productive and whether crisis mechanisms exist when failures accumulate."],["Many sciences contain competing frameworks simultaneously, so a single paradigm exaggerates consensus.","This is one reason Lakatos’s research programmes are often more flexible. Kuhn’s concept works best where a mature community genuinely shares exemplars and standards."]],"confuse":[["Normal science vs. bad science","Normal science can be rigorous and highly productive. ‘Normal’ describes the relation to a framework, not quality."],["Anomaly vs. falsification","An anomaly is a recalcitrant problem within a paradigm. It does not automatically count as a decisive refutation or trigger abandonment."]],"mistakes":["Calling every incremental paper intellectually timid; cumulative work requires stable assumptions.","Remaining in normal-science mode when anomalies have become structural evidence against the framework itself."],"check":{"q":"You spend months refining a parameter estimate inside an accepted model and never ask whether that model family is right. In Kuhn’s vocabulary, what are you doing?","a":"Normal science: solving a puzzle defined by the paradigm. That is not a criticism unless the framework is in crisis and the deeper assumptions are precisely what need examination."}},"fa":{"line":"«علمِ عادی» کوهن حلِ معما درونِ پارادایمِ مشترک است: بیشترِ پژوهشگران چارچوب را گسترش و دقیق می‌کنند، نه اینکه دائماً بنیادی‌ترین تعهداتش را بیازمایند.","why":"<p>تصویرِ پوپر دانشمند را انقلابیِ دائمی می‌سازد که می‌کوشد نظریهٔ خودش را ابطال کند. تاریخِ کوهن نشان داد پژوهشِ بارور معمولاً برعکس عمل می‌کند: تعهداتِ هسته‌ای را موقتاً ثابت می‌گیرد تا معماهای حل‌شدنی تعریف شوند. بدون این ثبات، کارِ فنیِ انباشتی ممکن نیست.</p>","origin":"توماس کوهن در <i>ساختارِ انقلاب‌های علمی</i> (۱۹۶۲) علمِ عادی را از دورهٔ بحران و تغییرِ پارادایم جدا کرد. پارادایم نمونه، استاندارد، ابزار و نوعِ مسئله را برای جامعهٔ پژوهشی فراهم می‌کند.","obj":[["علمِ عادی شبیه جزم‌گراییِ نهادی است.","کوهن تا حدی می‌پذیرد: تعهد برای عمق لازم است. پرسشِ معرفتی این است که مدیریتِ ناهنجاری همچنان بارور باشد و وقتی شکست‌ها انباشته شد سازوکارِ بحران وجود داشته باشد."],["بسیاری از علوم هم‌زمان چند چارچوبِ رقیب دارند و پارادایمِ واحد اغراق است.","این یکی از دلایلی است که برنامه‌های پژوهشیِ لاکاتوش انعطاف‌پذیرترند. مفهومِ کوهن در حوزه‌ای بهتر کار می‌کند که جامعه واقعاً نمونه و استانداردِ مشترک دارد."]],"confuse":[["علمِ عادی و علمِ بد","علمِ عادی می‌تواند بسیار دقیق و بارور باشد. «عادی» رابطه با چارچوب را توصیف می‌کند نه کیفیت را."],["ناهنجاری و ابطال","ناهنجاری مسئله‌ای مقاوم درونِ پارادایم است؛ خودکار ابطالِ قطعی یا دلیلِ رهاکردن نیست."]],"mistakes":["ترسو و غیرخلاق خواندنِ هر پژوهشِ افزایشی؛ کارِ انباشتی به فرض‌های پایدار نیاز دارد.","ماندن در حالتِ علمِ عادی وقتی ناهنجاری‌ها به شاهدِ ساختاری علیه خودِ چارچوب تبدیل شده‌اند."],"check":{"q":"ماه‌ها پارامترِ مدلی پذیرفته‌شده را دقیق می‌کنید و هیچ‌گاه نمی‌پرسید خانوادهٔ مدل درست است یا نه. در واژگانِ کوهن چه می‌کنید؟","a":"علمِ عادی: حلِ معمایی که پارادایم تعریف کرده. این خود نقد نیست مگر اینکه چارچوب در بحران باشد و دقیقاً فرض‌های عمیق‌تر باید بررسی شوند."}}},"pmi":{"en":{"line":"The pessimistic meta-induction argues that many once-successful theories were later rejected, so current predictive success is weak evidence that our present theories are approximately true.","why":"<p>Scientific realism often points to success: surely it would be miraculous for radically false theories to predict so well. Laudan turns history against that inference. The record contains theories that were successful enough for their time yet posited entities or mechanisms later abandoned. Success may therefore outrun truth.</p>","origin":"Larry Laudan developed the pessimistic meta-induction as a major anti-realist challenge, using historical cases against simple no-miracles reasoning. The debate inspired selective or structural realist replies that try to identify which theoretical components survive change.","obj":[["Past theories were not as successful as today’s mature theories, so the induction is unfair.","Realists argue that novel predictive success and precision matter. Anti-realists reply that drawing the threshold after knowing which theories survived risks selection bias unless the relevant success criterion is specified independently."],["Even discarded theories preserved approximately true structure, so history supports selective realism rather than pessimism.","This is the strongest realist reply: identify the components responsible for success that were retained. The challenge is to do that prospectively rather than only after replacement."]],"confuse":[["Pessimistic meta-induction vs. ordinary induction","It is an induction about the historical fate of scientific theories, used to challenge an inductive inference from present success to truth."],["Theory falsity vs. total uselessness","A rejected theory may have been highly predictive in a domain. Falsity of ontology does not erase instrumental success."]],"mistakes":["Using one obsolete theory as decisive evidence that current science is unreliable.","Responding with “science self-corrects” without addressing whether current success tracks truth before the correction occurs."],"check":{"q":"What must a selective realist show to answer the pessimistic meta-induction convincingly?","a":"They must identify, by a principled rule, which components of successful theories are responsible for success and tend to survive theory change—not merely label the survivors “approximately true” afterward."}},"fa":{"line":"فرااستقرای بدبینانه می‌گوید بسیاری از نظریه‌های زمانی موفق بعدها کنار گذاشته شدند؛ پس موفقیتِ پیش‌بینیِ امروز شاهدِ ضعیف‌تری از آن چیزی است که واقع‌گرا می‌پندارد برای صدقِ تقریبی.","why":"<p>واقع‌گراییِ علمی به موفقیت تکیه می‌کند: چطور نظریهٔ بسیار کاذب می‌تواند این‌همه پیش‌بینی کند؟ لاودن تاریخ را علیه همین استنتاج به کار می‌گیرد. نظریه‌هایی داشتیم که در زمانِ خود موفق بودند اما موجودات یا سازوکارهایی را فرض می‌کردند که بعداً رها شدند. پس موفقیت می‌تواند از صدق جلو بزند.</p>","origin":"لری لاودن فرااستقرای بدبینانه را به‌عنوان چالشی بزرگ برای واقع‌گرایی بسط داد و از تاریخ علیه استدلالِ «بدون معجزه» استفاده کرد. پاسخ‌های واقع‌گراییِ گزینشی و ساختاری کوشیدند اجزایی را شناسایی کنند که از تغییرِ نظریه جان به در می‌برند.","obj":[["نظریه‌های گذشته به اندازهٔ نظریه‌های بالغِ امروز موفق نبودند، پس استقرا منصفانه نیست.","واقع‌گرا بر پیش‌بینیِ تازه و دقت تأکید می‌کند. ضدواقع‌گرا می‌گوید اگر آستانه را بعد از دیدنِ برندگان تعیین کنیم سوگیریِ انتخاب داریم؛ معیارِ موفقیت باید مستقل تعریف شود."],["حتی نظریه‌های کنارگذاشته ساختارِ تقریباً درست را حفظ کردند، پس تاریخ به سودِ واقع‌گراییِ گزینشی است.","این قوی‌ترین پاسخ است: اجزای مسئولِ موفقیت را که حفظ شده‌اند نشان دهید. چالش این است که پیشاپیش بتوان آن‌ها را شناخت، نه فقط پس از جانشینیِ نظریه."]],"confuse":[["فرااستقرای بدبینانه و استقرای عادی","این استقرایی دربارهٔ سرنوشتِ تاریخیِ نظریه‌هاست که برای نقدِ استنتاج از موفقیتِ فعلی به صدق استفاده می‌شود."],["کاذب‌بودنِ نظریه و بی‌فایده‌بودنِ کامل","نظریهٔ ردشده می‌تواند در حوزه‌ای بسیار پیش‌بینی‌گر بوده باشد. خطای هستی‌شناختی موفقیتِ ابزاری را محو نمی‌کند."]],"mistakes":["استفاده از یک نظریهٔ منسوخ به‌عنوان دلیلِ قاطع بر ناموثق‌بودنِ علمِ امروز.","پاسخ با «علم خودش را اصلاح می‌کند» بدون پاسخ به اینکه پیش از اصلاح، موفقیتِ فعلی چقدر صدق را ردیابی می‌کند."],"check":{"q":"واقع‌گرای گزینشی برای پاسخِ قانع‌کننده به فرااستقرای بدبینانه چه باید نشان دهد؟","a":"با قاعده‌ای اصولی اجزایی را مشخص کند که مسئولِ موفقیت‌اند و در تغییرِ نظریه حفظ می‌شوند، نه اینکه فقط پس از واقعه باقی‌مانده‌ها را «تقریباً صادق» بنامد."}}},"raven":{"en":{"line":"Hempel’s raven paradox shows that logical confirmation can assign positive evidential relevance to observations that intuitively seem almost irrelevant.","why":"<p>“All ravens are black” is logically equivalent to “all non-black things are non-ravens.” If evidence confirms logically equivalent statements equally, observing a green apple appears to confirm that all ravens are black. The paradox forces confirmation theory to distinguish mere consistency and logical equivalence from evidential weight.</p>","origin":"Developed by Carl Hempel as part of twentieth-century work on the logic of confirmation. It became a classic pressure test for simple instances-confirm-universals accounts and helped motivate probabilistic/Bayesian treatments of evidential relevance.","obj":[["A green apple really does confirm the hypothesis, just by an astronomically tiny amount.","Bayesian replies often take exactly this line. The apple rules out one possible non-black raven only in a vast space of non-ravens, so the likelihood effect is positive but negligible."],["The paradox comes from using logical equivalence; perhaps equivalent formulations need not have the same confirmation relation.","Dropping equivalence solves one problem at a high price: logically identical hypotheses would acquire different evidential support depending on wording. Most theories prefer to preserve equivalence and explain the tiny weight instead."]],"confuse":[["Confirmation vs. consistency","An observation can be consistent with a hypothesis without raising its probability. Confirmation requires a favorable comparison with alternatives."],["Raven paradox vs. base-rate neglect","Both concern evidential weight, but the raven paradox arises from equivalence and universal generalization; base-rate neglect is a probabilistic updating error."]],"mistakes":["Using “this observation is compatible with the theory” as if compatibility itself were evidence.","Ignoring the reference class: observing non-black non-ravens is cheap because almost everything in the universe is a non-raven."],"check":{"q":"Does finding a white shoe confirm “all ravens are black”?","a":"On many Bayesian accounts, technically yes but by an almost vanishing amount. The important lesson is that logical confirmation need not imply practically meaningful evidential weight."}},"fa":{"line":"پارادوکسِ کلاغِ همپل نشان می‌دهد منطقِ سادهٔ تأیید می‌تواند به مشاهده‌ای وزنِ شاهدیِ مثبت بدهد که از نظر شهودی تقریباً بی‌ربط است.","why":"<p>«همهٔ کلاغ‌ها سیاه‌اند» با «همهٔ چیزهای غیرسیاه غیرکلاغ‌اند» هم‌ارز است. اگر شاهد باید گزاره‌های هم‌ارز را یکسان تأیید کند، دیدنِ سیبِ سبز ظاهراً همهٔ کلاغ‌ها سیاه‌اند را تأیید می‌کند. پارادوکس ما را مجبور می‌کند سازگاری و هم‌ارزی را از وزنِ واقعیِ شاهد جدا کنیم.</p>","origin":"کارل همپل آن را در پژوهشِ قرن بیستم دربارهٔ منطقِ تأیید مطرح کرد. به آزمونی کلاسیک برای نظریه‌های سادهٔ «نمونه، حکمِ کلی را تأیید می‌کند» بدل شد و به رویکردهای احتمالاتی/بیزی انگیزه داد.","obj":[["سیبِ سبز واقعاً فرضیه را تأیید می‌کند، فقط به مقدارِ ناچیز.","پاسخِ بیزی اغلب همین است. سیب یکی از امکان‌های «کلاغِ غیرسیاه» را در فضای عظیمِ غیرکلاغ‌ها کنار می‌گذارد، پس اثرِ درست‌نمایی مثبت اما تقریباً صفر است."],["مشکل از هم‌ارزیِ منطقی می‌آید؛ شاید صورت‌بندی‌های هم‌ارز لازم نیست تأییدِ یکسان داشته باشند.","رهاکردنِ هم‌ارزی هزینهٔ زیادی دارد: فرضیه‌های منطقیِ یکسان بر اساسِ عبارت‌بندی شاهدِ متفاوت می‌گیرند. بیشتر نظریه‌ها هم‌ارزی را حفظ و کوچکیِ وزن را توضیح می‌دهند."]],"confuse":[["تأیید و سازگاری","مشاهده می‌تواند با فرضیه سازگار باشد بی‌آنکه احتمالِ آن را بالا ببرد. تأیید مقایسهٔ مطلوب با بدیل‌ها می‌خواهد."],["پارادوکسِ کلاغ و غفلت از نرخِ پایه","هر دو دربارهٔ وزنِ شاهدند، اما کلاغ از هم‌ارزی و حکمِ کلی می‌آید؛ غفلت از نرخِ پایه خطای به‌روزرسانیِ احتمالاتی است."]],"mistakes":["برخورد با «این مشاهده با نظریه سازگار است» گویی خودِ سازگاری شاهد است.","نادیده‌گرفتنِ طبقهٔ مرجع: دیدنِ غیرسیاهِ غیرکلاغ بسیار ارزان است چون تقریباً همهٔ جهان غیرکلاغ است."],"check":{"q":"آیا پیدا کردنِ کفشِ سفید «همهٔ کلاغ‌ها سیاه‌اند» را تأیید می‌کند؟","a":"در بسیاری از روایت‌های بیزی، از نظر فنی بله اما به مقداری تقریباً صفر. درسِ مهم این است که تأییدِ منطقی الزاماً وزنِ شاهدیِ عملی ندارد."}}},"realism":{"en":{"line":"Scientific realism says successful mature theories are at least approximately true about both observables and unobservables; anti-realism resists that extra ontological commitment.","why":"<p>The dispute decides what scientific success entitles us to believe. Realists use novel prediction, explanation, and intervention to argue that electrons, genes, fields, or latent mechanisms are not merely useful fictions. Anti-realists point to underdetermination and historical theory change to argue that empirical success can be retained without literal belief in the full ontology.</p>","origin":"A central modern philosophy-of-science debate associated with Hilary Putnam’s no-miracles argument, Bas van Fraassen’s constructive empiricism, and Larry Laudan’s pessimistic historical challenge. Contemporary positions include entity realism, structural realism, and selective realism.","obj":[["The pessimistic meta-induction shows successful theories have repeatedly turned out false.","Realists respond selectively: the components responsible for novel predictive success are often retained even when surrounding ontology changes. Anti-realists ask for a non-retrospective rule for identifying those components."],["Underdetermination means multiple incompatible theories can fit all available evidence.","Realists appeal to explanatory virtues, intervention, cross-domain integration, and future novel tests. Critics reply that those virtues may guide choice without guaranteeing truth."]],"confuse":[["Scientific realism vs. metaphysical realism in general","Scientific realism is specifically about what successful scientific theories warrant regarding their posited entities and structures."],["Anti-realism vs. denial of science","Anti-realists can fully accept scientific methods, predictions, and empirical findings while withholding belief in unobservable ontology."]],"mistakes":["Treating predictive success as automatically proving every internal component of a model literally real.","Assuming anti-realists must think theories are arbitrary or equally good if they fit current data."],"check":{"q":"A model predicts extremely well out of sample. What extra step does a realist take that a constructive empiricist need not?","a":"The realist treats that success as evidence that at least some unobservable structure posited by the model is approximately true; the constructive empiricist can accept the predictions while remaining agnostic about that ontology."}},"fa":{"line":"واقع‌گراییِ علمی می‌گوید نظریه‌های بالغِ موفق دست‌کم تقریباً دربارهٔ امورِ مشاهده‌پذیر و مشاهده‌ناپذیر صادق‌اند؛ ضدواقع‌گرایی در برابرِ این تعهدِ هستی‌شناختیِ اضافه مقاومت می‌کند.","why":"<p>نزاع تعیین می‌کند موفقیتِ علم چه باوری را مجاز می‌کند. واقع‌گرا از پیش‌بینیِ تازه، تبیین و مداخله نتیجه می‌گیرد الکترون، ژن، میدان یا سازوکار صرفاً افسانهٔ مفید نیست. ضدواقع‌گرا از تعیّن‌ناقص و تاریخِ تغییرِ نظریه می‌گوید موفقیتِ تجربی بدون باورِ لفظی به تمامِ هستی‌شناسی قابل‌حفظ است.</p>","origin":"نزاعِ مدرن با استدلالِ بدونِ معجزهٔ هیلاری پاتنم، تجربه‌گراییِ سازندهٔ بس ون فراسن و چالشِ تاریخیِ لری لاودن پیوند دارد. مواضعِ جدید شامل واقع‌گراییِ ساختاری، موجودیتی و گزینشی‌اند.","obj":[["فرااستقرای بدبینانه نشان می‌دهد نظریه‌های موفق بارها کاذب از آب درآمده‌اند.","واقع‌گرا به‌صورتِ گزینشی پاسخ می‌دهد: اجزای مسئولِ پیش‌بینیِ تازه اغلب در تغییرِ نظریه حفظ می‌شوند. ضدواقع‌گرا قاعده‌ای غیرپسینی برای شناساییِ آن اجزا می‌خواهد."],["تعیّن‌ناقص یعنی چند نظریهٔ ناسازگار می‌توانند با تمامِ شواهد جور باشند.","واقع‌گرا به فضیلتِ تبیینی، مداخله، یکپارچگیِ بینِ حوزه‌ها و آزمونِ تازه تکیه می‌کند. منتقد می‌گوید این‌ها شاید انتخاب را راهنمایی کنند اما صدق را تضمین نمی‌کنند."]],"confuse":[["واقع‌گراییِ علمی و واقع‌گراییِ متافیزیکی به‌طور کلی","اولی مشخصاً دربارهٔ تعهدی است که نظریهٔ علمیِ موفق نسبت به موجودات و ساختارهایش مجاز می‌کند."],["ضدواقع‌گرایی و انکارِ علم","ضدواقع‌گرا می‌تواند روش، پیش‌بینی و یافتهٔ تجربی را کاملاً بپذیرد و فقط از باور به هستی‌شناسیِ مشاهده‌ناپذیر خودداری کند."]],"mistakes":["برداشتِ موفقیتِ پیش‌بینی به‌عنوان اثباتِ اینکه هر جزءِ درونیِ مدل عیناً واقعی است.","فرضِ اینکه ضدواقع‌گرا نظریه‌ها را دلبخواهی یا همهٔ مدل‌های هم‌برازنده را برابر می‌داند."],"check":{"q":"مدلی بیرون از نمونه بسیار خوب پیش‌بینی می‌کند. واقع‌گرا چه گامِ اضافه‌ای برمی‌دارد که تجربه‌گرای سازنده لازم نیست؟","a":"واقع‌گرا موفقیت را شاهدِ صدقِ تقریبیِ بخشی از ساختارِ مشاهده‌ناپذیرِ مدل می‌گیرد؛ تجربه‌گرای سازنده می‌تواند پیش‌بینی را بپذیرد و دربارهٔ هستی‌شناسی تعلیق کند."}}},"miracle":{"en":{"line":"The no-miracles argument says the best explanation of sustained novel predictive success is that successful scientific theories are at least approximately true.","why":"<p>Realists argue that if a theory’s hidden structure bore no relation to reality, repeated precise success—especially on phenomena not used to construct it—would be an astonishing coincidence. Approximate truth is offered as the explanation that makes scientific success unsurprising.</p>","origin":"Often associated with Hilary Putnam’s formulation that realism is the only philosophy that does not make the success of science a miracle, though related arguments predate him. It is an abductive argument: realism is presented as the best explanation of success, not a deductive proof.","obj":[["Pessimistic meta-induction: past false theories were also successful, so success cannot imply approximate truth.","Selective realists respond that the success-producing structure often survives theory change. The debate then moves to whether those preserved elements can be identified without hindsight."],["Selection effects explain success: unsuccessful theories disappear, so of course surviving theories look impressive.","Realists answer that selection alone does not explain why a theory makes genuinely novel, quantitatively precise predictions. Anti-realists dispute how much explanatory work approximate truth adds beyond empirical adaptation."]],"confuse":[["No-miracles argument vs. proof by success","It is inference to the best explanation, not the fallacy “it works, therefore every part is true.”"],["Approximate truth vs. exact truth","Realists can expect idealizations and false details while claiming that key structure or mechanisms are sufficiently right to explain success."]],"mistakes":["Using in-sample fit as the sort of surprising success the argument needs.","Ignoring the possibility that several incompatible models achieve the same success, weakening the abductive inference."],"check":{"q":"Which kind of empirical success gives the no-miracles argument its strongest force?","a":"Novel, risky, precise success on phenomena not used to build or tune the theory—especially when rival theories did not predict the same outcome."}},"fa":{"line":"استدلالِ «بدونِ معجزه» می‌گوید بهترین تبیینِ موفقیتِ پایدار و تازهٔ نظریه‌های علمی این است که آن‌ها دست‌کم تقریباً صادق‌اند.","why":"<p>واقع‌گرا می‌گوید اگر ساختارِ پنهانِ نظریه هیچ نسبتی با واقعیت نداشت، موفقیتِ دقیق و تکرارشونده—به‌ویژه دربارهٔ پدیده‌ای که برای ساختِ نظریه استفاده نشده—تصادفی شگفت‌آور بود. صدقِ تقریبی تبیینی است که موفقیت را غیرمعجزه‌آسا می‌کند.</p>","origin":"اغلب با صورت‌بندیِ هیلاری پاتنم پیوند دارد که واقع‌گرایی را فلسفه‌ای می‌دانست که موفقیتِ علم را معجزه نمی‌کند، هرچند استدلال‌های مشابه قدیمی‌ترند. ساختارش استنتاج به بهترین تبیین است، نه برهانِ قیاسی.","obj":[["فرااستقرای بدبینانه: نظریه‌های کاذبِ گذشته هم موفق بودند، پس موفقیت صدقِ تقریبی را نشان نمی‌دهد.","واقع‌گرای گزینشی می‌گوید ساختارِ مسئولِ موفقیت اغلب در تغییرِ نظریه باقی می‌ماند. نزاع به این منتقل می‌شود که آیا بدونِ پس‌نگری می‌توان آن اجزا را شناخت."],["اثرِ انتخاب موفقیت را توضیح می‌دهد: نظریهٔ ناموفق حذف می‌شود، پس بازمانده‌ها طبیعی است موفق به‌نظر برسند.","واقع‌گرا می‌گوید انتخاب به‌تنهایی پیش‌بینیِ تازه و کمّیِ دقیق را توضیح نمی‌دهد. ضدواقع‌گرا دربارهٔ میزانِ ارزشِ تبیینیِ صدقِ تقریبی اختلاف دارد."]],"confuse":[["استدلالِ بدونِ معجزه و «کار می‌کند پس صادق است»","این استنتاج به بهترین تبیین است، نه اثباتِ اینکه هر جزءِ نظریه به‌سببِ موفقیت صادق است."],["صدقِ تقریبی و صدقِ کامل","واقع‌گرا می‌تواند ایده‌آل‌سازی و جزئیاتِ کاذب را بپذیرد و بگوید ساختارِ کلیدی به‌اندازهٔ کافی درست است که موفقیت را توضیح دهد."]],"mistakes":["استفاده از برازشِ درون‌نمونه به‌عنوان نوعِ موفقیتِ شگفت‌انگیزی که استدلال نیاز دارد.","نادیده‌گرفتنِ اینکه چند مدلِ ناسازگار ممکن است همان موفقیت را داشته باشند و استنتاجِ تبیینی را ضعیف کنند."],"check":{"q":"کدام نوعِ موفقیتِ تجربی قوی‌ترین نیرو را به استدلالِ بدونِ معجزه می‌دهد؟","a":"موفقیتِ تازه، پرخطر و دقیق دربارهٔ پدیده‌ای که برای ساخت یا تنظیمِ نظریه به کار نرفته، به‌ویژه وقتی رقیبان همان را پیش‌بینی نکرده‌اند."}}},"risky":{"en":{"line":"A risky prediction is one a theory could easily have failed: it forbids a narrow set of outcomes rather than accommodating almost anything after the fact.","why":"<p>Evidence is more informative when the observed outcome would have been surprising under the theory’s rivals or when the theory exposed itself to genuine failure. Popper emphasizes risk because flexible theories can accumulate apparent confirmations cheaply. Specificity, pre-specification, and low probability of success by chance make a passed test epistemically valuable.</p>","origin":"Central to Karl Popper’s falsificationist picture and his admiration for Einstein’s eclipse prediction. The notion later connects naturally to likelihood ratios, severity, pre-registration, and Lakatos’s requirement of novel predictions.","obj":[["A prediction can be precise but not risky if everyone already expected it.","Correct. Precision alone is insufficient. Risk is contrastive: the theory must have excluded plausible outcomes or differed from serious alternatives before the result was known."],["Highly risky predictions may be reckless rather than scientifically virtuous.","Risk is epistemically valuable when derived from a serious theory, not as arbitrary long-shot guessing. A lottery win is surprising but does not validate a theory that predicted it without mechanism or repeatable structure."]],"confuse":[["Risky prediction vs. low-probability event","Risk concerns exposure of the theory to failure relative to alternatives, not merely that the observed event was rare in isolation."],["Prediction vs. retrodiction","Explaining a known fact can test constraints, but it is usually less risky because model construction may have been influenced by the fact already known."]],"mistakes":["Calling any exact numerical forecast “risky” without asking whether rival models made the same forecast.","Counting post-hoc accommodated facts as though they were pre-specified risks."],"check":{"q":"Model A predicts GDP growth between 1.9–2.1%; Model B predicts “between −2% and 6%.” Growth is 2.0%. Which passed the riskier test?","a":"Model A, assuming the narrow interval was specified in advance and credible rivals allowed wider outcomes. Its success excludes far more possibilities."}},"fa":{"line":"پیش‌بینیِ پرخطر پیش‌بینی‌ای است که نظریه به‌آسانی می‌توانست در آن شکست بخورد: دامنهٔ باریکی از نتایج را مجاز می‌کند، نه اینکه تقریباً هر نتیجه‌ای را پس از واقعه در خود جا دهد.","why":"<p>شاهد وقتی اطلاعاتی‌تر است که نتیجه زیرِ رقیبان یا زیرِ شکستِ نظریه به‌آسانی انتظار نمی‌رفت. پوپر بر خطر تأکید می‌کند چون نظریهٔ انعطاف‌پذیر می‌تواند تأییدِ ظاهری را ارزان جمع کند. مشخص‌بودن، پیش‌ثبت و احتمالِ کمِ موفقیتِ تصادفی آزمون را ارزشمند می‌کنند.</p>","origin":"در تصویرِ ابطال‌گرایانهٔ کارل پوپر مرکزی است و با ستایشِ او از پیش‌بینیِ کسوفِ اینشتین پیوند دارد. بعدها به نسبتِ درست‌نمایی، شدتِ آزمون، پیش‌ثبت و پیش‌بینیِ تازهٔ لاکاتوش نزدیک می‌شود.","obj":[["پیش‌بینی می‌تواند دقیق باشد اما پرخطر نباشد اگر همه همان را انتظار داشته باشند.","درست. دقت کافی نیست. خطر مقایسه‌ای است: نظریه باید پیش از نتیجه پیامدهای ممکنِ جدی را منع کرده یا با رقیبان تفاوت داشته باشد."],["پیش‌بینیِ خیلی پرخطر ممکن است فقط بی‌پروا باشد نه علمی.","خطر وقتی ارزشِ معرفتی دارد که از نظریهٔ جدی بیاید، نه از حدسِ دور. برنده‌شدنِ بخت‌آزمایی شگفت‌انگیز است اما نظریه‌ای را که بی‌سازوکار آن را حدس زده معتبر نمی‌کند."]],"confuse":[["پیش‌بینیِ پرخطر و رویدادِ کم‌احتمال","خطر دربارهٔ در معرضِ شکست بودنِ نظریه نسبت به بدیل‌هاست، نه فقط نادر بودنِ خودِ رویداد."],["پیش‌بینی و پس‌تبیین","توضیحِ واقعیتِ از پیش معلوم ممکن است محدودیت ایجاد کند، اما معمولاً خطرِ کمتری دارد چون ساختِ مدل از همان واقعیت اثر پذیرفته است."]],"mistakes":["پرخطر نامیدنِ هر پیش‌بینیِ عددیِ دقیق بدون پرسیدنِ اینکه رقیبان چه می‌گفتند.","شمردنِ واقعیت‌های جذب‌شده پس از واقعه به‌عنوان خطرهای پیشاپیش."],"check":{"q":"مدل A رشد را ۱.۹ تا ۲.۱٪ و مدل B بین −۲ تا ۶٪ پیش‌بینی می‌کند. رشد ۲٪ می‌شود. کدام آزمون پرخطرتر را پشت سر گذاشت؟","a":"مدل A، اگر بازهٔ باریک از پیش تعیین شده و بدیل‌های جدی دامنهٔ وسیع‌تری داده باشند. موفقیتِ آن امکان‌های بسیار بیشتری را منع کرده بود."}}},"values":{"en":{"line":"Because evidence rarely entails a hypothesis with certainty, deciding when evidence is “enough” depends partly on the consequences of error—and therefore on values.","why":"<p>Rudner’s point is not that facts are political. It is that acceptance under uncertainty embeds a loss function. False positives and false negatives have different costs, so choosing a threshold cannot be determined by likelihood alone. Heather Douglas’s work on inductive risk develops how social and ethical values legitimately enter decisions about evidential standards without dictating the evidence itself.</p>","origin":"Richard Rudner’s 1953 argument “The Scientist Qua Scientist Makes Value Judgments” challenged value-free ideals of hypothesis acceptance. Heather Douglas later developed the concept of inductive risk and distinctions between direct and indirect roles for values in science.","obj":[["Allowing values into science invites political manipulation of results.","The reply is to distinguish roles. Values should not make evidence count as something it is not, but they can legitimately influence how much evidence is required before acting or accepting a claim when errors have asymmetric consequences."],["Scientists should report probabilities and let policymakers choose thresholds.","Often that separation is desirable, but analysts still make upstream choices—measurement, model, significance, classification, missing-data treatment—that embed judgments about error. The goal is transparency and appropriate allocation of responsibility, not pretending judgment vanished."]],"confuse":[["Values in science vs. fabricating facts","Acknowledging inductive risk does not license changing data or likelihoods to fit preferences. It concerns decisions under residual uncertainty."],["Epistemic values vs. social values","Simplicity, explanatory power, and coherence are often called epistemic values; safety, equity, and cost are social/ethical values. Their roles need not be identical."]],"mistakes":["Treating α=0.05 or another threshold as if mathematics itself selected it.","Hiding consequential value judgments inside “technical” defaults where decision-makers cannot see or contest them."],"check":{"q":"Two regulators agree on the evidence but choose different evidentiary thresholds because one prioritizes avoiding false negatives and the other false positives. Is that necessarily scientific disagreement?","a":"No. It may be a disagreement about inductive risk and the relative costs of error. The scientific evidence can be shared while the acceptance threshold reflects different values."}},"fa":{"line":"چون شواهد به‌ندرت فرضیه را با یقین نتیجه می‌دهند، تصمیم دربارهٔ اینکه شواهد چه زمانی «کافی» است تا حدی به پیامدِ خطا وابسته است—و بنابراین به ارزش‌ها.","why":"<p>نکتهٔ رودن این نیست که واقعیت سیاسی است. پذیرشِ ادعا زیرِ عدمِ‌قطعیت تابعِ زیان دارد. مثبتِ کاذب و منفیِ کاذب هزینهٔ متفاوت دارند، پس آستانه فقط از درست‌نمایی بیرون نمی‌آید. کارِ هدر داگلاس دربارهٔ ریسکِ استقرایی توضیح می‌دهد ارزشِ اجتماعی کجا می‌تواند مشروعاً بر استانداردِ شاهد اثر بگذارد بدون اینکه خودِ شاهد را جعل کند.</p>","origin":"مقالهٔ ریچارد رودن در ۱۹۵۳، «دانشمند در مقامِ دانشمند داوریِ ارزشی می‌کند»، ایدهٔ علمِ کاملاً بی‌ارزش را به چالش کشید. هدر داگلاس بعدتر ریسکِ استقرایی و نقش‌های مستقیم و غیرمستقیمِ ارزش در علم را بسط داد.","obj":[["واردکردنِ ارزش به علم در را به دستکاریِ سیاسیِ نتیجه باز می‌کند.","پاسخ، تفکیکِ نقش‌هاست. ارزش نباید باعث شود شاهد چیزی حساب شود که نیست، اما می‌تواند وقتی خطا پیامدِ نامتقارن دارد مقدارِ شاهدِ لازم برای عمل یا پذیرش را تعیین کند."],["دانشمند باید احتمال را گزارش کند و سیاست‌گذار آستانه را انتخاب کند.","این جدایی اغلب مفید است، اما تحلیلگر از قبل انتخاب‌های سنجش، مدل، معناداری، طبقه‌بندی و دادهٔ گمشده دارد که داوریِ خطا در آن‌هاست. هدف شفافیت و تخصیصِ درستِ مسئولیت است."]],"confuse":[["ارزش در علم و جعلِ واقعیت","پذیرشِ ریسکِ استقرایی مجوزِ تغییرِ داده یا درست‌نمایی مطابقِ ترجیح نیست؛ دربارهٔ تصمیم زیرِ عدمِ‌قطعیتِ باقی‌مانده است."],["ارزشِ معرفتی و ارزشِ اجتماعی","سادگی، قدرتِ تبیین و انسجام را اغلب ارزشِ معرفتی می‌نامند؛ ایمنی، عدالت و هزینه ارزشِ اجتماعی/اخلاقی‌اند. نقش‌هایشان یکی نیست."]],"mistakes":["رفتار با α=0.05 یا آستانهٔ دیگر گویی خودِ ریاضیات آن را انتخاب کرده است.","پنهان‌کردنِ داوریِ ارزشیِ پیامدی در پیش‌فرض‌های «فنی» که تصم
