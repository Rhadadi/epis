en:"<p>Reasoning bent by what you want to be true, or by what your group membership commits you to. Distinct from confirmation bias: the distortion serves a goal, not merely a prior.</p>",
fa:"<p>استدلالی که با آنچه می‌خواهید صادق باشد، یا با آنچه عضویتِ گروهی‌تان ایجاب می‌کند، خم می‌شود. با سوگیریِ تأییدی فرق دارد: این تحریف در خدمتِ یک هدف است، نه صرفاً یک باورِ پیشین.</p>",
xe:"Kahan's finding: on politicised questions, more numerate people are more polarised, not less. The skill serves the motive.",
xf:"یافتهٔ کاهان: در پرسش‌های سیاسی‌شده، افرادِ عددفهم‌تر قطبی‌ترند، نه کمتر. مهارت در خدمتِ انگیزه قرار می‌گیرد.",
pe:"Why expertise does not protect against bias where identity is at stake — it makes it worse, by supplying better tools for reaching the preferred conclusion.",
pf:"به همین دلیل تخصص در جایی که هویت در میان است از سوگیری محافظت نمی‌کند — بدترش می‌کند، چون ابزارِ بهتری برای رسیدن به نتیجهٔ دلخواه فراهم می‌آورد.",c:[]},

ecolog:{L:1,t:"Ecological rationality",tf:"عقلانیتِ بوم‌شناختی",w:"Gerd Gigerenzer",q:"ecological rationality Gigerenzer fast frugal heuristics",
en:"<p>Gigerenzer's challenge to the heuristics-and-biases programme. Heuristics are not defective shortcuts measured against a logical ideal; they are adaptations fitted to particular environments. Judged against the right benchmark — performance in the world rather than conformity to a formal rule — they often beat optimisation.</p><p>Many celebrated “biases” also turn out to be artefacts of how the question was posed. Present the same problem in natural frequencies rather than probabilities and the error rate collapses.</p>",
fa:"<p>چالشِ گیگرنزر در برابر برنامهٔ «ابتکارها و سوگیری‌ها». ابتکارها میان‌برهای معیوبی نیستند که با آرمانی منطقی سنجیده شوند؛ سازگاری‌هایی‌اند متناسب با محیط‌های خاص. اگر با معیارِ درست سنجیده شوند — عملکرد در جهان، نه انطباق با قاعده‌ای صوری — اغلب از بهینه‌سازی بهتر عمل می‌کنند.</p><p>بسیاری از «سوگیری‌های» مشهور نیز محصولِ نحوهٔ طرحِ پرسش از آب درمی‌آیند. همان مسئله را به‌جای احتمال با بسامدهای طبیعی بیان کنید و نرخِ خطا فرومی‌ریزد.</p>",
xe:"“10 out of every 1,000 women” produces correct answers where “a 1% probability” produces confusion, in the same population.",
xf:"«۱۰ نفر از هر ۱۰۰۰ زن» پاسخ‌های درست می‌دهد آنجا که «احتمالِ ۱ درصد» سردرگمی می‌سازد، در همان جمعیت.",
pe:"Before calling a judgment biased, check the benchmark and check the format. Many apparent errors are properties of the question rather than of the person answering it.",
pf:"پیش از آنکه داوری‌ای را سوگیرانه بنامید، معیار و قالبِ پرسش را وارسی کنید. بسیاری از خطاهای ظاهری، ویژگیِ پرسش‌اند نه پاسخ‌دهنده.",c:[]},

argth:{t:"The argumentative theory of reason",tf:"نظریهٔ استدلالیِ عقل",w:"Hugo Mercier & Dan Sperber",q:"argumentative theory of reasoning Mercier Sperber",
en:"<p>Reason did not evolve to help a solitary thinker find truth. It evolved to produce arguments that persuade others and to evaluate the arguments others produce. On that account, confirmation bias is not a bug — it is the design working as intended.</p>",
fa:"<p>عقل برای کمک به اندیشمندی تنها در یافتنِ حقیقت تکامل نیافت. برای ساختنِ استدلال‌هایی که دیگران را قانع کند و ارزیابیِ استدلال‌هایی که دیگران می‌سازند تکامل یافت. بر این روایت، سوگیریِ تأییدی نقص نیست — طراحی است که چنان‌که باید کار می‌کند.</p>",
xe:"People reason poorly alone and markedly better in groups where real disagreement is present.",
xf:"مردم به‌تنهایی بد استدلال می‌کنند و در گروه‌هایی که اختلافِ واقعی هست به‌مراتب بهتر.",
pe:"A structural prescription: stop trying to debias individuals and build adversarial review instead. The design should supply the disagreement that reasoning needs to work.",
pf:"نسخه‌ای ساختاری: از تلاش برای رفعِ سوگیریِ افراد دست بکشید و به‌جایش بازبینیِ تخاصمی بسازید. طراحی باید اختلافی را فراهم کند که استدلال برای کارکردن به آن نیاز دارد.",c:[]},

blind:{t:"The bias blind spot",tf:"نقطهٔ کورِ سوگیری",w:"Emily Pronin",q:"bias blind spot Pronin",
en:"<p>People readily recognise bias in others and reliably fail to see it in themselves — including immediately after being taught the list of biases.</p>",
fa:"<p>مردم سوگیری را در دیگران به‌آسانی تشخیص می‌دهند و در خود به‌طور قابل‌اتکایی نمی‌بینند — از جمله بلافاصله پس از آموختنِ فهرستِ سوگیری‌ها.</p>",
xe:"Learning this material mostly improves your detection of other people's errors. That is the finding, and it applies to you reading it now.",
xf:"آموختنِ این مطالب بیشتر تشخیصِ خطاهای دیگران را بهتر می‌کند. یافته همین است و بر شما که اکنون آن را می‌خوانید نیز صدق می‌کند.",
pe:"Why awareness training underperforms and process changes work. Design the checks into the workflow, not into the good intentions.",
pf:"به همین دلیل آموزشِ آگاهی‌بخش کم‌اثر است و تغییرِ فرایند مؤثر. بازبینی‌ها را در گردشِ کار طراحی کنید، نه در حسنِ نیت.",c:[]},

virtue:{L:1,t:"Virtue epistemology",tf:"معرفت‌شناسیِ فضیلت",w:"Zagzebski · Sosa · Cassam",q:"virtue epistemology intellectual virtue",
en:"<p>Reverse the order of analysis. Instead of assessing beliefs and then asking what kind of person produces good ones, start with the person: their stable dispositions of inquiry, good and bad. Careful attention is a virtue; jumping to conclusions is a vice. Only then assess the beliefs those dispositions produce.</p><p>The practical consequence is a shift from auditing outputs to auditing habits — which is the only thing that generalises to the next problem.</p>",
fa:"<p>ترتیبِ تحلیل را وارونه کنید. به‌جای ارزیابیِ باورها و سپس پرسیدنِ اینکه چه‌گونه آدمی باورهای خوب می‌سازد، از خودِ شخص آغاز کنید: خُلق‌وخوی‌های پایدارِ او در پژوهش، چه خوب و چه بد. دقتِ صبورانه فضیلت است؛ شتاب در نتیجه‌گیری رذیلت. تنها آنگاه باورهایی را که این خُلقیات می‌سازند ارزیابی کنید.</p><p>پیامدِ عملی، گذر از بازرسیِ خروجی‌ها به بازرسیِ عادت‌هاست — و تنها همین است که به مسئلهٔ بعدی تعمیم می‌یابد.</p>",
xe:"Assess the inquirer's habits before assessing the conclusion. A good conclusion from bad habits will not repeat.",
xf:"پیش از ارزیابیِ نتیجه، عادت‌های پژوهنده را ارزیابی کنید. نتیجهٔ خوب از عادت‌های بد تکرار نخواهد شد.",
pe:"Shifts review from output to process. In practice: hire and promote for these dispositions rather than for the record, because the record is partly luck.",
pf:"بازبینی را از خروجی به فرایند می‌برد. در عمل: بر پایهٔ همین خُلقیات استخدام و ارتقا دهید نه بر پایهٔ کارنامه، چون کارنامه تا حدی اقبال است.",
c:["ivirt","ivice","scout","clifford","bs","moral"]},

ivirt:{t:"Intellectual virtues",tf:"فضایلِ عقلانی",w:"Linda Zagzebski",q:"intellectual virtues humility courage",
en:"<p>Stable dispositions that make you a better knower: humility, courage, honesty, thoroughness, perseverance, autonomy, open-mindedness.</p>",
fa:"<p>خُلق‌وخوی‌های پایداری که شما را داننده‌ای بهتر می‌کنند: فروتنی، شجاعت، صداقت، دقت، پشتکار، استقلال و گشودگی.</p>",
xe:"Intellectual humility is calibrated confidence, not diffidence. It is compatible with strong claims strongly defended.",
xf:"فروتنیِ عقلانی یعنی اطمینانِ کالیبره، نه کم‌رویی. با ادعاهای قوی و دفاعِ محکم سازگار است.",
pe:"A concrete list to assess yourself and colleagues against — considerably more actionable than telling people to be objective.",
pf:"فهرستی مشخص برای سنجشِ خود و همکاران — به‌مراتب عملی‌تر از اینکه به مردم بگوییم بی‌طرف باشند.",c:[]},

ivice:{t:"Epistemic vices",tf:"رذایلِ معرفتی",w:"Quassim Cassam",q:"epistemic vices dogmatism closed mindedness",
en:"<p>Dispositions that systematically obstruct knowledge: dogmatism, closed-mindedness, gullibility, wishful thinking, intellectual cowardice, arrogance.</p>",
fa:"<p>خُلقیاتی که نظام‌مند مانعِ معرفت می‌شوند: جزم‌اندیشی، بسته‌ذهنی، زودباوری، آرزواندیشی، بزدلیِ عقلانی و تکبر.</p>",
xe:"Cassam analyses real intelligence and policy failures as vice rather than error — the individual steps were competent and the posture was wrong.",
xf:"کسم شکست‌های واقعیِ اطلاعاتی و سیاستی را رذیلت می‌داند نه خطا — گام‌ها شایسته بودند و موضع نادرست.",
pe:"Names the failure mode nobody can find in a process review, because it is not in any single step.",
pf:"شکستی را نام می‌گذارد که هیچ بازبینیِ فرایندی نمی‌یابدش، چون در هیچ گامِ واحدی نیست.",c:[]},

scout:{L:1,t:"Scout vs soldier mindset",tf:"ذهنیتِ دیده‌بان در برابر سرباز",w:"Julia Galef",q:"scout mindset Galef motivated reasoning",
en:"<p>The soldier's job is to defend territory: to attack opposing claims and protect one's own. The scout's job is to make an accurate map: to find out what is actually there, whether or not the news is welcome.</p><p>Both are reasoning. The difference is what they are for. Galef's argument is that most of us default to soldier mode without noticing, and that the switch is trainable.</p>",
fa:"<p>وظیفهٔ سرباز دفاع از قلمرو است: حمله به ادعاهای مخالف و حفاظت از ادعای خود. وظیفهٔ دیده‌بان کشیدنِ نقشه‌ای دقیق است: فهمیدنِ اینکه واقعاً چه چیزی آنجاست، چه خبر خوش باشد چه نباشد.</p><p>هر دو استدلال‌اند. تفاوت در هدف است. استدلالِ گیلف این است که بیشترِ ما بی‌آنکه بدانیم به‌طور پیش‌فرض در حالتِ سرباز هستیم، و این کلید قابل آموزش است.</p>",
xe:"A scout wants an accurate map even when the accurate map says the position is bad.",
xf:"دیده‌بان نقشهٔ دقیق می‌خواهد، حتی وقتی نقشهٔ دقیق می‌گوید موقعیت بد است.",
pe:"The single best diagnostic in this whole map, and it takes one second: when you turn out to be wrong, does it feel like losing? If yes, you were in soldier mode.",
pf:"بهترین ابزارِ تشخیصِ این نقشه و تنها یک ثانیه وقت می‌گیرد: وقتی معلوم می‌شود اشتباه کرده‌اید، آیا حسِ باختن دارید؟ اگر بله، در حالتِ سرباز بوده‌اید.",c:[]},

clifford:{L:1,t:"The ethics of belief",tf:"اخلاقِ باور",w:"W.K. Clifford vs William James",q:"ethics of belief Clifford James will to believe",
en:"<p>Clifford's rule is uncompromising: it is wrong always, everywhere, and for anyone to believe anything upon insufficient evidence. His case is a shipowner who talks himself into believing his vessel seaworthy. The ship sinks. Clifford's point is that the owner was culpable <b>before</b> it sank — the wrong was in the believing.</p><p>James replies that for a certain class of choices — live, forced, and momentous, where the evidence cannot decide and not choosing is itself a choice — Clifford's rule is not cautious but paralysing.</p>",
fa:"<p>قاعدهٔ کلیفورد سازش‌ناپذیر است: همیشه، همه‌جا و برای هر کس نادرست است که چیزی را بر پایهٔ شواهدِ ناکافی باور کند. مثالِ او صاحبِ کشتی‌ای است که خود را قانع می‌کند کشتی دریانورد است. کشتی غرق می‌شود. نکتهٔ کلیفورد این است که صاحبِ کشتی <b>پیش از</b> غرق‌شدن مقصر بود — گناه در خودِ باورکردن بود.</p><p>جیمز پاسخ می‌دهد که برای دسته‌ای از انتخاب‌ها — زنده، ناگزیر و سرنوشت‌ساز، آنجا که شواهد نمی‌تواند تصمیم بگیرد و انتخاب‌نکردن خود یک انتخاب است — قاعدهٔ کلیفورد نه محتاطانه بلکه فلج‌کننده است.</p>",
xe:"You must decide now, the evidence is genuinely indecisive, and declining to decide has consequences of its own. Clifford says withhold; James says that is not available.",
xf:"باید همین حالا تصمیم بگیرید، شواهد واقعاً بی‌طرف است و تصمیم‌نگرفتن خود پیامد دارد. کلیفورد می‌گوید تعلیق کنید؛ جیمز می‌گوید این گزینه در دسترس نیست.",
pe:"Generalises far beyond religion. It is the exact structure of every decision that must be made under irreducible uncertainty on a deadline — which is most of them.",
pf:"بسیار فراتر از دین تعمیم می‌یابد. ساختارِ دقیقِ هر تصمیمی است که باید زیر عدمِ‌قطعیتِ کاهش‌ناپذیر و در مهلتی معین گرفته شود — یعنی بیشترِ تصمیم‌ها.",
k:["relig","evidfid"],c:[]},

bs:{t:"Bullshit vs lying",tf:"یاوه در برابر دروغ",w:"Harry Frankfurt, On Bullshit",q:"Frankfurt on bullshit",
en:"<p>A liar knows the truth and conceals it — and therefore still respects it enough to track it. A bullshitter is <b>indifferent</b> to whether what he says is true. Frankfurt argues the second is the greater enemy of the epistemic commons.</p>",
fa:"<p>دروغ‌گو حقیقت را می‌داند و پنهانش می‌کند — و بنابراین دست‌کم آن‌قدر به آن احترام می‌گذارد که ردیابی‌اش کند. یاوه‌گو <b>بی‌تفاوت</b> است به اینکه آنچه می‌گوید صادق هست یا نه. فرانکفورت می‌گوید دومی دشمنِ بزرگ‌ترِ عرصهٔ عمومیِ معرفت است.</p>",
xe:"Text produced to sound authoritative, with no mechanism anywhere in its production for checking whether it is accurate.",
xf:"متنی که تولید شده تا معتبر به‌نظر برسد، بی‌آنکه در هیچ‌جای فرایندِ تولیدش سازوکاری برای بررسیِ درستی وجود داشته باشد.",
pe:"The precise word for a large share of professional communication, and a reason indifference to truth deserves harsher treatment than honest error.",
pf:"واژهٔ دقیق برای بخش بزرگی از ارتباطاتِ حرفه‌ای، و دلیلی بر اینکه بی‌تفاوتی به حقیقت سزاوارِ برخوردی سخت‌تر از خطای صادقانه است.",c:[]},

moral:{t:"Moral epistemology",tf:"معرفت‌شناسیِ اخلاق",w:"Rawls on reflective equilibrium · Mackie · Audi",q:"moral epistemology moral knowledge",
en:"<p>How can we know normative claims? By intuition, by a priori reasoning, by <b>reflective equilibrium</b> — adjusting principles and particular judgments against each other until they fit — or not at all, if there are no moral facts to know.</p>",
fa:"<p>ادعاهای هنجاری را چگونه می‌توان دانست؟ با شهود، با استدلالِ پیشین، با <b>تعادلِ تأملی</b> — تنظیمِ متقابلِ اصول و داوری‌های جزئی تا هم‌ساز شوند — یا اصلاً نه، اگر واقعیتِ اخلاقی‌ای برای دانستن وجود نداشته باشد.</p>",
xe:"Is “this rule is unfair” the kind of claim that can be true, or only the kind that can be shared?",
xf:"آیا «این قاعده ناعادلانه است» از آن دست ادعاهاست که می‌تواند صادق باشد، یا فقط از آن دست که می‌تواند مشترک باشد؟",
pe:"Every policy argument mixes empirical and normative claims. Separating them explicitly ends more disputes than any additional evidence does, because the parties usually agree on the facts.",
pf:"هر بحثِ سیاست‌گذاری ادعاهای تجربی و هنجاری را در هم می‌آمیزد. تفکیکِ صریحِ آن‌ها بیش از هر شاهدِ تازه‌ای اختلاف‌ها را پایان می‌دهد، چون معمولاً طرفین بر سرِ واقعیت‌ها توافق دارند.",c:[]},

logic:{L:1,t:"Logic and argumentation",tf:"منطق و استدلال‌ورزی",w:"Aristotle · Toulmin · Walton",q:"logic argumentation informal fallacies",
en:"<p>The machinery of inference, and the diagnostic vocabulary for what is going wrong in a conversation. Formal logic tells you what follows from what. Informal logic tells you why an argument that follows perfectly well can still be worthless — and why one that is technically invalid can still be persuasive and even reasonable.</p><p>For anyone who argues professionally this is the most immediately usable branch on the map.</p>",
fa:"<p>سازوکارِ استنتاج، و واژگانِ تشخیصی برای اینکه در یک گفت‌وگو چه چیزی خراب می‌شود. منطقِ صوری می‌گوید از چه چیزی چه نتیجه‌ای برمی‌آید. منطقِ غیرصوری می‌گوید چرا استدلالی که کاملاً درست نتیجه می‌دهد باز هم می‌تواند بی‌ارزش باشد — و چرا استدلالی که از نظر فنی نامعتبر است می‌تواند قانع‌کننده و حتی معقول باشد.</p><p>برای هر کسی که کارش استدلال است، این کاربردی‌ترین شاخهٔ نقشه است.</p>",
xe:"The question is rarely “is the conclusion true?” It is “does it follow, from what, and on what unstated principle?”",
xf:"پرسش به‌ندرت این است که «آیا نتیجه صادق است؟» بلکه این است که «آیا نتیجه می‌شود، از چه چیزی، و بر پایهٔ چه اصلِ ناگفته‌ای؟»",
pe:"Two weeks here will change how you sit in a meeting more than two months anywhere else on this map.",
pf:"دو هفته در این شاخه بیش از دو ماه در هر جای دیگرِ این نقشه، نحوهٔ حضورِ شما را در یک جلسه تغییر می‌دهد.",
c:["valid","modus","affirm","toulmin","straw","motte","equiv","authority","burden","steel"]},

valid:{t:"Validity vs soundness",tf:"اعتبار در برابر درستی",w:"Standard",q:"validity soundness argument",
en:"<p>An argument is <b>valid</b> if the conclusion follows from the premises. It is <b>sound</b> if it is valid and the premises are also true. Validity is about structure; soundness adds a claim about the world.</p>",
fa:"<p>استدلال <b>معتبر</b> است اگر نتیجه از مقدمات برآید. <b>درست</b> است اگر معتبر باشد و مقدمات هم صادق باشند. اعتبار دربارهٔ ساختار است؛ درستی ادعایی دربارهٔ جهان می‌افزاید.</p>",
xe:"Valid but unsound: all fish fly; salmon are fish; therefore salmon fly. The reasoning is impeccable.",
xf:"معتبر اما نادرست: همهٔ ماهی‌ها پرواز می‌کنند؛ آزاد ماهی است؛ پس آزاد پرواز می‌کند. استدلال بی‌عیب است.",
pe:"Separates two objections that usually get run together: “that doesn't follow” and “that isn't true”. Saying which one you mean saves ten minutes every time.",
pf:"دو اعتراضی را که معمولاً با هم قاطی می‌شوند جدا می‌کند: «این نتیجه نمی‌شود» و «این درست نیست». گفتنِ اینکه کدام را می‌گویید هر بار ده دقیقه صرفه‌جویی می‌کند.",c:[]},

modus:{t:"Modus ponens and tollens",tf:"وضعِ مقدم و رفعِ تالی",w:"Standard",q:"modus ponens modus tollens",
en:"<p><b>Ponens</b>: if P then Q; P; therefore Q. <b>Tollens</b>: if P then Q; not Q; therefore not P. Both are valid. Tollens is the logical form of falsification.</p>",
fa:"<p><b>وضعِ مقدم</b>: اگر پ آنگاه ق؛ پ؛ پس ق. <b>رفعِ تالی</b>: اگر پ آنگاه ق؛ نه‌ق؛ پس نه‌پ. هر دو معتبرند. رفعِ تالی صورتِ منطقیِ ابطال است.</p>",
xe:"If the theory holds we would observe X. We do not observe X. So the theory does not hold.",
xf:"اگر نظریه درست باشد، ایکس را مشاهده می‌کنیم. ایکس را مشاهده نمی‌کنیم. پس نظریه درست نیست.",
pe:"Popper's entire method is modus tollens applied to universal claims. Seeing that makes falsificationism look less like a philosophy and more like arithmetic.",
pf:"تمامِ روشِ پوپر همان رفعِ تالی است که بر ادعاهای کلی اعمال شده. دیدنِ این نکته، ابطال‌گرایی را کمتر شبیه فلسفه و بیشتر شبیه حساب می‌کند.",
k:["popper"],c:[]},

affirm:{L:1,t:"Affirming the consequent",tf:"وضعِ تالی",w:"Standard",q:"affirming the consequent fallacy",
en:"<p>If P then Q; Q; therefore P. This is invalid, and it is the single most common error in empirical reasoning — because it looks exactly like confirmation.</p><p>The reason it fails is that Q may follow from other things besides P. Observing Q raises P's probability only to the extent that Q is <b>less likely</b> under the alternatives.</p>",
fa:"<p>اگر پ آنگاه ق؛ ق؛ پس پ. این نامعتبر است، و رایج‌ترین خطای استدلالِ تجربی است — چون دقیقاً شبیه تأیید به‌نظر می‌رسد.</p><p>دلیلِ شکستش این است که ق ممکن است از چیزهایی جز پ هم برآید. مشاهدهٔ ق تنها به همان اندازه احتمالِ پ را بالا می‌برد که ق تحتِ بدیل‌ها <b>کم‌محتمل‌تر</b> باشد.</p>",
xe:"If the model is correct we would see this pattern. We see it. Therefore the model is correct. No — three rival models predict the same pattern.",
xf:"اگر مدل درست باشد این الگو را می‌بینیم. می‌بینیم. پس مدل درست است. نه — سه مدلِ رقیب همان الگو را پیش‌بینی می‌کنند.",
pe:"Every “the data is consistent with our hypothesis” claim commits this fallacy unless it also shows the data is inconsistent with the rivals. That is what a likelihood ratio measures.",
pf:"هر ادعای «داده با فرضیهٔ ما سازگار است» مرتکبِ این مغالطه می‌شود، مگر آنکه نشان دهد داده با بدیل‌ها ناسازگار است. نسبتِ درست‌نمایی دقیقاً همین را می‌سنجد.",
k:["lr"],c:[]},

toulmin:{L:1,t:"The Toulmin model",tf:"مدلِ تولمین",w:"Stephen Toulmin",q:"Toulmin model argument warrant",
en:"<p>Toulmin argued that real arguments have six parts, not two. The <b>claim</b>; the <b>grounds</b> offered for it; the <b>warrant</b>, which is the general principle licensing the move from grounds to claim; the <b>backing</b> supporting that warrant; a <b>qualifier</b> indicating strength; and the <b>rebuttal</b> conditions under which it would not hold.</p><p>The warrant is almost always left unstated, and it is almost always where the disagreement actually lives.</p>",
fa:"<p>تولمین استدلال کرد که استدلال‌های واقعی شش بخش دارند، نه دو. <b>ادعا</b>؛ <b>شواهدی</b> که برای آن ارائه می‌شود؛ <b>ضمانت</b>، یعنی اصلِ کلی‌ای که گذر از شواهد به ادعا را مجاز می‌کند؛ <b>پشتوانه‌ای</b> که آن ضمانت را تأیید می‌کند؛ <b>قید</b>ی که قوّت را نشان می‌دهد؛ و شرایطِ <b>نقض</b> که در آن‌ها برقرار نخواهد بود.</p><p>ضمانت تقریباً همیشه ناگفته می‌ماند، و تقریباً همیشه همان‌جاست که اختلاف واقعاً زندگی می‌کند.</p>",
xe:"Grounds: unemployment rose. Claim: the policy failed. Warrant: unemployment is the right measure of this policy's success. Nobody stated the warrant, and it is the only thing in dispute.",
xf:"شواهد: بیکاری بالا رفت. ادعا: سیاست شکست خورد. ضمانت: بیکاری سنجهٔ درستِ موفقیتِ این سیاست است. کسی ضمانت را نگفت، و تنها همان محلِ نزاع است.",
pe:"Diagram any stuck disagreement this way. Nine times out of ten the gap is an unstated warrant rather than the data, and naming it converts an argument into a question.",
pf:"هر اختلافِ بی‌فرجام را این‌گونه نمودار کنید. نُه بار از ده بار، شکاف یک ضمانتِ ناگفته است نه داده، و نام‌بردنِ آن، نزاع را به پرسش بدل می‌کند.",
k:["defeat"],c:[]},

straw:{t:"Straw man",tf:"مغالطهٔ پهلوانِ پنبه",w:"Standard",q:"straw man fallacy",
en:"<p>Refuting a weakened or distorted version of the opponent's position rather than the position they actually hold.</p>",
fa:"<p>ردکردنِ صورتی تضعیف‌شده یا تحریف‌شده از موضعِ حریف، به‌جای موضعی که او واقعاً دارد.</p>",
xe:"“You want more oversight” becomes “you want to shut the industry down”.",
xf:"«شما نظارتِ بیشتر می‌خواهید» تبدیل می‌شود به «شما می‌خواهید این صنعت را تعطیل کنید».",
pe:"The remedy is procedural: restate their view until they agree you have it, and only then object. It costs thirty seconds and removes the most common way of being right and ineffective.",
pf:"راه‌حل رویه‌ای است: دیدگاهشان را بازگو کنید تا تأیید کنند درست فهمیده‌اید، و تنها آنگاه اعتراض کنید. سی ثانیه هزینه دارد و رایج‌ترین شیوهٔ «درست‌بودن و بی‌اثر ماندن» را حذف می‌کند.",c:[]},

motte:{L:1,t:"Motte-and-bailey",tf:"مغالطهٔ دژ و کشتزار",w:"Nicholas Shackel",q:"motte and bailey fallacy Shackel",
en:"<p>Named after a medieval fortification: a comfortable but indefensible field (the bailey) beside a fortified mound (the motte) you retreat into when attacked.</p><p>The move: advance a strong, interesting, contestable claim. When challenged, retreat to a weak, obvious, unobjectionable version and defend that. Once the challenge passes, resume operating on the strong claim as though it had been established.</p>",
fa:"<p>نام‌گرفته از استحکاماتِ سده‌های میانه: کشتزاری راحت اما غیرقابل دفاع (بِیلی) در کنارِ تپه‌ای مستحکم (مات) که هنگام حمله به آن پناه می‌برید.</p><p>حرکت: ادعایی قوی، جذاب و مناقشه‌برانگیز مطرح کنید. وقتی به چالش کشیده شدید، به صورتی ضعیف، بدیهی و بی‌اعتراض عقب‌نشینی کنید و از آن دفاع کنید. همین‌که چالش گذشت، دوباره بر پایهٔ ادعای قوی عمل کنید، چنان‌که گویی اثبات شده است.</p>",
xe:"“X is entirely socially constructed” → challenged → “I only mean context matters” → agreed → and later the strong claim is back in use.",
xf:"«ایکس یکسره برساختهٔ اجتماعی است» ← به چالش کشیده می‌شود ← «فقط منظورم این است که بافت اهمیت دارد» ← پذیرفته می‌شود ← و بعدتر ادعای قوی دوباره به‌کار می‌رود.",
pe:"Underrated and extremely common in policy debate. The counter is to pin the claim down in writing: which version is being defended, and does the policy conclusion follow from the weak one?",
pf:"کم‌بها داده‌شده و در بحث‌های سیاست‌گذاری بسیار رایج. راهِ مقابله، مکتوب‌کردنِ ادعاست: کدام صورت در حال دفاع است، و آیا نتیجهٔ سیاستی از صورتِ ضعیف برمی‌آید؟",c:[]},

equiv:{t:"Equivocation",tf:"مغالطهٔ اشتراکِ لفظ",w:"Standard",q:"equivocation fallacy ambiguity",
en:"<p>Using a key term in two different senses at different points in the same argument, so that a valid-looking structure conceals a change of subject.</p>",
fa:"<p>به‌کارگیریِ یک اصطلاحِ کلیدی در دو معنای متفاوت در نقاطِ مختلفِ یک استدلال، چنان‌که ساختاری به‌ظاهر معتبر، تغییرِ موضوع را پنهان می‌کند.</p>",
xe:"“Risk” as variance in one premise and as probability of loss in the next. The argument is now about two different things.",
xf:"«ریسک» در یک مقدمه به‌معنای واریانس و در مقدمهٔ بعدی به‌معنای احتمالِ زیان. استدلال اکنون دربارهٔ دو چیزِ متفاوت است.",
pe:"The reason to taboo the contested word and restate both positions without it. If the disagreement disappears, it was verbal.",
pf:"دلیلِ اینکه واژهٔ محلِ نزاع را ممنوع کنید و هر دو موضع را بدون آن بازگو کنید. اگر اختلاف ناپدید شد، لفظی بوده است.",c:[]},

authority:{t:"Appeal to authority",tf:"استناد به مرجع",w:"Standard",q:"appeal to authority fallacy expertise",
en:"<p>A fallacy when the authority is outside their domain, when the question is genuinely contested among experts, or when the authority's interest is engaged. Perfectly good evidence otherwise.</p>",
fa:"<p>هرگاه مرجع بیرون از حوزهٔ تخصصش باشد، یا پرسش واقعاً میان متخصصان محلِ نزاع باشد، یا منفعتِ مرجع در میان باشد، مغالطه است. در غیر این صورت، شاهدی کاملاً معتبر.</p>",
xe:"A physicist on climate physics is evidence. The same physicist on monetary policy is not.",
xf:"سخنِ یک فیزیک‌دان دربارهٔ فیزیکِ اقلیم شاهد است. همان فیزیک‌دان دربارهٔ سیاستِ پولی، نه.",
pe:"Deference is rational and unavoidable — you cannot verify most of what you know. The skill is knowing when deference is not warranted, which is exactly Goldman's five criteria.",
pf:"تبعیت عقلانی و ناگزیر است — نمی‌توانید بیشترِ دانسته‌هایتان را راستی‌آزمایی کنید. مهارت در دانستنِ این است که کِی تبعیت موجه نیست، و این دقیقاً همان پنج معیارِ گلدمن است.",
k:["expert"],c:[]},

burden:{t:"Burden of proof",tf:"بارِ اثبات",w:"Standard; heavily developed in legal theory",q:"burden of proof presumption",
en:"<p>Who must make the case, and who may simply wait? The allocation is rarely obvious, it is usually contested, and it frequently decides the outcome before any evidence is weighed.</p>",
fa:"<p>چه کسی باید اثبات کند و چه کسی می‌تواند صرفاً منتظر بماند؟ این تخصیص به‌ندرت بدیهی است، معمولاً محلِ نزاع است و اغلب پیش از سنجشِ هر شاهدی نتیجه را تعیین می‌کند.</p>",
xe:"Must a new rule be shown to be beneficial, or must objectors show it is harmful? The answer decides most of the argument in advance.",
xf:"آیا باید ثابت شود قاعدهٔ تازه سودمند است، یا معترضان باید ثابت کنند زیان‌آور است؟ پاسخ، بخش عمدهٔ بحث را از پیش تعیین می‌کند.",
pe:"In regulatory argument the burden allocation is often the whole game. If you find yourself losing on evidence, check whether you conceded the burden without noticing.",
pf:"در استدلالِ مقرراتی، تخصیصِ بار اغلب تمامِ بازی است. اگر دیدید در سطحِ شواهد می‌بازید، بررسی کنید که آیا ناخواسته بارِ اثبات را واگذار کرده‌اید.",c:[]},

steel:{t:"Steelmanning",tf:"قوی‌سازیِ استدلالِ مخالف",w:"Anatol Rapoport · Daniel Dennett",q:"steelman principle of charity Rapoport",
en:"<p>Engage the strongest version of the opposing view — including improvements its own advocates have not thought of. Rapoport's rule: restate the position so well that your opponent says they wish they had put it that way.</p>",
fa:"<p>با قوی‌ترین صورتِ دیدگاهِ مخالف درگیر شوید — از جمله بهبودهایی که خودِ مدافعانش به آن نیندیشیده‌اند. قاعدهٔ راپاپورت: موضع را چنان خوب بازگو کنید که حریف بگوید کاش خودش همین‌طور گفته بود.</p>",
xe:"If your summary of their view would embarrass them, you are arguing with something they do not believe.",
xf:"اگر خلاصهٔ شما از دیدگاهِ آن‌ها شرمنده‌شان کند، دارید با چیزی بحث می‌کنید که به آن باور ندارند.",
pe:"Stops you winning against a version nobody holds — the most common way to be entirely right and entirely ineffective.",
pf:"مانع می‌شود در برابر صورتی که هیچ‌کس به آن باور ندارد پیروز شوید — رایج‌ترین راهِ کاملاً برحق و کاملاً بی‌اثر بودن.",c:[]},

relig:{L:1,t:"Religious epistemology",tf:"معرفت‌شناسیِ دین",w:"Plantinga · Alston · Pritchard · Flew",q:"religious epistemology",
en:"<p>Whether and how religious belief can be rational. This is the richest cross-connection on the map, because it sits at the junction of three branches: the structure of justification, the epistemology of testimony, and the ethics of belief.</p><p>It is also the best available test case. Positions about foundations that sound abstract become concrete the moment they are applied to something people actually care about, and their costs become visible.</p>",
fa:"<p>اینکه آیا و چگونه باورِ دینی می‌تواند عقلانی باشد. این غنی‌ترین پیوندِ عرضیِ نقشه است، چون در تقاطعِ سه شاخه می‌نشیند: ساختارِ توجیه، معرفت‌شناسیِ گواهی، و اخلاقِ باور.</p><p>همچنین بهترین موردِ آزمونِ در دسترس است. مواضعی دربارهٔ مبانی که انتزاعی می‌نمایند، به‌محضِ اعمال بر چیزی که مردم واقعاً به آن اهمیت می‌دهند عینی می‌شوند و هزینه‌هایشان آشکار.</p>",
xe:"Is faith a conclusion drawn from evidence, a properly basic belief needing none, or something not in the justification business at all? Three different branches, three different answers.",
xf:"آیا ایمان نتیجه‌ای است که از شواهد گرفته شده، باوری به‌درستی پایه که به شواهد نیاز ندارد، یا اصلاً چیزی است که در کارِ توجیه نیست؟ سه شاخهٔ متفاوت، سه پاسخِ متفاوت.",
pe:"Whatever your own position, this is where you find out what your epistemology actually commits you to when the stakes are not academic.",
pf:"موضعِ شما هر چه باشد، اینجاست که درمی‌یابید معرفت‌شناسی‌تان وقتی موضوع دانشگاهی نیست، شما را به چه چیزی متعهد می‌کند.",
c:["evidfid","reformed","properly","flew","fideism"]},

evidfid:{t:"Evidentialism vs fideism",tf:"شواهدگرایی در برابر ایمان‌گرایی",w:"Clifford · Kierkegaard",q:"evidentialism fideism religious belief",
en:"<p>Evidentialism holds religious belief to the same evidential standard as any other. Fideism holds that faith is not the kind of thing evidence governs, and that demanding evidence misunderstands what is being claimed.</p>",
fa:"<p>شواهدگرایی باورِ دینی را به همان استانداردِ شواهدیِ سایر باورها می‌سنجد. ایمان‌گرایی می‌گوید ایمان از آن دست چیزها نیست که شواهد بر آن حکم براند، و مطالبهٔ شاهد، سوءفهمِ خودِ ادعاست.</p>",
pe:"The template for any dispute about whether a domain is subject to a shared evidentiary standard at all — a question that arises well beyond religion.",
pf:"الگوی هر نزاعی دربارهٔ اینکه آیا اساساً یک حوزه مشمولِ استانداردِ شواهدیِ مشترک هست یا نه — پرسشی که بسیار فراتر از دین مطرح می‌شود.",
k:["clifford"],c:[]},

reformed:{L:1,t:"Reformed epistemology",tf:"معرفت‌شناسیِ اصلاح‌شده",w:"Alvin Plantinga",q:"reformed epistemology Plantinga properly basic",
en:"<p>Plantinga's argument: belief in God can be <b>properly basic</b> — foundational rather than inferred — and therefore rational without any supporting argument at all.</p><p>The move is structural, not devotional. Plantinga points out that belief in other minds, in the reality of the past, and in the external world are all held without inference and nobody calls them irrational. If the foundationalist framework permits those, the question is why it should exclude this one.</p>",
fa:"<p>استدلالِ پلانتینگا: باور به خدا می‌تواند <b>به‌درستی پایه</b> باشد — بنیادی و نه استنتاجی — و بنابراین بدون هیچ استدلالِ پشتیبانی، عقلانی.</p><p>این حرکت ساختاری است، نه عبادی. پلانتینگا یادآور می‌شود که باور به ذهنِ دیگران، به واقعیتِ گذشته و به جهانِ بیرون همه بدون استنتاج نگه داشته می‌شوند و کسی آن‌ها را غیرعقلانی نمی‌خواند. اگر چارچوبِ مبناگرایانه آن‌ها را مجاز می‌داند، پرسش این است که چرا این یکی را کنار بگذارد.</p>",
xe:"You did not infer that other people have minds. You have never seen anyone else's consciousness, and you are not irrational.",
xf:"شما استنتاج نکردید که دیگران ذهن دارند. هرگز آگاهیِ کسِ دیگری را ندیده‌اید و غیرعقلانی هم نیستید.",
pe:"Takes the third horn of the trilemma explicitly and argues the stop is not arbitrary. Whether you accept the conclusion, the structure is worth understanding — it is the general form of every “this is where I start” move.",
pf:"شاخِ سومِ سه‌راهی را صریح می‌پذیرد و استدلال می‌کند که آن توقف دلبخواهی نیست. نتیجه را بپذیرید یا نه، ساختارش ارزشِ فهمیدن دارد — صورتِ کلیِ هر حرکتِ «من از اینجا آغاز می‌کنم».",
oe:"The Great Pumpkin objection: what prevents anyone from declaring any belief whatever to be properly basic?",
of:"اعتراضِ «کدوتنبلِ بزرگ»: چه چیزی مانع می‌شود کسی هر باوری را که خواست «به‌درستی پایه» اعلام کند؟",
k:["found","trilemma"],c:[]},

properly:{t:"Properly basic beliefs",tf:"باورهای به‌درستی پایه",w:"Plantinga · Chisholm",q:"properly basic belief",
en:"<p>Beliefs that are rational without being derived from other beliefs. Everyone's framework contains some; the disagreement is entirely about which ones qualify and on what criterion.</p>",
fa:"<p>باورهایی که بدون استنتاج از باورهای دیگر عقلانی‌اند. چارچوبِ هر کسی چند تایی از این‌ها دارد؛ اختلاف یکسره بر سرِ این است که کدام‌ها واجد شرط‌اند و با چه معیاری.</p>",
xe:"“I had breakfast this morning.” “Other people have minds.” “The world is more than five minutes old.”",
xf:"«امروز صبح صبحانه خوردم.» «دیگران ذهن دارند.» «جهان بیش از پنج دقیقه عمر دارد.»",
pe:"Write your own list once. It is a genuinely uncomfortable exercise and it tells you more about your framework than any amount of reading.",
pf:"یک بار فهرستِ خودتان را بنویسید. تمرینی واقعاً ناخوشایند است و بیش از هر مطالعه‌ای دربارهٔ چارچوبتان به شما می‌گوید.",c:[]},

flew:{L:1,t:"Flew's falsification challenge",tf:"چالشِ ابطالِ فلو",w:"Antony Flew; replies from John Hick and R.M. Hare",q:"Flew falsification theology gardener",
en:"<p>Flew took Popper's demarcation criterion and turned it on theology. His parable: two explorers find a clearing. One says a gardener tends it. No gardener is seen, so the gardener is invisible. Barriers detect nothing, so the gardener is intangible. Dogs do not scent him, so he is odourless.</p><p>Flew's question: what began as an assertion has been qualified until nothing could count against it. At what point did it die “the death of a thousand qualifications”?</p>",
fa:"<p>فلو معیارِ تمایزِ پوپر را برداشت و بر الهیات اعمال کرد. تمثیلِ او: دو کاشف به فضایی باز می‌رسند. یکی می‌گوید باغبانی از آن مراقبت می‌کند. باغبانی دیده نمی‌شود، پس باغبان نامرئی است. موانع چیزی حس نمی‌کنند، پس ناملموس است. سگ‌ها بویش را نمی‌گیرند، پس بی‌بوست.</p><p>پرسشِ فلو: آنچه به‌عنوان یک ادعا آغاز شد چنان مقید شد که دیگر هیچ چیز نمی‌تواند خلافش باشد. در کدام لحظه «به مرگِ هزار قید» مُرد؟</p>",
xe:"Each qualification is individually reasonable. Cumulatively they empty the claim of content without anyone noticing the moment it happened.",
xf:"هر قید به‌تنهایی معقول است. روی‌هم‌رفته ادعا را از محتوا تهی می‌کنند، بی‌آنکه کسی لحظهٔ وقوعش را ببیند.",
pe:"The clearest illustration of immunizing stratagems anywhere, and it transfers directly to empirical claims that get patched one reasonable qualification at a time.",
pf:"روشن‌ترین نمایشِ تدابیرِ مصون‌ساز در هر جای دیگر، و مستقیماً به ادعاهای تجربی‌ای منتقل می‌شود که هر بار با یک قیدِ معقول وصله می‌خورند.",
k:["adhoc","popper"],c:[]},

fideism:{t:"Wittgensteinian fideism",tf:"ایمان‌گراییِ ویتگنشتاینی",w:"Wittgenstein · D.Z. Phillips · Pritchard",q:"Wittgensteinian fideism forms of life",
en:"<p>Religious claims belong to a form of life with its own grammar. Applying an external evidential standard misunderstands what is being said, in the way that demanding proof of a hinge misunderstands what a hinge is.</p>",
fa:"<p>ادعاهای دینی به صورتی از زندگی تعلق دارند که دستورِ زبانِ خود را دارد. اعمالِ استانداردِ شواهدیِ بیرونی، سوءفهمِ آن چیزی است که گفته می‌شود؛ همان‌گونه که مطالبهٔ اثبات برای یک لولا، سوءفهمِ چیستیِ لولاست.</p>",
pe:"The dissolution route rather than a position inside the debate — and the identical move is available for secular bedrock commitments, which is worth noticing before you accept or reject it.",
pf:"راهِ انحلال است نه موضعی درونِ نزاع — و همین حرکت برای تعهداتِ بنیادینِ سکولار هم در دسترس است، و پیش از پذیرش یا ردِ آن ارزشِ توجه دارد.",
oe:"Critics call it a sophisticated way of placing a claim beyond the reach of criticism while keeping the appearance of asserting something.",
of:"منتقدان آن را راهی پیچیده می‌دانند برای بیرون‌بردنِ یک ادعا از دسترسِ نقد، در حالی که ظاهرِ ادعاکردن حفظ می‌شود.",
k:["hinge"],c:[]}
};

const R={

trilemma:{en:{
line:"Every chain of justification ends in one of three failures: it runs forever, it circles back, or it stops on an assumption nobody justified.",
why:"<p>Epistemology needed to say what makes a belief justified. Every proposed answer took the same grammatical form: belief B is justified <i>because of</i> reason R. The trilemma shows that this form of answer can never be completed. It is not a puzzle about some odd class of beliefs — it is a structural fact about the shape of justification itself, which is why it works as the organising problem of the field rather than as one topic within it.</p>",
idea:"<p>Push any justification and the chain must do one of three things. It can extend without end, each reason needing a further reason, so that nothing is ever actually established. It can loop, eventually resting on something it was supposed to be supporting. Or it can halt at a proposition you decline to justify further.</p><p>The three are exhaustive. A chain of reasons is either infinite, closed, or terminated — there is no fourth topology. That exhaustiveness is what gives the argument its force: you cannot escape by being cleverer, only by choosing which failure to live with and then arguing that it is not really a failure.</p><p>This is why the major positions in epistemology line up so neatly against the three horns. They are not independent theories that happen to disagree; they are the three available responses to one argument, plus two refusals to play.</p>",
origin:"Hans Albert, <i>Traktat über kritische Vernunft</i> (1968), named for Baron Münchhausen, who claimed to have hauled himself out of a swamp by his own hair. Albert did not intend a neutral puzzle: he built it as a weapon for Popper's critical rationalism against <i>justificationism</i>, the assumption that beliefs need justifying at all. The ancient ancestor is the modes of Agrippa, recorded by Sextus Empiricus around 200 CE — the same three horns, aimed at producing suspension of judgment rather than a theory of justification.",
obj:[["It assumes justificationism. If beliefs do not need justification, the argument never starts.","Albert agrees — that is the point, not a refutation. But dropping justificationism has its own bill to pay: you must then explain why it is rational to rely on theories that have merely survived criticism, which looks like justification returning under a new name."],
["Foundationalism already answers it. Some beliefs are self-justifying, so the third horn is not a failure.","The trilemma does not deny that such beliefs might exist. It forces you to say <i>which</i> ones qualify and on what criterion — and that criterion then faces the same problem, which is the problem of the criterion."],
["In practice nobody demands endless justification. We stop when it is reasonable to stop.","That is horn three with the arbitrariness relabelled as reasonableness. Contextualism makes the relabelling respectable, but 'reasonable to whom, by what standard' puts you back at the start."]],
confuse:[["The problem of the criterion","Closely related, genuinely different. The trilemma concerns the <i>structure</i> of a justification chain. The criterion problem concerns validating the <i>standard</i> you use to judge chains. You can accept one and still owe an answer to the other."],
["Infinite regress arguments in general","Regress is only one of the three horns. Using 'infinite regress' as shorthand for the whole trilemma discards two thirds of the argument, and the two discarded horns are the ones most people actually take."],
["Scepticism","The trilemma does not conclude that we know nothing. It constrains what a theory of justification can look like. Every major school accepts the argument and then makes a choice."]],
mistakes:["Treating it as an argument for scepticism rather than as a constraint on theories of justification.",
"Assuming the dogmatic stop is always illegitimate. Axioms are chosen stops, and choosing them openly is how mathematics works.",
"Believing Bayesian priors escape it. The problem of the priors is the same trilemma in probabilistic dress."],
check:{q:"A colleague defends a modelling assumption with “that's just standard in the literature.” Which horn is that, and what is the right follow-up question?",
a:"Horn three — a dogmatic stop with the arbitrariness hidden behind convention. The follow-up: what did the literature's own stop rest on, and has anyone tested whether the result is sensitive to it? Convention does not remove an unjustified assumption; it converts it into an unexamined one, which is worse because nobody now feels responsible for it."}
},fa:{
line:"هر زنجیرهٔ توجیه به یکی از سه شکست می‌رسد: تا بی‌نهایت ادامه می‌یابد، به خود بازمی‌گردد، یا روی فرضی می‌ایستد که کسی توجیهش نکرده است.",
why:"<p>معرفت‌شناسی می‌بایست بگوید چه چیزی یک باور را موجه می‌کند. هر پاسخِ پیشنهادی همان صورتِ دستوری را داشت: باورِ ب موجه است <i>به‌سببِ</i> دلیلِ د. سه‌راهی نشان می‌دهد که این صورتِ پاسخ هرگز کامل نمی‌شود. این معمایی دربارهٔ دسته‌ای عجیب از باورها نیست — واقعیتی ساختاری دربارهٔ خودِ شکلِ توجیه است، و به همین دلیل به‌جای آنکه یک موضوع در میان موضوعات باشد، مسئلهٔ سازمان‌دهندهٔ این رشته است.</p>",
idea:"<p>هر توجیهی را که پیش برانید، زنجیره باید یکی از سه کار را بکند. می‌تواند بی‌پایان ادامه یابد، چنان‌که هر دلیل دلیلی دیگر بطلبد و در نتیجه هیچ‌گاه چیزی واقعاً اثبات نشود. می‌تواند حلقه بزند و سرانجام بر چیزی تکیه کند که قرار بود پشتیبانی‌اش کند. یا می‌تواند بر گزاره‌ای بایستد که از توجیهِ بیشترش سر باز می‌زنید.</p><p>این سه، همهٔ حالت‌ها را دربر می‌گیرند. زنجیرهٔ دلایل یا نامتناهی است، یا بسته، یا پایان‌یافته — توپولوژیِ چهارمی وجود ندارد. همین جامعیت است که به استدلال نیرو می‌بخشد: با زیرکیِ بیشتر نمی‌توان گریخت، تنها می‌توان برگزید که با کدام شکست زندگی کنید و سپس استدلال کنید که در واقع شکست نیست.</p><p>به همین دلیل مواضعِ اصلیِ معرفت‌شناسی چنین منظم در برابر این سه شاخ صف می‌بندند. آن‌ها نظریه‌هایی مستقل نیستند که اتفاقاً با هم اختلاف داشته باشند؛ سه پاسخِ در دسترس به یک استدلال‌اند، به‌علاوهٔ دو امتناع از بازی.</p>",
origin:"هانس آلبرت، <i>رسالهٔ عقلِ نقدی</i> (۱۹۶۸)، نام‌گرفته از بارون مونش‌هاوزن که ادعا می‌کرد خود را با کشیدنِ موهایش از باتلاق بیرون کشیده است. آلبرت معمایی بی‌طرف در نظر نداشت: آن را سلاحی ساخت برای عقل‌گراییِ نقدیِ پوپر در برابرِ <i>توجیه‌گرایی</i>، یعنی این فرض که باورها اصلاً به توجیه نیاز دارند. نیای باستانیِ آن، «وجوهِ آگریپا» است که سکستوس امپیریکوس حدود سال ۲۰۰ میلادی ثبت کرده — همان سه شاخ، اما با هدفِ تعلیقِ حکم، نه ساختنِ نظریه‌ای دربارهٔ توجیه.",
obj:[["توجیه‌گرایی را مفروض می‌گیرد. اگر باورها به توجیه نیاز نداشته باشند، استدلال اصلاً آغاز نمی‌شود.","آلبرت موافق است — و این نکتهٔ اوست، نه ردیه‌ای بر او. اما کنارگذاشتنِ توجیه‌گرایی هزینهٔ خود را دارد: آنگاه باید توضیح دهید چرا اتکا به نظریه‌هایی که صرفاً از نقد جان به در برده‌اند عقلانی است، و این شبیهِ بازگشتِ توجیه با نامی تازه است."],
["مبناگرایی از پیش پاسخ داده است. برخی باورها خودموجه‌اند، پس شاخ سوم شکست نیست.","سه‌راهی وجودِ چنین باورهایی را انکار نمی‌کند. شما را وادار می‌کند بگویید <i>کدام</i> باورها واجد شرط‌اند و با چه معیاری — و آن معیار خود با همین مشکل روبه‌رو می‌شود، که همان مسئلهٔ معیار است."],
["در عمل هیچ‌کس توجیهِ بی‌پایان نمی‌خواهد. آنجا که معقول است می‌ایستیم.","این همان شاخ سوم است که دلبخواهی‌بودنش «معقولیت» نام گرفته. زمینه‌گرایی این نام‌گذاری را محترم می‌کند، اما «معقول برای چه کسی و با چه معیاری» شما را به نقطهٔ آغاز بازمی‌گرداند."]],
confuse:[["مسئلهٔ معیار","بسیار نزدیک و واقعاً متفاوت. سه‌راهی به <i>ساختارِ</i> زنجیرهٔ توجیه مربوط است. مسئلهٔ معیار به اعتبارسنجیِ <i>استانداردی</i> که با آن زنجیره‌ها را داوری می‌کنید. می‌توانید یکی را بپذیرید و همچنان به دیگری بدهکار باشید."],
["استدلال‌های تسلسل به‌طور کلی","تسلسل تنها یکی از سه شاخ است. به‌کاربردنِ «تسلسل» به‌جای کلِ سه‌راهی، دو‌سومِ استدلال را دور می‌ریزد، و آن دو شاخِ دورریخته همان‌هایی‌اند که بیشترِ مردم واقعاً برمی‌گزینند."],
["شکاکیت","سه‌راهی نتیجه نمی‌گیرد که هیچ نمی‌دانیم. محدود می‌کند که نظریهٔ توجیه چه شکلی می‌تواند داشته باشد. هر مکتبِ بزرگ این استدلال را می‌پذیرد و سپس دست به انتخاب می‌زند."]],
mistakes:["برداشتِ آن به‌عنوان استدلالی به سودِ شکاکیت، به‌جای محدودیتی بر نظریه‌های توجیه.",
"این پندار که توقفِ جزمی همیشه نامشروع است. اصولِ موضوعه توقف‌هایی برگزیده‌اند و برگزیدنِ آشکارِ آن‌ها همان کاری است که ریاضیات می‌کند.",
"این باور که احتمالاتِ پیشینِ بیزی از آن می‌گریزند. «مسئلهٔ پیشین‌ها» همان سه‌راهی است در جامهٔ احتمال."],
check:{q:"همکاری از یک فرضِ مدل‌سازی چنین دفاع می‌کند: «این در ادبیاتِ موضوع استاندارد است.» این کدام شاخ است و پرسشِ درستِ بعدی چیست؟",
a:"شاخ سوم — توقفی جزمی که دلبخواهی‌بودنش پشتِ عرف پنهان شده. پرسشِ بعدی: توقفِ خودِ آن ادبیات بر چه چیزی استوار بود، و آیا کسی آزموده که نتیجه به آن حساس است یا نه؟ عرف، فرضِ توجیه‌نشده را حذف نمی‌کند؛ آن را به فرضی بررسی‌نشده بدل می‌کند، و این بدتر است چون دیگر هیچ‌کس خود را مسئولش نمی‌داند."}
}},

popper:{en:{
line:"Theories can never be verified by evidence, only refuted by it — so a claim is scientific to the degree that it forbids things and risks being wrong.",
why:"<p>Hume had shown that no number of observations can establish a universal claim. The logical positivists tried to live with this by making verification the criterion of meaning, which quietly excluded most of physics. Popper's move was to stop trying to solve the problem of induction and instead route around it: if confirmation is impossible but <i>refutation</i> is not, build the whole method on refutation.</p>",
idea:"<p>The asymmetry is the engine. 'All swans are white' cannot be established by any finite number of white swans, because the next one might differ. But a single black swan settles it, conclusively, by simple logic — this is modus tollens applied to a universal statement.</p><p>From that asymmetry everything else follows. A good theory is not one that fits the evidence, since a vague theory fits everything. A good theory <b>forbids</b> a great deal: it makes risky predictions that could easily have failed. Science advances not by accumulating support but by eliminating error, and a theory that has survived severe testing is not thereby probable — it is merely still standing.</p>",
origin:"Karl Popper, <i>Logik der Forschung</i> (1934), later <i>Conjectures and Refutations</i> (1963). The target was twofold: the Vienna Circle's verificationism, and what Popper saw as the unfalsifiable ambitions of Marxism and psychoanalysis, which could accommodate any outcome. His formative contrast was Einstein, who had specified in advance an observation that would have destroyed his theory.",
obj:[["Duhem–Quine: no hypothesis is ever tested alone, so a failed test never identifies which element of the bundle is false. Falsification is not the clean logical operation it appears to be.","Popper acknowledged this and responded with methodological rules — do not rescue a theory with ad hoc adjustments — but rules are not logic. This objection is generally taken as decisive against falsifiability as a <i>demarcation criterion</i>, while leaving it intact as a research discipline."],
["Scientists do not in fact abandon theories on a single refutation, and they are right not to. Kuhn's history shows anomalies are absorbed for decades.","Correct as description, and Lakatos built the repair: judge programmes over time by whether their adjustments generate new confirmed predictions. That preserves Popper's insight while matching what scientists actually do."],
["If corroboration gives no reason to rely on a theory, why fly in aeroplanes designed with corroborated physics?","This is the sharpest objection and Popper never fully answered it. He offered 'preference for the best-tested theory' as a pragmatic rather than epistemic recommendation, which many read as justification smuggled back in."]],
confuse:[["Falsifiable vs. falsified vs. false","A falsifiable theory is one that <i>could</i> be shown wrong. That is a virtue, not a defect. Calling a claim falsifiable is praise; people routinely hear it as an accusation."],
["Verification vs. corroboration","Corroboration reports a survival record. It does not accumulate into support, does not raise probability, and does not license extrapolation. Popper is stricter here than almost anyone using his vocabulary realises."]],
mistakes:["Using falsifiability as a working demarcation rule. It failed at that job and most philosophers of science have said so since the 1960s.",
"Treating an unfalsifiable claim as meaningless. Popper's criterion is about science, not meaning — he explicitly separated the two.",
"Forgetting that the theory must forbid something <i>specific</i>. 'Something will happen' is technically falsifiable and epistemically empty."],
check:{q:"A model has been adjusted four times in ten years, each time after a missed forecast, and it now fits the whole history. Is it falsifiable?",
a:"Almost certainly yes, in the trivial sense — you can still state observations that would contradict it. That is why the question is the wrong one. The right question is Lakatos's: did each adjustment predict something new that then turned out true, or did it only absorb what had already gone wrong? Four post-hoc patches with no novel predictions is a degenerating programme, whatever its formal falsifiability."}
},fa:{
line:"نظریه‌ها هرگز با شواهد تأیید نمی‌شوند، تنها ابطال می‌شوند — پس یک ادعا به همان اندازه علمی است که چیزهایی را ممنوع می‌کند و خطرِ نادرست‌بودن را می‌پذیرد.",
why:"<p>هیوم نشان داده بود که هیچ شمار از مشاهدات نمی‌تواند ادعایی کلی را اثبات کند. پوزیتیویست‌های منطقی کوشیدند با قراردادنِ «تحقیق‌پذیری» به‌عنوان معیارِ معنا با این وضع کنار بیایند، که بی‌سروصدا بیشترِ فیزیک را کنار می‌گذاشت. حرکتِ پوپر این بود که از حلِ مسئلهٔ استقرا دست بکشد و از کنارِ آن بگذرد: اگر تأیید ناممکن است اما <i>ابطال</i> ناممکن نیست، تمامِ روش را بر ابطال بنا کن.</p>",
idea:"<p>عدم‌تقارن، موتورِ ماجراست. «همهٔ قوها سفیدند» با هیچ شمارِ متناهی از قوهای سفید اثبات نمی‌شود، چون قوی بعدی ممکن است متفاوت باشد. اما یک قوی سیاه، با منطقی ساده، به‌طور قطعی کار را تمام می‌کند — این همان رفعِ تالی است که بر گزاره‌ای کلی اعمال شده.</p><p>از همین عدم‌تقارن، بقیه برمی‌آید. نظریهٔ خوب آن نیست که با شواهد جور دربیاید، چون نظریهٔ مبهم با همه‌چیز جور درمی‌آید. نظریهٔ خوب چیزهای بسیاری را <b>ممنوع</b> می‌کند: پیش‌بینی‌هایی پرخطر می‌کند که به‌آسانی می‌توانستند شکست بخورند. علم نه با انباشتِ پشتیبانی بلکه با حذفِ خطا پیش می‌رود، و نظریه‌ای که از آزمون‌های سخت جان به در برده از این رهگذر محتمل نمی‌شود — تنها هنوز بر پا مانده است.</p>",
origin:"کارل پوپر، <i>منطق اکتشاف علمی</i> (۱۹۳۴) و سپس <i>حدس‌ها و ابطال‌ها</i> (۱۹۶۳). هدف دوگانه بود: تحقیق‌پذیریِ حلقهٔ وین، و آنچه پوپر بلندپروازی‌های ابطال‌ناپذیرِ مارکسیسم و روان‌کاوی می‌دانست که هر نتیجه‌ای را در خود جای می‌دادند. تضادِ شکل‌دهنده در ذهن او اینشتین بود که از پیش مشاهده‌ای را مشخص کرده بود که نظریه‌اش را نابود می‌کرد.",
obj:[["دوئم‌ـ‌کواین: هیچ فرضیه‌ای تنها آزموده نمی‌شود، پس آزمونِ شکست‌خورده هرگز مشخص نمی‌کند کدام عنصرِ بسته کاذب است. ابطال آن عملیاتِ منطقیِ تمیزی نیست که می‌نماید.","پوپر این را پذیرفت و با قواعدِ روش‌شناختی پاسخ داد — نظریه را با تعدیل‌های موردی نجات ندهید — اما قاعده منطق نیست. این اعتراض عموماً در برابر ابطال‌پذیری به‌عنوان <i>معیارِ تمایز</i> قاطع دانسته می‌شود، در حالی که آن را به‌عنوان انضباطِ پژوهشی دست‌نخورده باقی می‌گذارد."],
["دانشمندان در واقع نظریه را با یک ابطال رها نمی‌کنند و حق هم دارند. تاریخ‌نگاریِ کوهن نشان می‌دهد ناهنجاری‌ها دهه‌ها جذب می‌شوند.","به‌عنوان توصیف درست است، و لاکاتوش ترمیم را ساخت: برنامه‌ها را در طول زمان و بر پایهٔ اینکه آیا تعدیل‌هایشان پیش‌بینی‌های تازهٔ تأییدشده می‌سازند داوری کنید. این بصیرتِ پوپر را حفظ می‌کند و با عملِ واقعیِ دانشمندان هم می‌خواند."],
["اگر تأییدِ آزمونی هیچ دلیلی برای اتکا به یک نظریه نمی‌دهد، چرا با هواپیمایی پرواز می‌کنیم که با فیزیکِ تأییدشده طراحی شده است؟","تیزترین اعتراض است و پوپر هرگز کاملاً پاسخش نداد. او «ترجیحِ بهترین‌آزموده‌شده» را به‌عنوان توصیه‌ای عملی و نه معرفتی پیش نهاد، که بسیاری آن را بازگرداندنِ پنهانیِ توجیه خواندند."]],
confuse:[["ابطال‌پذیر در برابر ابطال‌شده در برابر کاذب","نظریهٔ ابطال‌پذیر نظریه‌ای است که <i>می‌توان</i> نادرستی‌اش را نشان داد. این فضیلت است نه نقص. ابطال‌پذیر خواندنِ یک ادعا ستایش است؛ مردم مرتب آن را اتهام می‌شنوند."],
["تحقیق در برابر تأییدِ آزمونی","تأییدِ آزمونی کارنامهٔ بقا را گزارش می‌کند. به پشتیبانی انباشته نمی‌شود، احتمال را بالا نمی‌برد و اجازهٔ برون‌یابی نمی‌دهد. پوپر در این نقطه سخت‌گیرتر از تقریباً همهٔ کسانی است که واژگانش را به کار می‌برند."]],
mistakes:["به‌کارگیریِ ابطال‌پذیری به‌عنوان قاعدهٔ کاریِ تمایز. در این کار شکست خورد و بیشترِ فیلسوفان علم از دههٔ ۱۹۶۰ همین را گفته‌اند.",
"بی‌معنا شمردنِ ادعای ابطال‌ناپذیر. معیارِ پوپر دربارهٔ علم است نه معنا — او صریحاً این دو را جدا کرد.",
"فراموش‌کردنِ اینکه نظریه باید چیزی <i>مشخص</i> را ممنوع کند. «چیزی رخ خواهد داد» از نظر فنی ابطال‌پذیر است و از نظر معرفتی تهی."],
check:{q:"مدلی در ده سال چهار بار تعدیل شده، هر بار پس از یک پیش‌بینیِ نادرست، و اکنون با تمامِ تاریخ جور درمی‌آید. آیا ابطال‌پذیر است؟",
a:"تقریباً به‌یقین بله، به معنای بدیهی — هنوز می‌توانید مشاهداتی را نام ببرید که با آن در تضادند. و به همین دلیل این پرسشِ نادرست است. پرسشِ درست پرسشِ لاکاتوش است: آیا هر تعدیل چیزی تازه پیش‌بینی کرد که سپس درست از آب درآمد، یا فقط آنچه را از پیش خراب شده بود جذب کرد؟ چهار وصلهٔ پس‌از‌واقعه بدون هیچ پیش‌بینیِ تازه، برنامه‌ای واپس‌رونده است، هر قدر هم که صوراً ابطال‌پذیر باشد."}
}},

duhem:{en:{
line:"You never test a hypothesis alone — you test it bundled with every auxiliary assumption the test relies on, and a failure only tells you something in the bundle is wrong.",
why:"<p>Popper's method needs a clean refutation: predict X, observe not-X, discard the theory. Duhem noticed that this never happens in a laboratory. The prediction was derived from the hypothesis <i>plus</i> assumptions about the instrument, the sample, the background theory, and the absence of interference. Logic condemns the conjunction, not any particular conjunct.</p>",
idea:"<p>Suppose a telescope fails to show the predicted stellar parallax. The candidate culprits are: the astronomical theory, the optics of the lens, the assumed distance to the star, atmospheric conditions, the observer's competence, and the auxiliary claim that nothing else interferes. The observation refutes their conjunction. It says nothing about which member to abandon.</p><p>Quine radicalised this into confirmation holism: our beliefs face experience as a corporate body, and any statement can be held true come what may if we make drastic enough adjustments elsewhere in the system. Even logic and mathematics are, in principle, revisable.</p><p>The practical consequence is that choosing which element to blame is a judgment, not a deduction — and it is precisely where scientific controversy actually lives.</p>",
origin:"Pierre Duhem, <i>La Théorie physique</i> (1906), arguing there is no crucial experiment in physics. W.V.O. Quine extended it far more aggressively in 'Two Dogmas of Empiricism' (1951), where it becomes an argument against the analytic/synthetic distinction as well. The two theses are usually bundled, though Duhem restricted his claim to physics and would not have endorsed Quine's version.",
obj:[["In practice we do know which assumption to blame. Nobody seriously suspects the laws of arithmetic when a reading comes out odd.","True, and this is the standard reply: background assumptions differ enormously in how well-tested and independently supported they are. But that reply concedes the logical point and replaces it with a judgment about relative credibility — which is exactly Duhem's claim about how physics really works."],
["If any statement can be held true come what may, science becomes unfalsifiable and anything goes.","Quine's thesis is about logical possibility, not licence. Holding a statement true 'come what may' has costs that ramify through the system, and those costs are what discipline the choice. Feyerabend drew the anything-goes conclusion; most philosophers of science do not."]],
confuse:[["Underdetermination","Related but distinct. Duhem–Quine is about the <i>logic of testing</i> — a failed test does not localise blame. Underdetermination is about <i>theory choice</i> — multiple theories fit the same total evidence. The first is a problem for refutation; the second for confirmation."],
["Ad hoc rescue","Duhem–Quine says adjusting an auxiliary is always logically available. Ad hoc rescue is the <i>abuse</i> of that freedom. The thesis describes the escape hatch; Lakatos supplies the test for whether using it was legitimate."]],
mistakes:["Treating it as a refutation of Popper rather than a constraint on him. Popper accepted the point and answered with methodological rules.",
"Concluding that testing is pointless. It shows tests are less surgical than advertised, not that they carry no information.",
"Forgetting that it cuts both ways: your critics can also deflect your evidence onto an auxiliary. Knowing your own bundle is a defensive skill."],
check:{q:"Your specification produces a null result on an effect you expected. List the bundle before you conclude anything. What is on it?",
a:"At minimum: the causal hypothesis itself; the functional form; the identification strategy's assumptions; the measurement validity of your proxies; the sample's representativeness; the time period's regime stability; and the power of the test to detect an effect of that size. The null condemns the conjunction. Reporting it as evidence against the hypothesis alone is a claim about which member you have independently ruled out — and that claim needs its own defence."}
},fa:{
line:"شما هرگز یک فرضیه را تنها نمی‌آزمایید — آن را همراه با تمامِ فرض‌های کمکی‌ای که آزمون بر آن‌ها تکیه دارد می‌آزمایید، و شکست تنها می‌گوید چیزی در آن بسته نادرست است.",
why:"<p>روشِ پوپر به ابطالی تمیز نیاز دارد: ایکس را پیش‌بینی کن، نه‌ایکس را مشاهده کن، نظریه را دور بینداز. دوئم دریافت که این هرگز در آزمایشگاه رخ نمی‌دهد. پیش‌بینی از فرضیه <i>به‌علاوهٔ</i> فرض‌هایی دربارهٔ ابزار، نمونه، نظریهٔ پس‌زمینه و نبودِ مداخله استنتاج شده بود. منطق، عطفِ همهٔ این‌ها را محکوم می‌کند، نه هیچ جزءِ معینی را.</p>",
idea:"<p>فرض کنید تلسکوپ اختلافِ منظرِ ستاره‌ایِ پیش‌بینی‌شده را نشان نمی‌دهد. مظنونان عبارت‌اند از: نظریهٔ نجومی، اپتیکِ عدسی، فاصلهٔ مفروضِ ستاره، شرایطِ جوی، شایستگیِ ناظر، و این ادعای کمکی که چیز دیگری مداخله نمی‌کند. مشاهده عطفِ این‌ها را ابطال می‌کند و دربارهٔ اینکه کدام عضو را رها کنیم چیزی نمی‌گوید.</p><p>کواین این را به «کل‌گراییِ تأیید» رادیکال کرد: باورهای ما همچون یک پیکرِ واحد با تجربه روبه‌رو می‌شوند، و هر گزاره‌ای را می‌توان با هر پیشامدی صادق نگه داشت، به شرط آنکه تعدیل‌هایی به‌قدر کافی سنگین در جای دیگرِ نظام بپذیریم. حتی منطق و ریاضیات نیز اصولاً بازنگری‌پذیرند.</p><p>پیامدِ عملی این است که انتخابِ عنصرِ مقصر یک داوری است نه یک استنتاج — و دقیقاً همان‌جاست که مناقشهٔ علمی واقعاً زندگی می‌کند.</p>",
origin:"پیر دوئم، <i>نظریهٔ فیزیکی</i> (۱۹۰۶)، با این استدلال که در فیزیک آزمایشِ سرنوشت‌ساز وجود ندارد. کواین آن را در «دو حکمِ جزمیِ تجربه‌گرایی» (۱۹۵۱) بسیار تهاجمی‌تر بسط داد، جایی که به استدلالی علیه تمایزِ تحلیلی/ترکیبی نیز بدل می‌شود. این دو تز معمولاً با هم بسته‌بندی می‌شوند، هرچند دوئم ادعایش را به فیزیک محدود کرده بود و روایتِ کواین را تأیید نمی‌کرد.",
obj:[["در عمل می‌دانیم کدام فرض را مقصر بدانیم. وقتی قرائتی عجیب درمی‌آید هیچ‌کس جداً به قوانینِ حساب مشکوک نمی‌شود.","درست است، و پاسخِ متعارف همین است: فرض‌های پس‌زمینه از نظر میزانِ آزموده‌شدن و پشتیبانیِ مستقل بسیار با هم فرق دارند. اما این پاسخ نکتهٔ منطقی را می‌پذیرد و به‌جایش داوری‌ای دربارهٔ اعتبارِ نسبی می‌گذارد — و این دقیقاً ادعای دوئم دربارهٔ کارکردِ واقعیِ فیزیک است."],
["اگر هر گزاره‌ای را بتوان با هر پیشامدی صادق نگه داشت، علم ابطال‌ناپذیر می‌شود و «هر چیزی رواست».","تزِ کواین دربارهٔ امکانِ منطقی است، نه اجازه. صادق نگه‌داشتنِ یک گزاره «به هر قیمت» هزینه‌هایی دارد که در سراسرِ نظام پخش می‌شود، و همان هزینه‌هاست که انتخاب را منضبط می‌کند. فایرابند نتیجهٔ «هر چیزی رواست» را گرفت؛ بیشترِ فیلسوفانِ علم نمی‌گیرند."]],
confuse:[["تعیّن‌ناقص","مرتبط اما متمایز. دوئم‌ـ‌کواین دربارهٔ <i>منطقِ آزمون</i> است — آزمونِ شکست‌خورده تقصیر را مکان‌یابی نمی‌کند. تعیّن‌ناقص دربارهٔ <i>انتخابِ نظریه</i> است — چند نظریه با کلِ شواهد جور درمی‌آیند. اولی مشکلی برای ابطال است و دومی برای تأیید."],
["ترمیمِ موردی","دوئم‌ـ‌کواین می‌گوید تعدیلِ یک فرضِ کمکی همیشه از نظر منطقی در دسترس است. ترمیمِ موردی <i>سوءاستفاده</i> از همین آزادی است. این تز درِ فرار را توصیف می‌کند؛ لاکاتوش آزمونِ مشروع‌بودنِ استفاده از آن را فراهم می‌آورد."]],
mistakes:["برداشتِ آن به‌عنوان ابطالِ پوپر به‌جای محدودیتی بر او. پوپر نکته را پذیرفت و با قواعدِ روش‌شناختی پاسخ داد.",
"نتیجه‌گیریِ اینکه آزمون بی‌فایده است. نشان می‌دهد آزمون‌ها کمتر از آنچه تبلیغ می‌شود جراحی‌گونه‌اند، نه اینکه هیچ اطلاعاتی ندارند.",
"فراموش‌کردنِ اینکه دو لبه دارد: منتقدانِ شما هم می‌توانند شواهدِ شما را به فرضی کمکی حواله دهند. شناختِ بستهٔ خودتان مهارتی تدافعی است."],
check:{q:"مشخصه‌بندیِ شما دربارهٔ اثری که انتظار داشتید نتیجهٔ صفر می‌دهد. پیش از هر نتیجه‌گیری، بسته را فهرست کنید. چه چیزهایی در آن است؟",
a:"دست‌کم: خودِ فرضیهٔ علّی؛ صورتِ تابعی؛ فرض‌های راهبردِ شناسایی؛ اعتبارِ سنجشِ متغیرهای جانشین؛ نمایندگیِ نمونه؛ ثباتِ رژیم در بازهٔ زمانی؛ و توانِ آزمون برای تشخیصِ اثری در آن اندازه. نتیجهٔ صفر عطفِ این‌ها را محکوم می‌کند. گزارشِ آن به‌عنوان شاهدی علیه فرضیه به‌تنهایی، ادعایی است دربارهٔ اینکه کدام عضو را مستقلاً رد کرده‌اید — و آن ادعا خود به دفاع نیاز دارد."}
}},

lakatos:{en:{
line:"Judge a research programme over time, not a theory at a moment: it is progressive if its adjustments predict new facts that turn out true, degenerating if they only absorb what already went wrong.",
why:"<p>Popper said refutation kills theories. Kuhn showed historically that it does not, and that scientists are right to protect a framework while it is still productive. That left a gap: if anomalies do not force abandonment, what distinguishes legitimate protection from mere stubbornness? Lakatos's programme concept is the answer, and it is the most usable idea in the philosophy of science.</p>",
idea:"<p>A research programme has a <b>hard core</b> — the commitments its adherents will not give up — surrounded by a <b>protective belt</b> of auxiliary hypotheses, initial conditions, and observational assumptions. Anomalies are directed at the belt, never at the core. That is not cheating; it is how every functioning science operates.</p><p>The evaluation is therefore historical rather than logical. Ask what the belt adjustments accomplished. If they generated predictions of <i>novel</i> facts that were subsequently confirmed, the programme is <b>progressive</b>. If they merely accommodated the anomaly that prompted them, adding no new content, it is <b>degenerating</b>.</p><p>The genius of this is that it replaces an unanswerable question — is this theory scientific? — with an answerable one that you can research: what has this framework predicted lately that it did not already know?</p>",
origin:"Imre Lakatos, 'Falsification and the Methodology of Scientific Research Programmes' (1970), written explicitly as a reconciliation of his teacher Popper with Kuhn. Lakatos accepted Kuhn's history while refusing Kuhn's implication that theory choice is a matter of mob psychology, and so needed a rational criterion that operates over time rather than at an instant.",
obj:[["The verdict is only available in retrospect. A degenerating programme can turn progressive, so the criterion cannot guide a scientist deciding what to work on now.","Lakatos accepted this: he called the standard 'wisdom after the event' and denied it licensed instant elimination of a programme. Feyerabend pressed the point hard — if you can never say a programme should be abandoned <i>now</i>, the criterion is a historian's tool, not a methodologist's."],
["What counts as a 'novel' fact? If a prediction of something already known counts, almost anything is progressive; if not, almost nothing is.","This is a genuine technical problem and the literature has several repairs — novelty relative to what the programme's designers knew, or use-novelty, where a fact is novel if it was not used in constructing the theory. None is fully settled."]],
confuse:[["Kuhn's paradigms","Kuhn's paradigms succeed one another and are largely incommensurable; a scientific field has one at a time. Lakatos's programmes <i>compete simultaneously</i> and are compared by a shared rational standard. That difference is the entire point of Lakatos's intervention."],
["Falsifiability","Falsifiability is a property a theory has or lacks at a moment. Progressiveness is a property a programme displays over a stretch of history. You cannot assess the second from a snapshot, which is why the two questions feel similar and are not."]],
mistakes:["Applying it to a single paper or model. The unit of assessment is a programme with a track record, not an individual result.",
"Assuming 'degenerating' means false. It means the framework is not currently earning its keep, which is a different and more useful claim."],
check:{q:"Two macro schools each explain the last recession after the fact. How would Lakatos tell them apart?",
a:"Not by which explanation fits better — both fit, that is what post-hoc explanation does. He would ask what each school predicted <i>in advance</i> that it did not already know, and whether those predictions were confirmed. A school whose adjustments have generated confirmed novel predictions is progressive; a school whose adjustments only ever explain the last crisis after it happens is degenerating, however elegant the explanation."}
},fa:{
line:"یک برنامهٔ پژوهشی را در طول زمان داوری کنید، نه یک نظریه را در یک لحظه: پیش‌رونده است اگر تعدیل‌هایش واقعیت‌های تازه‌ای پیش‌بینی کنند که درست از آب درآیند، و واپس‌رونده است اگر تنها آنچه را از پیش خراب شده جذب کنند.",
why:"<p>پوپر می‌گفت ابطال نظریه‌ها را می‌کشد. کوهن از نظر تاریخی نشان داد که چنین نیست و دانشمندان حق دارند تا وقتی چارچوبی بارور است از آن محافظت کنند. این شکافی باقی گذاشت: اگر ناهنجاری‌ها به رهاکردن نمی‌انجامند، چه چیزی محافظتِ مشروع را از لجاجتِ صرف جدا می‌کند؟ مفهومِ «برنامه» نزدِ لاکاتوش پاسخ همین است، و کاربردی‌ترین ایدهٔ فلسفهٔ علم.</p>",
idea:"<p>هر برنامهٔ پژوهشی یک <b>هستهٔ سخت</b> دارد — تعهداتی که پیروانش از آن‌ها دست نمی‌کشند — که با <b>کمربندی محافظ</b> از فرضیه‌های کمکی، شرایطِ اولیه و فرض‌های مشاهده‌ای احاطه شده است. ناهنجاری‌ها همیشه به کمربند هدایت می‌شوند، هرگز به هسته. این تقلب نیست؛ شیوهٔ کارِ هر علمِ زنده است.</p><p>پس ارزیابی تاریخی است نه منطقی. بپرسید تعدیل‌های کمربند چه به دست آوردند. اگر پیش‌بینی‌هایی از واقعیت‌های <i>تازه</i> ساختند که سپس تأیید شدند، برنامه <b>پیش‌رونده</b> است. اگر تنها همان ناهنجاری‌ای را که موجبشان شده بود جای دادند و محتوایی نیفزودند، <b>واپس‌رونده</b> است.</p><p>نبوغِ این کار در آن است که پرسشی بی‌پاسخ — آیا این نظریه علمی است؟ — را با پرسشی پاسخ‌پذیر جایگزین می‌کند که می‌توانید دربارهٔ آن پژوهش کنید: این چارچوب اخیراً چه چیزی را پیش‌بینی کرده که از پیش نمی‌دانست؟</p>",
origin:"ایمره لاکاتوش، «ابطال و روش‌شناسیِ برنامه‌های پژوهشیِ علمی» (۱۹۷۰)، که صریحاً به‌عنوان آشتی‌دادنِ استادش پوپر با کوهن نوشته شد. لاکاتوش تاریخ‌نگاریِ کوهن را پذیرفت اما این دلالتِ او را که انتخابِ نظریه امری روان‌شناسیِ جمعی است رد کرد، و از همین رو به معیاری عقلانی نیاز داشت که در طول زمان کار کند نه در یک لحظه.",
obj:[["حکم تنها در گذشته‌نگری در دسترس است. برنامهٔ واپس‌رونده می‌تواند پیش‌رونده شود، پس این معیار نمی‌تواند دانشمندی را که اکنون تصمیم می‌گیرد راهنمایی کند.","لاکاتوش این را پذیرفت: آن را «خردِ پس از واقعه» نامید و انکار کرد که مجوزِ حذفِ فوریِ یک برنامه را بدهد. فایرابند بر همین نکته سخت فشار آورد — اگر هرگز نتوان گفت که برنامه‌ای باید <i>اکنون</i> رها شود، این معیار ابزارِ مورخ است نه روش‌شناس."],
["«واقعیتِ تازه» یعنی چه؟ اگر پیش‌بینیِ چیزی که از پیش دانسته بوده به‌حساب بیاید، تقریباً هر چیزی پیش‌رونده است؛ و اگر نه، تقریباً هیچ چیز.","این مشکلی فنی و واقعی است و ادبیات چند ترمیم دارد — تازگی نسبت به آنچه طراحانِ برنامه می‌دانستند، یا «تازگی در کاربرد» که در آن واقعیتی تازه است اگر در ساختنِ نظریه به کار نرفته باشد. هیچ‌یک کاملاً حل‌شده نیست."]],
confuse:[["پارادایم‌های کوهن","پارادایم‌های کوهن جانشین یکدیگر می‌شوند و عمدتاً قیاس‌ناپذیرند؛ هر رشته در هر زمان یکی دارد. برنامه‌های لاکاتوش <i>هم‌زمان رقابت می‌کنند</i> و با معیاری عقلانیِ مشترک مقایسه می‌شوند. همین تفاوت، تمامِ هدفِ مداخلهٔ لاکاتوش است."],
["ابطال‌پذیری","ابطال‌پذیری ویژگی‌ای است که نظریه در یک لحظه دارد یا ندارد. پیش‌روندگی ویژگی‌ای است که برنامه در بازه‌ای از تاریخ نشان می‌دهد. دومی را از یک عکسِ لحظه‌ای نمی‌توان سنجید، و به همین دلیل این دو پرسش شبیه به‌نظر می‌رسند و نیستند."]],
mistakes:["اعمالِ آن بر یک مقاله یا مدلِ منفرد. واحدِ ارزیابی یک برنامه با کارنامه است، نه یک نتیجهٔ منفرد.",
"این پندار که «واپس‌رونده» یعنی «کاذب». یعنی چارچوب در حال حاضر بهای خود را درنمی‌آورد، که ادعایی متفاوت و سودمندتر است."],
check:{q:"دو مکتبِ اقتصادِ کلان هر یک آخرین رکود را پس از وقوع تبیین می‌کنند. لاکاتوش چگونه میانشان تمایز می‌گذارد؟",
a:"نه با اینکه کدام تبیین بهتر جور درمی‌آید — هر دو جور درمی‌آیند، کارِ تبیینِ پس‌از‌واقعه همین است. او می‌پرسد هر مکتب <i>پیشاپیش</i> چه چیزی را پیش‌بینی کرد که از پیش نمی‌دانست، و آیا آن پیش‌بینی‌ها تأیید شدند. مکتبی که تعدیل‌هایش پیش‌بینی‌های تازهٔ تأییدشده ساخته پیش‌رونده است؛ مکتبی که تعدیل‌هایش همواره فقط بحرانِ گذشته را پس از وقوع تبیین می‌کنند واپس‌رونده است، هر قدر هم تبیین ظریف باشد."}
}},

gettier:{en:{
line:"You can have a belief that is true, and justified, and still not know — because the justification and the truth were connected only by accident.",
why:"<p>For over two millennia the analysis of knowledge as justified true belief looked secure. It was not really argued for; it was assumed as the obvious starting point. Gettier's three-page paper showed the three conditions are not jointly sufficient, and in doing so created the research programme that has occupied analytic epistemology ever since.</p>",
idea:"<p>The recipe is simple once you see it. Take a belief that is justified but false. Derive from it something that is, by luck, true. The derived belief inherits the justification and gains truth — but the justification is tracking the false premise, not the true conclusion.</p><p>The barn facade variant sharpens it without any false premise. You drive through a county where all but one barn-shaped structure is a film-set facade. You happen to look at the genuine one and believe 'that's a barn'. Your eyesight is fine, your belief is true, and had you looked fifty metres earlier you would have believed the same thing and been wrong.</p><p>What the cases isolate is <b>epistemic luck</b>. Knowledge requires that being right is not an accident, and JTB does not secure that. Every subsequent proposal — no false lemmas, sensitivity, safety, defeasibility, virtue conditions — is an attempt to specify the missing anti-luck ingredient.</p>",
origin:"Edmund Gettier, 'Is Justified True Belief Knowledge?', <i>Analysis</i> (1963) — three pages, two examples, and a career's worth of consequences. Gettier published almost nothing else. Similar cases had appeared in Russell and, much earlier, in medieval Indian and Islamic philosophy, but 1963 is when the problem became a programme.",
obj:[["The cases are contrived. Real inquiry does not throw up barn facades, so the problem is an artefact of philosophers' imaginations.","The structure is not rare at all once you look for it: a method that works for the wrong reason, an indicator that happens to point right, a model correct on this dataset because two errors cancelled. Contrived examples isolate a structure that appears in the wild disguised."],
["We could just accept that knowledge is a vague folk concept and stop trying to analyse it.","Some epistemologists (Williamson) do broadly this, treating knowledge as unanalysable and primitive. But the practical question survives the retreat: you still need to distinguish reliable methods from lucky ones, whatever you call the distinction."]],
confuse:[["Being wrong vs. being accidentally right","Gettier cases involve people who are <i>right</i>. That is what makes them interesting. The failure is in the connection between the grounds and the truth, not in the truth."],
["Justification vs. reliability","In a Gettier case the justification is perfectly good by internalist standards — the person did everything right from the inside. What fails is the external connection. The cases are therefore a strong argument for externalism."]],
mistakes:["Thinking the fix is simply 'require more justification'. Barn facades show you can have all the justification you like and still be lucky.",
"Treating it as a puzzle about words. The anti-luck condition it isolates is what every validation exercise is actually trying to establish."],
check:{q:"A model produced the right forecast last quarter because two specification errors happened to cancel. Is that a Gettier case, and what should you do about it?",
a:"Structurally yes: the output is true, the process was defensible on its face, and the connection between them was accidental. The practical consequence is the important part — the result should not raise your confidence in the model at all, because the mechanism that produced it will not reliably reproduce. This is why Gettier matters outside philosophy: it is the argument for auditing process even when outcomes look good, and especially then."}
},fa:{
line:"می‌توان باوری داشت که هم صادق است و هم موجه، و باز هم ندانست — چون توجیه و صدق تنها به‌تصادف به هم پیوسته بودند.",
why:"<p>بیش از دو هزار سال، تحلیلِ معرفت به‌مثابهٔ باورِ صادقِ موجه استوار می‌نمود. در واقع برایش استدلال نشده بود؛ به‌عنوان نقطهٔ آغازِ بدیهی فرض شده بود. مقالهٔ سه‌صفحه‌ایِ گتیه نشان داد این سه شرط روی‌هم کافی نیستند، و با همین کار برنامهٔ پژوهشی‌ای ساخت که از آن پس معرفت‌شناسیِ تحلیلی را به خود مشغول کرده است.</p>",
idea:"<p>دستورش وقتی ببینیدش ساده است. باوری بگیرید که موجه اما کاذب است. از آن چیزی استنتاج کنید که به‌اقبال، صادق است. باورِ استنتاج‌شده توجیه را به ارث می‌برد و صدق را به دست می‌آورد — اما توجیه، مقدمهٔ کاذب را ردیابی می‌کند نه نتیجهٔ صادق را.</p><p>روایتِ «نمای انبار» بدون هیچ مقدمهٔ کاذبی همین را تیزتر می‌کند. در منطقه‌ای رانندگی می‌کنید که جز یکی، همهٔ سازه‌های انبارمانند دکورِ سینمایی‌اند. اتفاقاً به انبارِ واقعی نگاه می‌کنید و باور می‌کنید «آن یک انبار است». بینایی‌تان سالم است، باورتان صادق، و اگر پنجاه متر زودتر نگاه کرده بودید همان را باور می‌کردید و در اشتباه بودید.</p><p>آنچه این موارد جدا می‌کنند <b>اقبالِ معرفتی</b> است. معرفت اقتضا می‌کند که درست‌بودن تصادفی نباشد، و «باور صادقِ موجه» این را تأمین نمی‌کند. هر پیشنهادِ بعدی — بدون مقدمهٔ کاذب، حساسیت، ایمنی، ابطال‌پذیری، شرط‌های فضیلت — کوششی است برای مشخص‌کردنِ همان مادهٔ گمشدهٔ ضدِاقبال.</p>",
origin:"ادموند گتیه، «آیا باور صادقِ موجه معرفت است؟»، مجلهٔ <i>Analysis</i> (۱۹۶۳) — سه صفحه، دو مثال، و پیامدهایی به‌اندازهٔ یک عمر. گتیه تقریباً چیز دیگری منتشر نکرد. موارد مشابه پیش‌تر نزد راسل و بسیار زودتر در فلسفهٔ هندی و اسلامیِ سده‌های میانه آمده بود، اما ۱۹۶۳ لحظه‌ای است که این مسئله به یک برنامه بدل شد.",
obj:[["این موارد ساختگی‌اند. پژوهشِ واقعی نمای انبار تولید نمی‌کند، پس مسئله محصولِ خیالِ فیلسوفان است.","به‌محضِ آنکه دنبالش بگردید می‌بینید این ساختار اصلاً نادر نیست: روشی که به دلیلِ نادرست کار می‌کند، شاخصی که اتفاقاً درست را نشان می‌دهد، مدلی که روی این مجموعه‌داده درست است چون دو خطا یکدیگر را خنثی کرده‌اند. مثال‌های ساختگی ساختاری را جدا می‌کنند که در طبیعت با لباسِ مبدل ظاهر می‌شود."],
["می‌توانیم بپذیریم که «معرفت» مفهومی عرفی و مبهم است و از تحلیلش دست بکشیم.","برخی معرفت‌شناسان (ویلیامسون) کمابیش همین کار را می‌کنند و معرفت را تحلیل‌ناپذیر و بسیط می‌دانند. اما پرسشِ عملی از این عقب‌نشینی جان به در می‌برد: هنوز باید روش‌های قابل‌اتکا را از روش‌های خوش‌اقبال جدا کنید، هر نامی که بر این تمایز بگذارید."]],
confuse:[["اشتباه‌بودن در برابر تصادفاً درست‌بودن","در موارد گتیه، شخص <i>درست</i> می‌گوید. جذابیت ماجرا همین است. شکست در پیوندِ میان مبنا و صدق است، نه در خودِ صدق."],
["توجیه در برابر وثاقت","در موردِ گتیه، توجیه بر پایهٔ معیارهای درون‌گرایانه کاملاً خوب است — شخص از درون همه‌چیز را درست انجام داده. آنچه شکست می‌خورد پیوندِ بیرونی است. پس این موارد استدلالی نیرومند به سودِ برون‌گرایی‌اند."]],
mistakes:["این پندار که راه‌حل صرفاً «توجیهِ بیشتر» است. نمای انبار نشان می‌دهد می‌توانید هر اندازه توجیه داشته باشید و باز خوش‌اقبال باشید.",
"برخورد با آن به‌مثابهٔ معمایی لفظی. شرطِ ضدِاقبالی که جدا می‌کند، همان چیزی است که هر تمرینِ اعتبارسنجی در واقع می‌کوشد برقرارش کند."],
check:{q:"مدلی فصلِ گذشته پیش‌بینیِ درستی داد چون دو خطای مشخصه‌بندی اتفاقاً یکدیگر را خنثی کردند. آیا این موردِ گتیه است و باید چه کرد؟",
a:"از نظر ساختاری بله: خروجی صادق است، فرایند در ظاهر قابل دفاع بود و پیوندِ میانشان تصادفی. بخشِ مهم پیامدِ عملی است — این نتیجه نباید هیچ اطمینانی به مدل بیفزاید، چون سازوکاری که آن را تولید کرده به‌طور قابل اتکا بازتولید نخواهد شد. اهمیتِ گتیه بیرون از فلسفه همین است: استدلالی است برای بازرسیِ فرایند حتی وقتی نتایج خوب به‌نظر می‌رسند، و به‌ویژه همان وقت."}
}},
bayes:{en:{
line:"Evidence does not prove or disprove — it multiplies your prior odds by a likelihood ratio to give your posterior odds.",
why:"<p>If belief is binary, evidence has to either establish a claim or fail to, and most real evidence does neither. Treating belief as a degree between 0 and 1 dissolves that. Evidence stops being a verdict and becomes a <i>force</i> with a magnitude — and the magnitude is calculable. This is the single most practically useful formal result in epistemology.</p>",
idea:"<p>Learn the odds form, because it is the only version you can run in your head during a conversation: <b>prior odds × likelihood ratio = posterior odds</b>. The likelihood ratio asks how much more probable this observation is if the hypothesis is true than if it is false.</p><p>Two disciplines fall out immediately. First, you must have had a prior. If you cannot state roughly what you believed before seeing the evidence, you were not updating, you were reacting — and you have no way to say how much the evidence moved you. Second, evidence that is equally expected under both hypotheses has a ratio near one and therefore moves nothing, however impressive it looks.</p><p>The rare-disease case is the standard demonstration and remains startling. A test with 99% accuracy, a disease affecting one in ten thousand, a positive result: the posterior is still under 1%. The test did not fail. The intuition that ignores the base rate did.</p>",
origin:"Thomas Bayes' theorem was published posthumously in 1763 and developed far more fully by Laplace. Its interpretation as a norm for <i>rational belief</i>, rather than a fact about frequencies, is twentieth century: Frank Ramsey and Bruno de Finetti independently showed that degrees of belief violating the probability axioms leave you open to a guaranteed loss, which turned the mathematics into an argument about rationality.",
obj:[["Where do the priors come from? Two people with the same data and different priors reach different conclusions and both are coherent.","This is the strongest objection and it does not have a clean answer — it is the trilemma in probabilistic dress. The honest defence is that Bayesianism does not <i>solve</i> the problem but makes the choice explicit, auditable, and testable for sensitivity, which is better than an implicit prior nobody can see."],
["Real problems are computationally intractable and real people cannot do this arithmetic.","Largely true, and Gigerenzer's work shows simple heuristics often match or beat formal updating in natural environments. But the qualitative discipline survives the objection: asking 'what is my prior, and how much does this move it' improves reasoning even when you never compute a number."],
["It treats all uncertainty as probability, but some uncertainty is not quantifiable — Knightian uncertainty, or deep model misspecification.","A serious limitation. Where you do not know the space of hypotheses, there is nothing to put a prior over. Manski's partial-identification work is one response: report honest bounds instead of a false point estimate."]],
confuse:[["P(A|B) and P(B|A)","These are routinely swapped and the swap is the single most consequential error in applied statistics. 'The probability of this data if the null is true' is not 'the probability the null is true given this data'. That confusion is also exactly what a p-value invites."],
["Strength of evidence vs. strength of belief","The likelihood ratio measures the evidence. Your posterior measures your belief, and it depends on the prior too. Strong evidence for an implausible claim can still leave you disbelieving it, and that is correct rather than stubborn."]],
mistakes:["Reporting a posterior without stating the prior it came from. The number is uninterpretable without it.",
"Updating on the same evidence twice because it arrived through two channels that were not independent.",
