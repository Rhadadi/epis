"Treating 'consistent with my hypothesis' as evidence. If it is equally consistent with the rival, the likelihood ratio is one and you have learned nothing."],
check:{q:"A colleague says a new finding 'confirms' the model. What single question tells you how much it actually confirms it?",
a:"How likely was this finding if the model were <i>wrong</i>? That is the denominator of the likelihood ratio, and it is the number nobody computes. If a rival account predicts the same finding roughly as strongly, the ratio is near one and the finding is decoration. Confirmation is not about fit with your hypothesis; it is about the gap between fit with yours and fit with the alternatives."}
},fa:{
line:"شواهد اثبات یا ابطال نمی‌کنند — شانسِ پیشینِ شما را در نسبتِ درست‌نمایی ضرب می‌کنند تا شانسِ پسین به دست آید.",
why:"<p>اگر باور دوگانه باشد، شواهد یا باید ادعایی را اثبات کند یا نکند، و بیشترِ شواهدِ واقعی هیچ‌کدام را نمی‌کنند. درجه‌بندیِ باور میان صفر و یک این بن‌بست را حل می‌کند. شواهد دیگر حکم نیست، <i>نیرویی</i> با اندازه است — و اندازه‌اش محاسبه‌پذیر است. این عملی‌ترین نتیجهٔ صوریِ معرفت‌شناسی است.</p>",
idea:"<p>صورتِ شانس را بیاموزید، چون تنها روایتی است که می‌توانید در میانهٔ گفت‌وگو در ذهن اجرا کنید: <b>شانسِ پیشین × نسبتِ درست‌نمایی = شانسِ پسین</b>. نسبتِ درست‌نمایی می‌پرسد این مشاهده اگر فرضیه صادق باشد چقدر محتمل‌تر است تا وقتی کاذب باشد.</p><p>دو انضباط بی‌درنگ از آن برمی‌آید. نخست، باید پیشینی داشته باشید. اگر نتوانید تقریباً بگویید پیش از دیدنِ شواهد چه باور داشتید، به‌روزرسانی نمی‌کردید، واکنش نشان می‌دادید — و هیچ راهی ندارید بگویید شواهد چقدر شما را جابه‌جا کرد. دوم، شاهدی که تحتِ هر دو فرضیه به یک اندازه انتظار می‌رود نسبتی نزدیک به یک دارد و هیچ چیز را تکان نمی‌دهد، هر قدر هم چشمگیر بنماید.</p><p>موردِ بیماریِ نادر نمایشِ متعارف است و هنوز تکان‌دهنده. آزمونی با دقتِ ۹۹ درصد، بیماری‌ای که یک نفر از هر ده هزار نفر را درگیر می‌کند، و نتیجه‌ای مثبت: احتمالِ پسین هنوز زیرِ یک درصد است. آزمون خطا نکرد. شهودی که نرخِ پایه را نادیده می‌گیرد خطا کرد.</p>",
origin:"قضیهٔ توماس بیز پس از مرگش در ۱۷۶۳ منتشر شد و لاپلاس آن را بسیار کامل‌تر بسط داد. تفسیرِ آن به‌عنوان هنجاری برای <i>باورِ عقلانی</i> — و نه واقعیتی دربارهٔ بسامدها — متعلق به سدهٔ بیستم است: فرانک رمزی و برونو دِفینتی مستقلاً نشان دادند درجاتِ باوری که اصولِ احتمال را نقض کنند شما را در معرضِ باختِ تضمینی می‌گذارند، و همین ریاضیات را به استدلالی دربارهٔ عقلانیت بدل کرد.",
obj:[["احتمالاتِ پیشین از کجا می‌آیند؟ دو نفر با داده‌ای یکسان و پیشین‌های متفاوت به نتایج متفاوت می‌رسند و هر دو سازگارند.","این قوی‌ترین اعتراض است و پاسخِ تمیزی ندارد — همان سه‌راهی است در جامهٔ احتمال. دفاعِ صادقانه این است که بیزگرایی مسئله را <i>حل</i> نمی‌کند بلکه انتخاب را صریح، بازبینی‌پذیر و آزمون‌پذیر از نظر حساسیت می‌سازد، و این بهتر از پیشینی ضمنی است که کسی نمی‌بیندش."],
["مسائلِ واقعی از نظر محاسباتی حل‌نشدنی‌اند و آدم‌های واقعی نمی‌توانند این حساب را انجام دهند.","تا حد زیادی درست است، و کارِ گیگرنزر نشان می‌دهد ابتکارهای ساده اغلب در محیط‌های طبیعی به‌اندازهٔ به‌روزرسانیِ صوری یا بهتر عمل می‌کنند. اما انضباطِ کیفی از این اعتراض جان به در می‌برد: پرسیدنِ «پیشینِ من چیست و این چقدر آن را جابه‌جا می‌کند» حتی وقتی هیچ عددی محاسبه نمی‌کنید استدلال را بهتر می‌کند."],
["همهٔ عدمِ‌قطعیت را احتمال می‌انگارد، اما برخی عدمِ‌قطعیت‌ها کمّی‌شدنی نیستند — عدمِ‌قطعیتِ نایتی، یا بدمشخصه‌بودنِ عمیقِ مدل.","محدودیتی جدی است. آنجا که فضای فرضیه‌ها را نمی‌شناسید، چیزی نیست که رویش پیشین بگذارید. کارِ منسکی دربارهٔ «شناساییِ جزئی» یکی از پاسخ‌هاست: به‌جای برآوردِ نقطه‌ایِ کاذب، کران‌های صادقانه گزارش کنید."]],
confuse:[["P(A|B) و P(B|A)","این دو مرتب جابه‌جا می‌شوند و همین جابه‌جایی پرپیامدترین خطای آمارِ کاربردی است. «احتمالِ این داده اگر فرضِ صفر صادق باشد» با «احتمالِ صادق‌بودنِ فرضِ صفر با داشتنِ این داده» یکی نیست. مقدارِ p دقیقاً به همین خلط دعوت می‌کند."],
["قوّتِ شواهد در برابر قوّتِ باور","نسبتِ درست‌نمایی شواهد را می‌سنجد. احتمالِ پسینِ شما باورتان را می‌سنجد و به پیشین هم وابسته است. شاهدی قوی به سودِ ادعایی نامحتمل می‌تواند همچنان شما را ناباور بگذارد، و این درست است نه لجاجت."]],
mistakes:["گزارشِ احتمالِ پسین بدون بیانِ پیشینی که از آن آمده. آن عدد بدون این تفسیرناپذیر است.",
"به‌روزرسانیِ دوباره بر پایهٔ همان شواهد، چون از دو مجرا رسیده که مستقل نبوده‌اند.",
"شمردنِ «سازگار با فرضیهٔ من» به‌عنوان شاهد. اگر با فرضیهٔ رقیب هم به همان اندازه سازگار باشد، نسبتِ درست‌نمایی یک است و چیزی نیاموخته‌اید."],
check:{q:"همکاری می‌گوید یافته‌ای تازه مدل را «تأیید می‌کند». کدام پرسشِ واحد نشان می‌دهد واقعاً چقدر تأیید می‌کند؟",
a:"اگر مدل <i>نادرست</i> بود، این یافته چقدر محتمل بود؟ این مخرجِ نسبتِ درست‌نمایی است و همان عددی است که کسی محاسبه‌اش نمی‌کند. اگر روایتی رقیب همان یافته را کمابیش به همان قوّت پیش‌بینی کند، نسبت نزدیک به یک است و آن یافته تزئین است. تأیید دربارهٔ جورشدن با فرضیهٔ شما نیست؛ دربارهٔ فاصلهٔ میانِ جورشدن با فرضیهٔ شما و جورشدن با بدیل‌هاست."}
}},

defeat:{en:{
line:"A rebutting defeater attacks the claim; an undercutting defeater attacks the link between your evidence and the claim, leaving the claim untouched.",
why:"<p>Justification is not permanent. New information can remove it, and it can do so in two structurally different ways that people constantly conflate. Pollock's distinction is the most immediately usable idea on this entire map for anyone whose job involves argument, because the two kinds call for completely different responses.</p>",
idea:"<p>A <b>rebutting</b> defeater gives you reason to believe the claim is false. It meets the claim head-on and the two contest the same ground.</p><p>An <b>undercutting</b> defeater does something stranger and more powerful. It grants your evidence entirely and denies that the evidence supports the conclusion. It attacks the <i>connection</i> rather than either endpoint. After a successful undercutter, you are not left believing the opposite — you are left with no belief at all, which is often the more damaging outcome.</p><p>The classic pair: you see a widget that looks red. Rebutting — someone produces a spectrometer reading showing it is blue. Undercutting — someone tells you the room is lit by red light, so red-looking things are red-looking regardless. The second does not tell you the widget's colour. It tells you your evidence never bore on the question.</p>",
origin:"John Pollock, <i>Knowledge and Justification</i> (1974) and later work on defeasible reasoning. The distinction became foundational in AI and formal argumentation theory, where defeasible logics need to represent both kinds of attack, and it also underlies how the law treats impeachment of evidence versus contradiction of it.",
obj:[["The distinction blurs in practice: showing my evidence is unreliable usually gives some reason to doubt the conclusion too.","Often true in degree, but the difference in <i>burden</i> survives. An undercutter needs only to show your route was unsound; a rebutter must supply positive reason for the opposite. They are cheap and expensive respectively, which is why the cheap one is the better move."],
["Undercutting can be abused — any claim can be attacked by casting doubt on its source, indefinitely.","Yes, and this is the mechanism of bad-faith scepticism. The check is symmetry: an undercutter is legitimate only if you would accept the same objection against evidence you like. Isolated demands for rigour are undercutters applied selectively."]],
confuse:[["Rebutting a claim vs. rebutting an argument","You can defeat someone's argument entirely and leave their conclusion standing. Bad arguments for true claims are common, and treating a defeated argument as a defeated conclusion is a basic error."],
["Undercutting vs. straw-manning","An undercutter engages the real evidence and denies its bearing. A straw man replaces the position with a weaker one. The first is a legitimate and powerful move; the second is a failure of engagement."]],
mistakes:["Reaching for rebutting when undercutting is available. Rebutting requires you to establish a positive counter-claim; undercutting only requires you to break the inference, which is far less work and usually more decisive.",
"Missing an undercutter aimed at you, and responding with more of the same evidence. If the objection is that your instrument is miscalibrated, more readings from it change nothing."],
check:{q:"You present a result. A reviewer says the sample was drawn from a period of unusual volatility. Which defeater is that, and what would a good response look like?",
a:"Undercutting. They have not claimed your result is false or produced a contrary estimate; they have claimed your data cannot support the inference because the period is unrepresentative. Responding with more analysis of the same period misses it entirely. A good response either shows the result holds outside that period, shows the volatility does not bear on this particular inference, or concedes the scope restriction — which is a real concession, not a defeat."}
},fa:{
line:"ابطال‌کنندهٔ معارض به خودِ ادعا حمله می‌کند؛ ابطال‌کنندهٔ زیرشکن به پیوندِ میانِ شواهد و ادعا حمله می‌کند و ادعا را دست‌نخورده می‌گذارد.",
why:"<p>توجیه دائمی نیست. اطلاعاتِ تازه می‌تواند آن را از میان بردارد، و این کار را به دو شیوهٔ ساختاراً متفاوت انجام می‌دهد که مردم دائماً با هم خلطشان می‌کنند. تمایزی که پالاک می‌گذارد برای هر کسی که کارش استدلال است بی‌درنگ‌ترین ایدهٔ کاربردیِ تمامِ این نقشه است، چون این دو گونه پاسخ‌های کاملاً متفاوتی می‌طلبند.</p>",
idea:"<p>ابطال‌کنندهٔ <b>معارض</b> به شما دلیل می‌دهد که ادعا کاذب است. رودررو با ادعا روبه‌رو می‌شود و هر دو بر سرِ یک زمین می‌جنگند.</p><p>ابطال‌کنندهٔ <b>زیرشکن</b> کاری غریب‌تر و نیرومندتر می‌کند. شواهدِ شما را یکسره می‌پذیرد و انکار می‌کند که آن شواهد نتیجه را پشتیبانی کنند. به <i>پیوند</i> حمله می‌کند نه به هیچ‌یک از دو سر. پس از یک زیرشکنِ موفق، شما با باورِ مخالف نمی‌مانید — با هیچ باوری نمی‌مانید، و این اغلب ویرانگرتر است.</p><p>جفتِ کلاسیک: قطعه‌ای می‌بینید که قرمز می‌نماید. معارض — کسی قرائتِ طیف‌سنج را نشان می‌دهد که آبی است. زیرشکن — کسی می‌گوید اتاق با نورِ قرمز روشن شده، پس چیزهای قرمزنما در هر حال قرمزنمایند. دومی رنگِ قطعه را به شما نمی‌گوید. می‌گوید شواهدِ شما اصلاً به این پرسش ربطی نداشت.</p>",
origin:"جان پالاک، <i>معرفت و توجیه</i> (۱۹۷۴) و کارهای بعدی‌اش دربارهٔ استدلالِ ابطال‌پذیر. این تمایز در هوش مصنوعی و نظریهٔ صوریِ استدلال بنیادی شد، چون منطق‌های ابطال‌پذیر باید هر دو گونه حمله را بازنمایی کنند، و همچنین زیربنای تفکیکِ حقوقیِ «خدشه بر اعتبارِ دلیل» از «تعارضِ با دلیل» است.",
obj:[["این تمایز در عمل کمرنگ می‌شود: نشان‌دادنِ اینکه شواهدِ من نامعتبر است معمولاً کمی دلیل برای تردید در نتیجه هم می‌دهد.","اغلب تا حدی درست است، اما تفاوت در <i>بار</i> باقی می‌ماند. زیرشکن تنها باید نشان دهد مسیرِ شما ناسالم بوده؛ معارض باید دلیلی ایجابی برای خلافِ آن بیاورد. این دو به‌ترتیب ارزان و گران‌اند، و به همین دلیل ارزان‌تر حرکتِ بهتری است."],
["از زیرشکن می‌توان سوءاستفاده کرد — هر ادعایی را می‌توان با تردیدافکنی در منبعش، تا بی‌نهایت، زیر سؤال برد.","بله، و این سازوکارِ شکاکیتِ بدنیت است. مهارش تقارن است: زیرشکن تنها وقتی مشروع است که همان اعتراض را در برابر شواهدِ موردِ پسندِ خود نیز بپذیرید. «مطالبهٔ گزینشیِ سخت‌گیری» همان زیرشکنی است که یک‌طرفه به کار رفته."]],
confuse:[["ردِ ادعا در برابر ردِ استدلال","می‌توانید استدلالِ کسی را یکسره شکست دهید و نتیجه‌اش سرِ جایش بماند. استدلال‌های بد برای ادعاهای صادق فراوان‌اند، و شمردنِ استدلالِ شکست‌خورده به‌معنای نتیجهٔ شکست‌خورده خطایی پایه‌ای است."],
["زیرشکن در برابر پهلوانِ پنبه","زیرشکن با شواهدِ واقعی درگیر می‌شود و ربطشان را انکار می‌کند. پهلوانِ پنبه موضع را با صورتی ضعیف‌تر جایگزین می‌کند. اولی حرکتی مشروع و نیرومند است؛ دومی ناکامی در درگیرشدن."]],
mistakes:["رفتن سراغِ معارض وقتی زیرشکن در دسترس است. معارض شما را ملزم می‌کند ادعای متقابلی را اثبات کنید؛ زیرشکن تنها شکستنِ استنتاج را می‌طلبد، که کارِ بسیار کمتری است و معمولاً قاطع‌تر.",
"ندیدنِ زیرشکنی که به‌سوی خودتان نشانه رفته و پاسخ‌دادن با شواهدی از همان جنس. اگر اعتراض این است که ابزارِ شما کالیبره نیست، قرائت‌های بیشترِ همان ابزار چیزی را تغییر نمی‌دهد."],
check:{q:"نتیجه‌ای ارائه می‌کنید. داوری می‌گوید نمونه از دوره‌ای با نوسانِ غیرعادی گرفته شده. این کدام ابطال‌کننده است و پاسخِ خوب چه شکلی دارد؟",
a:"زیرشکن. او نگفته نتیجهٔ شما کاذب است و برآوردِ مخالفی هم نداده؛ گفته دادهٔ شما نمی‌تواند این استنتاج را پشتیبانی کند چون آن دوره نماینده نیست. پاسخ‌دادن با تحلیلِ بیشترِ همان دوره کاملاً از هدف دور است. پاسخِ خوب یا نشان می‌دهد نتیجه بیرون از آن دوره هم برقرار است، یا نشان می‌دهد آن نوسان به این استنتاجِ خاص ربطی ندارد، یا محدودیتِ دامنه را می‌پذیرد — که امتیازی واقعی است، نه شکست."}
}},

toulmin:{en:{
line:"Real arguments have six parts, and the one that decides most disputes — the warrant — is almost always left unstated.",
why:"<p>Formal logic represents arguments as premises and a conclusion, which is accurate for mathematics and nearly useless for everything else. Toulmin's complaint was that this apparatus cannot represent the arguments people actually make in law, policy, or science, and so cannot diagnose why they fail. He built a model that can.</p>",
idea:"<p>The six parts: the <b>claim</b> you are advancing; the <b>grounds</b> — the data or facts you offer; the <b>warrant</b>, a general principle licensing the step from grounds to claim; the <b>backing</b> that supports the warrant itself; a <b>qualifier</b> indicating strength ('probably', 'in most cases'); and the <b>rebuttal</b> conditions under which the claim would not hold.</p><p>The warrant is the load-bearing element and it is nearly always implicit, because stating it feels pedantic to the person making the argument. It is also, nine times out of ten, exactly where the disagreement lives. Two people can accept the same data, accept each other's competence, and still disagree completely — because they hold different warrants and neither has said so.</p><p>Diagramming a stuck argument this way converts it from a contest into a question. Once the warrant is on the table, you can ask what backs it, and that is a discussable matter rather than a clash of conclusions.</p>",
origin:"Stephen Toulmin, <i>The Uses of Argument</i> (1958). It was poorly received by logicians, who saw it as a retreat from rigour, and enthusiastically adopted by rhetoric, law, and later AI and argumentation theory. Toulmin's own background was in the philosophy of science, and the model grew out of asking how jurisprudence reasons — which is why it fits regulatory argument so well.",
obj:[["It is a description of argument, not a standard for evaluating one. It tells you the parts, not which arguments are good.","Fair, and Toulmin partly intended this — he thought standards of soundness were field-dependent, varying between law, medicine, and physics. Critics reasonably reply that this makes the model a taxonomy rather than a logic."],
["Warrants can be manufactured after the fact to fit any inference, so making them explicit does not constrain anything.","In practice it constrains a great deal, because a manufactured warrant usually turns out to be one the arguer would not accept in a symmetrical case. Stating it exposes it to that test, which implicit warrants escape."]],
confuse:[["Warrant vs. grounds","Grounds are the specific facts of this case. The warrant is the general principle that makes those facts relevant to this conclusion. 'Unemployment rose' is grounds; 'unemployment is the right measure of this policy's success' is the warrant, and only the second is contested."],
["Warrant vs. backing","The warrant licenses the inferential step. The backing is what supports the warrant itself — statutes, statistical evidence, professional consensus. Disputes often need to go one level deeper than people take them."]],
mistakes:["Arguing about the grounds when the warrant is the disagreement. This produces the familiar exchange where both sides keep producing more data and neither moves.",
"Omitting the qualifier and the rebuttal, which turns a defensible claim into an overclaim that a single counterexample destroys."],
check:{q:"“Compliance costs rose 12% after the rule, so the rule was too burdensome.” Diagram it. Where is the real dispute?",
a:"Claim: the rule was too burdensome. Grounds: costs rose 12%. Warrant, unstated: a 12% cost increase exceeds the benefit, or cost increases are themselves the measure of burden regardless of benefit. That warrant is the whole argument, and it is doing all the work while nobody examines it. Note also the missing qualifier and rebuttal — no acknowledgement of what else could have raised costs in that period. Attacking the 12% is the obvious move and the wrong one; the number is probably right."}
},fa:{
line:"استدلال‌های واقعی شش بخش دارند، و بخشی که بیشترِ نزاع‌ها را تعیین می‌کند — ضمانت — تقریباً همیشه ناگفته می‌ماند.",
why:"<p>منطقِ صوری استدلال را مقدمات و نتیجه می‌داند، که برای ریاضیات دقیق است و برای بقیهٔ چیزها تقریباً بی‌فایده. شکایتِ تولمین این بود که این دستگاه نمی‌تواند استدلال‌هایی را که مردم واقعاً در حقوق، سیاست‌گذاری یا علم می‌کنند بازنمایی کند، و در نتیجه نمی‌تواند تشخیص دهد چرا شکست می‌خورند. او مدلی ساخت که می‌تواند.</p>",
idea:"<p>شش بخش: <b>ادعایی</b> که پیش می‌نهید؛ <b>شواهد</b> — داده‌ها یا واقعیت‌هایی که ارائه می‌کنید؛ <b>ضمانت</b>، اصلی کلی که گذر از شواهد به ادعا را مجاز می‌کند؛ <b>پشتوانه‌ای</b> که خودِ ضمانت را تأیید می‌کند؛ <b>قید</b>ی که قوّت را نشان می‌دهد («احتمالاً»، «در بیشترِ موارد»)؛ و شرایطِ <b>نقض</b> که در آن‌ها ادعا برقرار نخواهد بود.</p><p>ضمانت عنصرِ باربر است و تقریباً همیشه ضمنی می‌ماند، چون بیانِ آن به‌نظرِ گویندهٔ استدلال موشکافانه و زائد می‌رسد. و نُه بار از ده بار، دقیقاً همان‌جاست که اختلاف زندگی می‌کند. دو نفر می‌توانند یک دادهٔ واحد را بپذیرند، شایستگیِ یکدیگر را بپذیرند و باز کاملاً اختلاف داشته باشند — چون ضمانت‌های متفاوتی دارند و هیچ‌یک آن را نگفته است.</p><p>نمودارکردنِ یک بحثِ بی‌فرجام به این شیوه، آن را از رقابت به پرسش بدل می‌کند. همین‌که ضمانت روی میز آمد، می‌توانید بپرسید چه چیزی پشتیبانی‌اش می‌کند، و این موضوعی قابل بحث است نه برخوردِ دو نتیجه.</p>",
origin:"استیون تولمین، <i>کاربردهای استدلال</i> (۱۹۵۸). منطق‌دانان بد از آن استقبال کردند و آن را عقب‌نشینی از دقت دانستند، و بلاغت، حقوق و بعدها هوش مصنوعی و نظریهٔ استدلال با شور پذیرفتندش. پیشینهٔ خودِ تولمین در فلسفهٔ علم بود و این مدل از پرسیدنِ اینکه فقه و حقوق چگونه استدلال می‌کنند بیرون آمد — و به همین دلیل با استدلالِ مقرراتی چنین خوب جور درمی‌آید.",
obj:[["این توصیفِ استدلال است نه معیاری برای ارزیابیِ آن. بخش‌ها را می‌گوید، نه اینکه کدام استدلال خوب است.","منصفانه است، و تولمین تا حدی همین را در نظر داشت — او معیارهای درستی را وابسته به حوزه می‌دانست که میان حقوق، پزشکی و فیزیک فرق می‌کند. منتقدان به‌درستی پاسخ می‌دهند که این مدل را به رده‌بندی بدل می‌کند نه منطق."],
["ضمانت‌ها را می‌توان پس از واقعه ساخت تا با هر استنتاجی جور دربیایند، پس صریح‌کردنشان چیزی را محدود نمی‌کند.","در عمل بسیار محدود می‌کند، چون ضمانتِ ساختگی معمولاً از آب درمی‌آید که خودِ گوینده آن را در موردی متقارن نمی‌پذیرد. بیانِ آن، در معرضِ همین آزمون قرارش می‌دهد، و ضمانت‌های ضمنی از این آزمون می‌گریزند."]],
confuse:[["ضمانت در برابر شواهد","شواهد واقعیت‌های مشخصِ این مورد است. ضمانت اصلِ کلی‌ای است که آن واقعیت‌ها را به این نتیجه مربوط می‌کند. «بیکاری بالا رفت» شاهد است؛ «بیکاری سنجهٔ درستِ موفقیتِ این سیاست است» ضمانت است، و تنها دومی محلِ نزاع است."],
["ضمانت در برابر پشتوانه","ضمانت گامِ استنتاجی را مجاز می‌کند. پشتوانه آن چیزی است که خودِ ضمانت را تأیید می‌کند — قوانین، شواهدِ آماری، اجماعِ حرفه‌ای. نزاع‌ها اغلب باید یک لایه عمیق‌تر از آنچه مردم می‌برند بروند."]],
mistakes:["بحث بر سرِ شواهد وقتی اختلاف بر سرِ ضمانت است. نتیجه همان گفت‌وگوی آشناست که هر دو طرف مدام دادهٔ بیشتری می‌آورند و هیچ‌کس جابه‌جا نمی‌شود.",
"حذفِ قید و شرطِ نقض، که ادعایی قابل دفاع را به ادعایی گزاف بدل می‌کند که یک نمونهٔ نقض ویرانش می‌کند."],
check:{q:"«هزینه‌های انطباق پس از این قاعده ۱۲ درصد بالا رفت، پس قاعده بیش از حد سنگین بود.» نمودارش کنید. نزاعِ واقعی کجاست؟",
a:"ادعا: قاعده بیش از حد سنگین بود. شواهد: هزینه‌ها ۱۲ درصد بالا رفت. ضمانتِ ناگفته: افزایشِ ۱۲ درصدیِ هزینه از فایده بیشتر است، یا افزایشِ هزینه صرف‌نظر از فایده خودْ سنجهٔ سنگینی است. همان ضمانت تمامِ استدلال است و تمامِ کار را می‌کند در حالی که کسی وارسی‌اش نمی‌کند. به نبودِ قید و شرطِ نقض هم توجه کنید — هیچ اشاره‌ای به اینکه در آن دوره چه چیزِ دیگری می‌توانست هزینه را بالا ببرد. حمله به عددِ ۱۲ درصد حرکتِ بدیهی و نادرست است؛ آن عدد احتمالاً درست است."}
}},

echo:{en:{
line:"A bubble merely leaves opposing voices out; an echo chamber actively discredits them — so exposure fixes the first and strengthens the second.",
why:"<p>The standard diagnosis of political and professional polarisation is that people are not hearing the other side, and the standard prescription follows: expose them to it. That prescription frequently fails and sometimes backfires. Nguyen's argument is that we have been treating two structurally different phenomena as one, and the remedy for each is close to the opposite of the remedy for the other.</p>",
idea:"<p>An <b>epistemic bubble</b> is a structure of omission. Through self-selection, algorithmic filtering, or simple social geography, certain voices never reach you. You are not hostile to them; you have not encountered them. Bubbles are fragile — a single serious encounter with a well-informed dissenter can pop one.</p><p>An <b>echo chamber</b> is a structure of active discrediting. Outside sources are not absent; they have been pre-emptively characterised as biased, corrupt, or captured. The member has heard the other side and has been supplied, in advance, with a reason to dismiss it.</p><p>The consequence is that an echo chamber is <b>reinforced</b> by contrary evidence. The framework predicted you would encounter hostile claims from those sources, so encountering them confirms the framework. This is why 'just show people other views' can make things worse: applied to an echo chamber it is not a corrective but a scheduled confirmation.</p><p>Nguyen's proposed remedy for echo chambers is not more information but a rebuilding of trust — closer in structure to Cartesian doubt, a wholesale reboot of one's credibility assignments, than to any exchange of arguments.</p>",
origin:"C. Thi Nguyen, 'Echo Chambers and Epistemic Bubbles', <i>Episteme</i> (2020). Nguyen works on trust, games, and the aesthetics of agency, and the paper's force comes from treating the echo chamber as a <i>rational</i> structure — its members are not stupid, they are operating a coherent credibility system that happens to be self-sealing.",
obj:[["The distinction is a spectrum, not a binary. Most real communities do some omitting and some discrediting.","Nguyen accepts this. The value of the distinction is diagnostic rather than taxonomic: it tells you which mechanism dominates in a given case, and therefore which intervention has a chance of working."],
["Every community, including scientific ones, assigns lower credibility to outside sources. What makes an echo chamber different from justified expert gatekeeping?","This is the hardest question in the area and Nguyen does not fully settle it. The proposed marks are whether the discrediting is <i>pre-emptive</i> and <i>unfalsifiable</i> — whether any evidence from the outside source could ever count, and whether the credibility rules are applied symmetrically."]],
confuse:[["Echo chamber vs. filter bubble","'Filter bubble' in the popular sense is Nguyen's epistemic bubble — an omission structure produced by algorithms. It is the easier problem and the one most of the public discussion is actually about."],
["Echo chamber vs. groupthink","Groupthink is a failure of deliberation inside a group under pressure to agree. An echo chamber is a structure of <i>credibility assignment</i> toward outsiders. A group can have vigorous internal disagreement and still be an echo chamber."]],
mistakes:["Diagnosing an echo chamber and then prescribing exposure. That is the one intervention the structure is built to metabolise.",
"Assuming you are only ever on the outside of one. The structure is invisible from within, and professional communities are not exempt."],
check:{q:"How would you tell, from inside, whether your own field is an echo chamber rather than merely a bubble?",
a:"Ask whether your field has a standing account of why its usual critics are not worth taking seriously — and then ask whether that account is falsifiable. If there is a ready explanation for why critics from a given direction are motivated, unserious, or captured, and no evidence from that direction could ever survive it, that is the signature. The bubble test is easier: have you actually read the best version of the outside case, or only summaries produced by people inside?"}
},fa:{
line:"حباب صرفاً صداهای مخالف را کنار می‌گذارد؛ اتاقِ پژواک فعالانه بی‌اعتبارشان می‌کند — پس مواجهه اولی را درمان و دومی را تقویت می‌کند.",
why:"<p>تشخیصِ متعارف دربارهٔ قطبی‌شدنِ سیاسی و حرفه‌ای این است که مردم طرفِ دیگر را نمی‌شنوند، و نسخهٔ متعارف از پیِ آن می‌آید: در معرضش قرارشان دهید. این نسخه مکرر شکست می‌خورد و گاه نتیجهٔ عکس می‌دهد. استدلالِ نگوین این است که ما دو پدیدهٔ ساختاراً متفاوت را یکی گرفته‌ایم، و درمانِ هر یک تقریباً عکسِ درمانِ دیگری است.</p>",
idea:"<p><b>حبابِ معرفتی</b> ساختاری از حذف است. با خودگزینی، فیلترِ الگوریتمی یا صرفاً جغرافیای اجتماعی، برخی صداها هرگز به شما نمی‌رسند. با آن‌ها خصومت ندارید؛ با آن‌ها روبه‌رو نشده‌اید. حباب‌ها شکننده‌اند — یک مواجههٔ جدی با مخالفی آگاه می‌تواند یکی را بترکاند.</p><p><b>اتاقِ پژواک</b> ساختاری از بی‌اعتبارسازیِ فعال است. منابعِ بیرونی غایب نیستند؛ از پیش سوگیرانه، فاسد یا خریداری‌شده معرفی شده‌اند. عضو، طرفِ دیگر را شنیده و پیشاپیش دلیلی برای رد کردنش دریافت کرده است.</p><p>پیامد این است که اتاقِ پژواک با شواهدِ مخالف <b>تقویت</b> می‌شود. چارچوب پیش‌بینی کرده بود که با ادعاهای خصمانه از آن منابع روبه‌رو خواهید شد، پس روبه‌روشدن با آن‌ها چارچوب را تأیید می‌کند. به همین دلیل «فقط دیدگاه‌های دیگر را نشانشان دهید» می‌تواند اوضاع را بدتر کند: در برابر اتاقِ پژواک این نه اصلاح، که تأییدی از پیش زمان‌بندی‌شده است.</p><p>درمانی که نگوین برای اتاقِ پژواک پیشنهاد می‌کند اطلاعاتِ بیشتر نیست بلکه بازسازیِ اعتماد است — از نظر ساختاری نزدیک‌تر به شکِ دکارتی، یعنی راه‌اندازیِ دوبارهٔ کلِ نظامِ اعتباربخشی، تا به هر تبادلِ استدلالی.</p>",
origin:"سی. تی. نگوین، «اتاق‌های پژواک و حباب‌های معرفتی»، <i>Episteme</i> (۲۰۲۰). نگوین بر اعتماد، بازی و زیبایی‌شناسیِ عاملیت کار می‌کند، و قوّتِ این مقاله از آنجاست که اتاقِ پژواک را ساختاری <i>عقلانی</i> می‌داند — اعضایش نادان نیستند، نظامِ اعتباربخشیِ منسجمی را اجرا می‌کنند که اتفاقاً خودبسته است.",
obj:[["این تمایز طیفی است نه دوگانه. بیشترِ جوامعِ واقعی هم اندکی حذف می‌کنند و هم اندکی بی‌اعتبارسازی.","نگوین این را می‌پذیرد. ارزشِ این تمایز تشخیصی است نه رده‌بندانه: می‌گوید در هر مورد کدام سازوکار غالب است، و بنابراین کدام مداخله شانسِ کارکردن دارد."],
["هر جامعه‌ای، از جمله جوامعِ علمی، به منابعِ بیرونی اعتبارِ کمتری می‌دهد. چه چیزی اتاقِ پژواک را از دروازه‌بانیِ موجهِ تخصصی جدا می‌کند؟","دشوارترین پرسشِ این حوزه است و نگوین کاملاً حلش نمی‌کند. نشانه‌های پیشنهادی این‌اند که آیا بی‌اعتبارسازی <i>پیشاپیش</i> و <i>ابطال‌ناپذیر</i> است — آیا هیچ شاهدی از آن منبع می‌تواند به‌حساب بیاید، و آیا قواعدِ اعتباربخشی متقارن اعمال می‌شوند."]],
confuse:[["اتاقِ پژواک در برابر حبابِ فیلتر","«حبابِ فیلتر» در معنای رایج همان حبابِ معرفتیِ نگوین است — ساختاری از حذف که الگوریتم‌ها می‌سازند. مسئلهٔ آسان‌تر است و بیشترِ بحثِ عمومی در واقع دربارهٔ همان است."],
["اتاقِ پژواک در برابر گروه‌اندیشی","گروه‌اندیشی ناکامیِ مشورت درونِ گروهی است که زیرِ فشارِ توافق قرار دارد. اتاقِ پژواک ساختاری از <i>اعتباربخشی</i> نسبت به بیرونی‌هاست. گروهی می‌تواند اختلافِ درونیِ پرشور داشته باشد و همچنان اتاقِ پژواک باشد."]],
mistakes:["تشخیصِ اتاقِ پژواک و سپس تجویزِ مواجهه. این تنها مداخله‌ای است که آن ساختار برای هضمش ساخته شده.",
"این فرض که شما همیشه بیرونِ یکی از آن‌ها ایستاده‌اید. این ساختار از درون نامرئی است، و جوامعِ حرفه‌ای مستثنا نیستند."],
check:{q:"چگونه از درون تشخیص می‌دهید که رشتهٔ خودتان اتاقِ پژواک است نه صرفاً حباب؟",
a:"بپرسید آیا رشتهٔ شما روایتی آماده دارد دربارهٔ اینکه چرا منتقدانِ همیشگی‌اش ارزشِ جدی‌گرفتن ندارند — و سپس بپرسید آیا آن روایت ابطال‌پذیر است. اگر توضیحی حاضر و آماده هست که چرا منتقدانِ یک جهتِ معین انگیزه‌مند، غیرجدی یا خریداری‌شده‌اند، و هیچ شاهدی از آن جهت نمی‌تواند از آن جان به در ببرد، این همان امضاست. آزمونِ حباب آسان‌تر است: آیا واقعاً بهترین صورتِ استدلالِ بیرونی را خوانده‌اید، یا فقط خلاصه‌هایی را که درونی‌ها نوشته‌اند؟"}
}},

moore:{en:{
line:"An argument only succeeds if its premises are more credible than the denial of its conclusion — so when a valid argument reaches an absurd conclusion, you may reject a premise before identifying which one.",
why:"<p>Sceptical arguments are valid and built from plausible premises, yet nobody believes their conclusions. That combination looks like a paradox demanding a technical solution. Moore's response reframes it: an argument is a transaction in credibility, and you are always entitled to run the transaction in whichever direction preserves more of it.</p>",
idea:"<p>Consider the sceptical argument: (1) I do not know I am not a brain in a vat; (2) if I do not know that, I do not know I have hands; so (3) I do not know I have hands. Moore observed that this can be turned around. Since I <i>do</i> know I have hands — and I know it far more securely than I know premise (1) — I may run modus tollens the other way and conclude that premise (1) is false.</p><p>The general principle is what matters, and it generalises far past scepticism. Validity transmits credibility from premises to conclusion, but it also transmits <i>incredibility</i> backwards from conclusion to premises. If the conclusion is less believable than the premises are believable, the argument has refuted one of its own premises rather than establishing anything.</p><p>Crucially, you are entitled to this move <b>before</b> you can say which premise fails. Locating the error is a separate and often harder task, and you need not complete it in order to reject the conclusion.</p>",
origin:"G.E. Moore, 'Proof of an External World' (1939), where he famously held up one hand and then the other. The gesture was mocked as evading the argument; Moore's actual point was methodological and precise, and it has since been formalised in discussions of what philosophers call the 'Moorean shift' or 'credence-based argument assessment'.",
obj:[["It tells you the argument fails without telling you how. That is unsatisfying and possibly question-begging: the sceptic denies exactly what Moore claims to know.","This is a genuine limitation, not a rhetorical one. Moore's reply is that dialectical effectiveness is not the only virtue — the argument shows you should not <i>believe</i> the sceptical conclusion, even if it does not show the sceptic where they erred."],
["The move can license motivated reasoning: reject any premise leading somewhere you dislike.","The safeguard is that the test is comparative and must be applied honestly. You must genuinely find the conclusion less credible than the premises, and you must accept the same standard when someone applies it against a conclusion you favour. Used symmetrically it disciplines; used selectively it is just refusal."]],
confuse:[["Moorean response vs. denying the conclusion","Anyone can deny a conclusion. Moore's move is structured: it requires that the conclusion's implausibility genuinely exceeds the premises' plausibility, and it treats the argument as thereby having refuted a premise. That is a claim about relative credibility, not a shrug."],
["Moore's paradox","A different thing entirely, though also his: the oddity of asserting 'it is raining but I do not believe it is raining'. Unrelated to the Moorean shift despite the shared name."]],
mistakes:["Using it as a conversation-ender rather than as a starting point. The right follow-up is to go hunting for the faulty premise, having established that there is one.",
"Applying it to conclusions that are merely unwelcome rather than genuinely incredible. Unpalatable is not the same as absurd, and the whole force of the move depends on that difference."],
check:{q:"A chain of individually reasonable modelling assumptions yields the result that a policy has no cost at all. You cannot find the error. What are you entitled to conclude?",
a:"That at least one assumption is wrong, and you may say so publicly before locating it. The zero-cost conclusion is far less credible than any of the individual assumptions is credible, so the argument has refuted one of its own inputs rather than established its output. What you are <i>not</i> entitled to do is nominate a convenient assumption as the culprit without evidence — Moore licenses rejecting the conclusion, not choosing which premise to blame."}
},fa:{
line:"استدلال تنها زمانی موفق است که مقدماتش باورپذیرتر از انکارِ نتیجه‌اش باشند — پس وقتی استدلالی معتبر به نتیجه‌ای پوچ می‌رسد، می‌توانید مقدمه‌ای را پیش از شناساییِ آن رد کنید.",
why:"<p>استدلال‌های شکاکانه معتبرند و از مقدماتی موجه ساخته شده‌اند، و با این حال کسی نتایجشان را باور ندارد. این ترکیب شبیهِ پارادوکسی می‌نماید که راه‌حلی فنی می‌طلبد. پاسخِ مورى صورت‌مسئله را عوض می‌کند: استدلال معامله‌ای بر سرِ باورپذیری است، و شما همواره حق دارید معامله را در جهتی اجرا کنید که باورپذیریِ بیشتری حفظ شود.</p>",
idea:"<p>استدلالِ شکاکانه را در نظر بگیرید: (۱) نمی‌دانم که مغزی در خمره نیستم؛ (۲) اگر آن را ندانم، نمی‌دانم که دست دارم؛ پس (۳) نمی‌دانم که دست دارم. مورى دریافت که این را می‌توان وارونه کرد. چون <i>می‌دانم</i> که دست دارم — و آن را بسیار مطمئن‌تر از مقدمهٔ (۱) می‌دانم — می‌توانم رفعِ تالی را در جهتِ دیگر اجرا کنم و نتیجه بگیرم که مقدمهٔ (۱) کاذب است.</p><p>آنچه اهمیت دارد اصلِ کلی است، و بسیار فراتر از شکاکیت تعمیم می‌یابد. اعتبار، باورپذیری را از مقدمات به نتیجه منتقل می‌کند، اما <i>باورناپذیری</i> را نیز از نتیجه به مقدمات بازمی‌گرداند. اگر نتیجه کم‌باورپذیرتر از باورپذیریِ مقدمات باشد، آن استدلال به‌جای اثباتِ چیزی، یکی از مقدماتِ خودش را ابطال کرده است.</p><p>مهم‌تر آنکه شما <b>پیش از</b> آنکه بتوانید بگویید کدام مقدمه خطاست به این حرکت مجازید. یافتنِ خطا کاری جداگانه و اغلب دشوارتر است، و برای ردِ نتیجه لازم نیست آن را تمام کنید.</p>",
origin:"جی. ای. مورى، «اثباتِ جهانِ خارج» (۱۹۳۹)، آنجا که به‌طور مشهور یک دست و سپس دستِ دیگر را بالا برد. این حرکت را طفره از استدلال خواندند و مسخره کردند؛ نکتهٔ واقعیِ مورى روش‌شناختی و دقیق بود، و از آن پس در بحث‌هایی که فیلسوفان «چرخشِ مورى‌وار» یا «ارزیابیِ استدلال بر پایهٔ درجهٔ باور» می‌نامند صورت‌بندی شده است.",
obj:[["می‌گوید استدلال شکست خورده بی‌آنکه بگوید چگونه. این ارضاکننده نیست و شاید مصادره به مطلوب باشد: شکاک دقیقاً همان چیزی را انکار می‌کند که مورى ادعا می‌کند می‌داند.","این محدودیتی واقعی است نه بلاغی. پاسخِ مورى این است که اثربخشیِ جدلی تنها فضیلت نیست — استدلال نشان می‌دهد که نباید نتیجهٔ شکاکانه را <i>باور</i> کنید، حتی اگر به شکاک نشان ندهد کجا خطا کرده است."],
["این حرکت می‌تواند مجوزِ استدلالِ انگیزه‌مند شود: هر مقدمه‌ای را که به جایی ناخوشایند می‌رسد رد کنید.","محافظ این است که آزمون مقایسه‌ای است و باید صادقانه اعمال شود. باید واقعاً نتیجه را کم‌باورپذیرتر از مقدمات بیابید، و باید همان معیار را وقتی کسی آن را علیه نتیجهٔ موردِ پسندِ شما به کار می‌برد بپذیرید. اگر متقارن به کار رود منضبط می‌کند؛ اگر گزینشی به کار رود صرفاً امتناع است."]],
confuse:[["پاسخِ مورى در برابر انکارِ نتیجه","هر کسی می‌تواند نتیجه‌ای را انکار کند. حرکتِ مورى ساختارمند است: اقتضا می‌کند که باورناپذیریِ نتیجه واقعاً از باورپذیریِ مقدمات بیشتر باشد، و آن استدلال را از این رهگذر ابطال‌کنندهٔ یکی از مقدماتِ خود می‌داند. این ادعایی است دربارهٔ باورپذیریِ نسبی، نه شانه بالا انداختن."],
["پارادوکسِ مورى","چیزی یکسره متفاوت، هرچند آن هم از اوست: غرابتِ گفتنِ «باران می‌بارد اما باور ندارم که می‌بارد». با چرخشِ مورى‌وار بی‌ارتباط است، با وجودِ اشتراکِ نام."]],
mistakes:["به‌کارگیریِ آن به‌عنوان پایان‌دهندهٔ گفت‌وگو به‌جای نقطهٔ آغاز. پیگیریِ درست این است که پس از اثباتِ وجودِ مقدمهٔ معیوب، به شکارِ آن بروید.",
"اعمالِ آن بر نتایجی که صرفاً ناخوشایندند نه واقعاً باورناپذیر. «ناگوار» با «پوچ» یکی نیست، و تمامِ نیروی این حرکت به همین تفاوت وابسته است."],
check:{q:"زنجیره‌ای از فرض‌های مدل‌سازیِ فی‌نفسه معقول به این نتیجه می‌رسد که یک سیاست اصلاً هزینه‌ای ندارد. خطا را نمی‌یابید. مجازید چه نتیجه بگیرید؟",
a:"اینکه دست‌کم یکی از فرض‌ها نادرست است، و می‌توانید پیش از یافتنش این را علنی بگویید. نتیجهٔ «هزینهٔ صفر» بسیار کم‌باورپذیرتر از باورپذیریِ هر یک از فرض‌هاست، پس استدلال به‌جای اثباتِ خروجی‌اش یکی از ورودی‌های خود را ابطال کرده. آنچه مجاز <i>نیستید</i> این است که بی‌دلیل فرضی را که به‌سودتان است مقصر بنامید — مورى ردِ نتیجه را مجاز می‌کند، نه انتخابِ مقدمه‌ای که تقصیر را گردنش بیندازید."}
}}

const R2={"infin":{"en":{"line":"Justification need not terminate: a belief can be supported by an endless, non-repeating chain of further reasons.","why":"<p>The regress problem seems to force a choice between circularity and an arbitrary stopping point. Infinitism exists to show that the first horn—an endless regress—need not be a defect. If reasons can remain available without ever reaching a final foundation, foundationalism loses its claim to be the only way to avoid arbitrariness.</p>","origin":"Peter Klein developed the contemporary view in response to the epistemic regress problem. The target is the assumption shared by foundationalists and many coherentists that justification must be completed by a finite structure. Infinitism instead treats justification as potentially inexhaustible.","obj":[["Finite people cannot possess or consciously rehearse infinitely many reasons, so nobody could ever be justified.","Klein distinguishes having justification from actively entertaining every supporting reason. What matters is that further, non-circular reasons are available when challenged, not that the entire chain be simultaneously present in working memory."],["An infinite chain never finishes the justificatory job; postponing the answer forever is not answering it.","The infinitist denies that justification is the sort of task that must be completed. Each new reason can increase support without a final reason conferring a special foundational status. The critic therefore has to argue that completion is required, not merely assume it."]],"confuse":[["Infinite regress as a refutation","Infinitism is precisely the view that regress is not automatically vicious. Saying 'that leads to an infinite regress' only names the structure; it does not yet show why that structure fails."],["Coherentism","Coherentism allows mutual support in a web. Infinitism requires a non-repeating sequence of reasons and therefore rejects circular support rather than rehabilitating it."]],"mistakes":["Assuming an agent must actually state infinitely many reasons before any justification exists.","Treating every regress as vicious without specifying what makes this regress epistemically defective."],"check":{"q":"You ask for a reason, then a reason for that reason, and your colleague says there is always another independently available reason but no final premise. Which response to the trilemma is this, and what must it avoid?","a":"Infinitism. It accepts the regress horn but must keep the chain non-circular and explain how finite agents can be justified by reasons they do not all consciously possess at once."}},"fa":{"line":"توجیه لازم نیست پایان یابد: یک باور می‌تواند با زنجیره‌ای بی‌پایان و غیرتکراری از دلایلِ بیشتر پشتیبانی شود.","why":"<p>مسئلهٔ تسلسل ظاهراً ما را میان دور و توقفی دلبخواهی گیر می‌اندازد. تسلسل‌گرایی برای نشان‌دادنِ این نکته پدید می‌آید که شاخِ نخست — زنجیرهٔ بی‌پایان — لزوماً نقص نیست. اگر دلایل بتوانند همواره در دسترس باشند بی‌آنکه به بنیادی نهایی برسند، مبناگرایی دیگر نمی‌تواند ادعا کند تنها راهِ گریز از دلبخواهی است.</p>","origin":"پیتر کلاین صورتِ معاصرِ این موضع را در پاسخ به مسئلهٔ تسلسلِ معرفتی بسط داد. هدف، این فرضِ مشترکِ بسیاری از مبناگرایان و انسجام‌گرایان است که توجیه باید در ساختاری متناهی «کامل» شود. تسلسل‌گرایی توجیه را بالقوه پایان‌ناپذیر می‌داند.","obj":[["انسانِ متناهی نمی‌تواند بی‌نهایت دلیل را در اختیار یا در ذهن داشته باشد؛ پس هیچ‌کس هرگز موجه نمی‌شود.","کلاین میان داشتنِ توجیه و حاضرکردنِ آگاهانهٔ تمام دلایل فرق می‌گذارد. کافی است هنگامِ چالش دلایلِ بیشتر و غیردوری در دسترس باشند؛ لازم نیست کلِ زنجیره هم‌زمان در حافظهٔ کاری حاضر باشد."],["زنجیرهٔ بی‌پایان هیچ‌وقت کارِ توجیه را تمام نمی‌کند؛ عقب‌انداختنِ پاسخ تا ابد پاسخ‌دادن نیست.","تسلسل‌گرا انکار می‌کند که توجیه کاری باشد که حتماً باید «تمام» شود. هر دلیلِ تازه می‌تواند پشتیبانی را افزایش دهد بی‌آنکه دلیلِ نهایی شأنی بنیادین پیدا کند. بنابراین منتقد باید ضرورتِ پایان را استدلال کند، نه فرض."]],"confuse":[["تسلسلِ بی‌پایان به‌عنوان ابطال","تسلسل‌گرایی دقیقاً می‌گوید هر تسلسلی معیوب نیست. جملهٔ «این به تسلسل می‌رسد» فقط ساختار را نام می‌برد و هنوز نشان نداده چرا آن ساختار شکست است."],["انسجام‌گرایی","انسجام‌گرایی پشتیبانیِ متقابل در یک شبکه را می‌پذیرد. تسلسل‌گرایی زنجیره‌ای غیرتکراری می‌خواهد و بنابراین دور را رد می‌کند، نه اینکه آن را بازتفسیر کند."]],"mistakes":["فرض‌کردنِ اینکه عامل باید پیش از هر توجیهی عملاً بی‌نهایت دلیل را بیان کند.","بدیهی‌گرفتنِ معیوب‌بودنِ هر تسلسل بدون توضیحِ اینکه این تسلسل خاص چرا از نظر معرفتی بد است."],"check":{"q":"از کسی دلیل می‌خواهید، سپس دلیلِ آن دلیل را، و او می‌گوید همیشه دلیلِ مستقلِ دیگری در دسترس است اما مقدمهٔ نهایی وجود ندارد. این کدام پاسخ به سه‌راهی است و باید از چه چیزی پرهیز کند؟","a":"تسلسل‌گرایی. شاخِ تسلسل را می‌پذیرد اما باید زنجیره را غیردوری نگه دارد و توضیح دهد چگونه عاملِ متناهی می‌تواند با دلایلی که همه را هم‌زمان در ذهن ندارد موجه باشد."}}},"coher":{"en":{"line":"A belief is justified by fitting into a mutually supporting web of beliefs, not by tracing back to a privileged foundation.","why":"<p>If linear chains either regress forever or stop arbitrarily, one response is to reject the chain picture. Coherentism treats justification as a property of a system: consistency, explanatory integration, and mutual support can make the whole web more credible even though no single belief sits outside the web as its foundation.</p>","origin":"Laurence BonJour is a central contemporary defender; Quine popularized the web-of-belief image, and Neurath supplied the ship-at-sea metaphor. The view pushes against foundationalism and the idea that some beliefs must possess a special non-inferential privilege.","obj":[["A perfectly coherent fairy tale can be false, so coherence does not guarantee contact with reality.","Coherentists usually answer that epistemic coherence is richer than mere logical consistency: it includes explanatory power, comprehensiveness, and especially integration of perceptual and experiential inputs. The objection remains a pressure to explain why those inputs constrain the web rather than merely join it."],["Mutual support looks circular: belief A supports B and B supports A.","The coherentist replies that system-level support is not the same as a two-premise vicious circle. The claim is holistic: justification supervenes on the structure of many relations across the network. Critics then ask how much circularity can be tolerated before the distinction collapses."]],"confuse":[["Coherence theory of truth","Epistemic coherentism is a theory of justification. You can say coherence justifies a belief while still holding that truth itself is correspondence with reality."],["Consensus","A group can agree because everyone copied the same source. Coherence requires evidential and explanatory relations, not merely social agreement or repeated assertion."]],"mistakes":["Counting many dependent pieces of evidence as independent strands in the web.","Treating absence of contradiction as sufficient; a thin but consistent story can still explain very little and connect poorly to experience."],"check":{"q":"Five studies point the same way, but all use the same database, same coding rule, and same identification assumption. Does coherentism automatically give you five strands of support?","a":"No. The web is strong only if the strands supply genuinely different support. Shared dependencies can make apparent coherence one assumption echoed five times; the independence structure matters."}},"fa":{"line":"یک باور به‌سببِ جاگرفتن در شبکه‌ای از باورهای پشتیبانِ یکدیگر موجه می‌شود، نه به‌سببِ رسیدن به بنیادی ممتاز.","why":"<p>اگر زنجیره‌های خطی یا تا بی‌نهایت بروند یا دلبخواهی متوقف شوند، یک پاسخ این است که تصویرِ «زنجیره» را کنار بگذاریم. انسجام‌گرایی توجیه را ویژگیِ یک نظام می‌داند: سازگاری، یکپارچگیِ تبیینی و پشتیبانیِ متقابل می‌تواند کلِ شبکه را معتبرتر کند، هرچند هیچ باورِ منفردی بیرون از شبکه به‌عنوان بنیاد ننشسته باشد.</p>","origin":"لارنس بونژور از مدافعانِ مهمِ معاصر است؛ کواین تصویرِ «شبکهٔ باور» را مشهور کرد و نویرات استعارهٔ کشتی در دریا را داد. موضع علیه مبناگرایی و این ایده است که برخی باورها باید امتیازی خاص و غیراستنتاجی داشته باشند.","obj":[["یک افسانه می‌تواند کاملاً منسجم و در عین حال کاذب باشد؛ پس انسجام تماس با واقعیت را تضمین نمی‌کند.","انسجام‌گرایان معمولاً می‌گویند انسجامِ معرفتی بیش از سازگاریِ منطقی است: قدرتِ تبیینی، جامعیت و به‌ویژه ادغامِ ورودی‌های ادراکی و تجربی را نیز دربر می‌گیرد. با این حال اعتراض همچنان فشار می‌آورد که توضیح دهند چرا این ورودی‌ها شبکه را مقید می‌کنند و صرفاً عضوی از آن نمی‌شوند."],["پشتیبانیِ متقابل شبیه دور است: الف از ب پشتیبانی می‌کند و ب از الف.","پاسخ این است که پشتیبانی در سطحِ نظام با دورِ دوگزاره‌ای یکی نیست. ادعا کل‌گرایانه است: توجیه بر ساختارِ روابطِ بسیار در شبکه متکی است. منتقد سپس می‌پرسد تا چه اندازه دور را می‌توان پذیرفت پیش از آنکه این تمایز فروبریزد."]],"confuse":[["نظریهٔ انسجامیِ حقیقت","انسجام‌گراییِ معرفتی نظریه‌ای دربارهٔ توجیه است. می‌توان گفت انسجام باور را موجه می‌کند و هم‌زمان حقیقت را مطابقت با واقع دانست."],["اجماع","گروهی ممکن است فقط چون همه از یک منبع کپی کرده‌اند توافق داشته باشند. انسجام به روابطِ شاهدی و تبیینی نیاز دارد، نه صرفاً توافقِ اجتماعی یا تکرارِ ادعا."]],"mistakes":["شمردنِ چند شاهدِ وابسته به‌عنوان رشته‌های مستقل در شبکه.","کافی‌دانستنِ نبودِ تناقض؛ داستانی کم‌محتوا اما سازگار می‌تواند همچنان تبیینِ کمی داشته و اتصالِ ضعیفی به تجربه داشته باشد."],"check":{"q":"پنج پژوهش به یک نتیجه می‌رسند، اما همه از همان پایگاه داده، همان کدنویسی و همان فرضِ شناسایی استفاده می‌کنند. آیا انسجام‌گرایی خودکار پنج رشتهٔ پشتیبانی به شما می‌دهد؟","a":"نه. شبکه فقط وقتی قوی است که رشته‌ها پشتیبانیِ واقعاً متفاوت بدهند. وابستگیِ مشترک می‌تواند انسجامِ ظاهری را به یک فرض تبدیل کند که پنج بار تکرار شده؛ ساختارِ استقلال مهم است."}}},"found":{"en":{"line":"Some beliefs can be justified non-inferentially; they form a base from which other justified beliefs inherit support.","why":"<p>Foundationalism takes the trilemma’s stopping horn and tries to make the stop principled rather than dogmatic. If some beliefs have immediate justification—through experience, introspection, or another basic status—then inferential beliefs can rest on them without regress or circularity.</p>","origin":"Classical foundationalism is associated with Descartes and the search for indubitable foundations; twentieth-century versions include Chisholm and more modest fallibilist forms. Plantinga extends the structure with the idea of properly basic beliefs. The historical trend is from infallible foundations toward defeasible ones.","obj":[["Which beliefs are basic, and what non-arbitrary criterion gives them that status?","This is the basicality problem. Modest foundationalists answer functionally: experiences can provide prima facie justification without themselves being beliefs that need inferential support. That avoids requiring a list of self-evident propositions, though it still owes an account of why experience has this role."],["If basic beliefs are fallible, why call them foundations at all?","Because 'basic' means non-inferentially justified, not infallible. A foundation can be defeasible: it supplies default support unless a defeater appears. The modern view gives up certainty to preserve ordinary knowledge."]],"confuse":[["Basic belief and certain belief","Basicality concerns where justification comes from; certainty concerns strength or immunity to error. Contemporary foundationalists commonly allow basic beliefs to be mistaken."],["Dogmatic stop","A dogmatic stop simply refuses further reasons. Foundationalism claims a different justificatory relation applies at the base—often experience justifies without another belief serving as premise."]],"mistakes":["Assuming foundationalism requires Cartesian certainty; most contemporary versions are fallibilist.","Thinking the foundation must be a small explicit list of axioms rather than non-inferentially justified states or beliefs."],"check":{"q":"You see a red light and form the belief “the light is red” without inferring it from another belief. What makes this foundationalist rather than merely dogmatic?","a":"The claim is that the perceptual experience itself supplies prima facie justification. You stop because the justificatory relation is non-inferential at that point, not because you refuse to answer “why?”"}},"fa":{"line":"برخی باورها می‌توانند بدون استنتاج موجه باشند؛ آن‌ها پایه‌ای می‌سازند که باورهای دیگر پشتیبانی‌شان را از آن می‌گیرند.","why":"<p>مبناگرایی شاخِ توقف در سه‌راهی را می‌پذیرد اما می‌کوشد توقف را اصولی کند، نه جزمی. اگر برخی باورها — از راه تجربه، درون‌نگری یا شأنی پایه — توجیهِ بی‌واسطه داشته باشند، باورهای استنتاجی می‌توانند بر آن‌ها تکیه کنند بی‌آنکه به تسلسل یا دور برسیم.</p>","origin":"مبناگراییِ کلاسیک با دکارت و جست‌وجوی بنیادهای تردیدناپذیر پیوند دارد؛ نسخه‌های سدهٔ بیستم شامل چیشولم و صورت‌های متواضع‌تر و خطاپذیر است. پلنتینگا ساختار را با «باورهای به‌درستی پایه» گسترش می‌دهد. روندِ تاریخی از بنیادهای خطاناپذیر به بنیادهای قابل‌ابطال بوده است.","obj":[["کدام باورها پایه‌اند و چه معیارِ غیردلبخواهی این شأن را به آن‌ها می‌دهد؟","این «مسئلهٔ پایه‌بودن» است. مبناگرایانِ متواضع پاسخ می‌دهند تجربه می‌تواند توجیهِ ابتدایی بدهد بی‌آنکه خودش باوری باشد که نیازمندِ مقدمه‌ای دیگر است. این پاسخ از فهرستِ گزاره‌های خودبدیهی بی‌نیاز می‌شود، هرچند هنوز باید توضیح دهد چرا تجربه این نقش را دارد."],["اگر باورهای پایه خطاپذیرند، چرا اصلاً آن‌ها را بنیاد بنامیم؟","چون «پایه» یعنی توجیه‌شده به‌صورت غیراستنتاجی، نه خطاناپذیر. بنیاد می‌تواند قابل‌ابطال باشد: تا وقتی ابطال‌کننده‌ای نیامده پشتیبانیِ پیش‌فرض می‌دهد. نسخهٔ مدرن یقین را کنار می‌گذارد تا معرفتِ عادی را حفظ کند."]],"confuse":[["باورِ پایه و باورِ یقینی","پایه‌بودن دربارهٔ منشأ توجیه است؛ یقین دربارهٔ شدت یا مصونیت از خطاست. مبناگرایانِ معاصر معمولاً خطاپذیریِ باورهای پایه را می‌پذیرند."],["توقفِ جزمی","توقفِ جزمی فقط از دادنِ دلیلِ بیشتر سر باز می‌زند. مبناگرایی ادعا می‌کند در پایه رابطهٔ توجیهیِ متفاوتی برقرار است — مثلاً تجربه بدون میانجیِ باورِ دیگری توجیه می‌کند."]],"mistakes":["فرض‌کردنِ اینکه مبناگرایی حتماً یقینِ دکارتی می‌خواهد؛ بیشترِ نسخه‌های معاصر خطاپذیرند.","تصورِ اینکه بنیاد باید فهرستی کوچک و صریح از اصول موضوعه باشد، نه حالت‌ها یا باورهای غیراستنتاجیِ موجه."],"check":{"q":"چراغی قرمز می‌بینید و بی‌آنکه از باورِ دیگری استنتاج کنید باور می‌کنید «چراغ قرمز است». چه چیزی این را مبناگرایانه می‌کند، نه صرفاً جزمی؟","a":"ادعا این است که خودِ تجربهٔ ادراکی توجیهِ ابتدایی می‌دهد. توقف از آن روست که رابطهٔ توجیه در آن نقطه غیراستنتاجی است، نه چون از پاسخ به «چرا؟» امتناع می‌کنید."}}},"hinge":{"en":{"line":"Some commitments are not conclusions supported by evidence; they are the background certainties that make giving and assessing evidence possible.","why":"<p>Scepticism and the regress problem both assume every meaningful commitment is up for ordinary evidential assessment. Hinge epistemology challenges that assumption. Inquiry needs a relatively fixed background—such as the existence of an external world or the general reliability of memory—against which particular doubts can have sense.</p>","origin":"The source is Wittgenstein’s late notes published as <i>On Certainty</i>, written in dialogue with G.E. Moore. Contemporary hinge epistemology is strongly associated with Duncan Pritchard. The move is not to give hinges extraordinarily strong evidence, but to place them outside ordinary evidential support.","obj":[["How do you distinguish a genuine hinge from a prejudice someone simply refuses to examine?","This is the central danger. Defenders appeal to the role a commitment plays: a hinge is constitutive of a practice of inquiry and shared across many particular judgments, not merely a cherished proposition insulated for convenience. Critics question whether that functional test is sharp enough."],["If hinges are neither justified nor unjustified, trusting them looks epistemically arbitrary.","The reply is that asking for evidence for the framework within which evidence has force mislocates the demand. The entitlement is arational or non-evidential rather than irrational. The cost is accepting that not every rational commitment is supported by reasons in the same way."]],"confuse":[["Foundationalism","Foundationalism gives basic beliefs a special kind of justification. Hinge views often say hinges are not justified at all; they are conditions of the justificatory game."],["Fideism","A hinge is not automatically a faith commitment. The category is functional and can include mundane secular certainties. Fideism specifically protects faith from ordinary evidential demands."]],"mistakes":["Using 'hinge' as a label for any belief you do not want to defend.","Treating hinges as propositions with overwhelming evidence rather than as background commitments whose role is prior to ordinary evidence."],"check":{"q":"Someone says, “Prove that the external world existed five minutes ago before you use any memory as evidence.” What would a hinge epistemologist say is wrong with the demand?","a":"The demand asks memory to be validated from a standpoint that already presupposes some framework for evidence and temporal continuity. The relevant commitment functions as a hinge of the practice, not as one more hypothesis inside it."}},"fa":{"line":"برخی تعهدات نتیجه‌هایی نیستند که با شاهد پشتیبانی شده باشند؛ آن‌ها یقین‌های پس‌زمینه‌ای‌اند که اصلاً شاهدآوردن و سنجشِ شاهد را ممکن می‌کنند.","why":"<p>شکاکیت و مسئلهٔ تسلسل هر دو فرض می‌کنند هر تعهدِ معناداری در معرضِ ارزیابیِ عادیِ شاهد است. معرفت‌شناسیِ لولا این فرض را به چالش می‌کشد. پژوهش به پس‌زمینه‌ای نسبتاً ثابت — مانند وجودِ جهانِ بیرونی یا اعتمادپذیریِ کلیِ حافظه — نیاز دارد تا شک‌های جزئی معنا پیدا کنند.</p>","origin":"منبع، یادداشت‌های متأخرِ ویتگنشتاین است که با عنوانِ <i>در باب یقین</i> و در گفت‌وگو با جی.ای. مور منتشر شد. در صورتِ معاصر، دانکن پریچارد چهره‌ای اصلی است. حرکت این نیست که برای لولاها شاهدی فوق‌العاده قوی بدهیم، بلکه آن‌ها را بیرون از پشتیبانیِ عادیِ شاهدی قرار دهیم.","obj":[["چگونه لولای واقعی را از پیش‌داوری‌ای که کسی فقط حاضر نیست بررسی‌اش کند جدا می‌کنید؟","این خطرِ مرکزی است. مدافعان به نقشِ تعهد متوسل می‌شوند: لولا سازندهٔ یک عملِ پژوهشی است و طیفِ بزرگی از داوری‌های جزئی بر آن تکیه دارند، نه اینکه صرفاً گزاره‌ای محبوب باشد که برای آسایش مصون شده. منتقدان می‌پرسند آیا این آزمونِ کارکردی به‌اندازهٔ کافی دقیق است."],["اگر لولاها نه موجه‌اند نه ناموجه، اعتماد به آن‌ها از نظر معرفتی دلبخواهی به نظر می‌رسد.","پاسخ این است که درخواستِ شاهد برای چارچوبی که خودِ شاهد درونِ آن نیرو می‌گیرد، مطالبه را در جای نادرست می‌گذارد. مجوزِ آن غیرعقلانی نیست بلکه غیرشاهدی است. هزینه‌اش پذیرشِ این نکته است که همهٔ تعهداتِ عقلانی به یک شکل با دلیل پشتیبانی نمی‌شوند."]],"confuse":[["مبناگرایی","مبناگرایی به باورهای پایه نوعی توجیهِ ویژه می‌دهد. رویکردِ لولا اغلب می‌گوید لولاها اصلاً موجه نیستند؛ آن‌ها شرطِ خودِ بازیِ توجیه‌اند."],["ایمان‌گرایی","هر لولایی تعهدِ ایمانی نیست. این دسته کارکردی است و یقین‌های عادیِ سکولار را نیز دربر می‌گیرد. ایمان‌گرایی مشخصاً ایمان را از مطالباتِ معمولِ شاهد جدا می‌کند."]],"mistakes":["استفاده از واژهٔ «لولا» برای هر باوری که نمی‌خواهید از آن دفاع کنید.","فهمِ لولاها به‌عنوان گزاره‌هایی با شاهدِ بسیار زیاد، نه تعهداتِ پس‌زمینه‌ای که نقششان پیش از شاهدِ عادی است."],"check":{"q":"کسی می‌گوید: «پیش از آنکه از هیچ خاطره‌ای به‌عنوان شاهد استفاده کنی ثابت کن جهانِ بیرونی پنج دقیقه پیش وجود داشته است.» معرفت‌شناسِ لولا چه اشکالی در این مطالبه می‌بیند؟","a":"مطالبه می‌خواهد حافظه از نقطه‌ای اعتبارسنجی شود که خودش از پیش چارچوبی برای شاهد و تداومِ زمانی را مفروض گرفته است. تعهدِ مربوط نقشِ لولای عمل را دارد، نه فرضیه‌ای دیگر درونِ آن."}}},"critrat":{"en":{"line":"Stop trying to justify theories; expose conjectures to severe criticism and prefer the ones that survive better attempts at refutation.","why":"<p>Critical rationalism takes the trilemma as an argument against the whole project of positive justification. If every attempted justification ends in regress, circularity, or an arbitrary stop, replace justification with criticism. Knowledge can improve by eliminating error even if no theory is ever positively established.</p>","origin":"Karl Popper supplied the broader programme; Hans Albert connected it explicitly to the Münchhausen trilemma. It opposes justificationism and verificationist pictures of science. The method is conjecture, attempted refutation, and comparative preference for theories that have survived more severe criticism.","obj":[["Survival under testing seems to give us a reason to rely on a theory, so justification returns through the back door.","Popper distinguishes pragmatic preference from evidential confirmation: choose the best-tested theory for action without claiming its survival makes it probable. Critics reply that this distinction is unstable if 'best tested' is supposed to be rationally action-guiding."],["Criticism itself needs standards. Why trust modus tollens, observations, or methodological rules if none can be justified?","Critical rationalists treat standards as revisable commitments open to criticism rather than foundations immune to it. That yields a recursive critical practice, but it also means the view cannot promise a final non-circular validation of its own rules."]],"confuse":[["Falsificationism","Falsifiability is one methodological expression of critical rationalism in science. Critical rationalism is broader: it is a theory of rationality built around criticism rather than justification."],["Scepticism","The view rejects certainty and positive proof, but it is not a recommendation to suspend belief. It licenses provisional preference and action among fallible alternatives."]],"mistakes":["Saying 'nothing can be justified, therefore anything goes.' Critical rationalism replaces justification with comparative criticism, not arbitrariness.","Treating a surviving theory as confirmed while still calling the view Popperian; Popper’s point is precisely to deny that inference."],"check":{"q":"After two models survive the same tests, one has also survived several risky tests designed specifically to expose its weaknesses. What licenses preferring it on a critical-rationalist view?","a":"Its superior critical record, not a claim that the tests verified or made it probably true. The preference is provisional and comparative: it has withstood stronger attempted refutations so far."}},"fa":{"line":"از تلاش برای توجیهِ نظریه‌ها دست بکشید؛ حدس‌ها را در معرضِ نقدِ سخت بگذارید و نظریه‌ای را ترجیح دهید که از کوشش‌های بهتر برای ابطال جان به در برده است.","why":"<p>عقل‌گراییِ نقدی سه‌راهی را استدلالی علیه خودِ پروژهٔ توجیهِ مثبت می‌گیرد. اگر هر توجیهی به تسلسل، دور یا توقفِ دلبخواهی می‌رسد، توجیه را با نقد جایگزین کنید. دانش می‌تواند با حذفِ خطا رشد کند حتی اگر هیچ نظریه‌ای هرگز به‌طور مثبت اثبات نشود.</p>","origin":"کارل پوپر برنامهٔ کلی را ساخت؛ هانس آلبرت آن را صریحاً به سه‌راهیِ مونش‌هاوزن پیوند داد. این دیدگاه با توجیه‌گرایی و تصویرِ تحقیق‌پذیرِ علم مخالفت می‌کند. روش عبارت است از حدس، تلاش برای ابطال و ترجیحِ مقایسه‌ایِ نظریه‌هایی که از نقدهای سخت‌تر جان به در برده‌اند.","obj":[["جان‌به‌دربردن از آزمون ظاهراً دلیلی برای اتکا به نظریه می‌دهد؛ پس توجیه از درِ پشتی بازمی‌گردد.","پوپر ترجیحِ عملی را از تأییدِ شاهدی جدا می‌کند: برای عمل بهترین‌آزموده‌شده را برگزین، بی‌آنکه بگویی بقا آن را محتمل کرده است. منتقدان پاسخ می‌دهند اگر «بهترین‌آزموده‌شده» قرار است عقلانیاً راهنمای عمل باشد، این تمایز ناپایدار می‌شود."],["خودِ نقد به معیار نیاز دارد. چرا به رفعِ تالی، مشاهده یا قواعدِ روش‌شناختی اعتماد کنیم اگر هیچ‌کدام قابل‌توجیه نیستند؟","عقل‌گرایانِ نقدی معیارها را تعهداتی بازنگری‌پذیر می‌دانند که خودشان نیز در معرضِ نقدند، نه بنیادهایی مصون. این کار عملی بازگشتی از نقد می‌سازد، اما دیگر نمی‌تواند اعتبارسنجیِ نهایی و غیردوری برای قواعدِ خودش وعده دهد."]],"confuse":[["ابطال‌گرایی","ابطال‌پذیری یکی از نمودهای روش‌شناختیِ عقل‌گراییِ نقدی در علم است. عقل‌گراییِ نقدی گسترده‌تر و نظریه‌ای دربارهٔ عقلانیت بر پایهٔ نقد به‌جای توجیه است."],["شکاکیت","دیدگاه یقین و اثباتِ مثبت را رد می‌کند، اما توصیه به تعلیقِ باور نیست. ترجیح و عملِ موقت میان بدیل‌های خطاپذیر را مجاز می‌داند."]],"mistakes":["گفتنِ «هیچ چیز توجیه نمی‌شود، پس هر چیزی رواست». عقل‌گراییِ نقدی توجیه را با نقدِ مقایسه‌ای عوض می‌کند، نه با دلبخواهی.","تأییدشده دانستنِ نظریه‌ای که از آزمون جان به در برده و هم‌زمان پوپری نامیدنِ دیدگاه؛ نکتهٔ پوپر دقیقاً ردِ همین استنتاج است."],"check":{"q":"دو مدل از آزمون‌های یکسان جان به در برده‌اند، اما یکی علاوه بر آن چند آزمونِ پرخطرِ طراحی‌شده برای آشکارکردنِ ضعف‌هایش را هم پشت سر گذاشته. در عقل‌گراییِ نقدی چه چیزی ترجیحِ آن را مجاز می‌کند؟","a":"کارنامهٔ نقدیِ بهترش، نه این ادعا که آزمون‌ها آن را تحقیق یا محتمل کرده‌اند. ترجیح موقت و مقایسه‌ای است: تا اینجا از تلاش‌های قوی‌تر برای ابطال جان به در برده است."}}},"jtb":{"en":{"line":"The classical analysis says knowledge is belief that is both true and justified; Gettier shows those three conditions still do not guarantee knowledge.","why":"<p>JTB gives a clean decomposition of knowledge into three intuitive requirements: you must believe the proposition, it must be true, and you must have adequate grounds. Its importance now is less that philosophers accept it as sufficient than that almost every later theory can be read as explaining what JTB leaves out.</p>","origin":"The tripartite analysis is traditionally traced to Plato, though the exact modern formula is later. It became the standard target of twentieth-century epistemology. Edmund Gettier’s 1963 paper did not show the three conditions are useless; it showed they are not jointly sufficient because truth can coincide with justification by luck.","obj":[["Gettier cases show JTB is false, so why keep teaching it?","Because each component still captures something important and Gettier’s counterexamples are intelligible only against that baseline. JTB is the coordinate system for the problem: later theories add anti-luck, reliability, safety, or defeater conditions to explain the missing link."],["Some knowledge—animal or infant knowledge, for example—does not look like reflective 'justification.'","That pressures an internalist reading of justification, not necessarily the whole structure. Externalists replace accessible reasons with reliable or competent belief-forming processes while retaining belief and truth."]],"confuse":[["Necessary and sufficient conditions","Gettier attacks sufficiency: JTB can all be present without knowledge. It does not by itself show that belief, truth, or some form of justification is unnecessary."],["True belief","Truth plus belief can be a lucky guess. JTB adds grounds, but Gettier shows even good grounds can connect to truth accidentally."]],"mistakes":["Saying Gettier disproved that knowledge is true; knowledge remains factive in the standard debate.","Treating 'justified' as 'certain.' JTB traditionally permits justification that falls short of certainty."],"check":{"q":"A person has a justified belief based on a normally reliable source; the belief is true, but only because an unrelated coincidence made the source accidentally right. Which JTB condition fails?","a":"None. That is exactly the Gettier problem: belief, truth, and justification are all present, but the connection between justification and truth is lucky, so JTB is not sufficient."}},"fa":{"line":"تحلیلِ کلاسیک می‌گوید معرفت باوری است که هم صادق و هم موجه باشد؛ گتیه نشان می‌دهد همین سه شرط نیز معرفت را تضمین نمی‌کنند.","why":"<p>باورِ صادقِ موجه معرفت را به سه شرطِ شهودی می‌شکند: باید گزاره را باور داشته باشید، گزاره صادق باشد و مبنای کافی داشته باشید. اهمیتِ امروزینش کمتر در این است که فیلسوفان آن را کافی می‌دانند و بیشتر در این است که تقریباً هر نظریهٔ بعدی توضیح می‌دهد چه چیزی از این سه‌گانه جا افتاده است.</p>","origin":"تحلیلِ سه‌گانه به‌طور سنتی به افلاطون نسبت داده می‌شود، هرچند صورت‌بندیِ دقیقِ جدید دیرتر است. در سدهٔ بیستم به هدفِ استانداردِ معرفت‌شناسی تبدیل شد. مقالهٔ ۱۹۶۳ ادموند گتیه نشان نداد سه شرط بی‌فایده‌اند؛ نشان داد با هم کافی نیستند چون صدق می‌تواند به‌واسطهٔ شانس با توجیه هم‌زمان شود.","obj":[["مواردِ گتیه نشان می‌دهند JTB کاذب است؛ پس چرا هنوز آن را می‌آموزیم؟","چون هر جزء هنوز چیزی مهم را می‌گیرد و خودِ مواردِ گتیه فقط در برابر این خطِ مبنا فهم می‌شوند. JTB دستگاهِ مختصاتِ مسئله است: نظریه‌های بعدی شرطِ ضدشانس، اعتمادپذیری، ایمنی یا ابطال‌کننده را می‌افزایند تا حلقهٔ گمشده را توضیح دهند."],["بعضی معرفت‌ها — مثلاً معرفتِ حیوان یا کودک — شبیه «توجیه» بازتابی نیستند.","این اعتراض خوانشِ درون‌گرایانه از توجیه را تحت فشار می‌گذارد، نه لزوماً کلِ ساختار را. برون‌گرایان دلیلِ در دسترس را با فرایندِ اعتمادپذیر یا شایستهٔ تولیدِ باور جایگزین می‌کنند و باور و صدق را نگه می‌دارند."]],"confuse":[["شرطِ لازم و شرطِ کافی","گتیه به کفایت حمله می‌کند: هر سه شرط می‌توانند حاضر باشند و معرفت نباشد. به‌خودیِ خود نشان نمی‌دهد باور، صدق یا نوعی توجیه غیرضروری است."],["باورِ صادق","صدق به‌اضافهٔ باور می‌تواند حدسِ خوش‌شانس باشد. JTB مبنا را اضافه می‌کند، اما گتیه نشان می‌دهد حتی مبنای خوب نیز ممکن است تصادفاً به حقیقت برسد."]],"mistakes":["گفتنِ اینکه گتیه نشان داد معرفت لازم نیست صادق باشد؛ در بحثِ استاندارد معرفت همچنان صدق‌پذیر است.","یکی‌گرفتنِ «موجه» با «یقینی». JTB معمولاً توجیهی کمتر از یقین را می‌پذیرد."],"check":{"q":"کسی باوری موجه بر پایهٔ منبعی معمولاً قابل‌اعتماد دارد؛ باور صادق است، اما فقط چون تصادفی نامرتبط منبع را اتفاقاً درست کرده. کدام شرطِ JTB شکست خورده؟","a":"هیچ‌کدام. دقیقاً مسئلهٔ گتیه همین است: باور، صدق و توجیه هر سه حاضرند، اما پیوندِ میان توجیه و صدق خوش‌شانسی است؛ پس JTB کافی نیست."}}},"nofalse":{"en":{"line":"The no-false-lemmas repair says a justified true belief is knowledge only if its justification does not depend on any false intermediate premise.","why":"<p>The original Gettier cases manufacture luck by starting with a justified false belief and validly deriving a true conclusion. The natural repair is therefore to ban false steps in the justificatory route. The proposal matters because its failure reveals that Gettier luck is deeper than simply reasoning from a false premise.</p>","origin":"The repair is associated with early post-Gettier responses including Michael Clark and Gilbert Harman. It directly targets the mechanism in Gettier’s two original examples. Later cases—especially fake-barn cases—show that a belief can be Gettiered even when no false lemma appears in the person’s reasoning.","obj":[["Barn-facade cases contain no false lemma, yet the true belief still seems lucky.","That is widely treated as decisive against no-false-lemmas as a complete analysis. A defender can retain it as a necessary anti-luck constraint in some cases, but it cannot be the missing fourth condition by itself."],["What counts as a lemma in ordinary non-deductive reasoning is often unclear.","Exactly. The proposal fits neat inferential chains better than perception or testimony. More general approaches therefore shift from the truth of intermediate beliefs to modal relations such as safety or to the reliability of the belief-forming process."]],"confuse":[["No false beliefs","The proposal does not require an agent to have no false beliefs anywhere. It concerns false propositions that do essential justificatory work for this particular belief."],["Safety","No-false-lemmas examines the actual route of reasoning. Safety asks whether the belief would easily have been false in nearby possible situations, including cases with no false premise."]],"mistakes":["Assuming removing every explicit false premise removes all epistemic luck.","Applying the condition to irrelevant false beliefs in the agent’s background rather than to the justificatory route."],"check":{"q":"You identify a real barn in a county full of fake barn facades. Your visual belief uses no false premise. Why does no-false-lemmas still fail to deliver knowledge?","a":"Because the luck is environmental, not inferential. You could easily have looked at a facade and formed the same belief. The actual reasoning contains no false lemma, yet the belief remains accidentally true."}},"fa":{"line":"ترمیمِ «بدون مقدمهٔ کاذب» می‌گوید باورِ صادقِ موجه فقط وقتی معرفت است که توجیهش به هیچ مقدمهٔ میانیِ کاذبی وابسته نباشد.","why":"<p>مواردِ اصلیِ گتیه شانس را با شروع از باوری موجه اما کاذب و استنتاجِ معتبرِ نتیجه‌ای صادق می‌سازند. پس ترمیمِ طبیعی این است که گام‌های کاذب را از مسیرِ توجیه ممنوع کنیم. اهمیتِ شکستِ این پیشنهاد در آن است که نشان می‌دهد شانسِ گتیه عمیق‌تر از صرفِ استدلال از مقدمهٔ کاذب است.</p>","origin":"این ترمیم با پاسخ‌های اولیهٔ پس از گتیه، از جمله مایکل کلارک و گیلبرت هارمن، پیوند دارد. مستقیماً سازوکارِ دو مثالِ اصلیِ گتیه را هدف می‌گیرد. مواردِ بعدی — به‌ویژه نماهای انبار — نشان می‌دهند باور می‌تواند گتیه‌ای باشد حتی اگر هیچ مقدمهٔ کاذبی در استدلالِ شخص نباشد.","obj":[["در موردِ نماهای انبار هیچ مقدمهٔ کاذبی نیست، اما باورِ صادق همچنان خوش‌شانس به نظر می‌رسد.","این معمولاً علیه این شرط به‌عنوان تحلیلِ کامل قاطع دانسته می‌شود. مدافع می‌تواند آن را به‌عنوان قیدی لازم در بعضی موارد نگه دارد، اما به‌تنهایی شرطِ چهارمِ گمشده نیست."],["در استدلالِ عادی و غیراستنتاجی معلوم نیست اصلاً چه چیزی «مقدمه» محسوب می‌شود.","دقیقاً. پیشنهاد با زنجیره‌های استنتاجیِ مرتب بهتر کار می‌کند تا با ادراک یا گواهی. به همین دلیل رویکردهای عمومی‌تر به روابطِ وجهی مانند ایمنی یا اعتمادپذیریِ فرایندِ تولیدِ باور منتقل می‌شوند."]],"confuse":[["نداشتنِ هیچ باورِ کاذب","شرط نمی‌گوید عامل در کل هیچ باورِ کاذبی نداشته باشد. فقط به گزاره‌های کاذبی مربوط است که در توجیهِ همین باور نقشِ ضروری دارند."],["ایمنی","«بدون مقدمهٔ کاذب» مسیرِ واقعیِ استدلال را می‌سنجد. ایمنی می‌پرسد آیا باور در موقعیت‌های ممکنِ نزدیک به‌آسانی کاذب می‌شد، حتی اگر هیچ مقدمهٔ کاذبی وجود نداشته باشد."]],"mistakes":["فرض‌کردنِ اینکه حذفِ هر مقدمهٔ صریحِ کاذب تمامِ شانسِ معرفتی را حذف می‌کند.","اعمالِ شرط به باورهای کاذبِ نامرتبط در پس‌زمینهٔ عامل، نه به مسیرِ توجیهِ همین باور."],"check":{"q":"در منطقه‌ای پر از نمای انبار، اتفاقاً به یک انبارِ واقعی نگاه می‌کنید. باورِ دیداری‌تان هیچ مقدمهٔ کاذبی ندارد. چرا شرطِ «بدون مقدمهٔ کاذب» هنوز معرفت را تضمین نمی‌کند؟","a":"چون شانس محیطی است، نه استنتاجی. به‌آسانی می‌توانستید به نمایی جعلی نگاه کنید و همان باور را بسازید. مسیرِ واقعی هیچ مقدمهٔ کاذبی ندارد اما باور همچنان تصادفاً صادق است."}}},"sens":{"en":{"line":"A belief is sensitive when, if the proposition were false, you would not still believe it by the same method.","why":"<p>Gettier cases suggest knowledge requires a counterfactual connection between belief and truth. Sensitivity captures the intuition that a knowing method should change its verdict when reality changes: in the nearest worlds where <i>p</i> is false, the subject should not continue believing <i>p</i>.</p>","origin":"Robert Nozick developed sensitivity as part of a truth-tracking analysis of knowledge. It is designed as an anti-luck condition. Its most famous cost is that it conflicts with closure: one can sensitively know an ordinary proposition while failing to sensitively know a consequence such as “I am not a brain in a vat.”","obj":[["Sensitivity violates the closure principle: I can know I have hands while not knowing I am not a handless brain in a vat.","Nozick accepts the denial of closure. The reply is that methods track different propositions differently; closure looks intuitive but may not preserve the modal relation required for knowledge. Most epistemologists judge the cost too high, which motivates safety instead."],["Some true beliefs can be insensitive for harmless reasons, especially necessary truths or beliefs about one’s own methods.","This shows the simple counterfactual needs careful formulation. Sensitivity works best as a diagnostic anti-luck idea rather than an all-purpose test applied mechanically to every proposition."]],"confuse":[["Safety","Sensitivity asks what happens in nearby worlds where <i>p is false</i>. Safety asks whether in nearby worlds where you form the belief similarly, the belief is false. Safety preserves closure better and became more influential."],["Falsifiability","Sensitivity is a condition on a subject’s belief-forming method and knowledge; falsifiability is a property of hypotheses or theories in methodology of science."]],"mistakes":["Testing sensitivity by imagining any logically possible world, however remote; the relevant counterfactual is about nearby worlds.","Assuming sensitivity and safety are equivalent because both use possible worlds."],"check":{"q":"A stopped clock happens to read 3:00 when it is 3:00. If it were 3:01, you would still believe it was 3:00. What does sensitivity say?","a":"The belief is insensitive: in the nearby world where “it is 3:00” is false, the same method still produces the belief. That failure captures why the true belief looks lucky rather than knowledgeable."}},"fa":{"line":"یک باور «حساس» است اگر در صورتِ کاذب‌بودنِ گزاره، همان روش دیگر شما را به باورِ آن گزاره نمی‌رساند.","why":"<p>مواردِ گتیه نشان می‌دهند معرفت به پیوندی خلاف‌واقعی میان باور و حقیقت نیاز دارد. حساسیت این شهود را می‌گیرد که روشِ دانا باید با تغییرِ واقعیت حکمِ خود را تغییر دهد: در نزدیک‌ترین جهان‌هایی که <i>p</i> کاذب است، عامل نباید همچنان <i>p</i> را باور کند.</p>","origin":"رابرت نوزیک حساسیت را در تحلیلِ «ردیابیِ حقیقت» از معرفت بسط داد. هدف شرطی ضدشانس است. مشهورترین هزینه‌اش ناسازگاری با اصلِ انسداد است: ممکن است گزاره‌ای عادی را حساسانه بدانیم اما پیامدی مانند «من مغز در خمره نیستم» را حساسانه ندانیم.","obj":[["حساسیت اصلِ انسداد را نقض می‌کند: می‌توانم بدانم دست دارم اما ندانم مغزِ بی‌دست در خمره نیستم.","نوزیک انکارِ انسداد را می‌پذیرد. پاسخ این است که روش‌ها گزاره‌های مختلف را به شکلِ متفاوت ردیابی می‌کنند؛ انسداد شهودی است اما شاید رابطهٔ وجهیِ لازم برای معرفت را حفظ نکند. بیشترِ معرفت‌شناسان این هزینه را زیاد می‌دانند و به ایمنی متمایل می‌شوند."],["برخی باورهای صادق به دلایلِ بی‌ضرر حساس نیستند، به‌ویژه حقایقِ ضروری یا باورهای مربوط به خودِ روش.","این نشان می‌دهد شرطِ خلاف‌واقعیِ ساده نیاز به صورت‌بندیِ دقیق دارد. حساسیت بهتر است به‌عنوان ابزارِ تشخیصِ شانس فهم شود تا آزمونی مکانیکی برای هر گزاره."]],"confuse":[["ایمنی","حساسیت می‌پرسد در جهان‌های نزدیک که <i>p کاذب است</i> چه می‌شود. ایمنی می‌پرسد در جهان‌های نزدیک که به همان روش باور را می‌سازید آیا باور کاذب می‌شود. ایمنی با انسداد سازگارتر است و نفوذِ بیشتری یافت."],["ابطال‌پذیری","حساسیت شرطی دربارهٔ روشِ تولیدِ باورِ یک فاعل و معرفت است؛ ابطال‌پذیری ویژگیِ فرضیه یا نظریه در روش‌شناسیِ علم است."]],"mistakes":["آزمودنِ حساسیت با هر جهانِ منطقاً ممکن هرقدر دور؛ خلاف‌واقعِ مربوط باید دربارهٔ جهان‌های نزدیک باشد.","یکی‌گرفتنِ حساسیت و ایمنی فقط چون هر دو از جهان‌های ممکن استفاده می‌کنند."],"check":{"q":"ساعتی ازکارافتاده اتفاقاً در ساعت ۳، عددِ ۳ را نشان می‌دهد. اگر ۳:۰۱ بود باز هم باور می‌کردید ساعت ۳ است. حساسیت چه می‌گوید؟","a":"باور حساس نیست: در جهانِ نزدیک که «ساعت ۳ است» کاذب است، همان روش هنوز همان باور را تولید می‌کند. همین شکست توضیح می‌دهد چرا باورِ صادق خوش‌شانس به نظر می‌رسد نه معرفت."}}},"safe":{"en":{"line":"A belief is safe when you could not easily have formed that same belief in the same way while it was false.","why":"<p>Safety is a modal anti-luck condition designed to keep what is attractive in truth-tracking while avoiding sensitivity’s rejection of closure. Instead of asking what you would believe if <i>p</i> were false, it asks whether nearby situations in which you form the belief similarly are mostly situations in which the belief remains true.</p>","origin":"Safety is associated especially with Ernest Sosa and later Duncan Pritchard. It became one of the leading post-Gettier conditions because fake-barn and stopped-clock cases are naturally described as unsafe: the believer is correct in actuality but close to being wrong in very similar circumstances.","obj":[["How close is 'nearby'? Different similarity metrics can change whether a belief counts as safe.","That is a real technical burden. Defenders tie closeness to the method, environment, and risk relevant to the case rather than to bare logical possibility. Safety is therefore a framework requiring a principled similarity relation, not a plug-in formula."],["Some Gettier-like cases can be engineered where the belief is safe yet still intuitively not knowledge.","Such cases motivate refinements—competence, explanatory connection, or stronger anti-luck conditions. Safety is powerful because it diagnoses a major class of luck, not because every philosopher accepts it as sufficient by itself."]],"confuse":[["Sensitivity","Safety holds the method of belief formation fixed and asks whether false belief is nearby. Sensitivity holds the falsity of the proposition fixed and asks whether belief persists. The direction of the counterfactual is reversed."],["Reliability","Reliability is typically a statistical or dispositional success rate of a process across cases. Safety is local: could this belief easily have been false in nearby circumstances? A generally reliable method can produce an unsafe belief in an unusual environment."]],"mistakes":["Equating safety with high confidence; it is about modal risk, not how certain the subject feels.","Checking only the actual world. The whole point is whether error lies close to the actual case."],"check":{"q":"A normally reliable visual system is used in a county where 99% of barn-looking objects are facades; you happen to look at the one real barn. Reliable process or safe belief?","a":"The visual process may be generally reliable, but this particular belief is unsafe because a tiny change in where you looked would have produced the same belief falsely. Safety is local to the epistemic environment."}},"fa":{"line":"یک باور «ایمن» است اگر نتوانستید به‌آسانی و به همان روش همان باور را در حالی بسازید که کاذب باشد.","why":"<p>ایمنی شرطی وجهی و ضدشانس است که می‌خواهد جذابیتِ ردیابیِ حقیقت را نگه دارد بی‌آنکه مانند حساسیت اصلِ انسداد را رد کند. به‌جای پرسیدنِ «اگر p کاذب بود چه باور می‌کردید؟» می‌پرسد آیا موقعیت‌های نزدیک که در آن‌ها باور را به شکلی مشابه می‌سازید عمدتاً موقعیت‌هایی‌اند که باور همچنان صادق است.</p>","origin":"ایمنی به‌ویژه با ارنست سوسا و سپس دانکن پریچارد پیوند دارد. به یکی از شروطِ مهمِ پس از گتیه تبدیل شد، چون مواردِ نمای انبار و ساعتِ متوقف‌شده طبیعی است «ناایمن» توصیف شوند: شخص در واقعیت درست است اما در شرایطِ بسیار مشابه نزدیکِ خطاست.","obj":[["«نزدیک» یعنی چقدر نزدیک؟ معیارهای متفاوتِ شباهت می‌توانند نتیجه را عوض کنند.","این بارِ فنیِ واقعی است. مدافعان نزدیکی را به روش، محیط و خطرِ مرتبط با مورد
