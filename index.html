uiry, but agreement does not constitute truth on most theories."]],"mistakes":["Sliding from 'our methods are fallible' to 'truth itself is relative.'","Treating a theory of truth as if it automatically supplied a method for discovering true propositions."],"check":{"q":"Why doesn’t a correspondence theory by itself tell you whether today’s inflation estimate is true?","a":"Because it says what would make the proposition true—the relevant worldly state—not how to know that state. Measurement, inference, and justification are separate epistemic problems."}},"fa":{"line":"حقیقت شرطِ موفقیتِ باور است: معرفت‌شناسی باید توضیح دهد صادق‌بودنِ گزاره چیست پیش از آنکه توضیح دهد شاهد چگونه ما را به حقیقت وصل می‌کند.","why":"<p>معرفت صدق‌پذیر است، اما نظریه‌ها دربارهٔ خودِ حقیقت اختلاف دارند — مطابقت با واقعیت، انسجام، موفقیتِ پراگماتیک یا نقشی منطقی و کم‌بار. این نظریه‌ها قابل‌جایگزینی نیستند چون واقع‌گرایی، اختلاف، ادعاهای نامشهود و وابستگی به چارچوب را متفاوت حل می‌کنند.</p>","origin":"شاخه از شهودِ باستانیِ مطابقت تا نظریه‌های انسجامیِ ایدئالیستی، پراگماتیسمِ آمریکایی و رویکردهای کمینه‌گرای سدهٔ بیستم امتداد دارد. نزاعِ عینیت/نسبی‌گرایی را نیز شامل می‌شود: آیا حقیقت مستقل از دیدگاه است حتی اگر دسترسیِ ما تاریخی و نظریه‌واسطه باشد؟","obj":[["بیشترِ نظریه‌های حقیقت در جملاتِ عادی توافق دارند، پس نزاع صرفاً لفظی به نظر می‌رسد.","تفاوت در مواردِ سخت ظاهر می‌شود: اشیای انتزاعی، اخلاق، نامشهودها، علمِ ایده‌آل، چارچوب‌های متعارض و رابطهٔ حقیقت با پژوهش. نظریه‌هایی که دربارهٔ «برف سفید است» توافق دارند جای دیگر می‌توانند شدیداً جدا شوند."],["معرفت‌شناسی باید توجیه را بررسی کند نه متافیزیکِ حقیقت؛ می‌توان بدون حلِ حقیقت خوب استدلال کرد.","عملاً بله، اما نظریه‌های توجیه معمولاً حقیقت‌محورند. اگر هدف را روشن نکنید ادعاهایی مانند «این روش حقیقت‌یار یا عینی است» تا حدی نامشخص می‌مانند."]],"confuse":[["حقیقت و توجیه","توجیه دربارهٔ دلیلی است که برای باور دارید؛ حقیقت دربارهٔ خودِ واقعیتِ گزاره است. توجیهِ خوب می‌تواند به باورِ کاذب تعلق بگیرد."],["حقیقت و اجماع","توافق می‌تواند شاهد باشد، مخصوصاً زیرِ پژوهشِ مستقل و شایسته، اما در بیشترِ نظریه‌ها حقیقت را نمی‌سازد."]],"mistakes":["لغزیدن از «روش‌های ما خطاپذیرند» به «خودِ حقیقت نسبی است».","فهمِ نظریهٔ حقیقت به‌عنوان روشی خودکار برای کشفِ گزاره‌های صادق."],"check":{"q":"چرا نظریهٔ مطابقت به‌تنهایی نمی‌گوید برآوردِ تورمِ امروز صادق است یا نه؟","a":"چون فقط می‌گوید چه چیزی گزاره را صادق می‌کند — وضعیتِ مربوط در جهان — نه اینکه چگونه آن وضعیت را بشناسیم. اندازه‌گیری، استنتاج و توجیه مسائلِ جداگانهٔ معرفتی‌اند."}}},"sources":{"en":{"line":"The sources-of-knowledge problem asks how perception, memory, introspection, reason, and testimony can generate or preserve justification despite each being fallible.","why":"<p>Every belief must enter or persist in a cognitive system somehow. If we demand an independent proof of each source before trusting it, the proof must itself come from a source and regress begins. The practical theory therefore needs prima facie entitlement plus characteristic defeaters for each channel.</p>","origin":"The branch reorganizes classical rationalism/empiricism around five source types emphasized in contemporary epistemology: perception, memory, introspection, reason/a priori, and testimony. Each has its own skeptical challenge and its own question about whether justification is generated directly or only transmitted.","obj":[["Because every source can fail, none can be trusted without independent validation.","That standard is self-defeating: validation must use perception, memory, reasoning, or testimony too. Fallibilist accounts instead grant default entitlement and then use cross-checking and defeaters to calibrate trust."],["Five sources are an artificial taxonomy; imagination, intuition, instruments, and AI do not fit neatly.","The list is a conceptual spine, not an exhaustive ontology. Instruments usually extend perception/testimony, intuition is often treated under reason or seeming, and new technologies raise the same deeper questions about transmission, reliability, and evidence."]],"confuse":[["Source of belief and source of justification","A causal source can produce a belief without justifying it. Propaganda may cause belief; whether it is epistemically entitled is a separate question."],["Generating and preserving justification","Perception may generate new empirical justification; memory may often preserve an earlier warrant. The distinction matters for forgotten evidence."]],"mistakes":["Treating one source’s failure mode as a reason to reject the source wholesale.","Failing to cross-check sources precisely when their errors are correlated—for example, multiple reports all tracing to one observation."],"check":{"q":"You remember a result, see a chart reproducing it, and read three articles repeating it—but all four ultimately derive from the same flawed original measurement. How many independent source types protect you?","a":"Potentially none in the relevant evidential sense. Memory, perception of the chart, and testimony are distinct channels, but if their information all traces to the same flawed observation, the epistemic dependence remains one-source deep."}},"fa":{"line":"مسئلهٔ منابعِ معرفت می‌پرسد ادراک، حافظه، درون‌نگری، عقل و گواهی چگونه با وجودِ خطاپذیری می‌توانند توجیه را تولید یا حفظ کنند.","why":"<p>هر باور باید به طریقی وارد یا در نظامِ شناختی حفظ شود. اگر پیش از اعتماد به هر منبع اثباتِ مستقل بخواهیم، خودِ اثبات باید از منبعی بیاید و تسلسل آغاز می‌شود. نظریهٔ عملی بنابراین به مجوزِ ابتدایی به‌اضافهٔ ابطال‌کننده‌های خاصِ هر کانال نیاز دارد.</p>","origin":"این شاخه نزاعِ کلاسیکِ عقل‌گرایی/تجربه‌گرایی را پیرامونِ پنج منبعِ برجسته در معرفت‌شناسیِ معاصر بازسازمان می‌دهد: ادراک، حافظه، درون‌نگری، عقل/پیشینی و گواهی. هر یک چالشِ شکاکانه و پرسشِ جداگانه‌ای دربارهٔ تولیدِ مستقیم یا انتقالِ توجیه دارند.","obj":[["چون هر منبع می‌تواند شکست بخورد، هیچ‌کدام بدون اعتبارسنجیِ مستقل قابل‌اعتماد نیست.","این معیار خودویرانگر است: اعتبارسنجی هم باید از ادراک، حافظه، استدلال یا گواهی استفاده کند. رویکردِ خطاپذیر مجوزِ پیش‌فرض می‌دهد و سپس با تقاطعِ منابع و ابطال‌کننده‌ها اعتماد را کالیبره می‌کند."],["پنج منبع طبقه‌بندیِ مصنوعی است؛ تخیل، شهود، ابزار و هوشِ مصنوعی به‌سادگی جا نمی‌شوند.","فهرست ستونِ مفهومی است نه هستی‌شناسیِ کامل. ابزار معمولاً ادراک/گواهی را گسترش می‌دهد، شهود زیرِ عقل یا نمود قرار می‌گیرد و فناوریِ تازه همان پرسش‌های عمیقِ انتقال، اعتمادپذیری و شاهد را دوباره می‌سازد."]],"confuse":[["منبعِ باور و منبعِ توجیه","منبعِ علّی می‌تواند باور بسازد بی‌آنکه آن را موجه کند. تبلیغات باور ایجاد می‌کند؛ شأنِ معرفتی سؤالِ جداست."],["تولید و حفظِ توجیه","ادراک شاید توجیهِ تجربیِ تازه بسازد؛ حافظه اغلب ضمانتِ قبلی را حفظ می‌کند. تمایز برای شاهدِ فراموش‌شده مهم است."]],"mistakes":["شکستِ خاصِ یک منبع را دلیلِ ردِ کاملِ آن منبع دانستن.","تقاطع‌نکردنِ منابع دقیقاً وقتی خطاهایشان هم‌بسته است؛ مثلاً چند گزارش که همه به یک مشاهدهٔ اولیه برمی‌گردند."],"check":{"q":"نتیجه‌ای را به یاد دارید، نمودارش را می‌بینید و سه مقاله تکرارش می‌کنند، اما هر چهار در نهایت از همان اندازه‌گیریِ اصلیِ معیوب آمده‌اند. چند منبعِ مستقل شما را محافظت می‌کند؟","a":"در معنای شاهدی شاید هیچ. حافظه، ادراکِ نمودار و گواهی کانال‌های متفاوت‌اند، اما اگر همهٔ اطلاعات به همان مشاهدهٔ معیوب برگردد وابستگیِ معرفتی همچنان یک‌منبعی است."}}},"skep":{"en":{"line":"Skepticism stress-tests knowledge by asking whether our evidence can rule out error possibilities that would look exactly—or relevantly—like the world we believe we inhabit.","why":"<p>Skeptical arguments expose hidden standards. The brain-in-a-vat case, closure, relevant alternatives, contextualism, Moorean reversal, and Cartesian versus Pyrrhonian strategies are different moves in one architecture: which possibilities must be excluded, and what happens when they cannot be?</p>","origin":"Ancient Pyrrhonism aimed at suspension of judgment; Descartes used radical doubt to search for certainty. Contemporary epistemology formalizes the pressure through closure and modal conditions, then develops responses such as relevant alternatives, contextualism, safety, and Moorean reasoning.","obj":[["Radical skeptical possibilities are practically irrelevant and should not set standards for ordinary knowledge.","That is itself an epistemological position requiring a relevance rule. Skepticism is useful precisely because it forces the rule into the open: why may some error possibilities be ignored but not others?"],["Skeptical arguments prove too much—if accepted, nearly all ordinary knowledge disappears, which is more implausible than the premises.","The Moorean strategy exploits exactly that comparative plausibility. One may reject the skeptical premise or infer its falsity from ordinary knowledge, but then one owes an account of why that reversal is not merely dogmatic."]],"confuse":[["Skepticism and cynicism","Epistemic skepticism questions whether knowledge or justification is available under certain standards. Cynicism is a distrustful attitude toward motives or institutions."],["Cartesian and Pyrrhonian skepticism","Cartesian doubt seeks a foundation from which knowledge can be rebuilt; Pyrrhonism uses equipollence to suspend judgment rather than reconstruct certainty."]],"mistakes":["Treating every far-fetched possibility as automatically relevant to knowledge.","Answering skepticism by repeating the same first-order evidence the skeptical scenario was constructed to mimic."],"check":{"q":"A critic raises a one-in-a-billion alternative and says you no longer “know.” What is the first architectural question?","a":"Which theory of relevance or knowledge standards makes that alternative epistemically live? The debate is not settled by its mere logical possibility; closure, relevant alternatives, and contextualism answer that question differently."}},"fa":{"line":"شکاکیت معرفت را با این پرسش تحتِ فشار می‌گذارد که آیا شاهدِ ما می‌تواند امکان‌های خطایی را کنار بزند که دقیقاً — یا از نظر مرتبط — مانند جهانی به نظر می‌رسند که باور داریم در آنیم.","why":"<p>استدلالِ شکاکانه معیارهای پنهان را آشکار می‌کند. مغز در خمره، انسداد، بدیل‌های مرتبط، زمینه‌گرایی، وارونگیِ مور و راهبردِ دکارتی/پیرونی حرکت‌های متفاوت در یک معماری‌اند: کدام امکان‌ها باید حذف شوند و وقتی نمی‌شوند چه رخ می‌دهد؟</p>","origin":"پیرونیِ باستان هدفش تعلیقِ حکم بود؛ دکارت از شکِ رادیکال برای یافتنِ یقین استفاده کرد. معرفت‌شناسیِ معاصر فشار را با انسداد و شروطِ وجهی صورت‌بندی و پاسخ‌هایی مانند بدیل‌های مرتبط، زمینه‌گرایی، ایمنی و استدلالِ مور را می‌سازد.","obj":[["امکان‌های شکاکانهٔ رادیکال در عمل بی‌ربط‌اند و نباید معیارِ معرفتِ عادی را تعیین کنند.","این خودش موضعی معرفتی و نیازمندِ قاعدهٔ ارتباط است. فایدهٔ شکاکیت همین است که قاعده را آشکار می‌کند: چرا بعضی خطاها قابل‌چشم‌پوشی‌اند و بعضی نه؟"],["استدلالِ شکاکانه بیش از حد نتیجه می‌دهد؛ اگر پذیرفته شود تقریباً همهٔ معرفتِ عادی نابود می‌شود و این از مقدمات نامعقول‌تر است.","راهبردِ موری دقیقاً از این مقایسهٔ معقولیت استفاده می‌کند. می‌توان مقدمهٔ شکاکانه را رد یا از معرفتِ عادی کذبش را نتیجه گرفت، اما سپس باید توضیح داد چرا وارونگی صرفاً جزمی نیست."]],"confuse":[["شکاکیت و بدبینی","شکاکیتِ معرفتی دربارهٔ امکانِ معرفت یا توجیه زیرِ معیارهای خاص است. بدبینی نگرشی بی‌اعتماد نسبت به انگیزه یا نهاد است."],["شکاکیتِ دکارتی و پیرونی","شکِ دکارتی به‌دنبالِ بنیاد برای بازسازیِ معرفت است؛ پیرونی از هم‌وزنیِ دلایل به تعلیقِ حکم می‌رسد، نه بازسازیِ یقین."]],"mistakes":["مرتبط دانستنِ خودکارِ هر امکانِ دور فقط چون منطقاً ممکن است.","پاسخ به شکاکیت با تکرارِ همان شاهدِ مرتبهٔ اولی که سناریوی شکاکانه عمداً تقلیدش کرده است."],"check":{"q":"منتقد بدیلی یک‌درمیلیاردی مطرح می‌کند و می‌گوید دیگر «نمی‌دانید». نخستین پرسشِ معماری چیست؟","a":"کدام نظریهٔ ارتباط یا معیارِ معرفت این بدیل را از نظر معرفتی زنده می‌کند؟ صرفِ امکانِ منطقی حل‌کننده نیست؛ انسداد، بدیل‌های مرتبط و زمینه‌گرایی پاسخ‌های متفاوت می‌دهند."}}},"formal":{"en":{"line":"Formal epistemology represents uncertainty mathematically—especially with credences—and asks what coherence, evidence, and rational updating require of those graded beliefs.","why":"<p>Binary belief throws away information when evidence is partial. Probability provides a language for degrees of confidence, while Bayes, likelihood ratios, Dutch-book arguments, calibration, and scoring rules turn vague advice like “update appropriately” into explicit constraints and measurable performance.</p>","origin":"The modern program draws from Ramsey, de Finetti, Savage, Bayesian statistics, and decision theory. It includes both synchronic norms—your credences should be coherent now—and diachronic norms—how they should change with evidence. It also exposes unresolved foundations such as the problem of priors.","obj":[["Mathematical precision can create false certainty when hypotheses, models, and probabilities themselves are poorly specified.","Formalists can use intervals, model uncertainty, sensitivity analysis, and explicit misspecification. The mathematics is valuable when it makes assumptions visible, not when it launders deep uncertainty into a decimal."],["Human reasoning cannot perform exact Bayesian calculations in complex environments.","Formal epistemology can function as a normative benchmark rather than a psychological algorithm. Approximate heuristics can be judged by whether they track the structure—base rates, evidence strength, calibration—even when no one computes exact posteriors."]],"confuse":[["Formal epistemology and statistics","They overlap heavily, but formal epistemology asks normative questions about rational belief and evidence, not only estimation procedures or sampling properties."],["Probability and certainty","A precise probability is a representation of uncertainty, not proof that the underlying model space is complete or correct."]],"mistakes":["Reporting precise posteriors while leaving priors and model assumptions implicit.","Treating calibration, coherence, and discrimination as one property; they assess different dimensions."],"check":{"q":"A model reports “73.4%” but the hypothesis space omits a plausible structural break. What formal-epistemic question comes before admiring the precision?","a":"Whether the probability model represents the relevant uncertainty at all. Internal coherence inside a misspecified hypothesis space does not remove model uncertainty; sensitivity and alternative models are part of the epistemic audit."}},"fa":{"line":"معرفت‌شناسیِ صوری عدمِ‌قطعیت را ریاضی نمایش می‌دهد — به‌ویژه با درجاتِ باور — و می‌پرسد انسجام، شاهد و به‌روزرسانیِ عقلانی چه قیودی بر این باورهای درجه‌ای دارند.","why":"<p>باورِ دوگانه وقتی شاهد جزئی است اطلاعات را دور می‌ریزد. احتمال زبانِ درجاتِ اطمینان می‌دهد و بیز، نسبتِ درست‌نمایی، استدلالِ کتابِ هلندی، کالیبراسیون و قواعدِ امتیازدهی توصیهٔ مبهمِ «درست به‌روزرسانی کن» را به قیدِ صریح و عملکردِ قابل‌سنجش تبدیل می‌کنند.</p>","origin":"برنامهٔ مدرن از رمزی، دِفینتی، ساویج، آمارِ بیزی و نظریهٔ تصمیم تغذیه می‌کند. هم هنجارهای هم‌زمان دارد — درجاتِ باور اکنون باید سازگار باشند — و هم هنجارهای درزمانی — با شاهد چگونه تغییر کنند. همچنین بنیادهای حل‌نشده‌ای مانند مسئلهٔ پیشین‌ها را آشکار می‌کند.","obj":[["دقتِ ریاضی می‌تواند یقینِ کاذب بسازد وقتی فرضیه، مدل و خودِ احتمال بد مشخص شده‌اند.","معرفت‌شناسیِ صوری می‌تواند بازه، عدمِ‌قطعیتِ مدل، تحلیلِ حساسیت و بدمشخصه‌بودن را وارد کند. ریاضیات وقتی ارزشمند است که فرض‌ها را آشکار کند، نه وقتی عدمِ‌قطعیتِ عمیق را به رقمِ اعشاری تطهیر کند."],["ذهنِ انسان در محیطِ پیچیده محاسبهٔ دقیقِ بیزی انجام نمی‌دهد.","معرفت‌شناسیِ صوری می‌تواند خطِ مبنای هنجاری باشد، نه الگوریتمِ روان‌شناختی. ابتکارهای تقریبی را می‌توان با ساختارِ درست — نرخِ پایه، قدرتِ شاهد، کالیبراسیون — سنجید حتی اگر پسینِ دقیق محاسبه نشود."]],"confuse":[["معرفت‌شناسیِ صوری و آمار","همپوشانی زیاد است، اما معرفت‌شناسیِ صوری پرسشِ هنجاری دربارهٔ باورِ عقلانی و شاهد می‌پرسد، نه فقط روشِ برآورد یا خاصیتِ نمونه‌گیری."],["احتمال و یقین","احتمالِ دقیق نمایشِ عدمِ‌قطعیت است، نه اثباتِ اینکه فضای مدل کامل یا درست است."]],"mistakes":["گزارشِ پسینِ دقیق با پیشین و فرضِ مدلِ پنهان.","یکی‌گرفتنِ کالیبراسیون، انسجام و تفکیک؛ هر کدام بُعدِ متفاوتی را می‌سنجند."],"check":{"q":"مدلی «۷۳٫۴٪» گزارش می‌کند اما فضای فرضیه شکستِ ساختاریِ محتمل را ندارد. پیش از تحسینِ دقت چه پرسشی می‌آید؟","a":"آیا مدلِ احتمال اصلاً عدمِ‌قطعیتِ مربوط را نمایش می‌دهد؟ انسجامِ درونی در فضای فرضیهٔ بدمشخصه عدمِ‌قطعیتِ مدل را حذف نمی‌کند؛ حساسیت و مدل‌های بدیل بخشی از حسابرسی‌اند."}}},"phsci":{"en":{"line":"Philosophy of science asks what makes empirical inquiry evidentially disciplined when induction is fallible, tests are theory-laden, and hypotheses are never tested alone.","why":"<p>Science works astonishingly well, but no single slogan explains why. Popper captures risky testing, Duhem–Quine the bundle problem, Kuhn the historical structure of normal science, Lakatos the difference between productive and degenerating adjustment, and underdetermination the residual ambiguity of evidence.</p>","origin":"The modern arc runs from Hume’s problem of induction through logical positivism, Popper, Kuhn, Lakatos, and contemporary realism/underdetermination debates. The syllabus treats these not as isolated “isms” but as successive attempts to repair the limitations exposed by the previous view.","obj":[["Scientists can do excellent work without studying this philosophy, so the field may be post-hoc commentary.","Scientists need not name the concepts, but methodological choices still instantiate them: when to abandon a model, which auxiliary to change, what counts as independent evidence, and whether a patch is progressive. Philosophy makes those choices explicit and comparable."],["No universal demarcation criterion cleanly separates science from non-science.","That failure is itself a major lesson. Contemporary philosophy often replaces one sharp boundary with a cluster of virtues: empirical constraint, risky testing, methodological transparency, explanatory integration, replicability, and progressive problem-solving."]],"confuse":[["Philosophy of science and scientific method","There is no single universally accepted scientific method. The philosophy studies competing methods, historical practices, and the norms that make them epistemically successful or unsuccessful."],["Falsifiability and scientific quality","A claim can be technically falsifiable yet methodologically weak; Lakatos asks whether the research program generates novel success rather than merely whether some observation could contradict it."]],"mistakes":["Stopping at Popper as if later work did not expose serious limits of simple falsificationism.","Treating Kuhn as a relativist slogan and Lakatos as merely vocabulary, rather than answers to actual problems of anomaly and theory change."],"check":{"q":"A theory misses a prediction, its defenders alter an auxiliary, and the altered model later correctly predicts a novel result. Which sequence of concepts best diagnoses the episode?","a":"Duhem–Quine explains why an auxiliary can be changed; Popper supplies the pressure to expose the theory to risk; Lakatos judges the repair progressive because it produced novel empirical success."}},"fa":{"line":"فلسفهٔ علم می‌پرسد پژوهشِ تجربی چگونه انضباطِ شاهدی دارد وقتی استقرا خطاپذیر، مشاهده نظریه‌بار و فرضیه هرگز تنها آزموده نمی‌شود.","why":"<p>علم بسیار خوب کار می‌کند اما هیچ شعارِ واحدی توضیحش نمی‌دهد. پوپر آزمونِ پرخطر را می‌گیرد، دوئم‌ـ‌کواین مسئلهٔ بسته را، کوهن ساختارِ تاریخیِ علمِ عادی را، لاکاتوش تفاوتِ تعدیلِ بارور و واپس‌رونده را و تعیّن‌ناقص ابهامِ باقی‌ماندهٔ شاهد را.</p>","origin":"قوسِ مدرن از مسئلهٔ استقرای هیوم تا پوزیتیویسمِ منطقی، پوپر، کوهن، لاکاتوش و نزاع‌های واقع‌گرایی/تعیّن‌ناقص می‌رود. برنامهٔ شما این‌ها را فهرستِ «ایسم»ها نمی‌بیند، بلکه تلاش‌های پیاپی برای ترمیمِ محدودیتی می‌داند که دیدگاهِ قبلی آشکار کرده است.","obj":[["دانشمندان بدون خواندنِ فلسفه کارِ عالی می‌کنند؛ پس رشته شاید فقط تفسیرِ پس‌از‌واقعه باشد.","دانشمند لازم نیست نامِ مفاهیم را بداند، اما انتخابِ روش‌شناختی همچنان آن‌ها را مجسم می‌کند: چه وقت مدل را رها کنیم، کدام فرضِ کمکی را عوض کنیم، شاهدِ مستقل چیست و وصله پیش‌رونده است یا نه. فلسفه این انتخاب‌ها را صریح و مقایسه‌پذیر می‌کند."],["هیچ معیارِ جهانیِ تمیزی علم را از غیرعلم جدا نکرده است.","خودِ این شکست درسِ مهمی است. فلسفهٔ معاصر اغلب یک مرزِ تیز را با خوشه‌ای از فضایل جایگزین می‌کند: قیدِ تجربی، آزمونِ پرخطر، شفافیتِ روش، یکپارچگیِ تبیینی، بازتولید و حلِ مسئلهٔ پیش‌رونده."]],"confuse":[["فلسفهٔ علم و روشِ علمی","یک «روشِ علمی» واحد و موردِ توافق وجود ندارد. فلسفهٔ علم روش‌های رقیب، عملِ تاریخی و هنجارهای موفقیت یا شکستِ معرفتیِ آن‌ها را بررسی می‌کند."],["ابطال‌پذیری و کیفیتِ علمی","ادعا می‌تواند از نظر فنی ابطال‌پذیر اما روش‌شناختاً ضعیف باشد؛ لاکاتوش می‌پرسد برنامه موفقیتِ تازه می‌سازد یا فقط امکانِ تناقضِ صوری دارد."]],"mistakes":["توقف روی پوپر چنان‌که کارِ بعدی محدودیتِ جدیِ ابطال‌گراییِ ساده را نشان نداده باشد.","شعارِ نسبی‌گرایانه کردنِ کوهن و صرفِ واژگان دانستنِ لاکاتوش، نه پاسخ به مسائلِ واقعیِ ناهنجاری و تغییرِ نظریه."],"check":{"q":"نظریه‌ای پیش‌بینی را از دست می‌دهد، مدافعان فرضِ کمکی را عوض می‌کنند و مدلِ تغییرکرده بعداً نتیجه‌ای تازه را درست پیش‌بینی می‌کند. کدام زنجیرهٔ مفهومی این رویداد را تشخیص می‌دهد؟","a":"دوئم‌ـ‌کواین توضیح می‌دهد چرا تغییرِ فرضِ کمکی ممکن است؛ پوپر فشارِ آزمونِ پرخطر را می‌دهد؛ لاکاتوش ترمیم را به‌سببِ موفقیتِ تجربیِ تازه پیش‌رونده می‌داند."}}},"social":{"en":{"line":"Social epistemology studies how knowledge depends on other people and institutions—and how trust, expertise, disagreement, cascades, and network structure can improve or corrupt collective belief.","why":"<p>Most knowledge is socially acquired, so an epistemology of isolated individuals misses the dominant information channel. The central task is to distinguish genuine distributed evidence from copied consensus and to design institutions that aggregate information rather than suppress, distort, or duplicate it.</p>","origin":"The branch includes testimony theory, Alvin Goldman’s social epistemology and work on expertise, peer disagreement, Aumann’s interactive epistemology, information cascades, Condorcet-style aggregation, epistemic injustice, and contemporary analysis of echo chambers and bubbles.","obj":[["Truth is individual: groups do not literally have minds, so social epistemology is just sociology of belief.","Even if only individuals believe, their evidence and reliability are structured by institutions, testimony, peer review, media networks, and incentives. Social arrangements can be evaluated by how well they produce true or justified individual beliefs."],["Social approaches risk replacing truth with consensus or power analysis.","A truth-oriented social epistemology treats consensus as evidence only under conditions such as competence, independence, diversity, and good incentives. Power analysis matters because it can change who is heard and what evidence reaches the system, not because power makes propositions true."]],"confuse":[["Consensus and independent confirmation","Agreement is strong evidence only to the degree the sources are independently informed. Common-source agreement can be epistemically shallow."],["Epistemic bubble and echo chamber","A bubble omits voices; an echo chamber actively discredits outsiders. Exposure can help the first and backfire in the second."]],"mistakes":["Counting people rather than tracing information lineages.","Treating expertise as a binary credential rather than domain-specific, incentive-sensitive, and track-record-sensitive evidence."],"check":{"q":"A committee has ten unanimous experts but all were trained by the same lab, use the same dataset, and cite the same paper. What social-epistemic question dominates the headcount?","a":"Independence. The apparent ten votes may represent one evidential lineage. You should trace source genealogy, method diversity, incentives, and whether any member brings genuinely independent information."}},"fa":{"line":"معرفت‌شناسیِ اجتماعی بررسی می‌کند معرفت چگونه به دیگران و نهادها وابسته است و اعتماد، تخصص، اختلاف، آبشار و ساختارِ شبکه چگونه باورِ جمعی را بهتر یا فاسد می‌کنند.","why":"<p>بیشترِ معرفت اجتماعی به دست می‌آید؛ پس معرفت‌شناسیِ فردِ منزوی کانالِ اصلیِ اطلاعات را از دست می‌دهد. کارِ مرکزی جداکردنِ شاهدِ توزیع‌شدهٔ واقعی از اجماعِ کپی‌شده و طراحیِ نهادی است که اطلاعات را تجمیع کند نه سرکوب، تحریف یا تکرار.</p>","origin":"شاخه نظریهٔ گواهی، معرفت‌شناسیِ اجتماعی و تخصص نزد آلوین گلدمن، اختلافِ همتا، معرفت‌شناسیِ تعاملیِ اومن، آبشارهای اطلاعاتی، تجمیعِ کندورسه‌ای، بی‌عدالتیِ معرفتی و تحلیلِ معاصرِ اتاقِ پژواک و حباب را دربر می‌گیرد.","obj":[["حقیقت فردی است؛ گروه ذهنِ واقعی ندارد، پس معرفت‌شناسیِ اجتماعی فقط جامعه‌شناسیِ باور است.","حتی اگر فقط فرد باور داشته باشد، شاهد و اعتمادپذیریِ او با نهاد، گواهی، داوریِ همتا، شبکهٔ رسانه و انگیزه ساختار می‌گیرد. ترتیباتِ اجتماعی را می‌توان با توانِ تولیدِ باورِ صادق یا موجه در افراد ارزیابی کرد."],["رویکردِ اجتماعی ممکن است حقیقت را با اجماع یا تحلیلِ قدرت جایگزین کند.","معرفت‌شناسیِ اجتماعیِ حقیقت‌محور اجماع را فقط زیرِ شرایطی مانند شایستگی، استقلال، تنوع و انگیزهٔ خوب شاهد می‌داند. قدرت مهم است چون تعیین می‌کند چه کسی شنیده و چه شاهدی واردِ نظام شود، نه چون قدرت گزاره را صادق می‌کند."]],"confuse":[["اجماع و تأییدِ مستقل","توافق فقط به اندازهٔ استقلالِ اطلاعاتیِ منابع شاهدِ قوی است. توافقِ تک‌منبعی می‌تواند کم‌عمق باشد."],["حبابِ معرفتی و اتاقِ پژواک","حباب صداها را حذف می‌کند؛ اتاقِ پژواک بیرونی‌ها را فعالانه بی‌اعتبار می‌کند. مواجهه با دیدگاهِ دیگر ممکن است اولی را اصلاح و دومی را بدتر کند."]],"mistakes":["شمردنِ افراد به‌جای ردیابیِ تبارِ اطلاعات.","دوگانه‌کردنِ تخصص به مدرک/بی‌مدرک، به‌جای شاهدِ حوزه‌ای، حساس به انگیزه و کارنامه."],"check":{"q":"کمیته ده متخصصِ هم‌رأی دارد اما همه از یک آزمایشگاه آموزش دیده، همان داده را استفاده و همان مقاله را استناد می‌کنند. چه پرسشِ اجتماعی از تعداد مهم‌تر است؟","a":"استقلال. ده رأیِ ظاهری شاید یک دودمانِ شاهدی باشد. باید تبارِ منبع، تنوعِ روش، انگیزه و وجودِ اطلاعاتِ واقعاً مستقل را ردیابی کنید."}}},"natur":{"en":{"line":"Naturalized epistemology asks how empirical facts about actual cognition should constrain or reshape theories of how humans ought to form beliefs.","why":"<p>Normative rules are useless if no real mind can implement them, and theories of reasoning should learn from psychology, cognitive science, and behavioral evidence. The central tension is how to use descriptive science without collapsing “how people do think” into “how they should think.”</p>","origin":"W.V.O. Quine famously proposed replacing or transforming traditional epistemology with a scientific study of how sensory input produces theory. Later naturalized approaches range from heuristics-and-biases research to ecological rationality, motivated reasoning, and argumentative theories of reason.","obj":[["Naturalization commits the naturalistic fallacy: facts about cognition cannot by themselves yield norms of rational belief.","Many contemporary naturalists concede the point and use empirical science as a constraint rather than a complete replacement. Independent epistemic aims—accuracy, coherence, understanding—supply norms; psychology tells us which procedures realistically advance them."],["Psychological findings themselves face replication and generalizability problems, so importing them can make epistemology less stable rather than more.","Exactly why the branch includes critique of bias research. Naturalized epistemology should apply its own standards: replication, ecological validity, effect sizes, and structural interventions rather than memorizing a catalog of famous effects."]],"confuse":[["Descriptive psychology and normative epistemology","Psychology describes cognitive mechanisms; epistemology evaluates which mechanisms or strategies are good relative to epistemic goals. Naturalization connects them without making them identical."],["Bias and irrationality","A heuristic can be biased under one laboratory criterion yet ecologically rational in the environment for which it evolved or was learned."]],"mistakes":["Turning a list of cognitive biases into a complete theory of irrationality.","Assuming a laboratory effect transfers unchanged to high-skill professional or ecologically different contexts."],"check":{"q":"A heuristic violates an ideal Bayesian rule in a lab but beats the formal model out of sample in a noisy real environment. What naturalized-epistemology question follows?","a":"Which norm is appropriate to the actual task and resource constraints? The empirical success does not automatically make the heuristic rational, but it forces the normative theory to explain why its ideal rule performs worse in the environment of interest."}},"fa":{"line":"معرفت‌شناسیِ طبیعی‌شده می‌پرسد واقعیت‌های تجربی دربارهٔ شناختِ واقعی چگونه باید نظریه‌های «چگونه باید باور بسازیم» را محدود یا بازطراحی کنند.","why":"<p>قاعدهٔ هنجاری اگر هیچ ذهنِ واقعی نتواند اجرا کند بی‌فایده است و نظریهٔ استدلال باید از روان‌شناسی، علومِ شناختی و شاهدِ رفتاری بیاموزد. تنشِ مرکزی این است که چگونه از علمِ توصیفی استفاده کنیم بی‌آنکه «مردم چگونه فکر می‌کنند» را به «چگونه باید فکر کنند» تبدیل کنیم.</p>","origin":"دبلیو.وی.او. کواین پیشنهادِ مشهورِ جایگزینی یا دگرگون‌کردنِ معرفت‌شناسیِ سنتی با مطالعهٔ علمیِ تبدیلِ ورودیِ حسی به نظریه را داد. رویکردهای بعدی از پژوهشِ ابتکارها و سوگیری‌ها تا عقلانیتِ بوم‌شناختی، استدلالِ انگیزه‌مند و نظریهٔ استدلالیِ عقل امتداد دارند.","obj":[["طبیعی‌سازی مغالطهٔ طبیعت‌گرایانه می‌کند: واقعیتِ شناخت به‌تنهایی هنجارِ باورِ عقلانی نمی‌دهد.","بسیاری از طبیعی‌گرایانِ امروز نکته را می‌پذیرند و علم را قید می‌دانند نه جایگزینِ کامل. غایت‌های مستقل مانند دقت، انسجام و فهم هنجار را می‌دهند؛ روان‌شناسی می‌گوید چه رویه‌ای واقعاً آن‌ها را پیش می‌برد."],["خودِ یافته‌های روان‌شناسی مشکلِ بازتولید و تعمیم دارند؛ ورودشان شاید معرفت‌شناسی را بی‌ثبات‌تر کند.","دقیقاً به همین دلیل شاخه نقدِ پژوهشِ سوگیری را هم دارد. طبیعی‌سازی باید استانداردِ خودش را اعمال کند: بازتولید، اعتبارِ بوم‌شناختی، اندازهٔ اثر و مداخلهٔ ساختاری، نه حفظِ فهرستِ اثرهای مشهور."]],"confuse":[["روان‌شناسیِ توصیفی و معرفت‌شناسیِ هنجاری","روان‌شناسی سازوکار را توصیف می‌کند؛ معرفت‌شناسی می‌سنجد کدام سازوکار یا راهبرد نسبت به غایتِ معرفتی خوب است. طبیعی‌سازی آن‌ها را وصل می‌کند نه یکی."],["سوگیری و غیرعقلانیت","ابتکار ممکن است زیرِ معیارِ آزمایشگاهی سوگیرانه اما در محیطِ واقعی که برایش تکامل یا یادگیری یافته عقلانیاً کارآمد باشد."]],"mistakes":["تبدیلِ فهرستِ سوگیری‌ها به نظریهٔ کاملِ غیرعقلانیت.","فرض‌کردنِ اینکه اثرِ آزمایشگاهی بدون تغییر به محیطِ حرفه‌ایِ خبره یا بوم‌شناختیِ متفاوت منتقل می‌شود."],"check":{"q":"ابتکاری در آزمایش قاعدهٔ ایده‌آلِ بیزی را نقض می‌کند اما در محیطِ واقعیِ پرنویز خارج از نمونه از مدلِ صوری بهتر عمل می‌کند. چه پرسشی می‌آید؟","a":"کدام هنجار برای وظیفه و محدودیتِ واقعی مناسب است؟ موفقیتِ تجربی خودکار ابتکار را عقلانی نمی‌کند، اما نظریهٔ هنجاری را مجبور می‌کند توضیح دهد چرا قاعدهٔ ایده‌آلش در محیطِ هدف بدتر کار می‌کند."}}},"virtue":{"en":{"line":"Virtue epistemology shifts the unit of analysis from isolated beliefs to the intellectual agent: what abilities, habits, and character make cognitive success attributable to the knower?","why":"<p>Rules can be gamed and evidence can be selectively handled. A theory of good inquiry also needs the agent’s competence, motives, and habits. Virtue approaches explain knowledge and responsible inquiry through intellectual abilities or character traits that make truth and understanding more reliably attainable.</p>","origin":"Contemporary virtue epistemology includes reliabilist virtue approaches associated with Ernest Sosa and responsibilist/character approaches associated with Linda Zagzebski. The branch connects to epistemic vices, scout mindset, ethics of belief, and the difference between lying and indifference to truth.","obj":[["Character talk seems too vague to analyze individual beliefs or determine whether a particular claim is justified.","Virtue theories differ in ambition. Competence-based accounts give precise conditions on successful performance; character accounts complement belief-level analysis by explaining stable patterns across many inquiries. They need not replace every evidential criterion."],["A virtuous person can still be wrong, so virtue cannot guarantee knowledge.","Virtue is generally fallibilist. The key claim is attribution: when a true belief arises because of intellectual competence rather than luck, it has a different epistemic status. One failure does not erase a reliable disposition."]],"confuse":[["Virtue and niceness","Intellectual virtue is indexed to epistemic aims, not social pleasantness. Intellectual courage can be uncomfortable and epistemic honesty can be blunt."],["Virtue and absence of bias","A virtuous agent still has cognitive biases. Virtue concerns habits for detecting, correcting, and responsibly managing fallibility."]],"mistakes":["Treating intellectual humility as chronic self-doubt.","Using virtue vocabulary to praise personalities without tying traits to observable epistemic practices."],"check":{"q":"A researcher gets the answer right through a process she does not understand and cannot reproduce, while another gets it right through a well-calibrated skill. What does virtue epistemology care about?","a":"Whether the truth is attributable to the agent’s epistemic competence or character rather than luck. Successful performance “because of” ability is central, not truth alone."}},"fa":{"line":"معرفت‌شناسیِ فضیلت واحدِ تحلیل را از باورِ منفرد به عاملِ فکری می‌برد: کدام توانایی، عادت و منش موفقیتِ شناختی را به خودِ داننده نسبت‌پذیر می‌کند؟","why":"<p>قاعده می‌تواند بازی داده شود و شاهد گزینشی مدیریت شود. نظریهٔ پژوهشِ خوب به شایستگی، انگیزه و عادتِ عامل نیز نیاز دارد. رویکردِ فضیلت معرفت و پژوهشِ مسئولانه را با توانایی یا منشِ فکری توضیح می‌دهد که حقیقت و فهم را قابل‌اعتمادتر می‌کند.</p>","origin":"معرفت‌شناسیِ فضیلتِ معاصر شامل رویکردِ اعتمادگرایِ فضیلت با ارنست سوسا و رویکردِ منش/مسئولیت با لیندا زاگزبسکی است. شاخه به رذایلِ معرفتی، ذهنیتِ دیده‌بان، اخلاقِ باور و تمایزِ دروغ از بی‌تفاوتی به حقیقت وصل می‌شود.","obj":[["زبانِ منش برای تحلیلِ باورِ منفرد یا تعیینِ توجیهِ ادعای خاص بیش از حد مبهم است.","نظریه‌ها هدفِ متفاوت دارند. روایتِ شایستگی شرط‌های دقیق‌تری روی عملکرد می‌دهد؛ روایتِ منش تحلیلِ سطحِ باور را با توضیحِ الگوی پایدارِ چند پژوهش تکمیل می‌کند. لازم نیست هر معیارِ شاهدی را جایگزین کند."],["شخصِ فضیلت‌مند هم می‌تواند اشتباه کند؛ پس فضیلت معرفت را تضمین نمی‌کند.","فضیلت عموماً خطاپذیر است. ادعای اصلی نسبت‌پذیری است: وقتی باورِ صادق به‌سببِ شایستگیِ فکری پدید می‌آید، نه شانس، شأنِ متفاوتی دارد. یک شکست گرایشِ قابل‌اعتماد را پاک نمی‌کند."]],"confuse":[["فضیلت و خوش‌رفتاری","فضیلتِ فکری نسبت به غایتِ معرفتی تعریف می‌شود نه خوشایندیِ اجتماعی. شجاعتِ فکری ممکن است ناراحت‌کننده و صداقتِ معرفتی صریح باشد."],["فضیلت و نبودِ سوگیری","عاملِ فضیلت‌مند همچنان سوگیری دارد. فضیلت دربارهٔ عادتِ تشخیص، اصلاح و مدیریتِ مسئولانهٔ خطاپذیری است."]],"mistakes":["فهمِ فروتنیِ فکری به‌عنوان تردیدِ مزمن به خود.","استفاده از واژگانِ فضیلت برای ستایشِ شخصیت بدون پیوندِ صفت به عملِ معرفتیِ قابل‌مشاهده."],"check":{"q":"پژوهشگری با فرایندی که نمی‌فهمد و نمی‌تواند بازتولید کند درست می‌گوید و دیگری با مهارتی کالیبره و قابل‌تکرار درست می‌گوید. فضیلت به چه چیزی اهمیت می‌دهد؟","a":"به اینکه حقیقت به شایستگی یا منشِ معرفتیِ عامل نسبت‌پذیر است یا به شانس. موفقیت «به‌سببِ» توانایی مرکزی است، نه صرفِ صدق."}}},"logic":{"en":{"line":"Logic and argumentation ask what follows from what, which hidden warrants connect evidence to conclusions, and how burdens and fallacies structure rational disagreement.","why":"<p>A dispute can fail even when everyone has the same facts because the inference is invalid, a premise is false, a warrant is hidden, or the burden is assigned differently. Argument analysis makes those layers visible instead of treating disagreement as a collision of conclusions.</p>","origin":"The branch runs from Aristotelian validity and classical inference through modern formal logic to informal argumentation, including Toulmin’s claim–grounds–warrant structure and contemporary analysis of fallacies, burden of proof, steelmanning, and rhetorical maneuvers.","obj":[["Formal logic strips away context, uncertainty, and defeasible reasoning, so it poorly models real policy argument.","That is why formal and informal tools complement each other. Validity diagnoses entailment; Toulmin exposes warrants and qualifiers; probabilistic and defeasible reasoning handle uncertainty. No single formalism needs to do every job."],["Fallacy labels often become rhetorical weapons rather than analysis.","Correct use requires reconstruction first. State the strongest premises and warrant, then show exactly why the inference fails. A label without the reconstruction is usually a substitute for reasoning."]],"confuse":[["Validity and soundness","Validity concerns the inferential form; soundness adds true premises. A correct conclusion can come from an unsound argument."],["Evidence and warrant","Evidence is the grounds offered. The warrant is the usually unstated rule that licenses moving from those grounds to the claim."]],"mistakes":["Arguing over data when the real disagreement is an unstated warrant.","Treating the defeat of one argument as the defeat of the conclusion itself."],"check":{"q":"Two people agree that a study found X but disagree whether X supports regulation Y. What Toulmin-style question should you ask before collecting more data?","a":"“What has to be true for X to support Y?” That exposes the warrant—often the actual location of disagreement—before adding more grounds that both sides may interpret differently."}},"fa":{"line":"منطق و نظریهٔ استدلال می‌پرسند چه چیزی از چه چیزی نتیجه می‌شود، کدام مجوزِ پنهان شاهد را به نتیجه وصل می‌کند و بارِ اثبات و مغالطه چگونه اختلافِ عقلانی را ساختار می‌دهند.","why":"<p>بحث می‌تواند حتی با واقعیت‌های مشترک شکست بخورد چون استنتاج نامعتبر، مقدمه کاذب، مجوز پنهان یا بارِ متفاوت است. تحلیلِ استدلال این لایه‌ها را آشکار می‌کند تا اختلاف فقط برخوردِ نتیجه‌ها دیده نشود.</p>","origin":"شاخه از اعتبارِ ارسطویی و استنتاجِ کلاسیک تا منطقِ صوریِ مدرن و نظریهٔ غیرصوری می‌رود، از جمله ساختارِ ادعا–مبنا–مجوزِ تولمین و تحلیلِ معاصرِ مغالطه، بارِ اثبات، فولادین‌سازی و مانورهای بلاغی.","obj":[["منطقِ صوری زمینه، عدمِ‌قطعیت و استدلالِ قابل‌ابطال را حذف می‌کند و مدلِ ضعیفی برای بحثِ سیاستی است.","به همین دلیل ابزارهای صوری و غیرصوری مکمل‌اند. اعتبار استلزام را تشخیص می‌دهد؛ تولمین مجوز و قید را آشکار می‌کند؛ احتمال و استدلالِ قابل‌ابطال عدمِ‌قطعیت را می‌گیرند. هیچ دستگاهی لازم نیست همهٔ کارها را انجام دهد."],["برچسبِ مغالطه اغلب سلاحِ بلاغی می‌شود نه تحلیل.","کاربردِ درست اول بازسازی می‌خواهد. قوی‌ترین مقدمات و مجوز را بیان کنید و بعد دقیق نشان دهید استنتاج چرا می‌شکند. برچسب بدون بازسازی معمولاً جانشینِ استدلال است."]],"confuse":[["اعتبار و استواری","اعتبار دربارهٔ صورتِ استنتاج است؛ استواری صدقِ مقدمات را نیز می‌افزاید. نتیجهٔ درست می‌تواند از استدلالِ نامستوار بیاید."],["شاهد و مجوز","شاهد مبنای ارائه‌شده است. مجوز قاعدهٔ معمولاً ناگفته‌ای است که حرکت از مبنا به ادعا را مجاز می‌کند."]],"mistakes":["دعوا بر سرِ داده وقتی اختلافِ واقعی مجوزِ ناگفته است.","شکستِ یک استدلال را شکستِ خودِ نتیجه دانستن."],"check":{"q":"دو نفر توافق دارند پژوهش X را یافته اما اختلاف دارند آیا X از مقررهٔ Y حمایت می‌کند. پیش از جمع‌کردنِ دادهٔ بیشتر چه پرسشِ تولمینی می‌پرسید؟","a":"«چه چیزی باید صادق باشد تا X از Y حمایت کند؟» این مجوز را آشکار می‌کند — اغلب محلِ واقعیِ اختلاف — پیش از افزودنِ مبنای بیشتری که دو طرف باز هم متفاوت تفسیر می‌کنند."}}},"relig":{"en":{"line":"Religious epistemology uses faith as a concentrated test case for general questions about evidence, basic belief, defeaters, hinges, and the ethics of believing under uncertainty.","why":"<p>Religious claims sit where ordinary evidential standards, existential commitment, testimony, metaphysics, and identity meet. The point of the branch is not to decide theology in advance but to ask which epistemic rules apply: Clifford versus James, Plantinga’s proper basicality, fideism, hinge approaches, and Flew’s challenge about immunization.</p>","origin":"The modern debate includes W.K. Clifford and William James on the ethics of belief, Alvin Plantinga’s Reformed epistemology, fideist and Wittgensteinian traditions, and Antony Flew’s falsification challenge. These positions import general epistemic machinery into a domain where the stakes and kinds of evidence are contested.","obj":[["Religious epistemology often seems like special pleading designed to protect a favored conclusion.","That danger is real, which is why symmetry is a key test: any permission granted to one tradition should be examined for what it licenses elsewhere. Properly basic or hinge status needs principled limits and defeaters, not a religion-specific exemption."],["Standard evidentialist criticism treats religion like a scientific hypothesis even when believers understand it as commitment or form of life.","Then the critic must separate empirical claims from non-empirical or practical commitments. But changing the category does not make every associated factual claim immune; historical, causal, and predictive claims remain answerable to relevant evidence."]],"confuse":[["Religious epistemology and theology","Theology asks substantive questions about God and doctrines. Religious epistemology asks what could justify or warrant those beliefs and how defeaters work."],["Faith and immunity","A belief can be faith-based while remaining answerable to some defeaters. Total immunity is a much stronger thesis and creates symmetry and content problems."]],"mistakes":["Treating 'evidence' as a single uncontested category instead of asking which sources count and why.","Applying skeptical standards to a rival tradition that you would not apply symmetrically to your own foundational commitments."],"check":{"q":"A religious claim is said to be properly basic, but a critic asks why an incompatible tradition cannot say exactly the same. What epistemic problem has appeared?","a":"The symmetry/Great-Pumpkin problem: the theory needs a principled account of proper basicality, cognitive conditions, and defeaters that distinguishes warranted basic belief from arbitrary exemption."}},"fa":{"line":"معرفت‌شناسیِ دینی از ایمان به‌عنوان آزمونِ فشردهٔ پرسش‌های عمومی دربارهٔ شاهد، باورِ پایه، ابطال‌کننده، لولا و اخلاقِ باور زیرِ عدمِ‌قطعیت استفاده می‌کند.","why":"<p>ادعای دینی در محلِ تلاقیِ معیارِ شاهد، تعهدِ وجودی، گواهی، متافیزیک و هویت قرار دارد. هدفِ شاخه تصمیمِ پیشینی دربارهٔ الهیات نیست؛ می‌پرسد کدام قاعدهٔ معرفتی اعمال می‌شود: کلیفورد در برابر جیمز، پایه‌بودنِ پلنتینگا، ایمان‌گرایی، لولا و چالشِ فلو دربارهٔ مصون‌سازی.</p>","origin":"بحثِ مدرن شامل کلیفورد و ویلیام جیمز دربارهٔ اخلاقِ باور، معرفت‌شناسیِ اصلاح‌شدهٔ آلوین پلنتینگا، سنت‌های ایمان‌گرا و ویتگنشتاینی و چالشِ ابطالِ آنتونی فلو است. این مواضع ابزارِ عمومیِ معرفت‌شناسی را وارد حوزه‌ای می‌کنند که هم نوعِ شاهد و هم مخاطره محلِ اختلاف است.","obj":[["معرفت‌شناسیِ دینی اغلب امتیازدهیِ ویژه برای حفاظت از نتیجهٔ محبوب به نظر می‌رسد.","خطر واقعی است و به همین دلیل تقارن آزمونِ کلیدی است: هر مجوزی که به یک سنت می‌دهید باید ببینید جای دیگر چه چیزی را مجاز می‌کند. پایه یا لولا به حد و ابطال‌کنندهٔ اصولی نیاز دارد، نه معافیتِ دین‌خاص."],["نقدِ شاهدگرای استاندارد دین را مانند فرضیهٔ علمی می‌سنجد، در حالی که مؤمن آن را تعهد یا شیوهٔ زندگی می‌داند.","در آن صورت منتقد باید ادعای تجربی را از تعهدِ غیرتجربی یا عملی جدا کند. اما تغییرِ دسته همهٔ ادعاهای factualِ همراه را مصون نمی‌کند؛ ادعای تاریخی، علّی و پیش‌بینی همچنان به شاهدِ مرتبط پاسخ‌گوست."]],"confuse":[["معرفت‌شناسیِ دینی و الهیات","الهیات دربارهٔ خدا و آموزه‌ها سؤالِ محتوایی می‌پرسد؛ معرفت‌شناسیِ دینی می‌پرسد چه چیزی آن باورها را موجه یا دارای ضمانت می‌کند و ابطال‌کننده چگونه کار می‌کند."],["ایمان و مصونیت","باور می‌تواند ایمانی باشد و همچنان به بعضی ابطال‌کننده‌ها پاسخ دهد. مصونیتِ کامل تزِ بسیار قوی‌تری است و مشکلِ تقارن و محتوا می‌سازد."]],"mistakes":["فهمِ «شاهد» به‌عنوان یک دستهٔ واحد و بی‌مناقشه، نه پرسش دربارهٔ اینکه کدام منبع چرا حساب می‌شود.","اعمالِ معیارِ شکاکانه به سنتِ رقیب که به تعهداتِ بنیادینِ خودتان به‌طور متقارن اعمال نمی‌کنید."],"check":{"q":"باورِ دینی «به‌درستی پایه» خوانده می‌شود اما منتقد می‌پرسد چرا سنتِ ناسازگار دقیقاً همان را نگوید. چه مسئله‌ای ظاهر شده؟","a":"مسئلهٔ تقارن/کدوی بزرگ: نظریه باید روایتِ اصولی از پایه‌بودن، شرایطِ شناختی و ابطال‌کننده بدهد که باورِ پایهٔ دارای ضمانت را از معافیتِ دلبخواهی جدا کند."}}}};

const R3={"affirm":{"en":{"line":"Observing a predicted consequence does not prove the hypothesis that predicted it; the same consequence may have many causes.","why":"<p>Empirical reasoning constantly moves from “if the hypothesis is true, we should see Q” to “we see Q.” The temptation is to conclude the hypothesis is true. That move is invalid unless rival explanations of Q are also considered. The concept exists to separate prediction from discrimination: evidence matters only when it is more expected under your hypothesis than under alternatives.</p>","origin":"A standard formal fallacy from classical logic: <i>If P, then Q; Q; therefore P</i>. In modern empirical work the same structure reappears as weak confirmation. Bayesian likelihood ratios make the missing step explicit by asking how expected Q was if P were false.","obj":[["But observing a predicted result really should increase confidence in the theory.","Yes—often it should. The fallacy is not updating upward; it is treating Q as deductive proof of P. The size of the update depends on how surprising Q would be under rival hypotheses."],["If the prediction was made in advance, does that rescue the inference?","Pre-specification prevents some post-hoc fitting, but it does not create uniqueness. A risky prediction is strong evidence only when plausible alternatives did not predict it nearly as well."]],"confuse":[["Affirming the consequent vs. Bayesian confirmation","Bayesian confirmation is probabilistic: Q can raise P without entailing it. Affirming the consequent incorrectly turns that probabilistic support into deductive certainty."],["Affirming the consequent vs. modus ponens","Modus ponens goes from P and P→Q to Q and is valid. Affirming the consequent reverses that direction and is invalid."]],"mistakes":["Calling every successful prediction a fallacy. Successful predictions can be excellent evidence; the error is ignoring how well alternatives predict the same result.","Using “consistent with the hypothesis” as though consistency were discriminating evidence."],"check":{"q":"A model predicts spreads will widen during stress. They widen. What must you know before saying this strongly confirms the model?","a":"How likely the widening was under serious rival models. If they also predicted it, the observation has little discriminating force; if they predicted stability, the evidence is much stronger."}},"fa":{"line":"مشاهدهٔ پیامدی که یک فرضیه پیش‌بینی کرده، آن فرضیه را اثبات نمی‌کند؛ همان پیامد ممکن است علل و توضیح‌های دیگری هم داشته باشد.","why":"<p>استدلالِ تجربی دائماً از «اگر فرضیه درست باشد، باید Q را ببینیم» به «Q را می‌بینیم» می‌رسد. وسوسه این است که نتیجه بگیریم فرضیه درست است. این حرکت تا وقتی توضیح‌های رقیبِ Q سنجیده نشده‌اند نامعتبر است. این مفهوم برای جداکردنِ <b>پیش‌بینی</b> از <b>تمایزبخشی</b> لازم است: شاهد زمانی نیرو دارد که تحتِ فرضیهٔ شما از بدیل‌ها محتمل‌تر باشد.</p>","origin":"یک مغالطهٔ صوریِ استاندارد: <i>اگر P آنگاه Q؛ Q؛ پس P</i>. در پژوهشِ مدرن همین ساختار به‌صورتِ «تأییدِ ضعیف» ظاهر می‌شود. نسبتِ درست‌نماییِ بیزی مرحلهٔ گمشده را آشکار می‌کند: اگر P نادرست بود Q چقدر انتظار می‌رفت؟","obj":[["اما دیدنِ نتیجه‌ای که نظریه پیش‌بینی کرده واقعاً باید اطمینان ما را بالا ببرد.","اغلب بله. مغالطه در افزایشِ احتمالیِ باور نیست؛ در تبدیلِ Q به اثباتِ قیاسیِ P است. اندازهٔ به‌روزرسانی به این بستگی دارد که Q زیرِ فرضیه‌های رقیب چقدر نامحتمل بوده باشد."],["اگر پیش‌بینی از قبل ثبت شده باشد، استنتاج نجات پیدا نمی‌کند؟","پیش‌ثبت از بعضی سازگارسازی‌های پسینی جلوگیری می‌کند، اما یکتایی نمی‌سازد. پیش‌بینی فقط وقتی شاهدِ قوی است که بدیل‌های جدی آن را تقریباً به همان خوبی پیش‌بینی نکرده باشند."]],"confuse":[["وضعِ تالی و تأییدِ بیزی","تأییدِ بیزی احتمالاتی است: Q می‌تواند احتمالِ P را بالا ببرد بی‌آنکه آن را نتیجه دهد. وضعِ تالی این حمایتِ احتمالاتی را به یقینِ قیاسی تبدیل می‌کند."],["وضعِ تالی و وضعِ مقدم","وضعِ مقدم از P و P→Q به Q می‌رود و معتبر است. وضعِ تالی جهت را برمی‌گرداند و نامعتبر است."]],"mistakes":["مغالطه‌نامیدنِ هر پیش‌بینیِ موفق. پیش‌بینیِ موفق می‌تواند شاهدِ عالی باشد؛ خطا نادیده‌گرفتنِ قدرتِ پیش‌بینیِ بدیل‌هاست.","استفاده از «با فرضیه سازگار است» به‌عنوان اینکه شاهد الزاماً تمایزبخش است."],"check":{"q":"مدلی پیش‌بینی می‌کند در دورهٔ تنش اسپردها باز شوند و همین رخ می‌دهد. پیش از اینکه بگویید این نتیجه مدل را قویاً تأیید می‌کند چه باید بدانید؟","a":"اینکه مدل‌های رقیبِ جدی چقدر همین بازشدن را پیش‌بینی می‌کردند. اگر آن‌ها هم چنین انتظاری داشتند، شاهد تمایزبخشِ کمی دارد؛ اگر ثبات را پیش‌بینی می‌کردند، شاهد بسیار قوی‌تر است."}}},"equiv":{"en":{"line":"Equivocation makes one word do two different jobs inside one argument, creating the appearance of continuity where the meaning has changed.","why":"<p>Many disagreements survive because both sides keep using the same label while attaching different criteria to it. The argument then looks valid on paper because the repeated word hides the switch. Naming equivocation gives you a procedural cure: replace the contested word with explicit descriptions and see whether the inference still works.</p>","origin":"A classical informal fallacy, recognized since ancient treatments of sophistical refutation. Its modern importance is greatest in technical-policy language, where words such as “risk,” “material,” “efficient,” or “significant” can move between statistical, economic, legal, and ordinary senses without warning.","obj":[["Natural language is flexible; demanding one rigid meaning is unrealistic.","Correct. The problem is not polysemy itself but switching senses while relying on the audience to treat them as one. A legitimate argument can change meanings if it marks the change and does not transfer conclusions across senses without a bridge."],["Sometimes the two senses overlap enough that the argument still works.","Then state the bridge explicitly. If the conclusion depends on the overlap, that overlap is a premise and should be defended rather than smuggled in by vocabulary."]],"confuse":[["Equivocation vs. ambiguity","Ambiguity is a property of an expression; equivocation is an argumentative move that exploits or fails to control that ambiguity across premises."],["Equivocation vs. changing your mind","A speaker may legitimately refine a claim. Equivocation occurs when the argument silently borrows support earned by one meaning for a different meaning."]],"mistakes":["Arguing about the label instead of operationalizing what each side means by it.","Assuming shared terminology implies shared thresholds, measurement rules, or normative criteria."],"check":{"q":"A memo says an event is “unlikely” meaning below 5%, then concludes it is “unlikely to matter” meaning economically small. What happened?","a":"Equivocation. The same word moved from probability to magnitude. The second claim needs a separate premise connecting low probability to low expected impact."}},"fa":{"line":"اشتراکِ لفظی وقتی رخ می‌دهد که یک واژه در یک استدلال دو کارِ معناییِ متفاوت انجام دهد و تغییرِ موضوع پشتِ ظاهرِ پیوستگی پنهان شود.","why":"<p>بسیاری از اختلاف‌ها زنده می‌مانند چون دو طرف همان برچسب را به کار می‌برند اما معیارهای متفاوتی از آن مراد می‌کنند. استدلال روی کاغذ معتبر به‌نظر می‌رسد چون تکرارِ واژه تغییرِ معنا را می‌پوشاند. نام‌گذاریِ این خطا یک درمانِ عملی دارد: واژهٔ محلِ نزاع را موقتاً حذف کنید و هر معنا را با توصیفی صریح جایگزین کنید.</p>","origin":"یک مغالطهٔ غیرصوریِ کلاسیک که از بحث‌های باستان دربارهٔ استدلال‌های سفسطه‌آمیز شناخته شده است. در سیاست‌گذاری و کارِ فنی اهمیتش بیشتر می‌شود، چون واژه‌هایی مثل «ریسک»، «مادی»، «کارا» و «معنادار» می‌توانند بی‌هشدار میان معنای آماری، اقتصادی، حقوقی و روزمره جابه‌جا شوند.","obj":[["زبان طبیعی انعطاف‌پذیر است؛ اصرار بر یک معنای سخت‌گیرانه واقع‌بینانه نیست.","درست است. مشکل چندمعنایی نیست؛ مشکل جابه‌جاییِ معنا در حالی است که شنونده آن‌ها را یکی حساب می‌کند. تغییرِ مشروع ممکن است، به شرط اینکه علامت‌گذاری شود و نتیجه بدون پل از یک معنا به معنای دیگر منتقل نشود."],["گاهی دو معنا به‌اندازهٔ کافی هم‌پوشان‌اند و استدلال همچنان درست است.","پس همان هم‌پوشانی را به‌عنوان مقدمهٔ صریح بنویسید. اگر نتیجه به پل میان دو معنا وابسته است، آن پل باید دفاع شود نه اینکه پشتِ واژه پنهان بماند."]],"confuse":[["اشتراک لفظی و ابهام","ابهام ویژگیِ یک عبارت است؛ اشتراکِ لفظی خطایی در استدلال است که از آن ابهام در طولِ مقدمات سوءاستفاده می‌کند یا آن را مهار نمی‌کند."],["اشتراک لفظی و اصلاحِ موضع","فرد می‌تواند ادعایش را مشروعاً دقیق‌تر کند. خطا زمانی است که حمایتی که یک معنا به دست آورده برای معنایی دیگر خرج شود."]],"mistakes":["دعوا بر سرِ خودِ برچسب به‌جای عملیاتی‌کردنِ معنایی که هر طرف از آن می‌خواهد.","فرض‌کردنِ اینکه واژگانِ مشترک یعنی آستانه، روشِ اندازه‌گیری یا معیارِ هنجاریِ مشترک."],"check":{"q":"یادداشتی می‌گوید رویداد «بعید» است، یعنی احتمال کمتر از ۵٪؛ سپس نتیجه می‌گیرد «بعید است اهمیت داشته باشد»، یعنی اثر اقتصادی کوچک است. چه رخ داده؟","a":"اشتراکِ لفظی. «بعید» از احتمال به بزرگیِ اثر جابه‌جا شده است. نتیجهٔ دوم به مقدمه‌ای جداگانه نیاز دارد که احتمالِ کم را به اثرِ موردانتظارِ کم پیوند دهد."}}},"modus":{"en":{"line":"Modus ponens transmits a condition forward; modus tollens uses a failed consequence to reject the condition. Both are valid, but only under a genuine conditional.","why":"<p>These two forms are the backbone of deductive testing. They matter because empirical arguments often imitate them without actually satisfying their premises. Popperian falsification has the form of modus tollens only if the prediction really follows from the theory-plus-auxiliaries; otherwise “not Q” does not isolate the theory.</p>","origin":"Canonical rules of inference in propositional logic. <i>Modus ponens</i>: P→Q, P, therefore Q. <i>Modus tollens</i>: P→Q, ¬Q, therefore ¬P. Their epistemic importance comes from the fact that verification and falsification are not logical mirror images.","obj":[["Real scientific predictions are probabilistic, so strict modus tollens almost never applies.","Exactly. The form remains useful as an idealization, but probabilistic tests require thresholds, likelihoods, and auxiliary assumptions. This is one reason simple falsificationism is too clean for real science."],["A failed prediction might reflect a bad measurement rather than a false theory.","That is the Duhem–Quine point. Modus tollens rejects the conjunction of theory, auxiliaries, measurement assumptions, and initial conditions; it does not by itself tell you which conjunct failed."]],"confuse":[["Modus tollens vs. denying the antecedent","From P→Q and ¬P you cannot infer ¬Q; Q may have other causes. Denying the antecedent is invalid."],["Modus ponens vs. affirming the consequent","From P→Q and Q you cannot infer P. That reversal is the affirming-the-consequent fallacy."]],"mistakes":["Writing “if the model is true, Q is likely” and then treating failure of Q as strict logical falsification.","Forgetting that the conditional itself is often the substantive and contestable premise."],"check":{"q":"If a theory plus auxiliaries entails X, and X is reliably not observed, what does modus tollens strictly license?","a":"It licenses rejection of the conjunction that entailed X. Additional argument is required to decide whether the core theory, an auxiliary, the measurement, or an initial condition should be abandoned."}},"fa":{"line":"وضعِ مقدم یک شرط را رو به جلو منتقل می‌کند؛ رفعِ تالی از شکستِ پیامد برای ردِ شرط استفاده می‌کند. هر دو معتبرند، اما فقط وقتی شرط واقعاً برقرار باشد.","why":"<p>این دو صورت ستونِ فقراتِ آزمونِ قیاسی‌اند. اهمیتشان در این است که استدلال‌های تجربی اغلب ظاهرِ آن‌ها را تقلید می‌کنند بی‌آنکه مقدماتشان را واقعاً داشته باشند. ابطالِ پوپری فقط زمانی صورتِ رفعِ تالی دارد که پیش‌بینی واقعاً از نظریه به‌علاوهٔ فرض‌های کمکی نتیجه شود.</p>","origin":"دو قاعدهٔ بنیادی در منطقِ گزاره‌ها. <i>وضعِ مقدم</i>: P→Q، P، پس Q. <i>رفعِ تالی</i>: P→Q، نه-Q، پس نه-P. اهمیتِ معرفتیِ آن‌ها از این می‌آید که تأیید و ابطال از نظر منطقی تصویرِ آینه‌ایِ هم نیستند.","obj":[["پیش‌بینی‌های علمی معمولاً احتمالاتی‌اند، پس رفعِ تالیِ سخت‌گیرانه به‌ندرت کاربرد دارد.","دقیقاً. صورتِ منطقی همچنان ایده‌آلِ مفیدی است، اما آزمونِ احتمالاتی به آستانه، درست‌نمایی و فرض‌های کمکی نیاز دارد. همین یکی از دلایلِ ناکافی‌بودنِ ابطال‌گراییِ ساده است."],["شکستِ پیش‌بینی شاید از ابزارِ بد باشد، نه نظریهٔ کاذب.","این همان نکتهٔ دوئم–کواین است. رفعِ تالی عطفِ نظریه، فرض‌های کمکی، سنجش و شرایطِ اولیه را رد می‌کند؛ خودش نمی‌گوید کدام جزء باید کنار گذاشته شود."]],"confuse":[["رفعِ تالی و انکارِ مقدم","از P→Q و نه-P نمی‌توان نه-Q را نتیجه گرفت؛ Q ممکن است علت‌های دیگری داشته باشد. انکارِ مقدم نامعتبر است."],["وضعِ مقدم و وضعِ تالی","از P→Q و Q نمی‌توان P را نتیجه گرفت. این وارونگی همان مغالطهٔ وضعِ تالی است."]],"mistakes":["نوشتنِ «اگر مدل درست باشد Q محتمل است» و سپس برخورد با نبودِ Q به‌عنوان ابطالِ منطقیِ قطعی.","فراموش‌کردنِ اینکه خودِ گزارهٔ شرطی اغلب مهم‌ترین مقدمهٔ محلِ اختلاف است."],"check":{"q":"اگر نظریه به‌همراهِ فرض‌های کمکی X را نتیجه دهد و X به‌طور قابل‌اعتماد مشاهده نشود، رفعِ تالی دقیقاً چه چیزی را مجاز می‌کند؟","a":"ردِ عطفی که X را نتیجه داده است. برای اینکه بدانیم نظریهٔ اصلی، فرضِ کمکی، سنجش یا شرایطِ اولیه مقصر است استدلالِ دیگری لازم داریم."}}},"straw":{"en":{"line":"A straw man wins against a weakened substitute for the opponent’s actual position, leaving the real position untouched.","why":"<p>Arguments are only informative if they engage the view someone actually holds. Distortion can be deliberate, but more often it comes from compressing a complex claim into a version that is easier to criticize. The remedy is procedural rather than psychological: reconstruct first, obtain agreement on the reconstruction, then object.</p>","origin":"A standard informal fallacy in modern argumentation theory. The exact phrase is relatively recent, but the underlying error—refuting a position nobody asserted—has been recognized in dialectical traditions for centuries.","obj":[["Sometimes the weaker version really is implied by what the speaker said.","Then show the entailment. If the original commitments logically lead to the weaker claim, criticizing it is not a straw man. The burden is to demonstrate the bridge rather than assume it."],["Requiring opponents to approve every summary lets them evade criticism by endlessly refining their position.","Agreement on wording is a safeguard, not a veto. Once a fair formulation is fixed, later retreats can themselves be analyzed as qualification or motte-and-bailey movement."]],"confuse":[["Straw man vs. reductio ad absurdum","A reductio derives an unacceptable consequence from the opponent’s actual premises. A straw man substitutes premises they do not hold."],["Straw man vs. simplification","Simplification is legitimate when it preserves the feature under dispute; distortion is not."]],"mistakes":["Refuting the weakest internet version of a view and treating that as engagement with its strongest professional form.","Assuming bad faith when a misunderstanding plus compressed language is enough to explain the distortion."],"check":{"q":"Before criticizing a colleague’s policy position, what single procedure most reliably prevents a straw man?","a":"Restate the position—including its strongest qualifications and warrant—until the colleague agrees that the reconstruction is fair; then attack that version."}},"fa":{"line":"پهلوانِ پنبه وقتی است که به نسخه‌ای ضعیف‌شده از موضعِ واقعیِ طرف مقابل حمله می‌کنید و خودِ موضع دست‌نخورده می‌ماند.","why":"<p>بحث فقط وقتی اطلاعات می‌دهد که با دیدگاهی درگیر شود که واقعاً کسی آن را دارد. تحریف می‌تواند عمدی باشد، اما اغلب از فشرده‌کردنِ ادعای پیچیده به نسخه‌ای آسان‌تر برای نقد پدید می‌آید. درمانِ اصلی رویه‌ای است: نخست بازسازی کنید، بر منصفانه‌بودنِ بازسازی توافق بگیرید، سپس اعتراض کنید.</p>","origin":"یک مغالطهٔ غیرصوریِ استاندارد در نظریهٔ استدلالِ جدید. خودِ اصطلاح نسبتاً جدید است، اما خطای زیرین—ردِ موضعی که کسی نگفته—در سنت‌های جدلی بسیار قدیمی شناخته شده است.","obj":[["گاهی نسخهٔ ضعیف واقعاً از حرفِ گوینده نتیجه می‌شود.","پس استلزام را نشان دهید. اگر تعهداتِ اصلی واقعاً به آن ادعا منتهی شوند، نقدِ آن پهلوان پنبه نیست. بارِ کار روی نشان‌دادنِ پل است."],["اگر هر خلاصه‌ای نیاز به تأییدِ طرف مقابل داشته باشد، او می‌تواند با اصلاحِ دائمی از نقد بگریزد.","توافق بر صورت‌بندی یک حفاظ است نه حقِ وتو. وقتی صورت‌بندیِ منصفانه ثابت شد، عقب‌نشینی‌های بعدی خود می‌توانند به‌عنوان قیدگذاری یا موت‌و‌بِیلی تحلیل شوند."]],"confuse":[["پهلوان پنبه و برهان خلف","برهانِ خلف پیامدی نامقبول را از مقدماتِ واقعیِ طرف مقابل نتیجه می‌گیرد. پهلوان پنبه مقدماتی را جایگزین می‌کند که او ندارد."],["پهلوان پنبه و ساده‌سازی","ساده‌سازی وقتی مشروع است که ویژگیِ محلِ اختلاف را حفظ کند؛ تحریف نه."]],"mistakes":["ردِ ضعیف‌ترین نسخهٔ اینترنتیِ یک دیدگاه و تصورِ اینکه قوی‌ترین نسخهٔ حرفه‌ایِ آن هم رد شده است.","فرضِ سوءنیت در حالی که بدفهمی و زبانِ فشرده برای توضیحِ تحریف کافی‌اند."],"check":{"q":"پیش از نقدِ موضعِ سیاستیِ همکارتان، کدام رویه بیش از همه جلوی پهلوان پنبه را می‌گیرد؟","a":"موضع، قیود و مجوزِ آن را چنان بازگو کنید که همکار بگوید بازسازی منصفانه است؛ بعد همان نسخه را نقد کنید."}}},"steel":{"en":{"line":"Steelmanning reconstructs the strongest defensible version of an opposing argument before evaluating it.","why":"<p>The easiest argument to defeat is rarely the one worth defeating. Steelmanning exists as a discipline against selection bias in criticism: if you choose the weakest formulation, you learn almost nothing about whether the core position survives. A strong reconstruction also exposes the real crux, because superficial wording differences have already been repaired.</p>","origin":"Associated with Anatol Rapoport’s rules for constructive disagreement and later popularized by Daniel Dennett. It is not a formal inference rule but a norm of dialectical charity: improve the opponent’s case enough that your criticism targets its load-bearing commitments.","obj":[["Improving an opponent’s argument can put words in their mouth.","Yes. The strengthened version must be marked as a charitable reconstruction, not attributed as a quotation. Ideally distinguish “what you said” from “the strongest version I think supports your conclusion.”"],["Steelmanning can waste time on positions nobody actually holds.","Then use it selectively. The point is to test the proposition or policy, not to invent a new ideology. If the strengthened version abandons the original commitments, it has ceased to be a steelman."]],"confuse":[["Steelmanning vs. agreement","You can make an argument much stronger and still reject it. Charity concerns representation, not concession."],["Steelmanning vs. moving the goalposts","A steelman is offered explicitly before evaluation. Moving the goalposts changes the defended claim after criticism without acknowledging the change."]],"mistakes":["Calling a merely polite summary a steelman; the test is whether you repaired genuine weaknesses while preserving the thesis.","Strengthening the conclusion itself rather than strengthening the reasons for the original conclusion."],"check":{"q":"What is the best sign that you have steelmanned rather than merely paraphrased an opposing view?","a":"The advocate recognizes the thesis, but the supporting warrant or evidence is stronger, clearer, and harder to attack than in the original presentation."}},"fa":{"line":"فولادین‌سازی یعنی پیش از ارزیابی، قوی‌ترین نسخهٔ قابل‌دفاع از استدلالِ مخالف را بازسازی کنید.","why":"<p>آسان‌ترین استدلال برای شکست‌دادن معمولاً ارزشِ شکست‌دادن ندارد. فولادین‌سازی انضباطی علیه سوگیریِ انتخاب در نقد است: اگر ضعیف‌ترین صورت‌بندی را انتخاب کنید، تقریباً چیزی دربارهٔ بقای هستهٔ موضع نمی‌آموزید. بازسازیِ قوی همچنین نقطهٔ واقعیِ اختلاف را آشکار می‌کند.</p>","origin":"با قواعدِ گفت‌وگوی سازندهٔ آناتول راپوپورت پیوند دارد و بعدتر به‌وسیلهٔ دنیل دنت مشهور شد. قاعدهٔ استنتاجی نیست؛ هنجاری از انصافِ جدلی است: استدلالِ طرف مقابل را آن‌قدر تقویت کنید که نقدِ شما به تعهداتِ باربرِ آن بخورد.","obj":[["تقویتِ استدلال ممکن است حرفی را به دهانِ طرف مقابل بگذارد که نگفته است.","درست است. نسخهٔ تقویت‌شده باید صریحاً «بازسازیِ خیرخواهانه» نامیده شود، نه نقل‌قول. بهتر است «آنچه گفتید» را از «قوی‌ترین نسخه‌ای که برای نتیجه‌تان می‌بینم» جدا کنید."],["فولادین‌سازی می‌تواند وقت را صرفِ موضعی کند که هیچ‌کس ندارد.","پس گزینشی استفاده کنید. هدف آزمونِ گزاره یا سیاست است، نه اختراعِ ایدئولوژیِ تازه. اگر نسخهٔ تقویت‌شده تعهداتِ اصلی را رها کند، دیگر فولادین‌سازی نیست."]],"confuse":[["فولادین‌سازی و موافقت","می‌توانید استدلال را بسیار قوی‌تر کنید و همچنان ردش کنید. انصاف دربارهٔ بازنمایی است، نه امتیازدادن."],["فولادین‌سازی و جابه‌جاییِ تیرک دروازه","فولادین‌سازی پیش از ارزیابی آشکارا عرضه می‌شود. جابه‌جاییِ تیرک بعد از نقد، ادعای دفاع‌شده را بی‌اعتراف تغییر می‌دهد."]],"mistakes":["نام‌دادنِ «فولادین‌سازی» به خلاصه‌ای صرفاً مؤدبانه؛ آزمون این است که آیا ضعفِ واقعی را با حفظِ تز ترمیم کرده‌اید.","تقویتِ خودِ نتیجه به‌جای تقویتِ دلایلِ نتیجهٔ اصلی."],"check":{"q":"بهترین نشانهٔ اینکه واقعاً فولادین‌سازی کرده‌اید و فقط بازگویی نکرده‌اید چیست؟","a":"صاحبِ موضع تز را مالِ خود می‌داند، اما مجوز یا شواهدِ نسخهٔ شما روشن‌تر، قوی‌تر و سخت‌تر برای نقد از ارائهٔ اولیه است."}}},"motte":{"en":{"line":"A motte-and-bailey alternates between a bold useful claim and a modest defensible claim, borrowing the latter’s safety for the former’s impact.","why":"<p>Some positions survive criticism not because one claim is well defended, but because two claims are traded back and forth. The broad “bailey” does the rhetorical or policy work; under pressure the speaker retreats to the narrow “motte,” wins agreement, and later acts as if the stronger claim was vindicated. The concept exists to freeze the target of evaluation.</p>","origin":"Named by philosopher Nicholas Shackel after a medieval fortification: a desirable open bailey next to a defensible mound or motte. The argumentative pattern is a form of strategic ambiguity rather than a standard formal fallacy.","obj":[["People are entitled to qualify overbroad claims when challenged.","Absolutely. Revision is healthy if the stronger claim is withdrawn. The problem is reoccupying the stronger claim later while citing the defense of the weaker one as though it covered both."],["The distinction between strong and weak versions can itself be subjective.","Then write both propositions explicitly and ask which one supports the disputed conclusion. If the policy follows only from the strong version, defending the weak version does not settle the issue."]],"confuse":[["Motte-and-bailey vs. equivocation","Equivocation shifts the meaning of a term; motte-and-bailey shifts between propositions of different strength. They often co-occur but are structurally distinct."],["Motte-and-bailey vs. legitimate narrowing","Legitimate narrowing concedes the original claim was too strong. Motte-and-bailey preserves the benefits of the strong claim after retreating from it."]],"mistakes":["Letting agreement with the modest claim be recorded as agreement with the expansive one.","Debating labels instead of writing the two versions side by side and testing which one entails the conclusion."],"check":{"q":"A speaker says “the model is useless,” retreats under challenge to “the model has important limitations,” then later cites the exchange as proof it should be discarded. What is the move?","a":"Motte-and-bailey. “Has important limitations” is the defensible motte; “is useless” is the stronger bailey doing the decision work."}},"fa":{"line":"موت‌و‌بِیلی میانِ ادعایی جسور و اثرگذار و ادعایی ضعیف اما قابل‌دفاع رفت‌وآمد می‌کند و امنیتِ دومی را برای قدرتِ اولی قرض می‌گیرد.","why":"<p>بعضی مواضع نه به‌خاطر دفاعِ خوب از یک ادعا، بلکه به‌خاطر جابه‌جایی میانِ دو ادعا از نقد جان به در می‌برند. «بیلی» گسترده کارِ بلاغی یا سیاستی را انجام می‌دهد؛ زیرِ فشار گوینده به «موت» محدود عقب می‌نشیند، توافق می‌گیرد و بعد طوری رفتار می‌کند که انگار ادعای قوی هم دفاع شده است.</p>","origin":"نیکلاس شاکل این الگو را از استحکاماتِ قرون وسطایی نام‌گذاری کرد: فضای باز و مطلوبِ بیلی در کنارِ تپهٔ دفاعیِ موت. این بیشتر شکلی از ابهامِ راهبردی است تا مغالطه‌ای صوری.","obj":[["آدم‌ها حق دارند وقتی به ادعای بیش‌ازحد قوی اعتراض می‌شود آن را محدود کنند.","کاملاً. اصلاح سالم است اگر ادعای قوی پس گرفته شود. مشکل وقتی است که بعداً دوباره به آن برگردند و دفاع از نسخهٔ ضعیف را دفاع از هر دو جلوه دهند."],["فرقِ نسخهٔ قوی و ضعیف گاهی ذهنی است.","پس هر دو گزاره را دقیق بنویسید و بپرسید کدام‌یک نتیجهٔ محلِ نزاع را پشتیبانی می‌کند. اگر سیاست فقط از نسخهٔ قوی نتیجه می‌شود، دفاع از نسخهٔ ضعیف مسئله را حل نکرده است."]],"confuse":[["موت‌و‌بِیلی و اشتراک لفظی","اشتراک لفظی معنای یک واژه را عوض می‌کند؛ موت‌و‌بِیلی میانِ گزاره‌هایی با قدرتِ متفاوت جابه‌جا می‌شود. ممکن است هم‌زمان رخ دهند اما یکی نیستند."],["موت‌و‌بِیلی و محدودسازیِ مشروع","محدودسازیِ مشروع می‌پذیرد ادعای نخست زیادی قوی بود. موت‌و‌بِیلی همچنان مزایای ادعای قوی را پس از عقب‌نشینی حفظ می‌کند."]],"mistakes":["ثبتِ توافق با ادعای محدود به‌عنوان توافق با ادعای گسترده.","بحث بر سرِ برچسب به‌جای نوشتنِ دو نسخه کنار هم و آزمونِ اینکه کدام نتیجه را واقعاً نتیجه می‌دهد."],"check":{"q":"کسی می‌گوید «مدل بی‌فایده است»، زیرِ نقد عقب می‌نشیند به «مدل محدودیت‌های مهمی دارد» و بعداً همان گفت‌وگو را دلیلِ کنارگذاشتنِ مدل می‌خواند. حرکت چیست؟","a":"موت‌و‌بِیلی. «محدودیت‌های مهم دارد» موتِ قابل‌دفاع است؛ «بی‌فایده است» بیلیِ قوی‌تری است که کارِ تصمیم‌گیری را انجام می‌دهد."}}},"authority":{"en":{"line":"Appeal to authority is rational testimony when expertise is relevant and well-grounded; it becomes fallacious when status substitutes for reasons outside those conditions.","why":"<p>No individual can independently verify more than a tiny fraction of what they know, so deference is unavoidable. The useful question is not “did someone cite an authority?” but whether this source is epistemically entitled to deference on this proposition. Domain fit, expert consensus, incentives, track record, and independent indicators of competence do the real work.</p>","origin":"Traditional fallacy lists treated <i>argumentum ad verecundiam</i> as an appeal to inappropriate authority. Contemporary social epistemology is more nuanced because expert testimony is an indispensable knowledge source; Alvin Goldman’s work on novices judging experts gives a systematic framework.","obj":[["Non-experts cannot evaluate expert arguments without already having the expertise they lack.","They often cannot evaluate the technical core directly, but they can compare meta-evidence: peer agreement, credentials tied to actual competence, conflicts of interest, predictive record, and whether the expert engages serious objections."],["Consensus can be wrong, so expert agreement is weak evidence.","Fallibility does not make evidence worthless. The relevant comparison is whether consensus among informed, partially independent specialists outperforms an uninformed individual. Usually it does, while still leaving room for calibrated doubt."]],"confuse":[["Appeal to authority vs. testimony","Testimony is the broad epistemic source. An appeal to authority is one argumentative use of testimony; it is fallacious only when the authority relation is defective."],["Expertise vs. prestige","Prestige, institutional rank, or media visibility can correlate with expertise but are not the same thing. Domain-specific track record matters more."]],"mistakes":["Rejecting a claim merely because it is supported by authority—an inverse authority fallacy.","Treating expertise in one field as portable to another without checking the domain boundary."],"check":{"q":"A Nobel-winning physicist gives a confident view on monetary transmission. What should their Nobel change in your evidential weighting?","a":"Very little by itself. It is strong evidence of expertise in physics, not monetary economics. Look for domain-relevant competence, arguments, track record, and agreement among appropriate experts."}},"fa":{"line":"استناد به مرجع وقتی تخصصِ مرتبط و خوب‌پشتیبانی‌شده در کار است می‌تواند گواهیِ عقلانی باشد؛ وقتی مقام جایِ دلیل را بیرون از آن شرایط بگیرد به مغالطه بدل می‌شود.","why":"<p>هیچ فردی نمی‌تواند بیش از بخشِ کوچکی از دانسته‌هایش را مستقلاً راستی‌آزمایی کند، پس اتکا به دیگران اجتناب‌ناپذیر است. پرسشِ درست این نیست که «آیا به مرجع استناد شد؟» بلکه این است که آیا این منبع دربارهٔ این گزاره حقِ معرفتیِ مطالبهٔ اتکا دارد یا نه. تناسبِ حوزه، اجماعِ متخصصان، انگیزه‌ها، کارنامه و نشانه‌های مستقلِ صلاحیت تعیین‌کننده‌اند.</p>","origin":"فهرست‌های سنتیِ مغالطه <i>argumentum ad verecundiam</i> را استناد به مرجعِ نامناسب می‌دانستند. معرفت‌شناسیِ اجتماعیِ معاصر ظریف‌تر است چون گواهیِ متخصص منبعی اجتناب‌ناپذیر است؛ کارِ آلوین گلدمن دربارهٔ داوریِ غیرمتخصصان میانِ متخصصان چارچوبی نظام‌مند می‌دهد.","obj":[["غیرمتخصص بدون همان تخصصی که ندارد نمی‌تواند استدلالِ متخصص را ارزیابی کند.","اغلب هستهٔ فنی را مستقیم نمی‌تواند بسنجد، اما می‌تواند فرادادهٔ معرفتی را مقایسه کند: توافقِ همتایان، مدارکِ مرتبط با صلاحیت، تعارضِ منافع، کارنامهٔ پیش‌بینی و نحوهٔ پاسخ به اعتراض‌های جدی."],["اجماع می‌تواند خطا کند، پس توافقِ متخصصان شاهدِ ضعیفی است.","خطاپذیری شاهد را بی‌ارزش نمی‌کند. مقایسهٔ درست این است که اجماعِ متخصصانِ آگاه و تاحدی مستقل معمولاً از قضاوتِ فردِ ناآگاه بهتر عمل می‌کند، هرچند باید درجهٔ تردید حفظ شود."]],"confuse":[["استناد به مرجع و گواهی","گواهی منبعِ گستردهٔ معرفت است. استناد به مرجع یکی از کاربردهای استدلالیِ آن است و فقط وقتی رابطهٔ تخصص معیوب باشد مغالطه است."],["تخصص و اعتبارِ اجتماعی","شهرت، مقامِ سازمانی یا دیده‌شدن در رسانه ممکن است با تخصص همبسته باشند اما همان چیز نیستند. کارنامهٔ حوزه‌خاص مهم‌تر است."]],"mistakes":["ردِ یک ادعا صرفاً چون مرجع از آن حمایت کرده—نسخهٔ وارونهٔ همان خطا.","قابل‌انتقال‌دانستنِ تخصص از یک حوزه به حوزهٔ دیگر بدون بررسیِ مرزِ تخصص."],"check":{"q":"فیزیک‌دانی برندهٔ نوبل دربارهٔ انتقالِ سیاست پولی با اطمینان نظر می‌دهد. جایزهٔ نوبل چقدر باید وزنِ شاهدیِ او را تغییر دهد؟","a":"به‌خودیِ خود بسیار کم. نوبل شاهدِ قویِ تخصص در فیزیک است، نه اقتصادِ پولی. صلاحیتِ حوزه‌مرتبط، استدلال، کارنامه و توافقِ متخصصانِ مناسب را بررسی کنید."}}},"ansyn":{"en":{"line":"Analytic claims are true by virtue of meanings or conceptual relations; synthetic claims depend on how the world is—and Quine challenged whether that boundary can be made principled.","why":"<p>The distinction matters because it separates what a framework builds in by definition from what experience teaches us. Without it, deductions from chosen definitions can be mistaken for discoveries. Quine’s attack matters equally: if meaning itself is embedded in a revisable web, the neat division between “definition” and “fact” may be less absolute than classical empiricism assumed.</p>","origin":"Kant made analytic/synthetic central while also arguing for synthetic a priori knowledge. Logical positivists later tied analyticity to meaning and conventional truth. W.V.O. Quine’s “Two Dogmas of Empiricism” (1951) attacked the distinction as circular and replaced it with a holistic picture of revision.","obj":[["Obvious examples like ‘all bachelors are unmarried’ show the distinction is real.","They show a useful contrast at the center, not necessarily a sharp boundary everywhere. Quine’s challenge is about explaining analyticity without presupposing synonymy, necessity, or definition in equally unexplained terms."],["If Quine is right, definitions become empirical claims, which seems absurd.","Holism does not say every sentence is equally revisable. It says revision is in principle system-wide and governed by costs. Definitions can be extremely central and stable without possessing an absolute epistemic category."]],"confuse":[["Analytic/synthetic vs. a priori/a posteriori","The first concerns what makes a proposition true; the second concerns how it can be known. Kant’s synthetic a priori is important precisely because the axes are not identical."],["Analytic truth vs. tautology","Tautologies are a narrow formal class. Analyticity, if legitimate, includes broader truths grounded in meaning."]],"mistakes":["Reporting a result forced by definitions or accounting identities as empirical support for the model.","Assuming “conceptual” means arbitrary or unimportant; conceptual choices can determine what data count as evidence."],"check":{"q":"Your index rises because its definition mechanically gives larger weight to a component that rose. Is the increase an empirical discovery about the system or partly analytic?","a":"Partly analytic: some of the result follows from how the index was defined. The empirical content lies in the component movements and in whether the chosen definition validly represents the target concept."}},"fa":{"line":"گزارهٔ تحلیلی به‌سببِ معنا یا روابطِ مفهومی صادق است؛ گزارهٔ ترکیبی به وضعیتِ جهان وابسته است—و کواین پرسید آیا می‌توان مرزی اصولی و غیرمدور میانِ آن‌ها کشید.","why":"<p>این تمایز برای جداکردنِ آنچه چارچوب با تعریف وارد می‌کند از آنچه تجربه به ما می‌آموزد لازم است. بدون آن، نتیجه‌ای که فقط از تعریف‌های انتخابی بیرون آمده می‌تواند «کشف» گزارش شود. حملهٔ کواین نیز مهم است: اگر خودِ معنا در شبکه‌ای بازنگری‌پذیر قرار دارد، مرزِ تعریف و واقعیت شاید به تمیزیِ تصویرِ کلاسیک نباشد.</p>","origin":"کانت تمایزِ تحلیلی/ترکیبی را مرکزی کرد و هم‌زمان از معرفتِ ترکیبیِ پیشین دفاع کرد. پوزیتیویست‌های منطقی بعدها تحلیلی‌بودن را با معنا و قرارداد پیوند دادند. مقالهٔ «دو حکمِ جزمیِ تجربه‌گرایی» کواین (۱۹۵۱) مرز را مدور دانست و تصویرِ کل‌گرایانهٔ بازنگری را پیشنهاد کرد.","obj":[["مثال‌های روشنی مثل «همهٔ مجردها ازدواج‌نکرده‌اند» نشان می‌دهد تمایز واقعی است.","آن‌ها تفاوتِ مفیدی در مرکزِ طیف نشان می‌دهند، نه الزاماً مرزی تیز در همه‌جا. چالشِ کواین این است که تحلیلی‌بودن را بدون توسلِ مدور به هم‌معنایی، ضرورت یا تعریف توضیح دهید."],["اگر کواین درست باشد، تعریف‌ها هم تجربی می‌شوند و این پوچ است.","کل‌گرایی نمی‌گوید همهٔ جملات به یک اندازه بازنگری‌پذیرند. می‌گوید بازنگری اصولاً در سطحِ نظام ممکن است و هزینه دارد. تعریف‌ها می‌توانند بسیار مرکزی و پایدار باشند بی‌آنکه طبقه‌ای مطلق بسازند."]],"confuse":[["تحلیلی/ترکیبی و پیشین/پسین","اولی دربارهٔ چیزی است که گزاره را صادق می‌کند؛ دومی دربارهٔ راهِ دانستن است. «ترکیبیِ پیشین» کانت مهم است دقیقاً چون این دو محور یکی نیستند."],["صدقِ تحلیلی و همان‌گویی","همان‌گویی‌ها یک طبقهٔ صوریِ محدودند؛ تحلیلی‌بودن، اگر پذیرفته شود، حقایقِ گسترده‌تری را که بر معنا استوارند دربر می‌گیرد."]],"mistakes":["گزارشِ نتیجه‌ای که از تعریف یا هویتِ حسابداری اجباراً بیرون می‌آید به‌عنوان تأییدِ تجربیِ مدل.","فرضِ اینکه «مفهومی» یعنی دلبخواهی یا بی‌اهمیت؛ انتخابِ مفهومی تعیین می‌کند چه داده‌ای اصلاً شاهد شمرده شود."],"check":{"q":"شاخصی بالا می‌رود چون تعریفِ آن به مؤلفه‌ای که افزایش یافته وزنِ بیشتری می‌دهد. این افزایش کشفِ تجربی است یا بخشی از آن تحلیلی است؟","a":"بخشی تحلیلی است: قسمتی از نتیجه از تعریفِ شاخص می‌آید. محتوای تجربی در حرکتِ مؤلفه‌ها و در اعتبارِ خودِ تعریف برای نمایندگیِ مفهومِ هدف قرار دارد."}}},"basicality":{"en":{"line":"A belief can be basic merely because you did not infer it from another belief, or basic in the stronger sense that its justification itself depends on no further justified proposition.","why":"<p>Foundationalism often wins too easily if “basic” is left ambiguous. Doxastic basicality describes the belief’s psychological ancestry; epistemic basicality describes the structure of its justification. A perceptual belief may arise non-inferentially yet still be justified only if background conditions about perception, lighting, competence, or normality obtain.</p>","origin":"The distinction is prominent in contemporary discussions of foundationalism, including Matthias Steup’s formulations. It sharpens an older dispute over whether non-inferential belief automatically carries non-inferential justification.","obj":[["If a person did not infer the belief, demanding further justificatory propositions turns every basic belief into an inference after all.","Not necessarily. Externalists can say the justification depends on non-doxastic facts such as reliable functioning rather than on another belief the subject possesses. The distinction separates dependence from conscious inference."],["The stronger epistemic notion makes basicality almost impossible to establish.","That is a pressure on ambitious foundationalism, not a reason to collapse the senses. The point is diagnostic: many alleged foundations are psychologically immediate but epistemically dependent."]],"confuse":[["Doxastic basicality vs. certainty","A non-inferred belief can be highly fallible. Basic means struct
