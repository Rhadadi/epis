urally non-inferential, not indubitable."],["Epistemic basicality vs. properly basic belief","Proper basicality is a normative claim that the basic status is legitimate; epistemic basicality describes a particular independence relation in justification."]],"mistakes":["Assuming “I just see it” settles the justificatory question.","Using basic, foundational, self-evident, incorrigible, and certain as interchangeable labels."],"check":{"q":"You immediately believe the gauge reads 40, but your justification depends on the gauge being calibrated. Doxastically basic? Epistemically basic?","a":"Doxastically basic, because you did not infer the reading from another belief. Not obviously epistemically basic, because its justification depends on the calibration/reliability condition."}},"fa":{"line":"یک باور ممکن است فقط به این معنا پایه باشد که از باورِ دیگری استنتاج نشده، یا به معنای قوی‌تر که خودِ توجیهِ آن به هیچ گزارهٔ موجهِ دیگری وابسته نیست.","why":"<p>اگر واژهٔ «پایه» مبهم بماند، مبناگرایی خیلی آسان پیروز می‌شود. پایه‌بودنِ باوری دربارهٔ منشأ روان‌شناختیِ باور است؛ پایه‌بودنِ معرفتی دربارهٔ ساختارِ توجیه. باورِ ادراکی می‌تواند بی‌استنتاج پدید آید اما موجه‌بودنش همچنان به شرایطِ پس‌زمینه مثل سلامتِ ادراک، نور، مهارت یا کالیبراسیون وابسته باشد.</p>","origin":"این تمایز در بحث‌های معاصرِ مبناگرایی، از جمله صورت‌بندی‌های ماتیاس استیوپ، برجسته است. نزاعِ قدیمی‌تر را دقیق می‌کند: آیا باورِ غیراستنتاجی خودبه‌خود توجیهِ غیراستنتاجی هم دارد؟","obj":[["اگر فرد باور را استنتاج نکرده، مطالبهٔ شرطِ توجیهیِ بیشتر دوباره هر باورِ پایه را استنتاجی می‌کند.","نه الزاماً. برون‌گرا می‌تواند بگوید توجیه به واقعیت‌های غیرباوری مثل کارکردِ قابل‌اعتماد وابسته است، نه به باوری دیگر که شخص باید در ذهن داشته باشد. وابستگی با استنتاج یکی نیست."],["معنای قویِ معرفتی پایه‌بودن را تقریباً ناممکن می‌کند.","این فشار بر مبناگراییِ بلندپروازانه است، نه دلیل برای خلطِ دو معنا. نکته تشخیصی است: بسیاری از «بنیادها» از نظر روان‌شناختی فوری اما از نظر معرفتی وابسته‌اند."]],"confuse":[["پایه‌بودنِ باوری و یقین","باورِ غیرمستنتج می‌تواند بسیار خطاپذیر باشد. پایه یعنی ساختاراً غیراستنتاجی، نه تردیدناپذیر."],["پایه‌بودنِ معرفتی و «به‌درستی پایه»","«به‌درستی پایه» ادعایی هنجاری دربارهٔ مشروعیتِ پایه‌بودن است؛ پایه‌بودنِ معرفتی یک رابطهٔ استقلال در توجیه را توصیف می‌کند."]],"mistakes":["تصورِ اینکه «همین را می‌بینم» پرسشِ توجیه را حل می‌کند.","به‌کاربردنِ «پایه»، «بنیادی»، «بدیهی»، «اصلاح‌ناپذیر» و «یقینی» به‌جای هم."],"check":{"q":"بی‌درنگ باور می‌کنید گیج عدد ۴۰ را نشان می‌دهد، اما توجیه به کالیبره‌بودنِ گیج وابسته است. از نظر باوری پایه است؟ از نظر معرفتی چطور؟","a":"از نظر باوری بله، چون از باوری دیگر استنتاج نکردید. از نظر معرفتی لزوماً نه، چون توجیه به شرطِ کالیبراسیون/وثاقت وابسته است."}}},"criterion":{"en":{"line":"To know which beliefs are good you need a criterion; to know the criterion is good you need trusted cases—so each seems to require the other first.","why":"<p>Validation procedures often hide a prior decision about what counts as a successful case. The problem of the criterion exposes that circularity. Particularism begins with cases treated as known and infers standards from them; methodism begins with a standard and lets it classify cases. Neither starting point can be certified without borrowing from the other side.</p>","origin":"Roderick Chisholm gave the modern formulation, drawing on an ancient skeptical structure already visible in Sextus Empiricus. It is a sibling of the regress problem but targets the relation between <i>instances</i> of knowledge and <i>criteria</i> for knowledge rather than the chain of reasons itself.","obj":[["Real calibration uses independent gold standards, so the circle can be broken.","Only if the gold standard is genuinely independent and already warranted. The philosophical question simply moves to how that standard earned its status. In practice, external redundancy can reduce circularity without eliminating the logical structure."],["The problem is too abstract; ordinary inquiry works without solving it.","Correct—and that is informative. Inquiry proceeds by provisional fixed points. The practical lesson is to identify which cases or methods are being held fixed rather than pretending the system validates itself from nowhere."]],"confuse":[["Problem of the criterion vs. Münchhausen trilemma","The trilemma concerns how reasons terminate. The criterion problem concerns mutual dependence between standards and the cases used to validate those standards."],["Particularism vs. philosophical particularism in ethics","Here particularism means starting epistemology from trusted cases, not the separate moral-theory view that principles are unnecessary."]],"mistakes":["Calling a validation “independent” when the benchmark was built from the same model or data.","Hiding the initial fixed points rather than stating which observations, instruments, or cases are taken as provisionally trustworthy."],"check":{"q":"You validate a risk score against labels produced by the same expert process the score was trained to imitate. What problem should immediately occur to you?","a":"The problem of the criterion: the benchmark and the method may be validating one another. You need an independently warranted anchor or an explicit admission that one side is being treated as the fixed point."}},"fa":{"line":"برای اینکه بدانید کدام باورها خوب‌اند به معیار نیاز دارید؛ برای اینکه بدانید معیار خوب است به مواردِ قابل‌اعتماد نیاز دارید—پس هر طرف ظاهراً دیگری را از قبل می‌خواهد.","why":"<p>رویه‌های اعتبارسنجی اغلب تصمیمی قبلی را پنهان می‌کنند دربارهٔ اینکه «موردِ موفق» چیست. مسئلهٔ معیار این دور را آشکار می‌کند. جزئی‌گرایی از مواردی که معرفت فرض می‌شوند آغاز می‌کند و معیار را از آن‌ها می‌سازد؛ روش‌گرایی از معیار شروع می‌کند و موارد را طبقه‌بندی می‌کند. هیچ نقطهٔ آغاز بدون قرض‌گرفتن از طرفِ دیگر کاملاً گواهی نمی‌شود.</p>","origin":"رودریک چیزم صورت‌بندیِ مدرن را ارائه کرد، با ساختاری که پیش‌تر در شکاکیتِ سکستوس امپیریکوس دیده می‌شود. این مسئله خویشاوندِ سه‌راهی است اما به رابطهٔ میانِ <i>مواردِ معرفت</i> و <i>معیارِ معرفت</i> می‌پردازد، نه صرفاً زنجیرهٔ دلایل.","obj":[["در کالیبراسیونِ واقعی استانداردِ طلاییِ مستقل داریم و دور شکسته می‌شود.","فقط اگر استاندارد واقعاً مستقل و از پیش موجه باشد. پرسشِ فلسفی به این منتقل می‌شود که آن استاندارد چگونه اعتبار گرفت. در عمل افزونگیِ مستقل دور را کم می‌کند، نه اینکه ساختارِ منطقی را کاملاً حذف کند."],["مسئله بیش از حد انتزاعی است؛ پژوهشِ عادی بدون حلِ آن پیش می‌رود.","درست—و همین آموزنده است. پژوهش با نقاطِ ثابتِ موقت پیش می‌رود. درسِ عملی این است که مشخص کنید چه مورد یا روشی را ثابت گرفته‌اید، نه اینکه وانمود کنید نظام از هیچ خودش را اعتبارسنجی می‌کند."]],"confuse":[["مسئلهٔ معیار و سه‌راهی مونش‌هاوزن","سه‌راهی دربارهٔ پایانِ زنجیرهٔ دلیل است. مسئلهٔ معیار دربارهٔ وابستگیِ متقابلِ استانداردها و مواردی است که برای اعتبارسنجیِ استاندارد به کار می‌روند."],["جزئی‌گراییِ این بحث و جزئی‌گرایی در اخلاق","اینجا جزئی‌گرایی یعنی آغازِ معرفت‌شناسی از مواردِ مورداعتماد، نه نظریهٔ جداگانه‌ای در اخلاق که اصول را غیرضروری می‌داند."]],"mistakes":["«مستقل» خواندنِ اعتبارسنجی وقتی معیار از همان مدل یا داده ساخته شده است.","پنهان‌کردنِ نقاطِ ثابتِ آغازین به‌جای بیانِ اینکه کدام مشاهده، ابزار یا مورد فعلاً قابل‌اعتماد فرض شده است."],"check":{"q":"امتیازِ ریسک را با برچسب‌هایی اعتبارسنجی می‌کنید که همان فرایندِ کارشناسیِ مورد تقلیدِ مدل تولید کرده است. چه مسئله‌ای باید فوراً به ذهن برسد؟","a":"مسئلهٔ معیار: روش و معیار ممکن است یکدیگر را تأیید کنند. به لنگری با توجیهِ مستقل نیاز دارید، یا باید آشکارا بگویید یکی از دو طرف را نقطهٔ ثابت فرض کرده‌اید."}}},"deont":{"en":{"line":"Deontological justification treats epistemic justification as responsible belief-management: a belief is justified when holding it violates no epistemic duty.","why":"<p>This conception connects epistemology to blame, permission, and intellectual responsibility. Its central difficulty is control: duties normally govern actions we can choose, while belief often arrives involuntarily. The view therefore forces a distinction between direct control over belief and indirect control over inquiry, attention, evidence-seeking, and habits.</p>","origin":"Duty-based pictures appear in Descartes and Locke and were influential in twentieth-century internalist epistemology, including Chisholm. They are now less dominant partly because reliabilist and externalist theories can explain justification without assuming doxastic voluntarism.","obj":[["We cannot choose beliefs at will, so belief cannot be governed by duties.","Defenders shift the duty upstream. You may not choose the belief directly, but you can often choose whether to check, expose yourself to counterevidence, correct known biases, or maintain reliable inquiry practices."],["A person could fulfill every duty and still form beliefs through an unreliable process.","That is the externalist objection. Deontological justification captures blamelessness better than truth-conduciveness, so some theorists distinguish being epistemically responsible from having objectively good justification."]],"confuse":[["Justified belief vs. morally permissible belief","Epistemic duties concern responsible truth-seeking; moral duties concern broader harms and rights. They can conflict."],["Doxastic voluntarism vs. indirect epistemic control","The first says we can choose beliefs directly; the second only says we can influence the processes that produce beliefs."]],"mistakes":["Blaming someone merely for holding a false belief without asking what inquiry choices were under their control.","Equating blamelessness with reliability: a conscientious method can still be systematically wrong."],"check":{"q":"Someone reaches a false conclusion after checking all available evidence carefully and following a reasonable method. What does a deontological view tend to say?","a":"They may still be epistemically justified or blameless because they fulfilled their epistemic duties, even though the belief is false and the process may later turn out to need improvement."}},"fa":{"line":"توجیهِ تکلیف‌محور، توجیهِ معرفتی را مدیریتِ مسئولانهٔ باور می‌داند: باور وقتی موجه است که نگه‌داشتنِ آن تکلیفِ معرفتی‌ای را نقض نکند.","why":"<p>این برداشت معرفت‌شناسی را به تقصیر، اجازه و مسئولیتِ فکری پیوند می‌دهد. مشکلِ مرکزی کنترل است: تکلیف معمولاً ناظر به کاری است که می‌توانیم انتخاب کنیم، در حالی که باور اغلب ناخواسته پدید می‌آید. پس باید کنترلِ مستقیمِ باور را از کنترلِ غیرمستقیمِ پژوهش، توجه، جست‌وجوی شاهد و عادت‌ها جدا کرد.</p>","origin":"تصویرهای تکلیف‌محور در دکارت و لاک دیده می‌شوند و در درون‌گراییِ قرن بیستم، از جمله نزد چیزم، اثرگذار بودند. با رشدِ وثاقت‌گرایی و برون‌گرایی اهمیتشان کمتر شد، چون آن نظریه‌ها می‌توانند توجیه را بدون فرضِ اراده‌گراییِ باوری توضیح دهند.","obj":[["ما نمی‌توانیم به اراده باورمان را عوض کنیم؛ پس باور موضوعِ تکلیف نیست.","مدافعان تکلیف را یک مرحله عقب می‌برند. شاید باور را مستقیم انتخاب نکنید، اما اغلب می‌توانید تصمیم بگیرید بررسی کنید، خود را در معرضِ شاهدِ مخالف بگذارید، سوگیریِ شناخته‌شده را اصلاح کنید و عادتِ پژوهشِ قابل‌اعتماد بسازید."],["ممکن است کسی همهٔ تکالیف را انجام دهد و باز با فرایندی ناموثق به باور برسد.","این اعتراضِ برون‌گرایانه است. توجیهِ تکلیف‌محور بی‌تقصیری را بهتر از حقیقت‌رسانی می‌گیرد؛ از این رو برخی مسئولیتِ معرفتی را از توجیهِ عینیِ خوب جدا می‌کنند."]],"confuse":[["باورِ موجه و باورِ اخلاقاً مجاز","تکالیفِ معرفتی دربارهٔ حقیقت‌جوییِ مسئولانه‌اند؛ تکالیفِ اخلاقی دربارهٔ آسیب و حق‌های گسترده‌تر. ممکن است تعارض کنند."],["اراده‌گراییِ باوری و کنترلِ غیرمستقیم","اولی می‌گوید باور را مستقیم انتخاب می‌کنیم؛ دومی فقط می‌گوید می‌توانیم فرایندهای سازندهٔ باور را تحتِ تأثیر بگذاریم."]],"mistakes":["سرزنشِ فرد صرفاً به‌خاطر باورِ کاذب بدون پرسیدنِ اینکه کدام انتخابِ پژوهشی در کنترلش بوده است.","یکی‌دانستنِ بی‌تقصیری و وثاقت؛ روشِ باوجدان هم می‌تواند نظام‌مند خطا کند."],"check":{"q":"فردی پس از بررسیِ دقیقِ همهٔ شواهدِ در دسترس و پیروی از روشی معقول به نتیجه‌ای کاذب می‌رسد. دیدگاهِ تکلیف‌محور چه می‌گوید؟","a":"ممکن است همچنان از نظر معرفتی موجه یا بی‌تقصیر باشد، چون تکالیفِ معرفتی را انجام داده، هرچند باور کاذب است و بعداً معلوم شود فرایند نیاز به اصلاح دارد."}}},"intext":{"en":{"line":"Internalism says justification must be accessible from the subject’s perspective; externalism allows justification to depend on facts—such as reliability—that the subject need not know.","why":"<p>The dispute separates two intuitions that often travel together: a person should be able to give reasons for a belief, and a belief-forming method should actually connect them to truth. Internalism prioritizes the first-person perspective; externalism prioritizes the objective quality of the process. Gettier cases, clairvoyance cases, and ordinary reliance on perception make the tension unavoidable.</p>","origin":"The contemporary divide crystallized in twentieth-century epistemology. Laurence BonJour defended influential internalist arguments; Alvin Goldman’s reliabilism is a leading externalist model. The dispute cuts across foundationalism, evidentialism, virtue epistemology, and theories of knowledge.","obj":[["Externalism can call someone justified for reasons they could never recognize, which seems epistemically irresponsible.","Externalists distinguish justification from the ability to defend it. A reliable child or animal can know without possessing a theory of its own reliability; requiring reflective access risks over-intellectualizing knowledge."],["Internalism rewards internally coherent agents in deceptive environments, even when their methods are unreliable.","Internalists accept that justification tracks what is reasonable from the subject’s evidence, not guaranteed truth. Some hybrid views add an external anti-luck or reliability condition to knowledge while retaining internal justification."]],"confuse":[["Internalism/externalism vs. mental/internal causes","The debate is not simply whether the cause is inside the head. It concerns whether justificatory factors must be reflectively accessible to the subject."],["Externalism vs. consequentialism","Externalism is an epistemic thesis about dependence on world-involving facts, not a moral theory about outcomes."]],"mistakes":["Treating “can explain the method” as equivalent to “the method is reliable.”","Assuming externalism means reasons and evidence are irrelevant; many externalist theories still value them as reliable processes or indicators."],"check":{"q":"An analyst uses a procedure that is in fact highly reliable but cannot explain why it works. What different questions do internalism and externalism ask?","a":"Internalism asks whether the analyst has accessible grounds that make the belief reasonable from the inside. Externalism asks whether the procedure actually has the right truth-conducive relation to the world."}},"fa":{"line":"درون‌گرایی می‌گوید عواملِ توجیه باید از دیدِ خودِ فاعل قابل‌دسترسی باشند؛ برون‌گرایی اجازه می‌دهد توجیه به واقعیت‌هایی مثل وثاقت وابسته باشد که فاعل از آن‌ها آگاه نیست.","why":"<p>نزاع دو شهود را جدا می‌کند که اغلب با هم مخلوط می‌شوند: فرد باید بتواند برای باورش دلیل بدهد، و روشِ تولیدِ باور باید واقعاً او را به حقیقت وصل کند. درون‌گرایی دیدگاهِ اول‌شخص را مقدم می‌کند؛ برون‌گرایی کیفیتِ عینیِ فرایند را. مواردِ گتیه، غیب‌بینی و اتکای روزمره به ادراک این تنش را آشکار می‌کنند.</p>","origin":"تقابلِ معاصر در معرفت‌شناسیِ قرن بیستم شکلِ روشن گرفت. لارنس بونژور مدافعِ مهمِ درون‌گرایی بود و وثاقت‌گراییِ آلوین گلدمن نمونهٔ برجستهٔ برون‌گرایی است. این نزاع از مبناگرایی، شاهدگرایی و فضیلت‌گرایی عبور می‌کند.","obj":[["برون‌گرایی ممکن است کسی را به‌سببِ عاملی که هرگز نمی‌تواند بشناسد موجه بداند؛ این غیرمسئولانه است.","برون‌گرا توجیه را از تواناییِ دفاع جدا می‌کند. کودک یا حیوان می‌تواند از فرایندی قابل‌اعتماد معرفت کسب کند بی‌آنکه نظریه‌ای دربارهٔ وثاقتِ خود داشته باشد؛ شرطِ بازتابیِ سخت ممکن است معرفت را بیش‌ازحد عقلانی‌سازی کند."],["درون‌گرایی در محیطِ فریبنده هم به عاملِ منسجم توجیه می‌دهد، حتی اگر روشش ناموثق باشد.","درون‌گرا می‌پذیرد توجیه آن چیزی را می‌سنجد که از منظرِ شواهدِ فاعل معقول است، نه تضمینِ حقیقت. دیدگاه‌های ترکیبی شرطِ بیرونیِ ضداقبال یا وثاقت را به معرفت می‌افزایند."]],"confuse":[["درون‌گرایی/برون‌گرایی و علتِ درونِ ذهن","بحث صرفاً دربارهٔ مکانِ علت نیست؛ دربارهٔ این است که عواملِ توجیه باید برای فاعل از راهِ تأمل قابل‌دسترسی باشند یا نه."],["برون‌گرایی و پیامدگرایی","برون‌گرایی تزِ معرفتی دربارهٔ وابستگی به واقعیتِ بیرونی است، نه نظریهٔ اخلاقی دربارهٔ پیامدها."]],"mistakes":["یکی‌دانستنِ «می‌تواند روش را توضیح دهد» با «روش واقعاً قابل‌اعتماد است».","فرضِ اینکه برون‌گرایی شواهد و دلایل را بی‌اهمیت می‌کند؛ بسیاری از نظریه‌های برون‌گرا آن‌ها را فرایند یا نشانهٔ قابل‌اعتماد می‌دانند."],"check":{"q":"تحلیلگری از روشی استفاده می‌کند که در واقع بسیار وثیق است اما نمی‌تواند توضیح دهد چرا کار می‌کند. درون‌گرایی و برون‌گرایی چه پرسش‌های متفاوتی می‌پرسند؟","a":"درون‌گرایی می‌پرسد آیا تحلیلگر از درون دلایلِ قابل‌دسترسی دارد که باور را معقول کند. برون‌گرایی می‌پرسد آیا خودِ فرایند واقعاً رابطهٔ حقیقت‌رسانِ مناسبی با جهان دارد."}}},"just":{"en":{"line":"Justification is the normative status that makes believing something epistemically appropriate on the basis you have—even though philosophers disagree radically about what confers that status.","why":"<p>Truth alone cannot distinguish knowledge from a lucky guess. “Justification” names the missing normative dimension, but it immediately splits into two questions: what is justification supposed to mean, and what properties actually produce it? Evidentialists, reliabilists, virtue theorists, foundationalists, coherentists, internalists, and externalists answer the second question differently because they often emphasize different parts of the first.</p>","origin":"The term became central through the traditional analysis of knowledge as justified true belief, though the underlying problem is ancient. Twentieth-century epistemology turned justification into an independent research programme, especially after Gettier showed that even justified true belief can remain lucky.","obj":[["If Gettier shows justification is not enough for knowledge, perhaps justification is not central after all.","Gettier shows insufficiency, not irrelevance. We still need to distinguish responsible, evidence-sensitive belief from guessing, and every anti-luck theory needs some account of the epistemic quality of the route to truth."],["There may be no single property called justification; different practices use different standards.","Pluralists accept this and distinguish propositional, doxastic, practical, and domain-specific justification. The practical gain is to state which standard a rule or review process is actually imposing."]],"confuse":[["Justification vs. truth","A belief can be justified and false, or true and unjustified. The concepts answer different questions."],["Justification vs. explanation","Explaining why someone believes P is causal or psychological; justifying P is normative and asks whether they are epistemically entitled to believe it."]],"mistakes":["Using “reasonable,” “supported,” “credible,” and “justified” as if they had identical thresholds.","Assuming more evidence always means more justification without checking dependence, relevance, and defeaters."],"check":{"q":"Two analysts make the same correct forecast; one used a validated model and the other guessed. What does “justification” mark?","a":"It marks the epistemic difference in the basis or process of belief. Both are true, but only the first has the sort of support that makes being right non-arbitrary—even though Gettier reminds us that justification alone may still not eliminate all luck."}},"fa":{"line":"توجیه شأنِ هنجاری‌ای است که باورکردنِ یک گزاره را بر پایهٔ مبنایی که دارید از نظر معرفتی مناسب می‌کند—هرچند دربارهٔ منشأ این شأن اختلافِ عمیق وجود دارد.","why":"<p>صدق به‌تنهایی معرفت را از حدسِ خوش‌شانس جدا نمی‌کند. «توجیه» نامِ بعدِ هنجاریِ گمشده است، اما فوراً دو پرسش را جدا می‌کند: توجیه یعنی چه، و چه چیزی آن را می‌سازد؟ شاهدگرایان، وثاقت‌گرایان، فضیلت‌گرایان، مبناگرایان، انسجام‌گرایان، درون‌گرایان و برون‌گرایان پاسخ‌های متفاوتی می‌دهند.</p>","origin":"اصطلاح با تحلیلِ سنتیِ معرفت به‌عنوان باورِ صادقِ موجه مرکزی شد، هرچند مسئله بسیار قدیمی‌تر است. پس از گتیه که نشان داد باورِ صادقِ موجه هم می‌تواند خوش‌اقبال باشد، توجیه خود به برنامه‌ای مستقل در معرفت‌شناسیِ قرن بیستم بدل شد.","obj":[["اگر گتیه نشان داده توجیه برای معرفت کافی نیست، شاید اصلاً مرکزی نباشد.","گتیه ناکافی‌بودن را نشان می‌دهد نه بی‌اهمیتی را. هنوز باید باورِ مسئولانه و حساس به شواهد را از حدس جدا کنیم، و هر نظریهٔ ضداقبال به کیفیتِ معرفتیِ راهِ رسیدن به صدق نیاز دارد."],["شاید یک ویژگیِ واحد به نام توجیه وجود نداشته باشد و هر عمل استانداردِ خودش را داشته باشد.","کثرت‌گرایان همین را می‌پذیرند و توجیهِ گزاره‌ای، باوری، عملی و حوزه‌خاص را جدا می‌کنند. فایدهٔ عملی این است که صریح کنید قاعده یا فرایندِ بازبینی دقیقاً چه استانداردی را مطالبه می‌کند."]],"confuse":[["توجیه و صدق","باور می‌تواند موجه و کاذب باشد یا صادق و ناموجه. این دو به پرسش‌های متفاوت پاسخ می‌دهند."],["توجیه و تبیین","تبیینِ اینکه چرا کسی P را باور دارد علّی یا روان‌شناختی است؛ توجیه می‌پرسد آیا از نظر معرفتی حقِ باورکردن دارد یا نه."]],"mistakes":["یکی‌گرفتنِ «معقول»، «پشتیبانی‌شده»، «معتبر» و «موجه» بدون تعیینِ آستانه.","فرضِ اینکه شاهدِ بیشتر همیشه توجیه را بیشتر می‌کند بدون بررسیِ وابستگی، ربط و ابطال‌کننده‌ها."],"check":{"q":"دو تحلیلگر یک پیش‌بینیِ درست می‌کنند؛ یکی از مدلِ اعتبارسنجی‌شده استفاده کرده و دیگری حدس زده است. «توجیه» چه تفاوتی را نام می‌گذارد؟","a":"تفاوتِ معرفتی در مبنا یا فرایندِ باور را. هر دو درست‌اند، اما فقط اولی نوعی پشتیبانی دارد که درست‌بودن را غیردلبخواهی می‌کند—هرچند گتیه یادآوری می‌کند توجیه به‌تنهایی همهٔ اقبال را حذف نمی‌کند."}}},"kinds":{"en":{"line":"Knowing-that, knowing-how, and knowing-by-acquaintance are different epistemic achievements; a theory built for one should not silently govern the others.","why":"<p>Analytic epistemology concentrates on propositional knowledge—knowing that P—but much real expertise is practical or acquaintance-based. The distinction explains why excellent performers cannot always articulate rules, and why reading every procedure does not produce institutional competence. It also limits how far JTB-style analyses can be generalized.</p>","origin":"Gilbert Ryle famously emphasized the distinction between knowing-how and knowing-that in <i>The Concept of Mind</i> (1949), opposing an overly intellectualist picture of skilled action. Knowledge by acquaintance has a separate history in Russell and earlier philosophy.","obj":[["Knowing-how can often be represented as propositional rules, so the distinction may collapse.","Even complete verbal rules need not confer the embodied ability to execute them under real conditions. Intellectualists try to reduce the difference, but performance, tacit discrimination, and timing remain pressure points."],["Acquaintance is too vague to count as knowledge in the same sense.","That is partly the point: the category marks direct familiarity rather than proposition possession. It warns against forcing every epistemic relation into one grammar."]],"confuse":[["Knowing-how vs. merely being able","Accidental or brute ability need not be knowledgeable skill; knowing-how normally implies some competence that is attributable to the agent."],["Acquaintance vs. testimony about something","You can know many propositions about a city without knowing the city in the acquaintance sense."]],"mistakes":["Assuming a written manual captures all of an expert’s knowledge.","Evaluating a practical skill only by the person’s ability to verbalize reasons."],"check":{"q":"A senior analyst can diagnose a bad specification almost instantly but struggles to state a rule that junior staff can apply. Which kind of knowledge is most salient?","a":"Knowing-how or tacit practical knowledge. The inability to fully propositionalize the skill does not show the expertise is unreal; it shows why institutional knowledge can be hard to transfer."}},"fa":{"line":"دانستنِ اینکه، دانستنِ چگونه، و شناختِ از راهِ آشنایی دستاوردهای معرفتیِ متفاوت‌اند؛ نظریه‌ای که برای یکی ساخته شده نباید بی‌صدا بر بقیه حاکم شود.","why":"<p>معرفت‌شناسیِ تحلیلی بیشتر بر معرفتِ گزاره‌ای—دانستنِ اینکه P—تمرکز دارد، اما بخشِ بزرگی از تخصصِ واقعی عملی یا آشنایی‌محور است. این تمایز توضیح می‌دهد چرا اجراکنندهٔ عالی همیشه نمی‌تواند قاعده را بیان کند و چرا خواندنِ همهٔ رویه‌ها مهارتِ سازمانی تولید نمی‌کند.</p>","origin":"گیلبرت رایل در <i>مفهومِ ذهن</i> (۱۹۴۹) تمایزِ دانستنِ چگونه و دانستنِ اینکه را برجسته کرد و با تصویرِ بیش‌ازحد عقل‌گرایانه از مهارت مخالفت کرد. معرفت از راهِ آشنایی تاریخِ جداگانه‌ای در راسل و پیش از او دارد.","obj":[["دانستنِ چگونه را اغلب می‌توان به مجموعه‌ای از قواعدِ گزاره‌ای تبدیل کرد؛ شاید تفاوت از بین برود.","حتی مجموعهٔ کاملِ قواعدِ زبانی الزاماً توانِ اجرای آن‌ها را در شرایطِ واقعی نمی‌دهد. نظریه‌های عقل‌گرا تقلیل را می‌کوشند، اما اجرا، تشخیصِ ضمنی و زمان‌بندی همچنان مقاومت می‌کنند."],["آشنایی بیش از حد مبهم است که همان نوع معرفت باشد.","بخشی از هدفِ دسته همین است: رابطهٔ آشناییِ مستقیم را از داشتنِ گزاره جدا کند و نشان دهد همهٔ روابطِ معرفتی یک دستور زبان ندارند."]],"confuse":[["دانستنِ چگونه و صرفِ توانستن","تواناییِ تصادفی یا خام لزوماً مهارتِ معرفتی نیست؛ دانستنِ چگونه معمولاً نوعی شایستگیِ قابل‌نسبت به عامل می‌خواهد."],["آشنایی و شنیدنِ اطلاعات دربارهٔ چیزی","می‌توانید صدها گزاره دربارهٔ شهری بدانید بی‌آنکه آن شهر را در معنای آشنایی بشناسید."]],"mistakes":["فرضِ اینکه دستورالعملِ مکتوب تمامِ معرفتِ متخصص را در خود دارد.","سنجشِ مهارتِ عملی فقط با تواناییِ فرد در بیانِ دلایل."],"check":{"q":"تحلیلگرِ ارشد تقریباً فوری مشخصه‌بندیِ بد را تشخیص می‌دهد اما نمی‌تواند قاعده‌ای کامل برای نیروهای تازه بیان کند. کدام نوعِ معرفت برجسته است؟","a":"دانستنِ چگونه یا معرفتِ عملیِ ضمنی. ناتوانی در تبدیلِ کامل به گزاره، غیرواقعی‌بودنِ تخصص را نشان نمی‌دهد؛ دشواریِ انتقالِ معرفتِ سازمانی را نشان می‌دهد."}}},"ratemp":{"en":{"line":"Rationalism gives reason an independent route to substantive knowledge; empiricism insists that substantive knowledge ultimately earns its content from experience.","why":"<p>The dispute asks where intellectual content comes from and therefore what theory can legitimately do before data arrive. It is the background fault line beneath arguments about innate concepts, mathematics, causation, economic models, and whether conceptual necessity can tell us anything about the world.</p>","origin":"The canonical early-modern contrast places Descartes, Leibniz, and Spinoza on the rationalist side and Locke, Berkeley, and Hume on the empiricist side. Kant’s synthetic a priori attempted a transformation rather than a simple victory for either camp.","obj":[["Pure reason cannot guarantee that the world conforms to our concepts.","This is the empiricist pressure: logical necessity can preserve truth but cannot by itself supply empirical premises. Rationalists answer by defending innate structure, necessary truths, or conditions of possible experience."],["Experience alone cannot organize itself; observation is already concept-laden.","This is the rationalist/Kantian counterpressure. Even deciding what counts as an observation requires conceptual structure, so the strongest empiricism still owes an account of that structure."]],"confuse":[["Rationalism vs. being rational","Rationalism is a thesis about sources of knowledge, not simply praise for careful reasoning."],["Empiricism vs. experimentalism","Empiricism is broader: it says experience is the ultimate source of substantive knowledge, even when no controlled experiment is possible."]],"mistakes":["Treating theory-first and data-first workflows as methodologically neutral rather than as carrying different epistemic commitments.","Assuming the modern sciences simply “settled” the historical dispute; they combine both inheritances."],"check":{"q":"An economist says a theorem reveals a substantive feature of any possible market even before observing one. Which side bears the burden, and what must be shown?","a":"That is a rationalist-style claim. The burden is to show that the theorem’s premises are not merely chosen definitions or empirical assumptions in disguise, and that the result legitimately applies to the world."}},"fa":{"line":"عقل‌گرایی برای عقل راهی مستقل به معرفتِ محتوایی قائل است؛ تجربه‌گرایی می‌گوید محتوای معرفتی در نهایت باید از تجربه به دست آید.","why":"<p>نزاع می‌پرسد محتوای فکری از کجا می‌آید و بنابراین نظریه پیش از ورودِ داده چه حقّی دارد. اختلاف‌های مربوط به مفاهیمِ فطری، ریاضیات، علیت، مدل‌های اقتصادی و اینکه ضرورتِ مفهومی دربارهٔ جهان چه می‌گوید همگی از این شکاف تغذیه می‌شوند.</p>","origin":"تقابلِ کلاسیکِ دورهٔ جدید دکارت، لایبنیتس و اسپینوزا را در سوی عقل‌گرا و لاک، برکلی و هیوم را در سوی تجربه‌گرا قرار می‌دهد. «ترکیبیِ پیشین» کانت کوششی برای دگرگون‌کردنِ نزاع بود، نه صرفاً پیروزیِ یکی از دو طرف.","obj":[["عقلِ خالص تضمین نمی‌کند جهان مطابقِ مفاهیمِ ما باشد.","این فشارِ تجربه‌گرایانه است: ضرورتِ منطقی می‌تواند صدق را حفظ کند اما مقدمهٔ تجربی تولید نمی‌کند. عقل‌گرا با ساختارِ فطری، حقایقِ ضروری یا شرایطِ امکانِ تجربه پاسخ می‌دهد."],["تجربه خودش را سازمان نمی‌دهد؛ مشاهده از پیش مفهومی است.","این فشارِ عقل‌گرایانه/کانتی است. حتی تعیینِ اینکه چه چیزی مشاهده محسوب شود به ساختارِ مفهومی نیاز دارد، پس تجربه‌گراییِ قوی هم باید منشأ آن ساختار را توضیح دهد."]],"confuse":[["عقل‌گرایی و عقلانی‌بودن","عقل‌گرایی تزّی دربارهٔ منبعِ معرفت است، نه صرفاً ستایشِ استدلالِ دقیق."],["تجربه‌گرایی و آزمایش‌گرایی","تجربه‌گرایی گسترده‌تر است: تجربه را منبعِ نهاییِ معرفتِ محتوایی می‌داند حتی جایی که آزمایشِ کنترل‌شده ممکن نیست."]],"mistakes":["بی‌طرف‌دانستنِ جریانِ «اول نظریه» و «اول داده» در حالی که تعهداتِ معرفتیِ متفاوت دارند.","فرضِ اینکه علمِ مدرن این نزاع را یکسره حل کرده؛ علومِ جدید هر دو میراث را با هم حمل می‌کنند."],"check":{"q":"اقتصاددانی می‌گوید یک قضیه پیش از مشاهدهٔ هر بازار، ویژگیِ محتواییِ هر بازارِ ممکن را نشان می‌دهد. این ادعا چه باری دارد؟","a":"ادعایی عقل‌گرایانه است. باید نشان دهد مقدمات صرفاً تعریف‌های انتخابی یا فرض‌های تجربیِ پنهان نیستند و نتیجه حقّاً بر جهان قابل‌اعمال است."}}},"synapr":{"en":{"line":"The synthetic a priori is Kant’s claim that some truths add substantive content yet can be known independently of particular experience.","why":"<p>Kant needed a category that could explain how mathematics and fundamental principles of experience seem both informative and necessary. If all a priori truths are merely analytic, reason cannot add substantive knowledge; if all synthetic truths require experience, necessity becomes difficult to explain. The synthetic a priori is the attempted bridge.</p>","origin":"Immanuel Kant made the category central in the <i>Critique of Pure Reason</i> (1781/1787), famously asking how synthetic a priori judgments are possible. Logical positivists later rejected the category, treating necessity as analytic or conventional; Quine then destabilized the analytic side of that replacement as well.","obj":[["The category is empty: apparent examples are either definitions or empirical generalizations.","That is the empiricist/positivist challenge. A defender must show both genuine world-directed content and independence from empirical confirmation, not merely verbal necessity."],["Scientific revolutions undermined Kant’s examples, such as Euclidean geometry as necessary structure of space.","This weakens some historical examples but not automatically the general category. Neo-Kantian and contemporary views shift attention from eternal truths to constitutive frameworks or conditions of inquiry."]],"confuse":[["Synthetic a priori vs. innate belief","A proposition could be innately believed and still false or empirically testable. The category concerns justification and content, not psychological origin."],["Synthetic a priori vs. analytic necessity","Analytic necessity is true by conceptual relations; synthetic a priori claims substantive content beyond mere definition."]],"mistakes":["Calling any abstract theoretical assumption “a priori” and then treating it as unrevisable.","Using necessity in a model as evidence that the modeled world itself must have that structure."],"check":{"q":"A model proves a result from axioms without data. What additional claim would be needed to call the result synthetic a priori rather than merely analytic-relative-to-the-axioms?","a":"You would need to show that the result provides substantive knowledge of the world and is justified independently of experience—not merely that it follows necessarily from stipulated premises."}},"fa":{"line":"«ترکیبیِ پیشین» ادعای کانت است که برخی حقایق محتوای واقعی می‌افزایند اما مستقل از تجربهٔ خاص قابل‌دانستن‌اند.","why":"<p>کانت به طبقه‌ای نیاز داشت که توضیح دهد چگونه ریاضیات و اصولِ بنیادیِ تجربه هم آموزنده و هم ضروری به‌نظر می‌رسند. اگر همهٔ پیشین‌ها تحلیلی باشند، عقل معرفتِ محتوایی نمی‌افزاید؛ اگر همهٔ ترکیبی‌ها تجربه بخواهند، ضرورت دشوار می‌شود. ترکیبیِ پیشین پلِ پیشنهادی است.</p>","origin":"ایمانوئل کانت در <i>نقدِ عقلِ محض</i> (۱۷۸۱/۱۷۸۷) پرسشِ «احکامِ ترکیبیِ پیشین چگونه ممکن‌اند؟» را مرکزی کرد. پوزیتیویست‌های منطقی بعدها این طبقه را رد کردند و ضرورت را تحلیلی یا قراردادی دانستند؛ کواین بعداً خودِ سوی تحلیلی را هم زیر سؤال برد.","obj":[["این طبقه تهی است؛ مثال‌ها یا تعریف‌اند یا تعمیمِ تجربی.","این چالشِ تجربه‌گرا/پوزیتیویست است. مدافع باید هم محتوای واقعی دربارهٔ جهان و هم استقلال از تأییدِ تجربی را نشان دهد، نه فقط ضرورتِ لفظی."],["انقلاب‌های علمی مثال‌های کانت، مثل هندسهٔ اقلیدسیِ ضروری برای فضا، را تضعیف کردند.","این بعضی مثال‌های تاریخی را ضعیف می‌کند اما خودِ مقوله را خودکار حذف نمی‌کند. روایت‌های جدیدتر به چارچوب‌های سازنده یا شرایطِ پژوهش منتقل می‌شوند."]],"confuse":[["ترکیبیِ پیشین و باورِ فطری","باور می‌تواند فطری باشد اما کاذب یا تجربی‌آزمون‌پذیر. این مقوله دربارهٔ توجیه و محتواست نه منشأ روان‌شناختی."],["ترکیبیِ پیشین و ضرورتِ تحلیلی","ضرورتِ تحلیلی از روابطِ مفهومی می‌آید؛ ترکیبیِ پیشین ادعای محتوایی فراتر از تعریف دارد."]],"mistakes":["پیشین‌نامیدنِ هر فرضِ نظریِ انتزاعی و سپس بازنگری‌ناپذیر شمردنِ آن.","استفاده از ضرورتِ درونِ مدل به‌عنوان شاهدِ اینکه جهانِ مدل‌شده هم باید همان ساختار را داشته باشد."],"check":{"q":"مدلی بدون داده از اصولِ موضوعه نتیجه‌ای را اثبات می‌کند. برای اینکه آن را «ترکیبیِ پیشین» بنامید چه ادعای اضافه‌ای لازم است؟","a":"باید نشان دهید نتیجه معرفتِ محتوایی دربارهٔ جهان می‌دهد و مستقل از تجربه موجه است؛ نه اینکه فقط از مقدماتِ قراردادی به‌طور ضروری نتیجه می‌شود."}}},"moral":{"en":{"line":"Moral epistemology asks whether normative judgments can be known, what could justify them, and whether moral disagreement is evidence against moral knowledge.","why":"<p>Policy arguments routinely combine claims about what will happen with claims about what should matter. Evidence can settle the first while leaving the second untouched. Moral epistemology supplies the vocabulary for that boundary: intuition, reflective equilibrium, moral realism, constructivism, skepticism, and disagreement.</p>","origin":"The field spans ancient ethics through modern debates about moral realism and skepticism. John Rawls’s method of reflective equilibrium is especially important for practical reasoning: adjust general principles and considered judgments until they support one another rather than pretending either side is foundational.","obj":[["Persistent moral disagreement suggests there are no moral facts to know.","Realists answer that disagreement also occurs in factual domains and can reflect incentives, information, framing, or difficult subject matter. The challenge is explaining why moral disagreement is so deep and what would count as progress."],["Moral intuitions are culturally shaped, so they cannot justify objective claims.","Reflective-equilibrium approaches do not treat raw intuition as infallible. Intuitions are inputs to be tested against principles, counterexamples, coherence, and information about their causal origins."]],"confuse":[["Moral epistemology vs. normative ethics","Normative ethics asks what is right or good; moral epistemology asks how, if at all, we can know or justify such claims."],["Empirical disagreement vs. value disagreement","More data can resolve the former. The latter may persist even after perfect agreement on consequences because the evaluative weights differ."]],"mistakes":["Trying to resolve a normative disagreement by adding empirical evidence that both sides already accept.","Calling a value judgment “subjective” as though that by itself showed it is arbitrary or beyond argument."],"check":{"q":"Two analysts agree a rule will cost $10 million and prevent one fatality, but disagree whether it should be adopted. What kind of disagreement remains?","a":"A normative or moral one about how costs, lives, rights, risk, and institutional duties should be weighted. More empirical precision may help, but it cannot by itself supply the evaluative premise."}},"fa":{"line":"معرفت‌شناسیِ اخلاق می‌پرسد آیا داوری‌های هنجاری قابل‌دانستن‌اند، چه چیزی آن‌ها را موجه می‌کند و آیا اختلافِ اخلاقی شاهدی علیه معرفتِ اخلاقی است.","why":"<p>استدلالِ سیاستی دائماً ادعای «چه خواهد شد» را با «چه باید اهمیت داشته باشد» ترکیب می‌کند. شاهد ممکن است اولی را حل کند و دومی را دست‌نخورده بگذارد. معرفت‌شناسیِ اخلاق واژگانِ لازم را می‌دهد: شهود، تعادلِ تأملی، واقع‌گراییِ اخلاقی، ساخت‌گرایی، شکاکیت و اختلاف.</p>","origin":"حوزه از اخلاقِ باستان تا نزاع‌های جدید دربارهٔ واقع‌گرایی و شکاکیتِ اخلاقی امتداد دارد. روشِ «تعادلِ تأملی» جان رالز برای کارِ عملی مهم است: اصولِ کلی و داوری‌های سنجیده را آن‌قدر تعدیل کنید تا متقابلاً پشتیبانی کنند، نه اینکه یکی را بی‌دلیل بنیاد بگیرید.","obj":[["اختلافِ پایدارِ اخلاقی نشان می‌دهد واقعیتِ اخلاقی‌ای برای دانستن وجود ندارد.","واقع‌گرا پاسخ می‌دهد اختلاف در حوزه‌های factual هم هست و می‌تواند از انگیزه، اطلاعات، چارچوب یا دشواریِ موضوع ناشی شود. چالش این است که چرا اختلافِ اخلاقی چنین عمیق است و پیشرفت چگونه سنجیده می‌شود."],["شهودِ اخلاقی فرهنگی است، پس نمی‌تواند ادعای عینی را توجیه کند.","تعادلِ تأملی شهودِ خام را خطاناپذیر نمی‌گیرد. شهود ورودی‌ای است که باید با اصول، مثالِ نقض، انسجام و شناختِ منشأ علّیِ خودش آزموده شود."]],"confuse":[["معرفت‌شناسیِ اخلاق و اخلاقِ هنجاری","اخلاقِ هنجاری می‌پرسد چه چیزی درست یا خوب است؛ معرفت‌شناسیِ اخلاق می‌پرسد چگونه می‌توان آن ادعاها را دانست یا موجه کرد."],["اختلافِ تجربی و اختلافِ ارزشی","دادهٔ بیشتر ممکن است اولی را حل کند. دومی حتی با توافقِ کامل بر پیامدها هم می‌تواند باقی بماند چون وزن‌های ارزشی فرق دارند."]],"mistakes":["کوشش برای حلِ اختلافِ هنجاری با افزودنِ داده‌ای که هر دو طرف از قبل قبول دارند.","«ذهنی» نامیدنِ حکمِ ارزشی گویی همین کافی است تا آن را دلبخواهی یا غیرقابل‌استدلال بدانیم."],"check":{"q":"دو تحلیلگر توافق دارند مقرره ۱۰ میلیون دلار هزینه و از یک مرگ جلوگیری می‌کند، اما دربارهٔ تصویبش اختلاف دارند. چه نوع اختلافی باقی مانده؟","a":"اختلافِ هنجاری/اخلاقی دربارهٔ وزنِ هزینه، جان، حق، ریسک و تکلیفِ نهادی. دقتِ تجربیِ بیشتر شاید کمک کند، اما مقدمهٔ ارزشی را خودبه‌خود تولید نمی‌کند."}}},"clifford":{"en":{"line":"Clifford says insufficient evidence makes belief itself ethically wrong; James replies that some live, forced, momentous choices rationally permit commitment before evidence can decide.","why":"<p>The debate separates two dangers: credulity and paralysis. Clifford emphasizes the social and moral costs of training ourselves to believe carelessly; James emphasizes cases where withholding belief is not neutral because the opportunity can disappear or participation helps make the evidence available. The issue generalizes to decisions under irreducible uncertainty.</p>","origin":"W.K. Clifford’s “The Ethics of Belief” (1877) uses the negligent shipowner to argue that careless believing is wrong even if luck prevents harm. William James’s “The Will to Believe” (1896) answers that Clifford’s rule is too restrictive for genuinely live, forced, and momentous options that evidence cannot settle in time.","obj":[["James licenses wishful thinking whenever evidence is inconvenient.","His permission is narrow: the option must be live, forced, momentous, and intellectually undecidable. Ordinary empirical questions where more evidence can be gathered do not qualify."],["Clifford’s rule is impossible because most everyday beliefs rest on testimony we have not personally verified.","Clifford need not require first-hand verification of everything; testimony can itself be evidence. The harder question is what counts as sufficient evidence and who bears responsibility for checking it."]],"confuse":[["The ethics of belief vs. epistemic justification","A belief might be epistemically supported yet morally harmful to hold or express; conversely a morally understandable belief may still be poorly supported."],["Jamesian permission vs. believing whatever is comforting","James’s category is constrained by the structure of the choice, not by emotional preference alone."]],"mistakes":["Using James to excuse empirical beliefs that are perfectly testable but inconvenient to test.","Reading Clifford as “never act under uncertainty”; his target is irresponsible belief formation, not the impossibility of certainty."],"check":{"q":"A decision must be made tomorrow, the evidence cannot be improved before then, and declining to choose guarantees losing the opportunity. Which side of the Clifford–James debate becomes especially relevant?","a":"James’s. The option may be forced and momentous, so withholding is itself a consequential choice. That does not make any belief true; it changes what commitment may be rationally permissible."}},"fa":{"line":"کلیفورد می‌گوید باور بر شواهدِ ناکافی خود از نظر اخلاقی خطاست؛ جیمز پاسخ می‌دهد بعضی انتخاب‌های زنده، اجباری و مهم پیش از آنکه شاهد بتواند تصمیم بگیرد تعهد را عقلانی می‌کنند.","why":"<p>نزاع دو خطر را جدا می‌کند: ساده‌باوری و فلجِ تصمیم. کلیفورد بر هزینهٔ فردی و اجتماعیِ عادت‌کردن به باورِ بی‌مبالات تأکید دارد؛ جیمز بر مواردی که تعلیق بی‌طرف نیست چون فرصت از دست می‌رود یا خودِ مشارکت بخشی از شرایطِ کسبِ شاهد است. ساختار فراتر از دین و در تصمیم‌گیریِ زیرِ عدمِ‌قطعیت کاربرد دارد.</p>","origin":"مقالهٔ «اخلاقِ باور» دبلیو.کی. کلیفورد (۱۸۷۷) با مثالِ صاحبِ کشتیِ سهل‌انگار استدلال می‌کند باورِ بی‌مبالات حتی اگر خوش‌شانسی جلوی آسیب را بگیرد خطاست. ویلیام جیمز در «ارادهٔ باور» (۱۸۹۶) می‌گوید این قاعده برای گزینه‌های زنده، اجباری و سرنوشت‌ساز که شاهد به‌موقع حلشان نمی‌کند بیش‌ازحد محدودکننده است.","obj":[["جیمز هر وقت شاهد ناخوشایند باشد مجوزِ آرزواندیشی می‌دهد.","مجوزِ او محدود است: گزینه باید زنده، اجباری، مهم و از نظر فکری در آن لحظه حل‌ناشدنی باشد. پرسشِ تجربیِ عادی که می‌توان برایش شاهد جمع کرد مشمول نیست."],["قاعدهٔ کلیفورد ناممکن است چون بیشترِ باورهای روزمره بر گواهی‌ای استوارند که خودمان بررسی نکرده‌ایم.","کلیفورد الزاماً راستی‌آزماییِ شخصیِ همه‌چیز را نمی‌خواهد؛ خودِ گواهی می‌تواند شاهد باشد. پرسشِ دشوار این است که «کافی» چه مقدار است و مسئولیتِ بررسی کجا قرار دارد."]],"confuse":[["اخلاقِ باور و توجیهِ معرفتی","باوری می‌تواند از نظر معرفتی پشتیبانی‌شده اما از نظر اخلاقی زیان‌بار باشد؛ یا از نظر اخلاقی قابل‌فهم اما از نظر شاهدی ضعیف."],["مجوزِ جیمزی و باور به هر چیزِ آرامش‌بخش","شرطِ جیمز از ساختارِ انتخاب می‌آید، نه صرفاً ترجیحِ احساسی."]],"mistakes":["استفاده از جیمز برای توجیهِ باورهای تجربی‌ای که کاملاً آزمون‌پذیرند اما آزمونشان ناراحت‌کننده است.","خواندنِ کلیفورد به‌عنوان «هرگز زیرِ عدمِ‌قطعیت عمل نکن»؛ هدفِ او باورِ غیرمسئولانه است نه مطالبهٔ یقین."],"check":{"q":"فردا باید تصمیم بگیرید، پیش از آن نمی‌توان شواهد را بهتر کرد و انتخاب‌نکردن حتماً فرصت را از بین می‌برد. کدام سوی نزاعِ کلیفورد–جیمز برجسته می‌شود؟","a":"جیمز. گزینه ممکن است اجباری و مهم باشد، پس تعلیق خودش انتخابی پیامددار است. این هیچ باوری را صادق نمی‌کند؛ فقط شرایطِ مجازبودنِ تعهد را تغییر می‌دهد."}}},"dirreal":{"en":{"line":"Direct realism says ordinary perception puts you in direct perceptual contact with mind-independent objects themselves, not with an inner intermediary that must be inferred beyond.","why":"<p>The theory preserves the common-sense idea that when you see a tree, the tree—not a mental image—is what you perceive. It matters because if perception is mediated by an object of awareness, a new skeptical gap opens: how do you know the intermediary accurately represents the world? Direct realism tries to block that gap at the starting point.</p>","origin":"Associated with common-sense traditions such as Thomas Reid and, in a different twentieth-century style, J.L. Austin. It developed partly in opposition to sense-data and representative theories that treated perception as awareness of internal items standing between subject and world.","obj":[["Hallucinations can feel exactly like genuine perception even though no external object is present.","Direct realists often reply with disjunctivism: veridical perception and hallucination need not share the same fundamental mental object merely because they are subjectively similar. The similarity is a psychological fact, not proof of a common intermediary."],["Perceptual processing is heavily constructed by the brain, so experience cannot be direct.","Neural mediation does not automatically imply epistemic or phenomenal mediation by a representation that is itself the object perceived. A causal process can be complex while its intentional object remains the external thing."]],"confuse":[["Direct realism vs. infallibilism","Direct contact does not mean perception cannot err. A direct realist can fully accept illusion, misidentification, and poor conditions."],["Direct realism vs. naive trust","It is a metaphysical/epistemological account of what is perceived, not a recommendation to accept every appearance uncritically."]],"mistakes":["Assuming any neural processing proves indirect realism.","Thinking direct realism must deny hallucination rather than explain it differently from veridical perception."],"check":{"q":"If a direct realist accepts that perception is neurally processed, what do they still deny?","a":"They deny that the immediate object of ordinary veridical perception must therefore be an inner representation or sense-datum from which the external object is only inferred."}},"fa":{"line":"واقع‌گراییِ مستقیم می‌گوید در ادراکِ عادی مستقیماً با خودِ اشیای مستقل از ذهن در تماسِ ادراکی هستیم، نه با واسطه‌ای درونی که جهانِ بیرونی باید از آن استنتاج شود.","why":"<p>این نظریه شهودِ عادی را حفظ می‌کند که وقتی درختی را می‌بینید، موضوعِ ادراک خودِ درخت است، نه تصویرِ ذهنی. اگر موضوعِ مستقیمِ آگاهی یک واسطه باشد، شکافی شکاکانه باز می‌شود: از کجا بدانیم واسطه جهان را درست بازنمایی می‌کند؟ واقع‌گراییِ مستقیم می‌کوشد این شکاف را از ابتدا نبازد.</p>","origin":"با سنتِ عقلِ سلیمِ توماس رید و به شکلی متفاوت با جی.ال. آستین پیوند دارد. تا حدی در برابر نظریه‌های دادهٔ حسی و بازنمایی‌گرایی رشد کرد که ادراک را آگاهی از امورِ درونی میانِ ذهن و جهان می‌دانستند.","obj":[["توهم می‌تواند دقیقاً مانند ادراکِ واقعی تجربه شود در حالی که شیء خارجی وجود ندارد.","واقع‌گرای مستقیم اغلب به انفصال‌گرایی پاسخ می‌دهد: ادراکِ صادق و توهم لازم نیست صرفاً به‌سبب شباهتِ ذهنی یک نوع موضوعِ بنیادی داشته باشند. شباهتِ تجربه دلیلِ وجودِ واسطهٔ مشترک نیست."],["مغز ادراک را شدیداً می‌سازد و پردازش می‌کند، پس ادراک نمی‌تواند مستقیم باشد.","میانجی‌گریِ عصبی لزوماً به میانجی‌گریِ معرفتی با بازنمایی‌ای که خودِ موضوعِ ادراک است نمی‌انجامد. فرایندِ علّی می‌تواند پیچیده باشد در حالی که موضوعِ قصدی همچنان شیء خارجی باشد."]],"confuse":[["واقع‌گراییِ مستقیم و خطاناپذیری","تماسِ مستقیم به معنای مصونیت از خطا نیست. واقع‌گرای مستقیم می‌تواند خطای ادراکی، توهم و شرایطِ بد را کاملاً بپذیرد."],["واقع‌گراییِ مستقیم و اعتمادِ ساده‌لوحانه","این نظریه دربارهٔ چیستیِ موضوعِ ادراک است، نه توصیه‌ای برای پذیرشِ بی‌نقدِ هر نمود."]],"mistakes":["فرضِ اینکه هر پردازشِ عصبی خودبه‌خود واقع‌گراییِ غیرمستقیم را اثبات می‌کند.","تصورِ اینکه واقع‌گراییِ مستقیم باید وجودِ توهم را انکار کند، به‌جای توضیحِ متفاوتِ آن."],"check":{"q":"اگر واقع‌گرای مستقیم بپذیرد ادراک از پردازشِ عصبی می‌گذرد، هنوز چه چیزی را انکار می‌کند؟","a":"این نتیجه را که موضوعِ مستقیمِ ادراکِ صادق حتماً یک بازنمایی یا دادهٔ حسیِ درونی است و شیء بیرونی فقط از آن استنتاج می‌شود."}}},"illus":{"en":{"line":"The argument from illusion uses the similarity between deceptive and veridical experience to argue that what we immediately perceive cannot simply be the external object.","why":"<p>Illusion creates pressure on direct realism. If a straight stick looks bent in water, and a genuinely bent stick can look the same, what is common to the two experiences? Traditional indirect theories answer: an appearance, sense-datum, or representation. The argument matters because the proposed common factor can insert a skeptical veil between mind and world.</p>","origin":"A classical family of arguments found across early-modern and twentieth-century philosophy. Sense-data theorists used it heavily; J.L. Austin later challenged both the examples and the inference from ordinary illusion to a universal theory of perception.","obj":[["The argument assumes that subjectively similar experiences must share the same immediate object.","That is precisely what disjunctivists deny. Similarity may be explained without positing a common inner object; hallucination and perception can be fundamentally different states with overlapping phenomenology."],["Illusions are exceptional cases, so they should not dictate a theory of normal perception.","The defender replies that exceptional cases reveal the structure by holding experience constant while changing the world. The critic answers that a theory built from pathology may overgeneralize from the exception."]],"confuse":[["Illusion vs. hallucination","In illusion, a real object is perceived but misperceived; in hallucination, the relevant external object may be absent altogether."],["Argument from illusion vs. general skepticism","The argument targets the immediate object or structure of perception. Skepticism about the external world is a further conclusion requiring additional steps."]],"mistakes":["Treating perceptual error as proof that perception is never world-involving.","Assuming phenomenological indistinguishability automatically implies metaphysical identity of the experiences."],"check":{"q":"A measurement instrument produces the same display both when the target is present and when an artifact is present. What is the epistemic analogue of the argument from illusion?","a":"The output alone does not reveal which underlying state generated it. You need an account of the measurement relation or independent checks; identical appearance does not guarantee identical reality."}},"fa":{"line":"استدلال از توهم از شباهتِ تجربهٔ فریبنده و تجربهٔ صادق استفاده می‌کند تا بگوید آنچه بی‌واسطه ادراک می‌کنیم نمی‌تواند صرفاً خودِ شیء خارجی باشد.","why":"<p>توهم بر واقع‌گراییِ مستقیم فشار می‌آورد. اگر چوبِ راست در آب خمیده به‌نظر برسد و چوبِ واقعاً خمیده هم همان‌طور دیده شود، عنصرِ مشترکِ دو تجربه چیست؟ نظریه‌های غیرمستقیم می‌گویند نمود، دادهٔ حسی یا بازنمایی. اهمیتِ استدلال در این است که این عاملِ مشترک می‌تواند پرده‌ای شکاکانه میانِ ذهن و جهان بسازد.</p>","origin":"خانواده‌ای کلاسیک از استدلال‌ها در فلسفهٔ دورهٔ جدید و قرن بیستم. نظریه‌پردازانِ دادهٔ حسی زیاد از آن استفاده کردند؛ جی.ال. آستین بعدتر هم مثال‌ها و هم گذار از توهمِ عادی به نظریه‌ای عمومی از ادراک را نقد کرد.","obj":[["استدلال فرض می‌کند تجربه‌های ذهنیِ شبیه باید موضوعِ مستقیمِ یکسان داشته باشند.","همین مقدمه را انفصال‌گرا رد می‌کند. شباهت می‌تواند بدون شیء درونیِ مشترک توضیح داده شود؛ توهم و ادراک ممکن است حالاتِ بنیادیِ متفاوت با پدیدارِ مشابه باشند."],["توهم استثنایی است و نباید نظریهٔ ادراکِ عادی را تعیین کند.","مدافع می‌گوید موردِ استثنایی ساختار را آشکار می‌کند چون تجربه را ثابت و جهان را عوض می‌کند. منتقد پاسخ می‌دهد شاید نظریه از آسیب‌شناسی به حالتِ عادی بیش‌تعمیم می‌دهد."]],"confuse":[["توهم و هذیانِ ادراکی","در توهم شیء واقعی هست اما بد ادراک می‌شود؛ در هذیان ممکن است اصلاً شیء خارجیِ مربوط وجود نداشته باشد."],["استدلال از توهم و شکاکیتِ کلی","استدلال ابتدا به موضوع یا ساختارِ مستقیمِ ادراک می‌پردازد. شکاکیت دربارهٔ جهانِ بیرون نتیجهٔ بعدی و نیازمندِ مراحلِ اضافه است."]],"mistakes":["برداشتِ هر خطای ادراکی به‌عنوان اثباتِ اینکه ادراک هرگز جهان‌درگیر نیست.","فرضِ اینکه غیرقابل‌تمایزبودنِ پدیداری خودبه‌خود هویتِ متافیزیکیِ دو تجربه را ثابت می‌کند."],"check":{"q":"ابزارِ سنجش چه در حضورِ هدف و چه در حضورِ یک آرتیفکت همان نمایشگر را نشان می‌دهد. مشابهِ معرفتیِ استدلال از توهم چیست؟","a":"خروجی به‌تنهایی حالتِ زیرین را مشخص نمی‌کند. باید رابطهٔ اندازه‌گیری یا بررسیِ مستقل داشته باشید؛ ظاهرِ یکسان، واقعیتِ یکسان را تضمین نمی‌کند."}}},"indreal":{"en":{"line":"Indirect realism says we know external objects through perceptual representations: the external cause is real, but what is immediately available to consciousness is representational.","why":"<p>The view explains illusion, perspective, and sensory processing by distinguishing the object from the way it is represented. Its price is epistemic distance. Once access is through a representation, the theory must explain how the representation is known to correspond to a mind-independent cause rather than becoming a self-contained screen.</p>","origin":"Representative realism is associated with Locke and later versions with Russell and sense-data traditions, though their theories differ significantly. It sits between idealism and direct realism: external objects exist, but perceptual access is mediated.","obj":[["If we only perceive representations, comparison with the external world is impossible, so correspondence can never be checked.","Indirect realists appeal to causal explanation, coherence across senses and observers, and successful action as evidence that representations reliably track external causes. Critics reply that all such evidence is itself representational."],["Contemporary neuroscience supports internal representations, so indirect realism is simply scientifically established.","Neural representation does not settle the philosophical question of what the subject perceptually relates to. A direct realist can accept internal information processing without treating neural states as the objects of awareness."]],"confuse":[["Indirect realism vs. idealism","Indirect realism affirms a mind-independent external world. Idealism, in its stronger forms, denies or reinterprets that independence."],["Representation as neural processing vs. representation as object of awareness","The first is a scientific claim about mechanism; the second is a philosophical claim about perceptual access. They should not be collapsed."]],"mistakes":["Using instrument or neural mediation as sufficient proof that the perceived object is an internal representation.","Forgetting the verification problem created once all evidence for the world also arrives through the same representational channel."],"check":{"q":"Why does indirect realism solve one problem of perception only by creating another?","a":"It handles illusion by placing a representation between subject and object, but that creates the further problem of explaining how the subject can know the representation accurately corresponds to the external world."}},"fa":{"line":"واقع‌گراییِ غیرمستقیم می‌گوید اشیای خارجی را از راهِ بازنمایی‌های ادراکی می‌شناسیم: علتِ بیرونی واقعی است، اما آنچه مستقیماً برای آگاهی حاضر است بازنمایی است.","why":"<p>این دیدگاه توهم، زاویهٔ دید و پردازشِ حسی را با جداکردنِ شیء از نحوهٔ بازنماییِ آن توضیح می‌دهد. هزینه‌اش فاصلهٔ معرفتی است. وقتی دسترسی از راهِ بازنمایی باشد، باید توضیح دهد از کجا می‌دانیم بازنمایی با علتِ مستقل از ذهن مطابقت دارد و به پرده‌ای بسته تبدیل نشده است.</p>","origin":"بازنمایی‌گرایی با لاک و نسخه‌های بعدی با راسل و سنتِ دادهٔ حسی پیوند دارد، هرچند نظریه‌هایشان یکسان نیست. میانِ ایده‌آلیسم و واقع‌گراییِ مستقیم می‌ایستد: اشیای بیرونی وجود دارند، اما دسترسی ادراکی میانجی‌دار است.","obj":[["اگر فقط بازنمایی را ادراک کنیم، مقایسه با جهانِ بیرون ناممکن است و مطابقت هرگز بررسی نمی‌شود.","واقع‌گرای غیرمستقیم به تبیینِ علّی، انسجامِ بینِ حواس و ناظران و موفقیتِ عملی به‌عنوان شاهدِ ردیابیِ جهان تکیه می‌کند. منتقد می‌گوید همهٔ این شواهد خود بازنمایی‌شده‌اند."],["علومِ اعصاب بازنماییِ درونی را نشان داده، پس واقع‌گراییِ غیرمستقیم علمی ثابت شده است.","بازنماییِ عصبی پرسشِ فلسفیِ موضوعِ رابطهٔ ادراکی را حل نمی‌کند. واقع‌گرای مستقیم هم می‌تواند پردازشِ اطلاعاتِ درونی را بپذیرد بی‌آنکه حالتِ عصبی را موضوعِ آگاهی بداند."]],"confuse":[["واقع‌گراییِ غیرمستقیم و ایده‌آلیسم","واقع‌گراییِ غیرمستقیم جهانِ مستقل از ذهن را می‌پذیرد؛ ایده‌آلیسمِ قوی استقلالِ آن را رد یا بازتفسیر می‌کند."],["بازنمایی به‌عنوان پردازشِ عصبی و بازنمایی به‌عنوان موضوعِ آگاهی","اولی ادعای علمی دربارهٔ سازوکار است؛ دومی ادعای فلسفی دربارهٔ دسترسیِ ادراکی. نباید یکی گرفته شوند."]],"mistakes":["کافی‌دانستنِ میانجی‌گریِ ابزار یا مغز برای اثباتِ اینکه موضوعِ ادراک بازنماییِ درونی است.","فراموش‌کردنِ مسئلهٔ راستی‌آزمایی که وقتی همهٔ شواهدِ جهان از همان کانالِ بازنمایی می‌آیند ایجاد می‌شود."],"check":{"q":"چرا واقع‌گراییِ غیرمستقیم یک مشکلِ ادراک را با ایجادِ مشکلِ دیگری حل می‌کند؟","a":"توهم را با قرار دادنِ بازنمایی میانِ فاعل و شیء توضیح می‌دهد، اما سپس باید توضیح دهد فاعل چگونه می‌داند آن بازنمایی با جهانِ بیرونی مطابقت دارد."}}},"past":{"en":{"line":"Skepticism about the past observes that present evidence underdetermines whether the remembered and recorded past actually occurred as we take it to have occurred.","why":"<p>Memory, documents, fossils, and databases are all present states used to infer earlier states. Russell’s five-minute hypothesis dramatizes the logical gap: the current world could in principle have appeared with all apparent traces already in place. The point is not that this happened, but that ordinary historical knowledge relies on anti-skeptical assumptions about memory, causation, and temporal continuity.</p>","origin":"Bertrand Russell used the “five-minute hypothesis” as a vivid skeptical possibility, though skepticism about memory and the past is older. It parallels Cartesian skepticism but targets temporal inference rather than the external world at the present moment.","obj":[["The hypothesis is gratuitous and has no evidence, so it should be ignored.","That is the common-sense or abductive reply: the ordinary past is vastly simpler and more explanatory. The skeptic’s point is only that present evidence does not logically entail it; inference to the best explanation does the anti-skeptical work."],["If the alternative makes no different predictions, it is meaningless or irrelevant.","Pragmatically perhaps. Epistemically it reveals that historical knowledge is not deductive certainty and that evidence must be interpreted under assumptions about how traces are produced."]],"confuse":[["Skepticism about the past vs. ordinary uncertainty about history","Ordinary uncertainty concerns which past event occurred; radical skepticism questions whether the apparent past existed at all."],["Memory skepticism vs. memory fallibility","Fallibility says some memories are wrong. Skepticism asks what could justify trusting memory as a source in the first place."]],"mistakes":["Treating backtested fit as if the data uniquely identify the generating history.","Responding to a logical skeptical possibility by merely producing more traces of the same kind whose reliability is under question."],"check":{"q":"What does the five-minute hypothesis actually establish, if anything?","a":"Not that the world is five minutes old. It establishes that present traces do not deductively entail the ordinary past; trusting the past depends on explanatory, causal, and memory assumptions."}},"fa":{"line":"شکاکیت دربارهٔ گذشته یادآوری می‌کند که شواهدِ حاضر تعیین نمی‌کنند آیا گذشتهٔ به‌یادآمده و ثبت‌شده واقعاً همان‌گونه رخ داده که می‌پنداریم.","why":"<p>حافظه، سند، فسیل و پایگاهِ داده همگی حالاتِ فعلی‌اند که از آن‌ها حالتِ پیشین را استنتاج می‌کنیم. فرضیهٔ «پنج دقیقه» راسل شکافِ منطقی را برجسته می‌کند: جهانِ فعلی می‌توانست اصولاً همراه با همهٔ آثارِ ظاهری ناگهان پدید آمده باشد. هدف باوراندنِ این سناریو نیست؛ نشان‌دادنِ اتکای معرفتِ تاریخی به فرض‌هایی دربارهٔ حافظه، علیت و تداومِ زمان است.</p>","origin":"برتراند راسل فرضیهٔ «پنج دقیقه» را به‌عنوان امکانِ شکاکانه‌ای برجسته مطرح کرد، هرچند شک دربارهٔ حافظه و گذشته قدیمی‌تر است. ساختارش شبیه شکاکیتِ دکارتی است اما استنتاجِ زمانی را هدف می‌گیرد.","obj":[["فرضیه دلبخواهی و بی‌شاهد است و باید نادیده گرفته شود.","این پاسخِ عقلِ سلیم و استنتاج به بهترین تبیین است: گذشتهٔ عادی بسیار ساده‌تر و تبیین‌گرتر است. نکتهٔ شکاک فقط این است که شواهدِ فعلی آن را منطقی نتیجه نمی‌دهند؛ کارِ ضدشکاکانه را تبیین انجام می‌دهد."],["اگر بدیل هیچ پیش‌بینیِ متفاوتی ندارد، بی‌معنا یا بی‌اهمیت است.","از نظر عملی شاید. از نظر معرفتی نشان می‌دهد معرفتِ تاریخی یقینِ قیاسی نیست و آثار فقط زیرِ فرض‌هایی دربارهٔ نحوهٔ تولیدشان شاهد می‌شوند."]],"confuse":[["شکاکیت دربارهٔ گذشته و عدمِ‌قطعیتِ عادیِ تاریخی","عدمِ‌قطعیتِ عادی می‌پرسد کدام رویداد رخ داد؛ شکاکیتِ رادیکال می‌پرسد آیا اصلاً گذشتهٔ ظاهری وجود داشته است."],["شکاکیت دربارهٔ حافظه و خطاپذیریِ حافظه","خطاپذیری می‌گوید بعضی خاطره‌ها غلط‌اند؛ شکاکیت می‌پرسد اصلِ اعتماد به حافظه چگونه موجه می‌شود."]],"mistakes":["برخورد با برازشِ پس‌آزمایی به‌عنوان اینکه داده تاریخِ مولد را یکتا تعیین می‌کند.","پاسخ به امکانِ شکاکانه با تولیدِ آثارِ بیشتری از همان نوعی که وثاقتِ آن محلِ سؤال است."],"check":{"q":"فرضیهٔ پنج‌دقیقه‌ای دقیقاً چه چیزی را ثابت می‌کند؟","a":"نه اینکه جهان پنج دقیقه عمر دارد؛ فقط اینکه آثارِ فعلی گذشتهٔ عادی را به‌طور قیاسی نتیجه نمی‌دهند و اعتماد به گذشته به فرض‌های تبیینی، علّی و حافظه‌ای وابسته است."}}},"pyrrh":{"en":{"line":"Pyrrhonian skepticism aims not to prove that knowledge is impossible, but to suspend judgment when opposing considerations remain equipollent.","why":"<p>This is a different skeptical ambition from Cartesian doubt. The Pyrrhonist avoids the self-defeating claim “nothing can be known,” because that too would be a doctrine. Instead, arguments and counterarguments are balanced until assent is withheld. Suspension—<i>epoché</i>—is treated as an achievement of disciplined non-commitment.</p>","origin":"Associated with Pyrrho and known principally through Sextus Empiricus. The later modes of Agrippa—regress, circularity, hypothesis, disagreement, relativity—are strategies for inducing suspension rather than premises in a dogmatic theory of skepticism.","obj":[["Suspending judgment on everything is impossible; action requires beliefs.","Pyrrhonists distinguish doctrinal assent from following appearances, habits, skills, and practical necessities. One can act without asserting a theory about ultimate justification."],["The method secretly asserts that opposing arguments are equal, which is itself a belief.","The Pyrrhonist can present equipollence as how things appear rather than as a universal proposition. Critics question whether this linguistic restraint genuinely avoids commitment."]],"confuse":[["Pyrrhonian vs. Cartesian skepticism","Cartesian skepticism uses doubt in search of certainty or a foundation. Pyrrhonism seeks suspension and does not promise reconstruction from indubitable premises."],["Suspension vs. indecision","Epoché is not confusion or lack of effort; it can result from having investigated both sides and finding no justified asymmetry."]],"mistakes":["Summarizing Pyrrhonism as “we know nothing,” which turns it into the dogmatic claim it tries to avoid.","Thinking suspension requires paralysis in ordinary action."],"check":{"q":"After examining two technically serious but balanced arguments, you deliberately decline to assert either conclusion. What would a Pyrrhonist say you achieved?","a":"Epoché—suspension of judgment. The achievement lies in resisting a claim that outruns the available asymmetry in reasons, not in proving both sides false."}},"fa":{"line":"شکاکیتِ پیرونی نمی‌خواهد ثابت کند معرفت ناممکن است؛ هدفش تعلیقِ حکم وقتی است که ملاحظاتِ مخالف هم‌سنگ باقی می‌مانند.","why":"<p>این جاه‌طلبی با شکِ دکارتی فرق دارد. پیرونی از ادعای خودویرانگرِ «هیچ چیز دانسته نمی‌شود» پرهیز می‌کند، چون آن هم یک آموزه است. استدلال و ضدِاستدلال تا هم‌سنگی پیش می‌روند و سپس تصدیق متوقف می‌شود. <i>اپوخه</i> یا تعلیق دستاوردِ انضباطِ عدمِ تعهد است.</p>","origin":"با پیرون پیوند دارد و عمدتاً از نوشته‌های سکستوس امپیریکوس شناخته می‌شود. وجوهِ آگریپا—تسلسل، دور، فرض، اختلاف و نسبیت—ابزارهایی برای ایجادِ تعلیق‌اند، نه مقدماتِ نظریه‌ای جزمی دربارهٔ شکاکیت.","obj":[["تعلیقِ حکم دربارهٔ همه‌چیز ناممکن است؛ عمل باور می‌خواهد.","پیرونی میانِ تصدیقِ نظری و پیروی از نمود، عادت، مهارت و ضرورتِ عملی فرق می‌گذارد. می‌توان عمل کرد بی‌آنکه نظریه‌ای دربارهٔ توجیهِ نهایی پذیرفت."],["خودِ روش ادعا می‌کند دو طرف برابرند و این خودش باور است.","پیرونی می‌تواند هم‌سنگی را به‌صورتِ «چنین به نظر می‌رسد» بیان کند نه گزاره‌ای جهان‌شمول. منتقد می‌پرسد آیا این احتیاطِ زبانی واقعاً تعهد را حذف می‌کند یا نه."]],"confuse":[["شکاکیتِ پیرونی و دکارتی","دکارتی از شک برای یافتنِ یقین یا بنیاد استفاده می‌کند. پیرونی تعلیق را هدف می‌گیرد و بازسازی از مقدماتِ تردیدناپذیر وعده نمی‌دهد."],["تعلیق و سردرگمی","اپوخه ندانستنِ تنبلانه نیست؛ ممکن است حاصلِ بررسیِ جدیِ هر دو طرف و نیافتنِ برتریِ موجه باشد."]],"mistakes":["خلاصه‌کردنِ پیرونیسم به «هیچ نمی‌دانیم» و تبدیلِ آن به همان ادعای جزمی که از آن فرار می‌کند.","تصورِ اینکه تعلیقِ حکم الزاماً عملِ روزمره را فلج می‌کند."],"check":{"q":"پس از بررسیِ دو استدلالِ فنیِ جدی و هم‌وزن، عمداً هیچ نتیجه‌ای را تصدیق نمی‌کنید. پیرونی چه می‌گوید به دست آورده‌اید؟","a":"اپوخه یا تعلیقِ حکم. دستاورد این است که ادعایی فراتر از تفاوتِ واقعیِ دلایل نکنید، نه اینکه هر دو طرف را کاذب ثابت کرده باشید."}}},"quine":{"en":{"line":"Naturalized epistemology replaces or embeds the traditional quest for a priori justification with empirical study of how creatures actually transform sensory input into beliefs and theories.","why":"<p>If foundationalist reconstruction cannot derive science from indubitable experience, Quine argues that epistemology should stop trying to stand outside science and instead become part of it. The project shifts from “what ultimate justification is possible?” toward “how does this cognitive system in fact produce its picture of the world from limited input?”</p>","origin":"W.V.O. Quine’s “Epistemology Naturalized” (1969) proposed the program after his broader rejection of the analytic/synthetic distinction and reductionist empiricism. Psychology, linguistics, and later cognitive science become continuous with epistemology rather than merely supplying examples.","obj":[["Describing how people form beliefs cannot tell us how they ought to form them; naturalism commits the naturalistic fallacy.","This is the central normative objection. Moderate naturalists reply that empirical facts about reliability, human capacities, and environments can constrain normative standards even if they do not wholly replace them."],["If epistemology becomes science, using science to validate science is circular.","Quine accepts continuity rather than a view from nowhere. Critics see circularity; defenders call it unavoidable self-correction from within the boat, close to Neurath’s image."]],"confuse":[["Naturalized epistemology vs. evolutionary psychology","Evolutionary explanations are one possible empirical input, not the definition of the project."],["Naturalism vs. scientism","Naturalized epistemology gives empirical inquiry a constitutive role; it need not claim that every meaningful question is reducible to laboratory science."]],"mistakes":["Treating a psychological explanation of a bias as automatically showing the belief is unjustified.","Assuming normative questions disappear merely because causal mechanisms are known."],"check":{"q":"A study explains exactly why people form a certain belief. What question remains if you reject full Quinean replacement?","a":"Whether that belief-forming process is epistemically good—reliable, responsible, evidence-sensitive, or otherwise justified. Causal explanation does not by itself settle normative status."}},"fa":{"line":"معرفت‌شناسیِ طبیعی‌شده می‌کوشد جست‌وجوی سنتی برای توجیهِ پیشینی را با مطالعهٔ تجربیِ اینکه موجودِ شناختی چگونه ورودیِ حسی را به باور و نظریه تبدیل می‌کند جایگزین یا در آن ادغام کند.","why":"<p>اگر پروژهٔ مبناگرایانه نتواند علم را از تجربهٔ تردیدناپذیر استنتاج کند، کواین می‌گوید معرفت‌شناسی باید از تلاش برای ایستادن بیرونِ علم دست بکشد و بخشی از آن شود. پرسش از «توجیهِ نهایی چیست؟» به «این دستگاهِ شناختی چگونه از ورودیِ محدود تصویرِ جهان را می‌سازد؟» تغییر می‌کند.</p>","origin":"مقالهٔ «معرفت‌شناسیِ طبیعی‌شده» کواین (۱۹۶۹) این برنامه را پس از ردِ تمایزِ تحلیلی/ترکیبی و تجربه‌گراییِ تقلیل‌گرا مطرح کرد. روان‌شناسی، زبان‌شناسی و بعدتر علومِ شناختی با معرفت‌شناسی پیوسته می‌شوند نه صرفاً تأمین‌کنندهٔ مثال.","obj":[["توصیفِ اینکه مردم چگونه باور می‌سازند نمی‌گوید چگونه باید باور بسازند؛ هنجار از واقعیت درنمی‌آید.","این اعتراضِ هنجاریِ مرکزی است. طبیعی‌گرای معتدل می‌گوید واقعیت‌های تجربی دربارهٔ وثاقت، ظرفیتِ انسانی و محیط می‌توانند استانداردِ هنجاری را محدود کنند، حتی اگر جایگزینِ کاملِ آن نشوند."],["اگر معرفت‌شناسی خودش علم شود، استفاده از علم برای اعتباردادن به علم دوری است.","کواین پیوستگی از درون را می‌پذیرد و دنبالِ نقطهٔ بیرونی نیست. منتقد آن را دور می‌بیند؛ مدافع آن را خوداصلاحیِ اجتناب‌ناپذیر از داخلِ کشتیِ نویرات می‌داند."]],"confuse":[["معرفت‌شناسیِ طبیعی‌شده و روان‌شناسیِ تکاملی","تبیینِ تکاملی یکی از ورودی‌های ممکن است، نه تعریفِ کلِ برنامه."],["طبیعی‌گرایی و علم‌باوریِ افراطی","نقشِ بنیادی به پژوهشِ تجربی دادن به این معنا نیست که هر پرسشِ معنادار فقط آزمایشگاهی است."]],"mistakes":["فرضِ اینکه تبیینِ روان‌شناختیِ یک سوگیری خودبه‌خود نشان می‌دهد باور ناموجه است.","تصورِ اینکه با شناختِ سازوکارِ علّی، پرسشِ هنجاری ناپدید می‌شود."],"check":{"q":"پژوهشی دقیقاً توضیح می‌دهد چرا مردم باوری خاص پیدا می‌کنند. اگر جایگزینیِ کاملِ کواینی را نپذیرید چه پرسشی باقی است؟","a":"اینکه آن فرایندِ باورساز از نظر معرفتی خوب است یا نه—وثیق، مسئولانه، حساس به شواهد یا به شکلی دیگر موجه. تبیینِ علّی به‌تنهایی شأنِ هنجاری را حل نمی‌کند."}}},"hb":{"en":{"line":"The heuristics-and-biases program studies predictable departures from normative benchmarks, but the benchmark, task design, and replication record are part of the epistemic evaluation too.","why":"<p>The program transformed reasoning research by showing that errors are systematic rather than random: availability, representativeness, anchoring, conjunction errors, and base-rate neglect can be elicited repeatedly. Its practical value is large, but so is the temptation to turn a catalog of effects into a theory that people are globally irrational.</p>","origin":"Developed principally by Daniel Kahneman and Amos Tversky from the 1970s onward. Later work by Gigerenzer, replication projects, and statistical critiques challenged some tasks and interpretations without erasing the central discovery of systematic context-sensitive error.","obj":[["Many famous bias demonstrations use unnatural formats and disappear under frequencies or ecologically familiar tasks.","That is Gigerenzer’s strongest critique. Defenders answer that format sensitivity is itself psychologically important; the benchmark should be chosen carefully rather than assuming every deviation is irrational."],["Some effects replicated poorly, so the whole program is discredited.","That overcorrects. The literature is heterogeneous: some effects are robust, others weaker or task-dependent. The epistemically appropriate response is effect-by-effect calibration, not wholesale acceptance or rejection."]],"confuse":[["Bias vs. error","An error is a particular wrong answer. A bias is a systematic tendency that shifts judgments in a direction across cases."],["Heuristic vs. bias","A heuristic is a strategy or shortcut; it may be adaptive. A bias is a systematic deviation relative to a benchmark. Heuristics do not equal mistakes."]],"mistakes":["Learning bias names mainly to diagnose opponents rather than changing decision procedures.","Treating a statistically observed group tendency as a diagnosis of a particular person in a particular case."],"check":{"q":"A classic bias effect disappears when probabilities are restated as natural frequencies. What should you conclude?","a":"Not immediately that the participants were irrational or that the bias is fake. The representation format is causally important, so the normative benchmark and task ecology need to be part of the explanation."}},"fa":{"line":"برنامهٔ «ابتکارها و سوگیری‌ها» انحراف‌های قابل‌پیش‌بینی از معیارهای هنجاری را مطالعه می‌کند، اما خودِ معیار، طراحیِ مسئله و کارنامهٔ تکرار نیز بخشی از ارزیابیِ معرفتی‌اند.","why":"<p>این برنامه پژوهشِ استدلال را دگرگون کرد چون نشان داد خطاها فقط تصادفی نیستند: دسترس‌پذیری، نمایندگی، لنگر، خطای عطف و غفلت از نرخِ پایه به‌طور منظم ظاهر می‌شوند. ارزشِ عملی بالاست، اما وسوسهٔ خطرناک این است که فهرستِ اثرها را به حکمِ «انسان‌ها اساساً غیرعقلانی‌اند» تبدیل کنیم.</p>","origin":"از دههٔ ۱۹۷۰ عمدتاً با کارِ دنیل کانمن و آموس تورسکی شکل گرفت. بعدتر گیگرنزر، پروژه‌های تکرار و نقدهای آماری بعضی تکالیف و تفسیرها را به چالش کشیدند، بی‌آنکه کشفِ اصلیِ خطای نظام‌مند و زمینه‌حساس را حذف کنند.","obj":[["بسیاری از اثرهای مشهور با قالبِ غیرطبیعی ساخته می‌شوند و با بسامدِ طبیعی ناپدید می‌شوند.","این نقدِ مهمِ گیگرنزر است. مدافع پاسخ می‌دهد حساسیت به قالب خودش واقعیتی روان‌شناختی است؛ باید معیار را درست انتخاب کرد، نه اینکه هر انحرافی را غیرعقلانی دانست."],["بعضی اثرها خوب تکرار نشدند، پس کلِ برنامه بی‌اعتبار است.","این واکنشِ افراطی است. ادبیات ناهمگون است: بعضی اثرها قوی، بعضی ضعیف یا وابسته به تکلیف‌اند. پاسخِ درست کالیبراسیونِ اثر به اثر است."]],"confuse":[["سوگیری و خطا","خطا پاسخِ غلطِ موردی است؛ سوگیری گرایشی نظام‌مند است که قضاوت را در مجموعه‌ای از موارد به یک جهت می‌برد."],["ابتکار و سوگیری","ابتکار راهبرد یا میان‌بُر است و ممکن است سازگار باشد؛ سوگیری انحرافِ نظام‌مند نسبت به یک معیار است. ابتکار معادلِ خطا نیست."]],"mistakes":["یادگرفتنِ نامِ سوگیری‌ها عمدتاً برای تشخیصِ خطای دیگران به‌جای اصلاحِ رویهٔ تصمیمِ خود.","تبدیلِ گرایشِ آماریِ یک گروه به تشخیصِ قطعی دربارهٔ یک فرد در یک مورد."],"check":{"q":"اثرِ کلاسیکِ یک سوگیری وقتی احتمال‌ها به بسامدِ طبیعی بازنویسی می‌شوند ناپدید می‌شود. چه نتیجه‌ای باید بگیرید؟","a":"نه فوراً اینکه شرکت‌کنندگان غیرعقلانی بودند و نه اینکه اثر جعلی است. قالبِ بازنمایی علتِ مهمی است و معیارِ هنجاری و بوم‌شناسیِ مسئله باید در تبیین وارد شوند."}}},"ecolog":{"en":{"line":"Ecological rationality judges a reasoning strategy by how well it fits the structure of the environment, not solely by conformity to an abstract optimization rule.","why":"<p>A heuristic that looks suboptimal in a laboratory can outperform a computationally perfect rule when information is scarce, costs matter, and the environment has stable cues. Gigerenzer’s challenge is therefore benchmark-sensitive: rationality may consist in matching a tool to an ecology rather than maximizing under an unrealistic model of unlimited information.</p>","origin":"Developed by Gerd Gigerenzer and colleagues as a major critique and alternative to broad interpretations of the heuristics-and-biases program. “Fast and frugal” heuristics are studied as adaptive tools whose success depends on environmental structure.","obj":[["Calling a heuristic ‘ecologically rational’ risks excusing any error after the fact by choosing a friendly environment.","The defense requires ex ante environmental conditions under which the heuristic is expected to work and comparative performance against alternatives. Ecology is a testable constraint, not a blanket excuse."],["Normative laws of probability and logic do not stop applying just because a heuristic works well.","Correct. Ecological rationality distinguishes formal coherence from decision performance. A heuristic can violate a formal ideal yet be instrumentally superior under real costs; the two standards should be stated separately."]],"confuse":[["Ecological rationality vs. relativism","The claim is not that anything is rational in its own context. It proposes objective environment–strategy fit that can be tested."],["Heuristic success vs. truth","A decision rule may produce good outcomes without generating accurate beliefs about every underlying variable."]],"mistakes":["Calling a heuristic rational without specifying the environment in which it is supposed to dominate.","Using laboratory benchmark failure as sufficient evidence that the heuristic is practically inferior."],"check":{"q":"A simple rule beats a complex optimizer out of sample because the optimizer overfits noisy inputs. What would ecological rationality emphasize?","a":"The simple rule may be better matched to the environment’s uncertainty, data limits, and cue structure. Rationality should be judged against performance under those conditions, not complexity alone."}},"fa":{"line":"عقلانیتِ بوم‌شناختی راهبردِ استدلال را بر اساسِ تناسبش با ساختارِ محیط می‌سنجد، نه فقط میزانِ پیروی از قاعدهٔ انتزاعیِ بهینه‌سازی.","why":"<p>ابتکاری که در آزمایشگاه زیرِ معیارِ صوری ضعیف به‌نظر می‌رسد ممکن است وقتی اطلاعات محدود، هزینه‌ها واقعی و نشانه‌های محیط پایدارند از قاعدهٔ محاسباتیِ پیچیده بهتر عمل کند. چالشِ گیگرنزر این است که عقلانیت شاید در جورشدنِ ابزار با بوم باشد، نه بیشینه‌سازی زیرِ فرضِ اطلاعاتِ نامحدود.</p>","origin":"گرد گیگرنزر و همکاران این رویکرد را به‌عنوان نقد و بدیلِ مهمِ تفسیرهای گسترده از برنامهٔ ابتکارها و سوگیری‌ها بسط دادند. ابتکارهای «سریع و کم‌خرج» ابزارهای سازگار دانسته می‌شوند که موفقیتشان به ساختارِ محیط وابسته است.","obj":[["«بوم‌شناختی» خواندنِ ابتکار می‌تواند هر خطایی را پس از واقعه با انتخابِ محیطِ مناسب توجیه کند.","دفاع باید شرایطِ محیطی را پیشاپیش تعیین کند که در آن ابتکار انتظار می‌رود موفق باشد و آن را با بدیل‌ها مقایسه کند. بوم شرطِ آزمون‌پذیر است نه بهانهٔ کلی."],["قوانینِ احتمال و منطق با موفقیتِ ابتکار از اعتبار نمی‌افتند.","درست. عقلانیتِ بوم‌شناختی انسجامِ صوری را از عملکردِ تصمیم جدا می‌کند. راهبرد می‌تواند از ایده‌آلِ صوری منحرف اما زیرِ هزینه‌های واقعی بهتر باشد؛ دو معیار باید جدا گفته شوند."]],"confuse":[["عقلانیتِ بوم‌شناختی و نسبی‌گرایی","ادعا این نیست که هر چیزی در زمینهٔ خودش عقلانی است؛ از تناسبِ عینیِ محیط و راهبرد سخن می‌گوید که قابل‌آزمون است."],["موفقیتِ ابتکار و صدق","قاعدهٔ تصمیم می‌تواند پیامدِ خوبی بدهد بدون اینکه همهٔ باورهای زیرین را دقیق کند."]],"mistakes":["عقلانی‌نامیدنِ ابتکار بدون تعیینِ محیطی که قرار است در آن برتری داشته باشد.","کافی‌دانستنِ شکست زیرِ معیارِ آزمایشگاهی برای نتیجه‌گیریِ اینکه ابتکار در عمل بدتر است."],"check":{"q":"قاعده‌ای ساده بیرون از نمونه از بهینه‌سازِ پیچیده بهتر عمل می‌کند چون مدلِ پیچیده نویز را بیش‌برازش کرده است. عقلانیتِ بوم‌شناختی روی چه تأکید می‌کند؟","a":"ممکن است قاعدهٔ ساده با عدمِ‌قطعیت، محدودیتِ داده و ساختارِ نشانه‌های محیط بهتر جور باشد. عقلانیت باید در همان شرایط سنجیده شود، نه با پیچیدگیِ بیشتر."}}},"argth":{"en":{"line":"The argumentative theory proposes that human reasoning is specialized for producing and evaluating arguments in social exchange, not primarily for solitary truth-maximization.","why":"<p>It explains an otherwise puzzling pattern: people often exhibit myside bias when reasoning alone yet improve dramatically when genuine disagreement forces them to evaluate opposing reasons. On this view, some “biases” are side effects of a system designed for interactive argument rather than private optimization.</p>","origin":"Developed by Hugo Mercier and Dan Sperber, especially in work culminating in <i>The Enigma of Reason</i>. The theory challenges the picture of reason as an individual-purpose general optimizer and emphasizes its social, communicative function.","obj":[["Evolutionary function is difficult to establish, and current performance does not prove why reason evolved.","Correct. The theory is strongest as an explanatory research program supported by comparative patterns, not as a directly observed evolutionary fact. Competing accounts can explain some of the same data."],["If reason evolved for argument, that seems to make truth secondary or irrelevant.","Evaluation of others’ arguments still rewards detecting bad reasons, and social exchange can improve accuracy. The claim is about functional design and division of labor, not that truth has no role."]],"confuse":[["Argumentative theory vs. motivated reasoning","Motivated reasoning explains direction toward desired conclusions. The argumentative theory gives a broader functional account of why reason may be asymmetric between producing and evaluating arguments."],["Persuasion vs. rhetoric alone","The theory concerns reasons and their evaluation, not merely emotional manipulation or stylistic persuasion."]],"mistakes":["Using the theory as an excuse that individual reasoning cannot improve.","Concluding that group discussion always helps; homogeneous or conformist groups can amplify rather than correct error."],"check":{"q":"What institutional design follows most directly if t
