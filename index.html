یم‌گیر نمی‌تواند ببیند یا به چالش بکشد."],"check":{"q":"دو تنظیم‌گر بر شواهد توافق دارند اما یکی به‌سببِ ترس از منفیِ کاذب و دیگری از مثبتِ کاذب آستانهٔ متفاوت می‌گذارد. آیا الزاماً اختلافِ علمی است؟","a":"نه. ممکن است اختلاف دربارهٔ ریسکِ استقرایی و هزینهٔ نسبیِ خطا باشد. شاهدِ علمی مشترک است اما آستانهٔ پذیرش ارزش‌های متفاوت را منعکس می‌کند."}}},"causal":{"en":{"line":"Causal inference asks what would happen under intervention or in a counterfactual world, so causal conclusions require assumptions that observational association alone cannot supply.","why":"<p>Data can reveal patterns of co-movement without telling us which variables would change if we actively changed another. Confounding, selection, reverse causation, and measurement can produce the same associations. Modern causal inference makes the extra assumptions explicit—through DAGs, potential outcomes, instruments, natural experiments, or structural models—so the inferential leap can be inspected rather than hidden.</p>","origin":"Modern frameworks include Judea Pearl’s graphical/structural causal models and the Rubin potential-outcomes tradition, with older roots in experimental design and Bradford Hill’s causal considerations. The traditions differ in notation and emphasis but agree that causal identification comes from assumptions plus data, not data alone.","obj":[["Randomized experiments identify causal effects without controversial assumptions.","Randomization solves important confounding problems, but interpretation still requires assumptions about compliance, interference, attrition, measurement, treatment versions, and transportability. No design is assumption-free."],["Causal assumptions are untestable, so causal inference is subjective.","Some assumptions are partly testable and many have observable implications, but identification always includes substantive commitments. The answer is transparency, sensitivity analysis, triangulation, and designs that make weaker assumptions—not pretending none exist."]],"confuse":[["Causal inference vs. prediction","A variable can improve prediction without being a cause, and a cause can be weakly predictive in a noisy system. The tasks optimize different targets."],["Identification vs. estimation","Identification asks whether the causal quantity is uniquely determined under assumptions; estimation asks how precisely to recover it from finite data once identified."]],"mistakes":["Treating control-variable selection as a purely statistical exercise instead of a causal one.","Writing causal language after observational regression without stating the identification assumptions that license it."],"check":{"q":"Your regression coefficient is precisely estimated and robust to many specifications. What is still missing before it earns a causal interpretation?","a":"An identification argument: why, under explicit causal assumptions, the observed variation corresponds to the intervention or counterfactual quantity of interest rather than confounding, selection, reverse causation, or another path."}},"fa":{"line":"استنتاجِ علّی می‌پرسد زیرِ مداخله یا در جهانِ خلاف‌واقع چه رخ می‌دهد؛ بنابراین نتیجهٔ علّی به فرض‌هایی نیاز دارد که همبستگیِ مشاهده‌ای به‌تنهایی فراهم نمی‌کند.","why":"<p>داده می‌تواند هم‌حرکتی را نشان دهد بی‌آنکه بگوید اگر یک متغیر را فعالانه تغییر دهیم چه می‌شود. مخدوش‌گری، انتخاب، علیتِ معکوس و سنجش می‌توانند همان الگو را بسازند. استنتاجِ علّیِ جدید فرض‌های اضافه را با DAG، پیامدهای بالقوه، ابزار، آزمایشِ طبیعی یا مدلِ ساختاری آشکار می‌کند تا جهشِ استنتاجی قابل‌بازرسی باشد.</p>","origin":"چارچوب‌های مدرن شامل مدل‌های علّیِ گرافیکی/ساختاریِ جودیا پرل و سنتِ پیامدهای بالقوهٔ روبین‌اند، با ریشه‌هایی در طراحیِ آزمایش و معیارهای بردفورد هیل. زبان‌ها متفاوت‌اند اما بر این نکته مشترک‌اند که شناساییِ علّی از داده به‌علاوهٔ فرض می‌آید.","obj":[["آزمایشِ تصادفی اثرِ علّی را بدون فرضِ بحث‌برانگیز شناسایی می‌کند.","تصادفی‌سازی مسئلهٔ مهمِ مخدوش‌گری را حل می‌کند، اما تفسیر هنوز به فرض‌هایی دربارهٔ تبعیت، تداخل، ریزش، سنجش، نسخه‌های درمان و قابلیتِ انتقال نیاز دارد. هیچ طراحی بی‌فرض نیست."],["فرض‌های علّی آزمون‌ناپذیرند، پس استنتاجِ علّی سلیقه‌ای است.","بعضی فرض‌ها تا حدی آزمون‌پذیرند و برخی پیامدِ مشاهده‌ای دارند، اما شناسایی همیشه تعهدِ محتوایی دارد. پاسخ شفافیت، تحلیلِ حساسیت، مثلث‌بندی و طراحی با فرض‌های ضعیف‌تر است."]],"confuse":[["استنتاجِ علّی و پیش‌بینی","متغیر می‌تواند پیش‌بینی را بهتر کند بی‌آنکه علت باشد، و علت می‌تواند در نظامِ پرنویز پیش‌بینیِ ضعیفی بدهد. هدف‌ها متفاوت‌اند."],["شناسایی و برآورد","شناسایی می‌پرسد کمیتِ علّی زیرِ فرض‌ها یکتا تعیین می‌شود یا نه؛ برآورد می‌پرسد پس از شناسایی، آن را با دادهٔ محدود چقدر دقیق بازیابی می‌کنیم."]],"mistakes":["انتخابِ متغیرهای کنترل به‌عنوان مسئله‌ای صرفاً آماری به‌جای علّی.","استفاده از زبانِ علّی پس از رگرسیونِ مشاهده‌ای بدون بیانِ فرض‌های شناسایی."],"check":{"q":"ضریبِ رگرسیون دقیق و در مشخصه‌های مختلف پایدار است. پیش از تفسیرِ علّی چه چیز هنوز لازم است؟","a":"استدلالِ شناسایی: چرا زیرِ فرض‌های علّیِ صریح، تغییرِ مشاهده‌شده همان کمیتِ مداخله‌ای/خلاف‌واقعیِ موردنظر است نه مخدوش‌گری، انتخاب، علیتِ معکوس یا مسیرِ دیگر."}}},"ladder":{"en":{"line":"Pearl’s ladder separates association, intervention, and counterfactuals: higher-rung questions require causal information that lower-rung observational patterns do not contain by themselves.","why":"<p>The ladder is a compact diagnostic for overclaiming. Rung one asks what is associated with what; rung two asks what happens if we do X; rung three asks what would have happened to this unit had X been different. Moving upward changes the question, not merely the statistical sophistication of the answer.</p>","origin":"Judea Pearl popularized the “ladder of causation” in his structural-causal framework and later expositions. It maps seeing, doing, and imagining to increasingly demanding causal queries, highlighting the role of interventions and counterfactual models.","obj":[["Experiments directly answer rung-two questions, so the ladder overstates the conceptual gap.","Experiments supply intervention data, which is exactly why they reach rung two. They still need assumptions for noncompliance, interference, generalization, and many rung-three individual counterfactuals."],["Machine learning can predict interventions from enough data without explicit causal models.","Prediction from observational distributions cannot generally identify how those distributions change under intervention when causal structures differ but observational fit is identical. Extra structure or experimental variation is needed."]],"confuse":[["Association vs. causation","Association describes statistical dependence; intervention asks how the outcome distribution changes when X is actively set."],["Intervention vs. counterfactual","Intervention concerns populations or distributions under do(X); counterfactuals often ask unit-specific “what would have happened instead?” questions conditioning on what actually occurred."]],"mistakes":["Answering a rung-two policy question with a rung-one predictive model and causal language.","Assuming a more flexible algorithm moves you up the ladder without new identifying information."],"check":{"q":"“People who receive the program do better” is rung one. What change turns the question into rung two?","a":"Ask what outcomes would occur if eligible people were assigned or caused to receive the program—the intervention question, not merely the observed association among recipients."}},"fa":{"line":"نردبانِ پرل همبستگی، مداخله و خلاف‌واقع را جدا می‌کند: پرسشِ پلهٔ بالاتر اطلاعاتِ علّی‌ای می‌خواهد که الگوی مشاهده‌ایِ پلهٔ پایین‌تر به‌تنهایی ندارد.","why":"<p>نردبان ابزارِ فشرده‌ای برای تشخیصِ بیش‌ادعایی است. پلهٔ یک می‌پرسد چه چیز با چه چیز همراه است؛ پلهٔ دو می‌پرسد اگر X را انجام دهیم چه می‌شود؛ پلهٔ سه می‌پرسد برای همین واحد اگر X متفاوت بود چه می‌شد. بالا رفتن فقط روشِ آماری را پیچیده نمی‌کند، نوعِ سؤال را عوض می‌کند.</p>","origin":"جودیا پرل «نردبانِ علیت» را در چارچوبِ علّیِ ساختاری و نوشته‌های بعدی مشهور کرد. دیدن، انجام‌دادن و تصورکردن را به پرسش‌های هرچه demanding‌تر وصل می‌کند و نقشِ مداخله و مدلِ خلاف‌واقع را نشان می‌دهد.","obj":[["آزمایش مستقیم پلهٔ دوم را جواب می‌دهد، پس شکافِ مفهومی اغراق است.","آزمایش دادهٔ مداخله‌ای می‌دهد و دقیقاً به همین دلیل به پلهٔ دو می‌رسد. همچنان برای عدمِ تبعیت، تداخل، تعمیم و بسیاری از خلاف‌واقع‌های فردی فرض لازم است."],["یادگیریِ ماشین با دادهٔ کافی می‌تواند اثرِ مداخله را بدون مدلِ علّی پیش‌بینی کند.","از توزیعِ مشاهده‌ای به‌طور کلی نمی‌توان دانست توزیع زیرِ مداخله چگونه تغییر می‌کند، چون ساختارهای علّیِ متفاوت می‌توانند برازشِ مشاهده‌ایِ یکسان داشته باشند. اطلاعاتِ اضافه لازم است."]],"confuse":[["همبستگی و علیت","همبستگی وابستگیِ آماری را توصیف می‌کند؛ مداخله می‌پرسد اگر X را فعالانه تنظیم کنیم توزیعِ پیامد چگونه عوض می‌شود."],["مداخله و خلاف‌واقع","مداخله معمولاً دربارهٔ جمعیت زیرِ do(X) است؛ خلاف‌واقع اغلب می‌پرسد برای همین واحد با دانستنِ آنچه واقعاً رخ داد، اگر X متفاوت بود چه می‌شد."]],"mistakes":["پاسخ به پرسشِ سیاستیِ پلهٔ دو با مدلِ پیش‌بینیِ پلهٔ یک و زبانِ علّی.","فرضِ اینکه الگوریتمِ انعطاف‌پذیرتر بدون اطلاعاتِ شناساییِ تازه شما را به پلهٔ بالاتر می‌برد."],"check":{"q":"«افرادی که برنامه را دریافت کردند بهتر شدند» پلهٔ یک است. چه تغییری آن را پلهٔ دو می‌کند؟","a":"بپرسید اگر افرادِ واجد شرایط را وادار یا تخصیص دهیم که برنامه را دریافت کنند چه پیامدی رخ می‌دهد—پرسشِ مداخله، نه صرفاً همراهیِ مشاهده‌شده."}}},"confound":{"en":{"line":"A confounder is a common cause of treatment and outcome that can create or distort association; causal adjustment aims to block that backdoor path without opening new ones.","why":"<p>Regression does not know which variables are confounders. The decision requires a causal model. DAGs make assumed paths explicit so analysts can distinguish variables that should be adjusted for from mediators, colliders, and irrelevant predictors. “Control for everything” is not conservative—it can create bias.</p>","origin":"Confounding is old in epidemiology and statistics; modern graphical criteria are associated with Judea Pearl, Sander Greenland, James Robins, and related causal-inference work. The backdoor criterion formalizes when conditioning suffices under a stated DAG.","obj":[["Including more controls can only make comparisons fairer.","False. Conditioning on colliders can induce association, and controlling mediators can remove part of the causal effect you intend to estimate. Control selection must follow the estimand and causal graph."],["DAGs are subjective drawings, so they add no information.","They do not create causal knowledge, but they expose assumptions that regression otherwise hides. Competing DAGs can be compared, challenged, and subjected to sensitivity analysis; implicit assumptions are not less subjective because they are invisible."]],"confuse":[["Confounder vs. mediator","A confounder is a common cause preceding treatment and outcome; a mediator lies on the causal pathway from treatment to outcome."],["Confounder vs. collider","A confounder points into both variables; a collider receives arrows from two causes. Conditioning often helps with the former and harms with the latter."]],"mistakes":["Selecting controls by statistical significance instead of causal role.","Conditioning on post-treatment variables without specifying whether the estimand is total or direct effect."],"check":{"q":"Wealth affects both private-school attendance and adult earnings. What role does wealth play in the raw schooling–earnings association?","a":"A confounder/common cause. Failing to address the backdoor path through wealth can make the schooling association look more causal than it is."}},"fa":{"line":"مخدوش‌گر علتِ مشترکِ درمان و پیامد است که می‌تواند همبستگی را بسازد یا منحرف کند؛ تعدیلِ علّی می‌کوشد مسیرِ پشت‌در را ببندد بدون اینکه مسیرِ تازه‌ای باز کند.","why":"<p>رگرسیون خودش نمی‌داند کدام متغیر مخدوش‌گر است. تصمیم به مدلِ علّی نیاز دارد. DAG مسیرها را صریح می‌کند تا متغیرِ لازم برای کنترل از میانجی، برخوردگر و پیش‌بینِ صرف جدا شود. «همه‌چیز را کنترل کن» محافظه‌کارانه نیست و می‌تواند سوگیری بسازد.</p>","origin":"مفهومِ مخدوش‌گری در اپیدمیولوژی و آمار قدیمی است؛ معیارهای گرافیکیِ جدید با جودیا پرل، سندر گرینلند، جیمز رابینز و دیگران پیوند دارند. معیارِ پشت‌در شرایطِ کافیِ تعدیل را زیرِ DAG مفروض صورت‌بندی می‌کند.","obj":[["کنترلِ بیشتر فقط مقایسه را منصفانه‌تر می‌کند.","غلط. شرط‌کردن بر برخوردگر می‌تواند همبستگیِ کاذب بسازد و کنترلِ میانجی بخشی از اثرِ علّیِ هدف را حذف کند. انتخابِ کنترل باید از برآوردِ هدف و گراف بیاید."],["DAG فقط نقاشیِ ذهنی است و اطلاعاتی اضافه نمی‌کند.","دانشِ علّی را از هیچ نمی‌سازد، اما فرض‌هایی را که رگرسیون پنهان می‌کند آشکار می‌سازد. گراف‌های رقیب قابل‌مقایسه و تحلیلِ حساسیت‌اند؛ فرضِ ضمنی چون نامرئی است عینی‌تر نمی‌شود."]],"confuse":[["مخدوش‌گر و میانجی","مخدوش‌گر علتِ مشترکِ درمان و پیامد است؛ میانجی روی مسیرِ علّی از درمان به پیامد قرار دارد."],["مخدوش‌گر و برخوردگر","مخدوش‌گر به هر دو متغیر پیکان می‌دهد؛ برخوردگر از دو علت پیکان می‌گیرد. شرط‌کردن معمولاً برای اولی کمک و برای دومی آسیب می‌کند."]],"mistakes":["انتخابِ متغیرِ کنترل بر اساسِ معناداریِ آماری به‌جای نقشِ علّی.","کنترلِ متغیرِ پس از درمان بدون تعیینِ اینکه اثرِ کل یا مستقیم هدف است."],"check":{"q":"ثروت هم بر رفتن به مدرسهٔ خصوصی و هم بر درآمدِ بزرگسالی اثر دارد. در همبستگیِ خامِ مدرسه–درآمد چه نقشی دارد؟","a":"مخدوش‌گر یا علتِ مشترک. نادیده‌گرفتنِ مسیرِ پشت‌در از طریقِ ثروت می‌تواند همبستگیِ مدرسه را علّی‌تر از واقع نشان دهد."}}},"collider":{"en":{"line":"A collider is a common effect of two variables; conditioning on it can create a spurious association between causes that were otherwise independent.","why":"<p>Collider bias is dangerous because it often enters through apparently careful sample restriction or “controlling.” If admission depends on grades and test scores, then among admitted students a low value on one must be compensated by a high value on the other, inducing a negative relation even when none exists in the applicant population.</p>","origin":"The phenomenon is related to Berkson’s paradox and is central in modern DAG-based causal inference. Graphical rules make the lesson visually sharp: paths through a collider are blocked until you condition on the collider or sometimes its descendants.","obj":[["If the selected sample is exactly the population of policy interest, collider bias is irrelevant.","Selection may be appropriate for a descriptive question about that selected population. The problem arises when the induced association is interpreted causally or generalized beyond the conditioning scheme without accounting for selection."],["Regression software can detect and correct the problem.","Not from correlations alone. Whether a variable is a collider is a causal-structural fact, so correction requires design knowledge or assumptions about the selection mechanism."]],"confuse":[["Collider vs. confounder","A confounder is a common cause and often needs adjustment; a collider is a common effect and conditioning can open a biasing path."],["Selection bias vs. collider bias","Collider conditioning is one major mechanism of selection bias, but selection bias is broader and can arise in other ways."]],"mistakes":["Automatically controlling every available pre-specified variable.","Forgetting that entering the dataset at all may already condition on employment, hospitalization, survival, application, or another collider."],"check":{"q":"In a dataset containing only firms that survived a crisis, resilience practices and balance-sheet strength are negatively associated. What should you suspect before interpreting the tradeoff?","a":"Survival may be a collider caused by both practices and balance-sheet strength. Conditioning on survivors can induce a negative association even if the two factors were independent in the full population."}},"fa":{"line":"برخوردگر پیامدِ مشترکِ دو متغیر است؛ شرط‌کردن بر آن می‌تواند میانِ علت‌هایی که قبلاً مستقل بودند همبستگیِ کاذب ایجاد کند.","why":"<p>سوگیریِ برخوردگر خطرناک است چون اغلب در قالبِ محدودکردنِ ظاهراً محتاطانهٔ نمونه یا «کنترل» وارد می‌شود. اگر پذیرشِ دانشگاه به نمره و آزمون وابسته باشد، در میانِ پذیرفته‌ها مقدارِ پایینِ یکی باید با مقدارِ بالای دیگری جبران شود و رابطه‌ای منفی ساخته می‌شود.</p>","origin":"با پارادوکسِ برکسون مرتبط و در استنتاجِ علّیِ مبتنی بر DAG مرکزی است. قاعدهٔ گرافیکی روشن است: مسیرِ عبوری از برخوردگر بسته است تا وقتی بر خودِ برخوردگر یا گاهی نسلِ آن شرط کنیم.","obj":[["اگر نمونهٔ انتخاب‌شده دقیقاً جمعیتِ موردِ سیاست باشد، سوگیریِ برخوردگر بی‌اهمیت است.","برای توصیفِ همان جمعیت شاید انتخاب مناسب باشد. مشکل وقتی است که رابطهٔ القاشده را علّی بخوانیم یا بدون حساب‌کردنِ سازوکارِ انتخاب به بیرون تعمیم دهیم."],["نرم‌افزارِ رگرسیون می‌تواند مشکل را کشف و اصلاح کند.","از همبستگیِ تنها نه. برخوردگر بودن واقعیتی دربارهٔ ساختارِ علّی است و اصلاح به دانشِ طراحی یا فرض دربارهٔ سازوکارِ انتخاب نیاز دارد."]],"confuse":[["برخوردگر و مخدوش‌گر","مخدوش‌گر علتِ مشترک است و اغلب باید تعدیل شود؛ برخوردگر پیامدِ مشترک است و شرط‌کردن بر آن می‌تواند مسیرِ سوگیرانه باز کند."],["سوگیریِ انتخاب و برخوردگر","شرط‌کردن بر برخوردگر یکی از سازوکارهای مهمِ سوگیریِ انتخاب است، اما سوگیریِ انتخاب گسترده‌تر است."]],"mistakes":["کنترلِ خودکارِ هر متغیرِ موجود.","فراموش‌کردنِ اینکه ورود به خودِ مجموعه‌داده ممکن است از قبل شرط بر اشتغال، بستری، بقا، درخواست یا برخوردگرِ دیگری باشد."],"check":{"q":"در داده‌ای که فقط شرکت‌های زنده‌مانده از بحران را دارد، روشِ تاب‌آوری و قدرتِ ترازنامه رابطهٔ منفی دارند. پیش از تعبیرِ «مبادله» به چه شک کنید؟","a":"بقا ممکن است برخوردگری باشد که هر دو عامل آن را ایجاد می‌کنند. شرط بر بازماندگان می‌تواند رابطهٔ منفی بسازد حتی اگر دو عامل در کلِ جمعیت مستقل بودند."}}},"simpson":{"en":{"line":"Simpson’s paradox occurs when an association reverses after aggregation or stratification because group composition carries information about the causal or sampling structure.","why":"<p>The paradox demonstrates that “the data” do not dictate one aggregation level. A treatment can outperform in every subgroup yet look worse overall if treatment groups contain different mixes of high- and low-risk cases. Both arithmetic summaries can be correct; deciding which is relevant requires the causal question.</p>","origin":"Named after Edward Simpson, with related earlier work by Udny Yule. It is now a standard example in statistics and causal inference because graphical causal structure determines whether to adjust for the grouping variable or leave it aggregated.","obj":[["The disaggregated result is always the true one because it is more detailed.","No. If the grouping variable is a mediator or collider, stratifying can answer the wrong question or introduce bias. More granular is not automatically more causal."],["The aggregated result is the real population effect because policy operates on the population.","Sometimes, but composition can confound the comparison. The relevant estimand—overall policy effect, within-group effect, standardized effect—must be chosen before deciding which aggregation answers it."]],"confuse":[["Simpson’s paradox vs. confounding","Confounding is one causal structure that can produce reversal, but Simpson’s paradox is the statistical reversal pattern itself."],["Aggregation bias vs. arithmetic error","No arithmetic mistake is required. The paradox arises precisely because both summaries can be numerically correct while conditioning choices differ."]],"mistakes":["Choosing the aggregation level after seeing which version supports the preferred conclusion.","Assuming subgroup adjustment is always safer without drawing the causal role of the grouping variable."],"check":{"q":"A treatment is better for men and better for women but worse overall. What must you inspect before deciding which conclusion matters?","a":"The group composition and causal role of sex in assignment/outcome, plus the estimand of interest. The reversal itself does not tell you whether to aggregate or stratify."}},"fa":{"line":"پارادوکسِ سیمپسون وقتی است که رابطه پس از تجمیع یا تفکیک معکوس می‌شود، چون ترکیبِ گروه‌ها اطلاعاتی دربارهٔ ساختارِ علّی یا نمونه‌گیری حمل می‌کند.","why":"<p>پارادوکس نشان می‌دهد «داده» یک سطحِ تجمیعِ یکتا تعیین نمی‌کند. درمان می‌تواند در هر زیرگروه بهتر باشد اما در کل بدتر دیده شود اگر گروه‌های درمان ترکیبِ متفاوتی از افرادِ پرخطر و کم‌خطر داشته باشند. هر دو خلاصهٔ عددی می‌توانند درست باشند؛ پرسشِ علّی تعیین می‌کند کدام مربوط است.</p>","origin":"به نامِ ادوارد سیمپسون و با پیشینهٔ مرتبط در کارِ اودنی یول شناخته می‌شود. در آمار و استنتاجِ علّی مثالِ استاندارد است چون ساختارِ گرافی تعیین می‌کند متغیرِ گروه‌بندی را باید تعدیل کرد یا نه.","obj":[["نتیجهٔ تفکیک‌شده همیشه واقعی‌تر است چون جزئیاتِ بیشتر دارد.","نه. اگر متغیرِ گروه‌بندی میانجی یا برخوردگر باشد، تفکیک می‌تواند سؤالِ غلط را جواب دهد یا سوگیری بسازد. جزئیاتِ بیشتر خودکار علّی‌تر نیست."],["نتیجهٔ کلی واقعی‌تر است چون سیاست روی کلِ جمعیت اعمال می‌شود.","گاهی، اما ترکیبِ گروه می‌تواند مقایسه را مخدوش کند. باید کمیتِ هدف—اثرِ کلی، اثرِ درون‌گروهی یا اثرِ استانداردشده—پیشاپیش تعیین شود."]],"confuse":[["پارادوکسِ سیمپسون و مخدوش‌گری","مخدوش‌گری یکی از ساختارهای علّیِ ایجادکنندهٔ وارونگی است؛ سیمپسون خودِ الگوی آماریِ وارونگی است."],["سوگیریِ تجمیع و خطای حساب","هیچ خطای حساب لازم نیست. نکته این است که هر دو خلاصه می‌توانند عددی درست باشند اما شرط‌گذاری متفاوت باشد."]],"mistakes":["انتخابِ سطحِ تجمیع پس از دیدنِ اینکه کدام نسخه از نتیجهٔ دلخواه حمایت می‌کند.","فرضِ اینکه تعدیلِ زیرگروه همیشه امن‌تر است بدون تعیینِ نقشِ علّیِ متغیرِ گروه‌بندی."],"check":{"q":"درمان برای مردان بهتر و برای زنان بهتر است اما در کل بدتر دیده می‌شود. پیش از اینکه بگویید کدام نتیجه مهم است چه باید بررسی کنید؟","a":"ترکیبِ گروه‌ها، نقشِ علّیِ جنس در تخصیص و پیامد، و کمیتِ هدف. خودِ وارونگی نمی‌گوید باید تجمیع یا تفکیک کنید."}}},"forking":{"en":{"line":"The garden of forking paths shows how many data-dependent but individually defensible analytic choices can inflate false positives even without conscious p-hacking.","why":"<p>Classical p-values assume the analysis rule was fixed independently of the realized data. In practice, researchers decide exclusions, transformations, outcomes, interactions, covariates, and stopping rules after seeing partial patterns. The chosen path may look innocent, but the counterfactual set of paths means the nominal error rate no longer describes the procedure actually used.</p>","origin":"Andrew Gelman and Eric Loken popularized the “garden of forking paths” to distinguish researcher degrees of freedom from deliberate multiple-testing misconduct. It is a structural argument for pre-specification, multiverse analysis, and transparency.","obj":[["If each choice is scientifically reasonable, there is no reason to penalize the analysis.","Reasonableness of each branch does not restore the advertised sampling distribution when the branch selected depends on the data. The inferential procedure includes the selection rule, not just the final regression."],["Pre-registration is too rigid for exploratory science.","Exploration is valuable; the solution is labeling and separation. Explore freely, then treat resulting hypotheses as generated rather than independently confirmed, or validate them on new data."]],"confuse":[["Forking paths vs. p-hacking","P-hacking usually implies intentional or at least goal-directed search for significance. Forking paths can occur in complete good faith through data-responsive decisions."],["Multiple comparisons vs. forking paths","Multiple-comparison corrections handle explicit families of tests; forking paths include implicit tests that were never run because choices depended on earlier observations."]],"mistakes":["Defending a result with “we only ran one final model” when many alternative models were implicitly available.","Treating preregistration as a ban on exploration rather than a way to distinguish exploration from confirmation."],"check":{"q":"You would have used a log transform if the raw outcome had looked more skewed, but it did not, so you report the raw analysis. Why can that still affect inference?","a":"Because the analysis rule depended on the observed data. The counterfactual branch is part of the procedure, so the nominal p-value for a fixed raw analysis does not fully describe the selection process."}},"fa":{"line":"«باغِ مسیرهای منشعب» نشان می‌دهد مجموعه‌ای از انتخاب‌های وابسته به داده که هر کدام جداگانه قابل‌دفاع‌اند می‌توانند بدون هیچ p-hacking عمدی نرخِ مثبتِ کاذب را بالا ببرند.","why":"<p>مقدارِ p کلاسیک فرض می‌کند قاعدهٔ تحلیل مستقل از دادهٔ مشاهده‌شده از قبل ثابت بوده است. در عمل پژوهشگر حذف، تبدیل، پیامد، تعامل، کنترل و توقف را با دیدنِ الگوها انتخاب می‌کند. مسیرِ نهایی شاید معقول باشد، اما مجموعهٔ مسیرهای خلاف‌واقعی یعنی نرخِ اسمی دیگر روشِ واقعی را توصیف نمی‌کند.</p>","origin":"اندرو گلمان و اریک لوکن اصطلاحِ «باغِ مسیرهای منشعب» را برای جداکردنِ آزادیِ تحلیلی از دستکاریِ عمدیِ آزمون‌ها مشهور کردند. استدلالی ساختاری به سودِ پیش‌ثبت، تحلیلِ چندجهانی و شفافیت است.","obj":[["اگر هر انتخاب علمی معقول است، چرا باید تحلیل جریمه شود؟","معقول‌بودنِ هر شاخه توزیعِ نمونه‌گیریِ اعلام‌شده را برنمی‌گرداند وقتی انتخابِ شاخه به داده وابسته است. روشِ استنتاج شامل قاعدهٔ انتخاب هم هست، نه فقط رگرسیونِ نهایی."],["پیش‌ثبت برای علمِ اکتشافی بیش‌ازحد سخت است.","اکتشاف ارزشمند است؛ راه‌حل برچسب‌گذاری و جداسازی است. آزادانه کشف کنید، اما فرضیهٔ حاصل را تولیدشده بدانید نه تأییدشده، یا روی دادهٔ تازه اعتبارسنجی کنید."]],"confuse":[["مسیرهای منشعب و p-hacking","p-hacking معمولاً جست‌وجوی هدفمند برای معناداری است؛ مسیرهای منشعب می‌تواند کاملاً با حسن‌نیت از تصمیم‌های پاسخ‌گو به داده ایجاد شود."],["چندآزمونی و مسیرهای منشعب","اصلاحِ چندآزمونی خانوادهٔ آزمون‌های صریح را می‌گیرد؛ مسیرهای منشعب آزمون‌های ضمنی‌ای را هم شامل می‌شود که اصلاً اجرا نشدند چون انتخاب‌ها به مشاهدهٔ قبلی وابسته بودند."]],"mistakes":["دفاع با «فقط یک مدلِ نهایی اجرا کردیم» وقتی مدل‌های جایگزین به‌صورتِ ضمنی در دسترس بودند.","فهمِ پیش‌ثبت به‌عنوان ممنوعیتِ اکتشاف به‌جای راهی برای جداکردنِ اکتشاف و تأیید."],"check":{"q":"اگر پیامد کج‌تر بود آن را لگاریتمی می‌کردید، اما چون نبود تحلیلِ خام را گزارش کردید. چرا همین تصمیمِ اجرا‌نشده هم ممکن است استنتاج را متاثر کند؟","a":"چون قاعدهٔ تحلیل به دادهٔ مشاهده‌شده وابسته بود. شاخهٔ خلاف‌واقعی بخشی از روش است و مقدارِ p برای تحلیلِ خامِ ازپیش‌ثابت کلِ فرایندِ انتخاب را توصیف نمی‌کند."}}},"pubbias":{"en":{"line":"Publication bias makes the visible literature a selected sample: positive, novel, and statistically significant findings are more likely to enter the record than null or messy results.","why":"<p>Even if every individual study is honestly run, selective visibility can make a weak or nonexistent effect look robust. The epistemic unit is therefore not just the published paper but the process deciding which completed studies become observable. File drawers, selective outcomes, and journal incentives distort apparent replication rates and effect sizes.</p>","origin":"Robert Rosenthal’s “file drawer problem” gave the classic label, though concerns about selective publication are older. Meta-research now studies publication bias with registered reports, trial registries, funnel plots, selection models, and other tools.","obj":[["Modern preregistration and registries have largely solved the problem.","They reduce it where compliance and coverage are strong, but selective analysis, outcome switching, nonpublication, and older literatures remain. Registered reports attack the incentive more directly by reviewing before results are known."],["Funnel-plot symmetry can detect publication bias, so adjustment is straightforward.","Funnel asymmetry has multiple causes and low power; statistical corrections rely on assumptions about selection. They are diagnostics and sensitivity tools, not magical recovery of missing studies."]],"confuse":[["Publication bias vs. p-hacking","Publication bias selects which results become visible; p-hacking changes the analysis to obtain favorable results. They can reinforce each other."],["Publication bias vs. survivorship bias","Publication bias is a domain-specific selection process in research communication; survivorship bias is the broader error of analyzing only units that remain observable."]],"mistakes":["Interpreting consistency among published studies without asking how many null studies were never seen.","Treating a meta-analysis as automatically unbiased merely because it combines many papers."],"check":{"q":"Twenty teams test an effect; two get p<0.05 and publish, eighteen null studies disappear. What does the published literature falsely suggest?","a":"A 100% visible success rate and inflated evidence for the effect, even though the pattern is exactly what chance could generate under selective publication."}},"fa":{"line":"سوگیریِ انتشار ادبیاتِ قابل‌مشاهده را به نمونه‌ای انتخاب‌شده تبدیل می‌کند: یافتهٔ مثبت، تازه و معنادارِ آماری احتمالِ بیشتری دارد واردِ سابقه شود تا نتیجهٔ صفر یا نامرتب.","why":"<p>حتی اگر تک‌تکِ پژوهش‌ها صادقانه اجرا شوند، انتخاب در دیده‌شدن می‌تواند اثرِ ضعیف یا صفر را قوی جلوه دهد. واحدِ معرفتی فقط مقالهٔ چاپ‌شده نیست، بلکه فرایندی است که تعیین می‌کند کدام مطالعهٔ کامل‌شده قابل‌مشاهده شود. کشوی فایل، انتخابِ پیامد و انگیزهٔ مجله نرخِ تکرار و اندازهٔ اثر را منحرف می‌کنند.</p>","origin":"رابرت روزنتال اصطلاحِ کلاسیکِ «مسئلهٔ کشوی فایل» را مشهور کرد، هرچند نگرانی قدیمی‌تر است. فراتحقیق امروز با گزارشِ ثبت‌شده، ثبتِ کارآزمایی، نمودارِ قیفی، مدلِ انتخاب و ابزارهای دیگر آن را بررسی می‌کند.","obj":[["پیش‌ثبت و رجیستریِ جدید مشکل را تا حد زیادی حل کرده‌اند.","جایی که پوشش و تبعیت قوی باشد کاهش می‌دهند، اما انتخابِ تحلیل، تغییرِ پیامد، عدمِ انتشار و ادبیاتِ قدیمی باقی است. گزارشِ ثبت‌شده انگیزه را پیش از دانستنِ نتیجه هدف می‌گیرد."],["عدمِ تقارنِ قیف سوگیری را تشخیص می‌دهد، پس اصلاح ساده است.","عدمِ تقارن علت‌های مختلف دارد و توانِ کمی دارد؛ اصلاح‌های آماری به فرضِ انتخاب وابسته‌اند. ابزارِ تشخیص و حساسیت‌اند، نه بازیابیِ جادوییِ مطالعاتِ گمشده."]],"confuse":[["سوگیریِ انتشار و p-hacking","انتشار تعیین می‌کند کدام نتیجه دیده شود؛ p-hacking تحلیل را برای نتیجهٔ مطلوب تغییر می‌دهد. می‌توانند همدیگر را تقویت کنند."],["سوگیریِ انتشار و سوگیریِ بقا","انتشار نوعی انتخابِ خاص در ارتباطِ علمی است؛ بقا مفهومِ گسترده‌ترِ تحلیلِ فقط واحدهای باقی‌مانده است."]],"mistakes":["دیدنِ سازگاریِ مقاله‌های منتشرشده بدون پرسش از تعدادِ نتایجِ صفرِ ناپدیدشده.","فرضِ اینکه فراتحلیل چون مقاله‌های زیادی را جمع کرده خودکار بی‌سوگیری است."],"check":{"q":"بیست تیم اثر را می‌آزمایند؛ دو تیم p<0.05 می‌گیرند و چاپ می‌کنند و هجده نتیجهٔ صفر ناپدید می‌شود. ادبیاتِ چاپ‌شده چه تصورِ کاذبی می‌سازد؟","a":"نرخِ موفقیتِ مشاهده‌شدهٔ ۱۰۰٪ و شاهدِ اغراق‌شده برای اثر، در حالی که همین الگو می‌تواند فقط از شانس و انتخابِ انتشار بیاید."}}},"pval":{"en":{"line":"A p-value is a tail-area probability of data under a specified null model; it is not the probability the null is true, the effect is real, or the result will replicate.","why":"<p>The most common statistical misreading reverses the conditioning. P(data or more extreme | null) is not P(null | data). A p-value also says nothing by itself about effect size, practical importance, study design, multiple analyses, or prior plausibility. The concept matters because precise language limits what a findings section is entitled to claim.</p>","origin":"P-values arise from Fisherian significance testing and were later mixed in practice with Neyman–Pearson decision procedures. The American Statistical Association’s 2016 statement emphasized widespread misinterpretations, but the underlying distinction is much older.","obj":[["In common settings, smaller p-values usually correspond to stronger evidence, so the technical warnings are pedantic.","Often there is a monotonic relation under a fixed model, but evidential strength also depends on alternative hypotheses, stopping rules, multiplicity, power, and prior plausibility. The warnings matter exactly when those conditions differ."],["P-values are so abused they should be banned.","Abuse is not proof of uselessness. They can summarize incompatibility with a null model under a defined procedure. The solution is to pair them with effect sizes, uncertainty, design, and explicit inferential goals."]],"confuse":[["p-value vs. posterior probability","A posterior directly conditions on observed data and requires priors/model alternatives; a p-value conditions on the null and evaluates hypothetical data extremeness."],["Statistical significance vs. substantive significance","A tiny effect can be statistically significant with enough data; a large important effect can be imprecisely estimated in a small sample."]],"mistakes":["Writing p=0.04 as “there is a 4% chance the null is true.”","Treating 0.049 and 0.051 as qualitatively different states of nature."],"check":{"q":"A result has p=0.04. What is the safest short interpretation?","a":"Under the specified null model and analysis procedure, data at least this extreme would occur with about 4% probability. It does not by itself give the probability the null is true or the effect will replicate."}},"fa":{"line":"مقدارِ p احتمالِ ناحیهٔ دنباله برای داده زیرِ مدلِ صفرِ مشخص است؛ احتمالِ صادق‌بودنِ فرضِ صفر، واقعی‌بودنِ اثر یا تکرارشدنِ نتیجه نیست.","why":"<p>رایج‌ترین بدخوانی شرط را برعکس می‌کند. P(داده یا افراطی‌تر | صفر) برابرِ P(صفر | داده) نیست. p همچنین به‌تنهایی اندازهٔ اثر، اهمیتِ عملی، طراحی، چندتحلیلی یا پیشین را نمی‌گوید. زبانِ دقیق تعیین می‌کند در بخشِ یافته‌ها چه ادعایی مجاز است.</p>","origin":"مقدارِ p از آزمونِ معناداریِ فیشر می‌آید و در عمل با روش‌های تصمیمِ نیمن–پیرسن ترکیب شد. بیانیهٔ ۲۰۱۶ انجمنِ آمارِ آمریکا سوءبرداشت‌های گسترده را برجسته کرد، اما تمایزِ منطقی قدیمی‌تر است.","obj":[["در عمل p کوچک‌تر معمولاً شاهدِ قوی‌تر است، پس این هشدارها وسواسی‌اند.","زیرِ مدلِ ثابت اغلب رابطه‌ای هست، اما قوّتِ شاهد به بدیل، توقف، چندگانگی، توان و پیشین هم وابسته است. هشدارها دقیقاً وقتی مهم‌اند که این شرایط فرق کنند."],["p آن‌قدر بد استفاده شده که باید حذف شود.","سوءاستفاده بی‌فایدگی را ثابت نمی‌کند. p می‌تواند ناسازگاری با مدلِ صفر را زیرِ رویهٔ معلوم خلاصه کند. باید با اندازهٔ اثر، عدمِ‌قطعیت، طراحی و هدفِ استنتاج همراه شود."]],"confuse":[["مقدارِ p و احتمالِ پسین","پسین مستقیماً بر داده شرط می‌کند و پیشین/بدیل می‌خواهد؛ p بر فرضِ صفر شرط می‌کند و افراطی‌بودنِ داده‌های فرضی را می‌سنجد."],["معناداریِ آماری و اهمیتِ substantive","اثرِ کوچک با دادهٔ زیاد می‌تواند معنادار شود و اثرِ مهم با نمونهٔ کوچک نامطمئن بماند."]],"mistakes":["نوشتنِ p=0.04 به‌صورتِ «۴٪ احتمال دارد فرضِ صفر درست باشد».","رفتار با 0.049 و 0.051 گویی دو وضعیتِ کیفیِ متفاوتِ جهان‌اند."],"check":{"q":"نتیجه p=0.04 دارد. کوتاه‌ترین تفسیرِ امن چیست؟","a":"زیرِ مدلِ صفر و رویهٔ تحلیلِ مشخص، داده‌ای به این اندازه یا افراطی‌تر حدود ۴٪ احتمال داشت. این احتمالِ صادق‌بودنِ صفر یا تکرارِ اثر را نمی‌دهد."}}},"repl":{"en":{"line":"The replication crisis is evidence that published literatures can systematically overstate reliability because incentives and analytic flexibility filter which findings become visible and stable.","why":"<p>Failure to reproduce famous results exposed a structural rather than merely individual problem. Low power, publication bias, flexible analysis, weak measurement, small samples, and novelty incentives can generate a literature where many “successful” papers are expected to fail independent repetition. Replication changes the prior on isolated claims and motivates institutional reform.</p>","origin":"The crisis became prominent through large replication projects in psychology and medicine, meta-research associated with figures such as John Ioannidis, Brian Nosek, Andrew Gelman, and earlier methodological warnings from Paul Meehl and others. It is not one event but a cluster of reliability problems.","obj":[["Failure to reproduce exactly does not mean the original result was false; context and heterogeneity matter.","Correct. Replication must distinguish direct reproduction from conceptual generalization, and failed replication can arise from genuine moderation. But unexplained fragility still weakens broad claims of robustness."],["Science is self-correcting, so the crisis demonstrates success rather than failure.","Both can be true. Detection and reform are self-correction; the scale of the problem shows that correction can be slow and that publication systems systematically generated overconfidence before correction."]],"confuse":[["Replication vs. reproducibility","Reproducibility often means obtaining the same result from the same data/code; replication usually means testing the claim with new data or a new study."],["Failed replication vs. falsification","A replication failure can implicate sampling, measurement, context, or analysis as well as the substantive hypothesis. It is evidence, not automatically a logically decisive refutation."]],"mistakes":["Treating every published result as equally suspect instead of using design quality, preregistration, sample size, and independent replication to update differentially.","Treating one failed replication as proof of fraud."],"check":{"q":"A surprising single-study finding has p=0.02 but no preregistration, low power, and no independent replication. How should the replication crisis affect your prior?","a":"It should materially lower confidence relative to the headline result. The relevant base rate includes selective publication and analytic flexibility; independent, well-powered replication should carry much more weight."}},"fa":{"line":"بحرانِ تکرار نشان می‌دهد ادبیاتِ چاپ‌شده می‌تواند نظام‌مند قابلیتِ اتکا را بیش‌برآورد کند، چون انگیزه و انعطافِ تحلیل تعیین می‌کنند کدام یافته دیده و پایدار می‌شود.","why":"<p>ناتوانی در بازتولیدِ نتایجِ مشهور مسئله‌ای ساختاری را آشکار کرد، نه فقط خطای فردی. توانِ کم، سوگیریِ انتشار، آزادیِ تحلیل، سنجشِ ضعیف، نمونهٔ کوچک و انگیزهٔ تازگی می‌توانند ادبیاتی بسازند که بسیاری از «موفقیت‌ها» در تکرارِ مستقل شکست بخورند. این بحران پیشینِ ما دربارهٔ یافتهٔ منفرد را عوض می‌کند.</p>","origin":"با پروژه‌های بزرگِ تکرار در روان‌شناسی و پزشکی و فراتحقیقِ چهره‌هایی چون جان یوانیدیس، برایان نوزک، اندرو گلمان و هشدارهای قدیمی‌ترِ پل میل برجسته شد. یک رویدادِ واحد نیست، بلکه خوشه‌ای از مشکلاتِ وثاقت است.","obj":[["شکستِ بازتولید دقیقاً یعنی نتیجهٔ اصلی کاذب نبود؛ زمینه و ناهمگنی مهم‌اند.","درست. باید تکرارِ مستقیم را از تعمیمِ مفهومی جدا کرد و تعدیلِ واقعی ممکن است وجود داشته باشد. اما شکنندگیِ توضیح‌نداده‌شده ادعای کلیِ استحکام را ضعیف می‌کند."],["علم خوداصلاح است، پس بحران موفقیتِ علم را نشان می‌دهد نه شکست را.","هر دو می‌توانند درست باشند. کشف و اصلاح خوداصلاحی است؛ مقیاسِ مشکل نشان می‌دهد اصلاح می‌تواند کند باشد و نظامِ انتشار پیش از اصلاح بیش‌اطمینانی تولید کند."]],"confuse":[["تکرار و بازتولیدپذیری","بازتولیدپذیری اغلب یعنی گرفتنِ همان نتیجه از همان داده/کد؛ تکرار یعنی آزمونِ ادعا با داده یا مطالعهٔ تازه."],["شکستِ تکرار و ابطال","شکست می‌تواند از نمونه، سنجش، زمینه یا تحلیل باشد و فقط فرضیهٔ substantive را هدف نگیرد. شاهد است، نه الزاماً ابطالِ منطقیِ یک‌ضرب."]],"mistakes":["یکسان مشکوک دانستنِ همهٔ مقالات به‌جای وزن‌دهی بر اساسِ طراحی، پیش‌ثبت، اندازهٔ نمونه و تکرارِ مستقل.","برداشتِ یک شکستِ تکرار به‌عنوان اثباتِ تقلب."],"check":{"q":"یافته‌ای شگفت‌آور p=0.02 دارد اما پیش‌ثبت نشده، توانِ کم و هیچ تکرارِ مستقلی ندارد. بحرانِ تکرار چه اثری بر پیشین شما دارد؟","a":"باید اعتماد را به‌طور معنادار پایین‌تر از تیتر نگه دارد. نرخِ پایه شامل انتخابِ انتشار و آزادیِ تحلیل است؛ تکرارِ مستقل و پرتوان باید وزنِ بسیار بیشتری بگیرد."}}},"reduct":{"en":{"line":"Reductionism about testimony says testimonial justification must be earned from independent evidence of reliability; anti-reductionism says testimony carries default entitlement unless defeated.","why":"<p>We cannot personally verify most of what we know, so testimony needs a default policy. Humean reductionism asks us to ground trust in observed reliability, analogy, and independent evidence. Reidian anti-reductionism argues that such evidence is impossible to obtain without already trusting testimony, so acceptance must begin as a defeasible entitlement.</p>","origin":"The contrast is often framed between David Hume’s reductionist treatment of testimony and Thomas Reid’s anti-reductionist principle of credulity. Contemporary social epistemology develops hybrid positions that distinguish global entitlement from local source assessment.","obj":[["Reductionism is circular because evidence of a speaker’s track record usually comes from more testimony.","That is the anti-reductionist challenge. Reductionists can appeal to direct observation and cross-checking, but a fully non-testimonial foundation is difficult for mature knowledge systems."],["Anti-reductionism is gullible: default trust lets misinformation spread cheaply.","Default entitlement is defeasible, not unconditional. Source incentives, contradiction, implausibility, domain mismatch, and reliability evidence can defeat trust. The key design question is where defeaters activate."]],"confuse":[["Reductionism vs. skepticism about testimony","Reductionists do not reject testimony; they require its warrant to reduce to non-testimonial or independently supported reasons."],["Anti-reductionism vs. blind trust","Anti-reductionism gives prima facie entitlement, not immunity from counterevidence or source evaluation."]],"mistakes":["Claiming an organization “verifies everything” when most verification itself relies on trusted secondhand inputs.","Treating default trust as a reason not to build audit triggers and defeaters."],"check":{"q":"You accept a new data vendor only after independently validating its historical accuracy. Which side does that procedure resemble?","a":"A reductionist posture: testimonial/data-source trust is earned by independent evidence of reliability rather than granted as the default."}},"fa":{"line":"تحویل‌گرایی دربارهٔ گواهی می‌گوید توجیهِ گواهی باید از شاهدِ مستقل دربارهٔ وثاقت به دست آید؛ ضدتحویل‌گرایی می‌گوید گواهی به‌طور پیش‌فرض حقِ پذیرش دارد مگر اینکه ابطال‌کننده‌ای پیدا شود.","why":"<p>بیشترِ دانسته‌ها را شخصاً راستی‌آزمایی نمی‌کنیم، پس به سیاستِ پیش‌فرض نیاز داریم. تحویل‌گراییِ هیومی اعتماد را بر کارنامه، قیاس و شاهدِ مستقل بنا می‌کند. ضدتحویل‌گراییِ ریدی می‌گوید همین شاهد هم بدون اتکا به گواهی قابل‌ساخت نیست، پس پذیرش باید از استحقاقی قابل‌ابطال شروع شود.</p>","origin":"تقابل معمولاً میانِ روایتِ تحویل‌گرای دیوید هیوم و اصلِ «باورپذیری» توماس رید صورت‌بندی می‌شود. معرفت‌شناسیِ اجتماعیِ معاصر دیدگاه‌های ترکیبی را توسعه داده که حقِ کلیِ اعتماد را از ارزیابیِ محلیِ منبع جدا می‌کنند.","obj":[["تحویل‌گرایی دوری است چون کارنامهٔ گوینده را هم معمولاً از گواهیِ دیگران می‌دانیم.","این چالشِ ضدتحویل‌گراست. تحویل‌گرا می‌تواند به مشاهدهٔ مستقیم و تطبیقِ مستقل تکیه کند، اما ساختنِ بنیادِ کاملاً بی‌گواهی برای نظامِ دانشیِ بالغ دشوار است."],["ضدتحویل‌گرایی ساده‌لوحانه است و اطلاعاتِ غلط را ارزان پخش می‌کند.","حقِ پیش‌فرض قابل‌ابطال است، نه بی‌قید. انگیزهٔ منبع، تناقض، نامعقولی، عدمِ تناسبِ حوزه و کارنامه می‌توانند اعتماد را شکست دهند. مسئلهٔ طراحی این است که ابطال‌کننده کجا فعال شود."]],"confuse":[["تحویل‌گرایی و شکاکیت دربارهٔ گواهی","تحویل‌گرا گواهی را رد نمی‌کند؛ می‌گوید ضمانتِ آن باید به دلیلِ غیردستاوردی یا مستقل تحویل شود."],["ضدتحویل‌گرایی و اعتمادِ کور","ضدتحویل‌گرایی حقِ اولیه می‌دهد، نه مصونیت از شاهدِ مخالف یا ارزیابیِ منبع."]],"mistakes":["ادعای اینکه سازمان «همه‌چیز را راستی‌آزمایی می‌کند» وقتی خودِ راستی‌آزمایی عمدتاً به ورودیِ دست‌دوم تکیه دارد.","برداشتِ اعتمادِ پیش‌فرض به‌عنوان دلیلِ نساختنِ محرک‌های بازرسی و ابطال‌کننده."],"check":{"q":"فروشندهٔ دادهٔ تازه را فقط پس از اعتبارسنجیِ مستقلِ دقتِ تاریخی‌اش می‌پذیرید. این رویه به کدام طرف نزدیک است؟","a":"به تحویل‌گرایی: اعتماد به منبع باید از شاهدِ مستقلِ وثاقت به دست آید، نه اینکه خودکار پیش‌فرض باشد."}}},"reid":{"en":{"line":"Reid’s default-trust view treats testimony as a basic social source of knowledge: humans are prima facie entitled to believe sincere testimony unless specific defeaters arise.","why":"<p>A child learns language and almost everything else by accepting others long before they can independently certify speaker reliability. Reid turns that developmental fact into an epistemic insight: if trust required prior evidence in every case, the evidence needed to establish reliability could never get started. Social knowledge therefore begins with defeasible credulity, not universal suspicion.</p>","origin":"Thomas Reid’s common-sense philosophy defended principles of veracity and credulity against a strongly reductionist picture. Contemporary anti-reductionism about testimony inherits the idea while usually adding more explicit accounts of defeaters and social reliability.","obj":[["Default trust is maladapted to modern misinformation environments where strategic deception is cheap.","That pressure affects how broad the entitlement should be. Reidian trust can be context-sensitive: environments with known adversarial incentives generate standing defeaters and justify stronger verification norms."],["Children’s credulity explains how belief develops but not why adult trust is justified.","Development alone is not enough. Anti-reductionists add a normative claim that testimony is a basic source analogous to perception, while critics demand an account of why its social dependence deserves the same status."]],"confuse":[["Default trust vs. equal trust","Prima facie entitlement does not require giving every speaker the same weight. Track record, expertise, incentives, and context can rationally differentiate credibility."],["Reidian trust vs. authority","Testimony can come from ordinary speakers; appeal to authority is a special case involving claimed expertise or status."]],"mistakes":["Treating the absence of a known defeater as proof that a source is highly reliable rather than merely not yet defeated.","Applying a default-trust norm unchanged in adversarial settings where incentives create standing reasons for caution."],"check":{"q":"Why is “verify every source before believing anything it says” difficult as a universal rule?","a":"Because the verification itself depends on prior testimony, language, records, and trusted methods. A Reidian view says some defeasible trust must be epistemically prior to the verification system."}},"fa":{"line":"دیدگاهِ اعتمادِ پیش‌فرضِ رید گواهی را منبعی پایه و اجتماعیِ معرفت می‌داند: در نبودِ ابطال‌کنندهٔ مشخص، انسان حقِ اولیه دارد گواهیِ صادقانه را بپذیرد.","why":"<p>کودک زبان و تقریباً همهٔ معرفتِ اولیه را با پذیرفتنِ دیگران یاد می‌گیرد، بسیار پیش از آنکه بتواند وثاقتِ گوینده را مستقلاً تأیید کند. رید از این واقعیت نتیجه‌ای معرفتی می‌گیرد: اگر اعتماد همیشه به شاهدِ قبلی نیاز داشت، خودِ شاهد برای آغازِ سنجشِ وثاقت هرگز ساخته نمی‌شد. معرفتِ اجتماعی با اعتمادِ قابل‌ابطال شروع می‌شود نه سوءظنِ جهان‌شمول.</p>","origin":"فلسفهٔ عقلِ سلیمِ توماس رید از اصولِ صداقت و باورپذیری در برابر تصویرِ شدیداً تحویل‌گرای گواهی دفاع کرد. ضدتحویل‌گراییِ معاصر این ایده را با نظریه‌های صریح‌تر دربارهٔ ابطال‌کننده و وثاقتِ اجتماعی ادامه می‌دهد.","obj":[["اعتمادِ پیش‌فرض در محیطِ مدرنِ اطلاعاتِ غلط که فریب ارزان است ناسازگار است.","این فشار دامنهٔ حقِ پیش‌فرض را محدود می‌کند. اعتمادِ ریدی می‌تواند زمینه‌حساس باشد: محیطِ دشمنانه با انگیزهٔ فریب، ابطال‌کنندهٔ ایستاده ایجاد می‌کند و هنجارِ راستی‌آزماییِ سخت‌تر را مجاز می‌سازد."],["ساده‌باوریِ کودک فقط رشدِ باور را توضیح می‌دهد، نه توجیهِ اعتمادِ بزرگسال را.","رشد به‌تنهایی کافی نیست. ضدتحویل‌گرا ادعای هنجاریِ اضافه می‌کند که گواهی منبعی پایه شبیه ادراک است؛ منتقد می‌خواهد بداند چرا وابستگیِ اجتماعی همان شأن را دارد."]],"confuse":[["اعتمادِ پیش‌فرض و اعتمادِ برابر","حقِ اولیه به معنای وزنِ یکسان برای همه نیست. کارنامه، تخصص، انگیزه و زمینه می‌تواند اعتبار را عقلانی متفاوت کند."],["اعتمادِ ریدی و مرجعیت","گواهی می‌تواند از گویندهٔ عادی بیاید؛ استناد به مرجع موردِ خاصی است که تخصص یا مقام را وارد می‌کند."]],"mistakes":["نبودِ ابطال‌کنندهٔ شناخته‌شده را اثباتِ وثاقتِ بالای منبع دانستن؛ فقط یعنی هنوز شکست نخورده است.","اعمالِ هنجارِ اعتمادِ پیش‌فرض بدون تغییر در محیطِ خصمانه‌ای که انگیزه‌ها دلیلِ دائمیِ احتیاط می‌سازند."],"check":{"q":"چرا «پیش از باور به هر حرفِ هر منبع، اول خودش را کاملاً راستی‌آزمایی کن» قاعدهٔ جهان‌شمولِ دشواری است؟","a":"چون خودِ راستی‌آزمایی به گواهیِ قبلی، زبان، سوابق و روش‌های مورداعتماد وابسته است. دیدگاهِ ریدی می‌گوید مقداری اعتمادِ قابل‌ابطال باید از نظر معرفتی پیش از نظامِ راستی‌آزمایی قرار گیرد."}}}};

/* ---------- state ---------- */
const NW=172,NH=48,XG=88,YG=16;
const parent={},expanded=new Set(["root"]);
let sel="root",tx=0,ty=0,sc=1,pos={};
for(const id in N)(N[id].c||[]).forEach(k=>{if(N[k])parent[k]=id;});

const world=document.getElementById("world"),wires=document.getElementById("wires"),view=document.getElementById("view");
const themeButton=document.getElementById("themebtn");
const themeMedia=matchMedia("(prefers-color-scheme: dark)");
let THEME_PREF=document.documentElement.dataset.themePreference||"system";

function applyTheme(preference,persist=true){
  if(!["system","light","dark"].includes(preference))preference="system";
  THEME_PREF=preference;
  const resolved=preference==="system"?(themeMedia.matches?"dark":"light"):preference;
  document.documentElement.dataset.theme=resolved;
  document.documentElement.dataset.themePreference=preference;
  document.querySelector('meta[name="theme-color"]').content=resolved==="dark"?"#081821":"#F6F3EC";
  const icon=preference==="system"?"◐":preference==="light"?"☀":"☾";
  const next=preference==="system"?"light":preference==="light"?"dark":"system";
  themeButton.querySelector("span").textContent=icon;
  themeButton.setAttribute("aria-label",`Theme: ${preference}. Activate for ${next} theme.`);
  themeButton.title=`Theme: ${preference} · next: ${next}`;
  if(persist){try{localStorage.setItem("epistemology-theme",preference);}catch(_){/* storage may be unavailable */}}
  if(Object.keys(pos).length)render();
}

themeButton.addEventListener("click",()=>{
  const choices=["system","light","dark"];
  applyTheme(choices[(choices.indexOf(THEME_PREF)+1)%choices.length]);
});
const followSystem=()=>{if(THEME_PREF==="system")applyTheme("system",false);};
if(themeMedia.addEventListener)themeMedia.addEventListener("change",followSystem);
else if(themeMedia.addListener)themeMedia.addListener(followSystem);
applyTheme(THEME_PREF,false);

function layout(){
  pos={};let cur=0;
  (function walk(id,d){
    const n=N[id],kids=(expanded.has(id)&&n.c)?n.c.filter(k=>N[k]):[];
    if(!kids.length){const y=cur++;pos[id]={d,y};return y;}
    const ys=kids.map(k=>walk(k,d+1));
    const y=(ys[0]+ys[ys.length-1])/2;pos[id]={d,y};return y;
  })("root",0);
}
const px=id=>({x:pos[id].d*(NW+XG),y:pos[id].y*(NH+YG)});
function routeOf(id){const r=[];let c=id;while(c){r.unshift(c);c=parent[c];}return r;}
function bounds(){let w=0,h=0;for(const id in pos){const p=px(id);w=Math.max(w,p.x+NW);h=Math.max(h,p.y+NH);}return{w,h};}
function collapse(id){expanded.delete(id);(N[id].c||[]).forEach(k=>{if(N[k])collapse(k);});}

function viewportBox(){
  const topEdge=Math.ceil(document.getElementById("top").getBoundingClientRect().bottom)+14;
  const side=innerWidth<640?14:28;
  const controlsReserve=innerWidth<640?48:64;
  const bottomReserve=innerWidth<640?72:28;
  const right=innerWidth-side-controlsReserve;
  const bottom=innerHeight-bottomReserve;
  return{
    left:side,
    top:topEdge,
    width:Math.max(120,right-side),
    height:Math.max(120,bottom-topEdge)
  };
}

function constrainToViewport(){
  const b=bounds(),v=viewportBox(),sw=b.w*sc,sh=b.h*sc;
  if(sw<=v.width)tx=v.left+(v.width-sw)/2;
  else tx=Math.min(v.left,Math.max(v.left+v.width-sw,tx));
  if(sh<=v.height)ty=v.top+(v.height-sh)/2;
  else ty=Math.min(v.top,Math.max(v.top+v.height-sh,ty));
}

function fitVisible(anim=true){
  const b=bounds(),v=viewportBox();
  const maxScale=innerWidth>=1200?1.32:1.12;
  sc=Math.min(maxScale,Math.max(.12,Math.min(v.width/Math.max(b.w,1),v.height/Math.max(b.h,1))));
  tx=v.left+(v.width-b.w*sc)/2;
  ty=v.top+(v.height-b.h*sc)/2;
  apply(anim);
}

function render(){
  layout();
  const route=new Set(routeOf(sel));
  const themeStyles=getComputedStyle(document.documentElement);
  const routeStroke=themeStyles.getPropertyValue("--brass").trim();
  const wireStroke=themeStyles.getPropertyValue("--rule").trim();
  world.querySelectorAll(".node").forEach(e=>e.remove());
  let ep="";
  for(const id in pos){
    const n=N[id],p=px(id);
    if(expanded.has(id)&&n.c)n.c.filter(k=>N[k]&&pos[k]).forEach(k=>{
      const q=px(k),x1=p.x+NW,y1=p.y+NH/2,x2=q.x,y2=q.y+NH/2,m=(x1+x2)/2;
      const on=route.has(id)&&route.has(k);
      ep+=`<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="${on?routeStroke:wireStroke}" stroke-width="${on?2:1.2}"/>`;
    });
    const kids=(n.c||[]).filter(k=>N[k]).length;
    const el=document.createElement("div");
    el.className="node"+(id===sel?" sel":route.has(id)?" route":"")+(expanded.has(id)?" open":"")+(id==="trilemma"?" key":"");
    el.style.left=p.x+"px";el.style.top=p.y+"px";
    el.innerHTML=`<button class="lab" type="button"><i></i></button><button class="info" type="button">i</button>`+
      (kids?`<div class="kids">${expanded.has(id)?"−":"+"}${kids}</div>`:"")+
      (R[id]?`<div class="full"></div>`:"");
    const labelButton=el.querySelector(".lab"),infoButton=el.querySelector(".info");
    labelButton.querySelector("i").textContent=title(id);
    labelButton.setAttribute("aria-label",kids
      ? `${title(id)}. ${expanded.has(id)?"Collapse":"Expand"} ${kids} subtopics.`
      : title(id));
    if(kids)labelButton.setAttribute("aria-expanded",expanded.has(id)?"true":"false");
    infoButton.setAttribute("aria-label",`Open full entry for ${title(id)}`);
    labelButton.addEventListener("click",()=>{
      sel=id;
      if(kids){expanded.has(id)?collapse(id):expanded.add(id);}
      render();focus(id);
    });
    infoButton.addEventListener("click",()=>openSheet(id));
    world.appendChild(el);
  }
  const b=bounds();
  wires.setAttribute("width",b.w+60);wires.setAttribute("height",b.h+60);
  wires.innerHTML=ep;
  crumbs();
}

function crumbs(){
  const c=document.getElementById("crumbs"),r=routeOf(sel);c.innerHTML="";
  r.forEach((id,i)=>{
    if(i){const s=document.createElement("span");s.className="crumb sep";s.textContent="›";c.appendChild(s);}
    const d=document.createElement("button");
    d.type="button";
    d.className="crumb"+(i===r.length-1?" on":"");
    d.textContent=LANG==="fa"?title(id):title(id).toUpperCase();
    d.addEventListener("click",()=>{sel=id;render();focus(id);});
    c.appendChild(d);
  });
  c.scrollLeft=LANG==="fa"?0:99999;
}

function focus(id){
  if(!pos[id])return;
  const p=px(id),v=viewportBox();
  const workingX=innerWidth<640?.32:.38;
  tx=v.left+v.width*workingX-(p.x+NW/2)*sc;
  ty=v.top+v.height/2-(p.y+NH/2)*sc;
  constrainToViewport();
  apply(true);
}
function apply(anim){
  world.style.transition=anim?"transform .32s cubic-bezier(.2,.8,.3,1)":"none";
  world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
}

/* ---------- pan / zoom ---------- */
let drag=false,lx=0,ly=0,pd=0;
view.addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag=true;lx=e.clientX;ly=e.clientY;view.classList.add("drag");});
view.addEventListener("pointermove",e=>{if(!drag)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply(false);});
["pointerup","pointercancel","pointerleave"].forEach(t=>view.addEventListener(t,()=>{drag=false;view.classList.remove("drag");}));
view.addEventListener("touchmove",e=>{
  if(e.touches.length!==2)return;e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pd){sc=Math.min(1.7,Math.max(.25,sc*(d/pd)));apply(false);}pd=d;
},{passive:false});
view.addEventListener("touchend",()=>{pd=0;});
view.addEventListener("wheel",e=>{e.preventDefault();sc=Math.min(1.7,Math.max(.25,sc*(e.deltaY<0?1.1:.9)));apply(false);},{passive:false});

document.getElementById("zin").onclick=()=>{sc=Math.min(1.7,sc*1.22);apply(true);};
document.getElementById("zout").onclick=()=>{sc=Math.max(.25,sc/1.22);apply(true);};
document.getElementById("fit").onclick=()=>fitVisible(true);
document.getElementById("rst").onclick=()=>{expanded.clear();expanded.add("root");sel="root";render();fitVisible(true);};

let resizeTimer=0;
addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>fitVisible(false),90);
});

/* ---------- the card ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let openId=null;

function sec(cls,head,inner){return `<div class="blk ${cls||""}"><div class="h">${head}</div>${inner}</div>`;}

function learnLinks(n){
  const q=encodeURIComponent(n.q||n.t);
  const sepUrl="https://plato.stanford.edu/search/searcher.py?query="+q;
  const wikiUrl=LANG==="fa"
    ? "https://fa.wikipedia.org/w/index.php?search="+encodeURIComponent(n.tf||n.t)
    : "https://en.wikipedia.org/w/index.php?search="+q;
  return `<div class="learn"><div class="h">${T("learn")}</div>`+
    `<a href="${sepUrl}" target="_blank" rel="noopener"><b>${T("sep")} ↗</b>${T("sepS")}</a>`+
    `<a href="${wikiUrl}" target="_blank" rel="noopener"><b>${T("wiki")} ↗</b>${T("wikiS")}</a></div>`;
}

function openSheet(id){
  openId=id;const n=N[id];sel=id;render();
  const r=R[id]?R[id][LANG]:null;
  const path=routeOf(id).slice(0,-1).map(x=>title(x)).join(" › ");
  document.getElementById("s-kick").innerHTML=
    `<span class="badge ${r?"fullb":""}">${r?T("full"):T("brief")}</span> `+
    (path?(LANG==="fa"?path:path.toUpperCase()):T("root"));
  document.getElementById("s-title").textContent=title(id);
  document.getElementById("s-who").textContent=n.w?"— "+n.w:"";

  const body=LANG==="fa"?n.fa:n.en, ex=LANG==="fa"?n.xf:n.xe,
        ap=LANG==="fa"?n.pf:n.pe, ob=LANG==="fa"?n.of:n.oe;
  let h="";

  if(r){
    h+=`<div class="oneline">${r.line}</div>`;
    if(r.why)h+=sec("","<span>1</span>"+T("why"),r.why);
    h+=sec("","<span>2</span>"+T("idea"),r.idea||body||"");
    if(r.origin)h+=sec("origin","<span>3</span>"+T("origin"),`<p>${r.origin}</p>`);
    if(ex)h+=sec("","<span>4</span>"+T("ex"),`<p>${ex}</p>`);
    if(r.obj&&r.obj.length){
      const inner=r.obj.map(([o,rep])=>
        `<div class="qa"><p class="oq"><em>${T("objL")}.</em> ${o}</p><p class="ar"><em>${T("repL")}.</em> ${rep}</p></div>`).join("");
      h+=sec("obj","<span>5</span>"+T("obj"),inner);
    }
    if(r.confuse&&r.confuse.length){
      const inner=r.confuse.map(([a,b])=>`<div class="pair"><p class="pt">${a}</p><p>${b}</p></div>`).join("");
      h+=sec("","<span>6</span>"+T("confuse"),inner);
    }
    if(r.mistakes&&r.mistakes.length){
      h+=sec("mist","<span>7</span>"+T("mist"),"<ul>"+r.mistakes.map(m=>`<li>${m}</li>`).join("")+"</ul>");
    }
    if(ap)h+=sec("app","<span>8</span>"+T("app"),`<p>${ap}</p>`);
    if(r.check){
      h+=sec("check","<span>9</span>"+T("check"),
        `<p class="cq">${r.check.q}</p><button class="reveal" id="rvl">${T("show")}</button><div class="ans" id="ans"><p>${r.check.a}</p></div>`);
    }
  }else{
    h+=sec("",T("def"),body||"");
    if(ex)h+=sec("",T("ex"),`<p>${ex}</p>`);
    if(ap)h+=sec("app",T("app"),`<p>${ap}</p>`);
    if(ob)h+=sec("obj",T("obj"),`<p>${ob}</p>`);
  }

  const kids=(n.c||[]).filter(k=>N[k]);
  if(kids.length)h+=sec("",T("deeper")+" — "+kids.length,
    `<div class="chips">`+kids.map(k=>`<span class="chip kid" data-go="${k}">${title(k)} →</span>`).join("")+`</div>`);
  const lk=(n.k||[]).filter(k=>N[k]);
  if(lk.length)h+=sec("",T("links"),
    `<div class="chips">`+lk.map(k=>`<span class="chip" data-go="${k}">↗ ${title(k)}</span>`).join("")+`</div>`);
  h+=learnLinks(n);

  const b=document.getElementById("s-body");b.innerHTML=h;b.scrollTop=0;
  b.querySelectorAll("[data-go]").forEach(c=>c.addEventListener("click",()=>reveal(c.dataset.go)));
  const rv=document.getElementById("rvl");
  if(rv)rv.addEventListener("click",()=>{
    const a=document.getElementById("ans");
    const on=a.classList.toggle("on");
    rv.textContent=on?T("hide"):T("show");
  });
  sheet.classList.add("on");scrim.classList.add("on");
}
function closeSheet(){sheet.classList.remove("on");scrim.classList.remove("on");openId=null;}
document.getElementById("close").onclick=closeSheet;scrim.onclick=closeSheet;
function reveal(id){let c=parent[id];while(c){expanded.add(c);c=parent[c];}sel=id;render();focus(id);openSheet(id);}

/* ---------- language: segmented control, no toggling ---------- */
function setLang(next){
  if(next!=="en"&&next!=="fa")return;
  LANG=next;
  document.documentElement.lang=LANG;
  document.body.classList.toggle("fa",LANG==="fa");
  document.querySelectorAll("[data-lang]").forEach(b=>{
    const on=b.dataset.lang===LANG;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  document.getElementById("hint").innerHTML=T("hint");
  document.getElementById("q").placeholder=T("find");
  render();
  requestAnimationFrame(()=>fitVisible(false));
  if(openId)openSheet(openId);
  const f=document.getElementById("find");
  if(f.classList.contains("on"))list(document.getElementById("q").value.toLowerCase());
}
document.querySelectorAll("[data-lang]").forEach(b=>
  b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* ---------- search ---------- */
const find=document.getElementById("find"),q=document.getElementById("q"),res=document.getElementById("res");
document.getElementById("searchbtn").onclick=()=>{find.classList.add("on");q.value="";list("");q.focus();};
find.addEventListener("click",e=>{if(e.target===find)find.classList.remove("on");});
q.addEventListener("input",()=>list(q.value.toLowerCase()));
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(find.classList.contains("on")){find.classList.remove("on");document.getElementById("searchbtn").focus();return;}
  if(sheet.classList.contains("on")){closeSheet();document.querySelector(".node.sel .info")?.focus();}
});
function hay(id){const n=N[id];return[n.t,n.tf,n.w,n.q,n.en,n.fa].filter(Boolean).join(" ").toLowerCase();}
function list(s){
  const hits=Object.keys(N).filter(id=>id!=="root"&&(!s||hay(id).includes(s))).slice(0,80);
  res.innerHTML=hits.length
    ? hits.map(id=>{const p=routeOf(id).slice(0,-1).map(x=>title(x)).join(" › ");
        return `<button type="button" class="hit" data-go="${id}"><b>${R[id]?"● ":""}${title(id)}</b><small>${LANG==="fa"?p:p.toUpperCase()}</small></button>`;}).join("")
    : `<div class="hit"><b>${T("none")}</b></div>`;
  res.querySelectorAll("[data-go]").forEach(h=>h.addEventListener("click",()=>{find.classList.remove("on");reveal(h.dataset.go);}));
}

setLang("en");
setTimeout(()=>{document.getElementById("hint").style.opacity=".3";},7000);
</script>

#themebtn span{font-size:17px;line-height:1}

  font-family:var(--mono);font-size:10.5px;cursor:pointer}
.hbtns #sheetlang button+button{border-left:1px solid var(--rule)}

  padding:2px 5px;color:var(--dim)}

  font-family:var(--disp);font-size:16.5px;line-height:1.42;color:var(--paper)}

.blk .h span{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;

.qa{border-left:2px solid var(--rule);padding-left:13px;margin-bottom:15px}

  text-transform:uppercase;color:var(--dim);margin-right:5px}
body.fa .qa em{font-family:var(--fa);letter-spacing:0;font-size:11.5px;margin-right:0;margin-left:5px}
.blk.obj{border-left:none;padding-left:0}
body.fa .blk.obj{border-right:none;padding-right:0}
.pair{margin-bottom:13px}
.pair:last-child{margin-bottom:0}
.pair .pt{font-family:var(--disp);color:var(--cyan);font-size:14.5px;margin-bottom:3px}
body.fa .pair .pt{font-family:var(--fa)}
.blk.mist ul{margin:0;padding-left:19px}
body.fa .blk.mist ul{padding-left:0;padding-right:19px}
.blk.mist li{font-size:15px;line-height:1.55;margin-bottom:8px;color:var(--paper)}
body.fa .blk.mist li{font-family:var(--fa);line-height:1.95}
.blk.check{border:1px solid var(--cyan);padding:14px 15px}
.blk.check .h{color:var(--cyan)}
.cq{font-family:var(--disp);font-size:15.5px;line-height:1.45;margin-bottom:12px!important}
body.fa .cq{font-family:var(--fa);line-height:1.9}
.reveal{background:var(--panel2);border:1px solid var(--cyan);color:var(--cyan);
  font-family:var(--mono);font-size:11px;padding:8px 13px;cursor:pointer}
body.fa .reveal{font-family:var(--fa);font-size:12.5px}
.ans{display:none;margin-top:13px;border-top:1px solid var(--rule);padding-top:12px}
.ans.on{display:block}
.learn .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--dim);margin-bottom:8px}

.hit{width:100%;color:var(--paper);text-align:left;font-family:var(--body)}

@media(max-width:430px){
  .brand span{display:none}
  .brow{gap:6px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
