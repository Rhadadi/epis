erative standard for correctly attributing knowledge rose because the cost and error possibilities became salient. The underlying evidence can remain exactly the same."}},"fa":{"line":"زمینه‌گرایی می‌گوید شرایطِ صدقِ «س می‌داند p» با زمینهٔ گفت‌وگو تغییر می‌کند چون معیارِ معرفتیِ مربوط می‌تواند بالا یا پایین برود.","why":"<p>زندگیِ عادی و فلسفهٔ شکاکانه دو حکمِ متضاد اما شهودی می‌دهند. در زمینهٔ روزمره «می‌دانم بانک شنبه باز است» مشکلی ندارد؛ وقتی خطای پرهزینه یا امکانِ شکاکانه برجسته می‌شود همان شاهد ناکافی به نظر می‌رسد. زمینه‌گرایی هر دو را توضیح می‌دهد بی‌آنکه بگوید شاهدِ فاعل عوض شده است.</p>","origin":"کیت دروز، دیوید لوئیس و استوارت کوهن از زمینه‌گرایانِ اصلی‌اند. دیدگاه معناشناختی است: واژهٔ «دانستن» مانند اصطلاحی زمینه‌حساس عمل می‌کند که معیارش با برجستگی، مخاطره و هدفِ گفت‌وگو تغییر می‌کند. هدف حفظِ معرفتِ عادی و انسداد همراه با توضیحِ فشارِ شکاکانه است.","obj":[["زمینه‌گرایی موضوع را عوض می‌کند: شکاک می‌پرسد آیا می‌دانیم، اما زمینه‌گرا پاسخ می‌دهد واژهٔ «دانستن» چگونه به کار می‌رود.","زمینه‌گرا می‌گوید تناقضِ ظاهری میان حکمِ روزمره و شکاکانه خودش داده‌ای زبانی است که توضیح می‌خواهد. منتقد همچنان می‌تواند اصرار کند رابطهٔ معرفتیِ ثابت و عمیق‌تری ورای معناشناسی مهم است."],["اگر معیار خیلی آسان تغییر کند، نسبت‌های معرفت ناپایدار یا قابل‌دستکاری می‌شوند و صرفاً با گفتنِ امکان‌های دور می‌توان معرفت را نابود کرد.","«قواعدِ توجه» لوئیس بخشی از این را می‌پذیرد: توجه به امکانِ خطا می‌تواند آن را مرتبط کند. چالش این است که برجستگیِ بلاغی نتواند دلبخواهی معرفت را از بین ببرد؛ نسخه‌های دقیق‌تر میان برجستگیِ معقول و بازیِ لفظی فرق می‌گذارند."]],"confuse":[["زمینه‌گرایی و ثابت‌گراییِ حساس به فاعل","زمینه‌گرایی زمینهٔ گفت‌وگوی ارزیاب را بر معنا یا معیارِ «می‌داند» مؤثر می‌کند. دیدگاه‌های حساس به فاعل، مخاطراتِ خودِ فاعل را در اینکه آیا می‌داند دخیل می‌کنند."],["زمینه‌گرایی و نسبی‌گرایی","زمینه‌گرایی لازم نیست حقیقت را نسبی بداند؛ می‌گوید شرایطِ صدقِ نسبتِ معرفتِ زمینه‌حساس تغییر می‌کند."]],"mistakes":["گفتنِ اینکه خودِ شاهد عوض شده وقتی فقط مخاطرهٔ گفت‌وگو یا بدیل‌های برجسته تغییر کرده‌اند.","استفاده از زمینه‌گرایی برای «زمینه‌ای» نامیدنِ هر معیارِ ناراحت‌کننده بدون توضیحِ محرکِ زبانی یا معرفتی."],"check":{"q":"سرِ ناهار می‌گویید «می‌دانم بانک فردا باز است». بعد می‌فهمید از دست‌دادنِ مراجعه مهلتِ توقیفِ خانه را فعال می‌کند و مردد می‌شوید. زمینه‌گرایی چه چیزی را تغییرکرده می‌داند؟","a":"معیارِ عملی برای نسبت‌دادنِ صحیحِ معرفت بالا رفته چون هزینه و امکان‌های خطا برجسته شده‌اند. شاهدِ زیربنایی می‌تواند دقیقاً همان مانده باشد."}}},"cartes":{"en":{"line":"Cartesian skepticism uses methodical doubt to strip away every belief vulnerable to deception until only what survives radical doubt can serve as a foundation.","why":"<p>The Cartesian project asks whether certainty can be rebuilt after granting the strongest skeptical possibilities. Doubt the senses, dreaming, even mathematics under an evil deceiver; if a belief survives that procedure, it has a special claim to foundational status.</p>","origin":"René Descartes made the method famous in the <i>Meditations</i>; al-Ghazālī had pursued a strikingly similar program centuries earlier. Descartes’ cogito—roughly, the occurrence of thinking guarantees the thinker’s existence in that act—functions as the first indubitable point from which reconstruction begins.","obj":[["Methodological doubt sets an unrealistically high standard: ordinary knowledge does not require certainty against every deception scenario.","That is the dominant fallibilist response. Descartes is not describing ordinary standards but searching for an Archimedean foundation. The critic must then explain why lesser, defeasible standards are sufficient for knowledge."],["The cogito may establish that thinking occurs, but not the rich, persisting self Descartes needs for reconstruction.","This narrows rather than destroys the first certainty. Contemporary readings often treat the minimal secure content as 'there is thinking' or 'I exist while thinking,' leaving substantial metaphysical work still to be done."]],"confuse":[["Cartesian and Pyrrhonian skepticism","Cartesian doubt is instrumental: doubt is used to find certainty and rebuild knowledge. Pyrrhonism aims at suspension of judgment rather than a final foundation."],["Methodological doubt and actual disbelief","Descartes need not sincerely believe every skeptical hypothesis. The method provisionally withholds assent to test which beliefs can survive."]],"mistakes":["Treating the evil demon as Descartes’ final worldview rather than a device in a reconstruction project.","Assuming the cogito proves the external world; it establishes a minimal first-person certainty, after which further arguments are required."],"check":{"q":"Why is “I am now thinking” harder for the Cartesian skeptic to doubt than “there is a table in front of me”?","a":"A deceiver could cause the table experience without a table, but the very occurrence of being deceived or doubting is itself a thinking event. The attempt to doubt it instantiates what is being asserted."}},"fa":{"line":"شکاکیتِ دکارتی از شکِ روش‌مند استفاده می‌کند تا هر باوری را که در معرضِ فریب است کنار بزند و فقط آنچه از شکِ رادیکال جان به در می‌برد به‌عنوان بنیاد بماند.","why":"<p>پروژهٔ دکارتی می‌پرسد آیا پس از پذیرفتنِ قوی‌ترین امکان‌های شکاکانه می‌توان یقین را دوباره ساخت. به حواس، رؤیا و حتی ریاضیات زیرِ فرضِ فریبکارِ شرور شک کن؛ اگر باوری از این فرایند جان به در ببرد ادعای ویژه‌ای برای شأنِ بنیادین دارد.</p>","origin":"رنه دکارت روش را در <i>تأملات</i> مشهور کرد؛ غزالی قرن‌ها پیش برنامه‌ای شگفت‌آور شبیه را دنبال کرده بود. کوگیتوی دکارت — تقریباً اینکه وقوعِ فکر وجودِ فاعلِ آن را در همان عمل تضمین می‌کند — نخستین نقطهٔ تردیدناپذیر برای آغازِ بازسازی است.","obj":[["شکِ روش‌مند معیارِ غیرواقعی و بسیار بالایی می‌گذارد؛ معرفتِ عادی یقین در برابر هر سناریوی فریب را نمی‌خواهد.","این پاسخِ غالبِ خطاپذیر است. دکارت معیارِ روزمره را توصیف نمی‌کند بلکه به‌دنبالِ بنیادِ ارشمیدسی است. منتقد سپس باید توضیح دهد چرا معیارهای ضعیف‌تر و قابل‌ابطال برای معرفت کافی‌اند."],["کوگیتو شاید فقط وقوعِ فکر را ثابت کند، نه خودِ غنی و پایداری را که دکارت برای بازسازی می‌خواهد.","این اعتراض نخستین یقین را محدود می‌کند نه نابود. خوانش‌های معاصر غالباً محتوای امن را «فکر وجود دارد» یا «تا وقتی فکر می‌کنم وجود دارم» می‌دانند و کارِ متافیزیکیِ زیادی را برای بعد باقی می‌گذارند."]],"confuse":[["شکاکیتِ دکارتی و پیرونی","شکِ دکارتی ابزاری است: از شک برای یافتنِ یقین و بازسازیِ معرفت استفاده می‌شود. پیرونی هدفش تعلیقِ حکم است، نه بنیادِ نهایی."],["شکِ روش‌مند و ناباوریِ واقعی","دکارت لازم نیست واقعاً همهٔ فرضیه‌های شکاکانه را باور کند. روش به‌طور موقت تصدیق را تعلیق می‌کند تا ببیند کدام باورها دوام می‌آورند."]],"mistakes":["فهمِ دیوِ فریبکار به‌عنوان جهان‌بینیِ نهاییِ دکارت، نه ابزارِ یک پروژهٔ بازسازی.","فرض‌کردنِ اینکه کوگیتو جهانِ بیرونی را ثابت می‌کند؛ فقط یقینِ حداقلیِ اول‌شخص می‌دهد و استدلال‌های بعدی لازم‌اند."],"check":{"q":"چرا «اکنون در حالِ فکرکردنم» برای شکاکِ دکارتی سخت‌تر از «میزی جلوی من است» قابل‌شک است؟","a":"فریبکار می‌تواند تجربهٔ میز را بدون میز بسازد، اما خودِ وقوعِ فریب یا شک یک رویدادِ فکری است. تلاش برای شک‌کردن همان چیزی را محقق می‌کند که گزاره می‌گوید."}}},"cred":{"en":{"line":"Credences represent graded belief—how confident you are that a proposition is true—rather than forcing every epistemic state into belief or disbelief.","why":"<p>Most real uncertainty is not binary. You may regard rain tomorrow as 40% likely without either believing or disbelieving it outright. Formal epistemology uses credences to model partial belief, connect evidence to decision, and make calibration and updating mathematically assessable.</p>","origin":"Frank Ramsey and later Bayesian traditions link degrees of belief to betting behavior and rational choice. Credences are typically constrained by probability axioms, though philosophers dispute whether every rational uncertainty must be representable by one precise probability.","obj":[["Human confidence is often vague or interval-valued, so a single precise number creates false precision.","Imprecise-probability approaches allow ranges or sets of credences. The core insight survives: uncertainty has gradations and should not be forced into binary belief when the evidence does not support that precision."],["Behavioral betting odds can reflect risk aversion or utility, not belief alone.","Ramsey-style representation separates utility from probability through a larger decision model. In practice, eliciting credences still requires care because stated probabilities can mix belief, incentives, and communication strategy."]],"confuse":[["Credence and frequency","A 70% credence is a degree of belief in a proposition. A 70% frequency is a long-run or population rate. They can inform one another but are not the same object."],["Credence and confidence interval","A confidence interval is a frequentist procedure with coverage properties; it is not automatically a probability distribution over the parameter."]],"mistakes":["Using precise percentages when your evidence only supports a broad range.","Treating a 70% credence as a claim that 70% of some literal class of worlds must contain the event."],"check":{"q":"You say “I don’t believe the policy will pass, but I’d put it at 45%.” Is that incoherent?","a":"No. Binary belief and credence are different representations. You can withhold outright belief while assigning a substantial probability that guides decisions."}},"fa":{"line":"درجهٔ باور میزانِ اطمینان به صدقِ گزاره را نمایش می‌دهد و مجبورمان نمی‌کند هر حالتِ معرفتی را به «باور» یا «ناباوری» دوگانه تبدیل کنیم.","why":"<p>بیشترِ عدمِ‌قطعیتِ واقعی دوگانه نیست. ممکن است بارانِ فردا را ۴۰٪ محتمل بدانید بی‌آنکه صریحاً آن را باور یا انکار کنید. معرفت‌شناسیِ صوری با درجاتِ باور، باورِ جزئی را مدل می‌کند، شاهد را به تصمیم وصل می‌کند و کالیبراسیون و به‌روزرسانی را قابل‌سنجش می‌سازد.</p>","origin":"فرانک رمزی و سنت‌های بعدیِ بیزی درجاتِ باور را به رفتارِ شرط‌بندی و انتخابِ عقلانی پیوند می‌دهند. معمولاً درجاتِ باور با اصولِ احتمال مقید می‌شوند، هرچند اختلاف است که آیا هر عدمِ‌قطعیتِ عقلانی باید با یک احتمالِ دقیق نمایش داده شود.","obj":[["اطمینانِ انسانی اغلب مبهم یا بازه‌ای است؛ یک عددِ دقیق دقتِ کاذب می‌سازد.","رویکردهای احتمالِ نادقیق بازه یا مجموعه‌ای از درجاتِ باور را مجاز می‌کنند. بینشِ اصلی باقی است: عدمِ‌قطعیت درجه دارد و وقتی شاهد دقتِ کافی نمی‌دهد نباید به باورِ دوگانه فشرده شود."],["نرخِ شرط‌بندیِ رفتاری می‌تواند ریسک‌گریزی یا مطلوبیت را نشان دهد، نه فقط باور را.","مدلِ رمزی احتمال را در چارچوبِ بزرگ‌ترِ تصمیم از مطلوبیت جدا می‌کند. در عمل استخراجِ درجاتِ باور هنوز دشوار است چون عددِ اعلام‌شده می‌تواند باور، انگیزه و راهبردِ ارتباطی را مخلوط کند."]],"confuse":[["درجهٔ باور و فراوانی","درجهٔ ۷۰٪ میزانِ باور به یک گزاره است؛ فراوانیِ ۷۰٪ نرخِ بلندمدت یا جمعیتی است. می‌توانند به هم اطلاعات بدهند اما یک چیز نیستند."],["درجهٔ باور و فاصلهٔ اطمینان","فاصلهٔ اطمینان رویه‌ای فراوانی‌گرا با خاصیتِ پوشش است؛ خودکار توزیعِ احتمال روی پارامتر نیست."]],"mistakes":["استفاده از درصدهای دقیق وقتی شواهد فقط بازه‌ای گسترده را پشتیبانی می‌کنند.","فهمِ درجهٔ باورِ ۷۰٪ به‌عنوان ادعایی که ۷۰٪ از طبقه‌ای واقعی از جهان‌ها حتماً رویداد را دارند."],"check":{"q":"می‌گویید «باور ندارم سیاست تصویب شود، اما احتمال را ۴۵٪ می‌گذارم.» آیا ناسازگار است؟","a":"نه. باورِ دوگانه و درجهٔ باور دو نمایشِ متفاوت‌اند. می‌توانید از باورِ صریح خودداری کنید و هم‌زمان احتمالِ قابل‌توجهی بدهید که تصمیم را راهنمایی کند."}}},"priors":{"en":{"line":"The problem of priors asks what rationally constrains your starting probabilities before the current evidence is incorporated.","why":"<p>Bayes’ theorem tells you exactly how to update from a prior, but it does not by itself tell you which prior to start with. Two coherent analysts can process the same likelihood and reach different posteriors because their initial odds differ. The formal rule therefore relocates rather than eliminates a foundational problem.</p>","origin":"Subjective Bayesian traditions descend from Ramsey, de Finetti, and Savage; attempts at objective or reference priors include work associated with Jaynes and others. The syllabus rightly treats the issue as the Münchhausen trilemma in probabilistic form: priors must be justified by earlier priors, conventions, symmetry principles, or a stopping point.","obj":[["If priors are subjective, Bayesian inference seems able to rationalize any conclusion.","Coherence alone permits wide initial disagreement, but sufficiently diagnostic repeated evidence can drive many reasonable priors toward convergence. Defenders also demand transparency and sensitivity analysis. Extreme dogmatic priors remain a real problem because they may resist evidence."],["Objective priors based on symmetry or maximum entropy just hide assumptions inside a supposedly neutral rule.","Yes; no parameterization is automatically innocent. Objective Bayesians defend such priors as principled default conventions for specific information states, not assumption-free truth. Sensitivity to alternative priors is therefore crucial."]],"confuse":[["Prior probability and base rate","A base rate is empirical frequency information that often informs a prior. A prior is the whole pre-evidence probability assignment and can include more than base rates."],["Prior and bias","A prior is not automatically a cognitive bias. Every Bayesian update needs a starting distribution; the epistemic question is whether it is defensible and whether conclusions are robust to alternatives."]],"mistakes":["Presenting a posterior as if the data alone produced it while hiding the prior.","Calling a convenient flat prior 'uninformative' without checking whether flatness changes under reparameterization."],"check":{"q":"Two analysts use the same data and likelihood but report 20% and 70% posterior probabilities. What is the first diagnostic question?","a":"Ask for their priors—and then for prior sensitivity. Bayes does not make disagreement mysterious: posterior differences can be decomposed into starting odds and evidential likelihood ratios."}},"fa":{"line":"مسئلهٔ پیشین‌ها می‌پرسد پیش از واردکردنِ شاهدِ فعلی چه چیزی احتمالاتِ آغازینِ شما را عقلانیاً محدود می‌کند.","why":"<p>قضیهٔ بیز دقیقاً می‌گوید از یک پیشین چگونه به‌روزرسانی کنید، اما خودش نمی‌گوید از کدام پیشین شروع کنید. دو تحلیلگرِ سازگار می‌توانند همان درست‌نمایی را پردازش کنند و چون شانسِ آغازین متفاوت است پسین‌های متفاوت بگیرند. پس قاعدهٔ صوری مسئلهٔ بنیادین را حذف نمی‌کند، فقط جابه‌جا می‌کند.</p>","origin":"سنت‌های بیزیِ ذهنی از رمزی، دِفینتی و ساویج می‌آیند؛ تلاش برای پیشین‌های عینی یا مرجع با کارهایی مانند جینز پیوند دارد. در برنامهٔ شما مسئله درست به‌عنوان سه‌راهیِ مونش‌هاوزن در لباسِ احتمال دیده می‌شود: پیشین یا با پیشین‌های قبلی، قرارداد، اصلِ تقارن یا یک توقف توجیه می‌شود.","obj":[["اگر پیشین‌ها ذهنی‌اند، استنتاجِ بیزی می‌تواند هر نتیجه‌ای را عقلانی جلوه دهد.","سازگاری به‌تنهایی اختلافِ آغازینِ زیادی را اجازه می‌دهد، اما شواهدِ تکراری و تشخیصی می‌توانند بسیاری از پیشین‌های معقول را به هم نزدیک کنند. مدافعان شفافیت و تحلیلِ حساسیت نیز می‌خواهند. پیشین‌های جزمیِ افراطی مشکلِ واقعی‌اند چون شاید در برابر شاهد مقاومت کنند."],["پیشینِ عینی بر پایهٔ تقارن یا آنتروپیِ بیشینه فقط فرض‌ها را درونِ قاعده‌ای ظاهراً خنثی پنهان می‌کند.","درست است؛ هیچ پارامتربندی خودکار بی‌طرف نیست. بیزی‌های عینی این پیشین‌ها را قراردادهای پیش‌فرضِ اصولی برای حالت‌های اطلاعاتیِ خاص می‌دانند، نه حقیقتِ بی‌فرض. بنابراین حساسیت به پیشین‌های بدیل ضروری است."]],"confuse":[["احتمالِ پیشین و نرخِ پایه","نرخِ پایه اطلاعاتِ فراوانیِ تجربی است که اغلب پیشین را شکل می‌دهد. پیشین کلِ تخصیصِ احتمال پیش از شاهدِ فعلی است و می‌تواند بیش از نرخِ پایه را دربر گیرد."],["پیشین و سوگیری","پیشین خودکار سوگیریِ شناختی نیست. هر به‌روزرسانیِ بیزی نقطهٔ شروع می‌خواهد؛ پرسشِ معرفتی دفاع‌پذیری و استحکامِ نتیجه نسبت به بدیل‌هاست."]],"mistakes":["گزارشِ پسین چنان‌که گویی داده به‌تنهایی آن را ساخته و پنهان‌کردنِ پیشین.","«بی‌اطلاع» نامیدنِ پیشینِ تختِ راحت بدون بررسیِ اینکه تخت‌بودن با بازپارامتربندی عوض می‌شود یا نه."],"check":{"q":"دو تحلیلگر از همان داده و درست‌نمایی استفاده می‌کنند اما احتمالِ پسینِ ۲۰٪ و ۷۰٪ گزارش می‌دهند. نخستین پرسشِ تشخیصی چیست؟","a":"پیشین‌هایشان را بخواهید و سپس حساسیت به پیشین را. بیز اختلاف را مرموز نمی‌کند: تفاوتِ پسین را می‌توان به شانسِ آغازین و نسبتِ درست‌نماییِ شاهد تجزیه کرد."}}},"lr":{"en":{"line":"A likelihood ratio measures evidential force by asking how much more expected the observed evidence is under one hypothesis than under a rival.","why":"<p>Evidence does not support a hypothesis merely because the evidence is compatible with it. The decisive comparison is contrastive: would the same observation also be expected if the hypothesis were false or a rival were true? The likelihood ratio isolates that comparison.</p>","origin":"Likelihood-based approaches are associated with figures such as Ian Hacking, A.W.F. Edwards, and Richard Royall. In Bayesian updating the likelihood ratio multiplies prior odds to produce posterior odds, making it the piece of the update contributed by the new evidence rather than by prior belief.","obj":[["The likelihood ratio depends on which alternative hypothesis you choose, so there is no single evidence strength.","Correct: evidence is inherently contrastive. A datum can strongly favor H over H1 and be neutral between H and H2. The right response is to specify the live alternatives, not pretend evidence has hypothesis-independent force."],["Composite hypotheses and nuisance parameters make likelihood ratios sensitive to modeling choices.","They do. Methods such as marginalization, profiling, or explicitly specified predictive distributions are ways to handle this, but the philosophical lesson remains: evidence strength cannot be separated from the model of what each hypothesis predicts."]],"confuse":[["Likelihood and posterior probability","Likelihood asks how expected the evidence is given a hypothesis. Posterior probability combines that evidence with the prior probability of the hypothesis."],["P(data|H) and P(H|data)","The first is a likelihood term; the second is a posterior. Reversing them is the inverse fallacy and is exactly why a striking p-value or test accuracy can be misread."]],"mistakes":["Calling evidence 'supportive' because it is consistent with H without checking its probability under alternatives.","Reporting a likelihood ratio against an implausibly weak straw alternative and presenting it as evidence against all rivals."],"check":{"q":"A finding had 60% probability under your model and 55% under the main rival. Is “our model predicted the finding” strong evidence?","a":"No. The likelihood ratio is about 1.09, barely above neutral. The finding fits your model, but it also fits the rival almost as well, so it discriminates very little."}},"fa":{"line":"نسبتِ درست‌نمایی نیروی شاهد را با این پرسش می‌سنجد که شاهدِ مشاهده‌شده تحتِ یک فرضیه چند برابر بیش از فرضیهٔ رقیب انتظار می‌رود.","why":"<p>شاهد فقط چون با فرضیه سازگار است از آن پشتیبانی نمی‌کند. مقایسهٔ تعیین‌کننده تضادی است: آیا همان مشاهده اگر فرضیه کاذب یا رقیب صادق بود نیز انتظار می‌رفت؟ نسبتِ درست‌نمایی همین مقایسه را جدا می‌کند.</p>","origin":"رویکردهای مبتنی بر درست‌نمایی با نام‌هایی مانند یان هکینگ، ای.دبلیو.اف. ادواردز و ریچارد رویال پیوند دارند. در به‌روزرسانیِ بیزی نسبتِ درست‌نمایی شانسِ پیشین را ضرب می‌کند تا شانسِ پسین حاصل شود؛ بنابراین سهمِ شاهدِ جدید در به‌روزرسانی است، نه سهمِ باورِ پیشین.","obj":[["نسبتِ درست‌نمایی به انتخابِ فرضیهٔ بدیل وابسته است؛ پس نیروی واحدی برای شاهد وجود ندارد.","درست است: شاهد ذاتاً تقابلی است. یک داده می‌تواند H را شدیداً بر H1 ترجیح دهد و میان H و H2 خنثی باشد. پاسخِ درست مشخص‌کردنِ بدیل‌های زنده است، نه وانمودکردنِ اینکه شاهد نیروی مستقل از فرضیه دارد."],["فرضیه‌های مرکب و پارامترهای مزاحم نسبت را به انتخابِ مدل حساس می‌کنند.","بله. حاشیه‌گیری، پروفایل‌کردن یا توزیع‌های پیش‌بینیِ صریح راه‌هایی برای مدیریتِ آن‌اند، اما درسِ فلسفی باقی است: قدرتِ شاهد را نمی‌توان از مدلِ پیش‌بینیِ هر فرضیه جدا کرد."]],"confuse":[["درست‌نمایی و احتمالِ پسین","درست‌نمایی می‌پرسد شاهد با فرضِ یک فرضیه چقدر انتظار می‌رود. پسین این شاهد را با احتمالِ پیشینِ فرضیه ترکیب می‌کند."],["P(data|H) و P(H|data)","اولی جزءِ درست‌نمایی و دومی پسین است. جابه‌جاکردنشان «مغالطهٔ معکوس» است و دقیقاً به همین دلیل مقدارِ p یا دقتِ آزمون می‌تواند اشتباه تفسیر شود."]],"mistakes":["حمایتی نامیدنِ شاهد فقط چون با H سازگار است بدون بررسیِ احتمالِ آن تحتِ بدیل‌ها.","گزارشِ نسبتِ درست‌نمایی علیه بدیلی ضعیف و غیرواقعی و ارائهٔ آن به‌عنوان شاهد علیه همهٔ رقبا."],"check":{"q":"یافته‌ای تحتِ مدلِ شما ۶۰٪ و تحتِ رقیبِ اصلی ۵۵٪ احتمال داشت. آیا «مدلِ ما یافته را پیش‌بینی کرد» شاهدِ قوی است؟","a":"نه. نسبتِ درست‌نمایی حدود ۱٫۰۹ و تقریباً خنثی است. یافته با مدلِ شما جور است اما با رقیب هم تقریباً همان‌قدر؛ پس قدرتِ تمایزِ بسیار کمی دارد."}}},"calib":{"en":{"line":"Calibration asks whether events you assign probability p to actually occur about p percent of the time across comparable predictions.","why":"<p>Confidence is otherwise hard to audit. Calibration converts subjective probability into a track record: among forecasts called 70%, roughly seven in ten should resolve true. This makes overconfidence and underconfidence measurable and trainable rather than personality labels.</p>","origin":"The Brier score, introduced by Glenn Brier, evaluates probabilistic forecasts using squared error; forecasting research associated with Philip Tetlock popularizes calibration training and scoring. Calibration is one dimension of forecast quality, usually paired with resolution or discrimination.","obj":[["A forecaster can be perfectly calibrated by always saying the base rate—50% for everything—while being uninformative.","Exactly. Calibration is necessary for good probabilistic forecasting but not sufficient. Resolution matters: a good forecaster also distinguishes easy from hard cases and moves probabilities away from the base rate when evidence warrants it."],["Small samples make apparent miscalibration noisy; a few 90% forecasts can easily all fail or all succeed.","Calibration must be assessed over enough comparable forecasts and with uncertainty about the calibration curve. Individual surprises do not prove miscalibration; systematic deviations over a track record do."]],"confuse":[["Calibration and accuracy","Accuracy asks whether individual outcomes were right; calibration asks whether stated probability levels match long-run frequencies. A 60% forecast can be well calibrated even when this particular event fails."],["Calibration and discrimination","A calibrated forecaster can still be unhelpfully timid. Discrimination/resolution measures whether forecasts meaningfully separate higher-risk from lower-risk cases."]],"mistakes":["Judging a probability forecast as 'wrong' solely because the less likely outcome occurred.","Claiming calibration from a handful of predictions without enough observations at similar probability levels."],"check":{"q":"Across 100 forecasts labeled 80%, only 55 resolve true. What is the primary diagnosis?","a":"Systematic overconfidence at that probability level: the stated 80% events occurred about 55% of the time. You would still inspect sample composition and resolution, but the calibration gap is directly measurable."}},"fa":{"line":"کالیبراسیون می‌پرسد آیا رویدادهایی که به آن‌ها احتمالِ p می‌دهید در مجموعه‌ای از پیش‌بینی‌های مشابه تقریباً p درصدِ مواقع رخ می‌دهند.","why":"<p>در غیر این صورت اطمینان سخت قابل‌حسابرسی است. کالیبراسیون احتمالِ ذهنی را به کارنامه تبدیل می‌کند: از پیش‌بینی‌های ۷۰٪ تقریباً هفت‌دهم باید درست شوند. به این ترتیب بیش‌اطمینانی و کم‌اطمینانی اندازه‌گیری و آموزش‌پذیر می‌شوند، نه برچسبِ شخصیتی.</p>","origin":"امتیازِ بریر که گلن بریر معرفی کرد پیش‌بینیِ احتمالی را با خطای مربعی می‌سنجد؛ پژوهشِ پیش‌بینی با نامِ فیلیپ تتلاک آموزشِ کالیبراسیون و امتیازدهی را مشهور کرده است. کالیبراسیون فقط یک بُعدِ کیفیتِ پیش‌بینی است و معمولاً در کنار تفکیک یا قدرتِ تمایز سنجیده می‌شود.","obj":[["پیش‌بینی‌کننده می‌تواند با گفتنِ همیشگیِ نرخِ پایه — مثلاً ۵۰٪ برای همه‌چیز — کاملاً کالیبره اما بی‌فایده باشد.","دقیقاً. کالیبراسیون برای پیش‌بینیِ احتمالیِ خوب لازم است اما کافی نیست. تفکیک مهم است: پیش‌بینی‌کنندهٔ خوب مواردِ آسان و سخت را جدا و وقتی شاهد ایجاب می‌کند احتمال را از نرخِ پایه دور می‌کند."],["نمونهٔ کوچک کژکالیبراسیونِ ظاهری را پرنویز می‌کند؛ چند پیش‌بینیِ ۹۰٪ می‌تواند اتفاقاً همه شکست بخورد یا همه درست شود.","کالیبراسیون باید روی تعدادِ کافی از پیش‌بینی‌های قابل‌مقایسه و با عدمِ‌قطعیت دربارهٔ منحنیِ کالیبراسیون سنجیده شود. شگفتیِ منفرد اثباتِ کژکالیبراسیون نیست؛ انحرافِ نظام‌مند در کارنامه هست."]],"confuse":[["کالیبراسیون و دقت","دقت می‌پرسد نتیجهٔ منفرد درست بود یا نه؛ کالیبراسیون می‌پرسد سطوحِ احتمالِ اعلام‌شده با فراوانیِ بلندمدت می‌خوانند یا نه. پیش‌بینیِ ۶۰٪ می‌تواند خوب کالیبره باشد حتی اگر همین مورد شکست بخورد."],["کالیبراسیون و تفکیک","پیش‌بینی‌کنندهٔ کالیبره می‌تواند بیش از حد محتاط و کم‌اطلاع باشد. تفکیک می‌سنجد آیا پیش‌بینی‌ها واقعاً مواردِ پرخطر را از کم‌خطر جدا می‌کنند."]],"mistakes":["«غلط» نامیدنِ پیش‌بینیِ احتمالی فقط چون نتیجهٔ کم‌احتمال رخ داد.","ادعای کالیبراسیون با چند پیش‌بینی بدون مشاهداتِ کافی در سطوحِ احتمالِ مشابه."],"check":{"q":"از ۱۰۰ پیش‌بینیِ برچسب‌خورده با ۸۰٪، فقط ۵۵ مورد درست می‌شوند. تشخیصِ اصلی چیست؟","a":"بیش‌اطمینانیِ نظام‌مند در آن سطح: رویدادهای ۸۰٪ فقط حدود ۵۵٪ رخ داده‌اند. هنوز ترکیبِ نمونه و قدرتِ تفکیک را بررسی می‌کنید، اما شکافِ کالیبراسیون مستقیم اندازه‌گیری می‌شود."}}},"induct":{"en":{"line":"No finite record of observed regularity logically entails that the same regularity will continue in unobserved cases.","why":"<p>Induction is how empirical science moves from observed cases to general laws, future cases, and unseen populations. Hume’s problem is that the move cannot be justified deductively, and justifying it by saying induction has worked in the past is itself an inductive argument. The method that generates most empirical knowledge therefore lacks the kind of proof deduction enjoys.</p>","origin":"David Hume’s eighteenth-century treatment is canonical. He distinguishes “relations of ideas” from “matters of fact” and argues that inference beyond present experience relies on an expectation that nature is sufficiently uniform. That expectation cannot be established without circularity.","obj":[["Evolution or learning theory can explain why creatures that generalize from experience tend to survive; doesn’t that justify induction?","It can explain why the habit is adaptive and perhaps reliable in our environment, but the justification still uses empirical generalization from the world’s past structure. Hume’s logical point remains: no non-circular deduction guarantees future uniformity."],["Bayesian updating solves induction by giving a rational rule for learning from evidence.","Bayes gives conditional consistency once priors and likelihood models are supplied; it does not derive those priors or guarantee the future resembles the modeled past. The inductive burden reappears in model choice and prior assumptions."]],"confuse":[["Induction and deduction","Deduction preserves truth if premises are true; induction can amplify information beyond the premises but is fallible. The tradeoff—new information for loss of certainty—is the point."],["Problem of induction and confirmation bias","Hume’s problem is a normative/logical problem about projecting patterns at all. Confirmation bias is a psychological tendency to seek or interpret evidence selectively."]],"mistakes":["Responding 'but induction usually works' as if that were non-circular; the word 'usually' is already an inductive summary.","Treating the problem as a reason never to generalize. Hume shows the absence of deductive guarantee, not that empirical inference is practically dispensable."],"check":{"q":"You have observed a stable coefficient for 20 years. What, strictly speaking, does those 20 years deductively entail about year 21?","a":"Nothing about the coefficient’s year-21 value follows deductively. Using the past pattern to project forward is an inductive move whose rationality depends on assumptions about stability, similarity, and the data-generating process."}},"fa":{"line":"هیچ سابقهٔ متناهی از نظمِ مشاهده‌شده منطقاً تضمین نمی‌کند همان نظم در مواردِ مشاهده‌نشده ادامه یابد.","why":"<p>استقرا راهی است که علمِ تجربی از مواردِ مشاهده‌شده به قانون، آینده و جمعیتِ نادیده می‌رود. مسئلهٔ هیوم این است که این حرکت به‌صورت قیاسی توجیه نمی‌شود، و گفتنِ «استقرا در گذشته جواب داده» خودش استدلالی استقرایی است. بنابراین روشی که بیشترِ معرفتِ تجربی را تولید می‌کند اثباتی از نوعِ قیاس ندارد.</p>","origin":"صورت‌بندیِ قرنِ هجدهمیِ دیوید هیوم معیار است. او «روابطِ میان ایده‌ها» را از «امورِ واقع» جدا و استدلال می‌کند استنتاج فراتر از تجربهٔ فعلی به انتظارِ یکنواختیِ کافیِ طبیعت متکی است. این انتظار بدون دور اثبات نمی‌شود.","obj":[["تکامل یا نظریهٔ یادگیری می‌تواند توضیح دهد چرا موجوداتی که از تجربه تعمیم می‌دهند بقا می‌یابند؛ آیا این استقرا را توجیه نمی‌کند؟","می‌تواند توضیح دهد چرا عادت سازگار و شاید در محیطِ ما قابل‌اعتماد است، اما این توجیه هنوز از تعمیمِ تجربی دربارهٔ ساختارِ گذشتهٔ جهان استفاده می‌کند. نکتهٔ منطقیِ هیوم باقی است: هیچ قیاسِ غیردوری یکنواختیِ آینده را تضمین نمی‌کند."],["به‌روزرسانیِ بیزی مسئلهٔ استقرا را حل می‌کند چون قاعدهٔ عقلانیِ یادگیری از شاهد می‌دهد.","بیز پس از داده‌شدنِ پیشین و مدلِ درست‌نمایی سازگاریِ شرطی می‌دهد؛ پیشین‌ها را از هیچ استخراج یا تضمین نمی‌کند آینده شبیه گذشتهٔ مدل‌شده باشد. بارِ استقرا در انتخابِ مدل و فرض‌های پیشین بازمی‌گردد."]],"confuse":[["استقرا و قیاس","قیاس در صورتِ صدقِ مقدمات حقیقت را حفظ می‌کند؛ استقرا اطلاعات را فراتر از مقدمات گسترش می‌دهد اما خطاپذیر است. معاملهٔ اطلاعاتِ تازه با از‌دست‌دادنِ یقین اصلِ ماجراست."],["مسئلهٔ استقرا و سوگیریِ تأیید","مسئلهٔ هیوم مسئله‌ای هنجاری/منطقی دربارهٔ اصلِ فرافکنیِ الگوست. سوگیریِ تأیید گرایشِ روان‌شناختی به جست‌وجو یا تفسیرِ گزینشیِ شاهد است."]],"mistakes":["پاسخِ «اما استقرا معمولاً جواب می‌دهد» گویی غیردوری است؛ واژهٔ «معمولاً» خودش خلاصه‌ای استقرایی است.","فهمِ مسئله به‌عنوان دلیلِ ممنوعیتِ هر تعمیم. هیوم نبودِ تضمینِ قیاسی را نشان می‌دهد، نه بی‌نیازیِ عملی از استنتاجِ تجربی."],"check":{"q":"بیست سال ضریبِ پایداری دیده‌اید. به‌طور دقیق این بیست سال چه چیزی را دربارهٔ سالِ بیست‌ویکم به‌صورت قیاسی نتیجه می‌دهد؟","a":"هیچ مقدارِ سالِ بیست‌ویکم به‌صورت قیاسی نتیجه نمی‌شود. فرافکنیِ الگوی گذشته حرکتِ استقرایی است و به فرض‌هایی دربارهٔ ثبات، شباهت و فرایندِ تولیدِ داده وابسته است."}}},"grue":{"en":{"line":"Goodman’s “grue” problem shows that evidence alone does not determine which predicates or patterns are projectible into the future.","why":"<p>Hume asks why any past regularity should continue. Goodman sharpens the puzzle: even granting projection, the same observations support multiple incompatible generalizations depending on how we describe the pattern. The missing ingredient is not more data but a theory of which predicates are lawlike or natural.</p>","origin":"Nelson Goodman introduced the “new riddle of induction” in <i>Fact, Fiction, and Forecast</i>. An object is “grue” if observed before a future time and green, or unobserved before that time and blue. All observed emeralds can be both green and grue, yet the predicates predict different future colors.","obj":[["'Grue' is artificially gerrymandered while 'green' is natural; the puzzle disappears once we prefer natural kinds.","That is the intuitive reply, but it relocates the problem: what non-circularly makes one predicate more natural or projectible? Goodman’s point is precisely that syntax and fit to past data do not answer that question."],["Scientific practice already has entrenched vocabulary and background theory, so no one seriously considers grue-like rivals.","Goodman agrees entrenchment matters, but then inductive validity depends partly on linguistic and theoretical history. The modern practical analogue is feature engineering: multiple equally fitting specifications can encode very different extrapolations."]],"confuse":[["Grue and underdetermination","Grue is a specific problem of projectible predicates and induction. Underdetermination is broader: total evidence may support multiple rival theories, even with ordinary predicates."],["Overfitting","Overfitting is a statistical failure to generalize due to fitting noise or excessive flexibility. Grue can arise even with perfect in-sample fit and no noisy estimation; it concerns which pattern is legitimate to project."]],"mistakes":["Dismissing grue merely because the predicate sounds weird; that assumes the naturalness criterion the riddle asks you to justify.","Treating better in-sample fit as the solution when green and grue are constructed to fit the observed cases equally."],"check":{"q":"Two transformations of the same dataset fit every historical observation exactly but imply opposite out-of-sample trends. What Goodman-style question should you ask?","a":"What makes one representation genuinely projectible rather than merely an equally fitting redescription? The answer must come from structure, mechanism, background theory, or a principled simplicity/naturalness constraint—not historical fit alone."}},"fa":{"line":"مسئلهٔ «گرو»ی گودمن نشان می‌دهد شاهد به‌تنهایی تعیین نمی‌کند کدام محمول یا الگو را باید به آینده فرافکنی کرد.","why":"<p>هیوم می‌پرسد چرا نظمِ گذشته باید ادامه یابد. گودمن مسئله را تیزتر می‌کند: حتی اگر اصلِ فرافکنی را بپذیریم، همان مشاهدات بسته به شیوهٔ توصیفِ الگو از تعمیم‌های ناسازگار پشتیبانی می‌کنند. مادهٔ گمشده دادهٔ بیشتر نیست؛ نظریه‌ای دربارهٔ اینکه کدام محمول قانون‌وار یا طبیعی است.</p>","origin":"نلسون گودمن «معمای جدیدِ استقرا» را در <i>واقعیت، داستان و پیش‌بینی</i> مطرح کرد. شیء «گرو» است اگر پیش از زمانِ آینده مشاهده و سبز باشد، یا پیش از آن مشاهده نشده و آبی باشد. همهٔ زمردهای مشاهده‌شده می‌توانند هم سبز و هم گرو باشند اما دو محمول آیندهٔ متفاوتی پیش‌بینی می‌کنند.","obj":[["«گرو» ساختگی و وصله‌دوزی‌شده است و «سبز» طبیعی؛ با ترجیحِ انواعِ طبیعی معما حل می‌شود.","این پاسخِ شهودی است اما فقط مسئله را جابه‌جا می‌کند: چه چیزی به‌صورت غیردوری یک محمول را طبیعی‌تر یا فرافکنی‌پذیرتر می‌کند؟ نکتهٔ گودمن همین است که نحو و برازشِ دادهٔ گذشته پاسخ نمی‌دهند."],["علم از پیش واژگان و نظریهٔ پس‌زمینهٔ تثبیت‌شده دارد، پس کسی بدیلِ گروگونه را جدی نمی‌گیرد.","گودمن می‌پذیرد تثبیتِ تاریخی مهم است، اما آن‌گاه اعتبارِ استقرا تا حدی به تاریخِ زبانی و نظری وابسته می‌شود. همتای عملیِ امروز مهندسیِ ویژگی است: مشخصاتِ هم‌برازش می‌توانند برون‌یابی‌های کاملاً متفاوت رمزگذاری کنند."]],"confuse":[["گرو و تعیّن‌ناقص","گرو مسئلهٔ مشخصِ محمول‌های فرافکنی‌پذیر و استقراست. تعیّن‌ناقص گسترده‌تر است: کلِ شواهد می‌تواند چند نظریهٔ رقیب را حتی با محمول‌های عادی پشتیبانی کند."],["بیش‌برازش","بیش‌برازش شکستِ آماریِ تعمیم به‌سببِ برازشِ نویز یا انعطافِ زیاد است. گرو حتی با برازشِ کامل و بدون نویز هم رخ می‌دهد؛ مسئله این است که کدام الگو مشروعاً قابل‌فرافکنی است."]],"mistakes":["ردکردنِ گرو فقط چون محمول عجیب به نظر می‌رسد؛ این همان معیارِ طبیعی‌بودن را مفروض می‌گیرد که معما می‌خواهد توجیه شود.","حل‌کردنِ مسئله با برازشِ درون‌نمونه‌ای بهتر، در حالی که سبز و گرو طوری ساخته شده‌اند که همهٔ مواردِ مشاهده‌شده را یکسان برازش کنند."],"check":{"q":"دو تبدیل از یک مجموعه‌داده تمامِ تاریخ را دقیقاً یکسان برازش می‌کنند اما روندهای برون‌نمونه‌ایِ متضاد می‌دهند. پرسشِ گودمنی چیست؟","a":"چه چیزی یکی را واقعاً فرافکنی‌پذیر می‌کند و دیگری را صرفاً بازتوصیفی هم‌برازش؟ پاسخ باید از ساختار، سازوکار، نظریهٔ پس‌زمینه یا قیدِ اصولیِ سادگی/طبیعی‌بودن بیاید، نه صرفِ برازشِ تاریخی."}}},"adhoc":{"en":{"line":"An ad hoc rescue modifies a theory after trouble in a way that protects it from the anomaly without independently increasing testable content.","why":"<p>Duhem–Quine makes auxiliary adjustment logically unavoidable: when a prediction fails, something in the bundle must change. The epistemic problem is distinguishing legitimate model improvement from an immunizing patch that explains only the failure already seen. Ad hocness names that failure mode.</p>","origin":"Popper attacked “conventionalist stratagems” that shield theories from falsification; Lakatos recast the issue historically as degenerating adjustments in a protective belt. The important point is that modifying auxiliaries is not itself ad hoc—the diagnosis depends on what the modification earns afterward.","obj":[["Every theory adjustment responds to existing data, so all science is partly post hoc.","Yes, which is why timing alone is not decisive. A repair earns legitimacy by generating new constraints, independent measurements, or novel predictions that were not used to construct the patch."],["A patch may later become fruitful, so labeling it ad hoc too early can kill good science.","Lakatos accepts this temporal caution. 'Ad hoc' is best treated as a warning about current epistemic debt: until the adjustment makes independent risky contact with evidence, it has accommodated rather than predicted."]],"confuse":[["Ad hoc and false","An ad hoc rescue can be true. The criticism is methodological: it lacks independent support or novel predictive payoff, not that its content has been disproved."],["Model refinement","A refinement that was independently motivated or yields new successful predictions is not merely ad hoc even if introduced after an anomaly."]],"mistakes":["Calling any post-data modification ad hoc regardless of independent motivation or new predictions.","Allowing an unmeasured 'hidden factor' to absorb every failure without specifying how that factor could itself be detected."],"check":{"q":"After a failed prediction, a team adds an unobserved factor calibrated exactly to restore the fit and makes no new prediction. What would change the diagnosis from ad hoc rescue to progressive refinement?","a":"Independent empirical consequences: a way to measure the factor, a novel prediction it generates, or a new constraint it passes that was not used in constructing the rescue."}},"fa":{"line":"ترمیمِ موردی نظریه را پس از مشکل طوری تغییر می‌دهد که ناهنجاری را جذب کند بی‌آنکه محتوای آزمون‌پذیرِ مستقلی بیفزاید.","why":"<p>دوئم‌ـ‌کواین تعدیلِ فرض‌های کمکی را از نظر منطقی اجتناب‌ناپذیر می‌کند: وقتی پیش‌بینی شکست می‌خورد، چیزی در بسته باید عوض شود. مسئلهٔ معرفتی جداکردنِ بهبودِ مشروعِ مدل از وصله‌ای ایمن‌ساز است که فقط شکستِ دیده‌شده را توضیح می‌دهد. «موردی» نامِ همین حالتِ شکست است.</p>","origin":"پوپر به «ترفندهای قراردادگرایانه» که نظریه را از ابطال مصون می‌کنند حمله کرد؛ لاکاتوش مسئله را تاریخی و به‌صورت تعدیل‌های واپس‌رونده در کمربندِ محافظ بازصورت‌بندی کرد. نکتهٔ مهم این است که تغییرِ فرضِ کمکی خودبه‌خود موردی نیست؛ داوری به چیزی بستگی دارد که تغییر بعداً به دست می‌آورد.","obj":[["هر تغییرِ نظریه به دادهٔ موجود پاسخ می‌دهد؛ پس کلِ علم تا حدی پس‌از‌واقعه است.","بله، و به همین دلیل صرفِ زمان‌بندی تعیین‌کننده نیست. ترمیم وقتی مشروعیت می‌گیرد که قیدهای تازه، اندازه‌گیریِ مستقل یا پیش‌بینیِ جدیدی بسازد که در ساختِ وصله استفاده نشده بود."],["وصله ممکن است بعداً بارور شود؛ برچسبِ زودهنگامِ «موردی» می‌تواند علمِ خوب را بکشد.","لاکاتوش همین احتیاطِ زمانی را می‌پذیرد. «موردی» بهتر است هشدارِ بدهیِ معرفتیِ فعلی باشد: تا وقتی تعدیل تماسِ مستقل و پرخطر با شاهد نسازد، فقط سازگار کرده نه پیش‌بینی."]],"confuse":[["موردی و کاذب","ترمیمِ موردی می‌تواند صادق باشد. نقد روش‌شناختی است: پشتیبانیِ مستقل یا دستاوردِ پیش‌بینیِ تازه ندارد، نه اینکه محتوا ابطال شده باشد."],["بهبودِ مدل","بهبودی که انگیزهٔ مستقل دارد یا پیش‌بینی‌های تازهٔ موفق تولید می‌کند صرفاً موردی نیست، حتی اگر پس از ناهنجاری معرفی شود."]],"mistakes":["موردی نامیدنِ هر تغییرِ پس از داده فارغ از انگیزهٔ مستقل یا پیش‌بینیِ تازه.","اجازه‌دادن به «عاملِ پنهان» و اندازه‌گیری‌نشده برای جذبِ هر شکست بی‌آنکه مشخص شود خودِ عامل چگونه قابل‌تشخیص است."],"check":{"q":"پس از پیش‌بینیِ ناموفق، تیم عاملی مشاهده‌نشده اضافه می‌کند که دقیقاً برای بازگرداندنِ برازش تنظیم شده و هیچ پیش‌بینیِ تازه ندارد. چه چیزی تشخیص را از ترمیمِ موردی به اصلاحِ پیش‌رونده عوض می‌کند؟","a":"پیامدِ تجربیِ مستقل: راهی برای اندازه‌گیریِ عامل، پیش‌بینیِ تازه‌ای که تولید کند، یا قیدِ جدیدی که بگذراند و در ساختِ وصله استفاده نشده باشد."}}},"underdet":{"en":{"line":"Underdetermination occurs when the available evidence is compatible with multiple genuinely different theories, so evidence alone does not uniquely determine theory choice.","why":"<p>Even perfect handling of a dataset may leave rival explanations tied. This matters because scientific inference often asks more than “which theory fits?”—it asks which unobserved structure, mechanism, or counterfactual is real. When several rivals fit the total evidence, extra theoretical virtues or new experiments must do the separating.</p>","origin":"The theme grows from Duhem and Quine but is broader than the testing problem. Philosophers such as Larry Laudan discuss different strengths of underdetermination. In practice the issue appears in observational equivalence, empirically equivalent models, and identification failures.","obj":[["Most historical underdetermination is temporary; new instruments or data eventually distinguish rivals.","That weakens claims of permanent underdetermination but confirms the local point: at a given evidential state, the evidence may not decide. The rational response is to represent the uncertainty rather than pretend current data select uniquely."],["Theoretical virtues—simplicity, unification, mechanism—can break ties.","They can, but then theory choice is not determined by empirical fit alone. The philosophical work shifts to whether those virtues are truth-conducive, pragmatic preferences, or disguised priors."]],"confuse":[["Underdetermination and Duhem–Quine","Duhem–Quine says a failed test does not localize which assumption is wrong. Underdetermination says multiple theories may fit the same total evidence. One concerns blame after failure; the other selection among empirical rivals."],["Underdetermination and statistical uncertainty","Sampling uncertainty can shrink with more observations within a fixed model. Underdetermination can persist even with arbitrarily precise estimates because different models imply the same observables."]],"mistakes":["Choosing the best-fitting model and calling the theory identified without checking observationally equivalent alternatives.","Concluding 'anything goes.' Underdetermination can be partial; evidence may rule out many theories while leaving a smaller equivalence class."],"check":{"q":"Three structural models reproduce every observable moment in your dataset but imply different policy counterfactuals. What does better standard error precision on those moments solve?","a":"It may solve sampling uncertainty but not the structural underdetermination. You need new identifying variation, restrictions, experiments, or defensible theoretical assumptions that separate the observationally equivalent models."}},"fa":{"line":"تعیّن‌ناقص وقتی رخ می‌دهد که شواهدِ موجود با چند نظریهٔ واقعاً متفاوت سازگارند و بنابراین شاهد به‌تنهایی انتخابِ نظریه را یکتا نمی‌کند.","why":"<p>حتی کارِ بی‌نقص با داده می‌تواند چند تبیین را مساوی بگذارد. این مهم است چون استنتاجِ علمی بیشتر از «کدام نظریه برازش دارد؟» می‌پرسد؛ می‌خواهد بداند کدام ساختار، سازوکار یا خلاف‌واقعِ مشاهده‌نشده واقعی است. وقتی چند رقیب تمامِ شواهد را برازش می‌کنند، فضیلتِ نظری یا آزمایشِ تازه باید جداسازی کند.</p>","origin":"موضوع از دوئم و کواین تغذیه می‌کند اما از مسئلهٔ آزمون گسترده‌تر است. فیلسوفانی مانند لری لائودن درجاتِ مختلفِ تعیّن‌ناقص را بررسی کرده‌اند. در عمل در هم‌ارزیِ مشاهده‌ای، مدل‌های تجرباً هم‌ارز و شکستِ شناسایی ظاهر می‌شود.","obj":[["بیشترِ تعیّن‌ناقص‌های تاریخی موقت‌اند؛ ابزار یا دادهٔ تازه بالاخره رقبا را جدا می‌کند.","این ادعای تعیّن‌ناقصِ دائمی را تضعیف می‌کند اما نکتهٔ محلی را تأیید می‌کند: در وضعیتِ شاهدیِ فعلی داده شاید تصمیم نگیرد. پاسخِ عقلانی نمایشِ عدمِ‌قطعیت است، نه وانمودکردنِ اینکه دادهٔ امروز انتخابِ یکتا می‌دهد."],["فضایلِ نظری — سادگی، وحدت، سازوکار — می‌توانند تساوی را بشکنند.","می‌توانند، اما آن‌گاه انتخاب فقط با برازشِ تجربی تعیین نشده است. کارِ فلسفی به این منتقل می‌شود که آیا این فضایل حقیقت‌یار، ترجیحِ عملی یا پیشینِ پنهان‌اند."]],"confuse":[["تعیّن‌ناقص و دوئم‌ـ‌کواین","دوئم‌ـ‌کواین می‌گوید آزمونِ شکست‌خورده مشخص نمی‌کند کدام فرض مقصر است. تعیّن‌ناقص می‌گوید چند نظریه ممکن است همان کلِ شواهد را برازش کنند. اولی دربارهٔ مکان‌یابیِ شکست و دومی دربارهٔ انتخاب میان رقباست."],["تعیّن‌ناقص و عدمِ‌قطعیتِ آماری","عدمِ‌قطعیتِ نمونه‌گیری در یک مدلِ ثابت با دادهٔ بیشتر کم می‌شود. تعیّن‌ناقص می‌تواند حتی با برآوردهای بسیار دقیق بماند چون مدل‌های متفاوت همان مشاهدات را نتیجه می‌دهند."]],"mistakes":["انتخابِ بهترین برازش و «شناسایی‌شده» نامیدنِ نظریه بدون بررسیِ بدیل‌های هم‌ارزِ مشاهده‌ای.","نتیجه‌گیریِ «هر چیزی رواست». تعیّن‌ناقص می‌تواند جزئی باشد؛ شاهد نظریه‌های بسیاری را کنار می‌زند و طبقه‌ای کوچک‌تر را باز می‌گذارد."],"check":{"q":"سه مدلِ ساختاری همهٔ گشتاورهای مشاهده‌شده را دقیقاً بازتولید می‌کنند اما خلاف‌واقع‌های سیاستیِ متفاوت می‌دهند. دقیق‌ترشدنِ خطاهای استانداردِ همان گشتاورها چه چیزی را حل می‌کند؟","a":"شاید عدمِ‌قطعیتِ نمونه‌گیری را حل کند، اما تعیّن‌ناقصِ ساختاری را نه. به تغییرِ شناسایی‌کننده، محدودیت، آزمایش یا فرضِ نظریِ دفاع‌پذیری نیاز دارید که مدل‌های هم‌ارزِ مشاهده‌ای را جدا کند."}}},"kuhn":{"en":{"line":"A Kuhnian paradigm is a shared disciplinary framework of exemplars, standards, concepts, and problem-solving practices that defines what counts as normal science.","why":"<p>Popper’s picture suggests scientists constantly try to refute theories. Kuhn’s history showed something else: mature science spends long periods solving puzzles inside a framework and tolerating anomalies. The paradigm concept explains how a community can rationally work within a protected structure until accumulated strain produces crisis.</p>","origin":"Thomas Kuhn introduced the modern paradigm-centered account in <i>The Structure of Scientific Revolutions</i> (1962). He drew on historical episodes such as transitions in astronomy and physics. Later editions distinguished the broad “disciplinary matrix” from concrete exemplars because “paradigm” had been used too many ways.","obj":[["Kuhn makes scientific change sound sociological or irrational: paradigms win because communities convert, not because evidence decides.","Kuhn denies that revolutions are irrational; he argues there is no algorithm that mechanically ranks all virtues at once. Accuracy, scope, simplicity, fruitfulness, and consistency still matter, but scientists may weight them differently during transition."],["The word 'paradigm' is so elastic that it explains everything and therefore little.","Kuhn partly conceded the ambiguity and sharpened the idea into disciplinary matrices and exemplars. Used carefully, the concept names shared standards and problem-solving models, not any vaguely dominant idea."]],"confuse":[["Paradigm and Lakatosian research programme","Kuhn emphasizes dominant community frameworks and revolutionary succession; Lakatos allows competing programmes to coexist and tries to evaluate them by progressive or degenerating problem shifts."],["Paradigm and theory","A paradigm includes more than propositions: exemplary solutions, instruments, standards, vocabulary, and judgments about legitimate problems."]],"mistakes":["Calling every change of model or dataset a 'paradigm shift.' Kuhnian revolutions alter the disciplinary framework, not merely one result.","Reading Kuhn as saying evidence never matters; his claim is that evidence is assessed within shared standards that can themselves change."],"check":{"q":"A field keeps its core framework despite recurring anomalies because it continues solving new puzzles and training researchers successfully. Is that automatically irrational on Kuhn’s account?","a":"No. That is normal science. Anomalies are expected and need not trigger abandonment until they become severe, persistent, and connected to a viable alternative framework."}},"fa":{"line":"پارادایمِ کوهنی چارچوبِ مشترکِ یک رشته از نمونه‌ها، معیارها، مفاهیم و شیوه‌های حلِ مسئله است که تعیین می‌کند چه چیزی «علمِ عادی» محسوب می‌شود.","why":"<p>تصویرِ پوپری می‌گوید دانشمندان پیوسته می‌کوشند نظریه‌ها را ابطال کنند. تاریخِ کوهن چیز دیگری نشان داد: علمِ بالغ دوره‌های طولانی مسئله‌های درونِ یک چارچوب را حل و ناهنجاری‌ها را تحمل می‌کند. پارادایم توضیح می‌دهد جامعه چگونه عقلانیاً در ساختاری محافظت‌شده کار می‌کند تا فشارِ انباشته بحران بسازد.</p>","origin":"توماس کوهن روایتِ پارادایم‌محور را در <i>ساختارِ انقلاب‌های علمی</i> (۱۹۶۲) مشهور کرد و از تاریخِ نجوم و فیزیک الهام گرفت. در ویرایش‌های بعدی «ماتریسِ رشته‌ای» را از نمونه‌های عینی جدا کرد چون واژهٔ پارادایم بیش از حد معانیِ مختلف گرفته بود.","obj":[["کوهن تغییرِ علمی را جامعه‌شناختی یا غیرعقلانی می‌کند: پارادایم‌ها چون جامعه تغییرِ ایمان می‌دهد برنده می‌شوند، نه چون شاهد تصمیم می‌گیرد.","کوهن انکار می‌کند انقلاب غیرعقلانی باشد؛ می‌گوید الگوریتمی برای رتبه‌بندیِ مکانیکیِ همهٔ فضایل وجود ندارد. دقت، دامنه، سادگی، باروری و سازگاری هنوز مهم‌اند، اما دانشمندان در گذار ممکن است وزن‌های متفاوت بدهند."],["«پارادایم» آن‌قدر کش‌دار است که همه‌چیز را توضیح می‌دهد و در نتیجه چیزِ کمی توضیح می‌دهد.","کوهن بخشی از ابهام را پذیرفت و ایده را با ماتریسِ رشته‌ای و نمونه‌ها دقیق‌تر کرد. کاربردِ دقیق آن را برای معیارهای مشترک و الگوهای حلِ مسئله نگه می‌دارد، نه هر ایدهٔ غالبِ مبهم."]],"confuse":[["پارادایم و برنامهٔ پژوهشیِ لاکاتوش","کوهن بر چارچوبِ غالبِ جامعه و جانشینیِ انقلابی تأکید دارد؛ لاکاتوش رقابتِ هم‌زمانِ برنامه‌ها را می‌پذیرد و می‌کوشد آن‌ها را با پیش‌روندگی/واپس‌روندگی ارزیابی کند."],["پارادایم و نظریه","پارادایم بیش از مجموعهٔ گزاره‌هاست: نمونهٔ حل‌شده، ابزار، معیار، واژگان و داوری دربارهٔ مسائلِ مشروع را دربر می‌گیرد."]],"mistakes":["«تغییرِ پارادایم» نامیدنِ هر تغییرِ مدل یا داده؛ انقلابِ کوهنی چارچوبِ رشته را عوض می‌کند، نه یک نتیجه را.","خواندنِ کوهن به‌عنوان اینکه شاهد هرگز مهم نیست؛ ادعا این است که شاهد درونِ معیارهای مشترکی سنجیده می‌شود که خودشان می‌توانند تغییر کنند."],"check":{"q":"رشته‌ای با وجودِ ناهنجاری‌های تکراری چارچوبِ اصلی را نگه می‌دارد چون همچنان مسائلِ تازه حل و پژوهشگر تربیت می‌کند. در روایتِ کوهن این خودکار غیرعقلانی است؟","a":"نه. این علمِ عادی است. ناهنجاری انتظار می‌رود و تا وقتی شدید، پایدار و همراهِ بدیلِ قابل‌زیست نشود لازم نیست چارچوب رها شود."}}},"incomm":{"en":{"line":"Incommensurability says rival paradigms may lack a fully neutral common measure because key terms, standards, and problem priorities change with the framework.","why":"<p>If paradigms merely made competing predictions in a fixed vocabulary, evidence could rank them on one common scale. Kuhn and Feyerabend argue revolutionary change can alter the meanings of terms and the standards of good explanation themselves, making comparison real but not algorithmically neutral.</p>","origin":"The thesis is associated with Thomas Kuhn and Paul Feyerabend. Kuhn’s examples include shifts in physical concepts such as mass across Newtonian and relativistic frameworks. “Incommensurable” does not mean literally incomprehensible or incomparable; Kuhn later emphasized partial translation and comparative judgment.","obj":[["Scientists routinely understand and compare old and new theories, so incommensurability is exaggerated.","Kuhn’s mature position is partial, not total. Translation is possible, but it may not preserve every inferential role or standard. The thesis targets the idea of a completely framework-neutral algorithm, not the possibility of rational comparison."],["If there is no neutral standard, theory choice collapses into relativism.","Kuhn resists that conclusion: shared values such as accuracy, scope, and fruitfulness can persist even when weighted differently. Critics reply that this still leaves more room for judgment than traditional rationalist pictures wanted."]],"confuse":[["Incommensurability and contradiction","Two theories can contradict one another while sharing all terms and standards. Incommensurability adds that the conceptual or evaluative framework itself shifts."],["Incommensurability and untranslatability","It is usually partial loss of exact translation or common metric, not the claim that adherents cannot communicate at all."]],"mistakes":["Using the term to mean simply 'the theories disagree.'","Jumping from partial framework dependence to 'there is no rational comparison whatsoever.'"],"check":{"q":"Two models use the same word “risk” but one defines it as variance and the other as expected shortfall. Before comparing empirical claims, what incommensurability-style task comes first?","a":"Align the concepts and inferential roles. Apparent disagreement may partly reflect a change in what the central term measures; comparison requires translation before scorekeeping."}},"fa":{"line":"قیاس‌ناپذیری می‌گوید پارادایم‌های رقیب ممکن است معیارِ مشترک و کاملاً خنثایی نداشته باشند چون اصطلاحاتِ کلیدی، معیارها و اولویتِ مسائل با چارچوب تغییر می‌کنند.","why":"<p>اگر پارادایم‌ها فقط در واژگانی ثابت پیش‌بینی‌های رقیب می‌دادند، شاهد می‌توانست آن‌ها را روی یک مقیاس رتبه‌بندی کند. کوهن و فایرابند می‌گویند تغییرِ انقلابی می‌تواند معنای واژه‌ها و خودِ معیارِ تبیینِ خوب را عوض کند؛ مقایسه ممکن است اما الگوریتمی و کاملاً خنثی نیست.</p>","origin":"تز با توماس کوهن و پل فایرابند پیوند دارد. مثال‌های کوهن شامل تغییرِ مفاهیمِ فیزیکی مانند جرم میان چارچوبِ نیوتنی و نسبیتی است. «قیاس‌ناپذیر» به معنای کاملاً نامفهوم یا غیرقابل‌مقایسه نیست؛ کوهنِ متأخر بر ترجمهٔ جزئی و داوریِ مقایسه‌ای تأکید کرد.","obj":[["دانشمندان مرتب نظریه‌های قدیم و جدید را می‌فهمند و مقایسه می‌کنند؛ پس قیاس‌ناپذیری اغراق است.","موضعِ پختهٔ کوهن جزئی است، نه کامل. ترجمه ممکن است اما همهٔ نقش‌های استنتاجی یا معیارها را حفظ نکند. تز، ایدهٔ الگوریتمِ کاملاً خنثای چارچوب را هدف می‌گیرد، نه امکانِ مقایسهٔ عقلانی را."],["اگر معیارِ خنثی نداریم، انتخابِ نظریه به نسبی‌گرایی می‌ریزد.","کوهن این نتیجه را رد می‌کند: ارزش‌های مشترکی مانند دقت، دامنه و باروری می‌توانند بمانند، هرچند وزنشان فرق کند. منتقدان می‌گویند این هنوز داوریِ بیشتری از تصویرِ عقل‌گرای سنتی وارد می‌کند."]],"confuse":[["قیاس‌ناپذیری و تناقض","دو نظریه می‌توانند با همان واژگان و معیارها مستقیماً تناقض داشته باشند. قیاس‌ناپذیری اضافه می‌کند که خودِ چارچوبِ مفهومی یا ارزیابی تغییر کرده است."],["قیاس‌ناپذیری و ترجمه‌ناپذیری","معمولاً از دست‌رفتنِ جزئیِ ترجمهٔ دقیق یا مقیاسِ مشترک است، نه ادعای اینکه پیروان اصلاً نمی‌توانند با هم ارتباط بگیرند."]],"mistakes":["استفاده از اصطلاح فقط به معنای «دو نظریه اختلاف دارند».","پریدن از وابستگیِ جزئی به چارچوب به «هیچ مقایسهٔ عقلانی‌ای ممکن نیست»."],"check":{"q":"دو مدل واژهٔ «ریسک» را یکسان به کار می‌برند اما یکی آن را واریانس و دیگری کسریِ مورد انتظار تعریف می‌کند. پیش از مقایسهٔ تجربی چه کارِ قیاس‌ناپذیری‌گونه‌ای لازم است؟","a":"باید مفاهیم و نقش‌های استنتاجی را هم‌تراز کنید. بخشی از اختلافِ ظاهری شاید ناشی از تغییرِ آن چیزی باشد که واژهٔ مرکزی اندازه می‌گیرد؛ پیش از امتیازدهی باید ترجمه کرد."}}},"theoryladen":{"en":{"line":"Theory-ladenness means observation is shaped by concepts, expectations, instruments, and background theory rather than arriving as completely neutral “raw facts.”","why":"<p>Scientific arguments often imagine a clean division between neutral observation and interpretation. Theory-ladenness complicates that picture: what is noticed, measured, classified, and even described can depend on prior theoretical commitments. This matters most when rival theories help construct the evidence used to choose between them.</p>","origin":"N.R. Hanson’s <i>Patterns of Discovery</i> and Kuhn’s work are central. The thesis has weaker and stronger versions, from the uncontroversial claim that concepts structure description to the radical claim that different theories produce incomparable perceptual worlds.","obj":[["If observation is theory-laden, science seems trapped in circularity: theories create the facts that confirm them.","Ladenness need not imply total determination. Instruments can be calibrated independently, observers with different theories can agree on many readings, and adversarial procedures can reduce theory-specific influence. The point is to audit the mediation, not abandon evidence."],["People can learn to report low-level measurements without endorsing the theory behind them.","That supports weaker forms of the thesis. Theory may shape categories, instrument design, and salience without dictating every observation. The strongest perceptual-relativist versions are therefore much more controversial."]],"confuse":[["Theory-ladenness and confirmation bias","Theory-ladenness is structural: concepts and instruments mediate observation even without motivational bias. Confirmation bias is a selective cognitive tendency favoring expected evidence."],["Theory-ladenness and fabrication","Mediated observation is not invented data. A thermometer reading can depend on theory-laden instrumentation while still being constrained by the world."]],"mistakes":["Concluding that because observation is theory-laden, any interpretation is equally valid.","Ignoring coding choices, variable construction, measurement definitions, and instrument assumptions when calling a dataset 'raw.'"],"check":{"q":"Two teams receive the same transaction log but construct different “liquidity events” because their theories define the category differently. Where is the theory-ladenness?","a":"In the transformation from record to observation category. The underlying log may be shared, but what counts as an instance of the measured phenomenon depends on conceptual and coding commitments."}},"fa":{"line":"نظریه‌باربودنِ مشاهده یعنی مشاهده با مفهوم، انتظار، ابزار و نظریهٔ پس‌زمینه شکل می‌گیرد و به‌صورت «واقعیتِ خام» و کاملاً خنثی وارد نمی‌شود.","why":"<p>استدلالِ علمی اغلب جداییِ تمیزی میان مشاهدهٔ خنثی و تفسیر فرض می‌کند. نظریه‌باربودن این تصویر را پیچیده می‌کند: آنچه دیده، اندازه‌گیری، طبقه‌بندی و حتی توصیف می‌شود می‌تواند به تعهداتِ نظریِ قبلی وابسته باشد. مسئله وقتی جدی است که نظریه‌های رقیب در ساختِ شاهدی که قرار است میانشان انتخاب کند نقش دارند.</p>","origin":"کتابِ <i>الگوهای اکتشاف</i> اثرِ ان.آر. هنسون و کارِ کوهن مرکزی‌اند. تز نسخه‌های ضعیف و قوی دارد، از ادعای کم‌مناقشهٔ اینکه مفاهیم توصیف را ساختار می‌دهند تا ادعای رادیکال که نظریه‌های متفاوت جهان‌های ادراکیِ قیاس‌ناپذیر می‌سازند.","obj":[["اگر مشاهده نظریه‌بار باشد، علم در دور می‌افتد: نظریه همان واقعیت‌هایی را می‌سازد که تأییدش می‌کنند.","نظریه‌باربودن به معنای تعیینِ کامل نیست. ابزارها می‌توانند مستقلاً کالیبره شوند، ناظران با نظریه‌های متفاوت بر بسیاری از خوانش‌ها توافق کنند و رویه‌های خصمانه نفوذِ نظریهٔ خاص را کم کنند. نکته حسابرسیِ میانجی‌گری است، نه ترکِ شاهد."],["آدم‌ها می‌توانند گزارشِ اندازه‌گیریِ سطح پایین را بیاموزند بی‌آنکه نظریهٔ پشتِ آن را قبول کنند.","این از نسخه‌های ضعیف حمایت می‌کند. نظریه می‌تواند دسته‌بندی، طراحیِ ابزار و برجستگی را شکل دهد بی‌آنکه هر مشاهده را دیکته کند. نسخه‌های قویِ نسبی‌گرایانه دربارهٔ ادراک بسیار مناقشه‌برانگیزترند."]],"confuse":[["نظریه‌باربودن و سوگیریِ تأیید","نظریه‌باربودن ساختاری است: مفهوم و ابزار حتی بدون انگیزهٔ جانبدارانه مشاهده را میانجی می‌کنند. سوگیریِ تأیید گرایشِ شناختیِ گزینشی به نفع شاهدِ موردِ انتظار است."],["نظریه‌باربودن و جعل","مشاهدهٔ میانجی‌شده دادهٔ ساختگی نیست. خوانشِ دماسنج می‌تواند به ابزارِ نظریه‌بار وابسته باشد و همچنان از جهان قید بگیرد."]],"mistakes":["نتیجه‌گیریِ اینکه چون مشاهده نظریه‌بار است هر تفسیری به یک اندازه معتبر است.","نادیده‌گرفتنِ انتخابِ کد، ساختِ متغیر، تعریفِ اندازه‌گیری و فرضِ ابزار وقتی داده را «خام» می‌نامیم."],"check":{"q":"دو تیم همان لاگِ تراکنش را می‌گیرند اما چون نظریه‌هایشان دسته را متفاوت تعریف می‌کند «رویدادِ نقدشوندگی»های متفاوت می‌سازند. نظریه‌باربودن کجاست؟","a":"در تبدیلِ رکورد به مقولهٔ مشاهده‌ای. لاگِ زیربنایی مشترک است اما اینکه چه چیزی مصداقِ پدیدهٔ اندازه‌گیری‌شده باشد به تعهداتِ مفهومی و کدنویسی وابسته است."}}},"ibe":{"en":{"line":"Inference to the best explanation chooses the hypothesis that would, if true, best explain the observed evidence, rather than merely one that entails or fits it.","why":"<p>Much reasoning is neither deduction nor simple enumeration. From footprints you infer a walker; from a pattern of prices you infer a mechanism. Abduction/IBE formalizes the move from evidence to explanatory hypothesis and makes explicit the extra virtues—simplicity, scope, mechanism, unification—used to choose among compatible accounts.</p>","origin":"Charles Sanders Peirce introduced “abduction” as a distinct inferential form; Gilbert Harman popularized “inference to the best explanation,” and Peter Lipton developed a major contemporary account. The method sits at the center of scientific realism because unobservables are often accepted for explanatory rather than directly observable reasons.","obj":[["The best explanation among the hypotheses we happened to imagine may still be false—the 'bad lot' problem.","This is a serious limitation. IBE needs a sufficiently rich comparison class and active search for alternatives. Being best in a bad menu is weak evidence; adversarial hypothesis generation is therefore part of responsible abduction."],["What makes an explanation 'best'—simplicity, elegance, mechanism—can be subjective and culturally variable.","Defenders argue explanatory virtues are not merely aesthetic when they correlate with compression, independent prediction, causal integration, and fewer adjustable assumptions. But the truth-conduciveness of these virtues remains a substantive philosophical question."]],"confuse":[["IBE and deduction","A good explanation is not logically entailed by the evidence; alternatives remain possible. IBE is ampliative and fallible."],["IBE and curve fit","Predictive fit is one virtue, but explanation adds structure such as mechanism, unification, counterfactual support, or reduction of coincidence."]],"mistakes":["Declaring an explanation 'best' without explicitly listing serious alternatives.","Equating explanatory pleasantness with evidence; a beautiful story that makes no risky or independent contact with data can be merely narrative."],"check":{"q":"A model explains an anomaly elegantly, but you never compared it with two obvious rival mechanisms. What is the IBE failure?","a":"You have at most inference to the best explanation in an impoverished comparison set. The “best” judgment is only as strong as the alternative search; the bad-lot problem remains."}},"fa":{"line":"استنتاج به بهترین تبیین فرضیه‌ای را برمی‌گزیند که اگر صادق باشد شواهدِ مشاهده‌شده را بهتر توضیح می‌دهد، نه صرفاً فرضیه‌ای که با آن‌ها سازگار یا آن‌ها را نتیجه کند.","why":"<p>بخشِ بزرگی از استدلال نه قیاس است نه شمارشِ سادهٔ موارد. از ردپا راه‌رفتنِ کسی را و از الگوی قیمت سازوکاری را استنتاج می‌کنید. ابداکشن/IBE حرکت از شاهد به فرضیهٔ تبیینی را صورت‌بندی و فضایلِ اضافه — سادگی، دامنه، سازوکار، وحدت — را که برای انتخاب میان حساب‌های سازگار استفاده می‌شوند آشکار می‌کند.</p>","origin":"چارلز سندرز پیرس «ابداکشن» را به‌عنوان شکلِ متمایزِ استنتاج مطرح کرد؛ گیلبرت هارمن اصطلاحِ «استنتاج به بهترین تبیین» را مشهور کرد و پیتر لیپتون روایتِ معاصرِ مهمی ساخت. روش در مرکزِ واقع‌گراییِ علمی است چون موجوداتِ نامشهود اغلب به دلایلِ تبیینی پذیرفته می‌شوند نه مشاهدهٔ مستقیم.","obj":[["بهترین تبیین میان فرضیه‌هایی که اتفاقاً به ذهنمان رسیده ممکن است هنوز کاذب باشد — «مسئلهٔ مجموعهٔ بد».","محدودیتِ جدی است. IBE به مجموعهٔ مقایسهٔ غنی و جست‌وجوی فعال برای بدیل نیاز دارد. بهترین‌بودن در منوی بد شاهدِ ضعیفی است؛ بنابراین تولیدِ خصمانهٔ فرضیه بخشی از ابداکشنِ مسئولانه است."],["چه چیزی تبیین را «بهترین» می‌کند — سادگی، زیبایی، سازوکار — می‌تواند ذهنی و فرهنگ‌وابسته باشد.","مدافعان می‌گویند فضایلِ تبیینی وقتی با فشردگی، پیش‌بینیِ مستقل، یکپارچگیِ علّی و فرض‌های قابل‌تنظیمِ کمتر همراه‌اند صرفاً زیبایی‌شناختی نیستند. با این حال حقیقت‌یاریِ این فضایل پرسشی فلسفی و واقعی باقی می‌ماند."]],"confuse":[["IBE و قیاس","تبیینِ خوب از شواهد به‌طور منطقی نتیجه نمی‌شود؛ بدیل‌ها ممکن می‌مانند. IBE گسترش‌دهنده و خطاپذیر است."],["IBE و برازشِ منحنی","برازشِ پیش‌بینی یک فضیلت است، اما تبیین ساختارِ اضافه مانند سازوکار، وحدت، پشتیبانیِ خلاف‌واقع یا کاهشِ تصادف می‌خواهد."]],"mistakes":["«بهترین» اعلام‌کردنِ تبیین بدون فهرست‌کردنِ بدیل‌های جدی.","یکی‌گرفتنِ دلنشینیِ تبیینی با شاهد؛ داستانِ زیبا که تماسِ مستقل یا پرخطر با داده ندارد می‌تواند فقط روایت باشد."],"check":{"q":"مدلی ناهنجاری را بسیار زیبا توضیح می‌دهد اما دو سازوکارِ رقیبِ واضح هرگز مقایسه نشده‌اند. شکستِ IBE چیست؟","a":"در بهترین حالت «بهترین تبیین» در مجموعهٔ مقایسه‌ای فقیر را دارید. حکمِ بهترین‌بودن فقط به اندازهٔ جست‌وجوی بدیل قوی است؛ مسئلهٔ مجموعهٔ بد باقی است."}}},"expert":{"en":{"line":"A non-expert should judge experts indirectly—by argument quality, peer agreement, independent credentials, incentives, and track record—rather than pretending to re-do the expert analysis.","why":"<p>Modern knowledge is specialized. On most technical questions, a novice cannot directly evaluate the core evidence without becoming an expert. Social epistemology therefore needs second-order criteria for deciding whom to trust when qualified people disagree or when credentials alone are not enough.</p>","origin":"Alvin Goldman’s work on expertise gives a prominent framework for novice assessment. The syllabus highlights five practical criteria: quality of arguments accessible to the novice, agreement among other experts, independent evidence of expertise, interests and biases, and track record.","obj":[["A novice often cannot judge argument quality without already knowing the field, so the criteria seem circular.","The criteria are deliberately redundant. When direct argument assessment is weak, the novice can rely more on peer recognition, externally verifiable accomplishments, forecast record, and conflict-of-interest structure. No single proxy is sufficient."],["Consensus can be socially produced by shared training, incentives, or one common source, so expert agreement may be fake independence.","Correct. Agreement is evidential only after tracing dependence. A hundred experts citing the same dataset or model family do not provide a hundred independent confirmations. Genealogy and diversity of methods matter."]],"confuse":[["Expertise and authority","Expertise is domain-specific competence or reliable performance. Authority can be institutional power to decide. An authority outside the relevant domain may have little epistemic weight."],["Credentials and track record","Credentials are ex ante evidence of training; track record is outcome evidence. Each can fail independently, and neither should be treated as a magic stamp."]],"mistakes":["Evaluating an expert mainly by rhetorical fluency or confidence.","Counting agreement without checking whether experts share the same upstream source, method, or incentive."],"check":{"q":"Two PhDs disagree on a specialized issue you cannot technically referee. One publishes transparent forecasts with a good dated record; the other has a stronger title but no checkable history. Which Goldman-style evidence favors the first?","a":"Track record and independently assessable performance. Titles still matter as evidence of training, but when direct evaluation is unavailable a public record of successful, checkable judgments is powerful second-order evidence."}},"fa":{"line":"غیرمتخصص باید متخصصان را غیرمستقیم داوری کند — با کیفیتِ استدلال، توافقِ همتایان، نشانه‌های مستقلِ تخصص، انگیزه‌ها و کارنامه — نه با وانمودکردن به اینکه خودش تحلیلِ تخصصی را از نو انجام می‌دهد.","why":"<p>دانشِ مدرن تخصصی است. در بیشترِ مسائلِ فنی، تازه‌کار نمی‌تواند شاهدِ اصلی را مستقیماً ارزیابی کند مگر اینکه خودش متخصص شود. معرفت‌شناسیِ اجتماعی بنابراین به معیارهای مرتبهٔ دوم نیاز دارد تا هنگامِ اختلافِ متخصصان یا ناکافی‌بودنِ مدرک بدانیم به چه کسی اعتماد کنیم.</p>","origin":"کارِ آلوین گلدمن دربارهٔ تخصص چارچوبِ مهمی برای ارزیابیِ متخصص توسط تازه‌کار می‌دهد. برنامهٔ شما پنج معیارِ عملی را برجسته می‌کند: کیفیتِ استدلالِ قابل‌دسترسی، توافقِ دیگر متخصصان، شاهدِ مستقلِ تخصص، منافع و سوگیری‌ها، و کارنامه.","obj":[["تازه‌کار اغلب بدون دانشِ رشته نمی‌تواند کیفیتِ استدلال را بسنجد؛ پس معیارها دوری‌اند.","معیارها عمداً افزونه‌اند. وقتی ارزیابیِ مستقیم ضعیف است، تازه‌کار می‌تواند بیشتر به شناساییِ همتایان، دستاوردِ قابل‌راستی‌آزمایی، کارنامهٔ پیش‌بینی و ساختارِ تعارضِ منافع تکیه کند. هیچ نمایندهٔ واحدی کافی نیست."],["اجماع می‌تواند محصولِ آموزشِ مشترک، انگیزه یا یک منبعِ واحد باشد؛ پس توافقِ متخصصان ممکن است استقلالِ جعلی باشد.","درست است. توافق فقط پس از ردیابیِ وابستگی ارزشِ شاهدی دارد. صد متخصص که همان داده یا خانوادهٔ مدل را تکرار می‌کنند صد تأییدِ مستقل نمی‌سازند. تبارِ منبع و تنوعِ روش مهم است."]],"confuse":[["تخصص و اقتدار","تخصص شایستگی یا عملکردِ قابل‌اعتماد در یک حوزه است. اقتدار می‌تواند قدرتِ نهادی برای تصمیم باشد. مقامِ خارج از حوزه وزنِ معرفتیِ کمی دارد."],["مدرک و کارنامه","مدرک شاهدِ پیشینیِ آموزش است؛ کارنامه شاهدِ پیامدی است. هر یک می‌تواند مستقل از دیگری شکست بخورد و هیچ‌کدام مهرِ جادویی نیست."]],"mistakes":["داوریِ متخصص عمدتاً با روانیِ سخن یا اعتمادبه‌نفس.","شمردنِ توافق بدون بررسیِ اینکه متخصصان یک منبع، روش یا انگیزهٔ بالادستیِ مشترک دارند یا نه."],"check":{"q":"دو دارندهٔ دکترا در موضوعی تخصصی اختلاف دارند و شما توانِ داوریِ فنی ندارید. یکی پیش‌بینی‌های شفاف با کارنامهٔ تاریخ‌دار دارد؛ دیگری عنوانِ قوی‌تر اما سابقهٔ قابل‌بررسی ندارد. کدام شاهدِ گلدمنی به نفع اولی است؟","a":"کارنامه و عملکردِ مستقلِ قابل‌سنجش. عنوان هنوز شاهدی از آموزش است، اما وقتی ارزیابیِ مستقیم ممکن نیست سابقهٔ عمومیِ داوری‌های موفق و قابل‌بررسی شاهدِ مرتبهٔ دومِ نیرومندی است."}}},"disag":{"en":{"line":"Peer disagreement asks how much you should reduce confidence when an epistemic equal, with access to the same evidence, reaches the opposite conclusion.","why":"<p>Disagreement can itself be evidence that your reasoning went wrong. But if you always defer, rational inquiry becomes unstable; if you never move, the existence of an equally competent dissenter has no epistemic effect. The debate asks how to update on another mind as evidence.</p>","origin":"Contemporary debate includes conciliationist positions associated with Adam Elga and David Christensen and more steadfast views associated with Thomas Kelly and others. The idealized setup—equal competence and same evidence—is useful precisely because real disagreements often fail those assumptions.","obj":[["Conciliationism is self-undermining: if an epistemic peer disagrees with conciliationism, should the conciliationist reduce confidence in conciliationism?","This is a real higher-order problem. Refined views distinguish disagreement over first-order evidence from disagreement over the correct policy for handling disagreement, or permit some steadfastness when one has independent reason to think the peer relation fails."],["Equal intelligence does not imply equal reliability on this exact question; one party may have domain-specific insight or a better track record.","Agreed. Before applying the idealized result, test the peer assumptions. The practical move is often to decompose the disagreement into evidence access, method, incentives, and calibration rather than merely averaging opinions."]],"confuse":[["Peer disagreement and expert disagreement","Peer disagreement assumes roughly equal epistemic standing. When one party is a novice, the problem becomes expert deference rather than symmetric updating."],["Conciliation and compromise","Reducing confidence does not necessarily mean splitting the numerical difference. The amount should depend on independence, reliability, and how much the disagreement itself is new evidence."]],"mistakes":["Calling someone a peer based on credentials alone without comparing domain expertise and track record.","Treating disagreement as independent evidence when both parties’ conclusions arise from the same mistaken source."],"check":{"q":"You and a colleague with a historically similar forecast record independently analyze the same evidence and reach 80% versus 20%. What should happen before either says “I’m just more confident”?","a":"Treat the disagreement as higher-order evidence and investigate whether the peer and independence assumptions hold. If they do, both should normally move toward less extreme credences; how far is the substantive conciliation debate."}},"fa":{"line":"اختلافِ همتا می‌پرسد وقتی همتای معرفتی با دسترسی به همان شواهد به نتیجهٔ مخالف می‌رسد، چقدر باید اطمینانِ خود را کاهش دهید.","why":"<p>خودِ اختلاف می‌تواند شاهدی باشد که استدلالِ شما خطا کرده است. اما اگر همیشه تسلیم شوید پژوهش ناپایدار می‌شود؛ اگر هرگز حرکت نکنید وجودِ مخالفِ هم‌شایسته هیچ اثرِ معرفتی ندارد. نزاع می‌پرسد چگونه «ذهنِ دیگری» را به‌عنوان شاهد وارد کنیم.</p>","origin":"بحثِ معاصر شامل آشتی‌گرایی با نام‌هایی مانند آدام الگـا و دیوید کریستنسن و مواضعِ پایدارتر مانند توماس کلی است. صورتِ آرمانی — شایستگیِ برابر و شاهدِ یکسان — دقیقاً چون اختلاف‌های واقعی اغلب این فرض‌ها را ندارند ابزارِ مفیدی است.","obj":[["آشتی‌گرایی خودتضعیف‌گر است: اگر همتایی با خودِ آشتی‌گرایی مخالف باشد، آیا آشتی‌گرا باید نسبت به آشتی‌گرایی هم کم‌اطمینان شود؟","این مسئلهٔ مرتبهٔ دوم واقعی است. نسخه‌های دقیق‌تر اختلاف بر سرِ شاهدِ مرتبهٔ اول را از اختلاف بر سرِ سیاستِ برخورد با اختلاف جدا می‌کنند، یا وقتی دلیلِ مستقلی برای شکستِ رابطهٔ همتایی داریم مقداری پایداری را مجاز می‌دانند."],["هوشِ برابر یعنی اعتمادپذیریِ برابر در همین سؤال؟ شاید یکی بینشِ حوزه‌ای یا کارنامهٔ بهتری داشته باشد.","درست است. پیش از اعمالِ نتیجهٔ آرمانی، فرضِ همتایی را آزمون کنید. حرکتِ عملی اغلب شکستنِ اختلاف به دسترسیِ شاهد، روش، انگیزه و کالیبراسیون است، نه صرفاً میانگین‌گیریِ نظرها."]],"confuse":[["اختلافِ همتا و اختلافِ متخصص","اختلافِ همتا شأنِ معرفتیِ تقریباً برابر را فرض می‌کند. وقتی یکی تازه‌کار است مسئله به اعتماد به متخصص تبدیل می‌شود، نه به‌روزرسانیِ متقارن."],["آشتی و مصالحهٔ عددی","کاهشِ اطمینان لزوماً نصف‌کردنِ فاصله نیست. مقدارِ حرکت به استقلال، اعتمادپذیری و میزانِ تازه‌بودنِ خودِ اختلاف به‌عنوان شاهد وابسته است."]],"mistakes":["همتا نامیدنِ فرد فقط با مدرکِ مشابه بدون مقایسهٔ تخصصِ دقیق و کارنامه.","شاهدِ مستقل شمردنِ اختلاف وقتی هر دو نتیجه از یک منبعِ اشتباه آمده‌اند."],"check":{"q":"شما و همکاری با کارنامهٔ پیش‌بینیِ مشابه، مستقلاً همان شاهد را تحلیل و به ۸۰٪ و ۲۰٪ می‌رسید. پیش از اینکه یکی بگوید «من فقط مطمئن‌ترم» چه باید رخ دهد؟","a":"اختلاف را شاهدِ مرتبهٔ دوم بدانید و بررسی کنید فرض‌های همتایی و استقلال برقرارند یا نه. اگر برقرار باشند هر دو معمولاً باید از درجاتِ افراطی عقب بیایند؛ میزانِ حرکت موضوعِ اصلیِ نزاعِ آشتی‌گرایی است."}}},"aumann":{"en":{"line":"Aumann’s agreement theorem shows that ideal Bayesian agents with common priors cannot “agree to disagree” once their posterior beliefs are common knowledge.","why":"<p>Persistent disagreement feels normal, but the theorem reveals how much hidden asymmetry it requires. If two perfectly rational Bayesian agents begin from the same prior and each knows the other’s posterior, and knows that the other knows, and so on, their posteriors must coincide. Real disagreement therefore diagnoses failure of at least one idealizing condition.</p>","origin":"Robert Aumann proved the theorem in 1976. It is a result in interactive epistemology, relying on common priors, Bayesian conditioning, and common knowledge. Its practical importance is not that humans satisfy the theorem but that the theorem provides a checklist for why they do not.","obj":[["The common-prior assumption is unrealistic and may hide the entire disagreement.","Yes. Different priors are one obvious route to persistent disagreement. The theorem then becomes diagnostic: ask whether the crux is prior beliefs, private evidence, non-Bayesian updating, or lack of common knowledge rather than treating disagreement as primitive."],["Humans cannot achieve infinite common knowledge of one another’s posteriors.","Correct. Finite communication and strategic behavior break the idealization. Again, the theorem is most useful as a benchmark showing which information or rationality friction must be present for disagreement to persist."]],"confuse":[["Common knowledge and shared information","A fact can be known by everyone without everyone knowing that everyone knows it, and so on. Common knowledge is a much stronger recursive condition."],["Aumann and averaging","The theorem does not say two people should average their probabilities. Under its assumptions, fully shared posteriors converge because information is recursively incorporated."]],"mistakes":["Using Aumann to call real disagreement irrational without checking the common-prior and common-knowledge assumptions.","Treating a stated posterior as transparent evidence when strategic incentives may make people misreport beliefs."],"check":{"q":"Two Bayesian analysts publicly know each other’s posterior but continue to disagree. What does the theorem tell you to look for rather than simply calling one irrational?","a":"A failed assumption: different priors, private information not fully revealed, lack of common knowledge, different models, non-Bayesian updating, or strategic reporting. Persistent disagreement identifies a wedge."}},"fa":{"line":"قضیهٔ توافقِ اومن نشان می‌دهد عاملانِ بیزیِ آرمانی با پیشینِ مشترک، وقتی باورهای پسینشان «دانشِ مشترک» شود، نمی‌توانند بر اختلاف توافق کنند.","why":"<p>اختلافِ پایدار عادی به نظر می‌رسد، اما قضیه نشان می‌دهد چه مقدار عدم‌تقارنِ پنهان لازم دارد. اگر دو عاملِ کاملاً بیزی از یک پیشین شروع کنند و هر کدام پسینِ دیگری را بداند و بداند که دیگری می‌داند و الی آخر، پسین‌ها باید برابر شوند. پس اختلافِ واقعی نشانهٔ شکستِ دست‌کم یکی از شرایطِ آرمانی است.</p>","origin":"رابرت اومن قضیه را در ۱۹۷۶ اثبات کرد. نتیجه‌ای در معرفت‌شناسیِ تعاملی است و به پیشین‌های مشترک، شرطی‌سازیِ بیزی و دانشِ مشترک تکیه دارد. اهمیتِ عملی‌اش این نیست که انسان‌ها شرایط را دارند، بلکه اینکه قضیه چک‌لیستی برای فهمِ علتِ نداشتنشان می‌دهد.","obj":[["فرضِ پیشینِ مشترک غیرواقعی است و شاید تمامِ اختلاف را در خود پنهان کند.","بله. پیشین‌های متفاوت یکی از مسیرهای روشنِ اختلافِ پایدارند. آنگاه قضیه ابزارِ تشخیص می‌شود: بپرسید گره در پیشین، شاهدِ خصوصی، به‌روزرسانیِ غیربیزی یا نبودِ دانشِ مشترک است، نه اینکه اختلاف را واقعیتی اولیه بدانید."],["انسان‌ها نمی‌توانند دانشِ مشترکِ بازگشتی و نامتناهی از پسینِ هم بسازند.","درست است. ارتباطِ محدود و رفتارِ راهبردی آرمان‌سازی را می‌شکند. باز هم قضیه بیشتر به‌عنوان خطِ مبنا مفید است که نشان می‌دهد برای دوامِ اختلاف چه اصطکاکِ اطلاعاتی یا عقلانیتی باید حاضر باشد."]],"confuse":[["دانشِ مشترک و اطلاعاتِ مشترک","ممکن است همه واقعیتی را بدانند بی‌آنکه همه بدانند که همه می‌دانند و الی آخر. دانشِ مشترک شرطی بسیار قوی‌تر و بازگشتی است."],["اومن و میانگین‌گیری","قضیه نمی‌گوید دو نفر باید احتمال‌ها را میانگین بگیرند. تحتِ فرض‌ها، پسین‌های کاملاً به‌اشتراک‌گذاشته‌شده با ورودِ بازگشتیِ اطلاعات همگرا می‌شوند."]],"mistakes":["استفاده از اومن برای غیرعقلانی نامیدنِ اختلافِ واقعی بدون بررسیِ پیشینِ مشترک و دانشِ مشترک.","شفاف دانستنِ پسینِ اعلام‌شده در حالی که انگیزهٔ راهبردی می‌تواند مردم را به گزارشِ نادرستِ باور وادارد."],"check":{"q":"دو تحلیلگرِ بیزی پسینِ اعلامیِ هم را می‌دانند اما همچنان اختلاف دارند. قضیه به شما می‌گوید به‌جای اینکه یکی را فوراً غیرعقلانی بنامید دنبال چه بگردید؟","a":"فرضِ شکسته: پیشین‌های متفاوت، اطلاعاتِ خصوصیِ آشکارنشده، نبودِ دانشِ مشترک، مدل‌های متفاوت، به‌روزرسانیِ غیربیزی یا گزارشِ راهبردی. اختلافِ پایدار وجودِ یک گُوِ پنهان را تشخیص می‌دهد."}}},"cascade":{"en":{"line":"An information cascade occurs when people rationally follow earlier public choices instead of their own private signals, causing many visible decisions to rest on very little independent information.","why":"<p>Social agreement can look like overwhelming evidence while being generated by sequential copying. Once early choices become informative enough, later people may ignore their own weak private evidence. The group then produces strong consensus without proportionate evidential depth—and a small shock can reverse the cascade.</p>","origin":"The formal model is associated with Sushil Bikhchandani, David Hirshleifer, and Ivo Welch; related work by Cass Sunstein examines cascades in law and groups. The key insight is rational imitation: no individual needs to be foolish for collective information to become fragile.","obj":[["If individuals rationally use others’ behavior as information, why call the result a failure?","Because individually rational inference can destroy information aggregation. Once people stop acting on private signals, later observers cannot learn those signals from behavior. The social process becomes less informative even though each local decision was defensible."],["Real people communicate reasons, not just binary choices, so simple cascade models are too stylized.","Communication can weaken cascades if private evidence is disclosed, but reputational incentives, repeated citations, and visible endorsements can recreate the same dependence. The model isolates a mechanism that survives in richer environments."]],"confuse":[["Information cascade and groupthink","Cascades can arise from rational inference about others’ choices
