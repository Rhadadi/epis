<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#081821">
<title>Concept Map · Mastering Epistemology</title>
<meta name="description" content="An interactive, bilingual (English and Persian) map of 135 concepts in epistemology.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script>
(()=>{
  let preference="system";
  try{preference=localStorage.getItem("epistemology-theme")||"system";}catch(_){/* storage may be unavailable */}
  if(!["system","light","dark"].includes(preference))preference="system";
  const dark=preference==="dark"||(preference==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.documentElement.dataset.themePreference=preference;
})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#081821; --panel:#142B3D; --panel2:#1D3A4E; --rule:#62859A;
  --cyan:#9BD8E8; --paper:#F5F8FA; --dim:#AEBFCA; --brass:#F2B84B; --brick:#FF9187;
  --on-accent:#14202A; --grid:rgba(98,133,154,.14); --scrim:rgba(3,12,17,.72); --top-fade:rgba(8,24,33,0);
  --search-bg:rgba(8,24,33,.985); --accent-wash:rgba(242,184,75,.10);
  --accent-shadow:rgba(242,184,75,.22);
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --fa:'Vazirmatn',system-ui,sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F3EC; --panel:#FFFFFF; --panel2:#E9F0F3; --rule:#6B8594;
  --cyan:#0B6075; --paper:#15232C; --dim:#4A616D; --brass:#8A4F00; --brick:#9D3E35;
  --on-accent:#FFFAF0; --grid:rgba(74,97,109,.12); --scrim:rgba(21,35,44,.52); --top-fade:rgba(246,243,236,0);
  --search-bg:rgba(246,243,236,.985); --accent-wash:rgba(138,79,0,.08);
  --accent-shadow:rgba(138,79,0,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--paper);font-family:var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;transition:background-color .18s ease,color .18s ease}

button,input{font:inherit}
button:focus-visible,input:focus-visible,[role="button"]:focus-visible{
  outline:3px solid var(--brass);outline-offset:3px
}

#top{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(var(--bg) 70%,var(--top-fade));padding:10px 12px 18px}
.brow{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--brass)}
.icb{background:var(--panel);border:1px solid var(--rule);color:var(--cyan);font-family:var(--mono);
  font-size:11px;width:44px;height:44px;padding:0;cursor:pointer;letter-spacing:.06em}
.icb:active{background:var(--panel2)}
.icon{width:18px;height:18px;display:block;margin:auto;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#crumbs{display:flex;gap:4px;overflow-x:auto;margin-top:9px;padding-bottom:3px;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:4px 8px;
  border:1px solid var(--rule);background:var(--panel);color:var(--dim);cursor:pointer;white-space:nowrap}
body.fa .crumb{font-family:var(--fa);font-size:11px;letter-spacing:0}
.crumb.on{border-color:var(--brass);color:var(--brass)}
.crumb.sep{border:none;background:none;color:var(--rule);padding:4px 1px}

#view{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#view.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.node{position:absolute;width:172px;height:48px;display:flex;background:var(--panel);
  border:1px solid var(--rule);cursor:pointer}
.node .lab{flex:1;min-width:0;display:flex;align-items:center;padding:0 8px;font-family:var(--disp);
  font-size:14px;line-height:1.12;background:transparent;border:0;color:inherit;text-align:left;cursor:pointer}
body.fa .node .lab{font-family:var(--fa);font-size:14px;line-height:1.32;justify-content:flex-end;text-align:right}
.node .lab i{flex:1;min-width:0;font-style:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.branch-mark{flex:none;display:flex;align-items:center;margin-left:5px;color:var(--dim)}
.branch-mark .icon{width:14px;height:14px;margin:0;transition:transform .18s ease}
.node.open .branch-mark{color:var(--cyan)}
.node.open .branch-mark .icon{transform:rotate(90deg)}
body.fa .branch-mark{margin-left:0;margin-right:5px}
.node .info{flex:none;width:38px;border:0;border-left:1px solid var(--rule);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:12px;color:var(--cyan);background:transparent;cursor:pointer}
.node .info .icon{width:16px;height:16px}
.node .info:active{background:var(--panel2)}
.node.route{border-color:var(--cyan)}
.node.sel{border-color:var(--brass);background:var(--panel2);box-shadow:0 0 0 3px var(--accent-shadow)}
.node.sel .lab{color:var(--brass)}
.node.key{border-style:dashed;border-color:var(--brass)}
.node .full{position:absolute;left:-1px;bottom:-1px;width:5px;height:5px;background:var(--brass)}

#ctrl{position:fixed;right:12px;bottom:16px;z-index:25;display:flex;flex-direction:column;gap:6px}
#ctrl button{width:44px;height:44px;background:var(--panel);border:1px solid var(--rule);color:var(--cyan);
  font-family:var(--mono);font-size:12px;cursor:pointer}
#ctrl button:active{background:var(--panel2)}
#hint{position:fixed;left:12px;bottom:18px;z-index:20;font-family:var(--mono);font-size:9.5px;
  color:var(--dim);max-width:52vw;line-height:1.55;pointer-events:none;transition:opacity 1s}
body.fa #hint{font-family:var(--fa);font-size:10.5px;direction:rtl}

#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;background:var(--bg);
  border-top:1px solid var(--brass);transform:translateY(101%);
  transition:transform .26s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column}
#sheet.on{transform:none}
@media(min-width:820px){
  #sheet{left:auto;right:0;top:0;bottom:0;width:460px;max-height:none;border-top:none;
    border-left:1px solid var(--brass);transform:translateX(101%)}
  #sheet.on{transform:none}
}
.shead{padding:15px 18px 13px;border-bottom:1px solid var(--rule);flex:none;position:relative}
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--cyan);margin-bottom:8px;
  line-height:1.6;padding-right:156px}
.shead h2{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.15;margin:0;letter-spacing:-.012em;padding-right:156px}
.who{font-family:var(--mono);font-size:11px;color:var(--brass);margin-top:9px;line-height:1.55}
.hbtns{position:absolute;top:13px;right:16px;display:flex;gap:6px}
.hbtns button{background:none;border:1px solid var(--rule);color:var(--dim);
  font-family:var(--mono);font-size:11px;height:28px;padding:0 8px;cursor:pointer}
.sbody{overflow-y:auto;padding:2px 18px 30px;-webkit-overflow-scrolling:touch}

/* Farsi reading mode */
body.fa .shead h2{font-family:var(--fa);font-size:20px;line-height:1.5;direction:rtl;padding-right:0;padding-left:156px;text-align:right}
body.fa .kicker{direction:rtl;text-align:right;padding-right:0;padding-left:156px;font-family:var(--fa);letter-spacing:0}
body.fa .who{direction:rtl;text-align:right;font-family:var(--fa)}
body.fa .hbtns{right:auto;left:16px}
body.fa .sbody{direction:rtl;text-align:right}
body.fa .blk p{font-family:var(--fa);font-size:15px;line-height:2.0}
body.fa .blk .h{font-family:var(--fa);letter-spacing:0;font-size:11px}
body.fa .blk.obj,body.fa .blk.app{border-left:none;border-right:2px solid var(--brick);padding-left:0;padding-right:13px}
body.fa .blk.app{border-right-color:var(--brass)}
body.fa .chip{font-family:var(--fa);font-size:11.5px;letter-spacing:0}
body.fa .learn a{font-family:var(--fa);font-size:12.5px}

.blk{margin-top:17px}
.blk .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--dim);margin-bottom:6px}
.blk p{margin:0 0 11px;font-size:15.5px;line-height:1.62;color:var(--paper)}
.blk p:last-child{margin-bottom:0}
.blk p b{color:var(--cyan);font-weight:600}
body.fa .blk p b{color:var(--cyan)}
.blk.obj{border-left:2px solid var(--brick);padding-left:13px}
.blk.obj .h{color:var(--brick)}
.blk.app{border-left:2px solid var(--brass);padding-left:13px}
.blk.app .h{color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:10.5px;padding:6px 9px;border:1px solid var(--rule);
  background:var(--panel);color:var(--cyan);cursor:pointer;line-height:1.35}
.chip:active{background:var(--panel2)}
.chip.kid{color:var(--paper);border-color:var(--dim)}
.learn{margin-top:20px;border-top:1px solid var(--rule);padding-top:15px}
.learn a{display:block;font-family:var(--mono);font-size:11.5px;color:var(--cyan);text-decoration:none;
  border:1px solid var(--rule);background:var(--panel);padding:10px 12px;margin-bottom:6px;line-height:1.45}
.learn a:active{background:var(--panel2)}
.learn a b{display:block;color:var(--brass);font-weight:500;margin-bottom:2px}

#find{position:fixed;inset:0;z-index:50;background:var(--search-bg);display:none;flex-direction:column;padding:14px}
#find.on{display:flex}
#q{width:100%;background:var(--panel);border:1px solid var(--brass);color:var(--paper);
  font-family:var(--disp);font-size:16px;padding:12px;outline:none}
body.fa #q{font-family:var(--fa);direction:rtl;text-align:right}
#res{margin-top:10px;overflow-y:auto;flex:1}
.hit{padding:11px 12px;border:1px solid var(--rule);background:var(--panel);margin-bottom:6px;cursor:pointer}
.hit b{font-family:var(--disp);font-size:14px;display:block;margin-bottom:3px;font-weight:500}
body.fa .hit{direction:rtl;text-align:right}
body.fa .hit b{font-family:var(--fa);font-size:14.5px}
.hit small{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.05em;line-height:1.5}
body.fa .hit small{font-family:var(--fa);letter-spacing:0}

a.brand{color:inherit;text-decoration:none}
a.brand:hover span,a.brand:focus-visible span{text-decoration:underline}
.icb.navl{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:auto;padding:0 12px;
  text-decoration:none;font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:0;color:var(--paper)}
.icb.navl .icon{margin:0;color:var(--cyan)}
.icb.navl:hover{border-color:var(--brass)}
@media(max-width:640px){.icb.navl b{display:none}.icb.navl{width:44px;padding:0}}
</style>
</head>
<body>

<div id="top">
  <div class="brow">
    <a class="brand" href="../" title="Home: Mastering Epistemology">EPISTEMOLOGY <span>/ map</span></a>
    <a class="icb navl" href="../guide/" title="Read the guide"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><b>Guide</b></a>
    <a class="icb navl" href="../guide/audio/" title="Listen to the audio edition"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><b>Listen</b></a>
    <button class="icb" id="searchbtn" type="button" aria-label="Search concepts" title="Search concepts"></button>
    <button class="icb" id="themebtn" type="button" aria-live="polite"></button>
    <div id="langseg" role="group" aria-label="Language">
      <button data-lang="en" type="button" aria-label="Read in English">EN</button>
      <button data-lang="fa" type="button" aria-label="مطالعه به فارسی">فا</button>
    </div>
  </div>
  <div id="crumbs"></div>
</div>

<div id="view"><div id="world"><svg id="wires"></svg></div></div>

<div id="ctrl" role="group" aria-label="Map controls">
  <button id="zin" type="button" aria-label="Zoom in" title="Zoom in"></button>
  <button id="zout" type="button" aria-label="Zoom out" title="Zoom out"></button>
  <button id="fit" type="button" aria-label="Fit map to screen" title="Fit map to screen"></button>
  <button id="rst" type="button" aria-label="Reset map" title="Reset map"></button>
</div>
<div id="hint" aria-live="polite"></div>


<div id="find" role="dialog" aria-modal="true" aria-label="Search concepts">
  <input id="q" autocomplete="off" aria-label="Search concepts">
  <div id="res"></div>
</div>

<script src="../assets/data/concepts.js"></script>
<script>
const {N,R,UI}=window.EPIS;
let LANG="en";
try{const s=localStorage.getItem("epistemology-lang");if(s==="fa"||s==="en")LANG=s;}catch(_){/* storage may be unavailable */}
const T=k=>UI[LANG][k];
const title=id=>(LANG==="fa"&&N[id].tf)?N[id].tf:N[id].t;

/* ---------- state ---------- */
const NW=172,NH=48,XG=88,YG=8;
const parent={},expanded=new Set(["root"]);
let sel="root",tx=0,ty=0,sc=1,pos={};
for(const id in N)(N[id].c||[]).forEach(k=>{if(N[k])parent[k]=id;});

const world=document.getElementById("world"),wires=document.getElementById("wires"),view=document.getElementById("view");
const makeIcon=content=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${content}</svg>`;
const ICONS={
  search:makeIcon('<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/>'),
  system:makeIcon('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/>'),
  light:makeIcon('<circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>'),
  dark:makeIcon('<path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/>'),
  plus:makeIcon('<path d="M12 5v14M5 12h14"/>'),
  minus:makeIcon('<path d="M5 12h14"/>'),
  fit:makeIcon('<path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>'),
  reset:makeIcon('<path d="M4.5 8.5V4m0 0H9M4.5 4A9 9 0 1 1 3 15"/>'),
  close:makeIcon('<path d="m6 6 12 12M18 6 6 18"/>'),
  info:makeIcon('<circle cx="12" cy="12" r="8"/><path d="M12 11v5"/><path d="M12 8h.01"/>'),
  branch:makeIcon('<path d="m9 6 6 6-6 6"/>')
};
document.getElementById("searchbtn").innerHTML=ICONS.search;
document.getElementById("zin").innerHTML=ICONS.plus;
document.getElementById("zout").innerHTML=ICONS.minus;
document.getElementById("fit").innerHTML=ICONS.fit;
document.getElementById("rst").innerHTML=ICONS.reset;
const themeButton=document.getElementById("themebtn");
const themeMedia=matchMedia("(prefers-color-scheme: dark)");
let THEME_PREF=document.documentElement.dataset.themePreference||"system";

function applyTheme(preference,persist=true){
  if(!["system","light","dark"].includes(preference))preference="system";
  THEME_PREF=preference;
  const resolved=preference==="system"?(themeMedia.matches?"dark":"light"):preference;
  document.documentElement.dataset.theme=resolved;
  document.documentElement.dataset.themePreference=preference;
  document.querySelector('meta[name="theme-color"]').content=resolved==="dark"?"#081821":"#F6F3EC";
  const next=preference==="system"?"light":preference==="light"?"dark":"system";
  themeButton.innerHTML=ICONS[preference];
  themeButton.setAttribute("aria-label",`Theme: ${preference}. Activate for ${next} theme.`);
  themeButton.title=`Theme: ${preference} · next: ${next}`;
  if(persist){try{localStorage.setItem("epistemology-theme",preference);}catch(_){/* storage may be unavailable */}}
  if(Object.keys(pos).length)render();
}

themeButton.addEventListener("click",()=>{
  const choices=["system","light","dark"];
  applyTheme(choices[(choices.indexOf(THEME_PREF)+1)%choices.length]);
});
const followSystem=()=>{if(THEME_PREF==="system")applyTheme("system",false);};
if(themeMedia.addEventListener)themeMedia.addEventListener("change",followSystem);
else if(themeMedia.addListener)themeMedia.addListener(followSystem);
applyTheme(THEME_PREF,false);

function layout(){
  pos={};let cur=0;
  (function walk(id,d){
    const n=N[id],kids=(expanded.has(id)&&n.c)?n.c.filter(k=>N[k]):[];
    if(!kids.length){const y=cur++;pos[id]={d,y};return y;}
    const ys=kids.map(k=>walk(k,d+1));
    const y=(ys[0]+ys[ys.length-1])/2;pos[id]={d,y};return y;
  })("root",0);
}
const px=id=>({x:pos[id].d*(NW+XG),y:pos[id].y*(NH+YG)});
function routeOf(id){const r=[];let c=id;while(c){r.unshift(c);c=parent[c];}return r;}
function bounds(){let w=0,h=0;for(const id in pos){const p=px(id);w=Math.max(w,p.x+NW);h=Math.max(h,p.y+NH);}return{w,h};}
function collapse(id){expanded.delete(id);(N[id].c||[]).forEach(k=>{if(N[k])collapse(k);});}

function viewportBox(){
  const topEdge=Math.ceil(document.getElementById("top").getBoundingClientRect().bottom)+14;
  const side=innerWidth<640?14:28;
  const controlsReserve=innerWidth<640?48:64;
  const bottomReserve=innerWidth<640?72:28;
  const right=innerWidth-side-controlsReserve;
  const bottom=innerHeight-bottomReserve;
  return{
    left:side,
    top:topEdge,
    width:Math.max(120,right-side),
    height:Math.max(120,bottom-topEdge)
  };
}

function constrainToViewport(){
  const b=bounds(),v=viewportBox(),sw=b.w*sc,sh=b.h*sc;
  if(sw<=v.width)tx=v.left+(v.width-sw)/2;
  else tx=Math.min(v.left,Math.max(v.left+v.width-sw,tx));
  if(sh<=v.height)ty=v.top+(v.height-sh)/2;
  else ty=Math.min(v.top,Math.max(v.top+v.height-sh,ty));
}

const readableScaleFloor=()=>innerWidth<640?.72:.86;
function fitVisible(anim=true,minScale=.12){
  const b=bounds(),v=viewportBox();
  const maxScale=innerWidth>=1200?1.32:1.12;
  sc=Math.min(maxScale,Math.max(minScale,Math.min(v.width/Math.max(b.w,1),v.height/Math.max(b.h,1))));
  tx=v.left+(v.width-b.w*sc)/2;
  ty=v.top+(v.height-b.h*sc)/2;
  apply(anim);
}

function render(){
  layout();
  const route=new Set(routeOf(sel));
  const themeStyles=getComputedStyle(document.documentElement);
  const routeStroke=themeStyles.getPropertyValue("--brass").trim();
  const wireStroke=themeStyles.getPropertyValue("--rule").trim();
  world.querySelectorAll(".node").forEach(e=>e.remove());
  let ep="";
  for(const id in pos){
    const n=N[id],p=px(id);
    if(expanded.has(id)&&n.c)n.c.filter(k=>N[k]&&pos[k]).forEach(k=>{
      const q=px(k),x1=p.x+NW,y1=p.y+NH/2,x2=q.x,y2=q.y+NH/2,m=(x1+x2)/2;
      const on=route.has(id)&&route.has(k);
      ep+=`<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="${on?routeStroke:wireStroke}" stroke-width="${on?2:1.2}"/>`;
    });
    const kids=(n.c||[]).filter(k=>N[k]).length;
    const el=document.createElement("div");
    el.className="node"+(id===sel?" sel":route.has(id)?" route":"")+(expanded.has(id)?" open":"")+(id==="trilemma"?" key":"");
    el.style.left=p.x+"px";el.style.top=p.y+"px";
    el.innerHTML=`<button class="lab" type="button"><i></i>${kids?`<span class="branch-mark" aria-hidden="true">${ICONS.branch}</span>`:""}</button>`+
      `<button class="info" type="button">${ICONS.info}</button>`+
      (R[id]?`<div class="full"></div>`:"");
    const labelButton=el.querySelector(".lab"),infoButton=el.querySelector(".info");
    labelButton.querySelector("i").textContent=title(id);
    labelButton.setAttribute("aria-label",kids
      ? `${title(id)}. ${expanded.has(id)?"Collapse":"Expand"} ${kids} subtopics.`
      : `Open full entry for ${title(id)}`);
    labelButton.title=kids
      ? `${expanded.has(id)?"Collapse":"Expand"} ${kids} subtopics`
      : "Open full entry";
    if(kids)labelButton.setAttribute("aria-expanded",expanded.has(id)?"true":"false");
    infoButton.setAttribute("aria-label",`Open full entry for ${title(id)}`);
    labelButton.addEventListener("click",()=>{
      if(!kids){openSheet(id);return;}
      sel=id;
      expanded.has(id)?collapse(id):expanded.add(id);
      render();focus(id);
    });
    infoButton.addEventListener("click",()=>openSheet(id));
    world.appendChild(el);
  }
  const b=bounds();
  wires.setAttribute("width",b.w+60);wires.setAttribute("height",b.h+60);
  wires.innerHTML=ep;
  crumbs();
}

function crumbs(){
  const c=document.getElementById("crumbs"),r=routeOf(sel);c.innerHTML="";
  r.forEach((id,i)=>{
    if(i){const s=document.createElement("span");s.className="crumb sep";s.textContent="›";c.appendChild(s);}
    const d=document.createElement("button");
    d.type="button";
    d.className="crumb"+(i===r.length-1?" on":"");
    d.textContent=LANG==="fa"?title(id):title(id).toUpperCase();
    d.addEventListener("click",()=>{sel=id;render();focus(id);});
    c.appendChild(d);
  });
  c.scrollLeft=LANG==="fa"?0:99999;
}

function focus(id){
  if(!pos[id])return;
  const p=px(id),v=viewportBox();
  const workingX=innerWidth<640?.32:.38;
  tx=v.left+v.width*workingX-(p.x+NW/2)*sc;
  ty=v.top+v.height/2-(p.y+NH/2)*sc;
  constrainToViewport();
  apply(true);
}
function apply(anim){
  world.style.transition=anim?"transform .32s cubic-bezier(.2,.8,.3,1)":"none";
  world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
}

/* ---------- pan / zoom ---------- */
let drag=false,lx=0,ly=0,pd=0;
view.addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag=true;lx=e.clientX;ly=e.clientY;view.classList.add("drag");});
view.addEventListener("pointermove",e=>{if(!drag)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply(false);});
["pointerup","pointercancel","pointerleave"].forEach(t=>view.addEventListener(t,()=>{drag=false;view.classList.remove("drag");}));
view.addEventListener("touchmove",e=>{
  if(e.touches.length!==2)return;e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pd){sc=Math.min(1.7,Math.max(.25,sc*(d/pd)));apply(false);}pd=d;
},{passive:false});
view.addEventListener("touchend",()=>{pd=0;});
view.addEventListener("wheel",e=>{e.preventDefault();sc=Math.min(1.7,Math.max(.25,sc*(e.deltaY<0?1.1:.9)));apply(false);},{passive:false});

document.getElementById("zin").onclick=()=>{sc=Math.min(1.7,sc*1.22);apply(true);};
document.getElementById("zout").onclick=()=>{sc=Math.max(.25,sc/1.22);apply(true);};
document.getElementById("fit").onclick=()=>fitVisible(true);
document.getElementById("rst").onclick=()=>{expanded.clear();expanded.add("root");sel="root";render();fitVisible(true,readableScaleFloor());};

let resizeTimer=0;
addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>focus(sel),90);
});


/* ---------- full entries are pages ---------- */
function pageFor(id){return "../concepts/"+id+".html";}
function openSheet(id){
  try{history.replaceState(null,"","#"+id);}catch(_){/* file: URLs may refuse */}
  location.href=pageFor(id);
}
function reveal(id){let c=parent[id];while(c){expanded.add(c);c=parent[c];}sel=id;render();focus(id);
  try{history.replaceState(null,"","#"+id);}catch(_){/* ignore */}}

/* ---------- language: segmented control, no toggling ---------- */
function setLang(next){
  if(next!=="en"&&next!=="fa")return;
  LANG=next;
  try{localStorage.setItem("epistemology-lang",LANG);}catch(_){/* storage may be unavailable */}
  document.documentElement.lang=LANG;
  document.body.classList.toggle("fa",LANG==="fa");
  document.querySelectorAll("[data-lang]").forEach(b=>{
    const on=b.dataset.lang===LANG;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  document.getElementById("hint").innerHTML=T("hint").replace("for the full entry","to read the full entry");
  document.getElementById("q").placeholder=T("find");
  render();
  requestAnimationFrame(()=>fitVisible(false,readableScaleFloor()));
  const f=document.getElementById("find");
  if(f.classList.contains("on"))list(document.getElementById("q").value.toLowerCase());
}
document.querySelectorAll("[data-lang]").forEach(b=>
  b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* ---------- search ---------- */
const find=document.getElementById("find"),q=document.getElementById("q"),res=document.getElementById("res");
document.getElementById("searchbtn").onclick=()=>{find.classList.add("on");q.value="";list("");q.focus();};
find.addEventListener("click",e=>{if(e.target===find)find.classList.remove("on");});
q.addEventListener("input",()=>list(q.value.toLowerCase()));
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(find.classList.contains("on")){find.classList.remove("on");document.getElementById("searchbtn").focus();return;}
});
function hay(id){const n=N[id];return[n.t,n.tf,n.w,n.q,n.en,n.fa].filter(Boolean).join(" ").toLowerCase();}
function list(s){
  const hits=Object.keys(N).filter(id=>id!=="root"&&(!s||hay(id).includes(s))).slice(0,80);
  res.innerHTML=hits.length
    ? hits.map(id=>{const p=routeOf(id).slice(0,-1).map(x=>title(x)).join(" › ");
        return `<button type="button" class="hit" data-go="${id}"><b>${R[id]?"● ":""}${title(id)}</b><small>${LANG==="fa"?p:p.toUpperCase()}</small></button>`;}).join("")
    : `<div class="hit"><b>${T("none")}</b></div>`;
  res.querySelectorAll("[data-go]").forEach(h=>h.addEventListener("click",()=>{find.classList.remove("on");reveal(h.dataset.go);}));
}

setLang(LANG);
(function fromAddress(){
  const id=decodeURIComponent(location.hash.slice(1));
  if(id&&N[id]&&id!=="root")setTimeout(()=>reveal(id),60);
})();
addEventListener("hashchange",()=>{const id=decodeURIComponent(location.hash.slice(1));if(id&&N[id])reveal(id);});
setTimeout(()=>{document.getElementById("hint").style.opacity=".3";},7000);
</script>
