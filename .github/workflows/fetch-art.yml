name: Fetch artwork

# Downloads the public-domain header images listed in tools/site/art.json into
# assets/art/ and commits them. Runs when the list or the script changes.
on:
  push:
    paths:
      - tools/site/art.json
      - tools/site/fetch_art.py
      - .github/workflows/fetch-art.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/site/fetch_art.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fetch header artwork from Wikimedia Commons"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
